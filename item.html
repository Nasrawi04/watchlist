<body>
<!-- A title's full page (cards redesign): item.html?id=<entry>[&tab=info|ratings|review|comments]
     or item.html?t=movie:603 for a title that isn't in your library. Drawn by MSSViews.mountPage
     (js/title-view.js): the same pieces as the title's side panel, laid out for the width. -->
<main class="page-wrap tv-wrap">
  <div id="tvLoading" class="page-loading" aria-live="polite"><div class="spinner" aria-label="Loading"></div></div>
  <div id="tvRoot" class="tv-page"></div>
</main>

<script src="js/vendor/supabase-2.118.0.js"></script>
<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/msf-store.js"></script>

<script src="js/episode-ratings.js"></script>
<script src="js/title-view.js"></script>
<script src="js/list-popup.js"></script>
<script src="js/easter-egg.js"></script>
<script src="js/note-popup.js"></script>
<script>
initPageGuest(async () => {
  const q = new URLSearchParams(location.search);
  const id = q.get('id'), t = q.get('t'), tab = q.get('tab');
  const m = /^(movie|tv):(\d{1,9})$/.exec(t || '');
  const ok = await MSSViews.mountPage(document.getElementById('tvRoot'), {
    entryId: id && /^[\w-]{1,64}$/.test(id) ? id : null,
    item: !id && m ? { media_type: m[1], tmdb_id: Number(m[2]) } : null,
    tab: ['info', 'ratings', 'review', 'comments'].includes(tab) ? tab : null,
    edit: q.get('edit') === '1',
    note: q.get('note') === '1',
    rec: q.get('rec') === '1',        // opened from a recommendation: ⋯ has Not interested
    seed: /^(movie|tv):\d{1,10}$/.test(q.get('seed') || '') ? { k: q.get('seed'), title: (q.get('st') || 'that title').slice(0, 120) } : null,   // …and Less like <the title behind its reason>
  }).catch(err => { console.error(err); return false; });
  document.getElementById('tvLoading').remove();
  if (!ok) document.getElementById('tvRoot').innerHTML = mssEmpty({ art: 'search', title: 'This title isn’t available',
    text: 'It may have been deleted, or its owner only shares it with some people.', actions: [{ label: 'Go to your Library', icon: 'list', href: 'library.html', primary: true }] });
});
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(r => console.log('SW registered:', r.scope))
      .catch(e => console.warn('SW failed:', e));
  });
}
</script>
</body>
