<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="js/i18n.js"></script>
<title>MyScreenScore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
.td-wrap { max-width:none; }

.td-back-loading {
  display:inline-flex; align-items:center; gap:6px;
  font-size:13px; color:var(--text-3); text-decoration:none;
  margin-bottom:1.5rem; transition:color .15s;
}
.td-back-loading:hover { color:var(--olive-light); }

/* ── Hero (breaks out of page-wrap's side padding to run edge-to-edge) ── */
.td-hero {
  position:relative; min-height:clamp(480px, 78vw, 860px);
  display:flex; flex-direction:column; justify-content:center;
  margin-inline-start:calc(-1 * var(--page-px)); margin-inline-end:calc(-1 * var(--page-px));
  margin-top:calc(-1 * var(--page-pt)); padding-top:var(--page-pt);
  margin-bottom:2rem; background:var(--card); border-bottom:0.5px solid var(--border);
}
.td-back {
  position:absolute; top:var(--page-pt); inset-inline-start:calc(var(--page-px) + 1rem); z-index:1;
  display:inline-flex; align-items:center; gap:6px;
  font-size:13px; color:#EDEDED; text-decoration:none; opacity:.8;
  transition:opacity .15s;
}
.td-back:hover { opacity:1; }
.td-backdrop-clip { position:absolute; inset:0; overflow:hidden; z-index:0; border-radius:inherit; }
.td-backdrop {
  position:absolute; inset:0; background-size:cover; background-position:center top;
  filter:blur(2px) brightness(0.35); transform:scale(1.05);
}
.td-hero-inner {
  position:relative; z-index:2; display:flex; gap:clamp(0.85rem, 3vw, 2.5rem); padding:2.5rem calc(var(--page-px) + 1rem) 3rem;
  align-items:center; flex-wrap:nowrap; box-sizing:border-box;
}
.td-poster {
  width:clamp(96px, 24vw, 320px); height:clamp(144px, 36vw, 480px); flex-shrink:0; border-radius:var(--radius); overflow:hidden;
  background:var(--bg-3); box-shadow:0 10px 30px rgba(0,0,0,0.5);
  display:flex; align-items:center; justify-content:center;
}
.td-poster img { width:100%; height:100%; object-fit:cover; }
.td-hero-info { flex:1; min-width:0; color:#EDEDED; }
.td-eyebrow {
  font-size:clamp(10px, 1.6vw, 13px); letter-spacing:2.5px; text-transform:uppercase; color:#8FD177;
  margin-bottom:.75rem; display:flex; align-items:center; gap:12px; flex-wrap:wrap;
}
.td-certification {
  font-size:clamp(9.5px, 1.4vw, 12px); letter-spacing:.5px; font-weight:700;
  padding:clamp(2px, 0.3vw, 3px) clamp(6px, 1vw, 9px); border-radius:4px;
  background:rgba(255,255,255,0.12); border:0.5px solid rgba(255,255,255,0.25); color:#fff;
  white-space:nowrap;
}
.td-title { font-family:var(--serif); font-size:clamp(26px, 5.5vw, 52px); font-weight:500; margin-bottom:.75rem; line-height:1.1; }
.td-tagline { font-style:italic; opacity:.65; font-size:clamp(12.5px, 2vw, 17px); margin-bottom:1.25rem; }
.td-meta-row { display:flex; gap:16px; flex-wrap:wrap; align-items:center; margin-bottom:1.25rem; font-size:clamp(11.5px, 1.8vw, 15px); opacity:.85; }
.td-meta-row span { display:flex; align-items:center; gap:5px; }
.td-genres { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:0.85rem; }
.td-genre-chip {
  font-size:clamp(10px, 1.5vw, 13px); padding:5px 14px; border-radius:20px;
  background:rgba(126,184,108,0.12); border:0.5px solid rgba(126,184,108,0.35); color:#B8E0A8;
}
.td-director-row {
  display:inline-flex; align-items:center; gap:6px; font-size:13.5px; color:#fff;
  margin-bottom:1.25rem; padding:7px 16px; border-radius:20px;
  background:rgba(0,0,0,0.55); backdrop-filter:blur(6px); border:0.5px solid rgba(255,255,255,0.12);
}
.td-director-label { text-transform:uppercase; font-size:11px; letter-spacing:.8px; color:var(--olive-light); font-weight:700; }
.td-director-link { color:#fff; font-weight:600; text-decoration:none; transition:color .15s; }
.td-director-link:hover { color:var(--olive-light); text-decoration:underline; }
.td-ratings-row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
.td-rating-badge {
  display:inline-flex; align-items:center; gap:10px;
  background:rgba(0,0,0,0.35); border:0.5px solid rgba(255,255,255,0.15);
  border-radius:var(--radius); padding:11px 18px;
}
.td-rating-num { font-family:var(--bebas); font-weight:400; font-size:clamp(19px, 3.2vw, 29px); color:#F5C94B; }
.td-rating-num.td-rating-mss { color:#8FD177; }
.td-rating-label { font-size:clamp(9px, 1.3vw, 12px); opacity:.65; letter-spacing:.5px; text-transform:uppercase; }
.td-trailer-link {
  display:inline-flex; align-items:center; gap:7px; margin-inline-start:14px;
  font-size:clamp(11.5px, 1.8vw, 15px); color:#EDEDED; text-decoration:none; opacity:.85;
  border:0.5px solid rgba(255,255,255,0.25); border-radius:20px; padding:9px 18px;
  transition:opacity .15s;
}
.td-trailer-link:hover { opacity:1; }
.td-trailer-mobile { display:none; }

.td-hero-actions { margin-top:0.75rem; }
.td-add-row { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-start; justify-content:flex-start; }
.td-dd { position:relative; flex:0 1 190px; min-width:150px; }
.td-dd-trigger {
  width:100%; height:clamp(38px, 6vw, 48px); box-sizing:border-box; display:flex; align-items:center; justify-content:space-between;
  padding:0 16px; border-radius:var(--radius-sm); cursor:pointer;
  background:rgba(255,255,255,0.1); border:0.5px solid rgba(255,255,255,0.28); color:#EDEDED;
  font-size:clamp(12.5px, 1.8vw, 15px); font-family:var(--sans); transition:border-color .15s, background-color .15s;
}
.td-dd-trigger:hover { background:rgba(255,255,255,0.16); border-color:rgba(255,255,255,0.4); }
.td-dd-placeholder .td-dd-trigger { color:rgba(237,237,237,0.55); }
.td-dd.open .td-dd-trigger {
  background:rgba(255,255,255,0.16); border-color:var(--olive-light);
  border-end-start-radius:0; border-end-end-radius:0;
}
.td-dd-chevron { transition:transform .15s, color .15s; flex-shrink:0; margin-inline-start:8px; color:#EDEDED; opacity:.7; }
.td-dd.open .td-dd-chevron { transform:rotate(180deg); opacity:1; }
.td-dd-menu {
  display:none; position:absolute; top:100%; inset-inline-start:0; inset-inline-end:0; z-index:20;
  background:var(--bg-3); box-shadow:var(--shadow-lg);
  border:0.5px solid var(--olive-light); border-top:none;
  border-radius:0 0 var(--radius-sm) var(--radius-sm);
  overflow-y:auto;overscroll-behavior-y:contain; max-height:240px;
}
.td-dd.open .td-dd-menu { display:block; }
.td-dd-opt { padding:12px 16px; font-size:clamp(12.5px, 1.8vw, 15px); color:var(--text); cursor:pointer; transition:background-color .15s; }
.td-dd-opt:hover { background:var(--bg-2); }
.td-dd-opt.active { background:var(--olive-faint); color:var(--olive-light); }
.td-add-row button.btn-save { height:clamp(38px, 6vw, 48px); font-size:clamp(12.5px, 1.8vw, 15px); box-sizing:border-box; padding:0 24px; flex:0 0 auto; white-space:nowrap; }
.td-in-library {
  display:flex; align-items:center; gap:12px; font-size:clamp(12.5px, 1.8vw, 15px); color:#EDEDED;
  background:rgba(0,0,0,0.35); border:0.5px solid rgba(255,255,255,0.15);
  border-radius:var(--radius); padding:12px 20px; flex-wrap:wrap;
}

/* ── Sections ── */
.td-section-title {
  font-size:clamp(10px, 1.6vw, 13px); letter-spacing:2.5px; text-transform:uppercase; color:var(--olive-light);
  margin:3rem 0 1.25rem; display:flex; align-items:center; gap:12px;
}
.td-section-title::after { content:''; flex:1; height:0.5px; background:var(--border); }
.td-overview { font-size:clamp(13.5px, 2vw, 17px); line-height:1.75; color:var(--text-2); }

/* ── Community Notes ── */
.td-notes-controls { display:flex; gap:8px; margin-bottom:1.25rem; margin-top:-0.5rem; }
.td-notes-sort-btn {
  padding:6px 14px; border-radius:20px; font-size:12.5px; font-weight:500;
  background:var(--bg-3); border:0.5px solid var(--border); color:var(--text-3);
  cursor:pointer; transition:all .15s;
}
.td-notes-sort-btn:hover { border-color:var(--border-olive); color:var(--text); }
.td-notes-sort-btn.active { background:var(--olive-faint); border-color:var(--border-olive); color:var(--olive-light); }
.td-notes-loading, .td-notes-empty { padding:2rem 0; text-align:center; color:var(--text-3); font-size:13.5px; }
#tdNotesList {
  max-height:560px; overflow-y:auto; display:flex; flex-direction:column; gap:12px;
  padding-inline-end:6px; scrollbar-width:thin; scrollbar-color:var(--border-olive) var(--bg-3);
}
#tdNotesList::-webkit-scrollbar { width:6px; }
#tdNotesList::-webkit-scrollbar-track { background:var(--bg-3); border-radius:3px; }
#tdNotesList::-webkit-scrollbar-thumb { background:var(--border-olive); border-radius:3px; }
#tdNotesList::-webkit-scrollbar-thumb:hover { background:var(--olive-light); }
.td-note-card {
  display:flex; gap:14px; padding:1.1rem 1.25rem;
  background:var(--card); border:0.5px solid var(--border); border-radius:var(--radius-lg);
  transition:border-color .15s;
}
.td-note-card:hover { border-color:var(--border-olive); }
.td-note-avatar {
  width:38px; height:38px; border-radius:50%; flex-shrink:0; overflow:hidden;
  background:var(--olive-faint); color:var(--olive-light); font-family:var(--serif); font-size:16px;
  display:flex; align-items:center; justify-content:center;
}
.td-note-avatar img { width:100%; height:100%; object-fit:cover; }
.td-note-body { flex:1; min-width:0; }
.td-note-head { display:flex; align-items:center; gap:8px; margin-bottom:5px; flex-wrap:wrap; }
.td-note-username { font-size:13.5px; font-weight:600; color:var(--text); }
.td-note-date { font-size:11.5px; color:var(--text-3); }
.td-note-text { font-size:14px; line-height:1.6; color:var(--text-2); white-space:pre-line; margin-bottom:8px; }
.td-note-actions { display:flex; gap:14px; }
.td-note-react-btn {
  display:inline-flex; align-items:center; gap:6px; background:none; border:none; cursor:pointer;
  color:var(--text-3); font-size:12.5px; font-weight:500; padding:2px 0; transition:color .15s;
}
.td-note-react-btn:hover { color:var(--text); }
.td-note-react-btn.active-like { color:var(--olive-light); }
.td-note-react-btn.active-dislike { color:#c0685a; }
.td-note-react-btn svg { transition:transform .3s, fill .3s; }
.td-note-react-btn:hover svg { transform:scale(1.15) rotate(-8deg); }
.td-note-card { position:relative; }

/* ── Cast ── */
.td-cast-scroll { display:flex; flex-wrap:wrap; gap:20px 18px; }
.td-cast-card { flex-shrink:0; width:clamp(90px, 12vw, 140px); text-align:center; display:block; text-decoration:none; color:inherit; transition:opacity .15s; }
.td-cast-card:hover { opacity:.8; }
.td-cast-photo {
  width:clamp(90px, 12vw, 140px); height:clamp(90px, 12vw, 140px); border-radius:50%; overflow:hidden; background:var(--bg-3);
  margin-bottom:10px; display:flex; align-items:center; justify-content:center;
  border:0.5px solid var(--border); font-family:var(--serif); font-size:clamp(22px, 3vw, 34px); color:var(--olive-light);
}
.td-cast-photo img { width:100%; height:100%; object-fit:cover; }
.td-cast-name { font-size:clamp(12px, 1.8vw, 15px); font-weight:500; color:var(--text); line-height:1.3; }
.td-cast-char { font-size:clamp(10.5px, 1.5vw, 13px); color:var(--text-3); margin-top:3px; line-height:1.3; }
.td-cast-more-btn {
  display:block; margin:14px auto 0; padding:9px 20px;
  background:var(--olive); color:#fff; border:0.5px solid var(--olive);
  border-radius:var(--radius-sm); font-family:'Manrope',var(--sans); font-weight:500;
  font-size:13px; cursor:pointer; transition:background .15s;
}
.td-cast-more-btn:hover { background:var(--olive-light); border-color:var(--olive-light); }

/* ── Episode detail popup ── */
#epPopupOverlay {
  position:fixed; inset:0; z-index:900; background:var(--popup-backdrop);
  display:flex; align-items:center; justify-content:center; padding:24px; overflow-y:auto;
  opacity:0; pointer-events:none; transition:opacity 220ms var(--ease);
}
#epPopupOverlay.open { opacity:1; pointer-events:auto; }
@media(prefers-reduced-motion:reduce) { #epPopupOverlay { transition:none; } }
.ep-popup-card {
  background:var(--bg-3); border:0.5px solid var(--border); border-radius:var(--radius-lg);
  max-width:640px; width:100%; overflow:hidden; animation:slideUp .25s var(--ease);
  max-height:90vh; display:flex; flex-direction:column;
}
.ep-popup-still { width:100%; aspect-ratio:16/9; background:var(--bg-3); position:relative; flex-shrink:0; }
.ep-popup-still img { width:100%; height:100%; object-fit:cover; display:block; }
.ep-popup-close {
  position:absolute; top:14px; inset-inline-end:14px; width:34px; height:34px; border-radius:50%;
  background:rgba(0,0,0,0.6); backdrop-filter:blur(4px); color:#fff; border:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center; font-size:16px; transition:background .15s;
}
.ep-popup-close:hover { background:rgba(0,0,0,0.8); }
.ep-popup-num-badge {
  position:absolute; top:14px; inset-inline-start:14px; padding:4px 12px; border-radius:20px;
  font-size:12px; font-weight:600; letter-spacing:.3px;
  background:rgba(0,0,0,0.6); color:#fff; backdrop-filter:blur(4px);
}
.ep-popup-body { padding:clamp(1.25rem, 4vw, 2rem); overflow-y:auto; }
.ep-popup-title { font-family:var(--serif); font-size:clamp(22px, 4vw, 30px); font-weight:400; margin-bottom:.6rem; line-height:1.2; }
.ep-popup-meta-row { display:flex; flex-wrap:wrap; gap:8px 16px; font-size:13px; color:var(--text-3); margin-bottom:1.25rem; }
.ep-popup-meta-row span { display:inline-flex; align-items:center; gap:5px; }
.ep-popup-rating { font-family:var(--bebas); color:var(--olive-light); font-weight:400; font-size:16px; }
.ep-popup-overview { font-size:14.5px; color:var(--text-2); line-height:1.75; white-space:pre-line; }
.td-season-loading { padding:16px; font-size:12.5px; color:var(--text-3); text-align:center; }
#tdEpisodesList { margin-top:1rem; }

@media(max-width:640px) {
  .td-add-row { flex-direction:column; align-items:stretch; width:100%; }
  .td-dd, .td-add-row button { width:100%; flex:0 0 auto; }
  .td-cast-scroll { display:grid; grid-template-columns:repeat(4, 1fr); gap:14px 10px; }
  .td-cast-card { width:100%; }
  .td-cast-photo { width:100%; height:auto; aspect-ratio:1/1; }

  /* ── Hero redesign: stack poster on top, center everything, decluttered spacing ── */
  .td-hero { min-height:0; }
  .td-hero-inner {
    flex-direction:column; align-items:center; text-align:center;
    padding:1.5rem calc(var(--page-px) + 0.5rem) 2rem; gap:1.25rem;
  }
  .td-poster {
    width:clamp(130px, 46vw, 190px); height:auto; aspect-ratio:2/3;
    box-shadow:0 8px 24px rgba(0,0,0,0.5);
  }
  .td-hero-info { width:100%; }
  .td-eyebrow { justify-content:center; margin-bottom:.5rem; }
  .td-title { font-size:clamp(24px, 7vw, 32px); margin-bottom:.5rem; }
  .td-tagline { font-size:13px; margin-bottom:.85rem; }
  .td-meta-row { justify-content:center; margin-bottom:.85rem; gap:10px 14px; }
  .td-trailer-desktop { display:none; }
  .td-genres { justify-content:center; margin-bottom:.85rem; }
  .td-director-row { display:flex; width:fit-content; margin-inline-start:auto; margin-inline-end:auto; }
  .td-trailer-mobile { display:inline-flex; margin-inline-start:0; margin-bottom:1rem; }
  .td-ratings-row { justify-content:center; }
  .td-rating-badge { padding:8px 14px; }
  .td-hero-actions { width:100%; margin-top:1.1rem; }
}
/* Related rows (collection + recommendations) */
.td-related { margin-top:2.5rem; }
.td-related .grid-nav-wrap { margin-top:1rem; }
.td-section-head { display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.td-ep-graph-link { display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--olive-light); text-decoration:none; }
.td-ep-graph-link:hover { text-decoration:underline; text-underline-offset:3px; }
.td-ep-scores { position:absolute; top:8px; inset-inline-end:8px; display:flex; gap:4px; }
.td-ep-scores span { padding:2px 7px; border-radius:4px; font-family:var(--bebas); font-size:14px; letter-spacing:.4px; box-shadow:0 1px 4px rgba(0,0,0,.3); }
/* ── Fan Favorites — same tabs + row as Friends & This Title, with the page's
   own episode cards, season blocks and cast photos ── */
.td-fans-row { align-items:flex-start; }
.td-fans-row .td-episode-card, .td-fans-row .td-season-block { font:inherit; color:inherit; text-align:start; padding:0; scroll-snap-align:start; cursor:pointer; }
.td-fans-row .td-season-block { border-width:1.5px; }
.td-fans-row .td-episode-card { width:clamp(220px, 28vw, 280px); }
.td-fans-row :is(.td-episode-card, .td-season-block):disabled { cursor:default; opacity:1; }
.td-fans-row :is(.td-episode-card, .td-season-block):focus-visible { outline:2px solid var(--olive-light); outline-offset:2px; }
.td-fans-row .td-ep-still, .td-fans-row .td-season-block-poster { display:block; position:relative; overflow:hidden; }
.td-fans-row .td-ep-body, .td-fans-row .td-season-block-info { display:flex; flex-direction:column; gap:4px; }
.td-fans-row .td-season-block-name, .td-fans-row .td-ep-title { display:block; margin:0; }
.td-fan-num { top:auto; bottom:10px; inset-inline-start:10px; }
.td-fan-letter { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--serif); font-size:clamp(28px, 5vw, 40px); color:var(--olive-light); }
.td-fan-picks { font-family:var(--bebas); font-size:clamp(15px, 2vw, 17px); letter-spacing:.5px; color:var(--olive-light); line-height:1.1; }
.td-fans-row .td-fan-char { text-decoration:none; }
.td-fans-row div.td-fan-char { cursor:default; }
.td-fans-row .td-fan-char .td-season-block-name { white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
.td-fan-actor { display:block; font-size:clamp(11px, 1.5vw, 12px); color:var(--text-3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
@media(max-width:640px) { .td-fans-row .td-episode-card { width:min(76vw, 260px); } .td-fans-row .td-season-block { width:clamp(128px, 38vw, 160px); } }

/* ── Replies popup (someone's note) — shell: MSSDialog, header: .rf-* ── */
#replyPopupOverlay {
  position:fixed; inset:0; z-index:1150; background:var(--popup-backdrop);
  display:flex; align-items:center; justify-content:center; padding:16px;
  opacity:0; pointer-events:none; transition:opacity 220ms var(--ease);
}
#replyPopupOverlay.open { opacity:1; pointer-events:auto; }
#replyPopupCard {
  background:var(--bg-2); border:1.5px solid var(--olive-light); box-shadow:4px 4px 0 var(--olive);
  border-radius:var(--radius-lg); width:100%; max-width:560px; max-height:88dvh;
  display:flex; flex-direction:column; overflow:hidden;
}
.rp-head { flex-shrink:0; padding-bottom:.5rem; }
.rp-sub { font-size:12.5px; color:var(--text-3); padding:0 1.25rem .75rem; }
.rp-sub:empty { display:none; }
.rp-sorts { display:flex; gap:6px; padding:0 1.25rem; }
.rp-list { flex:1; min-height:0; overflow-y:auto; overscroll-behavior-y:contain; padding:0 1.25rem; }
.rp-item { display:flex; gap:12px; padding:14px 0; border-bottom:0.5px solid var(--border); }
.rp-main { flex:1; min-width:0; }
.rp-by { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
.rp-text { font-size:13.5px; line-height:1.6; color:var(--text-2); white-space:pre-line; margin-bottom:8px; word-break:break-word; }
.rp-reacts { display:flex; gap:14px; }
.rp-composer { flex-shrink:0; padding:1rem 1.25rem 1.25rem; border-top:0.5px solid var(--border); }
.rp-composer[hidden] { display:none; }
.rp-input { width:100%; min-height:60px; resize:vertical; box-sizing:border-box; margin-bottom:8px; }
.rp-post { width:100%; justify-content:center; }

/* ── TMDB detail fetchers (separate from nav.js's add-entry helpers —
   these pull credits + videos on top of the base detail payload) ── */
async function _tdFetchMovie(id) {
  try {
    const res = await tmdbFetch(`${TMDB_BASE}/movie/${id}?api_key=${TMDB_KEY}&language=en-US&append_to_response=credits,videos,release_dates,recommendations`);
    if (!res.ok) return null;
    return await res.json();
  } catch { return null; }
}
async function _tdFetchTV(id) {
  try {
    const res = await tmdbFetch(`${TMDB_BASE}/tv/${id}?api_key=${TMDB_KEY}&language=en-US&append_to_response=credits,videos,aggregate_credits,recommendations,content_ratings`);
    if (!res.ok) return null;
    return await res.json();
  } catch { return null; }
}
// TMDB seasons, cached (the Episodes row and Fan Favorites share them)
const _tdSeasonCache = {};
function _tdFetchSeason(tvId, seasonNum) {
  const k = tvId + ':' + seasonNum;
  return _tdSeasonCache[k] ||= tmdbFetch(`${TMDB_BASE}/tv/${tvId}/season/${seasonNum}?api_key=${TMDB_KEY}&language=en-US`)
    .then(r => r.ok ? r.json() : null).catch(() => null);
}
// Many seasons at once: one request per 20 (TMDB append_to_response)
async function _tdFetchSeasons(tvId, nums) {
  const missing = nums.filter(n => !_tdSeasonCache[tvId + ':' + n]);
  for (let i = 0; i < missing.length; i += 20) {
    const part = missing.slice(i, i + 20);
    const req = tmdbFetch(`${TMDB_BASE}/tv/${tvId}?api_key=${TMDB_KEY}&language=en-US&append_to_response=${part.map(n => 'season/' + n).join(',')}`)
      .then(r => r.ok ? r.json() : {}).catch(() => ({}));
    part.forEach(n => { _tdSeasonCache[tvId + ':' + n] = req.then(d => d['season/' + n] || null); });
  }
  return Promise.all(nums.map(n => _tdFetchSeason(tvId, n)));
}

async function loadTitle() {
  const detail = _tdType === 'movie' ? await _tdFetchMovie(_tdId) : await _tdFetchTV(_tdId);

    return;

    getTmdbAvgScore(Number(_tdId), _tdType, titleForMatch, yearForMatch),
    _tdUser ? getOwnEntryByTmdb(_tdUser.id, Number(_tdId), _tdType, titleForMatch) : Promise.resolve(null),
  ]);
  _tdOwnEntry = ownEntry;

  // Fire-and-forget — for the Recently Viewed section on the home page.
  // Never awaited, never blocks rendering; failures are logged and ignored.
  if (_tdUser) {
    recordRecentlyViewed(_tdUser.id, Number(_tdId), _tdType, titleForMatch, detail.poster_path ? TMDB_FULL + detail.poster_path : null);
  }

  document.getElementById('tdLoading').style.display = 'none';
  document.getElementById('tdBackLoading').style.display = 'none';
  const c = document.getElementById('tdContent');
  c.style.display = '';
  c.innerHTML = _tdBuildHTML(detail, mssScore, ownEntry);

  // Wire season blocks (TV only)
  document.querySelectorAll('.td-season-block').forEach(el => {

  // Auto-select the first season

/* ── Your friends and this title: Watched By (with their score) · Currently
   Watching (where they are) · Want to Watch. Accepted friends only; groups
   with nobody are left out, and the whole section hides when no friend has
   it. Tap a friend → their Ratings / Info (MSSViews, read-only). ── */
let _tdFriendEntries = {};
async function _tdLoadFriends(title) {
  if (!_tdUser) return;
  let rows = [], profiles = {};
  try {
    const friends = (await getFriendships(_tdUser.id)).filter(f => f.status === 'accepted');
    if (!friends.length) return;
    friends.forEach(f => { if (f.friendProfile) profiles[f.friendId] = f.friendProfile; });
    const ids = friends.map(f => f.friendId);
    const cols = 'id,user_id,title,year,cat,status,ratings,final_score,season,episode,watched,total_eps,total_seasons,completed_date,created_at,updated_at,poster_url,genres,notes,tmdb_id,tmdb_type,description';
    const like = String(title || '').replace(/[\\%_]/g, m => '\\' + m);
    const [linked, unlinked] = await Promise.all([
      sb.from('entries').select(cols).in('user_id', ids).eq('tmdb_id', Number(_tdId)).eq('tmdb_type', _tdType),
      like ? sb.from('entries').select(cols).in('user_id', ids).is('tmdb_id', null).ilike('title', like) : { data: [] },
    ]);
    const seen = new Set();
    rows = [...(linked.data || []), ...(unlinked.data || [])].filter(e => !seen.has(e.user_id) && seen.add(e.user_id));
  } catch (err) { console.error('Friends on this title:', err); return; }
  if (!rows.length) return;
  _tdFriendEntries = {};
  rows.forEach(e => { e._profile = profiles[e.user_id] || { id: e.user_id }; _tdFriendEntries[e.id] = e; });
  const by = (a, b) => (b || '').localeCompare(a || '');
  _tdFriendGroups = [
    { key: 'watched', label: 'Watched By', items: rows.filter(e => e.status === 'completed' || e.status === 'ongoing')
        .sort((a, b) => (liveScore(b) ?? -1) - (liveScore(a) ?? -1)) },
    { key: 'watching', label: 'Watching', items: rows.filter(e => ['watching', 'up_next', 'paused'].includes(e.status))
        .sort((a, b) => by(a.updated_at, b.updated_at)) },
    { key: 'want', label: 'Want to Watch', items: rows.filter(e => e.status === 'queue').sort((a, b) => by(a.created_at, b.created_at)) },
  ].filter(g => g.items.length);
  if (!_tdFriendGroups.length) return;
  const scores = rows.map(liveScore).filter(v => v != null);
  const avg = scores.length ? scores.reduce((a, b) => a + Number(b), 0) / scores.length : null;
  document.getElementById('tdFriends').innerHTML = `<section class="td-related td-friends" aria-labelledby="tdFriendsTitle">
      <div class="td-friends-head">
        <div>
          <div class="section-eyebrow">Your Friends</div>
          <div class="section-title" id="tdFriendsTitle">Friends &amp; This Title</div>
        </div>
        ${avg != null ? `<div class="td-friends-avg"><span class="td-friends-avg-num">★ ${avg.toFixed(2)}</span><span class="td-friends-avg-label">Friends’ average · ${scores.length} rating${scores.length === 1 ? '' : 's'}</span></div>` : ''}
      </div>
      <div class="pn-toggle td-friends-tabs" role="tablist" aria-label="Friends">${_tdFriendGroups.map((g, i) =>
        `<button type="button" role="tab" id="tdFriendsTab-${g.key}" class="pn-toggle-btn${i ? '' : ' active'}" aria-selected="${!i}" aria-controls="tdFriendsPanel" onclick="_tdFriendsTab('${g.key}')">${esc(g.label)}<span class="td-friends-tab-count">${g.items.length}</span></button>`).join('')}</div>
      <div class="td-friends-row" id="tdFriendsPanel" role="tabpanel" aria-labelledby="tdFriendsTab-${_tdFriendGroups[0].key}"></div>
    </section>`;
  _tdFriendsTab(_tdFriendGroups[0].key);
}
let _tdFriendGroups = [];

/* ── Fan Favorites: the most picked Favorite Episode / Season / Character
   across MyScreenScore (get_title_favorite_picks). Picks can be chosen from
   a list or typed freely, so each one is matched to TMDB first:
     Characters — the cast's character names; a pick counts for a character
       when it holds a name word only that character has ("Daenerys
       Stormborn of House Targaryen…" → Daenerys Targaryen) or their whole
       name. Shared words alone ("Stark") stay as typed.
     Seasons — "Season 3", "S3", "three", "Season 3: Alabasta" or a season name.
     Episodes — "S3E9 - …", "3x09", "season 3 episode 9", an episode name, or
       an absolute number ("Episode 1015") on long anime.
   Anything that doesn't match is grouped by its text. Shown once 2+ people
   picked the same thing; top 10 of each, with posters / stills / photos. ── */
const _FAN_STOP = new Set('the of and a an in on to my house first her his name queen king lord lady ser sir mr mrs ms dr de la le el von van del da di du jr sr aka'.split(' '));
const _FAN_NUMS = 'zero one two three four five six seven eight nine ten eleven twelve thirteen fourteen fifteen sixteen seventeen eighteen nineteen twenty'.split(' ');
const _fanNorm = t => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
  .replace(/[^\p{L}\p{N}]+/gu, ' ').replace(/\b[a-z]+\b/g, w => { const i = _FAN_NUMS.indexOf(w); return i > 0 ? String(i) : w; }).trim();
const _fanTokens = t => _fanNorm(t).split(' ').filter(w => w.length > 1 && !_FAN_STOP.has(w));
let _tdFanGroups = [];

// Cast → characters with their name words and how many characters share each word
function _fanCharacters(d) {
  const cast = _tdType === 'movie' ? (d.credits?.cast || []) : (d.aggregate_credits?.cast || d.credits?.cast || []);
  const chars = [];
  cast.forEach((p, order) => {
    const roles = p.roles ? p.roles.map(r => r.character) : [p.character];
    roles.forEach(r => String(r || '').split('/').forEach(raw => {
      const name = raw.replace(/\(.*?\)/g, '').trim();
      const toks = _fanTokens(name);
      if (toks.length && !/^(himself|herself|themselves|self|narrator|voice)$/i.test(name)) chars.push({ key: 'c' + p.id + ':' + toks.join(' '), name, toks, actor: p.name, actorId: p.id, photo: p.profile_path, order });
    }));
  });
  const df = {};
  chars.forEach(c => new Set(c.toks).forEach(t => { df[t] = (df[t] || 0) + 1; }));
  return { chars, df };
}
function _fanMatchCharacter(pick, C) {
  const P = new Set(_fanTokens(pick));
  let best = null, bestScore = 0, tie = false;
  C.chars.forEach(c => {
    const shared = c.toks.filter(t => P.has(t));
    if (!shared.length) return;
    const whole = shared.length === c.toks.length;
    if (!whole && !shared.some(t => C.df[t] === 1)) return;        // only shared words → not enough
    const score = shared.reduce((a, t) => a + 1 / C.df[t], 0) + (whole ? 1 : 0);
    if (score > bestScore + 1e-9) { best = c; bestScore = score; tie = false; }
    else if (Math.abs(score - bestScore) < 1e-9 && best && best.actorId !== c.actorId && best.name !== c.name) tie = true;
  });
  return best && !tie ? best : null;
}
const _fanRealSeasons = d => (d.seasons || []).filter(x => x.season_number > 0);
function _fanMatchSeason(pick, d) {
  const t = ' ' + _fanNorm(pick) + ' ', seasons = d.seasons || [];
  const m = t.match(/\b(?:season|series|s|part|book|temporada|saison|staffel)\s*(\d{1,3})\b/) || t.match(/^\s*(\d{1,3})\s*$/);
  if (m && seasons.some(x => x.season_number === +m[1])) return +m[1];
  const named = seasons.filter(x => x.name && !/^(season|specials)\b/i.test(x.name.trim()) || (x.name || '').includes(':'))
    .filter(x => { const n = _fanNorm(String(x.name).split(':').pop()); return n.length >= 4 && (t.includes(' ' + n + ' ') || (n.includes(t.trim()) && t.trim().length >= 4)); });
  return named.length === 1 ? named[0].season_number : null;
}
// Episode → [season, episode] from its numbers; null when only a name was typed
function _fanEpisodeNumbers(pick, d) {
  const t = _fanNorm(pick);
  let m = t.match(/\bs\s*(\d{1,3})\s*e\s*(\d{1,4})\b/) || t.match(/\b(\d{1,2})\s*x\s*(\d{1,4})\b/)
       || t.match(/\bseason\s*(\d{1,3})\D{0,12}?\b(?:episode|ep|e)\s*(\d{1,4})\b/);
  if (m) return [+m[1], +m[2]];
  m = t.match(/\b(?:episode|ep|e)\s*(\d{1,4})\D{0,12}?\bseason\s*(\d{1,3})\b/);
  if (m) return [+m[2], +m[1]];
  m = t.match(/^(?:episode|ep|e)?\s*(\d{1,4})$/);
  const real = _fanRealSeasons(d);
  if (m && real.length) {                                          // absolute number
    let n = +m[1];
    if (real.length === 1) return [real[0].season_number, n];
    if (n <= (real[0].episode_count || 0)) return null;            // "Episode 5" on a multi-season show: unclear
    for (const x of real) { if (n <= x.episode_count) return [x.season_number, n]; n -= x.episode_count; }
  }
  return null;
}

async function _tdLoadFans(d) {
  let rows = [];
  try {
    const { data, error } = await sb.rpc('get_title_favorite_picks', { p_tmdb_id: Number(_tdId), p_tmdb_type: _tdType });
    if (error) throw error;
    rows = data || [];
  } catch (err) { console.error('Fan favorites:', err); return; }
  if (rows.length < 2) return;
  const isTV = _tdType === 'tv';
  const groups = { episode: {}, season: {}, character: {} };
  const add = (kind, key, item, typed) => {
    const g = groups[kind][key] ||= { ...item, picks: 0, typed: {} };
    g.picks++; g.typed[typed] = (g.typed[typed] || 0) + 1;
  };
  const raw = (kind, pick) => add(kind, 'raw:' + (_fanNorm(pick) || pick.toLowerCase()), { raw: true }, pick.trim());

  const C = _fanCharacters(d);
  rows.filter(r => r.kind === 'character').forEach(r => {
    const c = _fanMatchCharacter(r.pick, C);
    c ? add('character', c.key, { name: c.name, actor: c.actor, actorId: c.actorId, photo: c.photo }, r.pick) : raw('character', r.pick);
  });
  if (isTV) {
    rows.filter(r => r.kind === 'season').forEach(r => {
      const n = _fanMatchSeason(r.pick, d);
      if (n == null) return raw('season', r.pick);
      const x = d.seasons.find(y => y.season_number === n);
      add('season', 's' + n, { season: n, name: mssSeasonLabel(n, x?.name), poster: x?.poster_path, sub: x?.episode_count ? `${x.episode_count} episodes` : '' }, r.pick);
    });
    const epRows = rows.filter(r => r.kind === 'episode');
    const numbered = epRows.map(r => ({ r, n: _fanEpisodeNumbers(r.pick, d) }));
    // Picks typed as a name only: look the name up in every season (one request per 20 seasons)
    let eps = null;
    if (numbered.some(x => !x.n)) {
      const all = await _tdFetchSeasons(_tdId, _fanRealSeasons(d).map(x => x.season_number));
      eps = all.flatMap(sx => (sx?.episodes || []).map(ep => ({ s: ep.season_number, e: ep.episode_number, norm: _fanNorm(ep.name) })));
    }
    numbered.forEach(x => {
      if (!x.n && eps) {
        const name = _fanNorm(String(x.r.pick).replace(/^.*?\b\d+\s*[x·.:-]?\s*\d+\s*[-–:·]\s*/i, ''));
        const hit = eps.filter(ep => ep.norm && (ep.norm === name || (name.length >= 5 && ep.norm.length >= 5 && (name.includes(ep.norm) || ep.norm.includes(name)))));
        const exact = hit.filter(ep => ep.norm === name);
        const one = exact.length === 1 ? exact[0] : hit.length === 1 ? hit[0] : null;
        if (one) x.n = [one.s, one.e];
      }
      x.n ? add('episode', `e${x.n[0]}:${x.n[1]}`, { season: x.n[0], episode: x.n[1] }, x.r.pick) : raw('episode', x.r.pick);
    });
  }
  const top = kind => Object.values(groups[kind]).filter(g => g.picks >= 2)
    .sort((a, b) => b.picks - a.picks || (a.raw ? 1 : 0) - (b.raw ? 1 : 0)).slice(0, 10)
    .map(g => g.raw ? { ...g, name: Object.entries(g.typed).sort((a, b) => b[1] - a[1])[0][0] } : g);
  const tabs = [['episode', 'Episodes'], ['season', 'Seasons'], ['character', 'Characters']]
    .map(([key, label]) => ({ key, label, items: top(key) })).filter(t => t.items.length);
  if (!tabs.length) return;
  // Stills + names for the episodes shown
  const epTab = tabs.find(t => t.key === 'episode');
  if (epTab) {
    const seasons = await _tdFetchSeasons(_tdId, [...new Set(epTab.items.filter(g => !g.raw).map(g => g.season))]);
    epTab.items.forEach(g => {
      if (g.raw) return;
      const ep = seasons.flatMap(sx => sx?.episodes || []).find(x => x.season_number === g.season && x.episode_number === g.episode);
      Object.assign(g, { name: ep?.name || `Episode ${g.episode}`, still: ep?.still_path, ep });
    });
  }
  _tdFanGroups = tabs;
  document.getElementById('tdFans').innerHTML = `<section class="td-related td-friends" aria-labelledby="tdFansTitle">
      <div class="td-friends-head"><div>
        <div class="section-eyebrow">On MyScreenScore</div>
        <div class="section-title" id="tdFansTitle">Fan Favorites</div>
      </div></div>
      <div class="pn-toggle td-friends-tabs" role="tablist" aria-label="Fan favorites">${tabs.map((t, i) =>
        `<button type="button" role="tab" id="tdFansTab-${t.key}" class="pn-toggle-btn${i ? '' : ' active'}" aria-selected="${!i}" aria-controls="tdFansPanel" onclick="_tdFansTab('${t.key}')">${esc(t.label)}<span class="td-friends-tab-count">${t.items.length}</span></button>`).join('')}</div>
      <div class="td-friends-row td-fans-row" id="tdFansPanel" role="tabpanel" aria-labelledby="tdFansTab-${tabs[0].key}"></div>
    </section>`;
  _tdFansTab(tabs[0].key);
}
function _tdFansTab(key) {
  const t = _tdFanGroups.find(x => x.key === key);
  if (!t) return;
  document.querySelectorAll('#tdFans .pn-toggle-btn').forEach(b => {
    const on = b.id === 'tdFansTab-' + key;
    b.classList.toggle('active', on); b.setAttribute('aria-selected', on);
  });
  const panel = document.getElementById('tdFansPanel');
  panel.setAttribute('aria-labelledby', 'tdFansTab-' + key);
  panel.innerHTML = t.items.map((g, i) => _tdFanCard(key, g, i + 1)).join('');
}
// Same cards as the rest of the page: episode card, season block, cast photo
function _tdFanCard(kind, g, rank) {
  const picks = `<span class="td-fan-picks">${g.picks} pick${g.picks === 1 ? '' : 's'}</span>`;
  const badge = `<span class="cg-rank-badge ${rank === 1 ? 'cg-rank-1' : rank === 2 ? 'cg-rank-2' : rank === 3 ? 'cg-rank-3' : 'cg-rank-other'}">${rank}</span>`;
  const letter = esc((g.name || '?').trim()[0]?.toUpperCase() || '?');
  if (kind === 'episode') {
    const open = g.raw ? '' : ` onclick="_tdFanOpenEpisode(${g.season}, ${g.episode})"`;
    return `<button type="button" class="td-episode-card td-fan-ep"${open}${g.raw ? ' disabled' : ''} aria-label="${esc(g.name)} — ${g.picks} picks">
        <span class="td-ep-still">${g.still ? `<img src="${TMDB_IMG.replace('w185', 'w500')}${g.still}" alt="" loading="lazy">` : `<span class="td-fan-letter">${letter}</span>`}${badge}
          ${g.raw ? '' : `<span class="td-ep-num-badge td-fan-num">S${g.season} · E${g.episode}</span>`}</span>
        <span class="td-ep-body"><span class="td-ep-title" translate="no">${esc(g.name)}</span>${picks}</span>
      </button>`;
  }
  if (kind === 'season') {
    const open = g.raw ? '' : ` onclick="_tdFanOpenSeason(${g.season})"`;
    return `<button type="button" class="td-season-block td-fan-season"${open}${g.raw ? ' disabled' : ''} aria-label="${esc(g.name)} — ${g.picks} picks">
        <span class="td-season-block-poster">${g.poster ? `<img src="${TMDB_IMG.replace('w185', 'w342')}${g.poster}" alt="" loading="lazy">` : `<span class="td-fan-letter">${letter}</span>`}${badge}</span>
        <span class="td-season-block-info"><span class="td-season-block-name" translate="no">${esc(g.name)}</span>${picks}</span>
      </button>`;
  }
  // Character: the same portrait card as the season blocks (a person photo, like the person page) + rank badge
  const inner = `<span class="td-season-block-poster">${g.photo ? `<img src="${TMDB_IMG.replace('w185', 'w342')}${g.photo}" alt="" loading="lazy">` : `<span class="td-fan-letter">${letter}</span>`}${badge}</span>
      <span class="td-season-block-info"><span class="td-season-block-name" translate="no">${esc(g.name)}</span>${g.actor ? `<span class="td-fan-actor">${esc(g.actor)}</span>` : ''}${picks}</span>`;
  return g.raw ? `<div class="td-season-block td-fan-char">${inner}</div>`
    : `<a class="td-season-block td-fan-char" href="person.html?id=${Number(g.actorId)}" aria-label="${esc(g.name)}, played by ${esc(g.actor)} — ${g.picks} picks">${inner}</a>`;

// Tap a season → the Episodes section opens on it
function _tdFanOpenSeason(n) {

function _tdFanOpenEpisode(sn, n) {

/* ── Related titles: the movie's collection ("Part of the Avengers
   Collection", in release order) and "If you like this…" (TMDB
   recommendations, else similar titles). Same cards as Discover; tapping
   one opens the info popup. ── */
function _tdRowHTML(id, eyebrow, title, items) {
  const L = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>';

      </div>

}
function _tdRelCardHTML(r) {
  const it = _discNormalize(r, r.media_type || _tdType);
  return MSSCard.poster({ attrs: _discClickAttr(it), title: it.title, year: it.year, poster: it.poster_url,
    type: it.media_type === 'movie' ? 'movie' : 'tv', score: _discFloorScore(it.score) });
}
async function _tdLoadRelated(d) {
  const withPoster = r => r && r.poster_path && String(r.id) !== String(_tdId);
  // 1) Collection (movies)
  const col = _tdType === 'movie' ? d.belongs_to_collection : null;
  if (col?.id) {
    try {
      const res = await tmdbFetch(`${TMDB_BASE}/collection/${col.id}?api_key=${TMDB_KEY}&language=en-US`);
      const data = res.ok ? await res.json() : null;
      const parts = (data?.parts || []).filter(withPoster).map(p => ({ ...p, media_type: 'movie' }))
        .sort((a, b) => (a.release_date || '9999').localeCompare(b.release_date || '9999'));
      if (parts.length) document.getElementById('tdCollection').innerHTML = _tdRowHTML('tdCollectionRow', 'Part of the collection', data.name || col.name, parts);
    } catch {}
  }
  // 2) Recommendations → similar as a fallback
  let recs = (d.recommendations?.results || []).filter(withPoster);
  if (!recs.length) {
    try {
      const res = await tmdbFetch(`${TMDB_BASE}/${_tdType}/${_tdId}/similar?api_key=${TMDB_KEY}&language=en-US`);
      recs = res.ok ? ((await res.json()).results || []).filter(withPoster) : [];
    } catch { recs = []; }
  }
  recs = recs.map(r => ({ ...r, media_type: r.media_type || _tdType })).slice(0, 18);
  if (recs.length) document.getElementById('tdRecs').innerHTML = _tdRowHTML('tdRecsRow', 'If you like this', 'You might also like', recs);
}

function _tdBuildHTML(d, mssScore, ownEntry) {
  const isMovie = _tdType === 'movie';
  const title    = isMovie ? d.title : d.name;
  if (title) document.title = `${title} — MyScreenScore`;
  const date     = isMovie ? d.release_date : d.first_air_date;
  const year     = (date || '').split('-')[0];
  const poster   = d.poster_path ? TMDB_FULL + d.poster_path : null;
  const backdrop = d.backdrop_path ? `https://image.tmdb.org/t/p/w1280${d.backdrop_path}` : poster;
  const genres   = (d.genres || []).map(g => g.name);
  const rating   = d.vote_average ? _discFloorScore(d.vote_average) : null;
  const voteCount = d.vote_count ? d.vote_count.toLocaleString() : null;

  const trailer = (d.videos?.results || []).find(v => v.site === 'YouTube' && v.type === 'Trailer')
               || (d.videos?.results || []).find(v => v.site === 'YouTube');

  let metaBits = [];
  if (isMovie) {
    if (d.runtime) metaBits.push(`${Math.floor(d.runtime/60)}h ${d.runtime%60}m`);
    if (d.status) metaBits.push(d.status);
  } else {
    if (d.number_of_seasons) metaBits.push(`${d.number_of_seasons} Season${d.number_of_seasons!==1?'s':''}`);
    if (d.number_of_episodes) metaBits.push(`${d.number_of_episodes} Episodes`);
    if (d.episode_run_time?.length) metaBits.push(`~${d.episode_run_time[0]}m / ep`);
    if (d.status) metaBits.push(d.status);
  }

  const castSource = isMovie ? (d.credits?.cast || []) : (d.aggregate_credits?.cast || d.credits?.cast || []);
  const cast = castSource;
  window._tdFullCast = cast;

  // Age/content rating (PG-13, R, TV-14, TV-MA, etc.) — movies expose
  // this via release_dates (per-country certifications, several release
  // types each), TV via content_ratings (one rating per country). Both
  // need the US entry specifically pulled out.
  let certification = null;
  if (isMovie) {
    const us = (d.release_dates?.results || []).find(r => r.iso_3166_1 === 'US');
    certification = us?.release_dates?.find(rd => rd.certification)?.certification || null;
  } else {
    const us = (d.content_ratings?.results || []).find(r => r.iso_3166_1 === 'US');
    certification = us?.rating || null;
  }

  // Movies: director(s) come from crew (job === 'Director'). TV shows:
  // TMDB exposes creator(s) directly on the show object already.
  const directors = isMovie
    ? (d.credits?.crew || []).filter(c => c.job === 'Director')
    : (d.created_by || []);
  const seenDirectorIds = new Set();
  const uniqueDirectors = directors.filter(p => {
    if (seenDirectorIds.has(p.id)) return false;
    seenDirectorIds.add(p.id);
    return true;
  });
  const directorLabel = isMovie ? 'Director' : 'Creator';
  const directorLabelPlural = isMovie ? 'Directors' : 'Creators';

  return `
    <div class="td-hero fade-up">
      ${backdrop ? `<div class="td-backdrop-clip"><div class="td-backdrop" style="background-image:url('${backdrop}')"></div></div>` : ''}
      <a class="td-back" href="discover.html" onclick="if(history.length>1){history.back();return false;}">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        Back
      </a>
      <div class="td-hero-inner">
        <div class="td-poster">${poster ? `<img src="${poster}" alt="">` : ''}</div>
        <div class="td-hero-info">
          <div class="td-eyebrow">${isMovie ? 'Movie' : 'TV Show'} ${year ? '· ' + year : ''}${certification ? `<span class="td-certification">${esc(certification)}</span>` : ''}</div>
          <div class="td-title" translate="no">${esc(title)}</div>
          ${d.tagline ? `<div class="td-tagline" translate="no">"${esc(d.tagline)}"</div>` : ''}
          <div class="td-meta-row">
            <div class="td-ratings-row">
              ${rating ? `<span class="td-rating-badge"><span class="td-rating-num">★ ${rating}</span><span class="td-rating-label">${voteCount ? voteCount + ' votes' : 'TMDB'}</span></span>` : ''}
              <span class="td-rating-badge"><span class="td-rating-num td-rating-mss">★ ${mssScore.avg != null ? _discFloorScore(mssScore.avg) : '—'}</span><span class="td-rating-label">MyScreenScore${mssScore.count ? ' · ' + mssScore.count + (mssScore.count===1?' rating':' ratings') : ' · No ratings yet'}</span></span>
            </div>
            ${metaBits.map(b => `<span>${esc(b)}</span>`).join('')}
            ${trailer ? `<a class="td-trailer-link td-trailer-desktop" href="https://www.youtube.com/watch?v=${trailer.key}" target="_blank" rel="noopener">${icon('play', 13)} Trailer</a>` : ''}
          </div>
          <div class="td-genres">${genres.map(g => `<span class="td-genre-chip">${esc(g)}</span>`).join('')}</div>
          ${uniqueDirectors.length ? `<div class="td-director-row"><span class="td-director-label">${uniqueDirectors.length > 1 ? directorLabelPlural : directorLabel}</span> ${uniqueDirectors.map(p => `<a class="td-director-link" href="person.html?id=${p.id}&mode=directing" translate="no">${esc(p.name)}</a>`).join(', ')}</div>` : ''}
          ${trailer ? `<a class="td-trailer-link td-trailer-mobile" href="https://www.youtube.com/watch?v=${trailer.key}" target="_blank" rel="noopener">${icon('play', 13)} Trailer</a>` : ''}
          <div class="td-hero-actions fade-up fade-up-1">
            ${_tdAddControlsHTML(ownEntry)}
          </div>
        </div>
      </div>
    </div>

    <div class="td-section-title">Overview</div>
    <div class="td-overview" translate="no">${esc(d.overview) || mssT('No description available.')}</div>

    ${cast.length ? `
    <div class="td-section-title">Cast</div>
    <div class="td-cast-scroll" id="tdCastScroll">
      ${cast.slice(0, 10).map(p => `
        <a class="td-cast-card" href="person.html?id=${p.id}">
          <div class="td-cast-photo">${p.profile_path ? `<img src="${TMDB_IMG}${p.profile_path}" loading="lazy">` : esc((p.name||'?')[0])}</div>
          <div class="td-cast-name" translate="no">${esc(p.name)}</div>
          <div class="td-cast-char">${esc(p.character || p.roles?.[0]?.character || '')}</div>
        </a>`).join('')}
    </div>
    ${cast.length > 10 ? `<button class="td-cast-more-btn" id="tdCastMoreBtn" data-expanded="0" onclick="_tdShowAllCast()">See More (${cast.length - 10} more)</button>` : ''}` : ''}

    ${!isMovie ? _tdSeasonsHTML(d) : ''}

    <div id="tdFriends"></div>
    <div id="tdFans"></div>
    <div id="tdCollection"></div>
    <div id="tdRecs"></div>

    <div class="td-section-title">Community Notes</div>
    <div class="td-notes-controls">
      <button class="td-notes-sort-btn active" data-sort="popular" onclick="_tdSetNotesSort('popular')">Most Popular</button>
      <button class="td-notes-sort-btn" data-sort="least_popular" onclick="_tdSetNotesSort('least_popular')">Least Popular</button>
      <button class="td-notes-sort-btn" data-sort="newest" onclick="_tdSetNotesSort('newest')">Newest</button>
    </div>
    <div id="tdNotesList"><div class="td-notes-loading">Loading notes…</div></div>
  `;
}

function _tdDDHTML(id, options, selected, placeholder) {
  const selOpt = options.find(o => o.value === selected);
  const usePlaceholder = !selOpt && placeholder;
  const label = selOpt ? selOpt.label : (usePlaceholder ? placeholder : options[0].label);
  const value = selOpt ? selOpt.value : (usePlaceholder ? '' : options[0].value);
  return `<div class="td-dd${usePlaceholder ? ' td-dd-placeholder' : ''}" id="${id}" data-value="${value}">
    <button type="button" class="td-dd-trigger" onclick="event.stopPropagation();_tdToggleDD('${id}')">
      <span class="td-dd-label">${esc(label)}</span>
      <svg class="td-dd-chevron" width="10" height="6" viewBox="0 0 10 6" fill="none"><path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="td-dd-menu">
      ${options.map(o => `<div class="td-dd-opt${o.value===value?' active':''}" data-value="${o.value}" onclick="event.stopPropagation();_tdSelectDD('${id}','${o.value}')">${esc(o.label)}</div>`).join('')}
    </div>
  </div>`;
}

function _tdToggleDD(id) {
  const target = document.getElementById(id);
  const wasOpen = target.classList.contains('open');
  document.querySelectorAll('.td-dd.open').forEach(el => el.classList.remove('open'));
  if (!wasOpen) target.classList.add('open');
}

function _tdSelectDD(id, value) {
  const el = document.getElementById(id);
  el.dataset.value = value;
  el.classList.remove('td-dd-placeholder');
  const opt = el.querySelector(`.td-dd-opt[data-value="${value}"]`);
  if (opt) el.querySelector('.td-dd-label').textContent = opt.textContent;
  el.querySelectorAll('.td-dd-opt').forEach(o => o.classList.toggle('active', o.dataset.value === value));
  el.classList.remove('open');
  _updateTdAddValidation();
}

function _updateTdAddValidation() {
  const cat = document.getElementById('tdCatDD')?.dataset.value;
  const status = document.getElementById('tdStatusDD')?.dataset.value;
  const complete = !!cat && !!status;
  const msg = document.getElementById('tdValidationMsg');
  const btn = document.getElementById('tdAddBtn');
  if (msg) msg.style.display = complete ? 'none' : '';
  if (btn) btn.disabled = !complete;
}

document.addEventListener('click', () => {
  document.querySelectorAll('.td-dd.open').forEach(el => el.classList.remove('open'));
});

    return `<a href="login.html" class="btn-add" style="text-decoration:none">${icon('logout',14)} Sign in to add</a>`;
  }

    const statusLabel = {
      queue:'On your Watchlist', up_next:'Up Next', watching:'Currently Watching', paused:'Taking a Break',
      completed:'Watched', ongoing:'To Be Continued'
    }[ownEntry.status] || ownEntry.status;
    return `<div class="td-in-library">
      ${icon('check', 16)} In your library — ${esc(statusLabel)}
      <button class="btn-save" onclick="goToDetail('${ownEntry.id}','title.html')">View &amp; Rate →</button>
    </div>`;
  }

  const isMovie = _tdType === 'movie';

    { value:'movies', label:'Movie' },
    { value:'anime', label:'Anime' },

  ] : [
    { value:'tv', label:'TV Show' },
    { value:'anime', label:'Anime' },
    { value:'cartoons', label:'Cartoon' },
  ];
  const statusOptions = [

    { value:'up_next', label:'Up Next' },
    { value:'watching', label:'Currently Watching' },

  </div>

}

async function _tdAddToLibrary() {
  if (!_tdUser) { window.location.href = 'login.html'; return; }

  const cat = document.getElementById('tdCatDD')?.dataset.value;
  if (!cat) { showToast('Please select a category.', 'err'); return; }
  const status = document.getElementById('tdStatusDD')?.dataset.value;
  if (!status) { showToast('Please select a status.', 'err'); return; }

  // Guard against rapid double-clicks/double-taps firing this twice before
  // the first request finishes — this was the actual cause of items getting
  // added to the watchlist multiple times (two concurrent requests can both
  // pass the "does this exist yet" check before either one commits).
  const btn = document.getElementById('tdAddBtn');
  if (btn && btn.disabled) return;
  const origBtnHTML = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.innerHTML = 'Adding…'; }

  const d = _tdDetail;
  const isMovie = _tdType === 'movie';

  const payload = {
    title:       isMovie ? d.title : d.name,
    cat, status,
    year:        ((isMovie ? d.release_date : d.first_air_date) || '').split('-')[0] || null,
    description: d.overview || null,
    genres:      tmdbGenreNames(d.genres),
    poster_url:  d.poster_path ? TMDB_FULL + d.poster_path : null,
    tmdb_id:     Number(_tdId),
    tmdb_type:   _tdType,
  };
  if (isMovie) {
    payload.runtime_h = d.runtime ? Math.floor(d.runtime/60) : null;
    payload.runtime_m = d.runtime ? (d.runtime%60) : null;
  } else {
    payload.total_seasons = d.number_of_seasons || null;
    payload.total_eps     = d.number_of_episodes || null;
    // total_seasons/total_eps above are just the aggregate counts — the
    // detailed per-season breakdown and completion year only ever live
    // inside ratings, which this payload previously never included at
    // all, so both were silently lost for every entry added this way.
    const seasons = (d.seasons || []).filter(s => s.season_number > 0);
    payload.ratings = { _season_breakdown: seasons.map(s => s.episode_count) };
    if ((d.status === 'Ended' || d.status === 'Canceled') && d.last_air_date) {
      payload.ratings._completion_year = d.last_air_date.split('-')[0];
    }
  }
  // Anime/Cartoons mix movie and show entries within the same category —
  // without this marker, an anime movie added here defaults to being
  // treated as a show everywhere else in the app.
  if (cat === 'anime' || cat === 'cartoons') {
    payload.ratings = { ...(payload.ratings || {}), _media_type: _tdType };
  }

  try {
    const entry = await quickCreate(payload, _tdUser.id);
    _tdOwnEntry = entry;
    showToast('Added to your library!');
    const addRow = document.querySelector('.td-add-row');
    if (addRow) addRow.outerHTML = _tdAddControlsHTML(entry);
  } catch (err) {
    if (String(err.message).startsWith('DUPLICATE:')) {
      // Something already added this — likely a near-simultaneous request
      // that won the race. Rather than leave a broken Add button, fetch
      // the entry that now exists and switch to the "already in library"
      // state, same as a normal successful add would.
      try {
        const existing = await getOwnEntryByTmdb(_tdUser.id, Number(_tdId), _tdType, payload.title);
        if (existing) {
          _tdOwnEntry = existing;
          const addRow = document.querySelector('.td-add-row');
          if (addRow) addRow.outerHTML = _tdAddControlsHTML(existing);
          return;
        }
      } catch (e2) { /* fall through to re-enabling the button below */ }
      showToast('Already in your library.', 'err');
    } else {
      showToast('Error adding entry.', 'err');
      console.error(err);
    }
    if (btn) { btn.disabled = false; btn.innerHTML = origBtnHTML; }
  }
}

function _tdSeasonsHTML(d) {
  const seasons = (d.seasons || []).filter(s => s.season_number > 0 || d.seasons.length === 1);
  if (!seasons.length) return '';
  return `
    <div class="td-section-head"><div class="td-section-title">Episodes</div>
      <a class="td-ep-graph-link" href="episodes.html?show=${_tdId}">${icon('episodes', 14)} Episode ratings graph</a></div>
    <div class="td-season-row" id="tdSeasonRow">
      ${seasons.map(s => `
        <div class="td-season-block" data-season="${s.season_number}" data-tv="${_tdId}">
          <div class="td-season-block-poster">${s.poster_path ? `<img src="${TMDB_IMG.replace('w185', 'w342')}${s.poster_path}" loading="lazy">` : ''}</div>
          <div class="td-season-block-info">
            <div class="td-season-block-name" translate="no">${esc(mssSeasonLabel(s.season_number, s.name))}</div>
            <div class="td-season-block-sub">${s.episode_count} episode${s.episode_count!==1?'s':''}${s.air_date ? ' · ' + s.air_date.split('-')[0] : ''}</div>
          </div>
        </div>`).join('')}

    <div id="tdEpisodesList"></div>`;
}

/* Your episode scores + MSS community averages (episode-ratings, 031) */
let _tdMyEp = {}, _tdCommEp = {};
let _tdEpScoresReady = Promise.resolve();
function _tdLoadEpScores() {
  _tdEpScoresReady = (async () => {
    try {
      const { data: comm } = await sb.rpc('get_episode_community', { p_tmdb_id: Number(_tdId) });
      (comm || []).forEach(r => { _tdCommEp[`${r.season_number}:${r.episode_number}`] = r; });
      const uid = window._navUser?.id;
      if (!uid) return;
      const { data: en } = await sb.from('entries').select('id').eq('user_id', uid).eq('tmdb_id', Number(_tdId)).eq('tmdb_type', 'tv').limit(1).maybeSingle();
      if (!en) return;
      const { data: mine } = await sb.from('episode_ratings').select('season_number,episode_number,score').eq('entry_id', en.id).gt('episode_number', 0);
      (mine || []).forEach(r => { _tdMyEp[`${r.season_number}:${r.episode_number}`] = Number(r.score); });
    } catch {}
  })();
}

async function _selectSeason(el) {
  document.querySelectorAll('.td-season-block').forEach(b => b.classList.remove('active'));
  el.classList.add('active');

  const epsWrap = document.getElementById('tdEpisodesList');
  epsWrap.innerHTML = '<div class="td-season-loading">Loading episodes…</div>';

  const tvId = el.dataset.tv, seasonNum = el.dataset.season;
  const season = await _tdFetchSeason(tvId, seasonNum);
  const eps = season?.episodes || [];

  if (!eps.length) {
    epsWrap.innerHTML = '<div class="td-season-loading">No episode data available.</div>';
    return;
  }

  await _tdEpScoresReady;
  epsWrap.innerHTML = `<div class="td-episode-row">${eps.map((ep, i) => {
    const runtime = ep.runtime ? `${ep.runtime}m` : '';
    const k = `${seasonNum}:${ep.episode_number}`, mineS = _tdMyEp[k], commS = _tdCommEp[k];
    const rating = ep.vote_average ? _discFloorScore(ep.vote_average) : null;
    const date = ep.air_date || '';
    return `
    <div class="td-episode-card" onclick="_openEpisodePopup(${i})">
      <div class="td-ep-still">
        ${ep.still_path ? `<img src="${TMDB_IMG.replace('w185', 'w500')}${ep.still_path}" loading="lazy">` : ''}
        <span class="td-ep-num-badge">Episode ${ep.episode_number}</span>
        ${mineS != null || commS ? `<span class="td-ep-scores">${mineS != null ? `<span class="ep-band-${MSSEp.band(mineS).key}" title="Your rating">You ${mineS.toFixed(1)}</span>` : ''}${commS ? `<span class="ep-band-${MSSEp.band(commS.avg_score).key}" title="MyScreenScore average · ${commS.rating_count} ratings">MSS ${Number(commS.avg_score).toFixed(1)}</span>` : ''}</span>` : ''}
      </div>
      <div class="td-ep-body">
        <div class="td-ep-title" translate="no">${esc(ep.name)}</div>
        <div class="td-ep-meta-row">
          ${rating ? `<span class="td-ep-rating">★ ${rating}</span>` : ''}
          ${date ? `<span>${date}</span>` : ''}
          ${runtime ? `<span>${runtime}</span>` : ''}
        </div>
        <div class="td-ep-overview" translate="no">${esc(ep.overview) || mssT('No description available.')}</div>
      </div>
    </div>`;
  }).join('')}</div>`;

  _tdCurrentEpisodes = eps;
}

/* ── Episode detail popup ── */
let _tdCurrentEpisodes = [];

function _injectEpPopupOverlay() {
  if (document.getElementById('epPopupOverlay')) return;
  const el = document.createElement('div');
  el.id = 'epPopupOverlay';
  el.innerHTML = `<div class="ep-popup-card" id="epPopupCard" role="dialog" aria-modal="true" aria-labelledby="epPopupTitle"></div>`;
  MSSDialog.bind(el, _closeEpisodePopup);
  document.body.appendChild(el);
}

function _openEpisodePopup(index) {

  if (!ep) return;
  _injectEpPopupOverlay();

  const runtime = ep.runtime ? `${ep.runtime} min` : '';

  document.getElementById('epPopupCard').innerHTML = `
    <div class="ep-popup-still">
      ${ep.still_path ? `<img src="${TMDB_IMG.replace('w185', 'w780')}${ep.still_path}" loading="lazy">` : ''}
      <span class="ep-popup-num-badge">Episode ${ep.episode_number}</span>
      <button type="button" class="ep-popup-close" onclick="_closeEpisodePopup()" aria-label="Close">&#x2715;</button>
    </div>
    <div class="ep-popup-body">
      <div class="ep-popup-title" id="epPopupTitle" translate="no">${esc(ep.name)}</div>
      <div class="ep-popup-meta-row">
        ${rating ? `<span class="ep-popup-rating">★ ${rating}</span>` : ''}
        ${date ? `<span>${date}</span>` : ''}
        ${runtime ? `<span>${runtime}</span>` : ''}
      </div>
      <div class="ep-popup-overview" translate="no">${esc(ep.overview) || mssT('No description available.')}</div>
    </div>`;

  MSSDialog.open(document.getElementById('epPopupOverlay'));
}

function _closeEpisodePopup() { MSSDialog.close(document.getElementById('epPopupOverlay')); }

/* ── Community Notes ── */
let _tdNotesRaw = [];
let _tdNotesReactions = {}; // entry_id -> 'like' | 'dislike' (current user's own reaction)
let _tdNotesSort = 'popular';

function _tdSetNotesSort(mode) {
  _tdNotesSort = mode;
  document.querySelectorAll('.td-notes-sort-btn').forEach(b => b.classList.toggle('active', b.dataset.sort === mode));
  _tdRenderNotes();
}

async function _tdLoadNotes() {
  const wrap = document.getElementById('tdNotesList');
  if (!wrap || !_tdId || !_tdType) return;
  try {
    const { data, error } = await sb.rpc('get_notes_for_title', { p_tmdb_id: Number(_tdId), p_tmdb_type: _tdType });
    if (error) throw error;
    _tdNotesRaw = data || [];

    if (_tdUser && _tdNotesRaw.length) {
      const entryIds = _tdNotesRaw.map(n => n.entry_id);
      const { data: myReactions } = await sb.from('note_reactions')
        .select('entry_id, is_like')
        .eq('user_id', _tdUser.id)
        .in('entry_id', entryIds);
      _tdNotesReactions = {};
      (myReactions || []).forEach(r => { _tdNotesReactions[r.entry_id] = r.is_like ? 'like' : 'dislike'; });
    }

    _tdRenderNotes();
  } catch (err) {
    console.error('Load notes error:', err);
    wrap.innerHTML = '<div class="td-notes-empty">Couldn\'t load notes right now.</div>';
  }
}

function _tdRenderNotes() {
  const wrap = document.getElementById('tdNotesList');
  if (!wrap) return;
  if (!_tdNotesRaw.length) {
    wrap.innerHTML = '<div class="td-notes-empty">No notes yet — be the first to leave one on your entry.</div>';
    return;
  }

  const sorted = [..._tdNotesRaw].sort((a, b) => {
    if (_tdNotesSort === 'newest') return new Date(b.created_at) - new Date(a.created_at);
    if (_tdNotesSort === 'least_popular') {
      const dA = Number(a.dislike_count), dB = Number(b.dislike_count);
      if (dB !== dA) return dB - dA;
      return new Date(b.created_at) - new Date(a.created_at);
    }
    const scoreA = Number(a.like_count) - Number(a.dislike_count);
    const scoreB = Number(b.like_count) - Number(b.dislike_count);
    if (scoreB !== scoreA) return scoreB - scoreA;
    return new Date(b.created_at) - new Date(a.created_at);
  });

  wrap.innerHTML = sorted.map(n => {
    const myReaction = _tdNotesReactions[n.entry_id];
    const dateStr = n.created_at ? new Date(n.created_at).toLocaleDateString(MSSI18n.locale, { month: 'short', day: 'numeric', year: 'numeric' }) : '';
    const initial = (n.username || '?')[0].toUpperCase();
    return `<div class="td-note-card" data-dbl-like>
      <div class="td-note-avatar">${n.avatar_url ? `<img src="${esc(n.avatar_url)}" loading="lazy">` : esc(initial)}</div>
      <div class="td-note-body">
        <div class="td-note-head">
          <span class="td-note-username">@${esc(n.username || 'user')}</span>
          <span class="td-note-date">${dateStr}</span>
        </div>
        ${mssIsSpoiler(n) && n.user_id !== _tdUser?.id ? mssSpoilerHTML(`<div class="td-note-text" translate="no">${esc(n.notes)}</div>`, { compact: true }) : `<div class="td-note-text" translate="no">${esc(n.notes)}</div>`}
        <div class="td-note-actions">
          <button type="button" class="td-note-react-btn ${myReaction === 'like' ? 'active-like' : ''}" data-like aria-label="Like" aria-pressed="${myReaction === 'like'}" onclick="_tdReactToNote('${n.entry_id}', true)">
            ${icon(myReaction === 'like' ? 'thumbsUpFilled' : 'thumbsUp', 14)} <span>${n.like_count || 0}</span>
          </button>
          <button type="button" class="td-note-react-btn ${myReaction === 'dislike' ? 'active-dislike' : ''}" aria-label="Dislike" aria-pressed="${myReaction === 'dislike'}" onclick="_tdReactToNote('${n.entry_id}', false)">
            ${icon(myReaction === 'dislike' ? 'thumbsDownFilled' : 'thumbsDown', 14)} <span>${n.dislike_count || 0}</span>
          </button>
          <button class="td-note-react-btn" onclick='openReplyPopup("note", ${attrJSON(n.entry_id)}, ${attrJSON(n.username || "")})'>
            ${icon('reply', 14)} Replies
          </button>
        </div>
      </div>
    </div>`;
  }).join('');
}

/* ── Replies popup (someone's note on this title) ── */
const REPLY_CONFIG = {
  note: { table: 'note_replies', reactKind: 'noteReply', reactionTable: 'note_reply_reactions', rpc: 'get_note_replies', rpcParam: 'p_entry_id', col: 'entry_id' },
  list: { table: 'list_replies', reactKind: 'listReply', reactionTable: 'list_reply_reactions', rpc: 'get_list_replies', rpcParam: 'p_list_id', col: 'list_id' },
};

let _replyKind = null;
let _replyTargetId = null;
let _replyRaw = [];
let _replySort = 'popular';
let _replyMyReactions = {};




function _injectReplyPopupOverlay() {
  if (document.getElementById('replyPopupOverlay')) return;
  const el = document.createElement('div');
  el.id = 'replyPopupOverlay';
  el.innerHTML = `
    <div id="replyPopupCard" role="dialog" aria-modal="true" aria-labelledby="replyPopupTitle">
      <div class="rp-head">
        <div class="rf-header rp-titlebar">
          <div class="rf-title" id="replyPopupTitle">Replies</div>
          <button type="button" class="rf-close" onclick="closeReplyPopup()" aria-label="Close">${icon('x', 18)}</button>
        </div>
        <div class="rp-sub" id="replyPopupSubtitle"></div>
        <div class="rp-sorts" role="group" aria-label="Sort replies">
          <button type="button" class="td-notes-sort-btn active" data-sort="popular" onclick="_replySetSort('popular')">Popular</button>
          <button type="button" class="td-notes-sort-btn" data-sort="latest" onclick="_replySetSort('latest')">Latest</button>
        </div>
      </div>
      <div id="replyList" class="rp-list" aria-live="polite"></div>
      <div id="replyComposer" class="rp-composer">
        <textarea id="replyInput" class="field-input rp-input" maxlength="1000" placeholder="Add a reply…" aria-label="Add a reply"></textarea>
        <button type="button" class="popup-action-btn rp-post" onclick="_replySubmit()">Post Reply</button>
      </div>
    </div>`;
  MSSDialog.bind(el, closeReplyPopup);
  document.body.appendChild(el);
}

async function openReplyPopup(kind, targetId, title) {
  _replyKind = kind;
  _replyTargetId = targetId;
  _injectReplyPopupOverlay();
  document.getElementById('replyPopupSubtitle').textContent = title ? `On @${title}’s note` : '';
  document.getElementById('replyList').innerHTML = '<div class="td-notes-loading">Loading replies…</div>';
  document.getElementById('replyComposer').hidden = !_currentUserForReplies();
  MSSDialog.open(document.getElementById('replyPopupOverlay'));
  await _replyLoad();
}

function closeReplyPopup() {
  MSSDialog.close(document.getElementById('replyPopupOverlay'));
  _replyKind = null;
  _replyTargetId = null;
}

function _replyReact(replyId, isLike) {
  const r = _replyRaw.find(x => x.id === replyId);
  if (!r) return;
  mssReactFeed(REPLY_CONFIG[_replyKind].reactKind, replyId, isLike,
    () => ({ like: r.like_count, dislike: r.dislike_count, mine: _replyMyReactions[replyId] || null }),
    st => {
      r.like_count = st.like; r.dislike_count = st.dislike;
      if (st.mine) _replyMyReactions[replyId] = st.mine; else delete _replyMyReactions[replyId];
      _replyRenderList();
    });
}

function _tdReactToNote(entryId, isLike) {
  const n = _tdNotesRaw.find(x => x.entry_id === entryId);
  if (!n) return;
  mssReactFeed('note', entryId, isLike,
    () => ({ like: n.like_count, dislike: n.dislike_count, mine: _tdNotesReactions[entryId] || null }),
    st => {
      n.like_count = st.like; n.dislike_count = st.dislike;
      if (st.mine) _tdNotesReactions[entryId] = st.mine; else delete _tdNotesReactions[entryId];
      _tdRenderNotes();
    });
}

function _replySetSort(mode) {
  _replySort = mode;
  document.querySelectorAll('#replyPopupCard .td-notes-sort-btn').forEach(b => b.classList.toggle('active', b.dataset.sort === mode));
  _replyRenderList();
}

function _currentUserForReplies() {
  return (typeof _tdUser !== 'undefined' && _tdUser) || null;
}

async function _replyLoad() {
  const cfg = REPLY_CONFIG[_replyKind];
  const listEl = document.getElementById('replyList');
  try {
    const params = {}; params[cfg.rpcParam] = _replyTargetId;
    const { data, error } = await sb.rpc(cfg.rpc, params);
    if (error) throw error;
    _replyRaw = data || [];

    const user = _currentUserForReplies();
    if (user && _replyRaw.length) {
      const replyIds = _replyRaw.map(r => r.id);
      const { data: myReactions } = await sb.from(cfg.reactionTable)
        .select('reply_id, is_like').eq('user_id', user.id).in('reply_id', replyIds);
      _replyMyReactions = {};
      (myReactions || []).forEach(r => { _replyMyReactions[r.reply_id] = r.is_like ? 'like' : 'dislike'; });
    } else {
      _replyMyReactions = {};
    }
    _replyRenderList();
  } catch (err) {
    console.error('Load replies error:', err);
    listEl.innerHTML = '<div class="td-notes-empty">Couldn\'t load replies right now.</div>';
  }
}

function _replyRenderList() {
  const listEl = document.getElementById('replyList');
  if (!_replyRaw.length) {
    listEl.innerHTML = '<div class="td-notes-empty">No replies yet — be the first to say something.</div>';
    return;
  }
  const sorted = [..._replyRaw].sort((a, b) => {
    if (_replySort === 'latest') return new Date(b.created_at) - new Date(a.created_at);
    const scoreA = Number(a.like_count) - Number(a.dislike_count);
    const scoreB = Number(b.like_count) - Number(b.dislike_count);
    if (scoreB !== scoreA) return scoreB - scoreA;
    return new Date(b.created_at) - new Date(a.created_at);
  });
  listEl.innerHTML = sorted.map(r => {
    const myReaction = _replyMyReactions[r.id];
    const initial = (r.username || '?')[0].toUpperCase();
    const dateStr = r.created_at ? new Date(r.created_at).toLocaleDateString(MSSI18n.locale, { month: 'short', day: 'numeric' }) : '';
    return `<div class="rp-item" data-dbl-like>
      <div class="td-note-avatar">${r.avatar_url ? `<img src="${esc(r.avatar_url)}" alt="" loading="lazy">` : esc(initial)}</div>
      <div class="rp-main">
        <div class="rp-by">
          <span class="td-note-username">@${esc(r.username || 'user')}</span>
          <span class="td-note-date">${dateStr}</span>
        </div>
        <div class="rp-text" translate="no">${esc(r.content)}</div>
        <div class="rp-reacts">
          <button type="button" class="td-note-react-btn ${myReaction === 'like' ? 'active-like' : ''}" data-like aria-label="Like" aria-pressed="${myReaction === 'like'}" onclick="_replyReact('${r.id}', true)">
            ${icon(myReaction === 'like' ? 'thumbsUpFilled' : 'thumbsUp', 13)} <span>${r.like_count || 0}</span>
          </button>
          <button type="button" class="td-note-react-btn ${myReaction === 'dislike' ? 'active-dislike' : ''}" aria-label="Dislike" aria-pressed="${myReaction === 'dislike'}" onclick="_replyReact('${r.id}', false)">
            ${icon(myReaction === 'dislike' ? 'thumbsDownFilled' : 'thumbsDown', 13)} <span>${r.dislike_count || 0}</span>
          </button>
        </div>
      </div>
    </div>`;
  }).join('');
}


async function _replySubmit() {
  const user = _currentUserForReplies();
  if (!user) { showToast('Sign in to reply.', 'err'); return; }
  const input = document.getElementById('replyInput');
  const content = input.value.trim();
  if (!content) return;
  const cfg = REPLY_CONFIG[_replyKind];
  try {
    const row = { user_id: user.id, content };
    row[cfg.col] = _replyTargetId;
    const { error } = await sb.from(cfg.table).insert(row);
    if (error) throw error;
    input.value = '';
    await _replyLoad();
  } catch (err) {
    console.error('Post reply error:', err);
    showToast(isRateLimitError(err) ? RATE_LIMIT_MESSAGE : 'Failed to post reply.', 'err');
  }
}
