<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyScreenScore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
.dl-back {
  display:inline-flex; align-items:center; gap:6px;
  font-size:13px; color:var(--text-3); text-decoration:none;
  margin-bottom:1.5rem; transition:color .15s;
}
.dl-back:hover { color:var(--olive-light); }

.dl-head { display:flex; align-items:flex-end; justify-content:space-between; gap:1rem; margin-bottom:2rem; flex-wrap:wrap; }
.dl-title { font-family:var(--serif); font-size:clamp(28px, 5vw, 42px); font-weight:300; }

/* ── Grid view ── */
.dl-grid {
  display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));
  gap:14px;
  align-items:start; grid-auto-rows:max-content;
}
@media(min-width:1024px) {
  /* On laptops/desktop, the 200px minimum lets a lot of columns fit,
     keeping each card fairly small even though there's plenty of room
     to spare — bumping the minimum specifically at this width makes
     each card genuinely bigger instead of just adding more of them. */
  .dl-grid { grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); }
}
@media(min-width:1600px) {
  .dl-grid { grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); }
}
@media(max-width:640px) {
  .dl-grid { grid-template-columns:repeat(2,1fr); }
}
.dl-card {
  opacity:0; transform:translateY(18px); width:100%; box-sizing:border-box;
  transition:opacity .5s var(--ease), transform .5s var(--ease);
}
.dl-card.dl-in-view { opacity:1; transform:none; }

/* ── List view ── */
.dl-list { display:flex; flex-direction:column; gap:8px; }
.dl-list-row {
  display:grid; grid-template-columns:96px 1fr auto; align-items:center; gap:22px;
  background:var(--card); border:0.5px solid var(--border); border-radius:var(--radius);
  padding:16px 24px 16px 16px; cursor:pointer;
  opacity:0; transform:translateX(-10px);
  transition:opacity .4s var(--ease), transform .4s var(--ease), border-color .15s, background .15s;
}
.dl-list-row.dl-in-view { opacity:1; transform:none; }
.dl-list-row:hover { border-color:var(--border-olive); background:var(--card-2); }
.dl-list-rank { font-family:var(--serif); font-size:24px; color:var(--text-3); text-align:center; }
.dl-list-poster { width:96px; height:136px; border-radius:6px; overflow:hidden; background:var(--bg-3); flex-shrink:0; }
.dl-list-poster img { width:100%; height:100%; object-fit:cover; display:block; }
.dl-list-title-row { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; min-width:0; }
.dl-list-title { font-size:18px; font-weight:500; color:var(--text); }
.dl-list-year { font-size:14px; color:var(--text-3); font-weight:400; flex-shrink:0; }
.dl-list-badges-row { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
.dl-list-desc {
  font-size:12px; color:var(--text-3); margin-top:4px; line-height:1.4;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
/* .dl-list-type removed — list-view type tags now use the shared .type-label/.type-label-tv classes */
.dl-list-right { display:flex; flex-direction:column; align-items:center; gap:6px; }

@media(max-width:560px) {
  .dl-head { margin-bottom:1.5rem; }
  .dl-grid { gap:10px; }
  .dl-rank-badge { min-width:22px; height:22px; font-size:13px; }
  .dl-list-row { grid-template-columns:64px 1fr auto; gap:14px; padding:10px 16px 10px 10px; }
  .dl-list-poster { width:64px; height:92px; }
  .dl-list-rank { font-size:18px; }
  .dl-list-title { font-size:15px; }
  .dl-list-year { font-size:12px; }
  .dl-list-row .type-label { font-size:10px; padding:3px 8px; }
}

.home-tmdb-poster-fallback {
  width:100%; height:100%; display:flex; align-items:center; justify-content:center;
  background:var(--bg-3); font-family:var(--serif); color:var(--olive-light);
  font-size:clamp(22px, 6vw, 32px);
}
.home-tmdb-year { color:var(--text-3); font-size:clamp(11px, 2.6vw, 13px); }
.home-tmdb-meta-row { display:flex; align-items:center; justify-content:flex-end; gap:8px; margin-top:2px; }
.home-tmdb-score { color:var(--olive-light); font-size:clamp(11px, 2.6vw, 13px); font-weight:600; white-space:nowrap; }
/* "Very slightly" bigger — this is Discover's public TMDB score, kept
   modest since it's someone else's aggregate rating, not the user's
   own. list-view.html's own MSS score gets a much bigger, standalone
   treatment instead (that one is the user's own rating, not TMDB's). */
.dl-score-big { font-size:clamp(13px, 3vw, 15px); }

.dl-sentinel { height:1px; }
.dl-end-msg { text-align:center; padding:2.5rem 0; color:var(--text-3); font-size:13px; }
</style>
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1E5C26">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MyScreenScore">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
</head>
<body>
<div class="page-wrap">
  <a class="dl-back" href="discover.html" id="dlBack" onclick="if(history.length>1){history.back();return false;}">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    Back
  </a>
  <div class="dl-head">
    <h1 class="dl-title" id="dlTitle">Loading…</h1>
    <div class="view-toggle" id="dlViewToggle"></div>
  </div>
  <div class="dl-grid" id="dlGrid"></div>
  <div class="dl-sentinel" id="dlSentinel"></div>
  <div class="dl-end-msg" id="dlEndMsg" style="display:none">You've reached the end.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/nav.js"></script>
<script src="js/discover-categories.js"></script>
<script>
function _dlEsc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

const _dlParams = new URLSearchParams(location.search);
const _dlCategory = getDiscoverCategory(_dlParams.get('list') || 'trending_week');
const _dlTitle = _dlParams.get('title') || _dlCategory.title;

let _dlPage = 1;
let _dlLoading = false;
let _dlDone = false;
let _dlView = localStorage.getItem('disc_listView') || 'grid';
const _dlIsRanked = _dlCategory.key.startsWith('top250');

// Type badge is only shown on the Anime/Cartoons categories, where a
// single list genuinely mixes movies and shows (a viewer can't tell
// which just from the title/poster) — everywhere else the category
// itself already says what you're browsing, so the badge is redundant.
// Skip the type badge only for categories that are genuinely
// single-media-type by name — the category itself already says what
// you're browsing there, so the badge would be redundant. Everywhere
// else (trending, popular, top-rated, every "best X" superlative
// category, anime/cartoons, etc.) can genuinely mix movies and shows
// within the same list, so the badge shows by default rather than
// needing every mixed category enumerated by hand — that whitelist
// approach was actually the earlier bug: it missed "Trending This
// Week" and "Popular", which are just as mixed as anime/cartoons.
const _DL_SINGLE_TYPE_CATEGORIES = new Set([
  'top250_movies', 'top250_shows',
  'niche_movies', 'niche_shows',
  'upcoming_movies', 'upcoming_tv',
  'airing_today',
]);

function _dlTypeLabel(it) {
  if (_DL_SINGLE_TYPE_CATEGORIES.has(_dlCategory.key)) return null;
  return it.media_type === 'movie' ? 'Movie' : 'TV Show';
}

function _dlRankCls(rank) {
  return rank === 1 ? 'cg-rank-1' : rank === 2 ? 'cg-rank-2' : rank === 3 ? 'cg-rank-3' : 'cg-rank-other';
}

function _dlCardHTML(it, rank) {
  const posterInner = it.poster_url
    ? `<img src="${it.poster_url}" loading="lazy" style="width:100%;height:100%;object-fit:cover;">`
    : `<div class="home-tmdb-poster-fallback">${_dlEsc((it.title||'?')[0].toUpperCase())}</div>`;
  const rankBadge = _dlIsRanked
    ? `<div class="cg-rank-badge ${_dlRankCls(rank)}">${rank}</div>`
    : '';
  const scoreStr = _discFloorScore(it.score);
  const typeLabel = _dlTypeLabel(it);
  const typeCls = it.media_type === 'movie' ? 'type-label' : 'type-label type-label-tv';
  return `<div class="q-card dl-card" ${_discClickAttr(it)}>
    <div class="q-poster" style="position:relative">
      ${posterInner}
      <div class="q-poster-overlay"></div>
      ${rankBadge}
      ${typeLabel ? `<span class="${typeCls} type-label-overlay-bottom">${typeLabel}</span>` : ''}
    </div>
    <div class="q-info">
      <div class="title-year-row"><div class="q-title" style="margin-bottom:0;">${_dlEsc(it.title)}</div>${it.year ? `<span class="title-year-inline">${_dlEsc(it.year)}</span>` : ''}</div>
      ${scoreStr ? `<div class="home-tmdb-meta-row"><span class="home-tmdb-score">★ ${scoreStr}</span></div>` : ''}
    </div>
  </div>`;
}

function _dlListRowHTML(it, rank) {
  const posterInner = it.poster_url
    ? `<img src="${it.poster_url}" loading="lazy">`
    : `<div class="home-tmdb-poster-fallback" style="font-size:18px">${_dlEsc((it.title||'?')[0].toUpperCase())}</div>`;
  const rankBadge = _dlIsRanked
    ? `<div class="cg-rank-badge ${_dlRankCls(rank)}">${rank}</div>`
    : '';
  const scoreStr = _discFloorScore(it.score);
  const typeLabel = _dlTypeLabel(it);
  const typeCls = it.media_type === 'movie' ? 'type-label' : 'type-label type-label-tv';
  // TMDB's discover/list data doesn't include runtime or episode count
  // (that only exists on the per-item detail endpoint) — this stays
  // empty for essentially every item here, not a bug, just a real data
  // gap on this specific data source.
  return `<div class="dl-list-row" ${_discClickAttr(it)}>
    <div class="dl-list-poster" style="position:relative">${posterInner}${rankBadge}</div>
    <div style="min-width:0">
      <div class="dl-list-title-row">
        <div class="dl-list-title">${_dlEsc(it.title)}</div>
        ${it.year ? `<span class="dl-list-year">${_dlEsc(it.year)}</span>` : ''}
      </div>
      ${typeLabel ? `<div class="dl-list-badges-row"><span class="${typeCls}">${typeLabel}</span></div>` : ''}
      ${it.overview ? `<div class="dl-list-desc">${_dlEsc(it.overview)}</div>` : ''}
    </div>
    <div class="dl-list-right">
      ${scoreStr ? `<span class="home-tmdb-score dl-score-big">★ ${scoreStr}</span>` : ''}
    </div>
  </div>`;
}

function _dlRenderViewToggle() {
  document.getElementById('dlViewToggle').innerHTML = `
    <button class="vt-btn ${_dlView==='list'?'active':''}" onclick="_dlSetView('list')" title="List view">${icon('list',13)}</button>
    <button class="vt-btn ${_dlView==='grid'?'active':''}" onclick="_dlSetView('grid')" title="Grid view">${icon('grid',13)}</button>`;
}

let _dlAllItems = [];
let _dlRevealObserver = null;

function _dlSetView(v) {
  if (v === _dlView) return;
  _dlView = v;
  localStorage.setItem('disc_listView', v);
  const grid = document.getElementById('dlGrid');
  grid.className = v === 'list' ? 'dl-list' : 'dl-grid';
  // Items already fetched aren't re-fetched, just redrawn in the new view.
  grid.innerHTML = _dlAllItems.map((it, i) => v === 'list' ? _dlListRowHTML(it, i + 1) : _dlCardHTML(it, i + 1)).join('');
  _dlRenderViewToggle();
  _dlObserveNewCards();
}

function _dlObserveNewCards() {
  if (!_dlRevealObserver) {
    _dlRevealObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('dl-in-view');
          _dlRevealObserver.unobserve(entry.target);
        }
      });
    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.05 });
  }
  const grid = document.getElementById('dlGrid');
  const selector = _dlView === 'list' ? '.dl-list-row:not(.dl-in-view)' : '.dl-card:not(.dl-in-view)';
  grid.querySelectorAll(selector).forEach(el => _dlRevealObserver.observe(el));
}

async function _dlLoadMore() {
  if (_dlLoading || _dlDone) return;
  _dlLoading = true;
  try {
    let items = await _dlCategory.fetch(_dlPage);

    // Enforce a per-category hard cap (e.g. a genuine "Top 250" should
    // stop at 250, not keep paginating until TMDB runs dry).
    if (_dlCategory.cap) {
      const remaining = _dlCategory.cap - _dlAllItems.length;
      if (remaining <= 0) {
        items = [];
      } else if (items.length > remaining) {
        items = items.slice(0, remaining);
      }
    }

    if (!items.length) {
      _dlDone = true;
      document.getElementById('dlEndMsg').style.display = '';
      return;
    }
    _dlAllItems = _dlAllItems.concat(items);
    const grid = document.getElementById('dlGrid');
    const startRank = _dlAllItems.length - items.length + 1;
    grid.insertAdjacentHTML('beforeend', items.map((it, i) => _dlView === 'list' ? _dlListRowHTML(it, startRank + i) : _dlCardHTML(it, startRank + i)).join(''));
    _dlObserveNewCards();
    _dlPage++;
    if (_dlCategory.cap && _dlAllItems.length >= _dlCategory.cap) {
      _dlDone = true;
      document.getElementById('dlEndMsg').style.display = '';
    }
    if (_dlPage > 30) { _dlDone = true; } // safety net regardless of category
  } catch (e) {
    console.error('Discover list fetch error:', e);
    _dlDone = true;
    const endMsg = document.getElementById('dlEndMsg');
    if (isRateLimitError(e)) {
      endMsg.textContent = "TMDB is busy right now — please refresh in a moment to keep browsing.";
      endMsg.style.display = '';
    } else if (_dlAllItems.length === 0) {
      endMsg.textContent = "Couldn't load this list right now — please try again shortly.";
      endMsg.style.display = '';
    }
  } finally {
    _dlLoading = false;
  }
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('dlTitle').textContent = _dlTitle;
  document.title = _dlTitle + ' — MyScreenScore';
  document.getElementById('dlGrid').className = _dlView === 'list' ? 'dl-list' : 'dl-grid';
  _dlRenderViewToggle();

  initPageGuest(async () => {
    await _dlLoadMore();

    const sentinel = document.getElementById('dlSentinel');
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(entry => { if (entry.isIntersecting) _dlLoadMore(); });
    }, { rootMargin: '400px' });
    obs.observe(sentinel);
  });
});
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(r => console.log('SW registered:', r.scope))
      .catch(e => console.warn('SW failed:', e));
  });
}
</script>
</body>
</html>
