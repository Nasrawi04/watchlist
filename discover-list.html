<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyScreenScore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
.dl-back {
  display:inline-flex; align-items:center; gap:6px;
  font-size:13px; color:var(--text-3); text-decoration:none;
  margin-bottom:1.5rem; transition:color .15s;
}
.dl-back:hover { color:var(--olive-light); }

.dl-head { display:flex; align-items:flex-end; justify-content:space-between; gap:1rem; margin-bottom:2rem; flex-wrap:wrap; }
.dl-title { font-family:var(--serif); font-size:clamp(28px, 5vw, 42px); font-weight:300; }

/* ── Grid view ── */
.dl-grid {
  display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:clamp(14px, 2.5vw, 22px);
  align-items:start; grid-auto-rows:max-content;
}
.dl-card {
  opacity:0; transform:translateY(18px); width:100%; box-sizing:border-box;
  transition:opacity .5s var(--ease), transform .5s var(--ease);
}
.dl-card.dl-in-view { opacity:1; transform:none; }
.dl-card:hover .dl-play { opacity:1; }
.dl-type-badge {
  position:absolute; top:8px; right:8px; padding:2px 8px; border-radius:20px;
  font-size:10px; font-weight:600; letter-spacing:.3px;
  background:rgba(0,0,0,0.6); color:#fff; backdrop-filter:blur(4px);
}
.dl-rank-badge {
  position:absolute; top:8px; left:8px; min-width:26px; height:26px; padding:0 6px;
  border-radius:8px; display:flex; align-items:center; justify-content:center;
  font-family:var(--serif); font-size:15px; font-weight:600;
  background:rgba(0,0,0,0.65); color:#fff; backdrop-filter:blur(4px);
}
.dl-rank-badge.dl-top3 { background:var(--olive-light); color:#18180f; }
.dl-play {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  opacity:0; transition:opacity .2s; color:#fff; pointer-events:none;
}
.dl-play svg { width:30px; height:30px; filter:drop-shadow(0 2px 6px rgba(0,0,0,.5)); }

/* ── List view ── */
.dl-list { display:flex; flex-direction:column; gap:8px; }
.dl-list-row {
  display:grid; grid-template-columns:64px 1fr auto; align-items:center; gap:18px;
  background:var(--card); border:0.5px solid var(--border); border-radius:var(--radius);
  padding:12px 20px 12px 12px; cursor:pointer;
  opacity:0; transform:translateX(-10px);
  transition:opacity .4s var(--ease), transform .4s var(--ease), border-color .15s, background .15s;
}
.dl-list-row.dl-ranked { grid-template-columns:40px 64px 1fr auto; }
.dl-list-row.dl-in-view { opacity:1; transform:none; }
.dl-list-row:hover { border-color:var(--border-olive); background:var(--card-2); }
.dl-list-rank { font-family:var(--serif); font-size:22px; color:var(--text-3); text-align:center; }
.dl-list-rank.dl-top3 { color:var(--olive-light); }
.dl-list-poster { width:64px; height:90px; border-radius:6px; overflow:hidden; background:var(--bg-3); flex-shrink:0; }
.dl-list-poster img { width:100%; height:100%; object-fit:cover; display:block; }
.dl-list-title { font-size:16px; font-weight:500; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.dl-list-year { font-size:12.5px; color:var(--text-3); margin-top:4px; }
.dl-list-type { font-size:11px; padding:4px 11px; border-radius:20px; background:var(--olive-faint); border:0.5px solid var(--border-olive); color:var(--olive-light); letter-spacing:.4px; white-space:nowrap; }

@media(max-width:560px) {
  .dl-head { margin-bottom:1.5rem; }
  .dl-grid { grid-template-columns:repeat(auto-fill, minmax(120px, 1fr)); gap:12px; }
  .dl-rank-badge { min-width:22px; height:22px; font-size:13px; }
  .dl-list-row { grid-template-columns:48px 1fr auto; gap:12px; padding:9px 14px 9px 9px; }
  .dl-list-row.dl-ranked { grid-template-columns:26px 48px 1fr auto; }
  .dl-list-poster { width:48px; height:68px; }
  .dl-list-rank { font-size:17px; }
  .dl-list-title { font-size:14px; }
  .dl-list-year { font-size:11.5px; }
  .dl-list-type { font-size:10px; padding:3px 8px; }
}
@media(max-width:380px) {
  .dl-list-type { display:none; }
}

.home-tmdb-poster-fallback {
  width:100%; height:100%; display:flex; align-items:center; justify-content:center;
  background:var(--bg-3); font-family:var(--serif); color:var(--olive-light);
  font-size:clamp(22px, 6vw, 32px);
}
.home-tmdb-year { color:var(--text-3); font-size:clamp(11px, 2.6vw, 13px); }

.dl-sentinel { height:1px; }
.dl-end-msg { text-align:center; padding:2.5rem 0; color:var(--text-3); font-size:13px; }
</style>
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1E5C26">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MyScreenScore">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
</head>
<body>
<div class="page-wrap">
  <a class="dl-back" href="discover.html" id="dlBack" onclick="if(history.length>1){history.back();return false;}">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    Back
  </a>
  <div class="dl-head">
    <h1 class="dl-title" id="dlTitle">Loading…</h1>
    <div class="view-toggle" id="dlViewToggle"></div>
  </div>
  <div class="dl-grid" id="dlGrid"></div>
  <div class="dl-sentinel" id="dlSentinel"></div>
  <div class="dl-end-msg" id="dlEndMsg" style="display:none">You've reached the end.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/nav.js"></script>
<script src="js/discover-categories.js"></script>
<script>
function _dlEsc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

const _dlParams = new URLSearchParams(location.search);
const _dlCategory = getDiscoverCategory(_dlParams.get('list') || 'trending_week');
const _dlTitle = _dlParams.get('title') || _dlCategory.title;

let _dlPage = 1;
let _dlLoading = false;
let _dlDone = false;
let _dlView = localStorage.getItem('disc_listView') || 'grid';
const _dlIsRanked = _dlCategory.key.startsWith('top250');

const _DL_PLAY_SVG = `<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5 3 19 12 5 21 5 3"/></svg>`;

function _dlTypeLabel(mediaType) {
  return mediaType === 'movie' ? 'Movie' : 'TV';
}

function _dlCardHTML(it, rank) {
  const posterUrl = it.poster_path ? TMDB_FULL + it.poster_path : null;
  const posterInner = posterUrl
    ? `<img src="${posterUrl}" loading="lazy" style="width:100%;height:100%;object-fit:cover;">`
    : `<div class="home-tmdb-poster-fallback">${_dlEsc((it.title||'?')[0].toUpperCase())}</div>`;
  const rankBadge = _dlIsRanked
    ? `<span class="dl-rank-badge ${rank <= 3 ? 'dl-top3' : ''}">${rank}</span>`
    : '';
  return `<div class="q-card dl-card" onclick="goToTitle('${it.media_type}', ${it.id})">
    <div class="q-poster" style="position:relative">
      ${posterInner}
      <div class="q-poster-overlay"></div>
      ${rankBadge}
      <span class="dl-type-badge">${_dlTypeLabel(it.media_type)}</span>
      <span class="dl-play">${_DL_PLAY_SVG}</span>
    </div>
    <div class="q-info">
      <div class="q-title">${_dlEsc(it.title)}</div>
      ${it.year ? `<div class="q-genre home-tmdb-year">${_dlEsc(it.year)}</div>` : ''}
    </div>
  </div>`;
}

function _dlListRowHTML(it, rank) {
  const posterUrl = it.poster_path ? TMDB_IMG + it.poster_path : null;
  const posterInner = posterUrl
    ? `<img src="${posterUrl}" loading="lazy">`
    : `<div class="home-tmdb-poster-fallback" style="font-size:18px">${_dlEsc((it.title||'?')[0].toUpperCase())}</div>`;
  const rankCol = _dlIsRanked
    ? `<div class="dl-list-rank ${rank <= 3 ? 'dl-top3' : ''}">${rank}</div>`
    : '';
  return `<div class="dl-list-row ${_dlIsRanked ? 'dl-ranked' : ''}" onclick="goToTitle('${it.media_type}', ${it.id})">
    ${rankCol}
    <div class="dl-list-poster">${posterInner}</div>
    <div style="min-width:0">
      <div class="dl-list-title">${_dlEsc(it.title)}</div>
      ${it.year ? `<div class="dl-list-year">${_dlEsc(it.year)}</div>` : ''}
    </div>
    <span class="dl-list-type">${_dlTypeLabel(it.media_type)}</span>
  </div>`;
}

function _dlRenderViewToggle() {
  document.getElementById('dlViewToggle').innerHTML = `
    <button class="vt-btn ${_dlView==='list'?'active':''}" onclick="_dlSetView('list')" title="List view">${icon('list',13)}</button>
    <button class="vt-btn ${_dlView==='grid'?'active':''}" onclick="_dlSetView('grid')" title="Grid view">${icon('grid',13)}</button>`;
}

let _dlAllItems = [];
let _dlRevealObserver = null;

function _dlSetView(v) {
  if (v === _dlView) return;
  _dlView = v;
  localStorage.setItem('disc_listView', v);
  const grid = document.getElementById('dlGrid');
  grid.className = v === 'list' ? 'dl-list' : 'dl-grid';
  // Items already fetched aren't re-fetched, just redrawn in the new view.
  grid.innerHTML = _dlAllItems.map((it, i) => v === 'list' ? _dlListRowHTML(it, i + 1) : _dlCardHTML(it, i + 1)).join('');
  _dlRenderViewToggle();
  _dlObserveNewCards();
}

function _dlObserveNewCards() {
  if (!_dlRevealObserver) {
    _dlRevealObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('dl-in-view');
          _dlRevealObserver.unobserve(entry.target);
        }
      });
    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.05 });
  }
  const grid = document.getElementById('dlGrid');
  const selector = _dlView === 'list' ? '.dl-list-row:not(.dl-in-view)' : '.dl-card:not(.dl-in-view)';
  grid.querySelectorAll(selector).forEach(el => _dlRevealObserver.observe(el));
}

async function _dlLoadMore() {
  if (_dlLoading || _dlDone) return;
  _dlLoading = true;
  try {
    const items = await _dlCategory.fetch(_dlPage);
    if (!items.length) {
      _dlDone = true;
      document.getElementById('dlEndMsg').style.display = '';
      return;
    }
    _dlAllItems = _dlAllItems.concat(items);
    const grid = document.getElementById('dlGrid');
    const startRank = _dlAllItems.length - items.length + 1;
    grid.insertAdjacentHTML('beforeend', items.map((it, i) => _dlView === 'list' ? _dlListRowHTML(it, startRank + i) : _dlCardHTML(it, startRank + i)).join(''));
    _dlObserveNewCards();
    _dlPage++;
    if (_dlPage > 20) { _dlDone = true; } // TMDB caps around here for these endpoints anyway
  } catch (e) {
    console.error('Discover list fetch error:', e);
    _dlDone = true;
  } finally {
    _dlLoading = false;
  }
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('dlTitle').textContent = _dlTitle;
  document.title = _dlTitle + ' — MyScreenScore';
  document.getElementById('dlGrid').className = _dlView === 'list' ? 'dl-list' : 'dl-grid';
  _dlRenderViewToggle();

  initPageGuest(async () => {
    await _dlLoadMore();

    const sentinel = document.getElementById('dlSentinel');
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(entry => { if (entry.isIntersecting) _dlLoadMore(); });
    }, { rootMargin: '400px' });
    obs.observe(sentinel);
  });
});
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(r => console.log('SW registered:', r.scope))
      .catch(e => console.warn('SW failed:', e));
  });
}
</script>
</body>
</html>
