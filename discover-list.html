<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="js/consent.js"></script>
<script src="js/splash.js"></script>
<script src="js/i18n.js"></script>
<title>MyScreenFolio</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/discover.css">
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#F3EEDC">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MyScreenFolio">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/svg+xml" sizes="any" href="icons/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
</head>
<body>
<div class="page-wrap dl-wrap">
  <!-- The Discover list page (Discover redesign): list-view.html's hero — a tall cinematic backdrop from the
       list's own titles (its #1, or the first five in turn for lists that change all the time), the name,
       description and stats on glass, your progress beside them — then Sort · Filter · List / Grid and the titles. -->
  <div class="lh-crumb" role="navigation" aria-label="Breadcrumb"><a id="dlBack" href="discover.html">‹ Discover</a><span class="dh-crumb-sep" aria-hidden="true">/</span><span>Browse by list</span></div>
  <header class="lh dh" id="dlHero">
    <span class="lh-shade" aria-hidden="true"></span>
    <div class="lh-top"><span class="dh-cap" id="dlCap" aria-hidden="true"></span></div>
    <div class="lh-in">
      <div class="lh-text">
        <div class="dh-eyebrow" id="dlEyebrow"></div>
        <h1 class="lh-title" id="dlTitle">Loading…</h1>
        <p class="lh-desc" id="dlDesc" hidden></p>
      </div>
      <div class="dh-side">
        <dl class="lh-stats" id="dlStats" hidden></dl>
        <section class="dh-prog" id="dlProg" aria-label="Your progress" hidden></section>
      </div>
    </div>
  </header>

  <div class="lv-bar dl-bar">
    <div class="lv-bar-l"><span class="dl-count" id="dlCount" aria-live="polite"></span></div>
    <div class="lv-bar-r">
      <div id="dlSfBar" class="lv-sf-bar"></div>
      <div class="view-toggle" id="dlViewToggle"></div>
    </div>
  </div>
  <div id="dlGrid"><div class="page-loading" data-skel="dl-page"></div></div>
  <div class="dl-end-msg" id="dlEndMsg" hidden>You've reached the end.</div>
</div>

<script src="js/vendor/supabase-2.118.0.js"></script>
<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/nav.js"></script>
<script src="js/info-popup.js"></script>
<script src="js/title-view.js"></script>
<script src="js/sort-filter.js"></script>
<script src="js/discover-categories.js"></script>
<script src="js/discover-results.js"></script>
<script>
const _dlParams = new URLSearchParams(location.search);
const _dlCategory = getDiscoverCategory(_dlParams.get('list') || 'trending_week');
const _dlMeta = discoverMeta(_dlCategory.key);
const _dlTitle = _dlCategory.title || _dlParams.get('title') || 'Discover';
const _dlIsMss = !!_dlMeta.mss;
const _dlRanked = !!_dlMeta.ranked;
const _dlTop = _dlCategory.key === 'top_seasons' || _dlCategory.key === 'top_episodes';
const _dlUpcoming = _dlCategory.key.startsWith('upcoming');

let _dlPage = 1, _dlLoading = false, _dlDone = false, _dlAllItems = [];
let _dlView = 'grid';   // a list always opens in Grid (owner); List is a switch for this visit only
const $dl = id => document.getElementById(id);

// A type tag only where a list mixes movies and shows (the list's name already says it otherwise)
const _dlType = () => _dlMeta.kind === 'mixed' ? undefined : false;
const _dlRecs = _dlCategory.key === 'recommended';   // Picked for your taste / Recommended for you: never in your library, so no progress box
const _dlItemHTML = (it, rank) => _dlView === 'list'
  ? MSSResults.row(it.why ? { ...it, sub: it.why } : it, { rank, mss: _dlIsMss, type: _dlType() })   // a recommendation: its reason under the title
  : it.why ? MSSResults.recCard(it, 'all')                          // a recommendation: its reason and Wild card (Not interested: the title's ⋯)
  : MSSResults.card(it, { rank, type: _dlType() });
MSSResults.recHooks('all', { gone: it => { _dlAllItems = _dlAllItems.filter(x => x !== it); }, undo: () => location.reload() });

/* Loading skeleton: this list's own rows (or cards) with sample text, masked (mssSkeleton, config.js) */
mssSkeleton.define('dl-page', () => {
  const it = { id: 0, title: 'Sample title', year: '2024', media_type: 'tv', score: 7.5, votes: 1200, poster_url: '' };
  const w = MSSResults.wrap(_dlView, Array.from({ length: 10 }, (_, i) => _dlItemHTML(it, _dlRanked ? i + 1 : 0)).join(''));
  return `<div class="${w.cls}">${w.html}</div>`.replace(/ (id|onclick|onkeydown)="[^"]*"/g, '');
});

function _dlRenderViewToggle() { $dl('dlViewToggle').innerHTML = MSSResults.toggleHTML(_dlView, '_dlSetView'); }
function _dlSetView(v) {
  if (v === _dlView) return;
  _dlView = v;
  _dlRenderAll(); _dlRenderViewToggle();
}

/* ══ Sort · Filter (shared js/sort-filter.js): two buttons, every list ══
   Sorting or filtering a list only makes sense over the whole of it, so either one first loads the rest
   (capped lists: 250, or 500 for MSF; lists without a cap: their first 100). */
const _dlScore = it => it.score != null && !isNaN(it.score) ? Number(it.score) : null;
SF.register('dl', {
  base: () => _dlAllItems,
  render: () => _dlRenderAll(),
  defaultSort: 'rank',
  get presets() { return _dlRanked ? {} : { rank: { header: 'Order', opts: [['rank', 'List Order'], ['rankRev', 'Reversed']] } }; },
  sorts: () => ['rank', 'alpha', 'release', 'ratings'],
  filters: () => ['genre', 'year', 'score'],
  choiceFilters: () => [
    ...(_dlMeta.kind === 'mixed' && !_dlTop ? [SF.typeChoice({ cat: it => _discCatOf(it), movie: it => it.media_type === 'movie' })] : []),
    ...(!_dlIsMss && !_dlUpcoming ? [{ key: 'votes', label: 'Minimum votes', single: true,
      options: [['', _dlMeta.minVotes ? `List minimum (${_dlMeta.minVotes.toLocaleString(MSSI18n.locale)})` : 'Any'],
        ...[1000, 5000, 10000, 20000].filter(n => n > (_dlMeta.minVotes || 0)).map(n => [String(n), `${n.toLocaleString(MSSI18n.locale)}+ votes`])],
      test: (it, v) => (it.votes || 0) >= Number(v) }] : []),
    ...MSSHide.choice((it, v) => !MSSHide.hides(it.media_type, it.show_id || it.tmdb_id || it.id, v)),
  ],
  scoreOf: _dlScore,
  scoreLabel: _dlIsMss ? 'MyScreenFolio' : 'TMDB Score',
  beforeSort: () => _dlLoadAll(),
  beforeFilter: () => Promise.all([_dlLoadAll(), MSSHide.load(true).catch(() => {})]),
});
const _dlSfActive = () => SF.getSort('dl', 'all') !== 'rank' || SF.filterCount('dl', 'all') > 0;

/* ── Returning to a list lands exactly where you left: everything loaded, the sort / filter and the scroll ── */
const _DL_STATE_KEY = 'dl_state_' + _dlCategory.key + (_dlCategory.v ? '_v' + _dlCategory.v : '');
const _dlIsBack = (performance.getEntriesByType('navigation')[0] || {}).type === 'back_forward';
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
window.MSS_OWN_SCROLL = true;
function _dlSaveState() {
  try {
    sessionStorage.setItem(_DL_STATE_KEY, JSON.stringify({ t: Date.now(), items: _dlAllItems, page: _dlPage, done: _dlDone, y: window.scrollY, rows: _dlRows.n, view: _dlView,
      sf: { sort: SF.getSort('dl', 'all'), filter: SF.filterState('dl', 'all') } }));
  } catch {}
}
window.addEventListener('pagehide', _dlSaveState);
function _dlRestoreState() {
  if (!_dlIsBack) return false;
  try {
    const st = JSON.parse(sessionStorage.getItem(_DL_STATE_KEY) || 'null');
    if (!st || Date.now() - st.t > 30 * 60 * 1000 || !st.items?.length) return false;
    _dlAllItems = st.items; _dlPage = st.page; _dlDone = st.done;
    if (st.view) { _dlView = st.view; _dlRenderViewToggle(); }   // Back: the view you left it in
    if (st.sf) SF.restoreState('dl', 'all', st.sf);
    if (st.sf?.filter?.choice?.hide) MSSHide.load().then(_dlRenderAll, () => {});
    _dlRenderAll();
    if (st.rows && st.view === _dlView) { _dlRows.n = st.rows; _dlRenderAll(); }   // the rows you'd opened with Show more
    _dlHero();
    mssJumpTo(st.y || 0);
    return true;
  } catch { return false; }
}

async function _dlLoadAll() {
  const limit = _dlCategory.cap || _dlCategory.max || 100;   // max: an uncapped list's own end (MSF: 500)
  let guard = 0;
  while (!_dlDone && _dlAllItems.length < limit && guard++ < 40) {
    if (_dlLoading) { await new Promise(res => setTimeout(res, 120)); continue; }
    await _dlLoadMore();
  }
}

/* The #1, #2… a ranked list shows: its own order (or reversed), or the order by rating — filtered, they count
   within the matches. Sorted A–Z, by release etc. there are none; a list that isn't a ranking has none either. */
function _dlRankOf(n) {
  const sort = SF.getSort('dl', 'all');
  if (!_dlRanked && (sort === 'rank' || sort === 'rankRev')) return () => 0;
  if (sort === 'rank' || sort === 'highest') return i => i + 1;
  if (sort === 'rankRev' || sort === 'lowest') return i => n - i;
  return () => 0;
}
/* Whole rows, the Library's system (library-view.js LIB_ROWS): the grid starts with 5 rows and Show more adds 3;
   the list starts with 10 and adds 5 (a grid row = as many cards as fit right now). Pages come from TMDB as they're needed. */
const _DL_ROWS = { grid: [5, 3], list: [10, 5] };
const _dlRows = {};
function _dlCols() {
  if (_dlView === 'list') return 1;
  const g = $dl('dlGrid');
  const n = g.classList.contains('msf-grid') ? getComputedStyle(g).gridTemplateColumns.split(' ').filter(t => /^[\d.]+px$/.test(t)).length : 0;
  return Math.max(1, n || Math.floor((g.clientWidth || innerWidth) / (innerWidth <= 600 ? 130 : 240)) || 5);
}
const _dlWant = () => (_dlRows.n || _DL_ROWS[_dlView][0]) * _dlCols();
let _dlShown = 0;
function _dlRenderAll() {
  const grid = $dl('dlGrid');
  const list = _dlSfActive() ? SF.list('dl', 'all') : _dlAllItems;
  const rankOf = _dlRankOf(list.length);
  const sig = [SF.getSort('dl', 'all'), JSON.stringify(SF.filterState('dl', 'all')), _dlView].join('|');
  if (_dlRows.sig !== sig) Object.assign(_dlRows, { sig, n: _DL_ROWS[_dlView][0] });
  if (!list.length && _dlAllItems.length) {
    grid.className = '';
    grid.innerHTML = mssEmpty({ compact: true, art: 'filter', title: 'Nothing matches these filters', text: 'Your filters are a little too picky. Loosen one and try again.',
      actions: [{ label: 'Clear filters', icon: 'x', onclick: "SF.clearFilters('dl', 'all'); _dlRenderAll()", primary: true }] });
    _dlShown = 0;
  } else {
    const w = MSSResults.wrap(_dlView, '');
    grid.className = w.cls;                                   // the real grid first, so its columns can be counted
    const cols = _dlCols(); _dlRows.cols = cols;
    const count = Math.min(list.length, _dlRows.n * cols);
    _dlShown = count;
    const more = list.length > count || (!_dlDone && !_dlSfActive());
    const left = _dlSfActive() ? list.length - count : (_dlCategory.cap ? Math.min(_dlCategory.cap, _dlDone ? list.length : _dlCategory.cap) - count : list.length - count);
    const step = _DL_ROWS[_dlView][1] * cols;
    grid.innerHTML = list.slice(0, count).map((it, i) => _dlItemHTML(it, rankOf(i))).join('')
      + (more ? `<div class="msf-more dl-more"><button type="button" class="msf-more-btn" onclick="_dlMore()">Show ${left > 0 ? Math.min(left, step) : step} more${left > 0 ? ` <small>· ${left.toLocaleString(MSSI18n.locale)} left</small>` : ''}</button></div>` : '');
  }
  $dl('dlSfBar').innerHTML = SF.bar('dl', 'all');
  _dlCount();
}
// Show more: the next rows come in under the ones you've seen — the page stays where you are
async function _dlMore() {
  const btn = document.querySelector('.dl-more .msf-more-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Loading…'; }
  const y = scrollY, from = _dlShown;
  _dlRows.n += _DL_ROWS[_dlView][1];
  await _dlFill();
  _dlRenderAll();
  scrollTo({ top: y, behavior: 'instant' });
  const el = $dl('dlGrid').children[from];
  (el?.matches('[role="button"]') ? el : el?.querySelector('[role="button"]'))?.focus({ preventScroll: true });
}
// loads TMDB pages until there are enough titles for the rows on show
async function _dlFill() {
  let guard = 0;
  while (!_dlDone && !_dlSfActive() && _dlAllItems.length < _dlWant() && guard++ < 20) {
    if (_dlLoading) { await new Promise(res => setTimeout(res, 120)); continue; }
    await _dlLoadMore();
  }
}
// a wider or narrower window changes how many fit in a row: whole rows again
let _dlResizeT = 0;
addEventListener('resize', () => { clearTimeout(_dlResizeT); _dlResizeT = setTimeout(async () => {
  if (_dlView !== 'grid' || !_dlRows.cols || _dlCols() === _dlRows.cols) return;
  await _dlFill(); _dlRenderAll();
}, 200); }, { passive: true });
function _dlCount() {
  const all = _dlSfActive() ? SF.list('dl', 'all').length : _dlAllItems.length;
  const total = _dlCategory.cap && !_dlSfActive() ? (_dlDone ? all : _dlCategory.cap) : (_dlDone || _dlSfActive() ? all : null);
  $dl('dlCount').textContent = !_dlAllItems.length ? '' : _dlSfActive() ? `${_dlShown} of ${all} ${all === 1 ? 'match' : 'matches'}`
    : total ? `Showing ${_dlShown} of ${total}` : `Showing ${_dlShown}`;
}

/* ── The hero ── */
let _dlRot = null;
const _dlFmt = n => Number(n).toLocaleString(MSSI18n.locale);
function _dlHero() {
  const items = _dlAllItems;
  // the stats that say something about THIS list (never all of them everywhere)
  const scored = items.map(_dlScore).filter(v => v != null);
  const avg = scored.length ? scored.reduce((a, b) => a + b, 0) / scored.length : null;
  const stat = (k, v) => `<div class="lh-stat"><dt>${k}</dt><dd>${v}</dd></div>`;
  const s = [];
  if (_dlCategory.cap) s.push(stat('Titles', `<b>${_dlFmt(_dlCategory.cap)}</b>`));
  if (_dlIsMss) s.push(stat('Titles', `<b>Top 500</b>`));
  if (avg != null) s.push(stat(_dlIsMss ? 'Average · MSF' : `Average · ${_dlDone || items.length >= (_dlCategory.cap || Infinity) ? 'TMDB' : 'top ' + items.length}`, `<span class="lh-score msf-score is-tmdb">★ ${_discFloorScore(avg)}</span>`));
  if (_dlMeta.minVotes) s.push(stat('Min. votes', `<b>${_dlFmt(_dlMeta.minVotes)}</b>`));
  if (_dlCategory.key.startsWith('niche')) s.push(stat('Votes', `<b>50–300</b>`));
  if (_dlMeta.rotate && !_dlUpcoming) s.push(stat('Updated', 'Every day'));
  if (_dlUpcoming) s.push(stat('Coming', 'Soon'));
  if (_dlTop) s.push(stat('Updated', 'Every week'));
  if (_dlRecs && items.length) {
    const wild = items.filter(it => it.kind === 'wild').length;
    s.unshift(stat('Titles', `<b>${_dlFmt(items.length)}</b>`));
    if (wild) s.push(stat('Wild cards', `<b>${wild}</b>`));
  }
  if (_dlIsMss) s.push(stat('Ranked by', 'Members’ scores'));
  else if (_dlRanked && !_dlMeta.rotate) s.push(stat('Ranked by', 'TMDB score'));
  if (_dlMeta.kind === 'mixed' && !_dlTop && items.length) {
    const m = items.filter(it => it.media_type === 'movie').length;
    s.push(stat('Mix', `${m} films · ${items.length - m} shows`));
  }
  $dl('dlStats').innerHTML = s.slice(0, 4).join('');
  $dl('dlStats').hidden = !s.length;
  _dlProgress();
  if (!_dlRot && items.length) {
    const cap = $dl('dlCap');
    const name = it => it.sub ? `${it.title} · ${it.sub}` : it.title;
    _dlRot = MSSResults.rotate($dl('dlHero'), items, _dlMeta.rotate
      ? { count: 5, ms: 13000, captionEl: cap, caption: (it, i) => `<span>${_dlRanked ? '#' + (i + 1) : 'Featuring'}</span> <b translate="no">${escHTML(name(it))}</b>` }
      : { single: true, captionEl: cap, caption: (it, i) => `<span>#${i + 1}</span> <b translate="no">${escHTML(_dlRecs ? it.title : name(it))}</b>` });
  }
}
// Your progress: how many of the titles loaded so far you've seen (upcoming lists: how many are on your list),
// and the next one that isn't in your library — signed in only
function _dlProgress() {
  const box = $dl('dlProg');
  if (!window._navUser || !_dlAllItems.length || _dlRecs) { box.hidden = true; return; }
  const items = _dlAllItems.filter(it => !it.href && it.id != null);
  if (!items.length) { box.hidden = true; return; }
  const st = items.map(it => MSSResults.stateOf(it));
  const n = _dlUpcoming ? st.filter(Boolean).length : st.filter(s => s && (s.k === 'seen' || s.k === 'off' || s.score != null)).length;
  const nextI = st.findIndex(s => !s), next = items[nextI];
  const all = _dlDone || (_dlCategory.cap && items.length >= _dlCategory.cap);
  const of = all ? `of all ${items.length}` : _dlRanked ? `of the top ${items.length}` : `of these ${items.length}`;
  const pct = Math.round(n / items.length * 100);
  if (next) window._discItemMap[`${next.media_type}:${next.id}`] = next;
  box.innerHTML = `<div class="dh-prog-h">Your progress</div>
    <div class="dh-prog-n"><b>${n}</b><span>${of} ${_dlUpcoming ? 'on your list' : 'seen'}</span></div>
    <div class="dh-prog-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" aria-label="${pct}% ${_dlUpcoming ? 'on your list' : 'seen'}"><i style="width:${pct}%"></i></div>
    ${next ? `<button type="button" class="dh-prog-next" onclick="MSSInfo.fromDiscover(window._discItemMap['${next.media_type}:${next.id}'])">Next not in your library: <b translate="no">${_dlRanked ? '#' + (nextI + 1) + ' ' : ''}${escHTML(next.title)}</b></button>`
      : `<div class="dh-prog-next is-done">${icon('check', 13)} Every one of these is in your library</div>`}`;
  box.hidden = false;
}

async function _dlLoadMore() {
  if (_dlLoading || _dlDone) return;
  _dlLoading = true;
  try {
    let items = await _dlCategory.fetch(_dlPage);
    await MSSResults.ready();                                 // your marks are there before anything is drawn
    $dl('dlGrid').querySelector(':scope > .page-loading')?.remove();
    // TMDB's pages can overlap (a title moving up while you scroll): each title once
    const have = new Set(_dlAllItems.map(it => `${it.media_type}:${it.id}`));
    const fresh = items.filter(it => it.id == null || !have.has(`${it.media_type}:${it.id}`) && have.add(`${it.media_type}:${it.id}`));
    if (items.length && !fresh.length) { _dlPage++; return; }
    items = fresh;
    if (_dlCategory.cap) items = items.slice(0, Math.max(0, _dlCategory.cap - _dlAllItems.length));
    if (!items.length) {
      _dlDone = true;
      if (!_dlAllItems.length) {
        $dl('dlGrid').className = '';
        $dl('dlGrid').innerHTML = mssEmpty({ art: 'search', title: 'Nothing here yet', text: _dlCategory.emptyMsg || 'This list is empty right now. Check back soon.' });
      }
      _dlHero();
      return;
    }
    const startRank = _dlAllItems.length + 1;
    if (startRank === 1 && _dlCategory.lazy) _discSaveTilePosters(_dlCategory.key, items);   // its Discover tile shows this top three until the list is opened again
    items.forEach((it, i) => { it._rank = startRank + i; });
    _dlAllItems = _dlAllItems.concat(items);                 // drawn by whoever asked (_dlFill → _dlRenderAll)
    _dlPage++;
    if ((_dlCategory.cap && _dlAllItems.length >= _dlCategory.cap) || _dlPage > 30) _dlDone = true;
    _dlHero();
  } catch (e) {
    console.error('Discover list fetch error:', e);
    _dlDone = true;
    if (!_dlAllItems.length) mssErrorPage(mssTmdbErrorKind(e, 'tmdb'), { error: e });
    else if (isRateLimitError(e)) { const end = $dl('dlEndMsg'); end.textContent = 'TMDB is busy right now — please refresh in a moment to keep browsing.'; end.hidden = false; }
  } finally { _dlLoading = false; }
}

document.addEventListener('DOMContentLoaded', () => {
  document.title = _dlTitle + ' — MyScreenFolio';
  $dl('dlTitle').textContent = _dlTitle;
  $dl('dlEyebrow').textContent = _dlMeta.eyebrow;
  $dl('dlDesc').textContent = _dlMeta.desc || '';
  $dl('dlDesc').hidden = !_dlMeta.desc;
  $dl('dlHero').style.setProperty('--dh-a', _dlMeta.a);
  $dl('dlHero').style.setProperty('--dh-b', _dlMeta.b);
  const fromDiscover = _dlParams.get('from') === 'discover';    // Picked for your taste's See all on Discover (Home's goes back Home)
  if (_dlCategory.backTo && !fromDiscover) { $dl('dlBack').href = _dlCategory.backTo; $dl('dlBack').textContent = '‹ Home'; }
  if (_dlRecs) $dl('dlBack').nextElementSibling.nextElementSibling.textContent = 'Recommendations';   // not "Browse by list"
  _dlRenderViewToggle();
  $dl('dlSfBar').innerHTML = SF.bar('dl', 'all');

  initPageGuest(async () => {
    if (_dlRestoreState()) return;
    $dl('dlGrid').className = MSSResults.wrap(_dlView, '').cls;   // the real grid, so the first rows know how many fit
    await (_dlRecs ? _dlLoadAll() : _dlFill());               // recommendations are worked out already: all of them, so the stats count them all
    if (_dlAllItems.length) _dlRenderAll();
  });
  // added or removed something elsewhere on the page (a title's panel): the marks and your progress follow
  document.addEventListener('mss:library-changed', () => { if (!window._navUser) return; MSSResults.refresh().then(() => { _dlRenderAll(true); _dlProgress(); }).catch(() => {}); });
});
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(r => console.log('SW registered:', r.scope))
      .catch(e => console.warn('SW failed:', e));
  });
}
</script>
</body>
</html>
