/* ═══════════════════════════════════════════════════════════════
   The person page (person page redesign, 14 Nov 2026) — one page for actors, directors, writers and crew.
   The hero pages' hero, slim bar, tabs and phone bar (.tp-*, style.css) over the title view (.tv-*).
   Logic: js/person-page.js.
═══════════════════════════════════════════════════════════════ */
.pp-wrap { max-width:none; position:relative; }

/* ── the hero ── */
.pp-hero .tv-poster { border-radius:var(--radius); }
.pp-hero.pp-blur .tv-hero-bg { filter:blur(18px) saturate(.8); transform:scale(1.15); }
.pp-badge { letter-spacing:.12em; text-transform:uppercase; font-size:10.5px; font-weight:800; }

.pp-hbio { margin:0; font:500 14px/1.6 'Manrope',var(--sans); color:rgba(255,255,255,.82); display:-webkit-box; -webkit-line-clamp:3; line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.pp-more-link { padding:0; border:none; background:none; font:700 13px 'Manrope',var(--sans); color:var(--olive-light); cursor:pointer; }
.pp-more-link:hover { text-decoration:underline; text-underline-offset:3px; }
.pp-more-link:focus-visible { outline:2px solid var(--olive-light); outline-offset:2px; border-radius:3px; }
.pp-hero .pp-more-link { color:var(--tv-green); }
.pp-scores { flex:none; align-self:flex-end; }
.pp-from { display:inline-flex; align-items:center; gap:6px; max-width:min(320px, 45vw); min-height:32px; padding:0 12px; border-radius:999px; background:rgba(0,0,0,.5);
  border:1px solid rgba(255,255,255,.2); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); color:rgba(255,255,255,.85); font:600 12px 'Manrope',var(--sans); text-decoration:none; }

.pp-from:hover { color:#fff; border-color:rgba(255,255,255,.4); }
.pp-from:focus-visible { outline:2px solid var(--tv-green); outline-offset:2px; }
.pp-page.is-phone .pp-scores { display:none; }
.pp-page.is-phone .pp-hero .tp-acts { display:flex; }   /* Share stays in the hero on phones (no action bar on this page) */
/* the hero's box: You & [name] (signed in) or the career numbers (guests) */
.pp-you-ph { display:none; }
.pp-page.is-phone .pp-you-ph { display:block; margin-top:14px; }
.pp-page.is-phone .pp-you-ph .tp-tiles { grid-template-columns:repeat(3, minmax(0, 1fr)); }
.pp-you { width:300px; padding:14px 16px; border-radius:var(--radius); border:1px solid rgba(255,255,255,.2); background:rgba(0,0,0,.6); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); color:#fff; }
.pp-you h3 { margin:0; font:800 10px/1.2 'Manrope',var(--sans); letter-spacing:.16em; text-transform:uppercase; color:var(--tv-green); }
.pp-you-big { display:flex; align-items:baseline; gap:8px; margin:6px 0 8px; }
.pp-you-big b { font:400 40px/1 var(--bebas); letter-spacing:.02em; color:#fff; white-space:nowrap; }
.pp-you-big span { font:600 12.5px/1.3 'Manrope',var(--sans); color:rgba(255,255,255,.8); }
.pp-you-bar { display:block; height:5px; margin:-2px 0 12px; border-radius:3px; background:rgba(255,255,255,.18); overflow:hidden; }
.pp-you-bar i { display:block; height:100%; border-radius:inherit; background:var(--tv-gold); }
.pp-you-tiles { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:6px; }
.pp-you-tiles .tp-tile { min-height:56px; background:rgba(255,255,255,.06); }
.pp-you-tiles .tp-tile b { font-size:23px; }
.pp-you-foot { display:flex; flex-wrap:wrap; justify-content:space-between; gap:4px 12px; margin:10px 0 0; font:500 11.5px 'Manrope',var(--sans); color:rgba(255,255,255,.72); }
.pp-you-foot b { color:#fff; font-weight:700; }
.pp-page.is-phone .pp-you, .pp-page:not(.is-phone) .pp-you-ph .pp-you { width:100%; }
@media (max-width:1100px) { .pp-page:not(.is-phone) .pp-you-ph .pp-you { width:min(420px, 100%); } }
.pp-hero .tv-title { overflow-wrap:normal; word-break:normal; }
/* tablets: the career tiles go under the hero so the name keeps its room */
@media (max-width:1100px) {
  .pp-page:not(.is-phone) .pp-scores { display:none; }
  .pp-page:not(.is-phone) .pp-you-ph { display:flex; justify-content:flex-end; margin-top:18px; }

}
.pp-page.is-phone .pp-hero .tv-hero-main { margin-top:96px; }
.pp-page.is-phone .pp-born { font-size:12.5px; }

/* ── sections ── */

.pp-feat .lyr-seg + .pp-note { margin-top:10px; }
.pp-feat .lyr-seg, .pp-tools .lyr-seg { display:inline-flex; }
.pp-feat .lyr-seg-opt, .pp-tools .lyr-seg-opt { flex:none; padding:0 16px; white-space:nowrap; }
.pp-page.is-phone .pp-feat .lyr-seg, .pp-page.is-phone .pp-tools .lyr-seg { display:flex; }

.pp-none { margin:0; font:500 13.5px 'Manrope',var(--sans); color:var(--text-3); }

.pp-foot { display:flex; justify-content:center; margin-top:16px; }

.pp-bio { margin:0; font:500 14px/1.7 'Manrope',var(--sans); color:var(--text-2); white-space:pre-line; display:-webkit-box; -webkit-line-clamp:7; line-clamp:7; -webkit-box-orient:vertical; overflow:hidden; }
.pp-bio.is-full { display:block; -webkit-line-clamp:unset; line-clamp:unset; overflow:visible; font-size:15px; line-height:1.8; max-width:none; }

/* ── rows: year · poster · title + roles · ✓ · TMDB on the far right ── */
.pp-rows { display:flex; flex-direction:column; margin-top:10px; }
.pp-row { position:relative; display:flex; align-items:center; gap:14px; padding:10px 6px; border-top:1px solid var(--border); border-radius:var(--radius-sm); }
.pp-rows > .pp-row:first-child { border-top:none; }
.pp-row:hover { background:var(--olive-faint); }
.pp-row-link { position:absolute; inset:0; z-index:0; border-radius:inherit; }
.pp-row-link:focus-visible { outline:2px solid var(--olive-light); outline-offset:-2px; }
.pp-row:hover .pp-row-b b { text-decoration:underline; text-underline-offset:3px; }
.pp-row-y { flex:none; width:44px; font:400 19px/1 var(--bebas); letter-spacing:.03em; color:var(--text-3); }
.pp-row-y.is-rank { width:30px; text-align:center; font-size:26px; color:var(--olive-light); }
.pp-row-p { flex:none; width:52px; aspect-ratio:2/3; border-radius:6px; overflow:hidden; background:var(--raised); border:1px solid var(--border); display:grid; place-items:center; }
.pp-row-p img { width:100%; height:100%; object-fit:cover; display:block; }
.pp-row-p i { font:600 18px var(--serif); font-style:normal; color:var(--text-3); }
.pp-row-b { flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }

.pp-row-o { font:500 13.5px/1.6 'Manrope',var(--sans); color:var(--text-2); white-space:normal; max-width:72ch; }
.pp-seen { position:relative; z-index:1; flex:none; display:grid; place-items:center; width:26px; height:26px; border-radius:50%; color:var(--olive-light); background:var(--olive-faint); border:1px solid var(--border-olive); }
.pp-chip { position:relative; z-index:1; flex:none; min-width:54px; border:none; }
.pp-chip.is-dropped { filter:grayscale(1); opacity:.75; }
.pp-scores-r { position:relative; z-index:1; flex:none; display:flex; align-items:center; gap:6px; }
.pp-add { background:var(--olive-faint); color:var(--olive-light); box-shadow:inset 0 0 0 1px var(--border-olive); }
.pp-add:hover { background:var(--olive); color:var(--text-on-brand); }
/* bars to compare You · MSF · TMDB (wider screens) */
.pp-cmps { position:relative; z-index:1; flex:none; width:clamp(90px, 12vw, 170px); display:flex; flex-direction:column; justify-content:center; gap:4px; padding:4px 0; border:none; background:none; cursor:pointer; }

.pp-cmp { display:block; height:5px; border-radius:3px; background:var(--bg-3); overflow:hidden; }
.pp-cmp i { display:block; height:100%; border-radius:inherit; }
.pp-cmp.is-you i { background:var(--score-mine); }

.pp-cmp.is-tmdb i { background:var(--text-3); }
.pp-page.is-phone .pp-cmps { display:none; }
/* phones: the title gets the full width, the ✓ and the scores go on the line under it */
.pp-page.is-phone .pp-row { display:grid; grid-template-columns:auto auto minmax(0, 1fr) auto; grid-template-areas:"y p b s" "y p b s"; grid-template-rows:auto auto; column-gap:8px; row-gap:4px; align-items:center; }
.pp-page.is-phone .pp-row-b { align-self:end; }
.pp-page.is-phone .pp-row-y { grid-area:y; }
.pp-page.is-phone .pp-row-p { grid-area:p; }
.pp-page.is-phone .pp-row-b { grid-area:b; }
.pp-page.is-phone .pp-scores-r { grid-area:s; justify-self:end; align-self:center; }
.pp-page.is-phone .pp-scores-r { gap:4px; }
/* the Overview's featured rows: big posters */
/* the Overview's featured rows: the Filmography table with bigger posters, two lines of the overview, ⌄ to open */
.pp-tbl.pp-film { --pp-cols:48px 60px minmax(0, 1fr) 26px clamp(100px, 11vw, 160px) auto; }
.pp-tbl .pp-row.is-film { grid-template-areas:"y p b k c s"; }

.pp-row-d { margin-top:3px; font:500 13px/1.5 'Manrope',var(--sans); color:var(--text-2); display:-webkit-box; -webkit-line-clamp:2; line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.pp-page.is-phone .pp-row-d { display:none; }
/* the timeline: decades that close */
.pp-dec { margin-top:12px; }
.pp-thead + .pp-dec { margin-top:8px; }
.pp-dec > summary { display:flex; align-items:center; gap:10px; padding:8px 12px; cursor:pointer; list-style:none; border-radius:var(--radius-sm); background:var(--olive-faint); border:1px solid var(--border-olive); }
.pp-dec > summary:hover { border-color:var(--olive-light); }
.pp-dec > summary::-webkit-details-marker { display:none; }
.pp-dec > summary b { font:400 20px/1 var(--bebas); letter-spacing:.05em; color:var(--olive-light); }
.pp-dec > summary span { font:600 12px 'Manrope',var(--sans); color:var(--text-3); }
.pp-dec > summary svg { margin-inline-start:auto; color:var(--text-3); transition:transform .15s; }

.pp-dec > summary:focus-visible { outline:2px solid var(--olive-light); outline-offset:2px; border-radius:4px; }
/* Filmography decades: a quiet band with the count */

/* ── credits by role ── */
.pp-rbar { display:flex; gap:2px; height:10px; border-radius:6px; overflow:hidden; }
.pp-rbar i { min-width:4px; }
.pp-r0 { background:var(--olive); } .pp-r1 { background:var(--olive-light); } .pp-r2 { background:var(--band-good); }

.pp-rbtn i { flex:none; width:10px; height:10px; border-radius:3px; }

.pp-rbtn:focus-visible { outline:2px solid var(--olive-light); outline-offset:2px; }

/* ── people (collaborators): a grid; a row that scrolls sideways on phones ── */

.pp-page.is-phone .pp-people { display:flex; overflow-x:auto; gap:12px; padding-bottom:6px; scroll-snap-type:x proximity; scrollbar-width:none; }

/* ── Filmography: role, Movies | TV Shows, Sort & Filter ── */
.pp-tools { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:6px; }
.pp-tools-gap { flex:1; }
.pp-role { min-height:40px; gap:8px; font-weight:700; }
.pp-only { display:inline-flex; align-items:center; min-height:40px; padding:0 14px; border-radius:var(--radius-sm); background:var(--bg-3); border:1px solid var(--border); font:700 13px 'Manrope',var(--sans); color:var(--text); }
#ppMediaSeg { display:contents; }
.pp-decall { min-height:36px; gap:6px; font-size:12.5px; }
.pp-decall svg { transition:transform .15s; }
.pp-decall[aria-expanded="false"] svg { transform:rotate(-90deg); }
.pp-sum { font:600 12.5px 'Manrope',var(--sans); color:var(--text-3); white-space:nowrap; }
/* ── Filmography as a table: Year · poster · Title (+ genres) · Role / Character · ✓ · Compare · You · MSF · TMDB ── */
.pp-film { --pp-cols:48px 46px minmax(0, 1.5fr) minmax(0, 1fr) 26px clamp(100px, 10vw, 150px) auto; }
.pp-thead { display:grid; grid-template-columns:var(--pp-cols); column-gap:16px; align-items:end; padding:14px 12px 8px; border-bottom:1px solid var(--border);
  font:800 10px/1 'Manrope',var(--sans); letter-spacing:.14em; text-transform:uppercase; color:var(--text-3); }
.pp-th-s { display:flex; gap:6px; justify-content:flex-end; }

.pp-row.is-film { display:grid; grid-template-columns:var(--pp-cols); grid-template-areas:"y p b r k c s"; column-gap:16px; padding:10px 12px; }

.pp-row.is-film .pp-row-sub { display:none; }
.pp-row-g { font:500 12px 'Manrope',var(--sans); color:var(--text-3); }
.pp-row-r { grid-area:r; position:relative; z-index:0; min-width:0; display:flex; flex-direction:column; gap:3px; font:500 13px/1.4 'Manrope',var(--sans); color:var(--text-2); }
.pp-row-r > span { display:block; overflow:hidden; text-overflow:ellipsis; }
.pp-row-r .pp-tag { margin:0 4px 4px 0; }
.pp-row-r small { font:500 11.5px 'Manrope',var(--sans); color:var(--text-3); }
.pp-as { font-weight:600; color:var(--text-3); }
.pp-tag { display:inline-flex; align-items:center; min-height:22px; padding:0 8px; border-radius:999px; background:var(--raised); border:1px solid var(--border); font:600 11.5px 'Manrope',var(--sans); color:var(--text-2); white-space:nowrap; }
.pp-row.is-film .pp-seen { grid-area:k; }
.pp-row.is-film .pp-cmps { grid-area:c; width:100%; }
.pp-row.is-film .pp-scores-r { grid-area:s; justify-self:end; }

@media (max-width:1100px) {

}
.pp-page.is-phone .pp-thead, .pp-page.is-phone .pp-row.is-film .pp-row-r { display:none; }

/* ── Photos ── */
.pp-photos { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:12px; }
.pp-ph { padding:0; aspect-ratio:2/3; border-radius:var(--radius-sm); overflow:hidden; border:1px solid var(--border); background:var(--raised); cursor:zoom-in; }
.pp-ph img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .2s; }
