<body>
<div class="page-wrap">

  <div class="cat-page-header fade-up">
    <div>
      <h1 class="cat-page-title">Library</h1>
      <div class="cat-page-sub" id="libPageSub"></div>
    </div>
  </div>

  <div id="libraryLoading"><div class="page-loading"><div class="spinner"></div></div></div>
  <div id="libraryContent" style="display:none"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>

<script src="js/rating-popup.js"></script>
<script src="js/comments.js"></script>
<script src="js/note-popup.js"></script>
<script>
/* ── State ── */
var _pUser = null, _pProfile = null, _pEntries = [];

/* ── Init ── */
// Returning via browser back/forward can restore this page from the
// bfcache with stale data (e.g. an entry just added/edited elsewhere
// wouldn't show up here) instead of re-running this page's scripts.
window.addEventListener('pageshow', (event) => {
  if (event.persisted) location.reload();
});

document.addEventListener('DOMContentLoaded', function() {
  initPage(async function(user, profile) {
    if (!user) {
      document.querySelector('.page-wrap').innerHTML = '<div class="guest-page-state fade-up"><div class="guest-page-icon">'+icon('user',36)+'</div><h2 class="guest-page-title">Library</h2><p class="guest-page-sub">Sign in to view your library.</p><div class="guest-cta"><a href="login.html" class="guest-btn-primary">Sign In</a><a href="login.html#signup" class="guest-btn-secondary">Create Account</a></div></div>';
      return;
    }
    _pUser = user;
    _pProfile = profile;
    _pEntries = await getEntries(user.id);

    var _libSt = computeStats(_pEntries);
    var subEl = document.getElementById('libPageSub');
    if (subEl) {
      subEl.textContent = _pEntries.length + ' entr' + (_pEntries.length !== 1 ? 'ies' : 'y')
        + ' · ' + _libSt.watching + ' watching'
        + ' · ' + _libSt.completed + ' watched';
    }

    renderLibrary();
  });
});














// After a delete from either popup: drop it from this page and re-render


// Your title: Info · Ratings · Note in one popup (MSSViews, info-popup.js). Opens on
// Ratings once it's rated/watched, otherwise on Info.

</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(r => console.log('SW registered:', r.scope))
      .catch(e => console.warn('SW failed:', e));
  });
}
</script>
</body>
</html>
