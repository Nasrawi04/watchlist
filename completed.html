<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyScreenScore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Inter:wght@300;400;500;600;700&family=Bebas+Neue&family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
/* .sort-bar::before is a decorative hairline-seam cap meant for the
   page-level sticky sort bar (shared style.css) — here #compSortBar is
   reused nested inside a non-sticky flex row, so that absolutely-
   positioned cap was rendering as a stray floating bar above this row.
   It isn't needed here since this bar was never sticky in the first place. */
#compSortBar::before { content:none; }
.comp-header{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:2.5rem;position:relative;z-index:60;}
.comp-controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.view-tabs{display:flex;background:var(--bg-3);border-radius:var(--radius-sm);padding:3px;gap:3px}
.view-tab{
  padding:7px 16px;border:none;background:transparent;color:var(--text-2);
  font-size:12px;border-radius:5px;cursor:pointer;transition:all .2s;letter-spacing:.5px;
}
.view-tab.active{background:var(--olive);color:#fff;font-weight:500}
.cat-filter{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:2rem}
.cf-btn{
  padding:6px 12px;border:0.5px solid var(--border-2);border-radius:20px;
  background:transparent;color:var(--text-2);font-size:12px;cursor:pointer;transition:all .2s;
}
.cf-btn.active{border-color:var(--olive);color:var(--olive-light);background:var(--olive-faint)}
.export-btn{
  padding:8px 16px;background:transparent;border:0.5px solid var(--border-olive);
  border-radius:var(--radius-sm);color:var(--olive-light);font-size:12px;cursor:pointer;
  transition:all .2s;white-space:nowrap;
}
.export-btn:hover{background:var(--olive-faint)}

/* Main content scroll container */
#mainContent{min-height:200px;overflow-x:hidden;}
#mainContent::-webkit-scrollbar{display:block;width:3px;}
#mainContent::-webkit-scrollbar-thumb{background:var(--border-olive);border-radius:2px;}

/* Ranked/recent list — matches library.html's .fv-ranked-list exactly */
.fv-ranked-list{display:flex;flex-direction:column;gap:10px;max-height:60vh;overflow-y:auto;overscroll-behavior-y:contain;overflow-x:hidden;scrollbar-width:none;}
.fv-ranked-list::-webkit-scrollbar{display:none;}
.fv-entry-block{display:flex;flex-direction:column;}
.fv-rank-row{display:flex;align-items:center;gap:20px;background:var(--card);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:20px 24px;min-height:160px;overflow:hidden;box-sizing:border-box;cursor:pointer;transition:border-color var(--trans) var(--ease),background var(--trans) var(--ease);}
.fv-rank-row:hover{border-color:var(--border-olive);background:var(--card-2);}
.fv-rank-num{font-family:var(--bebas);font-size:28px;font-weight:400;color:var(--text-2);text-align:center;min-width:44px;flex-shrink:0}
.fv-rank-num.top3{color:var(--olive-light)}
.fv-rank-poster{width:96px;height:136px;border-radius:var(--radius-sm);overflow:hidden;flex-shrink:0;background:var(--bg-3);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.fv-rank-poster img{width:100%;height:100%;object-fit:cover}
.fv-rank-info{flex:1;min-width:0}
.fv-rank-title{font-family:'Oswald',var(--sans);font-size:19px;font-weight:600;color:var(--text);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;overflow:hidden;}
.fv-rank-meta{font-size:12px;color:var(--text-3);margin-top:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.fv-rank-score{font-family:var(--bebas);color:var(--olive-light);font-size:clamp(17px, 3.7vw, 19px);font-weight:400;white-space:nowrap;text-align:right;flex-shrink:0}
.fv-rank-date{font-size:clamp(9px, 2.2vw, 11px);color:var(--text-3);margin-top:4px;text-align:right;}

.cat-badge{
  font-size:10px;padding:2px 8px;border-radius:20px;background:var(--olive-faint);
  border:0.5px solid var(--border-olive);color:var(--olive-light);letter-spacing:.5px;
}
/* rank-badge is now in style.css */

/* ── Grid detail popup ── */
#cpPopupOverlay {
  position:fixed;inset:0;z-index:900;
  background:rgba(0,0,0,0.72);
  display:flex;align-items:center;justify-content:center;
  padding:16px;box-sizing:border-box;
  opacity:0;transition:opacity 220ms var(--ease);
  pointer-events:none;
}
#cpPopupCard {
  background:var(--bg-2);border:1.5px solid var(--olive-light);
  box-shadow:4px 4px 0 var(--olive);border-radius:var(--radius-lg);
  width:100%;max-width:min(97vw, 760px);max-height:90dvh;overflow-y:auto;overscroll-behavior-y:contain;
  box-sizing:border-box;
  transform:translateY(18px);transition:transform 260ms var(--ease);
}

/* ── Mobile overrides ── */
@media(max-width:900px) {
  .fv-rank-row { padding:14px 16px; gap:14px; }
  .fv-rank-poster { width:70px; height:98px; }
  .fv-rank-title { font-size:15px; }
}
@media(max-width:600px) {
  .comp-header { flex-direction:column; align-items:flex-start; gap:.75rem; margin-bottom:1.5rem; }
  .comp-controls { width:100%; justify-content:flex-end; }
  .sort-bar { flex-wrap:wrap; gap:3px; }
  .sort-btn { font-size:10px; padding:4px 8px; border-radius:14px; }
  .cat-filter { gap:3px; margin-bottom:1.25rem; flex-wrap:wrap; }
  .cf-btn { font-size:10px; padding:4px 9px; border-radius:16px; }

  /* List rows — matches library.html's .fv-rank-row mobile tiers exactly */
  .fv-rank-row { padding:10px 12px; gap:10px; min-height:unset; }
  .fv-rank-poster { width:56px; height:78px; }
  .fv-rank-title { font-size:13px; }
  .fv-rank-num { font-size:20px; min-width:32px; }
}
@media(max-width:400px) {
  .fv-rank-row { padding:8px 10px; gap:8px; }
  .fv-rank-poster { width:48px; height:66px; }
  .cf-btn { font-size:9px; padding:3px 7px; }
  .cat-filter { gap:2px; }
}
</style>

<script>
let _compUser = null;
let _allCompleted = [];
let _compSort    = 'newest';
let _compView    = localStorage.getItem('mss_compView') || 'list';
let _catFilter   = '';
let _statusFilter = '';
let _exportTheme = 'dark';

/* ── Ep/runtime meta text (plain value — callers wrap it: .wg-ep on a
   poster overlay for grid cards, .w-ep-badge next to the title for
   list rows) ── */
function _entryMeta(e) {
  const isMovie = e.cat === 'movies' || (e.ratings?._media_type === 'movie');
  if (isMovie) {
    const rtH = Number(e.runtime_h)||0, rtM = Number(e.runtime_m)||0;
    if (!rtH && !rtM) return '';
    return rtH ? `${rtH}h ${rtM}m` : `${rtM}m`;
  }
  const bd = Array.isArray(e.ratings?._season_breakdown)
    ? e.ratings._season_breakdown.filter(n => parseInt(n) > 0).map(Number) : [];
  const _bdTot = bd.reduce((a,b)=>a+b,0);
  const scope = bd.length ? `S${bd.length} · E${_bdTot}`
    : (e.total_seasons && e.total_eps) ? `S${e.total_seasons} · E${e.total_eps}`
    : e.total_seasons ? `S${e.total_seasons}`
    : e.total_eps ? `${e.total_eps} eps` : '';
  return scope;
}

// Same runtime/episode info as _entryMeta, wrapped as the solid pill
// badge used everywhere else (category pages, the ratings popup) —
// _entryMeta itself returns bare text with no markup.
function _entryMetaBadge(e) {
  const text = _entryMeta(e);
  return text ? `<span class="w-ep-badge">${text}</span>` : '';
}

// Plain inline version of the always-show type badge — getTypeBadgeOverlay()
// always includes absolute-positioning classes meant for a poster corner,
// which isn't right sitting inline in a text meta row.
function _compTypeBadgeInline(e) {
  const isM = e.cat === 'movies' || (e.ratings && e.ratings._media_type === 'movie');
  return `<span class="${isM ? 'type-label' : 'type-label type-label-tv'}">${isM ? 'Movie' : 'TV Show'}</span>`;
}

function _cgBadgeHTML(rank) {
  const cls = rank===1?'cg-rank-1':rank===2?'cg-rank-2':rank===3?'cg-rank-3':'cg-rank-other';
  return `<div class="cg-rank-badge ${cls}">${rank}</div>`;
}

function _enjoymentValComp(e) {
  const v = e.ratings?.enjoyment;
  return (v !== undefined && v !== null && v !== '') ? Number(v) : null;
}

/* Generic version — this page mixes every category together, so ratings
   are looked up directly by key on whatever the entry actually has. */
function _ratingVal(e, key) {
  const v = e.ratings?.[key];
  return (v !== undefined && v !== null && v !== '') ? Number(v) : null;
}

function _cgEnjoymentBadgeHTML(e) {
  const val = _enjoymentValComp(e);
  if (val == null) return `<div class="cg-score-badge cg-score-none">-</div>`;
  let cls;
  if (val >= 10) cls = 'cg-score-10';
  else if (val >= 9) cls = 'cg-score-9';
  else if (val >= 8) cls = 'cg-score-8';
  else if (val >= 7) cls = 'cg-score-7';
  else if (val >= 6) cls = 'cg-score-6';
  else if (val >= 3) cls = 'cg-score-3-5';
  else cls = 'cg-score-0-2';
  return `<div class="cg-score-badge ${cls}">${val.toFixed(2)}</div>`;
}
function _cgRatingBadgeHTML(e, key) {
  const val = _ratingVal(e, key);
  if (val == null) return `<div class="cg-score-badge cg-score-none">-</div>`;
  let cls;
  if (val >= 10) cls = 'cg-score-10';
  else if (val >= 9) cls = 'cg-score-9';
  else if (val >= 8) cls = 'cg-score-8';
  else if (val >= 7) cls = 'cg-score-7';
  else if (val >= 6) cls = 'cg-score-6';
  else if (val >= 3) cls = 'cg-score-3-5';
  else cls = 'cg-score-0-2';
  return `<div class="cg-score-badge ${cls}">${val.toFixed(2)}</div>`;
}

/* This page mixes every category, so the rating list is the full union
   across TV/Movies and Anime/Cartoons — e.g. "Acting" and "Voice Acting"
   both show up as separate options, since they're different keys on
   different entries. Deduplicated by key where a key is genuinely shared
   (e.g. "story", "music", "emotional"). */
function _ratingFilterOptionsAll() {
  const seen = new Set();
  const opts = [];
  [...CORE_RATINGS, ...ANIME_CORE_RATINGS].forEach(r => {
    if (seen.has(r.key)) return;
    seen.add(r.key);
    opts.push({ key: r.key, label: r.label, group: 'Core' });
  });
  if (!seen.has('animation')) { seen.add('animation'); opts.push({ key: 'animation', label: 'Animation Quality', group: 'Core' }); }
  const seenB = new Set();
  [...BONUS_RATINGS, ...ANIME_BONUS_RATINGS].forEach(r => {
    if (seenB.has(r.key)) return;
    seenB.add(r.key);
    opts.push({ key: r.key, label: r.label, group: 'Bonus' });
  });
  return opts;
}
function _ratingFilterLabelAll(key) {
  const opt = _ratingFilterOptionsAll().find(o => o.key === key);
  return opt ? opt.label : key;
}
function _ratingShortLabel(label) {
  return label.length > 14 ? label.slice(0, 13) + '…' : label;
}

/* ── Rating filter popup (shared markup/CSS with category.js's version) ── */
let _ratingFilterCallback = null;

function _injectRatingFilterOverlay() {
  if (document.getElementById('ratingFilterOverlay')) return;
  const el = document.createElement('div');
  el.id = 'ratingFilterOverlay';
  el.innerHTML = `<div id="ratingFilterCard">
    <div class="rf-header">
      <div class="rf-title">Sort by Rating</div>
      <button class="rf-close" onclick="closeRatingFilter()">${icon('x', 18)}</button>
    </div>
    <div class="rf-list" id="ratingFilterList"></div>
  </div>`;
  el.addEventListener('click', ev => { if (ev.target === el) closeRatingFilter(); });
  document.body.appendChild(el);
}

function openRatingFilter() {
  _injectRatingFilterOverlay();
  const curKey = (_compSort||'').startsWith('rating:') ? _compSort.slice(7) : null;
  const opts = _ratingFilterOptionsAll();

  let html = `<div class="rf-item${!curKey ? ' active' : ''}" onclick="_pickRatingFilter(null)">
    <span>Overall Score (default)</span><span class="rf-item-check">${icon('check', 15)}</span>
  </div>`;
  let lastGroup = null;
  opts.forEach(o => {
    if (o.group !== lastGroup) { html += `<div class="rf-group-label">${o.group}</div>`; lastGroup = o.group; }
    html += `<div class="rf-item${curKey===o.key?' active':''}" onclick="_pickRatingFilter('${o.key}')">
      <span>${o.label}</span><span class="rf-item-check">${icon('check', 15)}</span>
    </div>`;
  });
  document.getElementById('ratingFilterList').innerHTML = html;

  document.getElementById('ratingFilterOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeRatingFilter() {
  const ov = document.getElementById('ratingFilterOverlay');
  if (!ov) return;
  ov.classList.remove('open');
  document.body.style.overflow = '';
}

function _pickRatingFilter(key) {
  closeRatingFilter();
  setCompSort(key ? 'rating:' + key : 'highest');
}

const _CLEFT  = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>`;
const _CRIGHT = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>`;

/* ════════ GRID DETAIL POPUP ════════ */
function _cpInjectPopup() {
  if (document.getElementById('cpPopupOverlay')) return;
  const el = document.createElement('div');
  el.id = 'cpPopupOverlay';
  el.style.cssText = `
    position:fixed;inset:0;z-index:900;
    background:rgba(0,0,0,0.72);
    display:flex;align-items:center;justify-content:center;
    padding:16px;box-sizing:border-box;
    opacity:0;transition:opacity 220ms var(--ease);
    pointer-events:none;
  `;
  el.innerHTML = `
    <div id="cpPopupCard" style="
      background:var(--bg-2);border:1.5px solid var(--olive-light);
      box-shadow:4px 4px 0 var(--olive);border-radius:var(--radius-lg);
      width:100%;max-width:min(97vw, 920px);max-height:90dvh;overflow-y:auto;overscroll-behavior-y:contain;
      position:relative;box-sizing:border-box;
      transform:translateY(18px);transition:transform 260ms var(--ease);
    ">
      <!-- header -->
      <div id="cpPopupHeader" style="
        display:flex;align-items:flex-start;gap:20px;flex-wrap:wrap;
        padding:24px 24px 0;
      ">
        <div id="cpPopupPoster" style="
          width:150px;height:225px;flex-shrink:0;border-radius:var(--radius-sm);
          overflow:hidden;background:var(--bg-3);
          display:flex;align-items:center;justify-content:center;
          box-shadow:var(--shadow);
        "></div>
        <div style="flex:1;min-width:0;padding-top:4px;">
          <div id="cpPopupTitle" class="cg-popup-title" style="font-family:'Oswald',var(--sans);font-weight:600;line-height:1.15;color:var(--text);"></div>
          <div id="cpPopupTags" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;"></div>
          <div id="cpPopupDateRow" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;"></div>
          <div id="cpPopupMetaRow" style="display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:10px;"></div>
          <div id="cpPopupInfo" style="margin-top:4px;"></div>
        </div>
        <div id="cpPopupDesc" class="fd-description cg-desc-block" style="margin:16px 0 0;"></div>
        <div id="cpPopupScoreBox" class="cg-score-box" style="
          flex-shrink:0;flex-grow:0;text-align:center;align-self:stretch;position:relative;
          padding:18px 20px;border-radius:var(--radius-sm);
          background:transparent;border:2px solid var(--olive);
        ">
          <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:100%;">
            <div style="font-family:'Oswald',var(--sans);font-weight:600;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-3);margin-bottom:8px;text-align:center;width:100%;">Overall Score</div>
            <div id="cpPopupScoreVal" style="font-family:var(--bebas);font-size:48px;color:var(--olive);line-height:1;display:flex;align-items:center;justify-content:center;width:100%;gap:6px;"></div>
          </div>
        </div>
        <button class="cg-close-btn" onclick="cpClosePopup()" style="
          background:none;border:none;color:var(--text-3);cursor:pointer;
          font-size:22px;line-height:1;flex-shrink:0;
          transition:color .15s;
          position:absolute;z-index:1;
        " onmouseenter="this.style.color='var(--text)'" onmouseleave="this.style.color='var(--text-3)'">✕</button>
      </div>
      <!-- ratings body -->
      <div id="cpPopupBody" style="padding:20px 24px 6px;"></div>
      <!-- comments button -->
      <div style="padding:0 20px 12px;">
        <button id="cpPopupCcBtn" class="cc-strip" style="margin-top:4px;" onclick="openCommentsPopupCompleted(_cpPopupEntryId)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:11px;height:11px;flex-shrink:0"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span id="cpPopupCcLabel">Comments</span>
        </button>
      </div>
      <!-- Action buttons -->
      <div id="cpPopupActions" style="display:flex;gap:8px;padding:4px 24px 24px;flex-wrap:wrap;">
        <button class="popup-action-btn" onclick="goToDetail(_cpPopupEntryId,'completed.html')">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          Edit
        </button>
        <button class="popup-action-btn" onclick="openFavListsPopup(_cpPopupEntryId)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          Add to Favorites
        </button>

function _cgSetupNarrowObserver_cp() {
  const card = document.getElementById('cpPopupCard');
  if (!card || card._cgObserverAttached) return;
  card._cgObserverAttached = true;
  const apply = () => card.classList.toggle('cg-narrow', card.getBoundingClientRect().width <= 600);

async function _cpGoDiscover(id) {
  const e = _allCompleted.find(en => en.id === id);
  if (!e) return;
  if (e.tmdb_id && e.tmdb_type) {
    goToTitle(e.tmdb_type, e.tmdb_id);
    return;
  }
  if (typeof _tmdbSearch !== 'function') {
    showToast('Discover is unavailable right now.', 'err');
    return;
  }
  try {
    const isMovie = e.cat === 'movies' || e.ratings?._media_type === 'movie';
    const results = await _tmdbSearch(e.title);
    const sorted = [...results].sort((a, b) => {
      const aMatch = (a.media_type === 'movie') === isMovie ? 0 : 1;
      const bMatch = (b.media_type === 'movie') === isMovie ? 0 : 1;
      return aMatch - bMatch;
    });
    const best = sorted[0];
    if (best) goToTitle(best.media_type, best.id);
    else showToast("Couldn't find this title on TMDB.", 'err');
  } catch (err) {
    console.error(err);
    showToast('Error searching TMDB.', 'err');
  }
}

async function loadCommentsPopupCommentsCompleted(entryId) {
  const body = document.getElementById('commentsPopupCompletedBody');
  const count = document.getElementById('commentsPopupCompletedCount');
  if (!body) return;

  try {
    const comments = await getComments(entryId);
    const me = (await getCurrentUser())?.id;

    if (!comments.length) {
      body.innerHTML = '<div style="font-size:12px;color:var(--text-3);text-align:center;padding:20px 0;">No comments yet.</div>';
      if (count) count.textContent = 'Comments';
      return;
    }

    const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const topLevel = comments.filter(c => !c.reply_to);
    const replies  = comments.filter(c => c.reply_to);
    body.innerHTML = topLevel.map(c => {
      const uname = esc(c.profiles?.username || 'Unknown');
      const date  = new Date(c.created_at).toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
      const reps  = replies.filter(r => r.reply_to === c.id);
      const repHTML = reps.map(r => {
        const runame = esc(r.profiles?.username || 'Unknown');
        const rdate  = new Date(r.created_at).toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
        return `<div class="det-reply-item" id="cmpop-${r.id}">
          <div class="det-reply-author" style="color:var(--olive-light);">@${runame}</div>
          <div class="det-reply-text">${esc(r.content).replace(/(@[\w]+)/g,'<span style="color:var(--olive-light);font-weight:600">$1</span>')}</div>
          <div class="det-reply-meta"><span>${rdate}</span>
            ${r.author_id === me ? `<button class="cc-del" onclick="deleteCommentFromPopupCompleted('${r.id}','${entryId}')">delete</button>` : ''}
          </div>
        </div>`;
      }).join('');
      return `<div class="cc-comment" id="cmpop-${c.id}">
        <div class="cc-comment-body">
          <div class="cc-author">@${uname}</div>
          <div class="cc-text">${esc(c.content)}</div>
          <div class="cc-meta">
            <span>${date}</span>
            <button class="det-comment-reply-btn" onclick="cpReply('${c.id}','${uname}','${entryId}')">Reply</button>
            ${c.author_id === me ? `<button class="cc-del" onclick="deleteCommentFromPopupCompleted('${c.id}','${entryId}')">delete</button>` : ''}
          </div>
          ${repHTML}
          <div id="cp-reply-form-${c.id}"></div>
        </div>
      </div>`;
    }).join('');

    if (count) count.textContent = `${comments.length} comment${comments.length!==1?'s':''}`;
  } catch(e) {
    showToast('Could not load comments.', 'err');
  }
}

async function postCommentToPopupCompleted() {
  const input = document.getElementById('commentsPopupCompletedInput');
  const content = input.value.trim();
  if (!content || !_commentsPopupCompletedEntryId) return;

  try {
    input.disabled = true;
    await addComment(_commentsPopupCompletedEntryId, content);
    input.value = '';
    await loadCommentsPopupCommentsCompleted(_commentsPopupCompletedEntryId);
  } catch(e) {
    showToast('Could not post comment.', 'err');
  } finally {
    input.disabled = false;
    input.focus();
  }
}

function cpReply(commentId, username, entryId) {
  if (_cpReplyFor) { const _crEl = document.getElementById('cp-reply-form-' + _cpReplyFor); if(_crEl) _crEl.innerHTML = ''; }
  if (_cpReplyFor === commentId) { _cpReplyFor = null; return; }
  _cpReplyFor = commentId;
  const box = document.getElementById('cp-reply-form-' + commentId);
  if (!box) return;
  box.innerHTML = `<div class="det-reply-form">
    <input class="det-reply-input" id="cp-ri-${commentId}" maxlength="1000" value="@${username} " placeholder="Reply…"

}

async function cpPostReply(commentId, entryId) {
  const input = document.getElementById('cp-ri-' + commentId);
  const content = input?.value?.trim();
  if (!content) return;
  input.disabled = true;
  try {
    await addComment(entryId, content, commentId);
    document.getElementById('cp-reply-form-' + commentId).innerHTML = '';
    _cpReplyFor = null;
    await loadCommentsPopupCommentsCompleted(entryId);
  } catch(e) {
    showToast(isRateLimitError(e) ? RATE_LIMIT_MESSAGE : 'Could not post reply.', 'err');
    if (input) input.disabled = false;
  }
}

async function deleteCommentFromPopupCompleted(commentId, entryId) {
  if (!confirm('Delete this comment?')) return;
  try {
    await deleteComment(commentId);
    await loadCommentsPopupCommentsCompleted(entryId);
  } catch(e) {
    showToast('Could not delete comment.', 'err');
  }
}

const COMP_SORT_GROUPS = [
  { header: 'Alphabetical',    opts: [['alpha','A → Z'], ['zalpha','Z → A']] },
  { header: 'Added',           opts: [['newest','Latest'], ['oldest','Earliest']] },
  { header: 'Release Date',    opts: [['release','Latest'], ['release_asc','Earliest']] },
  { header: 'Ratings',         opts: [['highest','Highest'], ['lowest','Lowest']] },
  { header: 'Runtime',         opts: [['runtime_longest','Longest'], ['runtime_shortest','Shortest']] },
  { header: 'Episode Count',   opts: [['eps_most','Longest'], ['eps_least','Shortest']] },
];

function _compSortLabelFor(value) {
  if ((value||'').startsWith('rating:')) return `Rating: ${_ratingFilterLabelAll(value.slice(7))}`;
  for (const g of COMP_SORT_GROUPS) for (const [v, l] of g.opts) if (v === value) return g.opts.length > 1 ? `${g.header}: ${l}` : g.header;
  return 'Sort';
}

function _compUpdateSortTriggerLabel() {
  const btn = document.getElementById('compSortTriggerBtn');

function _compToggleDD(id) {
  const target = document.getElementById(id);
  const wasOpen = target.classList.contains('open');
  document.querySelectorAll('.sf-dd.open').forEach(el => { el.classList.remove('open'); const m = el.querySelector('.td-dd-menu'); if (m) m.style.cssText = ''; });
  if (wasOpen) return;
  target.classList.add('open');
  const trigger = target.querySelector('.sf-dd-trigger');
  const menu = target.querySelector('.td-dd-menu');
  const rect = trigger.getBoundingClientRect();
  const margin = 12;
  const spaceBelow = window.innerHeight - rect.bottom - margin;
  const spaceAbove = rect.top - margin;
  const openUp = spaceBelow < 140 && spaceAbove > spaceBelow;
  const available = Math.max(110, Math.min(openUp ? spaceAbove : spaceBelow, 150));
  menu.style.cssText = `position:fixed; left:${rect.left}px; width:${rect.width}px; z-index:1400; display:block; max-height:${available}px; overflow-y:auto; ` +
    (openUp ? `bottom:${window.innerHeight - rect.top}px; top:auto; border-radius:var(--radius-sm) var(--radius-sm) 0 0; border-top:0.5px solid var(--olive-light); border-bottom:none;`
            : `top:${rect.bottom}px; bottom:auto;`);
}
document.addEventListener('click', () => document.querySelectorAll('.sf-dd.open').forEach(el => { el.classList.remove('open'); const m = el.querySelector('.td-dd-menu'); if (m) m.style.cssText = ''; }));

let _expandedCompId = null;

function _cpBreakdownHTML(e) {
  const isMovie = e.cat==='movies' || e.ratings?._media_type==='movie';
  if (!isMovie) {
    const bd = Array.isArray(e.ratings?._season_breakdown)
      ? e.ratings._season_breakdown.filter(n=>parseInt(n)>0).map(Number) : [];
    const totalS = bd.length || Number(e.total_seasons) || 0;
    if (totalS > 0) {
      let chips = '';
      for (let i=0; i<totalS; i++) {
        const eps = bd[i] || null;
        chips += `<span class="popup-info-season-chip">
          <span class="popup-info-season-num">S${i+1}</span>
          <span class="popup-info-season-eps">${eps?eps+' ep':'S'+(i+1)}</span>
        </span>`;
      }
      return `<div class="popup-info-block"><div class="popup-info-label">TV Show Breakdown</div><div style="display:flex;flex-wrap:wrap;">${chips}</div></div>`;
    } else if (e.total_eps) {
      return `<div class="popup-info-block"><span class="popup-info-season-eps" style="font-size:11px;">${e.total_eps} episodes</span></div>`;
    }
    return '';
  } else {
    const rtH=Number(e.runtime_h)||0, rtM=Number(e.runtime_m)||0;
    if (rtH||rtM) {
      const rtStr = rtH ? rtH+'h '+rtM+'m' : rtM+'m';
      return `<div class="popup-info-block"><span class="popup-info-runtime">
        <span class="popup-info-runtime-val">${rtStr}</span>
        <span class="popup-info-runtime-lbl">Runtime</span>
      </span></div>`;
    }
    return '';
  }
}

function _buildCompExpansion(e) {
  const isMovies = e.cat === 'movies';
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  const { core: coreArr, bonus: bonusArr } = getRatings(e.cat);
  const isAnimated = e.cat === 'anime' || e.cat === 'cartoons';

  const coreRows = coreArr.map(r => {
    const val = e.ratings?.[r.key];
    if (val == null || val === '') return '';
    return `<div class="fd-rating-row"><span class="fd-rating-label">${r.label}</span><span class="fd-rating-val">${Number(val).toFixed(2)}</span></div>`;
  }).filter(Boolean).join('');

  // For TV/movies: show animation toggle rating separately if it was rated
  const animRow = (!isAnimated && e.ratings?.animation != null && e.ratings?.animation !== '')
    ? `<div class="fd-rating-row"><span class="fd-rating-label">Animation Quality</span><span class="fd-rating-val">${Number(e.ratings.animation).toFixed(2)}</span></div>` : '';

  const bonusRows = bonusArr.map(r => {
    const val = e.ratings?.[r.key];
    if (val == null || val === '') return '';
    return `<div class="fd-rating-row"><span class="fd-rating-label">${r.label}</span><span class="fd-rating-val">${Number(val).toFixed(2)}</span></div>`;
  }).filter(Boolean).join('');

  const favs = e.ratings?._favorites || {};
  const favChips = [
    favs.character ? `<span class="fav-chip"><span class="fav-chip-label">Fav Character</span><span class="fav-chip-val">${esc(favs.character)}</span></span>` : '',
    (!isMovies && favs.episode) ? `<span class="fav-chip"><span class="fav-chip-label">Fav Episode</span><span class="fav-chip-val">${esc(favs.episode)}</span></span>` : '',
    (!isMovies && favs.season)  ? `<span class="fav-chip"><span class="fav-chip-label">Fav Season</span><span class="fav-chip-val">${esc(favs.season)}</span></span>` : '',
  ].filter(Boolean).join('');
  const lows = e.ratings?._lowlights || e.ratings?._favorites?._lowlights || {};
  const lowChips = [
    lows.character ? `<span class="fav-chip low-chip"><span class="fav-chip-label">Least Fav Character</span><span class="fav-chip-val">${esc(lows.character)}</span></span>` : '',
    (!isMovies && lows.episode) ? `<span class="fav-chip low-chip"><span class="fav-chip-label">Least Fav Episode</span><span class="fav-chip-val">${esc(lows.episode)}</span></span>` : '',
    (!isMovies && lows.season)  ? `<span class="fav-chip low-chip"><span class="fav-chip-label">Least Fav Season</span><span class="fav-chip-val">${esc(lows.season)}</span></span>` : '',
  ].filter(Boolean).join('');

  return `${_cpBreakdownHTML(e)}
  <div class="fd-cols">
    ${(coreRows||animRow) ? `<div class="fd-col"><div class="fd-section-hd">Core Ratings</div>${coreRows}${animRow}</div>` : ''}
    ${bonusRows ? `<div class="fd-col"><div class="fd-section-hd">Bonus Ratings</div>${bonusRows}</div>` : ''}
  </div>
  ${(favChips || lowChips) ? `<div class="fd-section-hd" style="margin-top:16px;">Highlights</div>` : ''}
  ${favChips ? `<div class="fav-chips" style="margin-top:6px;">${favChips}</div>` : ''}
  ${lowChips ? `<div class="fav-chips" style="margin-top:6px;">${lowChips}</div>` : ''}
  ${e.notes ? `<div class="fd-section-hd" style="margin-top:16px;">Notes</div><div class="fd-notes" style="margin-top:0;padding-top:0;border-top:none;">"${esc(e.notes)}"</div>` : ''}`;
}

async function _compFetchCredits(entry) {
  if (entry.ratings?._director != null || entry.ratings?._cast_names) {
    return { director: entry.ratings._director || '', cast: entry.ratings._cast_names || [] };
  }
  if (!entry.tmdb_id || !entry.tmdb_type) return null;
  if (_compCastCache[entry.tmdb_id]) return _compCastCache[entry.tmdb_id];
  try {
    const res = await tmdbFetch(`${TMDB_BASE}/${entry.tmdb_type}/${entry.tmdb_id}?api_key=${TMDB_KEY}&language=en-US&append_to_response=credits`);
    if (!res.ok) return null;
    const data = await res.json();
    const director = (data.credits?.crew || []).find(c => c.job === 'Director')?.name || '';
    const cast = (data.credits?.cast || []).slice(0, 12).map(c => c.name);
    const result = { director, cast };
    _compCastCache[entry.tmdb_id] = result;
    const newRatings = { ...(entry.ratings || {}), _director: director, _cast_names: cast };
    updateProgress(entry.id, _compUser.id, { ratings: newRatings }).catch(() => {});
    entry.ratings = newRatings;
    return result;
  } catch { return null; }
}

  const margin = 12;
  const spaceBelow = window.innerHeight - rect.bottom - margin;
  menu.style.cssText = `position:fixed; left:${rect.left}px; width:${rect.width}px; z-index:1400; display:block; max-height:${Math.max(110,Math.min(spaceBelow,150))}px; overflow-y:auto; top:${rect.bottom}px;`;
}

function _compPickPerson(name) {
  _compStagedFilter.person = name;
  document.getElementById('compPersonSearch').value = name;
  document.getElementById('compPersonDD').classList.remove('open');
  document.getElementById('compPersonMenu').style.cssText = '';
}

function _compStageGenre(genre) {
  const cur = _compStagedFilter.genres;
  _compStagedFilter.genres = cur.includes(genre) ? cur.filter(g => g !== genre) : [...cur, genre];
  const dd = document.getElementById('compGenreDD');
  const trigger = dd.querySelector('.sf-dd-trigger');
  const label = _compStagedFilter.genres.length ? _compStagedFilter.genres.join(', ') : 'Any Genre';
  trigger.querySelector('.td-dd-label').textContent = label;
  trigger.classList.toggle('active', _compStagedFilter.genres.length > 0);
}

function _compStageRanges() {
  const val = id => document.getElementById(id)?.value ?? '';
  _compStagedFilter.yearMin = val('compYearMin'); _compStagedFilter.yearMax = val('compYearMax');
  _compStagedFilter.scoreMin = val('compScoreMin'); _compStagedFilter.scoreMax = val('compScoreMax');
  _compStagedFilter.lengthMin = val('compLengthMin'); _compStagedFilter.lengthMax = val('compLengthMax');
}

function _compClearStagedFilter() {
  _compStagedCat = '';
  _compStagedStatus = '';
  _compStagedFilter = { genres: [], yearMin: '', yearMax: '', scoreMin: '', scoreMax: '', lengthMin: '', lengthMax: '', person: '' };
  document.getElementById('compFilterBody').innerHTML = _compFilterBodyHTML();
}

async function _compApplyFilter() {
  const staged = { ..._compStagedFilter };
  const applyBtn = document.querySelector('#sfFilterCard .sf-apply-btn');
  if (staged.person && staged.person.trim()) {
    const query = staged.person.trim().toLowerCase();
    if (applyBtn) { applyBtn.textContent = 'Searching…'; applyBtn.disabled = true; }
    const matches = new Set();
    await Promise.all(_allCompleted.map(async e => {
      const credits = await _compFetchCredits(e);
      if (!credits) return;
      const hit = credits.director.toLowerCase().includes(query) || credits.cast.some(n => n.toLowerCase().includes(query));
      if (hit) matches.add(e.id);
    }));
    staged._personMatchIds = [...matches];
    if (applyBtn) { applyBtn.textContent = 'Apply'; applyBtn.disabled = false; }
  } else {
    staged._personMatchIds = null;
  }
  Object.assign(_compFilter, staged);
  _catFilter = _compStagedCat;
  _statusFilter = _compStagedStatus;
  _compUpdateFilterTriggerLabel();
  renderStats();
  renderMain();
  closeCompFilterPopup();
}

function filtered() {
  let result = _catFilter ? _allCompleted.filter(e => e.cat === _catFilter) : _allCompleted;
  if (_statusFilter) result = result.filter(e => e.status === _statusFilter);
  const f = _compFilter;
  if (f.genres.length) result = result.filter(e => (e.genres || []).some(g => f.genres.includes(g)));
  if (f.yearMin) result = result.filter(e => e.year && Number(e.year) >= Number(f.yearMin));
  if (f.yearMax) result = result.filter(e => e.year && Number(e.year) <= Number(f.yearMax));
  if (f.scoreMin) result = result.filter(e => liveScore(e) != null && liveScore(e) >= Number(f.scoreMin));
  if (f.scoreMax) result = result.filter(e => liveScore(e) != null && liveScore(e) <= Number(f.scoreMax));
  if (f.lengthMin) result = result.filter(e => _compRuntimeMinutes(e) >= Number(f.lengthMin));
  if (f.lengthMax) result = result.filter(e => _compRuntimeMinutes(e) <= Number(f.lengthMax));
  if (f._personMatchIds) result = result.filter(e => f._personMatchIds.includes(e.id));
  return result;
}

function renderStats() {
  const all   = _allCompleted;
  const rated = all.filter(e => e.final_score != null);
  const avg   = rated.length ? (rated.reduce((s, e) => s + Number(liveScore(e)), 0) / rated.length).toFixed(2) : '—';
  const cats  = {};
  all.forEach(e => { cats[e.cat] = (cats[e.cat] || 0) + 1; });
  const topCat = Object.entries(cats).sort((a,b)=>b[1]-a[1])[0];
  const topCatLabel = topCat ? CAT_META[topCat[0]]?.label : '—';

  // Episodes: completed only, use total_eps with watched as fallback, exclude movies and movie-type anime/cartoons
  const epsSource = (_catFilter && _catFilter !== 'movies')
    ? _allCompleted.filter(e => e.cat === _catFilter && (e.ratings?._media_type || 'show') !== 'movie')
    : _allCompleted.filter(e => e.cat !== 'movies' && (e.ratings?._media_type || 'show') !== 'movie');
  const totalEps = _catFilter === 'movies' ? 0 : epsSource.reduce((sum, e) => sum + (Number(e.total_eps) || Number(e.watched) || 0), 0);
  const epsLabel = _catFilter && _catFilter !== 'movies'
    ? `${CAT_META[_catFilter]?.label} Eps`
    : 'Episodes';

  // Movie watch time
  const movieSource = _catFilter
    ? _allCompleted.filter(e => e.cat === _catFilter && (e.cat === 'movies' || (e.ratings?._media_type === 'movie')))
    : _allCompleted.filter(e => e.cat === 'movies' || (e.ratings?._media_type === 'movie'));
  const totalMovieMins = movieSource.reduce((sum, e) => sum + (Number(e.runtime_h)||0)*60 + (Number(e.runtime_m)||0), 0);
  const wtH = Math.floor(totalMovieMins / 60);
  const wtM = totalMovieMins % 60;
  const watchTimeLabel = totalMovieMins ? (wtH ? `${wtH}h ${wtM}m` : `${wtM}m`) : null;

  const ongoingCount = (_catFilter ? _allCompleted.filter(e => e.cat === _catFilter && e.status === 'ongoing') : _allCompleted.filter(e => e.status === 'ongoing')).length;
  const completedCount = (_catFilter ? _allCompleted.filter(e => e.cat === _catFilter && e.status === 'completed') : _allCompleted.filter(e => e.status === 'completed')).length;

  document.getElementById('compStats').innerHTML = `
    <div class="page-stat"><div class="page-stat-num">${completedCount}</div><div class="page-stat-label">Watched</div></div>
    <div class="page-stat"><div class="page-stat-num">${ongoingCount}</div><div class="page-stat-label">To Be Continued</div></div>
    <div class="page-stat"><div class="page-stat-num">${avg}</div><div class="page-stat-label">Avg Score</div></div>
    <div class="page-stat"><div class="page-stat-num">${rated.length}</div><div class="page-stat-label">Rated</div></div>
    <div class="page-stat"><div class="page-stat-num">${topCatLabel}</div><div class="page-stat-label">Top Category</div></div>
    ${totalEps > 0 ? `<div class="page-stat"><div class="page-stat-num">${totalEps.toLocaleString()}</div><div class="page-stat-label">${epsLabel}</div></div>` : ''}
    ${watchTimeLabel ? `<div class="page-stat"><div class="page-stat-num">${watchTimeLabel}</div><div class="page-stat-label">Movie Watch Time</div></div>` : ''}`;
}

function renderMain() {
  const items = filtered();
  const el = document.getElementById('mainContent');

  if (!items.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon" style="opacity:.35"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg></div><div class="empty-text">No watched entries${_catFilter ? ' in this category' : ''}.</div></div>`;
    return;
  }

  const _sortedItems = (() => {
    const a = [...items];
    const getDate = e => e.completed_date ? new Date(e.completed_date) : new Date(e.created_at);
    if (_compSort === 'newest')  return a.sort((x,y) => getDate(y) - getDate(x));
    if (_compSort === 'oldest')  return a.sort((x,y) => getDate(x) - getDate(y));
    if (_compSort === 'highest') return a.sort((x,y) => { const d=(liveScore(y)||0)-(liveScore(x)||0); return d||new Date(y.created_at)-new Date(x.created_at); });
    if (_compSort === 'lowest')  return a.sort((x,y) => { const d=(liveScore(x)||0)-(liveScore(y)||0); return d||new Date(y.created_at)-new Date(x.created_at); });
    if (_compSort && _compSort.startsWith('rating:')) {
      const key = _compSort.slice(7);
      return a.sort((x,y) => {
        const ex = _ratingVal(x, key), ey = _ratingVal(y, key);
        const xKey = ex != null ? ex : (liveScore(x)||0);
        const yKey = ey != null ? ey : (liveScore(y)||0);
        const d = yKey - xKey;
        if (d) return d;
        return (liveScore(y)||0) - (liveScore(x)||0);
      });
    }
    if (_compSort === 'alpha')   return a.sort((x,y) => (x.title||'').localeCompare(y.title||''));
    if (_compSort === 'zalpha')  return a.sort((x,y) => (y.title||'').localeCompare(x.title||''));
    if (_compSort === 'release') {
      return a.sort((x,y) => getReleaseDateValue(y) - getReleaseDateValue(x));
    }
    if (_compSort === 'release_asc') {
      return a.sort((x,y) => getReleaseDateValue(x) - getReleaseDateValue(y));
    }
    if (_compSort === 'runtime_longest' || _compSort === 'runtime_shortest') {
      const isMovie = e => e.cat === 'movies' || e.ratings?._media_type === 'movie';
      const movies = a.filter(isMovie);
      const rest = a.filter(e => !isMovie(e));
      movies.sort((x,y) => _compSort === 'runtime_longest' ? _compRuntimeMinutes(y) - _compRuntimeMinutes(x) : _compRuntimeMinutes(x) - _compRuntimeMinutes(y));
      rest.sort((x,y) => getDate(y) - getDate(x)); // no runtime concept for these — default (newest) order
      return [...movies, ...rest];
    }
    if (_compSort === 'eps_most' || _compSort === 'eps_least') {
      const isMovie = e => e.cat === 'movies' || e.ratings?._media_type === 'movie';
      const shows = a.filter(e => !isMovie(e));
      const movies = a.filter(isMovie);
      shows.sort((x,y) => _compSort === 'eps_most' ? (Number(y.total_eps)||0) - (Number(x.total_eps)||0) : (Number(x.total_eps)||0) - (Number(y.total_eps)||0));
      movies.sort((x,y) => getDate(y) - getDate(x)); // movies have no episode count — default (newest) order
      return [...shows, ...movies];
    }
    return a;
  })();

  if (_compView === 'grid') {
    el.innerHTML = _renderCompGrid(_sortedItems);
    return;
  }

  if (_compSort === 'highest' || _compSort === 'lowest') {
    const sorted = _sortedItems;
    el.innerHTML = `<div class="fv-ranked-list">${sorted.map((e, i) => {
      const score = liveScore(e) != null ? '★ ' + Number(liveScore(e)).toFixed(2) : '—';
      const completedDateStr = e.completed_date
        ? new Date(e.completed_date + 'T12:00:00').toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' })
        : null;
      return `<div class="fv-entry-block">
        <div class="fv-rank-row" onclick="cpOpenPopup('${e.id}')">
          <div class="fv-rank-num ${i < 3 ? 'top3' : ''}">${i + 1}</div>
          <div class="fv-rank-poster">${posterHTML(e)}</div>
          <div class="fv-rank-info">
            <div class="fv-rank-title">${e.title}${e.year ? `<span style="font-family:var(--bebas);font-size:18px;font-weight:400;color:var(--text-3);margin-left:2px;">${e.year}</span>` : ''}${typeof rewatchBadgeHTML === 'function' && getRewatchCount(e) > 1 ? rewatchBadgeHTML(e) : ''}</div>
            <div class="fv-rank-meta">${_compTypeBadgeInline(e)} ${_entryMetaBadge(e)}</div>
            ${completedDateStr ? `<div class="fv-rank-meta"><span class="w-ep-badge" style="font-family:'Manrope',var(--sans);font-weight:500;">Completed On: ${completedDateStr}</span></div>` : ''}
            ${renderFavChips(e.ratings, e.cat)}
          </div>
          <div class="fv-rank-score">${score}</div>
        </div>
        <button class="cc-strip" style="margin-top:0;" onclick="event.stopPropagation();cpOpenPopupToComments('${e.id}')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:11px;height:11px;flex-shrink:0"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span>Comments</span>
        </button>
      </div>`;
    }).join('')}</div>`;
  } else {
    const recentSorted = _sortedItems;
    const ratingKey = (_compSort||'').startsWith('rating:') ? _compSort.slice(7) : null;
    el.innerHTML = `<div class="fv-ranked-list">${recentSorted.map(e => {
      const score = liveScore(e) != null ? '★ ' + Number(liveScore(e)).toFixed(2) : '—';
      const date  = e.completed_date ? new Date(e.completed_date + 'T12:00:00').toLocaleDateString('en-US',{day:'numeric',month:'short',year:'numeric'}) : '';
      return `<div class="fv-entry-block">
        <div class="fv-rank-row" onclick="cpOpenPopup('${e.id}')">
          <div class="fv-rank-poster" style="position:relative;">${posterHTML(e)}${ratingKey ? _cgRatingBadgeHTML(e, ratingKey) : ''}</div>
          <div class="fv-rank-info">
            <div class="fv-rank-title">${e.title}${e.year ? `<span style="font-family:var(--bebas);font-size:18px;font-weight:400;color:var(--text-3);margin-left:2px;">${e.year}</span>` : ''}${typeof rewatchBadgeHTML === 'function' && getRewatchCount(e) > 1 ? rewatchBadgeHTML(e) : ''}</div>
            <div class="fv-rank-meta">${_compTypeBadgeInline(e)} ${_entryMetaBadge(e)}</div>
            ${date ? `<div class="fv-rank-meta"><span class="w-ep-badge" style="font-family:'Manrope',var(--sans);font-weight:500;">Completed On: ${date}</span></div>` : ''}
            ${renderFavChips(e.ratings, e.cat)}
          </div>
          <div>
            <div class="fv-rank-score">${score}</div>
          </div>
        </div>
        <button class="cc-strip" style="margin-top:0;" onclick="event.stopPropagation();cpOpenPopupToComments('${e.id}')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:11px;height:11px;flex-shrink:0"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span>Comments</span>
        </button>
      </div>`;
    }).join('')}</div>`;
  }
}

async function doExport(exportCat) {
  const items = exportCat
    ? _allCompleted.filter(e => e.cat === exportCat)
    : filtered();
  if (!items.length) { showToast('Nothing to export.', 'err'); return; }

  const useRanked = _compSort === 'highest' || _compSort === 'lowest';
  const sorted = useRanked
    ? [...items].sort((a,b) => (liveScore(b)||0) - (liveScore(a)||0))
    : [...items].sort((a,b) => new Date(b.completed_date||b.created_at||0) - new Date(a.completed_date||a.created_at||0));

  const rated     = sorted.filter(e => liveScore(e) != null);
  const avgScore  = rated.length ? (rated.reduce((s,e)=>s+Number(liveScore(e)),0)/rated.length).toFixed(2) : null;
  const totalEps  = sorted.filter(e=>e.cat!=='movies'&&(e.ratings?._media_type||'show')!=='movie')
    .reduce((s,e)=>s+(Number(e.total_eps)||Number(e.watched)||0),0);
  const totalMins = sorted.filter(e=>e.cat==='movies'||e.ratings?._media_type==='movie')
    .reduce((s,e)=>s+(Number(e.runtime_h)||0)*60+(Number(e.runtime_m)||0),0);
  const wtH=Math.floor(totalMins/60), wtM=totalMins%60;
  const watchTime = totalMins ? (wtH?`${wtH}h ${wtM}m`:`${wtM}m`) : null;
  const catLabels    = {'':'All',tv:'TV Shows',movies:'Movies',anime:'Anime',cartoons:'Cartoons'};
  const statusLabels = {'':'',completed:'Watched',ongoing:'To Be Continued'};
  const filterLabel  = [catLabels[_catFilter]||'All', statusLabels[_statusFilter]].filter(Boolean).join(' · ');

  showToast('Preparing PDF…');
  try {
    await buildAndExportPDF({
      subtitle: (() => {
        const catLabels2 = {'':'All',tv:'TV Shows',movies:'Movies',anime:'Anime',cartoons:'Cartoons'};
        const catPart = exportCat ? catLabels2[exportCat] : (filterLabel || 'All');
        return `${useRanked?'Ranked List':'Watched List'} · ${catPart}`;
      })(),
      entries:   sorted,
      useRanked,
      exportCat: exportCat || '',
      filename:  `screenscore-${_compSort}.pdf`,
    });
    showToast('PDF exported!');
  } catch(err) {
    console.error(err);
    showToast('Export failed. Try again.', 'err');
  }
}
/* ── Export theme popup ── */
function openExportThemePopup() {
  let ov = document.getElementById('exportThemeOverlay');
  if (!ov) {
    ov = document.createElement('div');
    ov.id = 'exportThemeOverlay';
    ov.style.cssText = 'position:fixed;inset:0;z-index:900;background:rgba(0,0,0,0.75);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:20px;';

    const card = document.createElement('div');
    card.style.cssText = 'background:var(--bg-3);border:1.5px solid var(--olive-light);box-shadow:4px 4px 0 var(--olive);border-radius:var(--radius-lg);padding:1.75rem;max-width:340px;width:100%;display:flex;flex-direction:column;gap:12px;';

    const title = document.createElement('div');
    title.style.cssText = 'font-family:var(--serif);font-size:24px;font-weight:300;color:var(--text);text-align:center;';
    title.textContent = 'Export PDF';
    card.appendChild(title);

    const sub = document.createElement('div');
    sub.style.cssText = 'font-size:12px;color:var(--text-2);text-align:center;';
    sub.textContent = 'Choose category & theme';
    card.appendChild(sub);

    const grid = document.createElement('div');
    grid.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:2px;';

    const cats = [['tv','TV Shows'],['movies','Movies'],['anime','Anime'],['cartoons','Cartoons']];
    const themes = [['dark','Dark'],['light','Light']];
    cats.forEach(function(catItem) {
      themes.forEach(function(themeItem) {
        const cat = catItem[0], label = catItem[1];
        const theme = themeItem[0], themeLabel = themeItem[1];
        const btn = document.createElement('button');
        btn.style.cssText = 'padding:9px 6px;border:0.5px solid var(--border-2);border-radius:var(--radius-sm);font-size:10px;cursor:pointer;font-family:var(--sans);text-align:center;line-height:1.4;';
        btn.style.background = theme === 'dark' ? 'var(--bg-2)' : '#f0ebe2';
        btn.style.color      = theme === 'dark' ? 'var(--text)' : '#1a1a1a';
        const d1 = document.createElement('div');
        d1.style.fontWeight = '600'; d1.textContent = label;
        const d2 = document.createElement('div');
        d2.style.cssText = 'opacity:.6;font-size:9px;'; d2.textContent = themeLabel;
        btn.appendChild(d1); btn.appendChild(d2);
        btn.addEventListener('click', (function(c,t){ return function(){ runCompExport(c,t); }; })(cat, theme));
        grid.appendChild(btn);
      });
    });
    card.appendChild(grid);

    const cancel = document.createElement('button');
    cancel.style.cssText = 'font-size:11px;color:var(--text-3);background:none;border:none;cursor:pointer;text-align:center;margin-top:-4px;';
    cancel.textContent = 'Cancel';
    cancel.addEventListener('click', function(){ ov.style.display = 'none'; });
    card.appendChild(cancel);

    ov.appendChild(card);
    ov.addEventListener('click', function(e){ if (e.target === ov) ov.style.display = 'none'; });
    document.body.appendChild(ov);
  }
  ov.style.display = 'flex';
}
async function runCompExport(cat, theme) {
  document.getElementById('exportThemeOverlay').style.display = 'none';
  _exportTheme = theme;
  await doExport(cat);
}
