<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyScreenScore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
.lv-back {
  display:inline-flex; align-items:center; gap:6px;
  font-size:13px; color:var(--text-3); text-decoration:none;
  margin-bottom:1.5rem; transition:color .15s;
}
.lv-back:hover { color:var(--olive-light); }

.lv-head { margin-bottom:.5rem; }
.lv-title-row { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:nowrap; margin-bottom:.5rem; }
.lv-title-inner { display:flex; align-items:center; gap:10px; min-width:0; flex:1; }
.lv-title-wrap { min-width:0; }

/* ── Ranked/Unranked choice checkboxes — adapted from Uiverse (vishnupprajapat) ── */
.lv-owner { display:flex; align-items:center; gap:8px; margin-bottom:.6rem; }
.lv-avatar {
  width:26px; height:26px; border-radius:50%; overflow:hidden; flex-shrink:0;
  background:var(--olive-faint); color:var(--olive-light); font-family:var(--serif); font-size:12px;
  display:flex; align-items:center; justify-content:center;
}
.lv-avatar img { width:100%; height:100%; object-fit:cover; }
.lv-username { font-size:13px; color:var(--text-3); }
.lv-desc {
  font-size:13.5px; color:var(--text-2); line-height:1.6; margin-bottom:14px;
  padding-left:12px; border-left:2px solid var(--border-olive); white-space:pre-line; overflow-wrap:anywhere;
}
.lv-import-btn {
  font-size:13px; font-weight:600; padding:9px 20px; border-radius:999px; flex-shrink:0;
  background:var(--olive-faint); border:0.5px solid var(--border-olive); color:var(--olive-light);
  cursor:pointer; transition:all .15s; white-space:nowrap;
}
.lv-import-btn:hover { background:var(--olive-light); color:var(--bg); }
.lv-import-btn:disabled { opacity:.5; cursor:default; }
@media(max-width:520px) {
  .lv-import-btn { padding:8px 14px; font-size:12px; }
}
.lv-controls { display:flex; align-items:center; justify-content:space-between; gap:1rem; margin:1.5rem 0 2rem; flex-wrap:wrap; }
.lv-count { font-size:13px; color:var(--text-3); }

/* ── Grid view ── */
.lv-grid {
  display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));
  gap:14px;
  align-items:start; grid-auto-rows:max-content;
}
@media(min-width:1024px) {
  .lv-grid { grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); }
}
@media(min-width:1600px) {
  .lv-grid { grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); }
}
@media(max-width:640px) {
  .lv-grid { grid-template-columns:repeat(2,1fr); }
}
.lv-card {
  opacity:0; transform:translateY(18px); width:100%; box-sizing:border-box;
  transition:opacity .5s var(--ease), transform .5s var(--ease);
}
.lv-card.lv-in-view { opacity:1; transform:none; }

/* ── List view ── */
.lv-list { display:flex; flex-direction:column; gap:8px; }
.lv-list-row {
  display:grid; grid-template-columns:96px 1fr auto; align-items:center; gap:22px;
  background:var(--card); border:0.5px solid var(--border); border-radius:var(--radius);
  padding:16px 24px 16px 16px; cursor:pointer;
  opacity:0; transform:translateX(-10px);
  transition:opacity .4s var(--ease), transform .4s var(--ease), border-color .15s, background .15s;
}
.lv-list-row.lv-in-view { opacity:1; transform:none; }
.lv-list-row:hover { border-color:var(--border-olive); background:var(--card-2); }
/* Taller card per request — 96×136 keeps the same 2:3 poster ratio as
   before (80×112), just scaled up, rather than distorting it. */
.lv-list-poster { width:96px; height:136px; border-radius:6px; overflow:hidden; background:var(--bg-3); flex-shrink:0; }
.lv-list-poster img { width:100%; height:100%; object-fit:cover; display:block; }
.lv-list-title-row { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; min-width:0; }
.lv-list-title { font-size:18px; font-weight:500; color:var(--text); }
.lv-list-year { font-size:14px; color:var(--text-3); font-weight:400; flex-shrink:0; }
.lv-list-badges-row { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
/* Own MSS score's dedicated column — a real standout element, not a
   line sharing space with year/genre text the way it used to. */
.lv-list-score-wrap { display:flex; flex-direction:column; align-items:center; gap:6px; }
.lv-list-score-wrap .home-tmdb-score { font-size:clamp(13px, 3vw, 15px); }

.home-tmdb-poster-fallback {
  width:100%; height:100%; display:flex; align-items:center; justify-content:center;
  background:var(--bg-3); font-family:var(--serif); color:var(--olive-light);
  font-size:clamp(22px, 6vw, 32px);
}
.home-tmdb-year { color:var(--text-3); font-size:clamp(11px, 2.6vw, 13px); }
.home-tmdb-meta-row { display:flex; align-items:center; justify-content:flex-end; gap:8px; margin-top:2px; }
.home-tmdb-score { color:var(--olive-light); font-size:clamp(11px, 2.6vw, 13px); font-weight:600; white-space:nowrap; }
/* Your own MSS rating — a genuine standout now, not just "slightly
   bigger": large serif numerals matching the same treatment
   completed.html gives its own rank/recent scores, in its own
   dedicated column rather than sharing a line with other text. */
.lv-own-score { color:var(--olive-light); font-family:var(--serif); font-size:clamp(28px, 6vw, 36px); font-weight:500; white-space:nowrap; line-height:1; }
.lv-empty { text-align:center; padding:3rem 0; color:var(--text-3); font-size:14px; }

@media(max-width:560px) {
  .lv-grid { gap:10px; }
  .lv-list-row { grid-template-columns:64px 1fr auto; gap:14px; padding:10px 16px 10px 10px; }
  .lv-list-poster { width:64px; height:92px; }
  .lv-list-title { font-size:15px; }
  .lv-list-year { font-size:12px; }
}
/* ── v572: plain page layout (like Discover's See All) ── */
.lv-owner-row { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:.9rem; }
.lv-owner-row .lv-owner { margin-bottom:0; }
.lv-title-row { display:flex; align-items:center; justify-content:flex-start; column-gap:16px; row-gap:8px; flex-wrap:wrap; margin-bottom:1.1rem; }
.lv-title {
  font-family:var(--serif); font-size:clamp(26px, 6vw, 44px); font-weight:600; line-height:1.25;
  margin:0; min-width:0; overflow-wrap:anywhere; white-space:normal;
  overflow:visible; text-overflow:clip; padding-bottom:2px;   /* keep descenders (g, y, p) from clipping */
}
.lv-badge-slot { display:inline-flex; flex-shrink:0; align-self:center; }
.lv-badge-slot:empty { display:none; }
.lv-title-row .list-rank-badge { height:24px; padding:0 12px; font-size:11px; }
@media(max-width:640px) { .lv-title-row .list-rank-badge { height:21px; padding:0 10px; font-size:10px; } }
.lv-desc {
  font-size:clamp(13px, 3.4vw, 14.5px); color:var(--text-2); line-height:1.65; max-width:none; width:100%;
  margin:0 0 1.4rem; white-space:pre-line; overflow-wrap:anywhere; padding:0; border:none;
}
.lv-import-row { display:flex; margin:0 0 1.25rem; padding:0 !important; }
.lv-import-row .popup-action-btn { flex:0 0 auto; padding:11px 22px; font-size:13.5px; }
.lv-import-row .popup-action-btn:disabled { opacity:.65; cursor:default; }
.lv-controls {
  display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  margin:0 0 1.5rem; padding-bottom:12px; border-bottom:0.5px solid var(--border);
}
.lv-count { font-size:13px; color:var(--text-3); }
.lv-count b { font-family:var(--bebas); font-weight:400; font-size:18px; color:var(--text-2); letter-spacing:.3px; }
.lv-controls-right { display:flex; align-items:center; gap:8px; margin-left:auto; }
.lv-sf-bar:empty { display:none; }
.lv-sf-bar .sort-bar { border-bottom:none; padding:0; margin:0; background:transparent; position:relative; backdrop-filter:none; -webkit-backdrop-filter:none; }
.lv-sf-bar .sort-bar::before { content:none; }
@media(max-width:600px) {
  .lv-import-row .popup-action-btn { width:100%; }
  .lv-controls { gap:10px; }
}
/* ── Invite-link popup ── */
#lvJoinOverlay {
  position:fixed; inset:0; z-index:1300; display:flex; align-items:center; justify-content:center; padding:16px;
  background:rgba(0,0,0,.55); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  opacity:0; transition:opacity .2s;
}
#lvJoinOverlay.open { opacity:1; }
.lvj-card {
  width:100%; max-width:420px; text-align:center; padding:28px 24px 22px;
  background:var(--bg-2); border:1.5px solid var(--olive-light); border-radius:var(--radius-lg); box-shadow:4px 4px 0 var(--olive);
  transform:translateY(12px) scale(.98); transition:transform .25s cubic-bezier(.2,.8,.2,1);
}
#lvJoinOverlay.open .lvj-card { transform:none; }
.lvj-av {
  position:relative; width:64px; height:64px; margin:0 auto 14px; border-radius:50%; overflow:visible;
  background:var(--olive); color:#fff; display:flex; align-items:center; justify-content:center;
  font-family:var(--serif); font-weight:600; font-size:26px;
}
.lvj-av img { width:100%; height:100%; object-fit:cover; border-radius:50%; }
.lvj-av-ic { position:absolute; right:-2px; bottom:-2px; width:24px; height:24px; border-radius:50%; background:var(--olive-light); color:#fff; border:2px solid var(--bg-2); display:flex; align-items:center; justify-content:center; }
.lvj-eyebrow { font-family:var(--serif); font-size:11px; font-weight:500; letter-spacing:2.5px; text-transform:uppercase; color:var(--olive-light); margin-bottom:6px; }
.lvj-title { font-size:14px; color:var(--text-2); line-height:1.5; }
.lvj-title b { color:var(--text); }
.lvj-list { font-family:var(--serif); font-size:clamp(21px, 5.5vw, 26px); font-weight:600; line-height:1.2; margin:4px 0 6px; overflow-wrap:anywhere; }
.lvj-meta { font-size:12.5px; color:var(--text-3); margin-bottom:14px; }
.lvj-note { font-size:12.5px; color:var(--text-3); line-height:1.5; padding:10px 12px; border-radius:var(--radius-sm); background:var(--olive-faint); margin-bottom:18px; }
.lvj-actions { display:flex !important; flex-direction:row !important; gap:8px; padding:0 !important; }
.lvj-actions .popup-action-btn { flex:1; width:auto !important; justify-content:center; padding:11px 14px; font-size:14px; }
.lvj-actions .popup-action-btn:first-child { flex:2; }
.lvj-actions .lvj-ghost { background:transparent !important; color:var(--text-2) !important; border-color:var(--border-2) !important; }
.lvj-actions .lvj-ghost:hover { color:var(--text) !important; border-color:var(--border-olive) !important; background:var(--olive-faint) !important; }
.lvj-actions .popup-action-btn:disabled { opacity:.6; }
</style>

<body>
<div class="page-wrap">
  <a class="lv-back" href="lists.html" id="lvBack" onclick="if(history.length>1){history.back();return false;}">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    Back
  </a>

  <div id="lvLoading" class="page-loading"><div class="spinner"></div></div>
  <div id="lvContent" style="display:none">
    <div class="lv-owner-row">
      <div class="lv-owner">
        <div class="lv-avatar" id="lvAvatar"></div>
        <span class="lv-username" id="lvUsername"></span>
      </div>
    </div>

    <div class="lv-title-row">
      <h1 class="lv-title" id="lvTitle"></h1>
      <span id="lvRankedBadgeSlot" class="lv-badge-slot"></span>
    </div>
    <div class="lv-desc" id="lvDesc"></div>

    <div id="lvImportPopupActions" class="lv-import-row">
      <button class="popup-action-btn" id="lvImportBtn" onclick="importList()"><span class="lv-import-btn-label">+ Import This List</span></button>
    </div>

    <div class="lv-controls">
      <div class="lv-count"><b id="lvCount"></b> <span id="lvCountLabel">titles</span></div>
      <div class="lv-controls-right">
        <div id="lvSfBar" class="lv-sf-bar"></div>
        <div class="view-toggle" id="lvViewToggle"></div>
      </div>
    </div>

    <div class="lv-grid" id="lvGrid"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/nav.js"></script>
<script src="js/sort-filter.js"></script>
<script>
function _lvEsc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

const _lvParams = new URLSearchParams(location.search);
const _lvListId = _lvParams.get('list');

let _lvUser = null;
let _lvList = null;
let _lvItems = [];
let _lvView = localStorage.getItem('disc_listView') || 'grid';
let _lvRevealObserver = null;
let _tmdbItemCache = {};

// Same dual-format item resolution used on lists.html — an item id is
// either a personal entry's UUID, or a bare "tmdb:movie:123" reference
// for something added straight from Discover with no personal entry
// behind it at all.
async function _hydrateTmdbItems(items) {
  const toFetch = [...new Set(items.filter(id => typeof id === 'string' && id.startsWith('tmdb:') && !_tmdbItemCache[id]))];
  await Promise.all(toFetch.map(async pseudoId => {
    const [, type, tmdbId] = pseudoId.split(':');
    try {
      const res = await tmdbFetch(`${TMDB_BASE}/${type}/${tmdbId}?api_key=${TMDB_KEY}&language=en-US`);
      if (!res.ok) return;
      const d = await res.json();
      const title = type === 'movie' ? d.title : d.name;
      const dateStr = type === 'movie' ? d.release_date : d.first_air_date;
      _tmdbItemCache[pseudoId] = {
        id: pseudoId,
        title, poster_url: d.poster_path ? TMDB_FULL + d.poster_path : null,
        tmdb_id: Number(tmdbId), tmdb_type: type,
        year: (dateStr || '').split('-')[0],
      };
    } catch (e) { console.error('Hydrate TMDB item error:', pseudoId, e); }
  }));
}

function _lvRankBadgeHTML(rank) {
  if (rank == null) return '';
  const cls = rank === 0 ? 'cg-rank-1' : rank === 1 ? 'cg-rank-2' : rank === 2 ? 'cg-rank-3' : 'cg-rank-other';
  return `<div class="cg-rank-badge ${cls}">${rank + 1}</div>`;
}

// Personal ranked lists can genuinely mix movies and shows within the
// same list (a "Cold Characters" list might have both a film and a
// series) — unlike Discover's category-based lists where most
// categories are already single-type by name, there's no such
// shortcut here, so the type badge always shows when we can determine
// it. Checks tmdb_type first (TMDB-linked items), falling back to the
// personal entry's own category/media-type fields.
function _lvTypeLabel(e) {
  if (e.tmdb_type) return e.tmdb_type === 'movie' ? 'Movie' : 'TV Show';
  if (e.cat === 'movies') return 'Movie';
  if (e.cat === 'tv') return 'TV Show';
  const mt = e.ratings && e.ratings._media_type;
  if (mt) return mt === 'movie' ? 'Movie' : 'TV Show';
  return null;
}
function _lvTypeCls(e) {
  const isMovie = e.tmdb_type === 'movie' || e.cat === 'movies' || (e.ratings && e.ratings._media_type === 'movie');
  return isMovie ? 'type-label' : 'type-label type-label-tv';
}

function _lvCardHTML(e, rank) {
  const posterInner = safeURL(e.poster_url)
    ? `<img src="${safeURL(e.poster_url)}" loading="lazy" style="width:100%;height:100%;object-fit:cover;">`
    : `<div class="home-tmdb-poster-fallback">${_lvEsc((e.title||'?')[0].toUpperCase())}</div>`;
  const clickAttr = (e.tmdb_id && e.tmdb_type) ? `onclick="goToTitle('${e.tmdb_type}', ${e.tmdb_id})"` : '';
  const scoreStr = _lvOwnScoreHTML(e);
  const typeLabel = _lvTypeLabel(e);
  return `<div class="q-card lv-card" ${clickAttr}>
    <div class="q-poster" style="position:relative">${posterInner}<div class="q-poster-overlay"></div>${_lvRankBadgeHTML(rank)}${typeLabel ? `<span class="${_lvTypeCls(e)} type-label-overlay-bottom">${typeLabel}</span>` : ''}</div>
    <div class="q-info">
      <div class="title-year-row"><div class="q-title" style="margin-bottom:0;">${_lvEsc(e.title)}</div>${e.year ? `<span class="title-year-inline">${_lvEsc(e.year)}</span>` : ''}</div>
      ${scoreStr ? `<div class="home-tmdb-meta-row">${scoreStr}</div>` : ''}
    </div>
  </div>`;
}

function _lvListRowHTML(e, rank) {
  const posterInner = safeURL(e.poster_url)
    ? `<img src="${safeURL(e.poster_url)}" loading="lazy">`
    : `<div class="home-tmdb-poster-fallback" style="font-size:18px">${_lvEsc((e.title||'?')[0].toUpperCase())}</div>`;
  const clickAttr = (e.tmdb_id && e.tmdb_type) ? `onclick="goToTitle('${e.tmdb_type}', ${e.tmdb_id})"` : '';
  const scoreStr = _lvOwnScoreHTML(e);
  const typeLabel = _lvTypeLabel(e);
  return `<div class="lv-list-row" ${clickAttr}>
    <div class="lv-list-poster" style="position:relative">${posterInner}${_lvRankBadgeHTML(rank)}</div>
    <div style="min-width:0">
      <div class="lv-list-title-row">
        <div class="lv-list-title">${_lvEsc(e.title)}</div>
        ${e.year ? `<span class="lv-list-year">${_lvEsc(e.year)}</span>` : ''}
      </div>
      ${typeLabel ? `<div class="lv-list-badges-row"><span class="${_lvTypeCls(e)}">${typeLabel}</span></div>` : ''}
    </div>
    <div class="lv-list-score-wrap">${scoreStr}</div>
  </div>`;
}

// Shows the viewer's own MSS score, in the same star/olive style used
// for ratings everywhere else — but only when it's actually meaningful:
// this is your own list, it's a ranked list, and this particular item
// is a real personal entry (not something added straight from
// Discover, which has no personal score to show).
function _lvOwnScoreHTML(e) {
  // Shows the rating whenever the entry actually has one — the site has
  // no private-account model, so a real score is public data regardless
  // of who owns the list or whether the list itself is flagged "ranked".
  const isTmdbOnly = typeof e.id === 'string' && e.id.startsWith('tmdb:');
  if (isTmdbOnly) return '';
  const score = liveScore(e);
  if (score == null) return '';
  return `<span class="home-tmdb-score">★ ${Number(score).toFixed(2)}</span>`;
}

function _lvRenderViewToggle() {
  document.getElementById('lvViewToggle').innerHTML = `
    <button class="vt-btn ${_lvView==='list'?'active':''}" onclick="_lvSetView('list')" title="List view">${icon('list',13)}</button>
    <button class="vt-btn ${_lvView==='grid'?'active':''}" onclick="_lvSetView('grid')" title="Grid view">${icon('grid',13)}</button>`;
}

function _lvSetView(v) {
  if (v === _lvView) return;
  _lvView = v;
  localStorage.setItem('disc_listView', v);
  _lvRenderGrid();
  _lvRenderViewToggle();
}

function _lvObserveCards() {
  if (!_lvRevealObserver) {
    _lvRevealObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('lv-in-view');
          _lvRevealObserver.unobserve(entry.target);
        }
      });
    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.05 });
  }
  const grid = document.getElementById('lvGrid');
  const selector = _lvView === 'list' ? '.lv-list-row' : '.lv-card';
  grid.querySelectorAll(selector).forEach(el => _lvRevealObserver.observe(el));
}

function _lvRenderGrid() {
  const grid = document.getElementById('lvGrid');
  grid.className = _lvView === 'list' ? 'lv-list' : 'lv-grid';
  if (!_lvItems.length) {
    grid.className = '';
    grid.innerHTML = `<div class="lv-empty">This list is empty.</div>`;
    return;
  }
  const shown = SF.list('lv', 'all');
  document.getElementById('lvSfBar').innerHTML = SF.bar('lv', 'all');
  if (!shown.length) {
    grid.className = '';
    grid.innerHTML = `<div class="lv-empty">Nothing in this list matches these filters.</div>`;
    return;
  }
  // Rank badges keep each title's position in the list, whatever the sort
  grid.innerHTML = shown.map(e => {
    const rank = _lvList?.ranked === true ? e._rank - 1 : null;
    return _lvView === 'list' ? _lvListRowHTML(e, rank) : _lvCardHTML(e, rank);
  }).join('');
  _lvObserveCards();
}

/* Sort & Filter — shared js/sort-filter.js module */
function _lvIsTmdbOnly(e) { return typeof e.id === 'string' && e.id.startsWith('tmdb:'); }
SF.register('lv', {
  base: () => _lvItems,
  render: () => _lvRenderGrid(),
  defaultSort: 'rank',
  sorts: () => ['rank', 'alpha', 'release', 'ratings', 'runtime', 'episodes'],
  filters: () => ['genre', 'year', 'score'],
  choiceFilters: () => [{
    key: 'cat', label: 'Type',
    options: [['', 'All Types'], ['tv', 'TV Shows'], ['movies', 'Movies'], ['anime', 'Anime'], ['cartoons', 'Cartoons']],
    test: (e, v) => (e.cat || (e.tmdb_type === 'movie' ? 'movies' : 'tv')) === v,
  }],
  scoreOf: e => _lvIsTmdbOnly(e) ? null : liveScore(e),
});

function _lvRankedBadgeHTML() {
  const ranked = _lvList?.ranked;
  const isOwner = _lvUser && _lvList && _lvList.user_id === _lvUser.id;
  if (ranked === true)  return `<span class="list-rank-badge is-ranked">Ranked</span>`;
  if (ranked === false) return `<span class="list-rank-badge is-unranked">Unranked</span>`;
  if (isOwner) {
    return `<span class="sf-choice-inline" style="margin-left:12px;">
      <label class="sf-check-row">
        <input type="checkbox" onchange="if(this.checked) _lvSetRanked(true)">
        <span class="sf-check-mark"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
        <span>Ranked</span>
      </label>
      <label class="sf-check-row">
        <input type="checkbox" onchange="if(this.checked) _lvSetRanked(false)">
        <span class="sf-check-mark"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
        <span>Unranked</span>
      </label>
    </span>`;
  }
  return '';
}

async function _lvSetRanked(value) {
  try {
    const { error } = await sb.from('favorite_lists').update({ ranked: value }).eq('id', _lvList.id).eq('user_id', _lvUser.id);
    if (error) throw error;
    _lvList.ranked = value;
    document.getElementById('lvRankedBadgeSlot').innerHTML = _lvRankedBadgeHTML();
    showToast(value ? 'Marked as ranked!' : 'Marked as unranked.');
  } catch (err) {
    console.error('Set ranked error:', err);
    showToast('Failed to update.', 'err');
  }
}

function _lvMarkImported() {
  const btn = document.getElementById('lvImportBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="lv-import-btn-label">Added to My Lists ✓</span>';
}

// The original list's items are the OWNER's personal entry ids. Copied
// as-is, they'd point at someone else's entries, which the importer's
// Lists page can't resolve (it only loads their own library) — the
// imported list would show up empty or with gaps. So each item is
// re-pointed: to the importer's own entry for the same title if they
// have one, otherwise to a TMDB reference (tmdb:movie:123), and only
// kept as the original id when the entry was never linked to TMDB.
async function _lvItemsForImport() {
  const byId = Object.fromEntries(_lvItems.map(e => [e.id, e]));
  const { data: mine } = await sb.from('entries')
    .select('id, tmdb_id, tmdb_type').eq('user_id', _lvUser.id).not('tmdb_id', 'is', null);
  const myByTmdb = {};
  (mine || []).forEach(e => { myByTmdb[`${e.tmdb_type}:${e.tmdb_id}`] = e.id; });
  const out = [];
  for (const id of (_lvList.items || [])) {
    let next = id;
    if (!(typeof id === 'string' && id.startsWith('tmdb:'))) {
      const e = byId[id];
      if (e && e.tmdb_id && e.tmdb_type) {
        next = myByTmdb[`${e.tmdb_type}:${e.tmdb_id}`] || `tmdb:${e.tmdb_type}:${e.tmdb_id}`;
      }
    } else {
      const [, type, tmdbId] = id.split(':');
      next = myByTmdb[`${type}:${tmdbId}`] || id;
    }
    if (!out.includes(next)) out.push(next);
  }
  return out;
}

async function importList() {
  if (!_lvUser) { showToast('Sign in to import lists.', 'err'); return; }
  if (!_lvList) return;
  const btn = document.getElementById('lvImportBtn');
  btn.disabled = true;
  try {
    const items = await _lvItemsForImport();
    const { error } = await sb.from('favorite_lists').insert({
      user_id: _lvUser.id,
      cat: 'custom',
      genre: _lvList.genre || '',
      title: _lvList.title,
      description: _lvList.description || null,
      items,
      ranked: _lvList.ranked ?? null,
      forked_from: _lvList.id,
    });
    if (error) throw error;
    showToast('Added to your lists!');
    _lvMarkImported();
  } catch (err) {
    console.error('Import list error:', err);
    showToast('Failed to import list.', 'err');
    btn.disabled = false;
  }
}

async function _lvLoad() {
  if (!_lvListId) {
    document.getElementById('lvLoading').innerHTML = `<div class="lv-empty">No list specified.</div>`;
    return;
  }
  try {
    const { data: list, error } = await sb.from('favorite_lists')
      .select('*, profiles(username, avatar_url)')
      .eq('id', _lvListId)
      .single();
    if (error || !list) throw error || new Error('List not found');
    _lvList = list;

    const items = list.items || [];
    let entries = [];
    if (items.length) {
      const entryItemIds = items.filter(id => !(typeof id === 'string' && id.startsWith('tmdb:')));
      const map = {};
      if (entryItemIds.length) {
        const { data: entryRows } = await sb.from('entries').select('*').in('id', entryItemIds);
        (entryRows || []).forEach(e => { map[e.id] = e; });
      }
      await _hydrateTmdbItems(items);
      entries = items.map(id => (typeof id === 'string' && id.startsWith('tmdb:')) ? _tmdbItemCache[id] : map[id]).filter(Boolean);
    }
    _lvItems = entries.map((e, i) => Object.assign({}, e, { _rank: i + 1 }));

    document.title = `${list.title} — MyScreenScore`;
    document.getElementById('lvTitle').textContent = list.title; document.getElementById('lvRankedBadgeSlot').innerHTML = _lvRankedBadgeHTML();
    document.getElementById('lvDesc').textContent = list.description || '';
    document.getElementById('lvDesc').style.display = list.description ? '' : 'none';
    const username = list.profiles?.username || 'user';
    const avatarUrl = list.profiles?.avatar_url;
    document.getElementById('lvUsername').textContent = '@' + username;
    document.getElementById('lvAvatar').innerHTML = safeURL(avatarUrl)
      ? `<img src="${safeURL(avatarUrl)}" loading="lazy">`
      : (username[0] || '?').toUpperCase();
    document.getElementById('lvCount').textContent = entries.length;
    document.getElementById('lvCountLabel').textContent = entries.length === 1 ? 'title' : 'titles';

    const isOwn = _lvUser && list.user_id === _lvUser.id;
    document.getElementById('lvImportPopupActions').style.display = isOwn ? 'none' : '';
    if (!isOwn && _lvUser) {
      // Collaborators already have this list in their Lists — no Import
      const { data: collab } = await sb.from('list_collaborators')
        .select('status').eq('list_id', list.id).eq('user_id', _lvUser.id).eq('status', 'accepted').limit(1);
      if (collab && collab.length) document.getElementById('lvImportPopupActions').style.display = 'none';
      // Already imported this one before? Show that instead of letting
      // the same list get copied into their lists twice.
      const { data: existing } = await sb.from('favorite_lists')
        .select('id').eq('user_id', _lvUser.id).eq('forked_from', list.id).limit(1);
      if (existing && existing.length) _lvMarkImported();
    }

    _lvRenderViewToggle();
    _lvRenderGrid();

    document.getElementById('lvLoading').style.display = 'none';
    document.getElementById('lvContent').style.display = '';
  } catch (err) {
    console.error('Load list error:', err);
    document.getElementById('lvLoading').innerHTML = `<div class="lv-empty">Couldn't load this list.</div>`;
  }
}

/* ══ Invite link: list-view.html?list=…&join=<token> ══
   Opening an owner's invite link asks whether you want to collaborate.
   Accept → you're added (list lands at the top of your Lists).
   Decline / invalid → the link part is dropped and it's a normal list page. */
const _lvJoinToken = new URLSearchParams(location.search).get('join');

function _lvDropJoinParam() {
  const url = new URL(location.href); url.searchParams.delete('join'); history.replaceState(null, '', url);
}

async function _lvHandleJoinLink() {
  if (!_lvJoinToken || !_lvList) return;
  let state = 'invalid';
  try {
    const { data, error } = await sb.rpc('check_list_join_token', { p_list_id: _lvList.id, p_token: _lvJoinToken });
    if (error) throw error;
    state = data;
  } catch (e) { console.warn('Join link check failed:', e); }
  if (state === 'owner')  { _lvDropJoinParam(); return; }
  if (state === 'member') { _lvDropJoinParam(); showToast("You're already collaborating on this list."); return; }
  if (state === 'invalid') { _lvDropJoinParam(); showToast('This invite link has expired or was reset.', 'err'); return; }
  _lvShowJoinPopup();
}

function _lvShowJoinPopup() {
  const l = _lvList, owner = l.profiles || {};
  const initial = escHTML((owner.username || '?')[0].toUpperCase());
  const av = safeURL(owner.avatar_url) ? `<img src="${safeURL(owner.avatar_url)}" alt="">` : initial;
  const count = (l.items || []).length;
  const el = document.createElement('div');
  el.id = 'lvJoinOverlay';
  el.innerHTML = `<div class="lvj-card" role="dialog" aria-modal="true" aria-labelledby="lvjTitle">
      <div class="lvj-av">${av}<span class="lvj-av-ic">${icon('users', 12)}</span></div>
      <div class="lvj-eyebrow">List invite</div>
      <div class="lvj-title" id="lvjTitle"><b>@${escHTML(owner.username || 'user')}</b> invited you to collaborate on</div>
      <div class="lvj-list">&ldquo;${escHTML(l.title)}&rdquo;</div>
      <div class="lvj-meta">${count} ${count === 1 ? 'title' : 'titles'}</div>
      <div class="lvj-note">As a collaborator you can add and remove titles. Only the owner can rename or delete the list.</div>
      <div class="lvj-actions" id="lvjPopupActions">
        ${_lvUser
          ? `<button class="popup-action-btn" id="lvjAccept" onclick="_lvJoinRespond(true)">Accept</button>
             <button class="popup-action-btn lvj-ghost" onclick="_lvJoinRespond(false)">Decline</button>`
          : `<a class="popup-action-btn" href="login.html" style="text-decoration:none;">Sign in to join</a>
             <button class="popup-action-btn lvj-ghost" onclick="_lvJoinRespond(false)">Not now</button>`}
      </div>
    </div>`;
  el.addEventListener('click', e => { if (e.target === el) _lvJoinRespond(false); });
  document.body.appendChild(el);
  document.body.style.overflow = 'hidden';
  requestAnimationFrame(() => el.classList.add('open'));
}

function _lvCloseJoinPopup() {
  const el = document.getElementById('lvJoinOverlay');
  if (!el) return;
  el.classList.remove('open');
  document.body.style.overflow = '';
  setTimeout(() => el.remove(), 220);
}

async function _lvJoinRespond(accept) {
  if (!accept) { _lvDropJoinParam(); _lvCloseJoinPopup(); return; }
  const btn = document.getElementById('lvjAccept');
  if (btn) { btn.disabled = true; btn.textContent = 'Joining…'; }
  try {
    const { data, error } = await sb.rpc('join_list_with_token', { p_list_id: _lvList.id, p_token: _lvJoinToken });
    if (error) throw error;
    _lvDropJoinParam(); _lvCloseJoinPopup();
    if (data === 'invalid') { showToast('This invite link has expired or was reset.', 'err'); return; }
    showToast(data === 'member' ? "You're already collaborating on this list." : "You joined! It's at the top of your Lists.");
    const imp = document.getElementById('lvImportPopupActions');
    if (imp) imp.style.display = 'none';
  } catch (e) {
    console.error(e);
    if (btn) { btn.disabled = false; btn.textContent = 'Accept'; }
    showToast(isRateLimitError(e) ? RATE_LIMIT_MESSAGE : 'Could not join — try again.', 'err');
  }
}

document.addEventListener('DOMContentLoaded', () => {
  initPageGuest(async (user) => {
    _lvUser = user;
    await _lvLoad();
    _lvHandleJoinLink();
  });
});
