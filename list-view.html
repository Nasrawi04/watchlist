<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyScreenScore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
.lv-back {
  display:inline-flex; align-items:center; gap:6px;
  font-size:13px; color:var(--text-3); text-decoration:none;
  margin-bottom:1.5rem; transition:color .15s;
}
.lv-back:hover { color:var(--olive-light); }

.lv-head { display:flex; align-items:flex-start; justify-content:space-between; gap:1rem; margin-bottom:.5rem; flex-wrap:wrap; }
.lv-title-wrap { min-width:0; }
.lv-title { font-family:var(--serif); font-size:clamp(28px, 5vw, 42px); font-weight:300; margin-bottom:.4rem; }
.ranked-badge {
  display:inline-flex; align-items:center; margin-left:12px; vertical-align:middle;
  font-family:var(--sans); font-size:11px; font-weight:800; letter-spacing:.7px; text-transform:uppercase;
  padding:3px 11px; border-radius:0;
}
.ranked-badge.ranked-yes { background:var(--olive-light); color:var(--bg); }
.ranked-badge.ranked-no { background:var(--text-3); color:var(--bg); }
@media(max-width:640px) {
  .ranked-badge { font-size:9.5px; padding:2px 9px; margin-left:8px; letter-spacing:.5px; }
  .mss-cbx-group { gap:10px; margin-left:8px; }
  .checkbox-wrapper-46 .cbx span:last-child { font-size:11px; }
  .checkbox-wrapper-46 .cbx span:first-child { width:14px; height:14px; }
}

/* ── Ranked/Unranked choice checkboxes — adapted from Uiverse (vishnupprajapat) ── */
.mss-cbx-group { display:inline-flex; gap:16px; margin-left:12px; vertical-align:middle; }
.checkbox-wrapper-46 input[type="checkbox"] { display:none; visibility:hidden; }
.checkbox-wrapper-46 .cbx { margin:auto; user-select:none; cursor:pointer; display:inline-flex; align-items:center; }
.checkbox-wrapper-46 .cbx span { display:inline-block; vertical-align:middle; transform:translate3d(0,0,0); }
.checkbox-wrapper-46 .cbx span:first-child {
  position:relative; width:16px; height:16px; border-radius:3px; transform:scale(1);
  vertical-align:middle; background:var(--card); border:1.5px solid var(--text-3); transition:all .2s ease;
}
.checkbox-wrapper-46 .cbx span:first-child svg {
  position:absolute; top:2px; left:2px; fill:none; stroke:#fff; stroke-width:2;
  stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:16px; stroke-dashoffset:16px;
  transition:all .3s ease; transition-delay:.1s; transform:translate3d(0,0,0);
}
.checkbox-wrapper-46 .cbx span:first-child::before {
  content:''; width:100%; height:100%; display:block; transform:scale(0); opacity:1; border-radius:50%;
}
.checkbox-wrapper-46 .cbx span:last-child { padding-left:6px; font-family:var(--sans); font-weight:600; font-size:12px; color:var(--text-2); }
.checkbox-wrapper-46 .cbx:hover span:first-child { border-color:var(--olive-light); }
.checkbox-wrapper-46 .cbx-ranked-yes span:first-child::before { background:var(--olive-light); }
.checkbox-wrapper-46 .cbx-ranked-no span:first-child::before { background:var(--text-3); }
.checkbox-wrapper-46 .inp-cbx:checked + .cbx.cbx-ranked-yes span:first-child { background:var(--olive-light); border-color:var(--olive-light); animation:mss-cbx-wave .4s ease; }
.checkbox-wrapper-46 .inp-cbx:checked + .cbx.cbx-ranked-no span:first-child { background:var(--text-3); border-color:var(--text-3); animation:mss-cbx-wave .4s ease; }
.checkbox-wrapper-46 .inp-cbx:checked + .cbx span:first-child svg { stroke-dashoffset:0; }
.checkbox-wrapper-46 .inp-cbx:checked + .cbx span:first-child::before { transform:scale(3.5); opacity:0; transition:all .6s ease; }
@keyframes mss-cbx-wave { 50% { transform:scale(0.9); } }
.lv-owner { display:flex; align-items:center; gap:8px; margin-bottom:.5rem; }
.lv-avatar {
  width:26px; height:26px; border-radius:50%; overflow:hidden; flex-shrink:0;
  background:var(--olive-faint); color:var(--olive-light); font-family:var(--serif); font-size:12px;
  display:flex; align-items:center; justify-content:center;
}
.lv-avatar img { width:100%; height:100%; object-fit:cover; }
.lv-username { font-size:13px; color:var(--text-3); }
.lv-desc { font-size:13.5px; color:var(--text-2); line-height:1.6; max-width:600px; margin-bottom:.5rem; }
.lv-import-btn {
  font-size:13px; font-weight:600; padding:9px 20px; border-radius:999px; flex-shrink:0;
  background:var(--olive-faint); border:0.5px solid var(--border-olive); color:var(--olive-light);
  cursor:pointer; transition:all .15s; white-space:nowrap;
}
.lv-import-btn:hover { background:var(--olive-light); color:var(--bg); }
.lv-import-btn:disabled { opacity:.5; cursor:default; }

.lv-controls { display:flex; align-items:center; justify-content:space-between; gap:1rem; margin:1.5rem 0 2rem; flex-wrap:wrap; }
.lv-count { font-size:13px; color:var(--text-3); }

/* ── Grid view ── */
.lv-grid {
  display:grid; grid-template-columns:repeat(auto-fill, minmax(clamp(80px, 26vw, 200px), 1fr));
  gap:clamp(10px, 1.8vw, 32px);
  align-items:start; grid-auto-rows:max-content;
}
.lv-card {
  opacity:0; transform:translateY(18px); width:100%; box-sizing:border-box;
  transition:opacity .5s var(--ease), transform .5s var(--ease);
}
.lv-card.lv-in-view { opacity:1; transform:none; }

/* ── List view ── */
.lv-list { display:flex; flex-direction:column; gap:8px; }
.lv-list-row {
  display:grid; grid-template-columns:64px 1fr auto; align-items:center; gap:18px;
  background:var(--card); border:0.5px solid var(--border); border-radius:var(--radius);
  padding:12px 20px 12px 12px; cursor:pointer;
  opacity:0; transform:translateX(-10px);
  transition:opacity .4s var(--ease), transform .4s var(--ease), border-color .15s, background .15s;
}
.lv-list-row.lv-in-view { opacity:1; transform:none; }
.lv-list-row:hover { border-color:var(--border-olive); background:var(--card-2); }
.lv-list-poster { width:64px; height:90px; border-radius:6px; overflow:hidden; background:var(--bg-3); flex-shrink:0; }
.lv-list-poster img { width:100%; height:100%; object-fit:cover; display:block; }
.lv-list-title { font-size:16px; font-weight:500; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lv-list-year { font-size:12.5px; color:var(--text-3); }

.home-tmdb-poster-fallback {
  width:100%; height:100%; display:flex; align-items:center; justify-content:center;
  background:var(--bg-3); font-family:var(--serif); color:var(--olive-light);
  font-size:clamp(22px, 6vw, 32px);
}
.lv-empty { text-align:center; padding:3rem 0; color:var(--text-3); font-size:14px; }

@media(max-width:560px) {
  .lv-grid { gap:10px; }
  .lv-list-row { grid-template-columns:48px 1fr auto; gap:12px; padding:9px 14px 9px 9px; }
  .lv-list-poster { width:48px; height:68px; }
  .lv-list-title { font-size:14px; }
}
</style>
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1E5C26">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MyScreenScore">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
</head>
<body>
<div class="page-wrap">
  <a class="lv-back" href="lists.html" id="lvBack" onclick="if(history.length>1){history.back();return false;}">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    Back
  </a>

  <div id="lvLoading" class="page-loading"><div class="spinner"></div></div>
  <div id="lvContent" style="display:none">
    <div class="lv-head">
      <div class="lv-title-wrap">
        <div class="lv-owner">
          <div class="lv-avatar" id="lvAvatar"></div>
          <span class="lv-username" id="lvUsername"></span>
        </div>
        <div class="lv-title" id="lvTitle"></div>
        <div class="lv-desc" id="lvDesc"></div>
      </div>
      <button class="lv-import-btn" id="lvImportBtn" onclick="importList()">+ Import This List</button>
    </div>

    <div class="lv-controls">
      <div class="lv-count" id="lvCount"></div>
      <div class="view-toggle" id="lvViewToggle"></div>
    </div>

    <div class="lv-grid" id="lvGrid"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/nav.js"></script>
<script>
function _lvEsc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

const _lvParams = new URLSearchParams(location.search);
const _lvListId = _lvParams.get('list');

let _lvUser = null;
let _lvList = null;
let _lvItems = [];
let _lvView = localStorage.getItem('disc_listView') || 'grid';
let _lvRevealObserver = null;

function _lvRankBadgeHTML(rank) {
  if (rank == null) return '';
  const cls = rank === 0 ? 'cg-rank-1' : rank === 1 ? 'cg-rank-2' : rank === 2 ? 'cg-rank-3' : 'cg-rank-other';
  return `<div class="cg-rank-badge ${cls}">${rank + 1}</div>`;
}

function _lvCardHTML(e, rank) {
  const posterInner = (e.poster_url && !e.poster_url.startsWith('PLACEHOLDER'))
    ? `<img src="${e.poster_url}" loading="lazy" style="width:100%;height:100%;object-fit:cover;">`
    : `<div class="home-tmdb-poster-fallback">${_lvEsc((e.title||'?')[0].toUpperCase())}</div>`;
  const clickAttr = (e.tmdb_id && e.tmdb_type) ? `onclick="goToTitle('${e.tmdb_type}', ${e.tmdb_id})"` : '';
  return `<div class="q-card lv-card" ${clickAttr}>
    <div class="q-poster" style="position:relative">${posterInner}<div class="q-poster-overlay"></div>${_lvRankBadgeHTML(rank)}</div>
    <div class="q-info">
      <div class="q-title">${_lvEsc(e.title)}</div>
      ${e.year ? `<div class="q-genre">${_lvEsc(e.year)}</div>` : ''}
    </div>
  </div>`;
}

function _lvListRowHTML(e, rank) {
  const posterInner = (e.poster_url && !e.poster_url.startsWith('PLACEHOLDER'))
    ? `<img src="${e.poster_url}" loading="lazy">`
    : `<div class="home-tmdb-poster-fallback" style="font-size:18px">${_lvEsc((e.title||'?')[0].toUpperCase())}</div>`;
  const clickAttr = (e.tmdb_id && e.tmdb_type) ? `onclick="goToTitle('${e.tmdb_type}', ${e.tmdb_id})"` : '';
  return `<div class="lv-list-row" ${clickAttr}>
    <div class="lv-list-poster" style="position:relative">${posterInner}${_lvRankBadgeHTML(rank)}</div>
    <div style="min-width:0">
      <div class="lv-list-title">${_lvEsc(e.title)}</div>
      ${e.year ? `<div class="lv-list-year">${_lvEsc(e.year)}</div>` : ''}
    </div>
  </div>`;
}

function _lvRenderViewToggle() {
  document.getElementById('lvViewToggle').innerHTML = `
    <button class="vt-btn ${_lvView==='list'?'active':''}" onclick="_lvSetView('list')" title="List view">${icon('list',13)}</button>
    <button class="vt-btn ${_lvView==='grid'?'active':''}" onclick="_lvSetView('grid')" title="Grid view">${icon('grid',13)}</button>`;
}

function _lvSetView(v) {
  if (v === _lvView) return;
  _lvView = v;
  localStorage.setItem('disc_listView', v);
  _lvRenderGrid();
  _lvRenderViewToggle();
}

function _lvObserveCards() {
  if (!_lvRevealObserver) {
    _lvRevealObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('lv-in-view');
          _lvRevealObserver.unobserve(entry.target);
        }
      });
    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.05 });
  }
  const grid = document.getElementById('lvGrid');
  const selector = _lvView === 'list' ? '.lv-list-row' : '.lv-card';
  grid.querySelectorAll(selector).forEach(el => _lvRevealObserver.observe(el));
}

function _lvRenderGrid() {
  const grid = document.getElementById('lvGrid');
  grid.className = _lvView === 'list' ? 'lv-list' : 'lv-grid';
  if (!_lvItems.length) {
    grid.className = '';
    grid.innerHTML = `<div class="lv-empty">This list is empty.</div>`;
    return;
  }
  grid.innerHTML = _lvItems.map((e, i) => {
    const rank = _lvList?.ranked === true ? i : null;
    return _lvView === 'list' ? _lvListRowHTML(e, rank) : _lvCardHTML(e, rank);
  }).join('');
  _lvObserveCards();
}

function _lvRankedBadgeHTML() {
  const ranked = _lvList?.ranked;
  const isOwner = _lvUser && _lvList && _lvList.user_id === _lvUser.id;
  if (ranked === true) return `<span class="ranked-badge ranked-yes">Ranked</span>`;
  if (ranked === false) return `<span class="ranked-badge ranked-no">Unranked</span>`;
  if (isOwner) {
    return `<span class="mss-cbx-group">
      <span class="checkbox-wrapper-46">
        <input type="checkbox" id="lv-cbx-ranked-yes" class="inp-cbx" onchange="if(this.checked) _lvSetRanked(true)">
        <label for="lv-cbx-ranked-yes" class="cbx cbx-ranked-yes"><span><svg viewBox="0 0 12 10" height="10" width="12"><polyline points="1.5 6 4.5 9 10.5 1"></polyline></svg></span><span>Ranked</span></label>
      </span>
      <span class="checkbox-wrapper-46">
        <input type="checkbox" id="lv-cbx-ranked-no" class="inp-cbx" onchange="if(this.checked) _lvSetRanked(false)">
        <label for="lv-cbx-ranked-no" class="cbx cbx-ranked-no"><span><svg viewBox="0 0 12 10" height="10" width="12"><polyline points="1.5 6 4.5 9 10.5 1"></polyline></svg></span><span>Unranked</span></label>
      </span>
    </span>`;
  }
  return '';
}

async function _lvSetRanked(value) {
  try {
    const { error } = await sb.from('favorite_lists').update({ ranked: value }).eq('id', _lvList.id).eq('user_id', _lvUser.id);
    if (error) throw error;
    _lvList.ranked = value;
    document.getElementById('lvTitle').innerHTML = _lvEsc(_lvList.title) + _lvRankedBadgeHTML();
    showToast(value ? 'Marked as ranked!' : 'Marked as unranked.');
  } catch (err) {
    console.error('Set ranked error:', err);
    showToast('Failed to update.', 'err');
  }
}

async function importList() {
  if (!_lvUser) { showToast('Sign in to import lists.', 'err'); return; }
  if (!_lvList) return;
  const btn = document.getElementById('lvImportBtn');
  btn.disabled = true;
  try {
    const { error } = await sb.from('favorite_lists').insert({
      user_id: _lvUser.id,
      cat: 'custom',
      genre: _lvList.genre || '',
      title: _lvList.title,
      description: _lvList.description || null,
      items: _lvList.items || [],
      ranked: _lvList.ranked ?? null,
      forked_from: _lvList.id,
    });
    if (error) throw error;
    showToast('Added to your lists!');
    btn.textContent = 'Added ✓';
  } catch (err) {
    console.error('Import list error:', err);
    showToast('Failed to import list.', 'err');
    btn.disabled = false;
  }
}

async function _lvLoad() {
  if (!_lvListId) {
    document.getElementById('lvLoading').innerHTML = `<div class="lv-empty">No list specified.</div>`;
    return;
  }
  try {
    const { data: list, error } = await sb.from('favorite_lists')
      .select('*, profiles(username, avatar_url)')
      .eq('id', _lvListId)
      .single();
    if (error || !list) throw error || new Error('List not found');
    _lvList = list;

    const items = list.items || [];
    let entries = [];
    if (items.length) {
      const { data: entryRows } = await sb.from('entries').select('*').in('id', items);
      const map = {};
      (entryRows || []).forEach(e => { map[e.id] = e; });
      entries = items.map(id => map[id]).filter(Boolean);
    }
    _lvItems = entries;

    document.title = `${list.title} — MyScreenScore`;
    document.getElementById('lvTitle').innerHTML = _lvEsc(list.title) + _lvRankedBadgeHTML();
    document.getElementById('lvDesc').textContent = list.description || '';
    document.getElementById('lvDesc').style.display = list.description ? '' : 'none';
    const username = list.profiles?.username || 'user';
    const avatarUrl = list.profiles?.avatar_url;
    document.getElementById('lvUsername').textContent = '@' + username;
    document.getElementById('lvAvatar').innerHTML = avatarUrl
      ? `<img src="${avatarUrl}" loading="lazy">`
      : (username[0] || '?').toUpperCase();
    document.getElementById('lvCount').textContent = `${entries.length} item${entries.length !== 1 ? 's' : ''}`;

    const isOwn = _lvUser && list.user_id === _lvUser.id;
    document.getElementById('lvImportBtn').style.display = isOwn ? 'none' : '';

    _lvRenderViewToggle();
    _lvRenderGrid();

    document.getElementById('lvLoading').style.display = 'none';
    document.getElementById('lvContent').style.display = '';
  } catch (err) {
    console.error('Load list error:', err);
    document.getElementById('lvLoading').innerHTML = `<div class="lv-empty">Couldn't load this list.</div>`;
  }
}

document.addEventListener('DOMContentLoaded', () => {
  initPageGuest(async (user) => {
    _lvUser = user;
    _lvLoad();
  });
});
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(r => console.log('SW registered:', r.scope))
      .catch(e => console.warn('SW failed:', e));
  });
}
</script>
</body>
</html>
