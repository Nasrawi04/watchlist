<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="js/consent.js"></script>
<script src="js/splash.js"></script>
<script src="js/i18n.js"></script>
<title>MyScreenFolio</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/style.css">
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#F3EEDC">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MyScreenFolio">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/svg+xml" sizes="any" href="icons/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
</head>
<body>
<div class="page-wrap lv-wrap">
  <div id="lvLoading" class="page-loading" data-skel="lv-page"></div>
  <div id="lvContent" style="display:none">
    <!-- The hero (Lists redesign): a compact title-page header — the list's backdrop, its name and description on
         the left, the stats panel on the right -->
    <div class="lh-crumb"><a id="lvBack" href="lists.html">‹ Lists</a><span id="lvOwner"></span></div>
    <header class="lh" id="lvHero">
      <img class="lh-bd" id="lvBd" alt="" hidden>
      <span class="lh-shade" aria-hidden="true"></span>
      <div class="lh-top">
        <button type="button" class="lh-bd-btn" id="lvBdBtn" hidden onclick="_lvPickBackdrop()"></button>
      </div>
      <div class="lh-in">
        <div class="lh-text">
          <div class="lh-chips" id="lvChips"></div>
          <h1 class="lh-title" id="lvTitle" translate="no"></h1>
          <p class="lh-desc" id="lvDesc" translate="no"></p>
        </div>
        <dl class="lh-stats" id="lvStats"></dl>
      </div>
    </header>

    <!-- Edit list · Share · Export · ⋯ (· likes) on the left; Sort · Filter · Grid / List on the right -->
    <div class="lv-bar">
      <div class="lv-bar-l" id="lvActions"></div>
      <div class="lv-bar-r">
        <div id="lvSfBar" class="lv-sf-bar"></div>
        <div class="view-toggle" id="lvViewToggle"></div>
      </div>
    </div>

    <div id="lvGrid"></div>
  </div>
  <!-- Edit mode (?edit=1 / ?new=1): the list editor (list-studio.js) -->
  <div id="lvEditor" hidden></div>
</div>

<script src="js/vendor/supabase-2.118.0.js"></script>
<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/nav.js"></script>
<script src="js/info-popup.js"></script>
<script src="js/title-view.js"></script>
<script src="js/easter-egg.js"></script>
<script src="js/note-popup.js"></script>
<script src="js/sort-filter.js"></script>
<script src="js/list-popup.js"></script>
<script src="js/list-actions.js"></script>
<script src="js/rewatch.js"></script>
<script src="js/create-card.js"></script>
<script>

const _lvParams = new URLSearchParams(location.search);
const _lvListId = _lvParams.get('list');
const $ = id => document.getElementById(id);

let _lvUser = null;
let _lvList = null;
let _lvItems = [];
let _lvShared = false;       // a list shared with you (you collaborate on it)
let _lvReact = null;         // likes on someone else's list
// Grid or List: kept per list on this device — a list opens in the view you left it in, any other in Grid (owner)
const _lvViewKey = 'msf_list_view_' + (_lvListId || '');
let _lvView = (() => { try { return localStorage.getItem(_lvViewKey) === 'list' ? 'list' : 'grid'; } catch { return 'grid'; } })();
let _lvRevealObserver = null;
const _lvOwn = () => !!_lvUser && !!_lvList && _lvList.user_id === _lvUser.id;
const _lvIsTmdbOnly = e => typeof e.id === 'string' && e.id.startsWith('tmdb:');
const _lvFmt = d => new Date(d).toLocaleDateString(MSSI18n.locale, { day: 'numeric', month: 'short', year: 'numeric' });

// Personal ranked lists can mix movies and shows, so the type badge always shows when it's known:
// tmdb_type first (TMDB-linked items), then the entry's own category / media type
function _lvTypeLabel(e) {
  if (e.tmdb_type) return e.tmdb_type === 'movie' ? 'Movie' : 'TV Show';
  if (e.cat === 'movies') return 'Movie';
  if (e.cat === 'tv') return 'TV Show';
  const mt = e.ratings && e.ratings._media_type;
  if (mt) return mt === 'movie' ? 'Movie' : 'TV Show';
  return null;
}
const _lvIsMovie = e => e.tmdb_type === 'movie' || e.cat === 'movies' || (e.ratings && e.ratings._media_type === 'movie');

// Back: to the page that opened this list (Lists, a profile, Friends…) — remembered on arrival, so it still
// works after list → title → Back (where the browser's own "back" would bounce to the title)
const _lvFrom = (() => {
  try {
    const r = document.referrer ? new URL(document.referrer) : null;
    if (r && r.origin === location.origin && !/\/(detail|list-view|login|item)\.html$/.test(r.pathname)) sessionStorage.setItem('lvFrom', r.pathname.split('/').pop() + r.search);
  } catch {}
  return sessionStorage.getItem('lvFrom') || 'lists.html';
})();

// Tapping a title: its panel / page (MSSViews, title-view.js)
function _lvOpenInfo(id) {
  const e = _lvItems.find(x => x.id === id);
  if (e) MSSViews.open(e, { start: 'info' });
}

/* ── Grid view: the standard card, 5 a row (phones 3); a ranked list keeps the card's rank badge ── */
function _lvCardHTML(e, rank) {
  const real = !_lvIsTmdbOnly(e), sc = real ? liveScore(e) : null;
  return MSSCard.poster({ cls: 'lv-card', onclick: `_lvOpenInfo(${attrJSON(e.id)})`, title: e.title, year: e.year, poster: e.poster_url, age: [e.tmdb_type || e.media_type, e.tmdb_id],
    rank: rank == null ? 0 : rank + 1, type: _lvTypeLabel(e) ? { label: _lvTypeLabel(e), tv: !_lvIsMovie(e) } : null,
    score: sc != null ? sc : undefined, meta: real ? mssMetaOf(e) : null, rewatch: real ? mssRewatchCount(e) : 0 });
}
/* ── List view: the Library's card (mssListCard, config.js) — the same on Ratings and in the Library ── */
function _lvRowHTML(e, rank) {
  return mssListCard(e, { rank: rank != null ? rank + 1 : 0, onclick: `_lvOpenInfo(${attrJSON(e.id)})`, real: !_lvIsTmdbOnly(e), type: _lvTypeLabel(e) });
}

function _lvRenderViewToggle() { $('lvViewToggle').innerHTML = _lvViewToggleHTML(); }
function _lvViewToggleHTML() {
  return `<button class="vt-btn ${_lvView === 'list' ? 'active' : ''}" onclick="_lvSetView('list')" title="List view" aria-label="List view" aria-pressed="${_lvView === 'list'}">${icon('list', 13)}</button>
    <button class="vt-btn ${_lvView === 'grid' ? 'active' : ''}" onclick="_lvSetView('grid')" title="Grid view" aria-label="Grid view" aria-pressed="${_lvView === 'grid'}">${icon('grid', 13)}</button>`;
}
function _lvSetView(v) {
  if (v === _lvView) return;
  _lvView = v;
  try { v === 'list' ? localStorage.setItem(_lvViewKey, v) : localStorage.removeItem(_lvViewKey); } catch {}
  _lvRenderGrid(); _lvRenderViewToggle();
}

/* ── Loading skeleton: the hero, the bar and the titles (cards or rows, in the view you chose) ── */
mssSkeleton.define('lv-page', () => {
  const n = mssSkeleton.shape('lv')?.n || 10;
  const e = { id: '', title: 'Sample title', year: '2024', cat: 'tv', final_score: 8.5 };
  return `<div class="lh is-skel"><div class="lh-in"><div class="lh-text"><h1 class="lh-title">Sample list name</h1><p class="lh-desc">A sample description for this list.</p></div></div></div>
    <div class="lv-bar"><div class="lv-bar-l"></div><div class="lv-bar-r" data-skel-keep><div class="lv-sf-bar">${SF.bar('lv', 'all')}</div><div class="view-toggle">${_lvViewToggleHTML()}</div></div></div>
    <div class="${_lvView === 'list' ? 'lp-grid lv-rows' : 'lv-grid msf-grid'}">${Array.from({ length: n }, () => _lvView === 'list' ? _lvRowHTML(e, null) : _lvCardHTML(e, null).replace('lv-card"', 'lv-card lv-in-view"')).join('')}</div>`.replace(/ (id|onclick)="[^"]*"/g, '');
});

/* …and the editor's (?edit=1 / ?new=1): its head with Cancel · Save changes, the Details and Your list panels
   with sample fields and rows, and Add titles beside them — the real layout, masked */
mssSkeleton.define('le-page', () => {
  const field = (l, h = 44) => `<div class="ls-field"><span class="ls-field-l">${l}</span><div class="skel" style="height:${h}px;border-radius:10px"></div></div>`;
  const row = () => `<div class="la-row"><span class="la-num">0</span><div class="fav-picker-poster la-poster"></div><div class="fav-picker-info"><div class="fav-picker-name">Sample title</div><div class="fav-picker-sub">Movie · 2000</div></div></div>`;
  const pick = () => `<div class="fav-picker-item ls-pick"><span class="fav-picker-poster"></span><span class="fav-picker-info"><span class="fav-picker-name">Sample title</span><span class="fav-picker-sub">Movie</span></span></div>`;
  return `<div class="le-page"><header class="le-head"><div class="le-head-l"><div class="lib-kicker" data-skel-keep>Lists · ${_lvParams.get('new') ? 'New list' : 'Editing'}</div><h1 class="le-name">Sample list name</h1></div>
      <div class="le-bar" data-skel-keep><button type="button" class="le-cancel" disabled>Cancel</button><button type="button" class="le-save" disabled>${icon('check', 15)} Save changes</button></div></header>
    <div class="le-cols"><div class="le-main">
      <section class="le-panel"><div class="le-label" data-skel-keep>Details</div>${field('Name', 48)}${field('Description', 96)}${field('Type', 64)}${field('Who can see it', 64)}</section>
      <section class="le-panel"><div class="le-label" data-skel-keep>Your list</div><div class="ls-list">${Array.from({ length: 5 }, row).join('')}</div></section></div>
      <aside class="le-panel le-add"><div class="le-label" data-skel-keep>Add titles</div><div class="skel" style="height:40px;border-radius:10px;margin-bottom:10px"></div><div class="skel" style="height:42px;border-radius:10px;margin-bottom:10px"></div><div class="ls-results">${Array.from({ length: 6 }, pick).join('')}</div></aside></div></div>`;
});
// edit mode: the editor's skeleton instead of the list page's
if (_lvParams.get('edit') || _lvParams.get('new')) $('lvLoading').dataset.skel = 'le-page';

function _lvObserveCards() {
  if (!_lvRevealObserver) {
    _lvRevealObserver = new IntersectionObserver(entries => entries.forEach(entry => {
      if (entry.isIntersecting) { entry.target.classList.add('lv-in-view'); _lvRevealObserver.unobserve(entry.target); }
    }), { rootMargin: '0px 0px -8% 0px', threshold: 0.05 });
  }
  $('lvGrid').querySelectorAll('.lv-card').forEach(el => _lvRevealObserver.observe(el));
}

function _lvRenderGrid() {
  const grid = $('lvGrid');
  if (!_lvItems.length) {
    grid.className = '';
    grid.innerHTML = mssEmpty({ art: 'lists', title: 'This list is empty', text: 'A list with nothing on it is just a title with big plans.',
      actions: _lvOwn() || _lvShared ? [{ label: 'Add titles', icon: 'plus', href: MSSListActions.editURL(_lvList), primary: true }] : [] });
    return;
  }
  const shown = SF.list('lv', 'all');
  $('lvSfBar').innerHTML = SF.bar('lv', 'all');
  if (!shown.length) {
    grid.className = '';
    grid.innerHTML = mssEmpty({ compact: true, art: 'filter', title: 'Nothing matches these filters', text: 'Your filters are a little too picky. Loosen one and try again.',
      actions: [{ label: 'Clear filters', icon: 'x', onclick: "SF.clearFilters('lv', 'all'); SF.refresh('lv', 'all')", primary: true }] });
    return;
  }
  // Rank numbers: a ranked list in its own order (or reversed) → its place in the list; sorted by rating → its
  // place in that order (unrated titles get none); anything else → none
  const sort = SF.getSort('lv', 'all');
  const byScore = sort === 'highest' || sort === 'lowest';
  const byOrder = (sort === 'rank' || sort === 'rankRev') && _lvList?.ranked === true;
  let n = 0;
  const ranks = shown.map(e => byScore ? ((_lvIsTmdbOnly(e) ? null : liveScore(e)) != null ? n++ : null) : byOrder ? e._rank - 1 : null);
  grid.className = _lvView === 'list' ? 'lp-grid lv-rows' : 'lv-grid msf-grid';
  // Whole rows, the Library's system: grid starts with 5 rows and Show more adds 3; list view starts with 10
  // rows and adds 5 (a row = as many cards as fit right now)
  const sig = [sort, JSON.stringify(SF.filterState('lv', 'all')), _lvView].join('|');
  const R = _LV_ROWS[_lvView];
  if (_lvRows.sig !== sig) Object.assign(_lvRows, { sig, n: R[0] });
  const cols = _lvCols();
  _lvRows.cols = cols;
  const count = Math.min(shown.length, _lvRows.n * cols), left = shown.length - count;
  grid.innerHTML = shown.slice(0, count).map((e, i) => _lvView === 'list' ? _lvRowHTML(e, ranks[i]) : _lvCardHTML(e, ranks[i])).join('')
    + (left > 0 ? `<div class="msf-more lv-more"><button type="button" class="msf-more-btn" onclick="_lvMore()">Show ${Math.min(left, R[1] * cols)} more <small>· ${left} left</small></button></div>` : '');
  if (_lvView === 'grid') _lvObserveCards();
}
const _LV_ROWS = { grid: [5, 3], list: [10, 5] };   // first rows, rows per Show more (library-view.js's LIB_ROWS)
const _lvRows = {};
// how many cards one row holds: the real grid's columns (a number per column once it's laid out on the page)
function _lvCols() {
  const n = getComputedStyle($('lvGrid')).gridTemplateColumns.split(' ').filter(t => /^[\d.]+px$/.test(t)).length;
  return Math.max(1, n || (_lvView === 'list' ? 2 : 5));
}
// Show more: the next rows come in under the ones you've seen — the page stays where you are (owner)
function _lvMore() {
  const y = scrollY, from = $('lvGrid').querySelectorAll('.lv-card, .lv-lp').length;
  _lvRows.n += _LV_ROWS[_lvView][1];
  _lvRenderGrid();
  const cards = $('lvGrid').querySelectorAll('.lv-card, .lv-lp');
  for (let i = 0; i < from && i < cards.length; i++) cards[i].classList.add('lv-in-view');   // the ones already seen don't fade in again
  scrollTo({ top: y, behavior: 'instant' });   // (the page scrolls smoothly otherwise)
  cards[from]?.focus?.({ preventScroll: true });
}
// a wider or narrower window changes how many fit in a row: draw whole rows again
let _lvResizeT = 0;
addEventListener('resize', () => { clearTimeout(_lvResizeT); _lvResizeT = setTimeout(() => {
  const g = $('lvGrid'); if (!g?.firstElementChild || !_lvRows.cols) return;
  if (_lvCols() !== _lvRows.cols) _lvRenderGrid();
}, 200); }, { passive: true });

/* Sort & Filter — shared js/sort-filter.js module */
SF.register('lv', {
  base: () => _lvItems,
  render: () => _lvRenderGrid(),
  defaultSort: 'rank',
  // a ranked list reads "Rank · Top First"; any other list shows in the owner's order
  get presets() { return _lvList?.ranked === true ? {} : { rank: { header: 'Order', opts: [['rank', 'List Order'], ['rankRev', 'Reversed']] } }; },
  sorts: () => ['rank', 'alpha', 'release', 'ratings', 'runtime', 'seasons', 'episodes'],
  filters: () => ['genre', 'year', 'score', 'length'],
  choiceFilters: () => [SF.typeChoice({ cat: e => e.cat || (e.tmdb_type === 'movie' ? 'movies' : 'tv') })],
  scoreOf: e => _lvIsTmdbOnly(e) ? null : liveScore(e),
});

/* ── The hero ── */
function _lvHero() {
  const l = _lvList, own = _lvOwn(), p = l.profiles || {};
  document.title = `${l.title} — MyScreenFolio`;
  $('lvBack').setAttribute('href', _lvFrom);
  $('lvBack').textContent = '‹ ' + ({ 'lists.html': 'Lists', 'profile.html': 'Profile', 'friends.html': 'Friends' }[_lvFrom.split('?')[0]] || 'Back');
  $('lvOwner').innerHTML = ` · ${mssProfileLinkHTML({ id: l.user_id, username: p.username }, `<span class="lh-owner"><span class="lh-av">${safeURL(p.avatar_url) ? `<img src="${safeURL(p.avatar_url)}" alt="" loading="lazy">` : escHTML((p.username || '?')[0].toUpperCase())}</span>@${escHTML(p.username || 'user')}</span>`)}`;
  $('lvChips').innerHTML = (MSSList.officialBadge(l) || MSSList.rankBadge(l.ranked)) + mssVisBadge(l.visibility)
    + (_lvShared ? '<span class="cl-tag">Shared with you</span>' : '');
  $('lvTitle').textContent = l.title;
  $('lvDesc').textContent = l.description || '';
  $('lvDesc').hidden = !l.description;
  // Stats: titles · average (when there are ratings) · ordered by · updated (the last saved edit — sql/124)
  const avg = MSSList.average(l, id => _lvItems.find(e => e.id === id) || null);
  const order = l.sort_mode && l.sort_mode !== 'picked' ? MSSList.orderLabel(l.sort_mode) : own ? 'Your order' : `@${p.username || 'user'}’s order`;
  const stat = (k, v) => `<div class="lh-stat"><dt>${k}</dt><dd>${v}</dd></div>`;
  $('lvStats').innerHTML = stat('Titles', `<b>${_lvItems.length}</b>`)
    + (avg != null ? stat('Average', mssScoreHTML(avg, { cls: 'lh-score' })) : '')
    + stat('Ordered by', escHTML(order))
    + (l.updated_at ? stat('Updated', escHTML(_lvFmt(l.updated_at))) : '');
  const bdBtn = $('lvBdBtn');
  bdBtn.hidden = !own || !_lvItems.length;
  bdBtn.innerHTML = `${icon('image', 14)}<span>Edit backdrop</span>`;
  _lvPaintBackdrop();
}

/* The backdrop: the owner's pick (backdrop_item, sql/124 — this device until it runs), else the first title
   (the #1 of a ranked list). The pick is "<item id>|<TMDB backdrop path>" (one picture of that title), or an
   older "<item id>" (that title's own backdrop: an entry's owner's choice and framing, MSSBackdrop). */
const _lvBdKey = () => 'msf_list_bd_' + _lvList.id;
function _lvBdPick() {
  let v = _lvList.backdrop_item;
  if (!('backdrop_item' in _lvList)) try { v = localStorage.getItem(_lvBdKey()); } catch {}
  const [id, path] = String(v || '').split('|');
  return { id: id || null, path: /^\/[\w.-]{1,120}$/.test(path || '') ? path : null };
}
function _lvBdItem() {
  const { id } = _lvBdPick();
  return (id && _lvItems.find(e => e.id === id)) || _lvItems[0] || null;
}
async function _lvPaintBackdrop(previewPath) {
  const e = _lvBdItem(), img = $('lvBd'), hero = $('lvHero');
  if (!e) return;
  const pick = _lvBdPick(), path = previewPath !== undefined ? previewPath : pick.id === e.id ? pick.path : null;
  const real = !_lvIsTmdbOnly(e), phone = matchMedia('(max-width:640px)').matches;
  let u = path ? `https://image.tmdb.org/t/p/w1280${path}` : await MSSBackdrop.url(real ? e : { tmdb_id: e.tmdb_id, tmdb_type: e.tmdb_type }, 'w1280');
  const poster = !u;
  if (poster) u = safeURL(e.poster_url);
  if (!u) return;
  hero.classList.toggle('is-poster', poster);
  img.setAttribute('style', real && !poster && !path ? MSSBackdrop.style(e, true, phone ? 'phone' : 'desk') : '');
  if (img.getAttribute('src') === u) { hero.classList.add('has-bd'); return; }
  img.onload = () => hero.classList.add('has-bd');
  img.src = u; img.hidden = false;
}

/* Edit backdrop (owner) — like the Edit page's picker: first the list's titles; pick one and you see every
   backdrop TMDB has for it (grouped by language, a box to narrow them), tapping one tries it on the hero
   behind; "Use this backdrop" keeps it, Cancel puts the old one back, "Reset to default" → the first title's. */
let _bp = null;   // { h, item, pics, groups, lang, closed, sel, used }
const _bpLang = key => { if (key === 'none') return 'No language / Textless'; try { return new Intl.DisplayNames(['en'], { type: 'language' }).of(key) || key.toUpperCase(); } catch { return key.toUpperCase(); } };
async function _lvPickBackdrop() {
  await mssLoadScript('js/panel.js');
  const h = MSSPanel.open({ size: 'L', kind: 'generic', title: 'Edit backdrop', subtitle: _lvList.title, body: '<div id="bpBody"></div>',
    footer: _bpFooter(false),
    onClose: () => { if (_bp?.h === h) { if (!_bp.used) _lvPaintBackdrop(); _bp = null; } } });
  _bp = { h, item: null, pics: [], groups: [], lang: '', closed: new Set(), sel: null, used: false };
  h.body.addEventListener('click', ev => {
    const t = ev.target.closest('[data-bpi]'); if (t) return _bpOpenItem(t.dataset.bpi);
    const p = ev.target.closest('[data-pp]'); if (p) return _bpPick(Number(p.dataset.pp));
    const g = ev.target.closest('[data-ppg]'); if (g) { if (!_bp.closed.delete(g.dataset.ppg)) _bp.closed.add(g.dataset.ppg); _bpGrid(); }
    if (ev.target.closest('[data-bp-back]')) _bpTitles();
  });
  _bpTitles();
}
function _bpFooter(canUse) {
  const pick = _lvBdPick();
  return { secondary: [{ label: 'Cancel', onClick: x => x.close() }, ...(pick.id ? [{ label: 'Reset to default', onClick: () => _lvSetBackdrop(null) }] : [])],
    primary: { label: 'Use this backdrop', disabled: !canUse, onClick: () => { const p = _bp.pics[_bp.sel]; if (p) _lvSetBackdrop(`${_bp.item.id}|${p.file_path}`); } } };
}
// Step 1: the list's titles as posters (a normal poster picker, the pp-* grid)
function _bpTitles() {
  const cur = _lvBdItem();
  _bp.item = null; _bp.sel = null;
  _bp.h.setTitle('Edit backdrop', `${_lvList.title} · pick a title`);
  _bp.h.setFooter(_bpFooter(false));
  const linked = _lvItems.filter(e => e.tmdb_id && e.tmdb_type);
  $('bpBody').innerHTML = linked.length ? `<p class="pp-rule">${icon('info', 13)}<span>Pick a title, then choose one of its backdrops.</span></p>
    <div class="pp-grid bp-titles">${linked.map(e => {
      const r = _lvItems.indexOf(e) + 1, u = safeURL(e.poster_url);
      return `<button type="button" class="pp-opt${e === cur ? ' selected' : ''}" data-bpi="${escHTML(e.id)}" aria-label="${_lvList.ranked === true ? '#' + r + ' ' : ''}${escHTML(e.title)}${e === cur ? ' (now)' : ''}">
        ${u ? `<img src="${u}" alt="" loading="lazy">` : `<span class="bp-letter">${escHTML((e.title || '?')[0].toUpperCase())}</span>`}
        ${_lvList.ranked === true ? `<span class="cg-rank-badge ${r === 1 ? 'cg-rank-1' : r === 2 ? 'cg-rank-2' : r === 3 ? 'cg-rank-3' : 'cg-rank-other'}" aria-hidden="true">${r}</span>` : ''}</button>`;
    }).join('')}</div>`
    : `<p class="pp-empty">None of these titles is linked to TMDB, so there are no backdrops to choose from.</p>`;
}
// Step 2: every backdrop of one title
async function _bpOpenItem(id) {
  const e = _lvItems.find(x => x.id === id); if (!e) return;
  const at = _bp;
  Object.assign(_bp, { item: e, pics: [], groups: [], lang: '', closed: new Set(), sel: null });
  _bp.h.setTitle(`Backdrops · ${e.title}`, 'Loading…');
  _bp.h.setFooter(_bpFooter(false));
  $('bpBody').innerHTML = `<button type="button" class="bp-back" data-bp-back>${icon('chevleft', 15)} All titles</button>
    <div class="pp-tools"><div class="pp-lang" id="bpLang"></div></div><div class="pp-sel" id="bpSel" hidden></div>
    <div id="bpGrid"><div class="pp-grid is-wide" aria-label="Loading">${'<span class="pp-skel"></span>'.repeat(4)}</div></div>`;
  try {
    const res = await tmdbFetch(`${TMDB_BASE}/${e.tmdb_type === 'movie' ? 'movie' : 'tv'}/${Number(e.tmdb_id)}/images`);
    if (!res.ok) throw new Error('TMDB images');
    const data = await res.json();
    if (_bp !== at || _bp.item !== e) return;
    const pics = (data.backdrops || []).sort((a, b) => (b.vote_average || 0) - (a.vote_average || 0));
    _bp.h.setTitle(`Backdrops · ${e.title}`, `${pics.length} ${pics.length === 1 ? 'backdrop' : 'backdrops'}`);
    if (!pics.length) { $('bpGrid').innerHTML = '<p class="pp-empty">TMDB has no backdrops for this title.</p>'; return; }
    const groups = new Map();
    pics.forEach((p, i) => { const k = p.iso_639_1 || 'none'; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(i); });
    _bp.pics = pics;
    _bp.groups = [...groups.keys()].sort((a, b) => a === 'none' ? -1 : b === 'none' ? 1 : _bpLang(a).localeCompare(_bpLang(b))).map(key => ({ key, items: groups.get(key) }));
    const pick = _lvBdPick();
    _bp.sel = pick.id === e.id && pick.path ? pics.findIndex(p => p.file_path === pick.path) : -1;
    if (_bp.sel < 0) _bp.sel = null;
    MSSPicker.mount($('bpLang'), { id: 'bpLangPick', label: 'Language', value: '', placeholder: 'All languages', search: 'Search languages…',
      groups: [{ items: [{ value: '', label: 'All languages' }, ..._bp.groups.map(g => ({ value: g.key, label: `${_bpLang(g.key)} · ${g.items.length}`, keys: [g.key] }))] }],
      onChange: v => { _bp.lang = v || ''; _bp.closed.delete(_bp.lang); _bpGrid(); } });
    _bpGrid(); _bpSel();
  } catch (err) {
    console.error(err);
    if (_bp === at && _bp.item === e) { _bp.h.setTitle(`Backdrops · ${e.title}`, ''); $('bpGrid').innerHTML = '<p class="pp-empty">Couldn’t load the backdrops right now — please try again.</p>'; }
  }
}
function _bpGrid() {
  const grid = $('bpGrid'); if (!grid || !_bp?.item) return;
  grid.innerHTML = _bp.groups.filter(g => !_bp.lang || g.key === _bp.lang).map(g => {
    const open = !_bp.closed.has(g.key);
    return `<section class="pp-group"><h3 class="pp-group-h"><button type="button" class="pp-group-btn" data-ppg="${escHTML(g.key)}" aria-expanded="${open}">
        <span>${escHTML(_bpLang(g.key))}</span><span class="pp-count">${g.items.length}</span>${icon('chevdown', 16)}</button></h3>
      <div class="pp-grid is-wide"${open ? '' : ' hidden'}>${g.items.map((i, n) => `<button type="button" class="pp-opt${i === _bp.sel ? ' selected' : ''}" data-pp="${i}" aria-pressed="${i === _bp.sel}" aria-label="Backdrop ${n + 1} of ${g.items.length}"><img src="https://image.tmdb.org/t/p/w780${_bp.pics[i].file_path}" alt="" loading="lazy"></button>`).join('')}</div></section>`;
  }).join('');
}
function _bpSel() {
  const box = $('bpSel'), p = _bp.pics[_bp.sel];
  box.hidden = !p; if (!p) return;
  const bits = [_bpLang(p.iso_639_1 || 'none'), p.width && p.height ? `${p.width} × ${p.height}` : '', p.vote_count ? `★ ${mssR1(Number(p.vote_average))} · ${p.vote_count} ${p.vote_count === 1 ? 'vote' : 'votes'} on TMDB` : ''].filter(Boolean);
  box.innerHTML = `<img src="https://image.tmdb.org/t/p/w300${p.file_path}" alt="" class="is-wide"><div><h3 class="lyr-sec-h">Selected backdrop</h3><p>${bits.map(escHTML).join(' · ')}</p></div>`;
}
function _bpPick(i) {
  const p = _bp?.pics[i]; if (!p) return;
  _bp.sel = i;
  _bp.h.body.querySelectorAll('[data-pp]').forEach(b => { const on = Number(b.dataset.pp) === i; b.classList.toggle('selected', on); b.setAttribute('aria-pressed', on); });
  _bpSel();
  const pick = _lvBdPick();
  _bp.h.setPrimary({ disabled: pick.id === _bp.item.id && pick.path === p.file_path });
  // try it on the hero behind the panel
  const img = $('lvBd'); img.setAttribute('style', ''); img.src = `https://image.tmdb.org/t/p/w1280${p.file_path}`; img.hidden = false;
  $('lvHero').classList.remove('is-poster');
}
async function _lvSetBackdrop(v) {
  const prev = _lvList.backdrop_item;
  if ('backdrop_item' in _lvList) {
    _lvList.backdrop_item = v;
    const { error } = await sb.from('favorite_lists').update({ backdrop_item: v }).eq('id', _lvList.id).eq('user_id', _lvUser.id);
    if (error) { _lvList.backdrop_item = prev; showToast('Couldn’t save that — try again.', 'err'); return; }
  } else try { v ? localStorage.setItem(_lvBdKey(), v) : localStorage.removeItem(_lvBdKey()); } catch {}
  if (_bp) { _bp.used = true; _bp.h.closeNow(); }
  _lvPaintBackdrop();
  showToast(v ? 'Backdrop changed.' : 'Back to the default backdrop.');
}

/* ── The bar under the hero: Edit list (owner / shared) · Share · Export · ⋯ · likes (someone else's) ── */
function _lvBar() {
  const l = _lvList, own = _lvOwn(), b = (a, label, ic, cls = '') => `<button type="button" class="lv-btn${cls}" onclick="${a}">${icon(ic, 15)}<span>${label}</span></button>`;
  const canShare = !!_lvUser && l.cat === 'custom' && (l.visibility === 'anyone' || own);
  const st = _lvReact;
  const react = like => `<button type="button" class="lv-btn is-icon${st?.mine === (like ? 'like' : 'dislike') ? ' is-on' : ''}"${like ? ' data-like' : ''} onclick="_lvLike(${like})" aria-pressed="${st?.mine === (like ? 'like' : 'dislike')}" aria-label="${like ? 'Like' : 'Dislike'}: ${st ? (like ? st.like : st.dislike) : 0}">${icon(st?.mine === (like ? 'like' : 'dislike') ? (like ? 'thumbsUpFilled' : 'thumbsDownFilled') : (like ? 'thumbsUp' : 'thumbsDown'), 15)}<span>${st ? (like ? st.like : st.dislike) : 0}</span></button>`;
  $('lvActions').innerHTML = (own || _lvShared ? b(`location.href=${escHTML(JSON.stringify(MSSListActions.editURL(l)))}`, 'Edit list', 'edit', ' is-main') : '')
    + (canShare ? b('MSSListActions.share(_lvList)', 'Share', 'send') : '')
    + (_lvUser ? `<button type="button" class="lv-btn is-icon" onclick="MSSListActions.exportList(_lvList)" aria-label="Export" title="Export">${icon('download', 15)}</button>` : '')
    + (_lvUser ? `<button type="button" class="lv-btn is-icon" onclick="_lvMenu(this)" aria-label="More actions" aria-haspopup="menu" data-top-more>${icon('moreV', 15)}</button>` : '')
    + (!own && st ? `<span class="lv-react" data-dbl-like>${react(true)}${react(false)}</span>` : '');
}
// ⋯: yours → Invite collaborators · Delete list…; shared with you → Leave list…; someone else's → Add to my lists · Report
async function _lvMenu(btn) {
  await mssLoadScript('js/panel.js');
  const l = _lvList, items = [], add = (label, ic, fn, danger) => items.push({ label, icon: ic, onSelect: fn, danger });
  const resolve = id => _lvItems.find(e => e.id === id) || null;
  if (_lvOwn()) {
    add('Invite collaborators', 'users', () => MSSListActions.collab(l));
    items.push({ divider: true });
    add('Delete list…', 'trash', async () => { if (await MSSListActions.remove(l)) location.replace(_lvFrom); }, true);
  } else if (_lvShared) add('Leave list…', 'x', async () => { if (await MSSListActions.leave(l)) location.replace(_lvFrom); }, true);
  else {
    add('Add to my lists', 'plus', () => MSSListActions.fork(l, resolve));
    if (!l.official) add('Report', 'flag', () => mssReport('list', l.id));
  }
  MSSPopover.open(btn, { title: l.title, label: 'List actions', items });
}
async function _lvLike(isLike) {
  if (!_lvUser) return mssJoin('react to lists');
  _lvReact = await mssReact('list', _lvList.id, isLike, _lvReact || { like: 0, dislike: 0, mine: null });
  _lvBar();
}

/* ── Loading ── */
async function _lvLoad() {
  try {
    let { data: list, error } = await sb.from('favorite_lists').select('*, profiles(username, avatar_url)').eq('id', _lvListId).maybeSingle();
    if (error) throw error;
    // A private list (068) opened from its link: list-view.html?list=…&k=<token>
    if (!list && _lvParams.get('k')) {
      const { data } = await sb.rpc('open_list_link', { p_list: _lvListId, p_token: _lvParams.get('k') });
      list = (data || [])[0] || null;
      if (list) list.profiles = (await sb.from('profiles').select('username, avatar_url').eq('id', list.user_id).maybeSingle()).data;
    }
    if (!list) { mssErrorPage('list'); return null; }
    _lvList = list;
    if (_lvUser && !_lvOwn()) {
      const { data: c } = await sb.from('list_collaborators').select('status').eq('list_id', list.id).eq('user_id', _lvUser.id).eq('status', 'accepted').limit(1);
      _lvShared = !!c?.length;
    }
    const items = list.items || [], map = {};
    const entryIds = items.filter(id => !MSSList.isTmdbId(id));
    if (entryIds.length) {
      const { data: rows } = await sb.from('entries').select('*').in('id', entryIds);
      (rows || []).forEach(e => { map[e.id] = e; });
      await mssFillHiddenListItems(entryIds, map);   // titles hidden from you (073): name + poster only
    }
    await MSSList.hydrate([list]);
    const look = id => MSSList.isTmdbId(id) ? MSSList.tmdb(id) : map[id];
    // A list set to an order (Ratings Highest, Date Watched…) shows in it even if a score changed since it was
    // last saved; your own is saved that way too (db.js keeps it so from now on)
    if (MSSOrder.reorder(list, list.sort_mode, id => look(id) || null) && _lvOwn())
      sb.from('favorite_lists').update({ items: list.items }).eq('id', list.id).eq('user_id', _lvUser.id).then(() => {}, () => {});
    _lvItems = list.items.map(look).filter(Boolean).map((e, i) => Object.assign({}, e, { _rank: i + 1 }));
    mssSkeleton.shape('lv', { n: Math.min(_lvItems.length, 15) });
    return list;
  } catch (err) {
    console.error('Load list error:', err);
    mssErrorPage(mssErrorKind(err), { error: err });
    return null;
  }
}
function _lvShow() {
  $('lvLoading').remove();
  $('lvContent').style.display = '';   // shown first: the grid's row length is measured from the real page
  _lvHero(); _lvBar(); _lvRenderViewToggle(); _lvRenderGrid();
  if (_lvUser && !_lvOwn() && !_lvShared) mssReactions('list', _lvList.id).then(st => { _lvReact = st; _lvBar(); }).catch(() => {});
}

/* ── Edit mode: ?list=…&edit=1 (yours, or shared with you) and ?new=1 — the list editor (list-studio.js) ── */
async function _lvEdit(list) {
  await mssLoadScript('js/list-studio.js');
  const entries = await getEntries(_lvUser.id) || [];
  const map = Object.fromEntries(entries.map(e => [e.id, e]));
  _lvItems.forEach(e => { if (!map[e.id]) map[e.id] = e; });   // a shared list's titles that aren't yours
  const resolve = id => MSSList.isTmdbId(id) ? MSSList.tmdb(id) : map[id] || null;
  if (list) { list._collab = !_lvOwn(); list._owner = list.profiles; }
  MSSListStudio.init({ root: $('lvEditor'), lists: () => list ? [list] : [], entries: () => entries, resolve,
    save: _lvSaveList, remove: l => MSSListActions.remove(l),
    afterSave: (saved, isNew, collab) => {
      const go = () => location.replace(MSSList.url(saved));
      if (isNew && collab) MSSListActions.collab(saved, go); else go();
    },
    onClose: deleted => { location.href = deleted || !list ? _lvFrom : MSSList.url(list); } });
  $('lvLoading')?.remove();
  $('lvEditor').hidden = false;
  document.body.dataset.ownActions = '';   // the editor's own Save bar: no Create button over it
  document.title = `${list ? 'Edit ' + list.title : 'New list'} — MyScreenFolio`;
  MSSListStudio.open(list ? { id: list.id } : {});
}
async function _lvSaveList(list) {
  if (list.id) {
    const upd = { items: list.items, title: list.title, description: list.description, ranked: list.ranked ?? null, sort_mode: list.sort_mode, visibility: list.visibility };
    const { data, error } = await sb.from('favorite_lists').update(upd).eq('id', list.id).eq('user_id', _lvUser.id).select().single();
    if (error) throw error;
    return data;
  }
  const { data, error } = await sb.from('favorite_lists')
    .insert({ user_id: _lvUser.id, cat: list.cat, genre: list.genre, title: list.title, description: list.description || null, items: list.items || [], ranked: list.ranked ?? null, sort_mode: list.sort_mode ?? null, visibility: list.visibility || 'anyone' })
    .select().single();
  if (error) throw error;
  return data;
}

/* ══ Invite link: list-view.html?list=…&join=<token> ══
   Opening an owner's invite link asks whether you want to collaborate.
   Accept → you're added (list lands at the top of your Lists).
   Decline / invalid → the link part is dropped and it's a normal list page. */
const _lvJoinToken = new URLSearchParams(location.search).get('join');

function _lvDropJoinParam() {
  const url = new URL(location.href); url.searchParams.delete('join'); history.replaceState(null, '', url);
}

async function _lvHandleJoinLink() {
  if (!_lvJoinToken || !_lvList) return;
  let state = 'invalid';
  try {
    const { data, error } = await sb.rpc('check_list_join_token', { p_list_id: _lvList.id, p_token: _lvJoinToken });
    if (error) throw error;
    state = data;
  } catch (e) { console.warn('Join link check failed:', e); }
  if (state === 'owner')  { _lvDropJoinParam(); return; }
  if (state === 'member') { _lvDropJoinParam(); showToast("You're already collaborating on this list."); return; }
  if (state === 'invalid') { _lvDropJoinParam(); showToast('This invite link has expired or was reset.', 'err'); return; }
  _lvShowJoinPopup();
}

// A list invite: the shared confirm (Accept / Decline — or, signed out, Join this list / Not now)
async function _lvShowJoinPopup() {
  const l = _lvList, owner = l.profiles || {}, count = (l.items || []).length;
  const ok = await showConfirm({ title: 'List invite',
    message: `@${owner.username || 'user'} invited you to collaborate on “${l.title}” (${count} ${count === 1 ? 'title' : 'titles'}). As a collaborator you can add and remove titles. Only the owner can rename or delete the list.`,
    confirmText: _lvUser ? 'Accept' : 'Join this list', cancelText: _lvUser ? 'Decline' : 'Not now', iconName: 'users', danger: false });
  if (ok && !_lvUser) { mssJoin('join this list'); return; }
  _lvJoinRespond(ok);
}

async function _lvJoinRespond(accept) {
  _lvDropJoinParam();
  if (!accept) return;
  try {
    const { data, error } = await sb.rpc('join_list_with_token', { p_list_id: _lvList.id, p_token: _lvJoinToken });
    if (error) throw error;
    if (data === 'invalid') { showToast('This invite link has expired or was reset.', 'err'); return; }
    showToast(data === 'member' ? "You're already collaborating on this list." : "You joined! It's at the top of your Lists.");
    _lvShared = true; _lvBar();
  } catch (e) {
    console.error(e);
    showToast(isRateLimitError(e) ? RATE_LIMIT_MESSAGE : 'Could not join — try again.', 'err');
  }
}

document.addEventListener('DOMContentLoaded', () => {
  initPageGuest(async (user) => {
    _lvUser = user;
    if (_lvParams.get('new')) {
      if (!user) { mssJoin('make lists'); return; }
      return _lvEdit(null);
    }
    if (!_lvListId) { mssErrorPage('badlink'); return; }
    const list = await _lvLoad();
    if (!list) return;
    if (_lvParams.get('edit') && (_lvOwn() || _lvShared)) return _lvEdit(list);
    _lvShow();
    _lvHandleJoinLink();
  });
});
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW failed:', e));
  });
}
</script>
