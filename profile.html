/* ── Library tab: friend-view styles ── */

.export-overlay.open{display:flex;}

.export-popup-title{font-family:var(--serif);font-size:26px;font-weight:500;color:var(--text);}

.export-popup-desc{font-size:13px;color:var(--text-2);line-height:1.6;max-width:260px;}

.export-theme-row{display:flex;align-items:center;justify-content:space-between;width:100%;padding:10px 14px;background:var(--bg-2);border:0.5px solid var(--border-2);border-radius:var(--radius-sm);}

.export-theme-label{font-size:12px;color:var(--text-2);font-weight:500;}

.export-theme-btns{display:flex;gap:4px;}

.eth-btn{padding:5px 14px;border-radius:var(--radius-xs);font-size:12px;font-weight:500;border:1px solid var(--border-2);background:transparent;color:var(--text-3);cursor:pointer;transition:all .15s;}

.eth-btn.active{background:var(--olive);border-color:var(--olive-light);color:#fff;}

.export-popup-actions{display:flex;gap:10px;width:100%;margin-top:6px;}

.export-popup-cancel{flex:1;padding:11px;background:transparent;border:1.5px solid var(--border-2);border-radius:var(--radius-sm);color:var(--text-2);font-size:13px;font-weight:500;cursor:pointer;}

/* ══ Profile Header — Instagram style ══ */
.prof-header {
  display:flex;
  flex-direction:column;
  align-items:stretch;
  gap:0;
  padding:1.75rem 0 1.5rem;
  position:relative;
  margin-bottom:1.5rem;
}
.prof-header::after {
  content:'';
  position:absolute;
  bottom:0;
  left:calc(-50vw + 50%);
  width:100vw;
  height:0.5px;
  background:var(--border);
}
/* Top row: avatar left + info right */
.prof-header-top {
  display:flex;
  flex-direction:row;
  align-items:flex-start;
  gap:1.5rem;
  margin-bottom:14px;
}
.prof-avatar {
  width:110px; height:110px; border-radius:50%; flex-shrink:0;
  background:var(--olive-faint); border:2.5px solid var(--olive-light);
  font-family:var(--serif); font-size:44px; color:var(--olive-light);
  display:flex; align-items:center; justify-content:center; overflow:hidden;
}
.prof-avatar img { width:100%; height:100%; object-fit:cover; border-radius:50%; }
.prof-header-info {
  flex:1; min-width:0;
  display:flex; flex-direction:column; justify-content:center;
  padding-top:4px;
}
.prof-username {
  font-family:var(--serif); font-size:30px; font-weight:600;
  color:var(--text); line-height:1.1; margin-bottom:5px;
}
.prof-displayname { font-size:15px; color:var(--text-2); margin-bottom:10px; font-weight:400; }
.prof-bio { font-size:14px; color:var(--text); line-height:1.6; margin-bottom:8px; }
.prof-quote {
  font-family:var(--sans); font-style:italic;
  font-size:14px; font-weight:400; color:var(--text-2);
  padding-left:14px; border-left:3px solid var(--olive-light);
  margin-bottom:0; line-height:1.6;
}
/* Stat boxes — full width below avatar+info */
.prof-stat-boxes {
  width:100%;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:6px;
}
.prof-stat-box {
  background:var(--card); border:0.5px solid var(--border-olive); border-radius:var(--radius);
  padding:.5rem .6rem; display:flex; flex-direction:column; align-items:center; justify-content:center;
  transition:border-color var(--trans) var(--ease);
  grid-column:span 2; min-width:0; overflow:hidden;
}
.prof-stat-box:hover { border-color:var(--border-olive); }
.prof-stat-box-num { font-family:var(--serif); font-size:22px; font-weight:500; color:var(--olive-light); line-height:1.15; text-align:center; }
.prof-stat-box-label { font-size:8px; color:var(--text-3); text-transform:uppercase; letter-spacing:1px; margin-top:3px; white-space:nowrap; text-align:center; }
/* Action buttons — full width, centered */
.prof-header-actions {
  display:flex; gap:8px; flex-wrap:wrap; align-items:center;
  justify-content:center; padding-top:10px; width:100%;
}
.prof-edit-btn {
  padding:7px 18px; border-radius:var(--radius-sm);
  border:0.5px solid var(--border-olive); background:transparent;
  color:var(--olive-light); font-size:12px; font-weight:500; cursor:pointer;
  text-decoration:none; display:inline-block; transition:background .15s;
}
.prof-edit-btn:hover { background:var(--olive-faint); }
.prof-share-btn {
  padding:7px 18px; border-radius:var(--radius-sm);
  border:0.5px solid var(--border-2); background:transparent;
  color:var(--text-2); font-size:12px; font-weight:500; cursor:pointer;
  display:inline-flex; align-items:center; gap:5px; transition:all .15s;
}
.prof-share-btn:hover { border-color:var(--border-olive); color:var(--olive-light); }
/* Share popup */
.prof-share-popup {
  position:fixed; inset:0; z-index:1200; background:rgba(0,0,0,0.72);
  display:flex; align-items:center; justify-content:center; padding:16px;
  opacity:0; pointer-events:none; transition:opacity .2s var(--ease);
}
.prof-share-popup.open { opacity:1; pointer-events:auto; }
.prof-share-card {
  background:var(--bg-2); border:1.5px solid var(--olive-light);
  box-shadow:4px 4px 0 var(--olive); border-radius:var(--radius-lg);
  padding:24px; width:100%; max-width:400px;
  transform:translateY(16px); transition:transform .24s var(--ease);
}
.prof-share-popup.open .prof-share-card { transform:translateY(0); }
.prof-share-title { font-family:var(--serif); font-size:20px; font-weight:500; margin-bottom:6px; }
.prof-share-sub { font-size:12px; color:var(--text-3); margin-bottom:16px; }
.prof-share-link {
  display:flex; align-items:center; gap:8px;
  background:var(--bg-3); border:0.5px solid var(--border-2);
  border-radius:var(--radius-sm); padding:10px 14px;
  font-size:12px; color:var(--text-2); word-break:break-all;
  cursor:pointer; transition:border-color .15s; margin-bottom:14px;
}
.prof-share-link:hover { border-color:var(--border-olive); }
.prof-share-link svg { flex-shrink:0; }
.prof-share-actions { display:flex; gap:8px; }
.prof-share-copy { flex:1; padding:10px; background:var(--olive); border:none; color:#fff; border-radius:var(--radius-sm); font-size:13px; font-weight:500; cursor:pointer; }
.prof-share-copy:hover { background:var(--olive-2); }
.prof-share-close { padding:10px 16px; background:transparent; border:0.5px solid var(--border-2); color:var(--text-2); border-radius:var(--radius-sm); font-size:13px; cursor:pointer; }

/* ── Profile stats (5 boxes) ── */
function computeProfileStats(entries) {
  var done = entries.filter(function(e){ return e.status === 'completed' || e.status === 'ongoing'; });
  // Avg score
  var rated = done.filter(function(e){ return liveScore(e) != null; });
  var avgScore = rated.length
    ? (rated.reduce(function(s,e){ return s + Number(liveScore(e)); }, 0) / rated.length).toFixed(1)
    : null;
  // TV shows: cat=tv, OR (anime/cartoons where _type !== 'movie')
  var tvCount = done.filter(function(e){
    if (e.cat === 'tv') return true;
    if (e.cat === 'anime' || e.cat === 'cartoons') return (e.ratings && e.ratings._media_type) ? e.ratings._media_type !== 'movie' : true;
    return false;
  }).length;
  // Movies: cat=movies, OR (anime/cartoons where _type === 'movie')
  var movieCount = done.filter(function(e){
    if (e.cat === 'movies') return true;
    if (e.cat === 'anime' || e.cat === 'cartoons') return e.ratings && e.ratings._media_type === 'movie';
    return false;
  }).length;
  // Episodes: all non-movie entries not in queue
  var totalEps = entries
    .filter(function(e){ return e.status !== 'queue' && e.cat !== 'movies' && !(e.ratings && e.ratings._media_type === 'movie'); })
    .reduce(function(sum,e){
      if (e.status === 'completed' || e.status === 'ongoing') return sum + (Number(e.total_eps) || Number(e.watched) || 0);
      return sum + (Number(e.watched) || 0);
    }, 0);
  // Runtime: all completed/ongoing movies
  var movieMins = done
    .filter(function(e){ return e.cat === 'movies' || (e.ratings && e.ratings._media_type === 'movie'); })
    .reduce(function(sum,e){ return sum + (Number(e.runtime_h)||0)*60 + (Number(e.runtime_m)||0); }, 0);
  var rtH = Math.floor(movieMins/60), rtM = movieMins%60;
  var runtime = movieMins ? (rtH ? rtH+'h '+rtM+'m' : rtM+'m') : null;
  return { avgScore: avgScore, tvCount: tvCount, movieCount: movieCount, totalEps: totalEps, runtime: runtime };
}

async function loadLibComments(prefix, entryId) {
  var body = document.getElementById(prefix+'LccList');
  var count = document.getElementById(prefix+'LccCount');
  if (!body) return;
  try {
    var comments = await getComments(entryId);
    var u = await getCurrentUser();
    var me = u && u.id;
    var esc = function(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');};
    if (!comments.length) {
      body.innerHTML = '<div class="lcc-empty">No comments yet — be the first!</div>';
      if (count) count.style.display = 'none';
      return;
    }
    var topC  = comments.filter(function(c){return !c.reply_to;});
    var repsC = comments.filter(function(c){return c.reply_to;});
    body.innerHTML = topC.map(function(c) {
      var uname = esc((c.profiles&&c.profiles.username)||'Unknown');
      var date  = new Date(c.created_at).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
      var reps  = repsC.filter(function(r){return r.reply_to===c.id;});
      var repHTML = reps.map(function(r){
        var runame = esc((r.profiles&&r.profiles.username)||'Unknown');
        var rdate  = new Date(r.created_at).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
        return '<div class="det-reply-item" id="lcm-'+r.id+'">'
          +'<div class="det-reply-author" style="color:var(--olive-light);">@'+runame+'</div>'
          +'<div class="det-reply-text">'+esc(r.content).replace(/(@[\w]+)/g,'<span style="color:var(--olive-light);font-weight:600">$1</span>')+'</div>'
          +'<div class="det-reply-meta"><span>'+rdate+'</span>'
          +(r.author_id===me?'<button class="cc-del" onclick="deleteLibComment(\''+prefix+'\',\''+r.id+'\',\''+entryId+'\')">delete</button>':'')
          +'</div></div>';
      }).join('');
      return '<div class="lcc-comment" id="lcm-'+c.id+'">'
        
        +'<div class="lcc-comment-body">'
        +'<div class="lcc-author" style="color:var(--olive-light);">@'+uname+'</div>'
        +'<div class="lcc-text">'+esc(c.content)+'</div>'
        +'<div class="lcc-meta"><span>'+date+'</span>'
        +'<button class="det-comment-reply-btn" onclick="libReply(\''+prefix+'\',\''+c.id+'\',\''+uname+'\',\''+entryId+'\')">Reply</button>'
        +(c.author_id===me?'<button class="cc-del" onclick="deleteLibComment(\''+prefix+'\',\''+c.id+'\',\''+entryId+'\')">delete</button>':'')
        +'</div>'+repHTML+'<div id="lcrep-'+c.id+'"></div>'
        +'</div></div>';
    }).join('');
    if (count) { count.textContent = comments.length + ' comment' + (comments.length !== 1 ? 's' : ''); count.style.display = 'block'; }
  } catch(err) { showToast('Could not load comments.','err'); }
}

async function postLibComment(prefix) {
  var input = document.getElementById(prefix+'LccInput');
  var content = input && input.value.trim();
  var entryId = _libCmtEntryId[prefix];
  if (!content || !entryId) return;
  try {
    input.disabled = true;
    await addComment(entryId, content);
    input.value = '';
    await loadLibComments(prefix, entryId);
  } catch(err) { showToast('Could not post comment.','err'); }
  finally { if(input){input.disabled=false;input.focus();} }
}

async function deleteLibComment(prefix, commentId, entryId) {
  try {
    await deleteComment(commentId);
    await loadLibComments(prefix, entryId);
  } catch(err) { showToast('Could not delete.','err'); }
}

function libReply(prefix, commentId, username, entryId) {
  var prev = _libReplyFor[prefix];
  if (prev) { var pe=document.getElementById('lcrep-'+prev); if(pe) pe.innerHTML=''; }
  if (prev===commentId) { _libReplyFor[prefix]=null; return; }
  _libReplyFor[prefix] = commentId;
  var box = document.getElementById('lcrep-'+commentId);
  if (!box) return;
  box.innerHTML = '<div class="det-reply-form">'
    +'<input class="det-reply-input" id="lri-'+commentId+'" value="@'+username+' " placeholder="Reply..."'
    +' onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();postLibReply(\''+prefix+'\',\''+entryId+'\',\''+commentId+'\')}">'
    +'<button class="det-reply-send" onclick="postLibReply(\''+prefix+'\',\''+entryId+'\',\''+commentId+'\')">Reply</button>'
    +'<button class="det-comment-del" onclick="document.getElementById(\'lcrep-'+commentId+'\').innerHTML=\'\';_libReplyFor[\''+prefix+'\']=null" style="margin-left:4px;">&#x2715;</button>'
    +'</div>';
  var ri = document.getElementById('lri-'+commentId);
  if (ri) ri.focus();
}

async function postLibReply(prefix, entryId, commentId) {
  var input = document.getElementById('lri-'+commentId);
  var content = input && input.value.trim();
  if (!content) return;
  input.disabled = true;
  try {
    await addComment(entryId, content, commentId);
    document.getElementById('lcrep-'+commentId).innerHTML = '';
    _libReplyFor[prefix] = null;
    await loadLibComments(prefix, entryId);
  } catch(err) { showToast('Could not post reply.','err'); if(input) input.disabled=false; }
}

/* ── Share Profile ── */
function openShareProfile() {
  var un = (_pProfile && _pProfile.username) || (_pUser && _pUser.email && _pUser.email.split('@')[0]) || '';
  var base = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
  var url = base + 'profile-view.html?u=' + encodeURIComponent(un);
  // Use navigator.share if available
  if (navigator.share) {
    navigator.share({ title: 'MyScreenScore — @'+un, url: url }).catch(function(){});
    return;
  }
  // Fallback: show popup
  var popup = document.getElementById('profSharePopup');
  if (!popup) {
    popup = document.createElement('div');
    popup.className = 'prof-share-popup';
    popup.id = 'profSharePopup';
    popup.innerHTML = '<div class="prof-share-card">'
      +'<div class="prof-share-title">Share Profile</div>'
      +'<div class="prof-share-sub">Anyone with this link can view your profile and send you a friend request.</div>'
      +'<div class="prof-share-link" id="profShareLink" onclick="profCopyLink()">'
      +'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>'
      +'<span id="profShareUrl"></span>'
      +'</div>'
      +'<div class="prof-share-actions">'
      +'<button class="prof-share-copy" onclick="profCopyLink()">Copy Link</button>'
      +'<button class="prof-share-close" onclick="closeShareProfile()">Close</button>'
      +'</div></div>';
    popup.addEventListener('click', function(e){ if(e.target===popup) closeShareProfile(); });
    document.body.appendChild(popup);
  }
  document.getElementById('profShareUrl').textContent = url;
  popup._url = url;
  popup.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeShareProfile() {
  var p = document.getElementById('profSharePopup');
  if (p) { p.classList.remove('open'); document.body.style.overflow = ''; }
}
function profCopyLink() {
  var p = document.getElementById('profSharePopup');
  var url = p && p._url;
  if (!url) return;
  navigator.clipboard && navigator.clipboard.writeText(url).then(function(){ showToast('Link copied!'); });
}

// After a delete from either popup: drop it from this page and re-render
function _profRemoveEntry(x) {
  _pEntries = _pEntries.filter(function(en){ return en.id !== x.id; });
  delete _profEntryMap[x.id];
  renderLibrary();
}

function openProfInfoPopup(id) {
  var e = _profEntryMap[id] || _pEntries.find(function(en){ return en.id===id; });
  if (e) _profViews(e);
}

// Your title: Info · Ratings · Note in one popup (MSSViews, info-popup.js). Opens on
// Ratings once it's rated/watched, otherwise on Info.
function _profViews(e) {
  var rated = e.status === 'completed' || e.status === 'ongoing' || liveScore(e) != null;
  MSSViews.open(e, {
    start: rated ? 'rate' : 'info', own: true, from: 'profile.html',
    onChange: function(){ renderLibrary(); }, onNoteSaved: function(){ renderLibrary(); }, onDelete: _profRemoveEntry
  });
}
