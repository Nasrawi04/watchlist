.pv-section { margin-bottom:2.5rem; }

.pv-eyebrow { font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--olive-light); margin-bottom:4px; }

.pv-title { font-family:var(--serif); font-size:22px; font-weight:500; margin-bottom:1rem; }

.pv-empty { text-align:center; padding:2rem; color:var(--text-3); font-size:13px; }

.fav-edit-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:var(--radius-sm);border:0.5px solid var(--border-olive);background:transparent;color:var(--olive-light);font-size:12px;cursor:pointer;transition:background .15s;}

.fav-edit-btn:hover{background:var(--olive-faint);}
/* ── Exports tab: the Export Studio + quick exports (export-studio.js) ── */
.xp-hero{display:flex;align-items:center;gap:20px;padding:22px 24px;border-radius:var(--radius-lg);background:radial-gradient(120% 140% at 0% 0%,var(--olive-faint),transparent 60%),var(--bg-3);border:1px solid var(--border-olive);}
.xp-hero-ic{flex:none;width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:var(--olive);color:#fff;}
.xp-hero-text{flex:1;min-width:0;}
.xp-hero-text b{display:block;font-size:17px;font-weight:700;color:var(--text);}
.xp-hero-text span{display:block;margin-top:3px;font-size:13px;color:var(--text-2);line-height:1.5;}
.xp-hero .btn-add-entry{flex:none;}
.xp-label{margin:22px 0 10px;font-family:'Oswald',var(--sans);font-size:11.5px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;color:var(--text-3);}
/* quick exports: the original export cards (olive outline, offset shadow, pressed on tap) */
.xp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;}
.xp-card{font:inherit;color:inherit;text-align:start;width:100%;background:var(--bg-3);border:1.5px solid var(--olive-light);box-shadow:4px 4px 0 var(--olive);border-radius:var(--radius-lg);padding:1.25rem;cursor:pointer;transition:transform 150ms,box-shadow 150ms,background 200ms;display:flex;flex-direction:column;gap:8px;}
.xp-card:hover{background:var(--olive-faint);}
.xp-card:active{transform:translate(4px,4px);box-shadow:none;}
.xp-card:focus-visible{outline:2px solid var(--olive-light);outline-offset:3px;}
.xp-card-ic{display:flex;align-items:center;color:var(--olive-light);}
.xp-card-ic svg{width:28px;height:28px;stroke-width:1.5;}
.xp-card-text b{display:block;font-size:14px;font-weight:600;color:var(--text);}
.xp-card-text small{display:block;margin-top:4px;font-size:11.5px;color:var(--text-2);line-height:1.5;}
[dir="rtl"] .xp-card:active{transform:translate(-4px,4px);}
@media(prefers-reduced-motion:reduce){.xp-card{transition:none;}.xp-card:active{transform:none;}}
@media(max-width:600px){.xp-hero{flex-wrap:wrap;padding:18px;gap:14px;}.xp-hero .btn-add-entry{width:100%;justify-content:center;}.xp-grid{grid-template-columns:repeat(2,1fr);}.xp-card{padding:1rem;gap:6px;}.xp-card-ic svg{width:22px;height:22px;}.xp-card-text b{font-size:13px;}}

/* ══ Profile Header — Instagram style ══ */
.prof-header {
  display:flex;
  flex-direction:column;
  align-items:stretch;
  gap:0;
  padding:1.75rem 0 1.5rem;
  position:relative;
  margin-bottom:1.5rem;
}
.prof-header::after {
  content:'';
  position:absolute;
  bottom:0;
  inset-inline-start:calc(-50vw + 50%);
  width:100vw;
  height:0.5px;
  background:var(--border);
}
/* Top row: avatar left + info right */
.prof-header-top {
  display:flex;
  flex-direction:row;
  align-items:flex-start;
  gap:1.5rem;
  margin-bottom:14px;
}
.prof-avatar {
  width:110px; height:110px; border-radius:50%; flex-shrink:0;
  background:var(--olive-faint); border:2.5px solid var(--olive-light);
  font-family:var(--serif); font-size:44px; color:var(--olive-light);
  display:flex; align-items:center; justify-content:center; overflow:hidden;
}
.prof-avatar img { width:100%; height:100%; object-fit:cover; border-radius:50%; }
.prof-header-info {
  flex:1; min-width:0;
  display:flex; flex-direction:column; justify-content:center;
  padding-top:4px;
}
.prof-username {
  font-family:var(--serif); font-size:30px; font-weight:600;
  color:var(--text); line-height:1.1; margin-bottom:5px;
}
.prof-displayname { font-size:15px; color:var(--text-2); margin-bottom:10px; font-weight:400; }
.prof-bio { font-size:14px; color:var(--text); line-height:1.6; margin-bottom:8px; }
.prof-quote {
  font-family:var(--sans); font-style:italic;
  font-size:14px; font-weight:400; color:var(--text-2);
  padding-inline-start:14px; border-inline-start:3px solid var(--olive-light);
  margin-bottom:0; line-height:1.6;
}
/* Stat boxes — full width below avatar+info */
.prof-stat-boxes {
  width:100%;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:6px;
}
.prof-stat-box {
  background:var(--card); border:0.5px solid var(--border-olive); border-radius:var(--radius);
  padding:.5rem .6rem; display:flex; flex-direction:column; align-items:center; justify-content:center;
  transition:border-color var(--trans) var(--ease);
  grid-column:span 2; min-width:0; overflow:hidden;
}
.prof-stat-box:hover { border-color:var(--border-olive); }
.prof-stat-box-num { font-family:var(--serif); font-size:22px; font-weight:500; color:var(--olive-light); line-height:1.15; text-align:center; }
.prof-stat-box-label { font-size:8px; color:var(--text-3); text-transform:uppercase; letter-spacing:1px; margin-top:3px; white-space:nowrap; text-align:center; }
/* Action buttons — full width, centered */
.prof-header-actions {
  display:flex; gap:8px; flex-wrap:wrap; align-items:center;
  justify-content:center; padding-top:10px; width:100%;
}
.prof-edit-btn {
  padding:7px 18px; border-radius:var(--radius-sm);
  border:0.5px solid var(--border-olive); background:transparent;
  color:var(--olive-light); font-size:12px; font-weight:500; cursor:pointer;
  text-decoration:none; display:inline-block; transition:background .15s;
}
.prof-edit-btn:hover { background:var(--olive-faint); }
.prof-share-btn {
  padding:7px 18px; border-radius:var(--radius-sm);
  border:0.5px solid var(--border-2); background:transparent;
  color:var(--text-2); font-size:12px; font-weight:500; cursor:pointer;
  display:inline-flex; align-items:center; gap:5px; transition:all .15s;
}
.prof-share-btn:hover { border-color:var(--border-olive); color:var(--olive-light); }
/* Share popup */
.prof-share-popup {
  position:fixed; inset:0; z-index:1200; background:rgba(0,0,0,0.72);
  display:flex; align-items:center; justify-content:center; padding:16px;
  opacity:0; pointer-events:none; transition:opacity .2s var(--ease);
}
.prof-share-popup.open { opacity:1; pointer-events:auto; }
.prof-share-card {
  background:var(--bg-2); border:1.5px solid var(--olive-light);
  box-shadow:4px 4px 0 var(--olive); border-radius:var(--radius-lg);
  padding:24px; width:100%; max-width:400px;
  transform:translateY(16px); transition:transform .24s var(--ease);
}
.prof-share-popup.open .prof-share-card { transform:translateY(0); }
.prof-share-title { font-family:var(--serif); font-size:20px; font-weight:500; margin-bottom:6px; }
.prof-share-sub { font-size:12px; color:var(--text-3); margin-bottom:16px; }
.prof-share-link {
  display:flex; align-items:center; gap:8px;
  background:var(--bg-3); border:0.5px solid var(--border-2);
  border-radius:var(--radius-sm); padding:10px 14px;
  font-size:12px; color:var(--text-2); word-break:break-all;
  cursor:pointer; transition:border-color .15s; margin-bottom:14px;
}
.prof-share-link:hover { border-color:var(--border-olive); }
.prof-share-link svg { flex-shrink:0; }
.prof-share-actions { display:flex; gap:8px; }
.prof-share-copy { flex:1; padding:10px; background:var(--olive); border:none; color:#fff; border-radius:var(--radius-sm); font-size:13px; font-weight:500; cursor:pointer; }
.prof-share-copy:hover { background:var(--olive-2); }
.prof-share-close { padding:10px 16px; background:transparent; border:0.5px solid var(--border-2); color:var(--text-2); border-radius:var(--radius-sm); font-size:13px; cursor:pointer; }

<script>
/* ── State ── */
var _pUser = null, _pProfile = null, _pEntries = [], _activeTab = 0;
var _profFavLists = [];
var _SVG_L = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>';
var _SVG_R = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>';

/* ── Init ── */
// Returning via browser back/forward can restore this page from the
// bfcache with stale data (e.g. an entry just added/edited elsewhere
// wouldn't show up here) instead of re-running this page's scripts.
window.addEventListener('pageshow', (event) => {
  if (event.persisted) location.reload();
});

document.addEventListener('DOMContentLoaded', function() {
  initPage(async function(user, profile) {
    if (!user) {
      document.querySelector('.page-wrap').innerHTML = '<div class="guest-page-state fade-up"><div class="guest-page-icon">'+icon('user',36)+'</div><h2 class="guest-page-title">Profile</h2><p class="guest-page-sub">Sign in to view your profile, track your favorites, and more.</p><div class="guest-cta"><a href="login.html" class="guest-btn-primary">Sign In</a><a href="login.html#signup" class="guest-btn-secondary">Create Account</a></div></div>';
      return;
    }
    _pUser = user;
    _pProfile = profile;
    // Entries and custom lists load together (was one after the other)
    var both = await Promise.all([
      getEntries(user.id),
      sb.from('favorite_lists').select('*').eq('user_id',user.id).order('created_at',{ascending:true}).then(function(r){ return r.data || []; }, function(){ return []; })
    ]);
    _pEntries = both[0];
    _profFavLists = both[1];
    _pEntriesLoaded();
    populateHeader();
    renderTab0();
    var tab = parseInt(new URLSearchParams(location.search).get('tab'), 10);
    if (tab > 0 && tab <= 6) switchTab(tab);
    else if (_activeTab === 1) renderLibrary();
    _libResume();
  });
});

/* ── Lists + Notes tabs: the Personal sections of the Notes / Lists pages
   (profile-tabs.js). They wait for your library, which their cards use. ── */
function _renderPersonalTab(n) {
  _pEntriesReady.then(function() {
    if (n === 2) MSSTabs.lists(document.getElementById('listsTabContent'), { userId: _pUser.id, entries: _pEntries, owner: true });
    else MSSTabs.notes(document.getElementById('notesTabContent'), { entries: _pEntries, owner: true, onDelete: _libRemove });
  });
}

/* ── Profile stats (5 boxes) ── */


/* ── Header ── */
function populateHeader() {
  var p = _pProfile, u = _pUser;
  var un = (p && p.username) || (u.email ? u.email.split('@')[0] : '');
  var st = computeStats(_pEntries);
  var hours = Math.round(((st.movieMins)||0)/60);
  var av = document.getElementById('profAvatar');
  if (p && safeURL(p.avatar_url)) {
    av.innerHTML = '<img src="'+safeURL(p.avatar_url)+'" alt="">';
  } else {
    av.textContent = (un[0]||'?').toUpperCase();
  }
  document.getElementById('profUsername').textContent = '@'+un;
  var dn = document.getElementById('profDisplayName');
  dn.textContent = (p && p.display_name) || '';
  var bio = document.getElementById('profBio');
  bio.textContent = (p && p.bio) || '';
  bio.style.display = (p && p.bio) ? '' : 'none';
  var q = document.getElementById('profQuote');
  q.textContent = (p && p.quote) || '';
  q.style.display = (p && p.quote) ? '' : 'none';
  document.getElementById('profStats').innerHTML = MSSTabs.statsHTML(_pEntries);
  document.getElementById('profEditBtn').style.display = '';
  var sb=document.getElementById('profShareBtn'); if(sb) sb.style.display='';
}

/* ── Tabs ── */
function switchTab(n) {
  _activeTab = n;
  // Keep the tab in the URL — Back / refresh come back to it (not Overview)
  var u = new URL(location.href);
  if (n) u.searchParams.set('tab', n); else u.searchParams.delete('tab');
  history.replaceState(history.state, '', u.toString());
  var sel = document.getElementById('profTabsSelect');
  if (sel && +sel.value !== n) sel.value = n;
  [0,1,2,3,4,5,6].forEach(function(i) {
    var t=document.getElementById('tab'+i), p=document.getElementById('panel'+i);
    if(t) t.classList.toggle('active', i===n);
    if(p) p.classList.toggle('active', i===n);
  });
  if (n===1) renderLibrary();
  if (n===2 || n===3) _renderPersonalTab(n);
  if (n===4) renderExports();
  if (n===5) MSSTabs.episodes(document.getElementById('episodesTabContent'), { userId: _pUser.id, owner: true });
  if (n===6) MSSShowcase.mount(document.getElementById('profShowcase'), _pUser.id, { own: true });
  if (n===0) renderTab0();
}

/* ── Popup ── */




/* ── Tab 0: Overview ── */
function _statsBoxHTML(entries, profile, favLists) {
  entries = entries || [];
  var watched = function(e){ return e.status==='completed'||e.status==='ongoing'; };
  var byCat = function(c){ return entries.filter(function(e){return e.cat===c;}); };
  var tv = byCat('tv'), movies = byCat('movies'), anime = byCat('anime'), cartoons = byCat('cartoons');
  var watchlist = entries.filter(function(e){return e.status==='queue'||e.status==='up_next';});
  var reviews = entries.filter(function(e){return e.notes && e.notes.trim();});

  var favIds = {};
  if (profile) {
    ['top_picks','fav_tv','fav_movies','fav_anime','fav_cartoons'].forEach(function(k){
      (Array.isArray(profile[k]) ? profile[k] : []).forEach(function(id){ favIds[id] = true; });
    });
  }
  var favoritesCount = Object.keys(favIds).length;
  var favListsArr = Array.isArray(favLists) ? favLists : [];
  var favoriteListsCount = favListsArr.filter(function(l){ return l.cat !== 'custom'; }).length;
  var listsCount = favListsArr.filter(function(l){ return l.cat === 'custom'; }).length;

  var rows = [
    { label:'All Items',        value:entries.length },
    { label:'TV Shows',         value:tv.length },
    { label:'TV Shows Watched', value:tv.filter(watched).length },
    { label:'Movies',           value:movies.length },
    { label:'Movies Watched',   value:movies.filter(watched).length },
    { label:'Animes',           value:anime.length },
    { label:'Animes Watched',   value:anime.filter(watched).length },
    { label:'Cartoons',         value:cartoons.length },
    { label:'Cartoons Watched', value:cartoons.filter(watched).length },
    { label:'Watchlist',        value:watchlist.length },
    { label:'Lists',            value:listsCount },
    { label:'Reviews',          value:reviews.length },
  ];

  var chevronSvg = '<span class="stats-chevron"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></span>';
  return '<div class="stats-box fade-up" id="statsBoxOwn">' + rows.map(function(r,i){
    return '<div class="stats-row"' + (i===0 ? ' onclick="MSSTabs.toggleStats(\'statsBoxOwn\')"' : '') + '>'
      + '<span class="stats-label">' + r.label + '</span>'
      + '<span class="stats-value">' + r.value.toLocaleString() + (i===0 ? chevronSvg : '') + '</span>'
      + '</div>';
  }).join('') + '</div>';
}

function renderTab0() {
  var el = document.getElementById('overviewContent');
  if (!el) return;
  if (!_pEntries || !_pEntries.length) {   // nothing added yet: say so (was a spinner forever)
    el.innerHTML = '<div class="fr-empty prof-empty"><div class="fr-empty-ic">'+icon('film',26)+'</div><div class="fr-empty-title">Your profile is waiting</div>'
      +'<div class="fr-empty-text">Add movies and shows you\u2019ve watched — your stats, favorites and top picks show up here.</div>'
      +'<a class="btn-add-entry" style="display:inline-flex;width:auto;margin-top:14px;text-decoration:none" href="discover.html">'+icon('search',15)+' Find something to add</a></div>';
    return;
  }
  var _statsHTML = _statsBoxHTML(_pEntries, _pProfile, _profFavLists);
  el.innerHTML = '<div class="overview-layout"><div class="overview-side">'+_statsHTML+'</div><div class="overview-main" id="profDashMain"></div></div>';
  // Dashboard: Top Favorites, Would Recommend, Top 5 per type — editable here
  if (!_pProfile) _pProfile = {};
  MSSDash.render(document.getElementById('profDashMain'), {
    entries: _pEntries, profile: _pProfile, editable: true,
    openEntry: _libOpen,
    save: function(key, ids){ var u = {}; u[key] = ids; return updateProfile(_pUser.id, u); }
  });
}

/* ── Tab 1: Library — js/library-view.js ── */

/* ── Tab 4: Exports ── */
// Exports is static, so its tab shows straight away; an export started
// before your library has loaded simply waits for it.
var _pEntriesLoaded; var _pEntriesReady = new Promise(function(res){ _pEntriesLoaded = res; });

// Exports: the Export Studio (export-studio.js) — opened plain, or from a quick export
var _PROF_EXPORTS = [
  { icon:'check',    title:'Everything I’ve watched', desc:'Your whole watch history, ranked by score.', preset:{ what:'watched', sort:'score' } },
  { icon:'trophy',   title:'My top 10',               desc:'Your ten best, with posters and every rating.', preset:{ what:'watched', sort:'score', limit:10 } },
  { icon:'image',    title:'Top 10 story',            desc:'Your ten best as an image for Instagram or TikTok.', preset:{ what:'watched', sort:'score', format:'image' } },
  { icon:'activity', title:'My taste profile',        desc:'How you score — your genres, decades and what you’re toughest on.', preset:{ what:'taste' } },
  { icon:'clock',    title:'Year in Review',          desc:'Your year: what you finished, your best, month by month.', preset:{ what:'year' } },
  { icon:'bookmark', title:'My watchlist',            desc:'Everything you plan to watch.',               preset:{ what:'watchlist' } },
  { icon:'play',     title:'Currently watching',      desc:'What you’re in the middle of, and how far.',  preset:{ what:'watching' } },
];
function _profExport(i) {
  var p = window._navUserProfile || _pProfile || {};
  MSSStudio.open({ preset: i == null ? null : _PROF_EXPORTS[i].preset, who: { name: p.display_name || p.username || '', username: p.username || '', avatar_url: p.avatar_url || '' },
    load: function(){ return _pEntriesReady.then(function(){ return _pEntries; }); } });
}

function renderExports(){
  var el=document.getElementById('exportsContent');
  if(el.innerHTML.trim())return;
  el.innerHTML='<div class="pv-section"><div class="pv-eyebrow">Export</div><div class="pv-title">Take your library with you</div>'
    +'<div class="xp-hero"><span class="xp-hero-ic">'+icon('download',26)+'</span><div class="xp-hero-text"><b>Export Studio</b><span>Choose what goes in, how it looks and what stays private — with a live preview before you download.</span></div>'
    +'<button type="button" class="btn-add-entry" onclick="_profExport(null)">'+icon('download',15)+' Open Export Studio</button></div>'
    +'<div class="xp-label">Quick exports</div><div class="xp-grid">'+_PROF_EXPORTS.map(function(c,i){return '<button type="button" class="xp-card" onclick="_profExport('+i+')"><span class="xp-card-ic">'+icon(c.icon,28)+'</span><span class="xp-card-text"><b>'+escHTML(c.title)+'</b><small>'+escHTML(c.desc)+'</small></span></button>';}).join('')+'</div></div>';
}










/* ── Share Profile ── */
function openShareProfile() {
  var un = (_pProfile && _pProfile.username) || (_pUser && _pUser.email && _pUser.email.split('@')[0]) || '';
  var base = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
  var url = base + 'profile-view.html?u=' + encodeURIComponent(un);
  // Use navigator.share if available
  if (navigator.share) {
    navigator.share({ title: 'MyScreenFolio — @'+un, url: url }).catch(function(){});
    return;
  }
  // Fallback: show popup
  var popup = document.getElementById('profSharePopup');
  if (!popup) {
    popup = document.createElement('div');
    popup.className = 'prof-share-popup';
    popup.id = 'profSharePopup';
    popup.innerHTML = '<div class="prof-share-card">'
      +'<div class="prof-share-title">Share Profile</div>'
      +'<div class="prof-share-sub">Anyone with this link can view your profile and send you a friend request.</div>'
      +'<div class="prof-share-link" id="profShareLink" onclick="profCopyLink()">'
      +'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>'
      +'<span id="profShareUrl"></span>'
      +'</div>'
      +'<div class="prof-share-actions">'
      +'<button class="prof-share-copy" onclick="profCopyLink()">Copy Link</button>'
      +'<button class="prof-share-close" onclick="closeShareProfile()">Close</button>'
      +'</div></div>';
    popup.addEventListener('click', function(e){ if(e.target===popup) closeShareProfile(); });
    document.body.appendChild(popup);
  }
  document.getElementById('profShareUrl').textContent = url;
  popup._url = url;
  popup.classList.add('open');
  mssLockScroll('profShare');
}
function closeShareProfile() {
  var p = document.getElementById('profSharePopup');
  if (p) { p.classList.remove('open'); mssUnlockScroll('profShare'); }
}
function profCopyLink() {
  var p = document.getElementById('profSharePopup');
  var url = p && p._url;
  if (!url) return;
  navigator.clipboard && navigator.clipboard.writeText(url).then(function(){ showToast('Link copied!'); });
}
