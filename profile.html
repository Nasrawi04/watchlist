@media(max-width:640px) {
  .fav-picker-item { padding:11px 16px; gap:12px; }
  .fav-picker-poster { width:44px; height:62px; font-size:17px; }
  .fav-picker-name { font-size:14px; }

<body>
<div class="page-wrap pf-page">

  <!-- a title page for a person (profile-v2.js): the header, the title page's tab bar, the tabs -->
  <div class="tv-page de-page tp-page pf-tp" id="pfPage">
    <div class="de-cap" aria-hidden="true"></div>
    <div id="profHeader"><div class="page-loading" id="profHeadSkel" data-skel="profhead"></div></div>
    <div id="pfTabsBox"></div>

    <div class="prof-panel active" id="pfPanel-0" role="tabpanel" aria-labelledby="pfTab-0" tabindex="-1"><div id="pfPrompts"></div><div id="overviewContent"><div class="page-loading"><div class="spinner"></div></div></div></div>
    <div class="prof-panel" id="pfPanel-1" role="tabpanel" aria-labelledby="pfTab-1" tabindex="-1"><div id="libraryLoading"><div class="page-loading"><div class="spinner"></div></div></div><div id="libraryContent" style="display:none"></div></div>
    <div class="prof-panel" id="pfPanel-2" role="tabpanel" aria-labelledby="pfTab-2" tabindex="-1"><div id="listsTabContent"><div class="page-loading"><div class="spinner"></div></div></div></div>
    <div class="prof-panel" id="pfPanel-3" role="tabpanel" aria-labelledby="pfTab-3" tabindex="-1"><div id="notesTabContent"><div class="page-loading"><div class="spinner"></div></div></div></div>
    <div class="prof-panel" id="pfPanel-5" role="tabpanel" aria-labelledby="pfTab-5" tabindex="-1"><div id="episodesTabContent"><div class="page-loading"><div class="spinner"></div></div></div></div>
    <div class="prof-panel" id="pfPanel-6" role="tabpanel" aria-labelledby="pfTab-6" tabindex="-1"><div id="profShowcase"><div class="page-loading"><div class="spinner"></div></div></div></div>
  </div>

</div>

<script>
/* ── State ── */
var _pUser = null, _pProfile = null, _pEntries = [], _activeTab = 0;
// the tab bar (the title page's): drawn straight away, the counts arrive with your library
var _PF_TABS = [[0, 'Overview'], [1, 'Library'], [2, 'Lists'], [3, 'Notes'], [5, 'Episodes'], [6, 'Showcase']];
(function() {
  var t = parseInt(new URLSearchParams(location.search).get('tab'), 10);
  document.getElementById('pfTabsBox').outerHTML = MSSProfile.tabsHTML(_PF_TABS.map(function(x){ return [x[0], x[1], '']; }), _PF_TABS.some(function(x){ return x[0] === t; }) ? t : 0, 'Your profile');
  MSSProfile.page(document.getElementById('pfPage'), { onTab: function(k, byPerson) { switchTab(+k, byPerson); } });
})();
var _profFavLists = [];
var _SVG_L = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>';
var _SVG_R = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>';

/* ── Init ── */
// Returning via browser back/forward can restore this page from the
// bfcache with stale data (e.g. an entry just added/edited elsewhere
// wouldn't show up here) instead of re-running this page's scripts.
window.addEventListener('pageshow', (event) => {
  if (event.persisted && mssDataChangedSince(window._mssPageAt)) location.reload();   // only if something changed since (config.js)
});

document.addEventListener('DOMContentLoaded', function() {
  initPage(async function(user, profile) {
    if (!user) { await _profGuest(); return; }
    _pUser = user;
    _pProfile = profile;
    // Entries and custom lists load together (was one after the other)
    var both = await Promise.all([
      getEntries(user.id),
      sb.from('favorite_lists').select('*').eq('user_id',user.id).order('created_at',{ascending:true}).then(function(r){ return r.data || []; }, function(){ return []; })
    ]);
    _pEntries = both[0];
    _profFavLists = both[1];
    _pEntriesLoaded();
    populateHeader();
    renderTab0();
    // profile.html#ratings (Home's Score spread): straight to the Ratings box
    // (after the page has put back its own scroll position — nav.js _mssRestoreScroll)
    if (location.hash === '#ratings') [350, 1200].forEach(function(ms){ setTimeout(function(){ var rc = document.querySelector('#overviewContent .rc-box'), b = rc && rc.getBoundingClientRect();
      if (b && (b.top < 0 || b.bottom > innerHeight)) rc.scrollIntoView({ block:'center', behavior:'instant' }); }, ms); });
    var tab = parseInt(new URLSearchParams(location.search).get('tab'), 10);
    if (tab === 4) { location.replace('export.html'); return; }   // Exports moved to its own page (avatar menu)
    if (tab > 0 && tab <= 6) switchTab(tab);
    else if (_activeTab === 1) renderLibrary();
    _libResume();
    // Episode time / Total time: shows from before that don't know their episode length yet get it (in the background)
    mssFillEpRuntimes(_pEntries, user.id, 200).then(function(n){ if (n) { MSSProfile.refreshStats({}); if (typeof _dmYouDrop === 'function') _dmYouDrop(); } });
  });
});

/* ── A guest (owner, 19 Nov 2026): a preview of the profile they'd have — the example library (js/home-guest.js), read-only.
   Lists / Notes / Episodes / Showcase say what they'll hold and point to what a guest can already open. ── */
var _pfGuest = false;
async function _profGuest() {
  await mssLoadScript('js/home-guest.js');
  _pfGuest = true;
  LIB_GUEST = LIB_READONLY = true; LIB_CTRL = false;
  _pUser = { id: 'guest' };
  _pEntries = mssGuestLibrary();
  // Top Favorites: the five highest scores
  var top = _pEntries.filter(function(e){ return e.final_score != null; }).sort(function(a, b){ return b.final_score - a.final_score; }).slice(0, 5).map(function(e){ return e.id; });
  _pProfile = { username: '', display_name: 'Your name here', quote: 'Your favourite quote, right under your name.', bio: 'A line or two about you and what you love to watch.', top_picks: top };
  _profFavLists = [];
  _pEntriesLoaded();
  MSSProfile.header(document.getElementById('profHeader'), { profile: _pProfile, entries: _pEntries, own: false, lists: 0, diary: null,
    actions: '<a class="tv-btn is-main" href="login.html#signup">' + icon('sparkles', 16) + '<span>Create your profile</span></a><a class="tv-btn" href="login.html"><span>Sign in</span></a>' });
  _profTabCounts();
  var c = document.getElementById('pfCounts'); if (c) c.textContent = 'Followers, following and friends show here';
  document.getElementById('pfPrompts').innerHTML = '<section class="lib-guest" aria-label="About this preview"><span class="lib-guest-ic" aria-hidden="true">' + icon('sparkles', 18) + '</span>'
    + '<div class="lib-guest-t"><b>' + escHTML(MSS_GUEST.profile.title) + '</b><span>A preview with example titles. Your own stats, favourites and top picks fill in as you watch.</span></div></section>';
  renderTab0();
  var tab = parseInt(new URLSearchParams(location.search).get('tab'), 10);
  if (tab > 0 && tab <= 6) switchTab(tab);
}
function _profGuestTab(n) {
  var E = {
    2: ['lists', 'lists.html', 'Your lists live here', 'Top 10s, comfort rewatches, guilty pleasures. Until you make your own, browse the community’s.', 'Browse Community lists', 'lists.html?view=community'],
    3: ['notes', 'notes.html', 'Your notes live here', 'What you really thought of that finale. Until you write your own, read the community’s.', 'Read Community notes', 'notes.html?view=community'],
    5: ['episodes', 'episodes.html', 'Your episode ratings live here', 'Rate every episode and see each show on one chart. You can already look up any show’s episodes.', 'Look up a show', 'episodes.html'],
    6: ['medal', '', 'Your showcase lives here', 'Medals, top picks and the cards you make, arranged the way you like. It fills up as you watch.', '', ''],
  }[n];
  var id = { 2: 'listsTabContent', 3: 'notesTabContent', 5: 'episodesTabContent', 6: 'profShowcase' }[n];
  document.getElementById(id).innerHTML = mssEmpty({ art: E[0], title: E[2], text: E[3],
    actions: [E[4] ? { label: E[4], icon: 'arrowRight', href: E[5] } : null, { label: 'Create a free account', icon: 'sparkles', href: 'login.html#signup', primary: true }] });
}

/* ── Lists + Notes tabs: the Personal sections of the Notes / Lists pages
   (profile-tabs.js). They wait for your library, which their cards use. ── */
function _renderPersonalTab(n) {
  _pEntriesReady.then(function() {
    if (n === 2) MSSTabs.lists(document.getElementById('listsTabContent'), { userId: _pUser.id, entries: _pEntries, owner: true });
    else MSSTabs.notes(document.getElementById('notesTabContent'), { entries: _pEntries, owner: true, onDelete: _libRemove });
  });
}

/* ── Header: the shared Profiles V2 header (profile-v2.js) — banner, name, quote, social line, bio, your stats ── */
// Until it's filled: the same header with sample text, masked into placeholders
mssSkeleton.define('profhead', function() { return MSSProfile.headSkel(_profActions(), true); });
function _profActions() {
  return '<button type="button" class="tv-btn is-main" onclick="MSSProfile.editProfile()">' + icon('edit', 16) + '<span>Edit profile</span></button>'
    + '<button type="button" class="tv-btn" onclick="openShareProfile()" aria-label="Share your profile">' + icon('share', 16) + '<span>Share</span></button>';
}
var _profDiary = null;
function populateHeader() {
  MSSProfile.header(document.getElementById('profHeader'), {
    profile: _pProfile || {}, entries: _pEntries, own: true, actions: _profActions(),
    lists: _profFavLists.filter(function(l){ return l.cat === 'custom'; }).length, diary: _profDiary,
  });
  _profTabCounts();
  _profCounts();
  // Diary watches (your own diary): one count, then the stats redraw with it
  if (_profDiary == null) sb.from('diary_watches').select('id', { count: 'exact', head: true }).eq('user_id', _pUser.id)
    .then(function(r){ if (r && r.count != null && !r.error) { _profDiary = r.count; MSSProfile.refreshStats({ diary: r.count }); } }, function(){});
}
// the numbers on the tabs: Library 339 · Lists 11 · Notes 31
function _profTabCounts() {
  MSSProfile.tabCount(1, _pEntries.length);
  MSSProfile.tabCount(2, _profFavLists.filter(function(l){ return l.cat === 'custom'; }).length);
  MSSProfile.tabCount(3, _pEntries.filter(function(e){ return e.notes && String(e.notes).trim(); }).length);
}
// Followers · Following · Friends (083) — and, for a private account, the requests waiting
function _profCounts() {
  getFollowState(_pUser.id).then(function(st) {
    var el = document.getElementById('pfCounts'); if (!el || !st) return;
    var name = (_pProfile && (_pProfile.display_name || _pProfile.username)) || '';
    el.innerHTML = MSSFollow.countsHTML(st, _pUser.id, name, true)
      + (st.requests ? '<button type="button" class="fl-req-chip" onclick="MSSFollow.open(' + attrJSON(_pUser.id) + ', \x27requests\x27, ' + attrJSON(name) + ', true, ' + st.requests + ')">'
          + icon('users', 13) + ' ' + st.requests + ' follow request' + (st.requests === 1 ? '' : 's') + '</button>' : '');
  }).catch(function(){});
}
document.addEventListener('mss:follows-changed', function(){ if (_pUser) _profCounts(); });

/* ── Tabs ── */
function switchTab(n, byPerson) {
  _activeTab = n;
  // Keep the tab in the URL — Back / refresh come back to it (not Overview)
  var u = new URL(location.href);
  if (n) u.searchParams.set('tab', n); else u.searchParams.delete('tab');
  history.replaceState(history.state, '', u.toString());
  MSSProfile.setTab(n, byPerson);
  _PF_TABS.forEach(function(x) { var p = document.getElementById('pfPanel-' + x[0]); if (p) p.classList.toggle('active', x[0] === n); });
  if (n===1) renderLibrary();
  if (_pfGuest && n > 1) { _profGuestTab(n); return; }
  if (n===2 || n===3) _renderPersonalTab(n);
  if (n===5) MSSTabs.episodes(document.getElementById('episodesTabContent'), { userId: _pUser.id, owner: true });
  if (n===6) MSSShowcase.mount(document.getElementById('profShowcase'), _pUser.id, { own: true });
  if (n===0) renderTab0();
}

/* ── Popup ── */




/* ── Tab 0: Overview — Top Favorites, Top 5 by category and the side column (profile-v2.js) ── */
function renderTab0() {
  var el = document.getElementById('overviewContent');
  if (!el) return;
  if (!_pEntries || !_pEntries.length) { // nothing added yet: say so (was a spinner forever)
    el.innerHTML = mssEmpty({ art:'person', title:'Your profile is waiting', text:'Add what you’ve watched and this fills up with your stats, favourites and top picks. Right now it’s mostly vibes.',
      actions:[{ label:'Add a title', icon:'plus', onclick:'openAddModal()', primary:true }, { label:'Browse Discover', icon:'compass', href:'discover.html' }] });
    return;
  }
  if (!_pProfile) _pProfile = {};
  MSSProfile.overview(el, {
    entries: _pEntries, profile: _pProfile, editable: !_pfGuest,
    openEntry: _libOpen,
    save: function(key, val){ var u = {}; u[key] = val; return updateProfile(_pUser.id, u); }
  });
}

/* ── Tab 1: Library — js/library-view.js ── */

// Lists / Notes tabs wait for your library before drawing
var _pEntriesLoaded; var _pEntriesReady = new Promise(function(res){ _pEntriesLoaded = res; });

/* ── Share Profile ── */
function openShareProfile() {
  var un = (_pProfile && _pProfile.username) || (_pUser && _pUser.email && _pUser.email.split('@')[0]) || '';
  var base = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
  var url = base + 'profile-view.html?u=' + encodeURIComponent(un);
  // Use navigator.share if available
  if (navigator.share) {
    navigator.share({ title: 'MyScreenFolio — @'+un, url: url }).catch(function(){});
    return;
  }
  // Otherwise the shared ⋯ popover under the button (a page of rows on phones): Copy Link
  var btn = document.activeElement && document.activeElement.closest && document.activeElement.closest('button') || document.querySelector('#pfActs [aria-label="Share your profile"]');
  mssLoadScript('js/panel.js').then(function () {
    MSSPopover.open(btn, { title: 'Share Profile', subtitle: 'Anyone with this link can view your profile and follow you.', label: 'Share Profile',
      items: [{ label: 'Copy Link', sub: url, icon: 'link', onSelect: function () { profCopyLink(url); } }] });
  });
}
function profCopyLink(url) {
  if (!url) return;
  navigator.clipboard && navigator.clipboard.writeText(url).then(function(){ showToast('Link copied!'); });
}

// After a delete from either popup: drop it from this page and re-render


// Your title: its panel / page (MSSViews, title-view.js). Opens on
// Ratings once it's rated/watched, otherwise on Info.


/* ── Action button stubs (implemented in later steps) ── */
/* rewatchEntry defined in rewatch.js */
/* createShareCard defined in create-card.js */
</script>

}
