<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="js/consent.js"></script>
<script src="js/splash.js"></script>
<script src="js/i18n.js"></script>
<title>Notifications — MyScreenFolio</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/style.css">
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#F3EEDC">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MyScreenFolio">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/svg+xml" sizes="any" href="icons/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
</head>
<body>
<div class="page-wrap">
  <div class="cat-page-header lib-head np-head fade-up">
    <div class="lib-head-l">
      <div class="lib-kicker">You · Notifications</div>
      <h1 class="cat-page-title" id="npTitle" tabindex="-1">Notifications</h1>
      <div class="cat-page-sub" id="npSub"><span class="skel-txt">0 new · 000 most recent</span></div>
    </div>
    <div class="lib-head-r np-actions" id="npActions" hidden></div>
  </div>
  <div class="np-filters fade-up fade-up-1" id="npFilters"></div>
  <div class="np-grid fade-up fade-up-2">
    <div class="np-main" id="npList"><div class="page-loading" data-skel="notif"></div></div>
    <aside class="np-side" id="npSide" aria-label="Notification shortcuts"></aside>
  </div>
</div>

<script src="js/vendor/supabase-2.118.0.js"></script>
<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/nav.js"></script>
<script src="js/notif-settings.js"></script>
<script>
/* The Notifications page: header, the shared filters, the rows by day (15 at a time, 11 on phones, then
   Show older), swipe left to delete on phones, and on desktop (1200px+) Quiet the noise + In your last 200.
   ?tab=settings: Notification settings (notif-settings.js). Rows, filters, grouping, delete + Undo and the
   bell panel are nav.js's (_nf…). */
let _npView = new URLSearchParams(location.search).get('tab') === 'settings' ? 'settings' : 'list';
let _npLoaded = false, _npShown = 0;
const _npStep = () => _nfPhone() ? 11 : 15;

// While it loads: 8 rows of the real markup, masked into placeholders
mssSkeleton.define('notif', () => `<div class="ntf-list"><div class="ntf-day" data-skel-keep>Today</div>${Array.from({ length: 8 }, (_, i) =>
  `<div class="ntf-row"><div class="ntf-in"><div class="ntf-av notif-av"><span class="skel-media-box"></span></div>
    <div class="ntf-body"><div class="ntf-text">${['Someone watched 2 episodes of A Show · S1 · E4', 'Someone added A Long Title to their watchlist', 'New episode of Something · S2 · E8'][i % 3]}</div><div class="ntf-time">7h ago</div></div></div></div>`).join('')}</div>`);

function npSetView(v) {
  _npView = v;
  const url = new URL(location.href);
  v === 'settings' ? url.searchParams.set('tab', 'settings') : url.searchParams.delete('tab');
  history.replaceState(null, '', url);
  renderNotificationsPage({ reset: true });
  scrollTo(0, 0);
  document.getElementById('npTitle').focus({ preventScroll: true });
  return false;
}

function renderNotificationsPage(o = {}) {
  if (!_npLoaded) return;
  const set = _npView === 'settings';
  const list = document.getElementById('npList'), acts = document.getElementById('npActions');
  document.body.classList.toggle('np-is-settings', set);
  document.getElementById('npTitle').textContent = set ? 'Notification settings' : 'Notifications';
  document.title = (set ? 'Notification settings' : 'Notifications') + ' — MyScreenFolio';
  if (set) {
    if (list.querySelector('#npSettings')) return;             // drawn already (the bell's polling redraws the list only)
    document.getElementById('npSub').textContent = 'What reaches you, and what your friends hear about you.';
    acts.hidden = true;
    document.getElementById('npFilters').innerHTML = '';
    document.getElementById('npSide').innerHTML = '';
    list.innerHTML = `<a class="ns-back" href="notifications.html" onclick="return npSetView('list')">${icon('back', 14)} Notifications</a><div id="npSettings"></div>`;
    MSSNotifSettings.render(document.getElementById('npSettings'));
    return;
  }
  if (o.reset || !_npShown) _npShown = _npStep();
  const unread = _notifItems.filter(n => !n.read_at).length;
  document.getElementById('npSub').innerHTML = `<b>${unread}</b> new · <b>${_notifItems.length}</b> most recent`;
  if (acts.hidden) {
    acts.hidden = false;
    acts.innerHTML = `<button type="button" class="np-btn" id="npReadAll" onclick="npMarkAllRead()">${icon('check', 14)} Mark all read</button>
      <a class="np-ic" href="notifications.html?tab=settings" onclick="return npSetView('settings')" aria-label="Notification settings" title="Notification settings">${icon('settings', 16)}</a>
      <button type="button" class="np-ic" onclick="npMore(this)" aria-label="More options" aria-haspopup="menu">${icon('moreV', 16)}</button>`;
  }
  document.getElementById('npReadAll').disabled = !unread;
  document.getElementById('npFilters').innerHTML = _nfFiltersHTML(false);
  const rows = _nfRows(_notifItems.filter(n => _nfMatch(n, _nfFilter)));
  list.innerHTML = !rows.length ? _notifEmptyHTML(_nfFilter)
    : `<div class="ntf-list">${_nfListHTML(rows.slice(0, _npShown), { page: true })}${rows.length > _npShown
      ? `<button type="button" class="ntf-older" onclick="npOlder()">Show older</button>` : ''}</div>`;
  mssFillEpNames(list);
  npSide();
}
function npOlder() {
  const from = _npShown;
  _npShown += _npStep();
  renderNotificationsPage();
  document.querySelectorAll('#npList .ntf-row')[from]?.querySelector('a, button:not([tabindex="-1"])')?.focus();
}

// Desktop side column: Quiet the noise (the same settings as Notification settings) + In your last 200
async function npSide() {
  const side = document.getElementById('npSide');
  if (_npView !== 'list' || !matchMedia('(min-width: 1200px)').matches) { side.innerHTML = ''; return; }
  const c = f => _notifItems.filter(n => _nfMatch(n, f)).length;
  const adds = _notifItems.filter(n => n.type === 'friend_watchlist').length;
  const known = MSSNotifSettings.loaded();
  const sw = (id, k, on, name, sub) => `<div class="ntf-q">
      <div class="ntf-q-txt"><div class="ntf-q-name" id="${id}L">${name}</div><div class="ntf-q-sub" id="${id}S">${sub}</div></div>
      <button type="button" class="push-switch ntf-sw" id="${id}" role="switch" aria-checked="${!!on}" aria-labelledby="${id}L" aria-describedby="${id}S" onclick="npQuiet('${k}', this)"${on == null ? ' disabled' : ''}><span aria-hidden="true"></span></button>
    </div>`;
  const isOn = k => known ? MSSNotifSettings.isOn(k) : null;
  side.innerHTML = `<section class="ntf-card" aria-labelledby="npQuietT">
      <h2 class="ntf-card-h" id="npQuietT">Quiet the noise</h2>
      ${sw('npQGroup', 'group', _nfGroupOn(), 'Group watchlist adds', adds ? `${adds} watchlist adds become one line per friend per day` : 'One line per friend per day')}
      ${sw('npQActivity', 'activity', isOn('activity'), 'Friends’ activity', 'What friends you turned “Notify me” on for are doing')}
      ${sw('npQReleases', 'releases', isOn('releases'), 'New episodes & releases', 'Of the shows and films in your library')}
      <a class="ntf-card-link" href="notifications.html?tab=settings" onclick="return npSetView('settings')">All notification settings ${icon('arrowRight', 13)}</a>
    </section>
    <section class="ntf-card" aria-labelledby="npSumT">
      <h2 class="ntf-card-h" id="npSumT">In your last ${_notifItems.length}</h2>
      ${[['watched', 'Watched'], ['watchlist', 'Watchlist adds'], ['notes', 'Notes'], ['ratings', 'Ratings'], ['lists', 'Lists'], ['you', 'For you']].map(([f, l]) =>
        `<button type="button" class="ntf-sum${_nfFilter === f ? ' on' : ''}" data-f="${f}" aria-pressed="${_nfFilter === f}" onclick="_nfSetFilter('${f}')"><span>${l}</span><b>${c(f)}</b></button>`).join('')}
    </section>`;
  // the two receive switches fill in once the settings are loaded
  if (!known) MSSNotifSettings.ready().then(() => npSide(), () => {});
}
async function npQuiet(k, btn) {
  if (k === 'group') {
    await _nfDisplaySet('group_watchlist', !_nfGroupOn());
    document.getElementById('npQGroup')?.focus();
    return;
  }
  const on = !MSSNotifSettings.isOn(k);
  btn.setAttribute('aria-checked', on);
  if (await MSSNotifSettings.setOn(k, on)) showToast(on ? `${MSSNotifSettings.name(k)} on.` : `${MSSNotifSettings.name(k)} off — they won’t reach you.`);
  else { btn.setAttribute('aria-checked', !on); showToast('Couldn’t save that — try again.', 'err'); }
}

async function npMarkAllRead() {
  const ids = _notifItems.filter(n => !n.read_at).map(n => n.id);
  if (!ids.length) { showToast('You’re all caught up.'); return; }
  await _notifMarkRead(ids);
  renderNotificationsPage();
  showToast('All caught up!');
}
// ⋯: Clear all… (and Mark all read on phones)
async function npMore(btn) {
  await mssLoadScript('js/panel.js');
  const kind = _NF_KINDS.find(k => k[0] === _nfFilter);
  MSSPopover.open(btn, { title: 'Notifications', label: 'More options', items: [
    ...(_nfPhone() ? [{ label: 'Mark all read', icon: 'check', onSelect: npMarkAllRead }] : []),
    { label: _nfFilter === 'all' ? 'Clear all…' : `Clear ${_nfFilter === 'you' ? 'For you' : kind ? kind[1] : 'Friends’ activity'}…`, icon: 'trash', danger: true, onSelect: npClearAll },
  ] });
}
async function npClearAll() {
  const items = _notifItems.filter(n => _nfMatch(n, _nfFilter));
  if (!items.length) { showToast('Nothing to clear.'); return; }
  const n = items.length, what = n === 1 ? 'notification' : 'notifications';
  const ok = await showConfirm({ title: _nfFilter === 'all' ? `Clear all ${n} ${what}?` : `Clear these ${n} ${what}?`,
    message: 'This can’t be undone.', confirmText: 'Clear', iconName: 'trash' });
  if (!ok) return;
  const ids = items.map(x => x.id);
  _notifItems = _notifItems.filter(x => !ids.includes(x.id));
  _notifRenderBadge();
  renderNotificationsPage({ reset: true });
  const { error } = await sb.from('notifications').delete().in('id', ids).then(r => r, e => ({ error: e }));
  if (error) { showToast('Couldn’t clear them all — try again.', 'err'); _notifLoad(); return; }
  showToast('Notifications cleared.');
}

/* Phones: swipe a row left to show a red Delete (tap it to remove). Taps elsewhere close it. */
(() => {
  const W = 88;
  let row = null, x0 = 0, y0 = 0, dx = 0, mode = '', swiped = false;
  const list = document.getElementById('npList');
  const inner = r => r.querySelector('.ntf-in');
  const set = (r, open) => {
    r.classList.toggle('is-open', open);
    inner(r).style.transform = open ? `translateX(${-W}px)` : '';
    const d = r.querySelector('.ntf-swipe-del');
    if (d) { d.tabIndex = open ? 0 : -1; d.setAttribute('aria-hidden', !open); }
  };
  list.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'touch' || _npView !== 'list') return;
    const r = e.target.closest('.ntf-row');
    list.querySelectorAll('.ntf-row.is-open').forEach(o => { if (o !== r) set(o, false); });
    if (!r || !r.querySelector('.ntf-swipe-del') || e.target.closest('.ntf-swipe-del, .notif-actions')) return;
    row = r; x0 = e.clientX; y0 = e.clientY; dx = 0; mode = '';
  });
  list.addEventListener('pointermove', e => {
    if (!row) return;
    const mx = e.clientX - x0, my = e.clientY - y0;
    if (!mode) {
      if (Math.abs(mx) > 8 && Math.abs(mx) > Math.abs(my)) mode = 'x';
      else if (Math.abs(my) > 8) { row = null; return; } else return;
    }
    dx = Math.max(-W * 1.3, Math.min(0, mx + (row.classList.contains('is-open') ? -W : 0)));
    row.classList.add('is-drag');
    inner(row).style.transform = `translateX(${dx}px)`;
  });
  const end = () => {
    if (!row) return;
    const r = row; row = null;
    r.classList.remove('is-drag');
    if (mode !== 'x') return;
    swiped = true; setTimeout(() => { swiped = false; }, 350);
    set(r, dx < -W / 2);
  };
  list.addEventListener('pointerup', end);
  list.addEventListener('pointercancel', end);
  list.addEventListener('click', e => { if (swiped) { e.preventDefault(); e.stopPropagation(); swiped = false; } }, true);
})();

document.addEventListener('mss:notif-prefs', () => { if (_npLoaded && _npView === 'list') npSide(); });
matchMedia('(min-width: 1200px)').addEventListener('change', () => { if (_npLoaded) npSide(); });

document.addEventListener('DOMContentLoaded', () => {
  initPage(async user => {
    if (!user) {
      document.getElementById('npSub').textContent = '';
      document.getElementById('npList').innerHTML = mssGuestEmpty('notifications');
      return;
    }
    await _notifLoad(200);
    _npLoaded = true;
    renderNotificationsPage();
  });
});
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(r => console.log('SW registered:', r.scope))
      .catch(e => console.warn('SW failed:', e));
  });
}
</script>
</body>
</html>
