<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyScreenScore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
.pub-wrap { max-width:900px; margin:0 auto; }

/* ── Hero ── */
.pub-hero {
  display:flex; align-items:center; gap:clamp(1rem, 4vw, 2rem);
  margin-bottom:clamp(2rem, 5vw, 3rem); padding:clamp(1.25rem, 4vw, 2.5rem);
  background:var(--card); border:0.5px solid var(--border); border-radius:var(--radius-lg);
}
.pub-avatar {
  width:clamp(64px, 16vw, 88px); height:clamp(64px, 16vw, 88px); border-radius:50%; flex-shrink:0;
  background:var(--olive); border:2px solid var(--border-olive); overflow:hidden;
  font-family:var(--serif); font-weight:600; font-size:clamp(28px, 7vw, 38px); color:#fff;
  display:flex; align-items:center; justify-content:center;
}
.pub-avatar img { width:100%; height:100%; object-fit:cover; display:block; }
.pub-hero-info { min-width:0; flex:1; }
.pub-name { font-family:var(--serif); font-weight:600; font-size:clamp(22px, 5.5vw, 30px); line-height:1.15; letter-spacing:.5px; overflow-wrap:anywhere; }
.pub-username { font-size:13px; color:var(--text-3); margin:2px 0 .75rem; }
.pub-bio { font-size:14px; color:var(--text-2); line-height:1.6; margin-bottom:.5rem; white-space:pre-line; overflow-wrap:anywhere; }
.pub-quote { font-size:13.5px; color:var(--text-2); font-style:italic; line-height:1.55; margin-bottom:1rem; overflow-wrap:anywhere; }
.pub-stats-row { display:flex; gap:clamp(.9rem, 3.5vw, 1.75rem); flex-wrap:wrap; margin-top:.5rem; }
.pub-stat { text-align:center; }
.pub-stat-num { font-family:var(--bebas); font-size:clamp(22px, 5vw, 28px); color:var(--olive-light); line-height:1; letter-spacing:.5px; }
.pub-stat-label { font-size:clamp(8.5px, 2vw, 10px); color:var(--text-3); text-transform:uppercase; letter-spacing:1px; margin-top:4px; }

/* ── Section titles ── */
.pub-section-title {
  font-family:var(--serif); font-weight:500; font-size:12px; letter-spacing:2.5px; text-transform:uppercase; color:var(--olive-light);
  margin:2.5rem 0 1.25rem; display:flex; align-items:center; gap:12px;
}
.pub-section-title::after { content:''; flex:1; height:0.5px; background:var(--border); }

/* ── Shared row ── */
.pub-list { display:flex; flex-direction:column; gap:8px; }
.pub-row {
  display:grid; align-items:center; gap:clamp(10px, 3vw, 16px);
  background:var(--card); border:0.5px solid var(--border); border-radius:var(--radius);
  padding:clamp(10px, 2.5vw, 12px) clamp(12px, 3vw, 16px);
}
.pub-row.ranked { grid-template-columns:clamp(30px, 8vw, 44px) 44px minmax(0,1fr) auto; }
.pub-row.recent { grid-template-columns:44px minmax(0,1fr) auto; }
.pub-rank { font-family:var(--bebas); font-size:clamp(20px, 5vw, 24px); color:var(--text-3); text-align:center; line-height:1; }
.pub-rank.top3 { color:var(--olive-light); }
.pub-poster { width:44px; height:60px; border-radius:6px; overflow:hidden; background:var(--bg-3); display:flex; align-items:center; justify-content:center; }
.pub-poster img { width:100%; height:100%; object-fit:cover; display:block; }
.pub-poster-fallback { font-family:var(--serif); font-size:22px; color:var(--olive-light); }
.pub-title-row { display:flex; align-items:baseline; gap:8px; min-width:0; }
.pub-title { font-family:var(--serif); font-weight:500; font-size:clamp(14px, 3.4vw, 16px); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.pub-year { font-family:var(--bebas); font-size:clamp(14px, 3.2vw, 16px); color:var(--text-3); flex-shrink:0; letter-spacing:.5px; }
.pub-tags { display:flex; flex-wrap:wrap; gap:4px; margin-top:5px; }
.pub-score-wrap { text-align:right; }
.pub-score { font-family:var(--bebas); font-size:clamp(22px, 5.5vw, 30px); color:var(--olive-light); line-height:1; letter-spacing:.5px; }
.pub-score-label { font-size:9.5px; color:var(--text-3); letter-spacing:1px; text-transform:uppercase; margin-top:2px; }
.pub-date { font-family:var(--bebas); font-size:13px; color:var(--text-3); letter-spacing:.5px; margin-top:2px; }

.pub-show-more {
  display:block; margin:12px auto 0; padding:9px 22px; border-radius:999px;
  background:var(--olive); border:none; color:#fff; cursor:pointer;
  font-family:var(--sans); font-size:13px; font-weight:600;
}
.pub-show-more:hover { opacity:.9; }

.pub-empty { text-align:center; padding:2rem 1rem; color:var(--text-3); font-size:14px; }

/* ── Not found ── */
.pub-not-found { text-align:center; padding:5rem 2rem; }
.pub-nf-icon { margin-bottom:1rem; opacity:.4; }
.pub-nf-text { font-size:16px; color:var(--text-2); }

/* ── Footer ── */
.pub-footer {
  text-align:center; margin-top:4rem; padding-top:2rem; border-top:0.5px solid var(--border);
  font-size:13px; color:var(--text-3);
}
.pub-footer-logo { height:44px; width:auto; display:block; margin:0 auto 10px; }
.pub-footer a { color:var(--olive-light); font-weight:600; text-decoration:none; }
.pub-footer a:hover { text-decoration:underline; }

@media(max-width:520px) {
  .pub-hero { flex-direction:column; text-align:center; }
  .pub-stats-row { justify-content:center; }
  .pub-row .pub-tags .genre-dot:nth-child(n+3) { display:none; }
}
</style>
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1E5C26">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MyScreenScore">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
</head>
<body>

<div class="page-wrap">
  <div class="pub-wrap">
    <div id="pubContent">
      <div class="page-loading"><div class="spinner"></div></div>
    </div>

    <div class="pub-footer">
      <img class="pub-footer-logo" src="icons/logo-nav.png" alt="MyScreenScore">
      Track, rate, and rank everything you watch · <a href="login.html">Create your own</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script>
function _pubEsc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
// Only allow http(s) image URLs into src="" — blocks javascript:/data: tricks
function _pubSafeUrl(u) {
  return (typeof u === 'string' && /^https?:\/\//i.test(u)) ? _pubEsc(u) : '';
}

const PUB_PAGE = 25;
let _pubRanked = [];
let _pubRankedShown = 0;

document.addEventListener('DOMContentLoaded', async () => {
  const params = new URLSearchParams(window.location.search);
  const username = (params.get('u') || '').trim().replace(/^@/, '').toLowerCase();

  if (!username) { renderNotFound('No username provided.'); return; }
  document.title = `@${username} — MyScreenScore`;

  try {
    const profile = await getProfileByUsername(username);
    if (!profile) { renderNotFound(`No user named @${username}.`); return; }
    const entries = await getPublicEntries(profile.id);
    renderProfile(profile, entries);
  } catch (err) {
    console.error(err);
    renderNotFound('Something went wrong loading this profile.');
  }
});

function renderNotFound(msg) {
  document.getElementById('pubContent').innerHTML = `
    <div class="pub-not-found">
      <div class="pub-nf-icon"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg></div>
      <div class="pub-nf-text">${_pubEsc(msg)}</div>
    </div>`;
}

function _pubScore(e) {
  const s = liveScore(e);
  return s != null ? Number(s) : null;
}

function _pubPoster(e) {
  const url = _pubSafeUrl(e.poster_url);
  return url
    ? `<img src="${url}" alt="" loading="lazy">`
    : `<span class="pub-poster-fallback">${_pubEsc((e.title || '?')[0].toUpperCase())}</span>`;
}

function _pubTags(e) {
  const cat = CAT_META[e.cat];
  const genres = (e.genres || []).slice(0, 3).map(g => `<span class="genre-dot">${_pubEsc(g)}</span>`).join('');
  return `<div class="pub-tags">${cat ? `<span class="cat-badge">${_pubEsc(cat.label)}</span>` : ''}${genres}</div>`;
}

function _pubTitle(e) {
  return `<div class="pub-title-row"><div class="pub-title">${_pubEsc(e.title)}</div>${e.year ? `<span class="pub-year">${_pubEsc(e.year)}</span>` : ''}</div>`;
}

function _pubRankRow(e, i) {
  return `<div class="pub-row ranked">
    <div class="pub-rank ${i < 3 ? 'top3' : ''}">${i + 1}</div>
    <div class="pub-poster">${_pubPoster(e)}</div>
    <div style="min-width:0">${_pubTitle(e)}${_pubTags(e)}</div>
    <div class="pub-score-wrap">
      <div class="pub-score">${_pubScore(e).toFixed(2)}</div>
      <div class="pub-score-label">Score</div>
    </div>
  </div>`;
}

function _pubRecentRow(e) {
  const s = _pubScore(e);
  const date = e.completed_date
    ? new Date(e.completed_date + 'T00:00:00').toLocaleDateString('en-US', { month:'short', year:'numeric' })
    : '';
  return `<div class="pub-row recent">
    <div class="pub-poster">${_pubPoster(e)}</div>
    <div style="min-width:0">${_pubTitle(e)}${_pubTags(e)}</div>
    <div class="pub-score-wrap">
      <div class="pub-score">${s != null ? s.toFixed(2) : '—'}</div>
      ${date ? `<div class="pub-date">${_pubEsc(date)}</div>` : ''}
    </div>
  </div>`;
}

function _pubShowMoreRanked() {
  const list = document.getElementById('pubRankedList');
  const next = _pubRanked.slice(_pubRankedShown, _pubRankedShown + PUB_PAGE);
  list.insertAdjacentHTML('beforeend', next.map((e, j) => _pubRankRow(e, _pubRankedShown + j)).join(''));
  _pubRankedShown += next.length;
  const btn = document.getElementById('pubRankedMore');
  if (btn) {
    if (_pubRankedShown >= _pubRanked.length) btn.remove();
    else btn.textContent = `Show more (${_pubRanked.length - _pubRankedShown} left)`;
  }
}

function renderProfile(profile, entries) {
  // 'ongoing' = finished what's out, still airing — counts as watched
  const done     = entries.filter(e => e.status === 'completed' || e.status === 'ongoing');
  const watching = entries.filter(e => e.status === 'watching' || e.status === 'paused').length;
  const queued   = entries.filter(e => e.status === 'queue').length;
  const rated    = done.filter(e => _pubScore(e) != null);
  const avg      = rated.length ? (rated.reduce((s, e) => s + _pubScore(e), 0) / rated.length).toFixed(2) : '—';

  _pubRanked = [...rated].sort((a, b) => _pubScore(b) - _pubScore(a) || String(a.title).localeCompare(String(b.title)));
  _pubRankedShown = 0;

  const recent = [...done]
    .filter(e => e.completed_date)
    .sort((a, b) => String(b.completed_date).localeCompare(String(a.completed_date)))
    .slice(0, 10);

  const name    = profile.display_name || profile.username;
  const avatar  = _pubSafeUrl(profile.avatar_url);
  const initial = _pubEsc((name || '?')[0].toUpperCase());

  document.title = `${name} (@${profile.username}) — MyScreenScore`;

  document.getElementById('pubContent').innerHTML = `
    <div class="pub-hero fade-up">
      <div class="pub-avatar">${avatar ? `<img src="${avatar}" alt="">` : initial}</div>
      <div class="pub-hero-info">
        <div class="pub-name">${_pubEsc(name)}</div>
        <div class="pub-username">@${_pubEsc(profile.username)}</div>
        ${profile.bio ? `<div class="pub-bio">${_pubEsc(profile.bio)}</div>` : ''}
        ${profile.quote ? `<div class="pub-quote">“${_pubEsc(profile.quote)}”</div>` : ''}
        <div class="pub-stats-row">
          <div class="pub-stat"><div class="pub-stat-num">${done.length}</div><div class="pub-stat-label">Watched</div></div>
          <div class="pub-stat"><div class="pub-stat-num">${watching}</div><div class="pub-stat-label">Watching</div></div>
          <div class="pub-stat"><div class="pub-stat-num">${queued}</div><div class="pub-stat-label">Queue</div></div>
          <div class="pub-stat"><div class="pub-stat-num">${avg}</div><div class="pub-stat-label">Avg Score</div></div>
        </div>
      </div>
    </div>

    <div class="pub-section-title fade-up">Ranked List</div>
    ${_pubRanked.length ? `
      <div class="pub-list fade-up" id="pubRankedList"></div>
      ${_pubRanked.length > PUB_PAGE ? `<button class="pub-show-more" id="pubRankedMore" onclick="_pubShowMoreRanked()">Show more</button>` : ''}
    ` : `<div class="pub-empty">No rated titles yet.</div>`}

    ${recent.length ? `
      <div class="pub-section-title fade-up">Recently Watched</div>
      <div class="pub-list fade-up">${recent.map(_pubRecentRow).join('')}</div>
    ` : ''}`;

  if (_pubRanked.length) _pubShowMoreRanked();
}
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(r => console.log('SW registered:', r.scope))
      .catch(e => console.warn('SW failed:', e));
  });
}
</script>
</body>
</html>
