<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
  // GitHub Pages shows this page for ANY missing path (even /watchlist/a/b/c), so every
  // link and file here is resolved from the site's folder, not the broken URL's.
  (function () {
    var base = /^\/watchlist(\/|$)/.test(location.pathname) ? '/watchlist/' : '/';
    // Password-reset / sign-in links that land on a wrong path still finish signing in
    var h = location.hash;
    if (h && (h.indexOf('type=recovery') > -1 || h.indexOf('access_token') > -1)) { location.replace(base + 'login.html' + h); return; }
    document.write('<base href="' + base + '">');
  })();
</script>
<script src="js/splash.js"></script>
<script src="js/i18n.js"></script>
<title>Page not found — MyScreenFolio</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="icons/icon-192.png">
</head>
<body>
<div class="page-wrap"></div>

<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/nav.js"></script>

document.addEventListener('DOMContentLoaded', () => {
  initPageGuest(() => { mssErrorPage('notfound'); });
});
</script>

</html>
