<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="js/splash.js"></script>
<script src="js/i18n.js"></script>
<title>Polls — MyScreenFolio</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/social.css">
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1E5C26">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MyScreenFolio">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
</head>
<body>
<div class="page-wrap fr-page">

  <div class="cat-page-header fade-up">
    <div>
      <div class="fr-eyebrow">Your circle</div>
      <h1 class="cat-page-title">Polls</h1>
      <div class="cat-page-sub" id="socPageSub">Ask your friends what to watch next.</div>
    </div>
  </div>
  <div class="pn-toggle soc-strip" id="socStrip" role="navigation" aria-label="Together"></div>

  <section id="socPolls" aria-label="Polls"></section>

</div>

<script src="js/vendor/supabase-2.118.0.js"></script>
<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/nav.js"></script>
<script src="js/info-popup.js"></script>
<script src="js/rating-popup.js"></script>
<script src="js/easter-egg.js"></script>
<script src="js/note-popup.js"></script>
<script src="js/episode-ratings.js"></script>
<script src="js/list-popup.js"></script>
<script src="js/sort-filter.js"></script>
<script src="js/social.js"></script>
<script src="js/follows.js"></script>
<script src="js/episode-chat.js"></script>
<script src="js/social-nav.js"></script>
<script>
MSSSocial.boot('polls', { start: (user, q) => {
  MSSPolls.mount(document.getElementById('socPolls'), user, { poll: q.get('poll') });
  if (q.get('new') && user) {                 // (+) → New poll, from another page
    const url = new URL(location.href); url.searchParams.delete('new');
    history.replaceState(history.state, '', url.pathname + url.search);
    MSSPolls.create();
  }
} });
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(r => console.log('SW registered:', r.scope))
      .catch(e => console.warn('SW failed:', e));
  });
}
</script>

<div id="udDropdown" class="username-dropdown"></div>
</body>
</html>
