<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lists — MyScreenScore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E5C26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MyScreenScore">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<style>
/* Score styling — matches Discover's grid card exactly */
.home-tmdb-meta-row { display:flex; align-items:center; justify-content:flex-end; gap:8px; margin-top:2px; }
.home-tmdb-score { font-family:var(--bebas); color:var(--olive-light); font-size:clamp(15px, 3.3vw, 17px); font-weight:400; white-space:nowrap; }
/* ── Lists page ── */
.fav-page-list-header {
  display:block;
  margin-bottom:1rem;
}
.fav-page-list-title-row {
  display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:nowrap;
  margin-bottom:6px;
}
.fav-page-list-title-inner { display:flex; align-items:center; gap:8px; min-width:0; flex:1; }
.home-tmdb-year { color:var(--text-3); font-size:clamp(11px, 2.6vw, 13px); }
.fav-edit-btn-row { display:flex; gap:6px; flex-shrink:0; }
@media(max-width:640px) {
  .fav-page-list-title-row { gap:8px; }
  .fav-edit-btn-row { gap:5px; }
  .fav-edit-btn-label { display:none; }
  .fav-edit-btn { padding:7px 9px !important; }
}
.fav-page-list-title {
  font-family:var(--serif);font-size:clamp(17px, 3.4vw, 20px);font-weight:500;color:var(--text);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0;
}
.fav-page-list-count {
  font-size:11px;color:var(--text-3);letter-spacing:.5px;margin-top:2px;
}
.fav-page-section {
  margin-bottom:2.5rem;
}
.fav-page-section-hd {
  font-size:11px;letter-spacing:2.5px;text-transform:uppercase;
  color:var(--olive-light);margin:2rem 0 1.25rem;
  display:flex;align-items:center;gap:12px;
}
.fav-page-section-hd::after{content:'';flex:1;height:0.5px;background:var(--border);}


/* ── Search — same live dropdown pattern used on friends.html/notes.html ── */
.lists-search-wrap { margin-bottom:1.25rem; }
.username-dropdown {
  position:fixed;
  background:var(--bg-3); border:0.5px solid var(--olive-light); border-top:none;
  border-radius:0 0 var(--radius) var(--radius); z-index:290;
  box-shadow:var(--shadow-lg);
  overflow-y:auto; overflow-x:hidden; max-height:320px;
  display:none;
}
.username-dropdown.open { display:block; }
.ud-item {
  display:flex; align-items:center; gap:12px;
  padding:10px 14px; cursor:pointer;
  transition:background .15s;
  border-bottom:0.5px solid var(--border);
}
.ud-item:last-child { border-bottom:none; }
.ud-item:hover, .ud-item.ud-active { background:var(--olive-faint); }
.ud-avatar {
  width:36px; height:36px; border-radius:50%; flex-shrink:0;
  background:var(--bg-3); border:1px solid var(--border-2);
  font-family:var(--serif); font-size:16px; color:var(--text-2);
  display:flex; align-items:center; justify-content:center; overflow:hidden;
}
.ud-avatar img { width:100%; height:100%; object-fit:cover; border-radius:50%; }
.ud-info { flex:1; min-width:0; }
.ud-username { font-size:14px; font-weight:500; color:var(--text); }
.ud-username em { color:var(--olive-light); font-style:normal; font-weight:600; }
.ud-display { font-size:11px; color:var(--text-3); margin-top:2px; }
.ud-loading, .ud-empty { padding:14px; font-size:13px; color:var(--text-3); text-align:center; }
.ud-type-tag {
  font-size:9.5px; font-weight:700; letter-spacing:.5px; text-transform:uppercase;
  color:var(--olive-light); background:var(--olive-faint); border:0.5px solid var(--border-olive);
  border-radius:20px; padding:2px 8px; flex-shrink:0;
}
.lists-search-wrap .fused-search-wrap {
  display:flex; align-items:stretch;
  border:1.5px solid var(--border-olive); border-radius:var(--radius-sm); overflow:hidden;
  background:var(--bg-3); transition:border-color var(--trans) var(--ease), box-shadow var(--trans) var(--ease);
}
.lists-search-wrap .fused-search-wrap:focus-within { border-color:var(--olive-light); box-shadow:0 0 0 3px var(--olive-faint); }
.lists-search-wrap .add-friend-input {
  flex:1; min-width:0; background:transparent; border:none;
  color:var(--text); font-size:16px;
  padding:18px 20px; outline:none; box-sizing:border-box; transition:none;
}
.lists-search-wrap .add-friend-input::placeholder { color:var(--text-3); font-size:14px; }
.lists-search-wrap .fused-search-btn {
  flex-shrink:0; display:flex; align-items:center; gap:8px;
  padding:0 26px; border:none; cursor:pointer;
  background:linear-gradient(135deg, var(--olive-light), var(--olive-2)); color:#fff;
  font-size:14px; font-weight:500; font-family:var(--sans);
  transition:opacity .15s;
}
.lists-search-wrap .fused-search-btn:hover { opacity:.9; }
.lists-search-wrap .fused-search-btn svg { width:16px; height:16px; flex-shrink:0; }
#listsFilterBanner {
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  background:var(--olive-faint); border:0.5px solid var(--border-olive); border-radius:var(--radius);
  padding:10px 16px; margin-top:10px; font-size:13.5px; color:var(--olive-light); font-weight:500;
}
#listsFilterBanner button {
  background:none; border:none; color:var(--olive-light); font-size:12.5px; font-weight:600; cursor:pointer; text-decoration:underline;
}

/* ── Social list rows ── */
.social-list-row { background:var(--card); border:0.5px solid var(--border); border-radius:var(--radius-lg); padding:1.1rem 1.25rem; transition:border-color .15s; cursor:pointer; }
.social-list-row:hover { border-color:var(--border-olive); }
.snote-rect-btn {
  display:flex; align-items:center; justify-content:center; gap:8px;
  padding:11px 8px; border-radius:var(--radius-sm); font-size:13px; font-weight:600;
  background:var(--bg-3); border:0.5px solid var(--border-2); color:var(--text-3); cursor:pointer;
  transition:all .15s; white-space:nowrap;
}
.snote-rect-btn:hover { border-color:var(--border-olive); color:var(--text); }
.snote-rect-btn.active-like { background:var(--olive-faint); border-color:var(--border-olive); color:var(--olive-light); }
.snote-rect-btn.active-dislike { background:rgba(192,104,90,0.12); border-color:rgba(192,104,90,0.4); color:#c0685a; }
.social-list-add-btn {
  font-size:11.5px; font-weight:600; padding:6px 14px; border-radius:999px;
  background:var(--olive-faint); border:0.5px solid var(--border-olive); color:var(--olive-light);
  cursor:pointer; transition:all .15s; white-space:nowrap;
}
.social-list-add-btn:hover { background:var(--olive-light); color:var(--bg); }
.social-list-add-btn:disabled { opacity:.5; cursor:default; }
.social-list-row { position:relative; }
.dt-heart-pop {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) scale(0.4);
  font-size:56px; color:var(--olive-light); text-shadow:0 2px 14px rgba(0,0,0,.35);
  pointer-events:none; opacity:0; animation:dtHeartPop .7s ease forwards; z-index:5;
}
@keyframes dtHeartPop {
  0%   { opacity:0; transform:translate(-50%,-50%) scale(0.4); }
  25%  { opacity:1; transform:translate(-50%,-50%) scale(1.15); }
  40%  { transform:translate(-50%,-50%) scale(0.95); }
  100% { opacity:0; transform:translate(-50%,-50%) scale(1); }
}

/* Picker */
#favListPickerOverlay {
  position:fixed;inset:0;z-index:1200;background:rgba(0,0,0,0.65);
  backdrop-filter:blur(10px);display:flex;align-items:center;
  justify-content:center;padding:16px;box-sizing:border-box;
  opacity:0;pointer-events:none;transition:opacity .22s;
}
#favListPickerOverlay.open{opacity:1;pointer-events:auto;}
#favListPickerSheet {
  width:97%;max-width:540px;background:var(--bg-2);
  border:1.5px solid var(--olive-light);border-radius:var(--radius-lg);
  box-shadow:4px 4px 0 var(--olive);display:flex;flex-direction:column;
  max-height:85dvh;transform:translateY(16px);
  transition:transform .26s cubic-bezier(.4,0,.2,1);
}
#favListPickerOverlay.open #favListPickerSheet{transform:translateY(0);}
.fav-picker-list { min-height:0; } /* lets it actually scroll within max-height instead of overflowing the sheet */
#favPickerModeToggle { flex-shrink:0; }

@media(max-width:600px){
  #favPickerModeToggle .pn-toggle-btn { padding:8px 20px; font-size:12.5px; }
  #favPickerModeToggle { margin-bottom:10px !important; }
}

@media(max-width:600px){
  .fav-h-grid .q-card{flex:0 0 120px;min-width:120px;}
  .fav-h-nav{display:none;}
}
@media(max-width:400px){
  .fav-h-grid .q-card{flex:0 0 105px;min-width:105px;}
}

/* ── Custom List Modal ── */
#favCustomListModal {
  position:fixed;inset:0;z-index:1200;background:rgba(0,0,0,0.72);
  backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;
  padding:16px;box-sizing:border-box;opacity:0;pointer-events:none;transition:opacity .2s;
}
#favCustomListModal.open { opacity:1;pointer-events:auto; }
#favCustomListCard {
  background:var(--bg-2);border:1.5px solid var(--olive-light);
  box-shadow:4px 4px 0 var(--olive);border-radius:var(--radius-lg);
  width:97%;max-width:420px;padding:24px 24px 20px;box-sizing:border-box;
  transform:translateY(16px);transition:transform .25s cubic-bezier(.4,0,.2,1);
}
#favCustomListModal.open #favCustomListCard { transform:translateY(0); }

.lists-page-header-right { display:flex; flex-direction:row; align-items:center; gap:8px; flex-wrap:wrap; }
@media(max-width:520px){
  .lists-page-header-right { width:100%; }
  .lists-page-header-right .btn-add-entry { flex:1; font-size:clamp(11px,3vw,13px); padding:10px 12px; }
}

.list-desc-field {
  width:100%;box-sizing:border-box;padding:10px 14px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:var(--bg-3);color:var(--text);
  font-family:var(--sans);font-size:14px;outline:none;resize:vertical;min-height:56px;
  transition:border-color .15s;
}
.list-desc-field:focus{border-color:var(--olive-light);}
.list-desc-count { font-size:10.5px; color:var(--text-3); text-align:right; margin-top:4px; }
.list-desc-count.over { color:#c0564a; }
.fav-page-list-desc {
  font-size:12.5px; color:var(--text-2); line-height:1.5; margin-top:4px;
}
.list-item-sort-bar { display:flex; gap:6px; flex-wrap:wrap; }
/* Owner popup has 4 actions — 2×2 on phones so labels fit */
@media(max-width:600px) {
  #lpPopupActions:has(> .popup-action-btn:nth-child(4)) { flex-wrap:wrap !important; }
  #lpPopupActions:has(> .popup-action-btn:nth-child(4)) .popup-action-btn { flex:1 1 calc(50% - 4px) !important; }
}
#collabOverlay {
  position:fixed; inset:0; z-index:1250; background:rgba(0,0,0,.55); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  display:flex; align-items:center; justify-content:center; padding:16px; opacity:0; pointer-events:none; transition:opacity .2s;
}
#collabOverlay.open { opacity:1; pointer-events:auto; }
#collabCard {
  width:100%; max-width:460px; max-height:min(80dvh, 640px); display:flex; flex-direction:column;
  background:var(--bg-2); border:1.5px solid var(--olive-light); border-radius:var(--radius-lg); box-shadow:4px 4px 0 var(--olive);
  transform:translateY(10px); transition:transform .2s;
}
#collabOverlay.open #collabCard { transform:none; }
.cp-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:18px 20px 12px; }
.cp-eyebrow { font-family:var(--serif); font-size:11px; font-weight:500; letter-spacing:2.5px; text-transform:uppercase; color:var(--olive-light); margin-bottom:4px; }
.cp-title { font-family:var(--serif); font-size:19px; font-weight:600; line-height:1.25; overflow-wrap:anywhere; }
.cp-close { background:none; border:none; color:var(--text-3); cursor:pointer; display:flex; padding:4px; }
.cp-link { margin:0 20px 12px; padding:12px; border-radius:var(--radius-sm); background:var(--olive-faint); border:1px solid var(--border-olive); }
.cp-link-head { display:flex; gap:10px; align-items:center; margin-bottom:10px; }
.cp-link-ic { width:30px; height:30px; border-radius:50%; flex-shrink:0; background:var(--olive); color:#fff; display:flex; align-items:center; justify-content:center; }
.cp-link-title { font-size:13.5px; font-weight:600; color:var(--text); }
.cp-link-sub { font-size:11.5px; color:var(--text-3); line-height:1.35; }
.cp-link-row { display:flex; gap:8px; }
.cp-link-input { flex:1; min-width:0; padding:8px 10px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--bg-2); color:var(--text-2); font-size:12.5px; font-family:var(--sans); outline:none; text-overflow:ellipsis; }
.cp-link-reset { margin-top:8px; background:none; border:none; padding:0; color:var(--text-3); font-size:11.5px; font-weight:600; cursor:pointer; text-decoration:underline; }
.cp-link-reset:hover { color:#c0564a; }
.cp-divider { display:flex; align-items:center; gap:10px; margin:2px 20px 10px; font-size:11px; font-weight:600; letter-spacing:1px; text-transform:uppercase; color:var(--text-3); }
.cp-divider::before, .cp-divider::after { content:''; flex:1; height:0.5px; background:var(--border); }
.cp-search { position:relative; margin:0 20px 10px; }
.cp-search span { position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--text-3); display:flex; }
.cp-search input {
  width:100%; box-sizing:border-box; padding:11px 14px 11px 38px; border-radius:var(--radius-sm);
  border:1px solid var(--border); background:var(--bg-3); color:var(--text); font-family:var(--sans); font-size:16px; outline:none;
}
.cp-search input:focus { border-color:var(--olive-light); box-shadow:0 0 0 3px var(--olive-faint); }
.cp-list { flex:1; overflow-y:auto; overscroll-behavior:contain; padding:4px 12px; min-height:120px; }
.cp-row { display:flex; align-items:center; gap:12px; padding:9px 8px; border-radius:var(--radius-sm); }
.cp-row:hover { background:var(--card); }
.cp-av { width:40px; height:40px; border-radius:50%; overflow:hidden; flex-shrink:0; display:flex; align-items:center; justify-content:center; background:var(--olive); color:#fff; font-family:var(--serif); font-weight:600; }
.cp-av img { width:100%; height:100%; object-fit:cover; }
.cp-who { flex:1; min-width:0; }
.cp-name { font-size:14px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cp-user { font-size:12px; color:var(--text-3); }
.cp-btn { flex-shrink:0; padding:7px 16px; border-radius:var(--radius-sm); font-family:'Manrope',var(--sans); font-size:12.5px; font-weight:600; cursor:pointer; border:1px solid transparent; }
.cp-invite { background:var(--olive); border-color:var(--olive); color:#fff; }
.cp-invite:hover:not(:disabled) { background:var(--olive-light); border-color:var(--olive-light); }
.cp-sent { background:transparent; border-color:var(--border-2); color:var(--text-3); cursor:default; }
.cp-joined { background:var(--olive-faint); border-color:var(--border-olive); color:var(--olive-light); }
.cp-joined:hover { border-color:#c0564a; color:#c0564a; background:transparent; }
.cp-btn:disabled { opacity:.7; }
.cp-empty { padding:28px 12px; text-align:center; color:var(--text-3); font-size:13px; display:flex; flex-direction:column; align-items:center; gap:10px; }
.cp-empty svg { opacity:.5; }
.cp-empty a { color:var(--olive-light); font-weight:600; text-decoration:none; }
.cp-foot { padding:12px 20px 18px !important; border-top:0.5px solid var(--border); display:flex; flex-direction:row !important; }
.cp-foot .popup-action-btn { flex:1; }

/* ── Reorder mode ── */
.lr-hint {
  display:flex; align-items:center; gap:8px; margin:-2px 0 14px; padding:10px 14px;
  font-size:12.5px; color:var(--text-2); background:var(--olive-faint); border:1px dashed var(--border-olive); border-radius:var(--radius-sm);
}
.lr-hint svg { color:var(--olive-light); flex-shrink:0; }
.lc-card.lc-reorder { cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none; }
.lc-card.lc-reorder:hover { transform:none; }
.lc-card.lc-reorder:active { cursor:grabbing; }
.lc-grid-reorder .lc-card { box-shadow:0 0 0 1px var(--border-olive); }
.lc-grid-reorder .lc-card .lc-posters { opacity:.75; }
.lr-bar {
  display:flex; align-items:center; gap:8px; margin:-4px -4px 10px; padding:4px 4px 10px;
  border-bottom:0.5px dashed var(--border-olive);
}
.lr-grip { width:20px; height:20px; color:var(--olive-light); display:inline-flex; }
.lr-grip svg { width:100%; height:100%; }
.lr-pos {
  font-family:var(--bebas); font-size:16px; line-height:1; color:#fff; background:var(--olive);
  min-width:24px; height:24px; padding:0 6px; border-radius:999px; display:inline-flex; align-items:center; justify-content:center;
}
.lr-move { margin-left:auto; display:flex; gap:6px; }
.lr-arrow {
  width:32px; height:32px; border-radius:50%; cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
  background:var(--bg-3); border:1px solid var(--border-2); color:var(--text-2); transition:background .15s, color .15s, border-color .15s;
}
.lr-arrow svg { width:15px; height:15px; }
.lr-arrow:hover:not(:disabled) { background:var(--olive); border-color:var(--olive); color:#fff; }
.lr-arrow:disabled { opacity:.35; cursor:default; }
/* The slot the card will drop into */
.lc-card.lr-dragging { opacity:.35; border:1.5px dashed var(--olive-light) !important; box-shadow:none !important; background:var(--olive-faint); }
.lc-card.lr-dragging > * { visibility:hidden; }
/* The card following the pointer */
.lr-ghost {
  position:fixed !important; top:0; left:0; z-index:2000; pointer-events:none; margin:0 !important;
  box-shadow:0 24px 50px rgba(0,0,0,.28), 0 0 0 2px var(--olive-light) !important; opacity:.97;
  transition:none; will-change:transform;
}
body.lr-no-select { user-select:none; -webkit-user-select:none; cursor:grabbing; }
.lr-ghost .lr-pos, .lr-ghost .lr-move { visibility:hidden; }
.lr-toggle.active { background:var(--olive) !important; color:#fff !important; border-color:var(--olive) !important; }

</style>
</head>
<body>
<div class="page-wrap">

  <!-- Header -->
  <div class="cat-page-header fade-up">
    <div class="cat-page-header-left">
      <h1 class="cat-page-title" id="listsPageTitle">My Lists</h1>
      <div class="cat-page-sub" id="listsPageSub"></div>
    </div>
    <div class="cat-page-header-right lists-page-header-right">
      <button class="btn-add-entry" id="listsCustomBtn" onclick="openFavCustomListModal()">+ New List</button>
    </div>
  </div>

  <!-- Personal / Social toggle -->
  <div class="pn-toggle fade-up" id="listsModeToggle">
    <button class="pn-toggle-btn active" data-mode="personal" onclick="setListsMode('personal')">Personal</button>
    <button class="pn-toggle-btn" data-mode="social" onclick="setListsMode('social')">Community</button>
  </div>

  <!-- Stat boxes -->
  <div class="page-stats fade-up fade-up-1" id="listsPageStats"></div>


  <!-- Social: search users, list names, item names -->
  <div class="lists-search-wrap fade-up fade-up-1" id="listsSearchWrap" style="display:none;">
    <div class="fused-search-wrap" id="listsSearchWrapInner">
      <input type="text" id="listsSearchInput" class="add-friend-input" placeholder="Search users, lists, or titles…"
             autocomplete="off" spellcheck="false"
             oninput="_llSearch(this.value)"
             onkeydown="_llKeydown(event)">
      <button type="button" class="fused-search-btn" tabindex="-1" onclick="document.getElementById('listsSearchInput').focus()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <span>Search</span>
      </button>
    </div>
    <div id="listsFilterBanner" style="display:none;"></div>
  </div>
  <div id="llDropdown" class="username-dropdown"></div>

  <!-- Toolbar: section label + Sort / Filter (both tabs) -->
  <div class="mss-toolbar fade-up fade-up-1" id="listsToolbar" style="display:none;"></div>

  <!-- Main content -->
  <div id="listsPageContent" class="fade-up fade-up-2">
    <div class="page-loading"><div class="spinner"></div></div>
  </div>

</div>

<!-- Custom List Modal -->
<div id="favCustomListModal" onclick="if(event.target===this)closeFavCustomListModal()">
  <div id="favCustomListCard">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">

<script>
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }


function goToDetail(id, from) {
  sessionStorage.setItem('detailId', id);
  sessionStorage.setItem('detailFrom', from || 'lists.html');
  window.location.href = 'detail.html';
}

function _favNavScroll(id, dir) {
  var el = document.getElementById(id);
  if (!el) return;
  var target = el.scrollWidth > el.clientWidth ? el : (el.closest('.grid-nav-wrap') || el);

// Runtime (movies) / season+episode count (shows) badge — same logic as
// category.js's _entryMeta(), inlined here since lists.html doesn't
// load category.js.

let _listsUser = null;
let _listsEntries = [];
let _listsAll = [];
let _listsOrderSort = 'default';

let _listsEntryMap = {};
// List items can be either a personal entry's UUID (existing behavior)
// or a bare "tmdb:movie:123" / "tmdb:tv:456" reference for something
// added straight from Discover, with no personal entry behind it at
// all. This is the one place that knows how to turn either shape into
// the same {id, title, poster_url, tmdb_id, tmdb_type, year} object
// every renderer already expects — so hScrollSection/social
// previews/list-view.html don't need to know the difference.
function _resolveListItem(id) {
  if (typeof id === 'string' && id.startsWith('tmdb:')) return MSSList.tmdb(id);
  return _listsEntryMap[id] || null;
}

let _listsMode = 'personal';
let _socialListsSort = 'popular';
let _socialListsRaw = [];
let _socialListsMyReactions = {}; // list_id -> 'like' | 'dislike'

// Picker state
let _favListPickerListId = null;
let _favListPickerCat = null;
let _favListPickerGenre = null;
let _favListPickerSelected = [];
let _favListPickerPool = [];
let _favListPickerMax  = Infinity;

// Popup state
let _favPopupId = null;

// Returning via browser back/forward can restore this page from the
// bfcache with stale data (e.g. an entry just added/edited elsewhere
// wouldn't show up here) instead of re-running this page's scripts.
window.addEventListener('pageshow', (event) => {
  if (event.persisted) location.reload();
});

document.addEventListener('DOMContentLoaded', () => {
  attachClearButton('listsSearchInput');
  attachClearButton('favListPickerSearch');
  initPage(async (user) => {
    if (!user) {
      document.querySelector('.page-wrap').innerHTML = `
        <div class="guest-page-state fade-up">
          <div class="guest-page-icon">${icon('layers', 36)}</div>
          <h2 class="guest-page-title">Your Lists</h2>
          <p class="guest-page-sub">Sign in to create and manage your custom lists.</p>
          <div class="guest-cta">
            <a href="login.html" class="guest-btn-primary">Sign In</a>
            <a href="login.html#signup" class="guest-btn-secondary">Create Account</a>
          </div>
        </div>`;
      return;
    }
    _listsUser = user;
    await loadListsPage();

});

/* Personal loads first and shows as soon as YOUR lists + entries arrive.
   Shared lists, other people's entries and titles added from Discover
   (TMDB lookups — cached on the device) fill in right after, each with a
   quick re-render. Community data is fetched quietly in the background so
   switching tabs is instant. */
async function loadListsPage() {
  const [entries, lists] = await Promise.all([
    getEntries(_listsUser.id),
    getFavoriteLists(_listsUser.id),
  ]);
  _listsEntries = entries || [];
  _listsAll = lists || [];
  _listsEntryMap = Object.fromEntries(_listsEntries.map(e => [e.id, e]));
  if (_listsMode === 'personal') renderListsPage();            // ← first paint

  _ensureListSortOrder().catch(() => {});                       // one-off backfill, no need to wait
  await _loadCollabData();
  // Items that aren't in my library: shared lists' entries, older imports
  const foreignIds = [...new Set(_listsAll.flatMap(l => l.items || []))]
    .filter(id => !(typeof id === 'string' && id.startsWith('tmdb:')) && !_listsEntryMap[id]);
  if (foreignIds.length) {
    const { data: foreignRows } = await sb.from('entries').select('*').in('id', foreignIds);
    (foreignRows || []).forEach(e => { _listsEntryMap[e.id] = e; });
  }
  if (_listsMode === 'personal') renderListsPage();
  if (await MSSList.hydrate(_listsAll) && _listsMode === 'personal') renderListsPage();

  _mssIdle(() => _fetchSocialLists());                         // warm up Community
}

// Runs a task once the browser is idle (or after a short delay)
function _mssIdle(fn) { ('requestIdleCallback' in window) ? requestIdleCallback(fn, { timeout: 2500 }) : setTimeout(fn, 1200); }

// Custom lists (cat='custom') are already fetched ordered by created_at, so
// that's a stable baseline. Lists with a real sort_order move to that
// position; ones without one (not yet reordered) keep their created_at
// spot. If any are missing sort_order, backfill it once from the current
// order so future reorders have real values to work from everywhere,
// including profile.html/profile-view.html which just read this column.
async function _ensureListSortOrder() {
  const custom = _listsAll.filter(l => l.cat === 'custom' && !l._collab);
  custom.sort((a, b) => {
    const ao = a.sort_order, bo = b.sort_order;
    if (ao != null && bo != null) return ao - bo;
    if (ao != null) return -1;
    if (bo != null) return 1;
    return new Date(a.created_at) - new Date(b.created_at);
  });

  const needsBackfill = custom.some(l => l.sort_order == null);
  if (!needsBackfill) return;

  try {
    await Promise.all(custom.map((l, i) => {
      l.sort_order = i;
      return sb.from('favorite_lists').update({ sort_order: i }).eq('id', l.id).eq('user_id', _listsUser.id);
    }));
  } catch (e) { console.error('sort_order backfill error:', e); }
}

async function getFavoriteLists(userId) {
  const { data, error } = await sb.from('favorite_lists')
    .select('*')
    .eq('user_id', userId)
    .order('created_at', { ascending: true });
  if (error) { console.error('getFavoriteLists:', error); return []; }
  return data || [];
}

async function saveFavoriteList(list) {
  if (list.id) {
    const upd = { items: list.items, title: list.title };
    if (list.description !== undefined) upd.description = list.description;
    if (list.ranked !== undefined) upd.ranked = list.ranked;
    if (list.sort_mode !== undefined) upd.sort_mode = list.sort_mode;
    const { data, error } = await sb.from('favorite_lists')
      .update(upd)
      .eq('id', list.id)
      .eq('user_id', _listsUser.id)
      .select().single();
    if (error) throw error;
    return data;
  } else {
    const { data, error } = await sb.from('favorite_lists')
      .insert({ user_id: _listsUser.id, cat: list.cat, genre: list.genre, title: list.title, description: list.description || null, items: list.items || [], ranked: list.ranked ?? null, sort_mode: list.sort_mode ?? null })
      .select().single();
    if (error) throw error;
    return data;
  }
}

async function deleteFavoriteList(id) {
  const { error } = await sb.from('favorite_lists').delete().eq('id', id).eq('user_id', _listsUser.id);
  if (error) throw error;
}


// Badge only — no badge at all for lists that haven't picked yet
// Owner's pick for an undecided list (shown inside the popup)
function _rankChoiceHTML(listId) {
  const mark = '<span class="sf-check-mark"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>';
  const id = attrJSON(listId);
  return `<div class="lp-choice"><span>Is this list ranked?</span><span class="sf-choice-inline">
    <label class="sf-check-row"><input type="checkbox" onchange="if(this.checked) setListRanked(${id}, true)">${mark}<span>Ranked</span></label>
    <label class="sf-check-row"><input type="checkbox" onchange="if(this.checked) setListRanked(${id}, false)">${mark}<span>Unranked</span></label>
  </span></div>`;
}
// Kept for any older caller

async function setListRanked(listId, value) {
  try {
    const { error } = await sb.from('favorite_lists').update({ ranked: value }).eq('id', listId).eq('user_id', _listsUser.id);
    if (error) throw error;
    const list = _listsAll.find(l => l.id === listId);
    if (list) list.ranked = value;
    const socialList = _socialListsRaw?.find?.(l => l.id === listId);
    if (socialList) socialList.ranked = value;

    if (_listsMode === 'social') {
      renderSocialLists();
    } else {
      renderListsPage();
    }
    if (_slPopupListId === listId) _renderListPopup();
    showToast(value ? 'Marked as ranked!' : 'Marked as unranked.');
  } catch (err) {
    console.error('Set ranked error:', err);
    showToast('Failed to update.', 'err');
  }
}

const _LIST_ICONS = {
  rename: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>`,
  edit:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>`,
  del:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>`,
};

/* ══ Reorder lists (drag, or arrows) ══
   Tap "Reorder" → cards get a grip bar; drag any card (mouse or finger)
   and the others slide out of the way (FLIP animation). Arrows do the
   same one step at a time (and work with the keyboard). Every change
   saves on its own. Only available on the Default order with no filters,
   since that's the order being edited. */
let _listsReorder = false;
let _lr = null;       // active drag state

/* ══ Collaborative lists ══
   _listsCollab[listId] = [{ user_id, status, profile }] for lists I own.
   Lists other people shared with me (accepted) are added to _listsAll
   with _collab = true and _owner = their profile. */
let _listsCollab = {};
let _listsFriends = null;

async function _loadCollabData() {
  _listsCollab = {};
  try {
    const myIds = _listsAll.filter(l => l.cat === 'custom').map(l => l.id);
    const [mineRes, sharedRes] = await Promise.all([
      myIds.length ? sb.from('list_collaborators').select('list_id, user_id, status').in('list_id', myIds).neq('status', 'declined') : { data: [] },
      sb.from('list_collaborators').select('list_id, sort_order').eq('user_id', _listsUser.id).eq('status', 'accepted'),
    ]);
    const sharedIds = (sharedRes.data || []).map(r => r.list_id);
    const sharedLists = sharedIds.length ? (await sb.from('favorite_lists').select('*').in('id', sharedIds)).data || [] : [];
    const peopleIds = [...new Set([...(mineRes.data || []).map(r => r.user_id), ...sharedLists.map(l => l.user_id)])];
    const people = peopleIds.length ? (await sb.from('profiles').select('id, username, display_name, avatar_url').in('id', peopleIds)).data || [] : [];
    const P = Object.fromEntries(people.map(p => [p.id, p]));
    (mineRes.data || []).forEach(r => { (_listsCollab[r.list_id] ||= []).push({ ...r, profile: P[r.user_id] || null }); });
    // A shared list sits where *I* put it (my own sort_order on the collaborator
    // row) — new ones default to the top. The owner's order never applies here.
    const myPos = Object.fromEntries((sharedRes.data || []).map(r => [r.list_id, r.sort_order]));
    sharedLists.forEach(l => { l._collab = true; l._owner = P[l.user_id] || null; l.sort_order = myPos[l.id] ?? -1; });
    _listsAll = _listsAll.filter(l => !l._collab).concat(sharedLists);
  } catch (e) { console.warn('Collab data load failed (run 021 SQL?):', e); }
}


/* ── Friends picker (with search) for inviting ── */
let _collabPickerList = null, _collabPickerThen = null;
function _injectCollabPicker() {
  if (document.getElementById('collabOverlay')) return;
  const el = document.createElement('div');
  el.id = 'collabOverlay';
  el.innerHTML = `<div id="collabCard">
      <div class="cp-head">
        <div><div class="cp-eyebrow">Collaborate</div><div class="cp-title" id="collabTitle">Invite friends</div></div>
        <button class="cp-close" onclick="closeCollabPicker()" aria-label="Close">${icon('x', 18)}</button>
      </div>
      <div class="cp-link" id="collabLinkBox">
        <div class="cp-link-head"><span class="cp-link-ic">${icon('link', 15)}</span>
          <div><div class="cp-link-title">Invite link</div><div class="cp-link-sub">Anyone with the link can ask to join and add titles</div></div></div>
        <div class="cp-link-row">
          <input class="cp-link-input" id="collabLinkInput" readonly value="Creating link…" onclick="this.select()" aria-label="Invite link">
          <button class="cp-btn cp-invite" id="collabLinkCopy" onclick="_collabCopyLink()" disabled>Copy</button>
        </div>
        <button class="cp-link-reset" onclick="_collabResetLink()">Reset link</button>
      </div>
      <div class="cp-divider"><span>or invite friends</span></div>
      <div class="cp-search"><span>${icon('search', 15)}</span><input type="text" id="collabSearch" placeholder="Search your friends…" autocomplete="off" oninput="_renderCollabPicker()"></div>
      <div class="cp-list" id="collabList"></div>
      <div class="cp-foot" id="collabPopupActions"><button class="popup-action-btn" onclick="closeCollabPicker()">Done</button></div>
    </div>`;
  el.addEventListener('click', e => { if (e.target === el) closeCollabPicker(); });
  document.body.appendChild(el);
}
async function openCollabPicker(listId, then) {
  const list = _listsAll.find(l => l.id === listId && !l._collab);
  if (!list) return;
  _injectCollabPicker();
  _collabPickerList = list; _collabPickerThen = then || null;
  document.getElementById('collabTitle').textContent = `Invite friends to “${list.title}”`;
  document.getElementById('collabSearch').value = '';
  document.getElementById('collabList').innerHTML = '<div class="page-loading" style="padding:2rem"><div class="spinner"></div></div>';
  document.getElementById('collabOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  if (!_listsFriends) {
    try {
      const all = await getFriendships(_listsUser.id);
      _listsFriends = all.filter(f => f.status === 'accepted' && f.friendProfile).map(f => f.friendProfile);
    } catch { _listsFriends = []; }
  }
  _renderCollabPicker();
  _collabLoadLink();
}

/* ── Invite link (owner only) ── */
function _collabLinkURL(token) {
  const base = location.href.replace(/[^/]*$/, '');
  return `${base}list-view.html?list=${encodeURIComponent(_collabPickerList.id)}&join=${encodeURIComponent(token)}`;
}
async function _collabLoadLink(reset) {
  const input = document.getElementById('collabLinkInput'), btn = document.getElementById('collabLinkCopy');
  if (!input || !_collabPickerList) return;
  input.value = reset ? 'Making a new link…' : 'Creating link…'; btn.disabled = true;
  try {
    const { data, error } = await sb.rpc(reset ? 'reset_list_join_token' : 'get_list_join_token', { p_list_id: _collabPickerList.id });
    if (error) throw error;
    input.value = _collabLinkURL(data); btn.disabled = false;
    if (reset) showToast('New link created — the old one no longer works.');
  } catch (e) { console.error(e); input.value = 'Could not create a link (run 024 SQL?)'; }
}
async function _collabCopyLink() {
  const url = document.getElementById('collabLinkInput').value;
  const title = _collabPickerList?.title || 'my list';
  // Phones: native share sheet (Messages, WhatsApp…); otherwise copy
  if (navigator.share && window.matchMedia('(pointer:coarse)').matches) {
    try { await navigator.share({ title: `Join “${title}” on MyScreenScore`, url }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  try { await navigator.clipboard.writeText(url); }
  catch { const i = document.getElementById('collabLinkInput'); i.select(); document.execCommand('copy'); }
  const btn = document.getElementById('collabLinkCopy');
  btn.textContent = 'Copied ✓'; setTimeout(() => { btn.textContent = 'Copy'; }, 1800);
}
async function _collabResetLink() {
  const ok = await showConfirm({ title: 'Reset invite link?', message: 'The current link will stop working. People who already joined stay on the list.', confirmText: 'Reset', iconName: 'refresh', danger: false });
  if (ok) _collabLoadLink(true);
}
function closeCollabPicker() {
  const ov = document.getElementById('collabOverlay');
  if (!ov || !ov.classList.contains('open')) return;
  ov.classList.remove('open');
  document.body.style.overflow = '';
  renderListsPage();
  const then = _collabPickerThen; _collabPickerThen = null; _collabPickerList = null;
  if (then) setTimeout(then, 250);
}
function _renderCollabPicker() {
  const wrap = document.getElementById('collabList');
  if (!wrap || !_collabPickerList) return;
  const q = document.getElementById('collabSearch').value.trim().toLowerCase();
  const friends = (_listsFriends || []).filter(p => !q || (p.username || '').toLowerCase().includes(q) || (p.display_name || '').toLowerCase().includes(q));
  if (!(_listsFriends || []).length) {
    wrap.innerHTML = `<div class="cp-empty">${icon('users', 28)}<div>You don't have any friends to invite yet.</div><a href="friends.html">Find friends →</a></div>`;
    return;
  }
  if (!friends.length) { wrap.innerHTML = `<div class="cp-empty">No friends match “${esc(q)}”.</div>`; return; }
  const status = Object.fromEntries((_listsCollab[_collabPickerList.id] || []).map(c => [c.user_id, c.status]));
  wrap.innerHTML = friends.map(p => {
    const st = status[p.id];
    const btn = st === 'accepted'
      ? `<button class="cp-btn cp-joined" onclick="_collabRemove(${attrJSON(p.id)}, ${attrJSON(p.username)})" title="Remove from list">Joined ✓</button>`
      : st === 'pending'
      ? `<button class="cp-btn cp-sent" disabled>Invited</button>`
      : `<button class="cp-btn cp-invite" onclick="_collabInvite(this, ${attrJSON(p.id)})">Invite</button>`;

  }).join('');
}
async function _collabInvite(btn, userId) {
  btn.disabled = true; btn.textContent = 'Sending…';
  try {
    const { data, error } = await sb.rpc('invite_to_list', { p_list_id: _collabPickerList.id, p_user_id: userId });
    if (error) throw error;
    (_listsCollab[_collabPickerList.id] ||= []).push({ list_id: _collabPickerList.id, user_id: userId, status: data === 'accepted' ? 'accepted' : 'pending',
      profile: (_listsFriends || []).find(p => p.id === userId) || null });

  } catch (e) {
    btn.disabled = false; btn.textContent = 'Invite';
    showToast(isRateLimitError(e) ? RATE_LIMIT_MESSAGE : 'Could not send the invite — try again.', 'err');
    console.error(e);
  }
}
async function _collabRemove(userId, username) {
  const ok = await showConfirm({ title: 'Remove collaborator?', message: `@${username} won't be able to add titles to this list anymore.`, confirmText: 'Remove', iconName: 'x' });
  if (!ok) return;
  try {
    const { error } = await sb.rpc('remove_list_collaborator', { p_list_id: _collabPickerList.id, p_user_id: userId });

    _listsCollab[_collabPickerList.id] = (_listsCollab[_collabPickerList.id] || []).filter(c => c.user_id !== userId);
    showToast(`Removed @${username}.`);
    _renderCollabPicker();

}
async function leaveSharedList(listId) {

let _lrSaveTimer = null;
function _lrSave(order) {
  // Update locally right away, then persist (debounced so fast moves = one save)
  order.forEach((id, i) => { const l = _listsAll.find(x => x.id === id); if (l) l.sort_order = i; });
  clearTimeout(_lrSaveTimer);
  _lrSaveTimer = setTimeout(async () => {

// Moves the card elements and animates everyone else sliding (FLIP)
function _lrAnimate(grid, mutate) {
  const cards = [...grid.querySelectorAll('.lc-card')];
  const before = new Map(cards.map(c => [c, c.getBoundingClientRect()]));
  mutate();
  cards.forEach(c => {
    if (c.classList.contains('lr-dragging')) return;
    const a = before.get(c), b = c.getBoundingClientRect();
    const dx = a.left - b.left, dy = a.top - b.top;
    if (!dx && !dy) return;
    c.style.transition = 'none';
    c.style.transform = `translate(${dx}px, ${dy}px)`;
    requestAnimationFrame(() => {
      c.style.transition = 'transform .28s cubic-bezier(.2,.8,.2,1)';
      c.style.transform = '';
    });
  });
}

function _lrRefreshPositions() {
  const cards = [...document.querySelectorAll('#lcGridMine > .lc-card')];
  cards.forEach((c, i) => {
    const pos = c.querySelector('.lr-pos'); if (pos) pos.textContent = i + 1;
    const [prev, next] = c.querySelectorAll('.lr-arrow');
    if (prev) prev.disabled = i === 0;
    if (next) next.disabled = i === cards.length - 1;
  });
}

function _lrMove(id, dir) {
  const grid = document.getElementById('lcGridMine');
  const card = grid && grid.querySelector(`.lc-card[data-list-id="${CSS.escape(id)}"]`);
  if (!card) return;
  const sib = dir < 0 ? card.previousElementSibling : card.nextElementSibling;
  if (!sib) return;
  _lrAnimate(grid, () => dir < 0 ? grid.insertBefore(card, sib) : grid.insertBefore(sib, card));
  _lrRefreshPositions();
  _lrSave(_lrCurrentOrder());
  card.querySelector(dir < 0 ? '.lr-arrow' : '.lr-arrow:last-child')?.focus();
}

function _lrPointerDown(ev, card) {
  if (ev.button !== undefined && ev.button !== 0) return;
  const grid = document.getElementById('lcGridMine');
  const rect = card.getBoundingClientRect();
  _lr = { card, grid, startX: ev.clientX, startY: ev.clientY, offX: ev.clientX - rect.left, offY: ev.clientY - rect.top,
          w: rect.width, h: rect.height, started: false, pointerId: ev.pointerId, order0: _lrCurrentOrder().join('|') };
  // Listen on window, not the card: the card moves around in the DOM while
  // dragging, and moving an element drops any pointer capture it had.
  window.addEventListener('pointermove', _lrPointerMove, { passive: false });
  window.addEventListener('pointerup', _lrPointerUp);
  window.addEventListener('pointercancel', _lrPointerUp);
}

function _lrStart() {
  const { card, w, h } = _lr;
  // Ghost follows the pointer; the real card stays in the grid as a placeholder
  const ghost = card.cloneNode(true);
  ghost.classList.add('lr-ghost');
  ghost.style.width = w + 'px'; ghost.style.height = h + 'px';
  document.body.appendChild(ghost);
  _lr.ghost = ghost;
  card.classList.add('lr-dragging');
  document.body.classList.add('lr-no-select');
  _lr.started = true;
  if (navigator.vibrate) { try { navigator.vibrate(8); } catch {} }
}

function _lrPointerMove(ev) {
  if (!_lr || (_lr.pointerId != null && ev.pointerId !== _lr.pointerId)) return;
  const dx = ev.clientX - _lr.startX, dy = ev.clientY - _lr.startY;
  if (!_lr.started) {
    if (Math.hypot(dx, dy) < 6) return;     // small wiggle = not a drag yet
    _lrStart();
  }
  ev.preventDefault();
  const { ghost, offX, offY, card, grid } = _lr;
  ghost.style.transform = `translate(${ev.clientX - offX}px, ${ev.clientY - offY}px) rotate(1.5deg) scale(1.03)`;

  // Auto-scroll near the top/bottom edge
  const edge = 80;
  _lr.scrollDir = ev.clientY < edge ? -1 : ev.clientY > window.innerHeight - edge ? 1 : 0;
  if (_lr.scrollDir && !_lr.scrollRAF) _lrAutoScroll();

  // Which card is under the pointer?
  ghost.style.display = 'none';
  const under = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('#lcGridMine .lc-card');
  ghost.style.display = '';
  if (!under || under === card) return;
  // Moving forward → drop after the hovered card; moving back → before it
  const cards = [...grid.querySelectorAll('.lc-card')];
  const ref = cards.indexOf(under) > cards.indexOf(card) ? under.nextElementSibling : under;
  _lrAnimate(grid, () => grid.insertBefore(card, ref));
  _lrRefreshPositions();
}

function _lrAutoScroll() {
  if (!_lr || !_lr.scrollDir) { if (_lr) _lr.scrollRAF = null; return; }
  window.scrollBy(0, _lr.scrollDir * 12);
  _lr.scrollRAF = requestAnimationFrame(_lrAutoScroll);
}

function _lrPointerUp() {
  if (!_lr) return;
  const { card, ghost, started, order0 } = _lr;
  window.removeEventListener('pointermove', _lrPointerMove);
  window.removeEventListener('pointerup', _lrPointerUp);
  window.removeEventListener('pointercancel', _lrPointerUp);
  if (_lr.scrollRAF) cancelAnimationFrame(_lr.scrollRAF);
  if (started) {
    // Ghost glides into the card's new slot, then disappears
    const r = card.getBoundingClientRect();
    ghost.style.transition = 'transform .22s cubic-bezier(.2,.8,.2,1)';
    ghost.style.transform = `translate(${r.left}px, ${r.top}px)`;
    setTimeout(() => { ghost.remove(); card.classList.remove('lr-dragging'); }, 220);
    document.body.classList.remove('lr-no-select');
    const order = _lrCurrentOrder();
    if (order.join('|') !== order0) _lrSave(order);
  }
  _lr = null;
}

/* ── Search — users, list names, and item (title) names — same live
   dropdown pattern used on friends.html/notes.html ── */
let _llTimer = null;
let _llActive = -1;
let _llResults = [];
let _llScrollY = 0;

function _llPosition() {
  const wrap = document.getElementById('listsSearchWrapInner');
  const drop = document.getElementById('llDropdown');
  if (!wrap || !drop) return;
  const r = wrap.getBoundingClientRect();
  drop.style.top = r.bottom + 'px';
  drop.style.left = r.left + 'px';
  drop.style.width = r.width + 'px';
  drop.style.position = 'fixed';
}

function _llLockScroll() {
  _llScrollY = window.scrollY;
  document.body.style.overflow = 'hidden';
  document.body.style.position = 'fixed';
  document.body.style.width = '100%';
  document.body.style.top = '-' + _llScrollY + 'px';
}

function _llUnlockScroll() {
  document.body.style.overflow = '';
  document.body.style.position = '';
  document.body.style.width = '';
  document.body.style.top = '';
  window.scrollTo(0, _llScrollY || 0);
}

async function _llSearch(val) {
  const q = val.trim().toLowerCase();
  const drop = document.getElementById('llDropdown');
  clearTimeout(_llTimer);
  _llActive = -1;
  if (q.length < 2) {
    drop.classList.remove('open');
    document.getElementById('listsSearchWrapInner')?.classList.remove('dd-connected-active');
    _llUnlockScroll();
    return;
  }
  _llPosition();
  drop.innerHTML = '<div class="ud-loading">Searching…</div>';
  drop.classList.add('open');
  document.getElementById('listsSearchWrapInner')?.classList.add('dd-connected-active');
  _llLockScroll();

  _llTimer = setTimeout(async () => {
    try {
      const { data: users } = await sb.from('profiles')
        .select('id, username, display_name, avatar_url')
        .ilike('username', q + '%')
        .neq('id', _listsUser?.id || '')
        .limit(5);

      const listMatches = _socialListsRaw
        .filter(l => (l.title || '').toLowerCase().includes(q))
        .slice(0, 5);

      const seenEntryTitles = new Set();
      const itemMatches = [];
      for (const l of _socialListsRaw) {
        for (const id of (l.items || [])) {
          const e = _resolveSocialItem(id);
          if (!e || !e.title) continue;
          const key = e.title.toLowerCase();
          if (!key.includes(q) || seenEntryTitles.has(key)) continue;
          seenEntryTitles.add(key);
          itemMatches.push(e);
          if (itemMatches.length >= 5) break;
        }
        if (itemMatches.length >= 5) break;
      }

      _llResults = [
        ...(users || []).map(u => ({ type: 'user', ...u })),
        ...listMatches.map(l => ({ type: 'list', ...l })),
        ...itemMatches.map(e => ({ type: 'item', ...e })),
      ];

      if (!_llResults.length) {
        drop.innerHTML = '<div class="ud-empty">No matches found</div>';
        return;
      }

      const reg = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      drop.innerHTML = _llResults.map((r, i) => {
        if (r.type === 'user') {
          const initial = (r.username[0] || '?').toUpperCase();
          const avatarHTML = safeURL(r.avatar_url)
            ? '<div class="ud-avatar"><img src="'+safeURL(r.avatar_url)+'" loading="lazy"></div>'
            : '<div class="ud-avatar">' + initial + '</div>';
          const highlighted = r.username.replace(reg, '<em>$1</em>');
          const display = r.display_name && r.display_name !== r.username ? r.display_name : '';
          return '<div class="ud-item" data-i="' + i + '" onmousedown="_llSelectResult(' + i + ')">'
            + avatarHTML
            + '<div class="ud-info"><div class="ud-username">@' + highlighted + '</div>'
            + (display ? '<div class="ud-display">' + display + '</div>' : '') + '</div>'
            + '<span class="ud-type-tag">User</span></div>';
        }
        if (r.type === 'list') {
          const initial = (r.title[0] || '?').toUpperCase();
          const highlighted = esc(r.title).replace(reg, '<em>$1</em>');
          return '<div class="ud-item" data-i="' + i + '" onmousedown="_llSelectResult(' + i + ')">'
            + '<div class="ud-avatar">' + initial + '</div>'
            + '<div class="ud-info"><div class="ud-username">' + highlighted + '</div>'
            + '<div class="ud-display">List by @' + esc(r.username || 'user') + '</div></div>'
            + '<span class="ud-type-tag">List</span></div>';
        }
        // item
        const avatarHTML = safeURL(r.poster_url)
          ? '<div class="ud-avatar"><img src="'+safeURL(r.poster_url)+'" loading="lazy"></div>'
          : '<div class="ud-avatar">' + ((r.title || '?')[0] || '?').toUpperCase() + '</div>';
        const highlighted = esc(r.title).replace(reg, '<em>$1</em>');
        return '<div class="ud-item" data-i="' + i + '" onmousedown="_llSelectResult(' + i + ')">'
          + avatarHTML
          + '<div class="ud-info"><div class="ud-username">' + highlighted + '</div>'
          + '<div class="ud-display">Appears in community lists</div></div>'
          + '<span class="ud-type-tag">Title</span></div>';
      }).join('');
    } catch (e) {
      console.error('Search error:', e);
      drop.innerHTML = '<div class="ud-empty">Error searching</div>';
    }
  }, 250);
}

function _llKeydown(e) {
  const drop = document.getElementById('llDropdown');
  const items = drop.querySelectorAll('.ud-item');
  if (!drop.classList.contains('open') || !items.length) return;
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    _llActive = Math.min(_llActive + 1, items.length - 1);
    items.forEach((el, i) => el.classList.toggle('ud-active', i === _llActive));
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    _llActive = Math.max(_llActive - 1, -1);
    items.forEach((el, i) => el.classList.toggle('ud-active', i === _llActive));
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (_llActive >= 0) _llSelectResult(_llActive);
  } else if (e.key === 'Escape') {
    drop.classList.remove('open'); _llActive = -1;
    document.getElementById('listsSearchWrapInner')?.classList.remove('dd-connected-active');
    _llUnlockScroll();
  }
}

document.addEventListener('click', e => {

let _socialEntryMap = {}; // entry_id -> entry (across ALL social lists, not just the viewer's own)
function _resolveSocialItem(id) {
  if (typeof id === 'string' && id.startsWith('tmdb:')) return MSSList.tmdb(id);
  return _socialEntryMap[id] || null;
}
let _listsFilterMode = null; // { type: 'user'|'item', label, ... }

// Fetches Community data once (also used to prefetch in the background);
// TMDB posters for Discover-added titles fill in afterwards.
let _socialListsPromise = null, _socialListsCache = null;
function _fetchSocialLists(force) {
  if (_socialListsPromise && !force) return _socialListsPromise;
  _socialListsPromise = (async () => {
    const { data, error } = await sb.rpc('get_social_lists', { p_limit: 100 });
    if (error) throw error;
    const lists = data || [];
    // Other users' entries for the poster previews (Discover items are hydrated separately)
    const entryItemIds = [...new Set(lists.flatMap(l => l.items || []))].filter(id => !(typeof id === 'string' && id.startsWith('tmdb:')));
    const [entryRes, reactRes] = await Promise.all([
      entryItemIds.length ? sb.from('entries').select('*').in('id', entryItemIds) : { data: [] },
      (_listsUser && lists.length) ? sb.from('list_reactions').select('list_id, is_like').eq('user_id', _listsUser.id).in('list_id', lists.map(l => l.id)) : { data: [] },
    ]);
    _socialEntryMap = {};
    (entryRes.data || []).forEach(e => { _socialEntryMap[e.id] = e; });
    _socialListsMyReactions = {};
    (reactRes.data || []).forEach(r => { _socialListsMyReactions[r.list_id] = r.is_like ? 'like' : 'dislike'; });
    _socialListsCache = lists;
    MSSList.hydrate(lists).then(changed => { if (changed && _listsMode === 'social') renderSocialLists(); });
    return lists;
  })().catch(err => { _socialListsPromise = null; throw err; });
  return _socialListsPromise;
}

async function loadSocialLists() {
  const wrap = document.getElementById('listsPageContent');
  document.getElementById('listsPageSub').textContent = 'Explore collections from the community and discover what others are watching.';
  if (!_socialListsCache) {                                  // not prefetched yet
    wrap.innerHTML = `<div class="page-loading"><div class="spinner"></div></div>`;
    document.getElementById('listsPageStats').innerHTML = '';

    _socialListsRaw = await _fetchSocialLists();

    wrap.innerHTML = `<div class="empty" style="padding:3rem 1rem;text-align:center;color:var(--text-3);">Couldn't load social lists right now.</div>`;

}

    () => ({ like: l.like_count, dislike: l.dislike_count, mine: _socialListsMyReactions[listId] || null }),

async function forkSocialList(listId) {
  if (!_listsUser) { showToast('Sign in to add lists.', 'err'); return; }
  const list = _socialListsRaw.find(l => l.id === listId);
  if (!list) return;
  try {
    const { error } = await sb.from('favorite_lists').insert({
      user_id: _listsUser.id,
      cat: 'custom',
      genre: list.genre || '',
      title: list.title,
      description: list.description || null,
      items: list.items || [],
      ranked: list.ranked ?? null,
      forked_from: list.id,
    });
    if (error) throw error;
    showToast('Added to your lists!');

    _listsAll = lists || [];

    if (_slPopupListId === listId) _renderSocialListPopup(list);
  } catch (err) {
    console.error('Fork list error:', err);
    showToast(isRateLimitError(err) ? RATE_LIMIT_MESSAGE : 'Failed to add list.', 'err');
  }
}


// 50-word cap on description fields. _listsGuardWordLimit blocks further
// typing once the limit is reached (deletions and replacing a selection
// still work) instead of letting extra words in and yanking them back
// after the fact. _listsUpdateWordCount stays as a safety-net fallback
// for input paths that bypass beforeinput (e.g. some IME flows).
function _listsCountWords(s) {
  return s.trim() ? s.trim().split(/\s+/).length : 0;
}
function _listsUpdateWordCount(inputId, countId) {
  const el = document.getElementById(inputId);
  const words = el.value.trim().split(/\s+/).filter(Boolean);
  const countEl = document.getElementById(countId);
  if (words.length > 50) {
    el.value = words.slice(0, 50).join(' ');
    if (countEl) { countEl.textContent = 'Reached max word limit (50/50 words)'; countEl.classList.add('over'); }
    return;
  }
  const count = words.length;
  if (countEl) {
    countEl.textContent = `${count} / 50 words`;
    countEl.classList.toggle('over', count >= 50);
  }
}
function _listsGuardWordLimit(inputId, countId) {
  const el = document.getElementById(inputId);
  if (!el || el.dataset.wordLimitGuarded) return;
  el.dataset.wordLimitGuarded = '1';
  el.addEventListener('beforeinput', e => {
    if (e.inputType && e.inputType.startsWith('delete')) return;
    if (el.selectionStart !== el.selectionEnd) return;
    const count = el.value.trim() ? el.value.trim().split(/\s+/).length : 0;
    if (count >= 50) {
      e.preventDefault();
      const countEl = document.getElementById(countId);
      if (countEl) { countEl.textContent = 'Reached max word limit (50/50 words)'; countEl.classList.add('over'); }
    }
  });
}

async function deleteFavListConfirm(id) {
  const list = _listsAll.find(l => l.id === id);
  const ok = await showConfirm({ title: 'Delete List?', message: '"'+(list?.title||'this list')+'" will be permanently deleted.', confirmText: 'Delete', iconName: 'x' });
  if (!ok) return;

  // Optimistic: remove from view immediately after confirming, restore
  // it if the delete actually fails server-side.
  const idx = _listsAll.findIndex(l => l.id === id);
  const removed = _listsAll[idx];
  _listsAll = _listsAll.filter(l => l.id !== id);
  renderListsPage();

  try {
    await deleteFavoriteList(id);
    showToast('List deleted.');
  } catch(e) {
    if (removed) _listsAll.splice(idx, 0, removed);
    renderListsPage();
    showToast('Error deleting.', 'err');
  }
}

function openFavListPicker(listId) {
  _favListPickerListId = listId;
  const list = _listsAll.find(l => l.id === listId);
  if (!list) return;
  const cat = list.cat, genre = list.genre, title = list.title;
  const currentItems = (list.items || []).slice();
  _favListPickerMax = Infinity;

  _favListPickerCat = cat;
  _favListPickerGenre = genre;
  _favListPickerSelected = currentItems.filter(id => !!_resolveListItem(id));

  let pool = _listsEntries.filter(e => e.status === 'completed' || e.status === 'ongoing');
  if (cat && cat !== 'custom') {
    pool = pool.filter(e => {
      if (cat === 'movies') return e.cat === 'movies' || (e.ratings?._media_type === 'movie');
      if (cat === 'tv') return e.cat === 'tv' || ((e.cat === 'anime' || e.cat === 'cartoons') && e.ratings?._media_type !== 'movie');
      return e.cat === cat;
    });
  }
  if (genre) pool = pool.filter(e => (e.genres || []).includes(genre));
  _favListPickerPool = pool;

  document.getElementById('favListPickerTitle').textContent = title;
  _favPickerSetMode('library');
  _favPickerResetSearch();
  _favUpdateCount();
  _favRenderPickerList();

  document.getElementById('favListPickerOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function _favRankCls(i) {
  return i === 0 ? 'cg-rank-1' : i === 1 ? 'cg-rank-2' : i === 2 ? 'cg-rank-3' : 'cg-rank-other';
}

function _favUpdateCount() {
  const maxLabel = _favListPickerMax === Infinity ? '∞' : String(_favListPickerMax);
  document.getElementById('favListPickerCount').textContent = `${_favListPickerSelected.length} / ${maxLabel}`;
}

function _favDragHandleSVG() {
  return '<svg width="10" height="16" viewBox="0 0 10 16" fill="currentColor"><circle cx="2" cy="2" r="1.4"/><circle cx="8" cy="2" r="1.4"/><circle cx="2" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="2" cy="14" r="1.4"/><circle cx="8" cy="14" r="1.4"/></svg>';
}

let _favPickerSearchQuery = '';
let _favPickerMode = 'library';
let _favDiscoverSearchTimer = null;

function _favPickerSetMode(mode) {
  _favPickerMode = mode;
  document.querySelectorAll('#favPickerModeToggle .pn-toggle-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  const inp = document.getElementById('favListPickerSearch');
  inp.value = '';
  inp.placeholder = mode === 'discover' ? 'Search movies & shows on TMDB…' : 'Search…';
  _favPickerSearchQuery = '';
  if (mode === 'discover') {
    document.getElementById('favListPickerList').innerHTML = `<div class="fav-picker-empty">Search for a movie or show to add it — no personal rating required.</div>`;
  } else {
    _favRenderPickerList();
  }
}

function _favPickerSearch(q) {
  _favPickerSearchQuery = q.trim().toLowerCase();
  if (_favPickerMode === 'discover') {
    clearTimeout(_favDiscoverSearchTimer);
    if (!_favPickerSearchQuery) {
      document.getElementById('favListPickerList').innerHTML = `<div class="fav-picker-empty">Search for a movie or show to add it — no personal rating required.</div>`;
      return;
    }
    document.getElementById('favListPickerList').innerHTML = `<div class="fav-picker-empty">Searching…</div>`;
    _favDiscoverSearchTimer = setTimeout(() => _favRunDiscoverSearch(_favPickerSearchQuery), 350);
  } else {
    _favRenderPickerList();
  }
}
function _favPickerResetSearch() {
  _favPickerSearchQuery = '';
  const inp = document.getElementById('favListPickerSearch');
  if (inp) inp.value = '';
}

async function _favRunDiscoverSearch(q) {
  try {
    const [movRes, tvRes] = await Promise.all([
      tmdbFetch(`${TMDB_BASE}/search/movie?api_key=${TMDB_KEY}&language=en-US&query=${encodeURIComponent(q)}`).then(r => r.json()),
      tmdbFetch(`${TMDB_BASE}/search/tv?api_key=${TMDB_KEY}&language=en-US&query=${encodeURIComponent(q)}`).then(r => r.json()),
    ]);
    const movies = (movRes.results || []).slice(0, 8).map(r => ({ pseudoId: `tmdb:movie:${r.id}`, title: r.title, poster_url: r.poster_path ? TMDB_FULL + r.poster_path : null, thumb: r.poster_path ? TMDB_IMG + r.poster_path : null, year: (r.release_date||'').split('-')[0], tmdb_id: r.id, tmdb_type: 'movie' }));
    const shows  = (tvRes.results || []).slice(0, 8).map(r => ({ pseudoId: `tmdb:tv:${r.id}`, title: r.name, poster_url: r.poster_path ? TMDB_FULL + r.poster_path : null, thumb: r.poster_path ? TMDB_IMG + r.poster_path : null, year: (r.first_air_date||'').split('-')[0], tmdb_id: r.id, tmdb_type: 'tv' }));
    const merged = [];
    const max = Math.max(movies.length, shows.length);
    for (let i = 0; i < max; i++) { if (movies[i]) merged.push(movies[i]); if (shows[i]) merged.push(shows[i]); }

    if (!merged.length) {
      document.getElementById('favListPickerList').innerHTML = `<div class="fav-picker-empty">No results for "${esc(q)}"</div>`;
      return;
    }

    // Cache immediately so selecting one resolves everywhere
    // (list-view.html, etc.) without waiting on a separate hydrate call.
    // Full-size (w500) poster goes in the cache — that's what the list's
    // grid cards render. Never overwrite an item already hydrated from
    // the details endpoint (it also carries genres/cat).
    merged.forEach(m => { if (MSSList.cache[m.pseudoId]) return; MSSList.cache[m.pseudoId] = { id: m.pseudoId, title: m.title, poster_url: m.poster_url, tmdb_id: m.tmdb_id, tmdb_type: m.tmdb_type, year: m.year }; });

    document.getElementById('favListPickerList').innerHTML = merged.map(m => {
      const isSel = _favListPickerSelected.includes(m.pseudoId);
      const slotNum = _favListPickerSelected.indexOf(m.pseudoId);
      const rankCls = _favRankCls(slotNum);
      return `<div class="fav-picker-item ${isSel?'selected':''}" onmousedown="toggleFavListItem(this)" data-id="${m.pseudoId}">
        ${isSel ? `<div class="fav-drag-handle" title="Drag to reorder" onmousedown="event.stopPropagation()">${_favDragHandleSVG()}</div>` : ''}
        <div class="fav-picker-poster">${safeURL(m.thumb || m.poster_url) ? `<img src="${safeURL(m.thumb || m.poster_url)}" loading="lazy">` : esc((m.title[0]||'?').toUpperCase())}
          ${isSel ? `<div class="cg-rank-badge ${rankCls}">${slotNum+1}</div>` : ''}
        </div>
        <div class="fav-picker-info"><div class="fav-picker-name">${esc(m.title)}</div><div class="fav-picker-sub">${m.tmdb_type==='movie'?'Movie':'TV'}${m.year?' · '+m.year:''}</div></div>
        <div class="fav-picker-check">${isSel ? '✓' : ''}</div>
      </div>`;
    }).join('');
  } catch (e) {
    console.error('Discover search error:', e);
    document.getElementById('favListPickerList').innerHTML = `<div class="fav-picker-empty">Search failed.</div>`;
  }
}

function _favRenderPickerList() {
  const listEl = document.getElementById('favListPickerList');
  const prevScroll = listEl.scrollTop;

  const selSet = new Set(_favListPickerSelected);
  const inSel  = _favListPickerSelected.map(id => _resolveListItem(id)).filter(Boolean);
  const rest   = _favListPickerPool.filter(e => !selSet.has(e.id)).sort((a,b) => (liveScore(b)||0)-(liveScore(a)||0));
  let sorted = [...inSel, ...rest];

  if (_favPickerSearchQuery) {
    const q = _favPickerSearchQuery;
    sorted = sorted.filter(e => {
      const hay = [e.title, ...(e.genres||[]), CAT_META[e.cat]?.label].filter(Boolean).join(' ').toLowerCase();
      return hay.includes(q);
    });
  }

  if (!sorted.length) {
    listEl.innerHTML = `<div class="fav-picker-empty">No matches for "${esc(_favPickerSearchQuery)}"</div>`;
    listEl.scrollTop = 0;
    return;
  }

  listEl.innerHTML = sorted.map(e => {
    const isSel   = selSet.has(e.id);
    const slotNum = _favListPickerSelected.indexOf(e.id);
    const sc      = liveScore(e) != null ? Number(liveScore(e)).toFixed(2) : null;
    const rankCls = _favRankCls(slotNum);
    return `<div class="fav-picker-item ${isSel?'selected':''}" onmousedown="toggleFavListItem(this)" data-id="${e.id}">
      ${isSel ? `<div class="fav-drag-handle" title="Drag to reorder" onmousedown="event.stopPropagation()">${_favDragHandleSVG()}</div>` : ''}
      <div class="fav-picker-poster">${safeURL(e.poster_url) ? `<img src="${safeURL(e.poster_url)}" loading="lazy">` : esc((e.title[0]||'?').toUpperCase())}
        ${isSel ? `<div class="cg-rank-badge ${rankCls}">${slotNum+1}</div>` : ''}
      </div>
      <div class="fav-picker-info"><div class="fav-picker-name">${esc(e.title)}</div><div class="fav-picker-sub">${(CAT_META[e.cat]?.label)||''}</div></div>
      ${sc ? `<div class="fav-picker-score">${sc}</div>` : ''}
      <div class="fav-picker-check">${isSel ? '✓' : ''}</div>
    </div>`;
  }).join('');

  listEl.scrollTop = prevScroll;
}

function toggleFavListItem(el) {
  const id = el.dataset.id;
  const idx = _favListPickerSelected.indexOf(id);

  if (idx >= 0) {
    _favListPickerSelected.splice(idx, 1);
  } else {
    if (_favListPickerSelected.length >= _favListPickerMax) {
      showToast(`Max ${_favListPickerMax} items.`, 'err'); return;
    }
    _favListPickerSelected.push(id);
  }

  _favUpdateCount();
  if (_favPickerMode === 'discover') {
    _favRunDiscoverSearch(_favPickerSearchQuery);
  } else {
    _favRenderPickerList();
  }
}

/* ── Drag to reorder selected items ── */
let _favDrag = null;

document.addEventListener('pointerdown', e => {
  const handle = e.target.closest('.fav-drag-handle');
  if (!handle) return;
  const item = handle.closest('.fav-picker-item');
  if (!item) return;
  e.preventDefault();

  const list = document.getElementById('favListPickerList');
  const selectedEls = Array.from(list.querySelectorAll('.fav-picker-item.selected'));
  const startIndex = selectedEls.indexOf(item);
  if (startIndex < 0) return;

  _favDrag = {
    item, startIndex, currentIndex: startIndex,
    startY: e.clientY,
    itemHeight: item.getBoundingClientRect().height,
    selectedEls,
  };

  item.classList.add('dragging');
  item.style.position = 'relative';
  item.style.zIndex = '5';

  document.addEventListener('pointermove', _favDragMove);
  document.addEventListener('pointerup', _favDragEnd);
  document.addEventListener('pointercancel', _favDragEnd);
});

function _favDragMove(e) {
  if (!_favDrag) return;
  const d = _favDrag;
  const deltaY = e.clientY - d.startY;
  d.item.style.transform = `translateY(${deltaY}px)`;

  const shift = Math.round(deltaY / d.itemHeight);
  const newIndex = Math.min(Math.max(d.startIndex + shift, 0), d.selectedEls.length - 1);

  if (newIndex !== d.currentIndex) {
    d.selectedEls.forEach((el, i) => {
      if (el === d.item) return;
      el.style.transition = 'transform .15s ease';
      if (i > d.startIndex && i <= newIndex)      el.style.transform = `translateY(-${d.itemHeight}px)`;
      else if (i < d.startIndex && i >= newIndex) el.style.transform = `translateY(${d.itemHeight}px)`;
      else                                        el.style.transform = '';
    });
    d.currentIndex = newIndex;
  }
}

function _favDragEnd() {
  if (!_favDrag) return;
  const d = _favDrag;
  document.removeEventListener('pointermove', _favDragMove);
  document.removeEventListener('pointerup', _favDragEnd);
  document.removeEventListener('pointercancel', _favDragEnd);

  if (d.currentIndex !== d.startIndex) {
    const [movedId] = _favListPickerSelected.splice(d.startIndex, 1);
    _favListPickerSelected.splice(d.currentIndex, 0, movedId);
  }

  d.selectedEls.forEach(el => {
    el.style.transform = '';
    el.style.transition = '';
    el.style.zIndex = '';
    el.style.position = '';
    el.classList.remove('dragging');
  });

  _favDrag = null;
  _favRenderPickerList();
}

async function saveFavList() {
  try {
    const list = _listsAll.find(l => l.id === _favListPickerListId);
    if (!list) return;
    list.items = _favListPickerSelected.slice();

    if (list.ranked === true && list.sort_mode) {
      // Already decided how this list is ordered — just re-apply that
      // same order to the (possibly changed) item set automatically,
      // instead of asking again every time items are added or edited.
      _reorderListItems(list, list.sort_mode);
    }

    if (list._collab) {
      const { error } = await sb.rpc('update_list_items', { p_list_id: list.id, p_items: list.items });
      if (error) throw error;
    } else {
      await saveFavoriteList(list);
    }
    closeFavListPicker();
    renderListsPage();
    showToast('Saved!');
    if (list.ranked === true && !list.sort_mode) _openRankOrderPrompt(list.id);
  } catch(e) { showToast('Error saving.', 'err'); console.error(e); }
}

/* ── Ranked-list ordering prompt — shown right after saving a ranked
   list's items, so the rank numbers (1, 2, 3...) reflect a real,
   permanent choice instead of whatever order items happened to get
   clicked in the picker. This actually reorders list.items and saves
   it, unlike the view-only Default/Highest/Lowest sort buttons under
   each list, which never persist. ── */
function _injectRankOrderOverlay() {
  if (document.getElementById('rankOrderOverlay')) return;
  const el = document.createElement('div');
  el.id = 'rankOrderOverlay';
  el.style.cssText = 'position:fixed;inset:0;z-index:1300;background:rgba(0,0,0,0.65);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:16px;';
  el.innerHTML = `
    <div style="width:97%;max-width:420px;height:480px;max-height:85vh;display:flex;flex-direction:column;background:var(--bg-2);border:1.5px solid var(--olive-light);border-radius:var(--radius-lg);box-shadow:4px 4px 0 var(--olive);padding:1.75rem;">
      <div style="font-family:var(--serif);font-size:20px;font-weight:400;margin-bottom:.4rem;flex-shrink:0;">Order this ranked list</div>
      <div id="rankOrderSubtitle" style="font-size:12.5px;color:var(--text-3);margin-bottom:1.25rem;flex-shrink:0;"></div>
      <div id="rankOrderOptions" style="display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:0;flex:1;"></div>
    </div>`;
  el.addEventListener('click', e => { if (e.target === el) _closeRankOrderPrompt(); });
  document.body.appendChild(el);
}

const _RANK_ORDER_OPTS = [
  ['picked',    'The order I just picked them in'],
  ['highest',   'Highest rated overall'],
  ['lowest',    'Lowest rated overall'],
  ['enjoyment', 'Best Enjoyment'],
  ['story',     'Best Story & Plot'],
  ['acting',    'Best Acting'],
  ['ending',    'Best Ending & Payoff'],
  ['az',        'Title A → Z'],
  ['za',        'Title Z → A'],
];

// Reads a specific rating dimension off an entry, accounting for the
// fact that anime/cartoons use slightly different rating keys than
// movies/shows for the same concept (e.g. "voice_acting" vs "acting").
// Discover-only items with no personal entry never have sub-ratings.
function _getSubRating(entry, concept) {
  if (!entry || !entry.ratings) return null;
  const isAnimated = entry.cat === 'anime' || entry.cat === 'cartoons';
  const keyMap = {
    story: 'story',
    enjoyment: 'enjoyment',
    acting: isAnimated ? 'voice_acting' : 'acting',
    ending: 'ending',
  };
  const key = keyMap[concept];
  const val = key ? entry.ratings[key] : null;
  return typeof val === 'number' ? val : null;
}

function _openRankOrderPrompt(listId) {
  _injectRankOrderOverlay();
  const list = _listsAll.find(l => l.id === listId);
  if (!list) return;
  document.querySelector('#rankOrderSubtitle').textContent = `How should the ${ (list.items||[]).length } items be ordered?`;
  document.getElementById('rankOrderOptions').innerHTML = _RANK_ORDER_OPTS.map(([val, label]) =>
    `<button class="fav-edit-btn" style="justify-content:flex-start;padding:11px 16px;" onclick="_applyRankOrder('${listId}','${val}')">${label}</button>`
  ).join('');
  document.getElementById('rankOrderOverlay').style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function _closeRankOrderPrompt() {
  const ov = document.getElementById('rankOrderOverlay');
  if (ov) ov.style.display = 'none';
  document.body.style.overflow = '';
}

// Actually reorders list.items in place according to `mode` — shared by
// the first-time ordering prompt and by automatic re-application on
// later edits. Mutates list.items directly; caller is responsible for
// saving.
function _reorderListItems(list, mode) {
  if (mode === 'picked') return; // leave items in whatever order they're already in
  const resolved = (list.items || []).map(id => ({ id, item: _resolveListItem(id) })).filter(x => x.item);
  resolved.sort((a, b) => {
    if (mode === 'az') return (a.item.title||'').localeCompare(b.item.title||'');
    if (mode === 'za') return (b.item.title||'').localeCompare(a.item.title||'');
    if (mode === 'enjoyment' || mode === 'story' || mode === 'acting' || mode === 'ending') {
      const subA = _getSubRating(a.item, mode) ?? -Infinity;
      const subB = _getSubRating(b.item, mode) ?? -Infinity;
      return subB - subA; // best first, always high-to-low for named dimensions
    }
    const scoreA = liveScore(a.item) ?? -Infinity;
    const scoreB = liveScore(b.item) ?? -Infinity;
    return mode === 'highest' ? scoreB - scoreA : scoreA - scoreB;
  });
  // Items that failed to resolve (shouldn't normally happen) get kept,
  // appended after the sorted ones, rather than silently dropped.
  const resolvedIds = new Set(resolved.map(x => x.id));
  const unresolved = (list.items || []).filter(id => !resolvedIds.has(id));
  list.items = [...resolved.map(x => x.id), ...unresolved];
}

async function _applyRankOrder(listId, mode) {
  const list = _listsAll.find(l => l.id === listId);
  if (!list) return;
  try {
    _reorderListItems(list, mode);
    list.sort_mode = mode;
    await saveFavoriteList(list);
    _closeRankOrderPrompt();
    renderListsPage();
    showToast('Order saved!');
  } catch (err) {
    console.error('Apply rank order error:', err);
    showToast('Failed to save order.', 'err');
  }
}

function closeFavListPicker() {
  document.getElementById('favListPickerOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (document.getElementById('favListPickerOverlay')?.classList.contains('open')) closeFavListPicker();
  else if (document.getElementById('favCustomListModal')?.classList.contains('open')) closeFavCustomListModal();

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW failed:', e));
  });
}

/* ── Custom List Modal (title only, no cat/genre) ── */
var _favCustomListEditId = null;

let _favCustomListRankedValue = null;
function _favListRankedChange(val) {
  _favCustomListRankedValue = val;
  document.getElementById('favListRankedYes').checked = val === true;
  document.getElementById('favListRankedNo').checked = val === false;
}

function openFavCustomListModal(editId) {
  _favCustomListEditId = editId || null;
  var inp = document.getElementById('favCustomListInput');
  var descInp = document.getElementById('favCustomListDescInput');
  const existingList = editId ? _listsAll.find(l => l.id === editId) : null;
  inp.value = existingList?.title || '';
  descInp.value = existingList?.description || '';
  _favCustomListRankedValue = existingList?.ranked ?? null;
  document.getElementById('favListRankedYes').checked = _favCustomListRankedValue === true;
  document.getElementById('favListRankedNo').checked = _favCustomListRankedValue === false;
  _listsUpdateWordCount('favCustomListDescInput','favCustomListDescCount');
  _listsGuardWordLimit('favCustomListDescInput','favCustomListDescCount');
  document.getElementById('favCustomListCreate').disabled = !inp.value.trim();
  document.getElementById('favListCollabOpt').checked = false;
  document.getElementById('favCollabOptWrap').style.display = editId ? 'none' : '';   // new lists only; existing ones use Collaborate in the popup
  document.getElementById('favCustomListModalTitle').textContent = editId ? 'Edit List' : 'New List';
  document.getElementById('favCustomListCreate').textContent = editId ? 'Save' : 'Create List';
  document.getElementById('favCustomListModal').classList.add('open');
  document.body.style.overflow = 'hidden';
  setTimeout(() => inp.focus(), 100);
}
function closeFavCustomListModal() {
  document.getElementById('favCustomListModal').classList.remove('open');
  document.body.style.overflow = '';
  _favCustomListEditId = null;
}
async function createFavCustomList() {
  const title = document.getElementById('favCustomListInput').value.trim();
  const description = document.getElementById('favCustomListDescInput').value.trim();
  const ranked = _favCustomListRankedValue;
  if (!title) return;
  try {
    if (_favCustomListEditId) {
      const list = _listsAll.find(l => l.id === _favCustomListEditId);
      if (list) {
        list.title = title;
        list.description = description;
        list.ranked = ranked;
        await saveFavoriteList(list);
        closeFavCustomListModal();
        renderListsPage();
        showToast('List updated!');
      }
    } else {
      const wantsCollab = document.getElementById('favListCollabOpt').checked;
      const newList = await saveFavoriteList({ cat: 'custom', genre: '', title, description, items: [], ranked });
      _listsAll.push(newList);
      closeFavCustomListModal();
      renderListsPage();
      showToast(`"${title}" created!`);
      // Collaborate first (if picked), then add titles
      setTimeout(() => wantsCollab
        ? openCollabPicker(newList.id, () => openFavListPicker(newList.id))
        : openFavListPicker(newList.id), 300);
    }
  } catch(e) { showToast(isRateLimitError(e) ? RATE_LIMIT_MESSAGE : 'Error saving list.', 'err'); console.error(e); }
}
</script>
