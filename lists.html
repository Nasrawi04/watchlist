}

function _favPickerSearch(q) {
  _favPickerSearchQuery = q.trim().toLowerCase();
  if (_favPickerMode === 'discover') {
    clearTimeout(_favDiscoverSearchTimer);
    if (!_favPickerSearchQuery) {
      document.getElementById('favListPickerList').innerHTML = `<div class="fav-picker-empty">Search for a movie or show to add it — no personal rating required.</div>`;
      return;
    }
    document.getElementById('favListPickerList').innerHTML = `<div class="fav-picker-empty">Searching…</div>`;
    _favDiscoverSearchTimer = setTimeout(() => _favRunDiscoverSearch(_favPickerSearchQuery), 350);
  } else {
    _favRenderPickerList();
  }
}
function _favPickerResetSearch() {
  _favPickerSearchQuery = '';
  const inp = document.getElementById('favListPickerSearch');
  if (inp) inp.value = '';
}

async function _favRunDiscoverSearch(q) {
  try {
    const [movRes, tvRes] = await Promise.all([
      fetch(`${TMDB_BASE}/search/movie?api_key=${TMDB_KEY}&language=en-US&query=${encodeURIComponent(q)}`).then(r => r.json()),
      fetch(`${TMDB_BASE}/search/tv?api_key=${TMDB_KEY}&language=en-US&query=${encodeURIComponent(q)}`).then(r => r.json()),
    ]);
    const movies = (movRes.results || []).slice(0, 8).map(r => ({ pseudoId: `tmdb:movie:${r.id}`, title: r.title, poster_url: r.poster_path ? TMDB_IMG + r.poster_path : null, year: (r.release_date||'').split('-')[0], tmdb_id: r.id, tmdb_type: 'movie' }));
    const shows  = (tvRes.results || []).slice(0, 8).map(r => ({ pseudoId: `tmdb:tv:${r.id}`, title: r.name, poster_url: r.poster_path ? TMDB_IMG + r.poster_path : null, year: (r.first_air_date||'').split('-')[0], tmdb_id: r.id, tmdb_type: 'tv' }));
    const merged = [];
    const max = Math.max(movies.length, shows.length);
    for (let i = 0; i < max; i++) { if (movies[i]) merged.push(movies[i]); if (shows[i]) merged.push(shows[i]); }

    if (!merged.length) {
      document.getElementById('favListPickerList').innerHTML = `<div class="fav-picker-empty">No results for "${esc(q)}"</div>`;
      return;
    }

    // Cache immediately so selecting one resolves everywhere (favCard,
    // list-view.html, etc.) without waiting on a separate hydrate call.
    merged.forEach(m => { _tmdbItemCache[m.pseudoId] = { id: m.pseudoId, title: m.title, poster_url: m.poster_url, tmdb_id: m.tmdb_id, tmdb_type: m.tmdb_type, year: m.year }; });

    document.getElementById('favListPickerList').innerHTML = merged.map(m => {
      const isSel = _favListPickerSelected.includes(m.pseudoId);
      const slotNum = _favListPickerSelected.indexOf(m.pseudoId);
      const rankCls = _favRankCls(slotNum);
      return `<div class="fav-picker-item ${isSel?'selected':''}" onmousedown="toggleFavListItem(this)" data-id="${m.pseudoId}">
        ${isSel ? `<div class="fav-drag-handle" title="Drag to reorder" onmousedown="event.stopPropagation()">${_favDragHandleSVG()}</div>` : ''}
        <div class="fav-picker-poster">${m.poster_url ? `<img src="${m.poster_url}" loading="lazy">` : esc((m.title[0]||'?').toUpperCase())}
          ${isSel ? `<div class="cg-rank-badge ${rankCls}">${slotNum+1}</div>` : ''}
        </div>
        <div class="fav-picker-info"><div class="fav-picker-name">${esc(m.title)}</div><div class="fav-picker-sub">${m.tmdb_type==='movie'?'Movie':'TV'}${m.year?' · '+m.year:''}</div></div>
        <div class="fav-picker-check">${isSel ? '✓' : ''}</div>
      </div>`;
    }).join('');
  } catch (e) {
    console.error('Discover search error:', e);
    document.getElementById('favListPickerList').innerHTML = `<div class="fav-picker-empty">Search failed.</div>`;
  }
}

function _favRenderPickerList() {
  const listEl = document.getElementById('favListPickerList');
  const prevScroll = listEl.scrollTop;

  const selSet = new Set(_favListPickerSelected);
  const inSel  = _favListPickerSelected.map(id => _resolveListItem(id)).filter(Boolean);
  const rest   = _favListPickerPool.filter(e => !selSet.has(e.id)).sort((a,b) => (liveScore(b)||0)-(liveScore(a)||0));
  let sorted = [...inSel, ...rest];

  if (_favPickerSearchQuery) {
    const q = _favPickerSearchQuery;
    sorted = sorted.filter(e => {
      const hay = [e.title, ...(e.genres||[]), CAT_META[e.cat]?.label].filter(Boolean).join(' ').toLowerCase();
      return hay.includes(q);
    });
  }

  if (!sorted.length) {
    listEl.innerHTML = `<div class="fav-picker-empty">No matches for "${esc(_favPickerSearchQuery)}"</div>`;
    listEl.scrollTop = 0;
    return;
  }

  listEl.innerHTML = sorted.map(e => {
    const isSel   = selSet.has(e.id);
    const slotNum = _favListPickerSelected.indexOf(e.id);
    const sc      = liveScore(e) != null ? Number(liveScore(e)).toFixed(2) : null;
    const rankCls = _favRankCls(slotNum);
    return `<div class="fav-picker-item ${isSel?'selected':''}" onmousedown="toggleFavListItem(this)" data-id="${e.id}">
      ${isSel ? `<div class="fav-drag-handle" title="Drag to reorder" onmousedown="event.stopPropagation()">${_favDragHandleSVG()}</div>` : ''}
      <div class="fav-picker-poster">${e.poster_url ? `<img src="${e.poster_url}" loading="lazy">` : esc((e.title[0]||'?').toUpperCase())}
        ${isSel ? `<div class="cg-rank-badge ${rankCls}">${slotNum+1}</div>` : ''}
      </div>
      <div class="fav-picker-info"><div class="fav-picker-name">${esc(e.title)}</div><div class="fav-picker-sub">${(CAT_META[e.cat]?.label)||''}</div></div>
      ${sc ? `<div class="fav-picker-score">${sc}</div>` : ''}
      <div class="fav-picker-check">${isSel ? '✓' : ''}</div>
    </div>`;
  }).join('');

  listEl.scrollTop = prevScroll;
}

function toggleFavListItem(el) {
  const id = el.dataset.id;
  const idx = _favListPickerSelected.indexOf(id);

  if (idx >= 0) {
    _favListPickerSelected.splice(idx, 1);
  } else {
    if (_favListPickerSelected.length >= _favListPickerMax) {
      showToast(`Max ${_favListPickerMax} items.`, 'err'); return;
    }
    _favListPickerSelected.push(id);
  }

  _favUpdateCount();
  if (_favPickerMode === 'discover') {
    _favRunDiscoverSearch(_favPickerSearchQuery);
  } else {
    _favRenderPickerList();
  }
}

/* ── Drag to reorder selected items ── */
let _favDrag = null;

document.addEventListener('pointerdown', e => {
  const handle = e.target.closest('.fav-drag-handle');
  if (!handle) return;
  const item = handle.closest('.fav-picker-item');
  if (!item) return;
  e.preventDefault();

  const list = document.getElementById('favListPickerList');
  const selectedEls = Array.from(list.querySelectorAll('.fav-picker-item.selected'));
  const startIndex = selectedEls.indexOf(item);
  if (startIndex < 0) return;

  _favDrag = {
    item, startIndex, currentIndex: startIndex,
    startY: e.clientY,
    itemHeight: item.getBoundingClientRect().height,
    selectedEls,
  };

  item.classList.add('dragging');
  item.style.position = 'relative';
  item.style.zIndex = '5';

  document.addEventListener('pointermove', _favDragMove);
  document.addEventListener('pointerup', _favDragEnd);
  document.addEventListener('pointercancel', _favDragEnd);
});

function _favDragMove(e) {
  if (!_favDrag) return;
  const d = _favDrag;
  const deltaY = e.clientY - d.startY;
  d.item.style.transform = `translateY(${deltaY}px)`;

  const shift = Math.round(deltaY / d.itemHeight);
  const newIndex = Math.min(Math.max(d.startIndex + shift, 0), d.selectedEls.length - 1);

  if (newIndex !== d.currentIndex) {
    d.selectedEls.forEach((el, i) => {
      if (el === d.item) return;
      el.style.transition = 'transform .15s ease';
      if (i > d.startIndex && i <= newIndex)      el.style.transform = `translateY(-${d.itemHeight}px)`;
      else if (i < d.startIndex && i >= newIndex) el.style.transform = `translateY(${d.itemHeight}px)`;
      else                                        el.style.transform = '';
    });
    d.currentIndex = newIndex;
  }
}

function _favDragEnd() {
  if (!_favDrag) return;
  const d = _favDrag;
  document.removeEventListener('pointermove', _favDragMove);
  document.removeEventListener('pointerup', _favDragEnd);
  document.removeEventListener('pointercancel', _favDragEnd);

  if (d.currentIndex !== d.startIndex) {
    const [movedId] = _favListPickerSelected.splice(d.startIndex, 1);
    _favListPickerSelected.splice(d.currentIndex, 0, movedId);
  }

  d.selectedEls.forEach(el => {
    el.style.transform = '';
    el.style.transition = '';
    el.style.zIndex = '';
    el.style.position = '';
    el.classList.remove('dragging');
  });

  _favDrag = null;
  _favRenderPickerList();
}

/* ── Drag to reorder lists themselves (whole page order, persisted) ── */
let _listsDrag = null;
let _listsAutoScrollRAF = null;

document.addEventListener('pointerdown', e => {
  const handle = e.target.closest('.lists-drag-handle');
  if (!handle) return;
  const item = handle.closest('.lists-drag-item');
  if (!item) return;
  e.preventDefault();

  const container = document.getElementById('listsPageContent');
  const items = Array.from(container.querySelectorAll('.lists-drag-item'));
  const startIndex = items.indexOf(item);
  if (startIndex < 0) return;

  _listsDrag = {
    item, startIndex, currentIndex: startIndex,
    startY: e.clientY,
    startScrollY: window.scrollY,
    lastClientY: e.clientY,
    itemHeight: item.getBoundingClientRect().height,
    items,
  };

  item.classList.add('dragging');
  item.style.position = 'relative';
  item.style.zIndex = '5';

  document.addEventListener('pointermove', _listsDragMove);
  document.addEventListener('pointerup', _listsDragEnd);
  document.addEventListener('pointercancel', _listsDragEnd);
  _listsAutoScrollTick();
});

function _listsDragMove(e) {
  if (!_listsDrag) return;
  _listsDrag.lastClientY = e.clientY;
  _listsUpdateDragPosition();
}

function _listsUpdateDragPosition() {
  const d = _listsDrag;
  if (!d) return;
  const scrollDelta = window.scrollY - d.startScrollY;
  const rawDeltaY = (d.lastClientY - d.startY) + scrollDelta;

  // Clamp the dragged item's visual position to the list's own bounds —
  // it can never move further than swapping with the first or last item,
  // so it can't visually float up past the list into the stat boxes.
  const minDeltaY = -(d.startIndex * d.itemHeight);
  const maxDeltaY = (d.items.length - 1 - d.startIndex) * d.itemHeight;
  const deltaY = Math.min(Math.max(rawDeltaY, minDeltaY), maxDeltaY);

  d.item.style.transform = `translateY(${deltaY}px) scale(0.98)`;

  const shift = Math.round(deltaY / d.itemHeight);
  const newIndex = Math.min(Math.max(d.startIndex + shift, 0), d.items.length - 1);

  if (newIndex !== d.currentIndex) {
    d.items.forEach((el, i) => {
      if (el === d.item) return;
      el.style.transition = 'transform .15s ease';
      if (i > d.startIndex && i <= newIndex)      el.style.transform = `translateY(-${d.itemHeight}px)`;
      else if (i < d.startIndex && i >= newIndex) el.style.transform = `translateY(${d.itemHeight}px)`;
      else                                        el.style.transform = '';
    });
    d.currentIndex = newIndex;
  }
}

function _listsAutoScrollTick() {
  if (!_listsDrag) { _listsAutoScrollRAF = null; return; }
  const EDGE = 90, MAX_SPEED = 14;
  const vh = window.innerHeight;
  const y = _listsDrag.lastClientY;
  let speed = 0;
  if (y < EDGE) speed = -MAX_SPEED * (1 - y / EDGE);
  else if (y > vh - EDGE) speed = MAX_SPEED * (1 - (vh - y) / EDGE);
  if (speed) {
    window.scrollBy(0, speed);
    _listsUpdateDragPosition();
  }
  _listsAutoScrollRAF = requestAnimationFrame(_listsAutoScrollTick);
}

async function _listsDragEnd() {
  if (!_listsDrag) return;
  const d = _listsDrag;
  document.removeEventListener('pointermove', _listsDragMove);
  document.removeEventListener('pointerup', _listsDragEnd);
  document.removeEventListener('pointercancel', _listsDragEnd);
  if (_listsAutoScrollRAF) { cancelAnimationFrame(_listsAutoScrollRAF); _listsAutoScrollRAF = null; }

  const moved = d.currentIndex !== d.startIndex;

  d.items.forEach(el => {
    el.style.transform = '';
    el.style.transition = '';
    el.style.zIndex = '';
    el.style.position = '';
    el.classList.remove('dragging');
  });

  if (moved) {
    const orderedIds = d.items.map(el => el.dataset.listId);
    const [movedId] = orderedIds.splice(d.startIndex, 1);
    orderedIds.splice(d.currentIndex, 0, movedId);

    try {
      await Promise.all(orderedIds.map((id, i) => {
        const list = _listsAll.find(l => l.id === id);
        if (list) list.sort_order = i;
        return sb.from('favorite_lists').update({ sort_order: i }).eq('id', id).eq('user_id', _listsUser.id);
      }));
      renderListsPage();
    } catch (err) {
      console.error('reorder save error:', err);
      showToast('Error saving list order.', 'err');
      renderListsPage();
    }
  }

  _listsDrag = null;
}

async function saveFavList() {
  try {
    const list = _listsAll.find(l => l.id === _favListPickerListId);
    if (!list) return;
    list.items = _favListPickerSelected.slice();

    if (list.ranked === true && list.sort_mode) {
      // Already decided how this list is ordered — just re-apply that
      // same order to the (possibly changed) item set automatically,
      // instead of asking again every time items are added or edited.
      _reorderListItems(list, list.sort_mode);
    }

    await saveFavoriteList(list);
    closeFavListPicker();
    renderListsPage();
    showToast('Saved!');
    if (list.ranked === true && !list.sort_mode) _openRankOrderPrompt(list.id);
  } catch(e) { showToast('Error saving.', 'err'); console.error(e); }
}

/* ── Ranked-list ordering prompt — shown right after saving a ranked
   list's items, so the rank numbers (1, 2, 3...) reflect a real,
   permanent choice instead of whatever order items happened to get
   clicked in the picker. This actually reorders list.items and saves
   it, unlike the view-only Default/Highest/Lowest sort buttons under
   each list, which never persist. ── */
function _injectRankOrderOverlay() {
  if (document.getElementById('rankOrderOverlay')) return;
  const el = document.createElement('div');
  el.id = 'rankOrderOverlay';
  el.style.cssText = 'position:fixed;inset:0;z-index:1300;background:rgba(0,0,0,0.65);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:16px;';
  el.innerHTML = `
    <div style="width:97%;max-width:420px;height:480px;max-height:85vh;display:flex;flex-direction:column;background:var(--bg-2);border:1.5px solid var(--olive-light);border-radius:var(--radius-lg);box-shadow:4px 4px 0 var(--olive);padding:1.75rem;">
      <div style="font-family:var(--serif);font-size:20px;font-weight:400;margin-bottom:.4rem;flex-shrink:0;">Order this ranked list</div>
      <div id="rankOrderSubtitle" style="font-size:12.5px;color:var(--text-3);margin-bottom:1.25rem;flex-shrink:0;"></div>
      <div id="rankOrderOptions" style="display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:0;flex:1;"></div>
    </div>`;
  el.addEventListener('click', e => { if (e.target === el) _closeRankOrderPrompt(); });
  document.body.appendChild(el);
}

const _RANK_ORDER_OPTS = [
  ['picked',    'The order I just picked them in'],
  ['highest',   'Highest rated overall'],
  ['lowest',    'Lowest rated overall'],
  ['enjoyment', 'Best Enjoyment'],
  ['story',     'Best Story & Plot'],
  ['acting',    'Best Acting'],
  ['ending',    'Best Ending & Payoff'],
  ['az',        'Title A → Z'],
  ['za',        'Title Z → A'],
];

// Reads a specific rating dimension off an entry, accounting for the
// fact that anime/cartoons use slightly different rating keys than
// movies/shows for the same concept (e.g. "voice_acting" vs "acting").
// Discover-only items with no personal entry never have sub-ratings.
function _getSubRating(entry, concept) {
  if (!entry || !entry.ratings) return null;
  const isAnimated = entry.cat === 'anime' || entry.cat === 'cartoons';
  const keyMap = {
    story: 'story',
    enjoyment: 'enjoyment',
    acting: isAnimated ? 'voice_acting' : 'acting',
    ending: 'ending',
  };
  const key = keyMap[concept];
  const val = key ? entry.ratings[key] : null;
  return typeof val === 'number' ? val : null;
}

function _openRankOrderPrompt(listId) {
  _injectRankOrderOverlay();
  const list = _listsAll.find(l => l.id === listId);
  if (!list) return;
  document.querySelector('#rankOrderSubtitle').textContent = `How should the ${ (list.items||[]).length } items be ordered?`;
  document.getElementById('rankOrderOptions').innerHTML = _RANK_ORDER_OPTS.map(([val, label]) =>
    `<button class="fav-edit-btn" style="justify-content:flex-start;padding:11px 16px;" onclick="_applyRankOrder('${listId}','${val}')">${label}</button>`
  ).join('');
  document.getElementById('rankOrderOverlay').style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function _closeRankOrderPrompt() {
  const ov = document.getElementById('rankOrderOverlay');
  if (ov) ov.style.display = 'none';
  document.body.style.overflow = '';
}

// Actually reorders list.items in place according to `mode` — shared by
// the first-time ordering prompt and by automatic re-application on
// later edits. Mutates list.items directly; caller is responsible for
// saving.
function _reorderListItems(list, mode) {
  if (mode === 'picked') return; // leave items in whatever order they're already in
  const resolved = (list.items || []).map(id => ({ id, item: _resolveListItem(id) })).filter(x => x.item);
  resolved.sort((a, b) => {
    if (mode === 'az') return (a.item.title||'').localeCompare(b.item.title||'');
    if (mode === 'za') return (b.item.title||'').localeCompare(a.item.title||'');
    if (mode === 'enjoyment' || mode === 'story' || mode === 'acting' || mode === 'ending') {
      const subA = _getSubRating(a.item, mode) ?? -Infinity;
      const subB = _getSubRating(b.item, mode) ?? -Infinity;
      return subB - subA; // best first, always high-to-low for named dimensions
    }
    const scoreA = liveScore(a.item) ?? -Infinity;
    const scoreB = liveScore(b.item) ?? -Infinity;
    return mode === 'highest' ? scoreB - scoreA : scoreA - scoreB;
  });
  // Items that failed to resolve (shouldn't normally happen) get kept,
  // appended after the sorted ones, rather than silently dropped.
  const resolvedIds = new Set(resolved.map(x => x.id));
  const unresolved = (list.items || []).filter(id => !resolvedIds.has(id));
  list.items = [...resolved.map(x => x.id), ...unresolved];
}

async function _applyRankOrder(listId, mode) {
  const list = _listsAll.find(l => l.id === listId);
  if (!list) return;
  try {
    _reorderListItems(list, mode);
    list.sort_mode = mode;
    await saveFavoriteList(list);
    _closeRankOrderPrompt();
    renderListsPage();
    showToast('Order saved!');
  } catch (err) {
    console.error('Apply rank order error:', err);
    showToast('Failed to save order.', 'err');
  }
}

  document.getElementById('favListPickerOverlay').classList.remove('open');

/* ── Custom List Modal (title only, no cat/genre) ── */
var _favCustomListEditId = null;

let _favCustomListRankedValue = null;
function _favListRankedChange(val) {
  _favCustomListRankedValue = val;
  document.getElementById('favListRankedYes').checked = val === true;
  document.getElementById('favListRankedNo').checked = val === false;
}

function openFavCustomListModal(editId) {
  _favCustomListEditId = editId || null;
  var inp = document.getElementById('favCustomListInput');
  var descInp = document.getElementById('favCustomListDescInput');
  const existingList = editId ? _listsAll.find(l => l.id === editId) : null;
  inp.value = existingList?.title || '';
  descInp.value = existingList?.description || '';
  _favCustomListRankedValue = existingList?.ranked ?? null;
  document.getElementById('favListRankedYes').checked = _favCustomListRankedValue === true;
  document.getElementById('favListRankedNo').checked = _favCustomListRankedValue === false;
  _listsUpdateWordCount('favCustomListDescInput','favCustomListDescCount');
  _listsGuardWordLimit('favCustomListDescInput','favCustomListDescCount');
  document.getElementById('favCustomListCreate').disabled = !inp.value.trim();
  document.getElementById('favCustomListModalTitle').textContent = editId ? 'Edit List' : 'New List';
  document.getElementById('favCustomListCreate').textContent = editId ? 'Save' : 'Create List';
  document.getElementById('favCustomListModal').classList.add('open');
  document.body.style.overflow = 'hidden';
  setTimeout(() => inp.focus(), 100);
}
function closeFavCustomListModal() {
  document.getElementById('favCustomListModal').classList.remove('open');
  document.body.style.overflow = '';
  _favCustomListEditId = null;
}
async function createFavCustomList() {
  const title = document.getElementById('favCustomListInput').value.trim();
  const description = document.getElementById('favCustomListDescInput').value.trim();
  const ranked = _favCustomListRankedValue;
  if (!title) return;
  try {
    if (_favCustomListEditId) {
      const list = _listsAll.find(l => l.id === _favCustomListEditId);
      if (list) {
        list.title = title;
        list.description = description;
        list.ranked = ranked;
        await saveFavoriteList(list);
        closeFavCustomListModal();
        renderListsPage();
        showToast('List updated!');
      }
    } else {
      const newList = await saveFavoriteList({ cat: 'custom', genre: '', title, description, items: [], ranked });
      _listsAll.push(newList);
      closeFavCustomListModal();
      renderListsPage();
      showToast(`"${title}" created!`);
      setTimeout(() => openFavListPicker(newList.id), 300);
    }
  } catch(e) { showToast('Error saving list.', 'err'); console.error(e); }
}
