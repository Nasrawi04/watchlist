<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lists — MyScreenScore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E5C26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MyScreenScore">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
<style>
/* ── Lists page (mirrors favorites.html's list styling) ── */
.fav-page-list-header {
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:1rem;
}
.fav-page-list-title {
  font-family:var(--serif);font-size:clamp(17px, 3.4vw, 20px);font-weight:300;color:var(--text);
}
.fav-page-list-count {
  font-size:11px;color:var(--text-3);letter-spacing:.5px;margin-top:2px;
}
.fav-page-section {
  margin-bottom:2.5rem;
}
.fav-page-section-hd {
  font-size:11px;letter-spacing:2.5px;text-transform:uppercase;
  color:var(--olive-light);margin:2rem 0 1.25rem;
  display:flex;align-items:center;gap:12px;
}
.fav-page-section-hd::after{content:'';flex:1;height:0.5px;background:var(--border);}

/* ── Personal / Social toggle ── */
.pn-toggle { display:flex; gap:8px; margin-bottom:1.5rem; }
.pn-toggle-btn {
  padding:8px 20px; border-radius:999px; font-size:13.5px; font-weight:600;
  background:var(--bg-3); border:0.5px solid var(--border); color:var(--text-3); cursor:pointer;
  transition:all .15s;
}
.pn-toggle-btn:hover { border-color:var(--border-olive); color:var(--text); }
.pn-toggle-btn.active { background:var(--olive-faint); border-color:var(--border-olive); color:var(--olive-light); }

/* ── Social list rows ── */
.social-list-rows { display:flex; flex-direction:column; gap:2px; }
.social-list-row { background:var(--card); border:0.5px solid var(--border); border-radius:var(--radius-lg); padding:1.1rem 1.25rem; transition:border-color .15s; cursor:pointer; margin-bottom:10px; }
.social-list-row:hover { border-color:var(--border-olive); }
.social-list-owner { display:flex; align-items:center; gap:8px; margin-bottom:.75rem; }
.social-list-avatar {
  width:26px; height:26px; border-radius:50%; overflow:hidden; flex-shrink:0;
  background:var(--olive-faint); color:var(--olive-light); font-family:var(--serif); font-size:12px;
  display:flex; align-items:center; justify-content:center;
}
.social-list-avatar img { width:100%; height:100%; object-fit:cover; }
.social-list-username { font-size:12.5px; color:var(--text-3); }
.social-list-title { font-family:var(--serif); font-size:19px; font-weight:400; margin-bottom:4px; }
.social-list-desc { font-size:12.5px; color:var(--text-2); line-height:1.5; margin-bottom:.75rem; }
.social-list-count { font-size:11.5px; color:var(--text-3); margin-bottom:.9rem; }
.social-list-posters { display:flex; gap:6px; margin-bottom:1rem; }
.social-list-poster-thumb { width:44px; height:64px; border-radius:5px; overflow:hidden; background:var(--bg-3); flex-shrink:0; }
.social-list-poster-thumb img { width:100%; height:100%; object-fit:cover; }
.social-list-footer { display:flex; align-items:center; justify-content:space-between; gap:10px; }
.social-list-reactions { display:flex; gap:12px; }
.social-list-react-btn {
  display:inline-flex; align-items:center; gap:5px; background:none; border:none; cursor:pointer;
  color:var(--text-3); font-size:12px; font-weight:500; transition:color .15s;
}
.social-list-react-btn:hover { color:var(--text); }
.social-list-react-btn.active-like { color:var(--olive-light); }
.social-list-react-btn.active-dislike { color:#c0685a; }
.social-list-add-btn {
  font-size:11.5px; font-weight:600; padding:6px 14px; border-radius:999px;
  background:var(--olive-faint); border:0.5px solid var(--border-olive); color:var(--olive-light);
  cursor:pointer; transition:all .15s; white-space:nowrap;
}
.social-list-add-btn:hover { background:var(--olive-light); color:var(--bg); }
.social-list-add-btn:disabled { opacity:.5; cursor:default; }
.social-list-row { position:relative; }
.dt-heart-pop {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) scale(0.4);
  font-size:56px; color:var(--olive-light); text-shadow:0 2px 14px rgba(0,0,0,.35);
  pointer-events:none; opacity:0; animation:dtHeartPop .7s ease forwards; z-index:5;
}
@keyframes dtHeartPop {
  0%   { opacity:0; transform:translate(-50%,-50%) scale(0.4); }
  25%  { opacity:1; transform:translate(-50%,-50%) scale(1.15); }
  40%  { transform:translate(-50%,-50%) scale(0.95); }
  100% { opacity:0; transform:translate(-50%,-50%) scale(1); }
}

/* Picker */
#favListPickerOverlay {
  position:fixed;inset:0;z-index:1200;background:rgba(0,0,0,0.65);
  backdrop-filter:blur(10px);display:flex;align-items:center;
  justify-content:center;padding:16px;box-sizing:border-box;
  opacity:0;pointer-events:none;transition:opacity .22s;
}
#favListPickerOverlay.open{opacity:1;pointer-events:auto;}
#favListPickerSheet {
  width:97%;max-width:540px;background:var(--bg-2);
  border:1.5px solid var(--olive-light);border-radius:var(--radius-lg);
  box-shadow:4px 4px 0 var(--olive);display:flex;flex-direction:column;
  max-height:85dvh;transform:translateY(16px);
  transition:transform .26s cubic-bezier(.4,0,.2,1);
}
#favListPickerOverlay.open #favListPickerSheet{transform:translateY(0);}

@media(max-width:600px){
  .fav-h-grid .q-card{flex:0 0 120px;min-width:120px;}
  .fav-h-nav{display:none;}
}
@media(max-width:400px){
  .fav-h-grid .q-card{flex:0 0 105px;min-width:105px;}
}

/* ── Custom List Modal ── */
#favCustomListModal {
  position:fixed;inset:0;z-index:1200;background:rgba(0,0,0,0.72);
  backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;
  padding:16px;box-sizing:border-box;opacity:0;pointer-events:none;transition:opacity .2s;
}
#favCustomListModal.open { opacity:1;pointer-events:auto; }
#favCustomListCard {
  background:var(--bg-2);border:1.5px solid var(--olive-light);
  box-shadow:4px 4px 0 var(--olive);border-radius:var(--radius-lg);
  width:97%;max-width:420px;padding:24px 24px 20px;box-sizing:border-box;
  transform:translateY(16px);transition:transform .25s cubic-bezier(.4,0,.2,1);
}
#favCustomListModal.open #favCustomListCard { transform:translateY(0); }

.lists-page-header-right { display:flex; flex-direction:row; align-items:center; gap:8px; flex-wrap:wrap; }
@media(max-width:520px){
  .lists-page-header-right { width:100%; }
  .lists-page-header-right .btn-add-entry { flex:1; font-size:clamp(11px,3vw,13px); padding:10px 12px; }
}

.list-desc-field {
  width:100%;box-sizing:border-box;padding:10px 14px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:var(--bg-3);color:var(--text);
  font-family:var(--sans);font-size:14px;outline:none;resize:vertical;min-height:56px;
  transition:border-color .15s;
}
.list-desc-field:focus{border-color:var(--olive-light);}
.list-desc-count { font-size:10.5px; color:var(--text-3); text-align:right; margin-top:4px; }
.list-desc-count.over { color:#c0564a; }
.fav-page-list-desc {
  font-size:12.5px; color:var(--text-2); line-height:1.5; margin-top:4px; max-width:520px;
}
.lists-drag-item {
  position:relative; padding-left:30px;
}
.lists-drag-handle {
  position:absolute; left:0; top:0; width:26px; height:38px;
  display:flex; align-items:center; justify-content:center;
  color:var(--text-3); cursor:grab; touch-action:none; user-select:none;
  transition:color .12s;
}
.lists-drag-handle:hover { color:var(--olive-light); }
.lists-drag-handle:active { cursor:grabbing; }
.lists-drag-item.dragging {
  background:var(--card-2); box-shadow:0 14px 32px rgba(0,0,0,0.35);
  border-radius:var(--radius-lg); border:1px solid var(--border-olive);
  opacity:0.94; transform-origin:center; cursor:grabbing;
  position:relative; z-index:50;
}
.lists-drag-item:not(.dragging) { transition:transform .15s ease; }
@media(max-width:520px){
  .lists-drag-item { padding-left:26px; }
  .lists-drag-handle { width:22px; height:34px; }
}
.list-item-sort-bar { display:flex; gap:6px; flex-wrap:wrap; }
.lists-order-sort-bar { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:1.25rem; }
</style>
</head>
<body>
<div class="page-wrap">

  <!-- Header -->
  <div class="cat-page-header fade-up">
    <div class="cat-page-header-left">
      <h1 class="cat-page-title">Lists</h1>
      <div class="cat-page-sub" id="listsPageSub"></div>
    </div>
    <div class="cat-page-header-right lists-page-header-right">
      <button class="btn-add-entry" id="listsCustomBtn" onclick="openFavCustomListModal()">+ New List</button>
    </div>
  </div>

  <!-- Personal / Social toggle -->
  <div class="pn-toggle fade-up" id="listsModeToggle">
    <button class="pn-toggle-btn active" data-mode="personal" onclick="setListsMode('personal')">Personal</button>
    <button class="pn-toggle-btn" data-mode="social" onclick="setListsMode('social')">Social</button>
  </div>

  <!-- Stat boxes -->
  <div class="page-stats fade-up fade-up-1" id="listsPageStats"></div>

  <!-- Sort lists by -->
  <div class="lists-order-sort-bar fade-up fade-up-1" id="listsOrderSortBar" style="display:none;">
    <button class="sort-btn active" data-sort="default" onclick="setListsOrder('default')">Default</button>
    <button class="sort-btn" data-sort="az" onclick="setListsOrder('az')">A → Z</button>
    <button class="sort-btn" data-sort="za" onclick="setListsOrder('za')">Z → A</button>
  </div>

  <!-- Social sort by -->
  <div class="lists-order-sort-bar fade-up fade-up-1" id="listsSocialSortBar" style="display:none;">
    <button class="sort-btn active" data-sort="popular" onclick="setSocialListsSort('popular')">Popular</button>
    <button class="sort-btn" data-sort="latest" onclick="setSocialListsSort('latest')">Latest</button>
  </div>

  <!-- Main content -->
  <div id="listsPageContent" class="fade-up fade-up-2">
    <div class="page-loading"><div class="spinner"></div></div>
  </div>

</div>

<!-- Custom List Modal -->
<div id="favCustomListModal" onclick="if(event.target===this)closeFavCustomListModal()">
  <div id="favCustomListCard">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
      <div style="font-family:var(--serif);font-size:20px;font-weight:300;color:var(--text);" id="favCustomListModalTitle">New List</div>
      <button onclick="closeFavCustomListModal()" style="background:none;border:none;color:var(--text-3);cursor:pointer;font-size:20px;line-height:1;">✕</button>
    </div>
    <div style="font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--olive-light);margin-bottom:8px;">List Title</div>
    <input id="favCustomListInput" type="text" maxlength="60" placeholder="e.g. Comfort Shows, Movies to Watch…"
      style="width:100%;box-sizing:border-box;padding:10px 14px;border-radius:var(--radius-sm);
             border:1px solid var(--border);background:var(--bg-3);color:var(--text);
             font-family:var(--sans);font-size:16px;outline:none;margin-bottom:18px;
             transition:border-color .15s;" onfocus="this.style.borderColor='var(--olive-light)'" onblur="this.style.borderColor='var(--border)'"
      oninput="document.getElementById('favCustomListCreate').disabled=!this.value.trim()"
      onkeydown="if(event.key==='Enter'&&event.target===this)document.getElementById('favCustomListCreate').click()">
    <div style="font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--olive-light);margin-bottom:8px;">Description <span style="color:var(--text-3);font-size:10px;font-weight:400;letter-spacing:0;text-transform:none;">(optional, max 50 words)</span></div>
    <textarea id="favCustomListDescInput" class="list-desc-field" maxlength="500" placeholder="What's this list about?" oninput="_listsUpdateWordCount('favCustomListDescInput','favCustomListDescCount')" style="margin-bottom:4px;"></textarea>
    <div class="list-desc-count" id="favCustomListDescCount" style="margin-bottom:14px;">0 / 50 words</div>
    <div style="display:flex;gap:10px;">
      <button onclick="closeFavCustomListModal()" style="flex:1;padding:10px;border-radius:var(--radius-sm);background:var(--bg-3);color:var(--text-2);border:0.5px solid var(--border);font-family:var(--sans);font-size:14px;cursor:pointer;">Cancel</button>
      <button id="favCustomListCreate" onclick="createFavCustomList()" disabled
        style="flex:2;padding:10px;border-radius:var(--radius-sm);background:var(--olive);color:#fff;border:none;font-family:var(--sans);font-size:14px;font-weight:600;cursor:pointer;">Create List</button>
    </div>
  </div>
</div>

<!-- List Picker Overlay -->
<div id="favListPickerOverlay" onclick="if(event.target===this)closeFavListPicker()">
  <div id="favListPickerSheet">
    <div class="fav-picker-hd">
      <div>
        <span class="fav-picker-title" id="favListPickerTitle">Edit List</span>
        <span class="fav-picker-count" id="favListPickerCount"></span>
      </div>
      <button onclick="closeFavListPicker()" class="fav-picker-close">✕</button>
    </div>
    <div class="fav-picker-search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="favListPickerSearch" class="fav-picker-search-input" placeholder="Search…" autocomplete="off" oninput="_favPickerSearch(this.value)">
    </div>
    <div class="fav-picker-list" id="favListPickerList"></div>
    <div class="fav-picker-footer">
      <button class="fav-picker-cancel" onclick="closeFavListPicker()">Cancel</button>
      <button class="fav-picker-save" id="favListPickerSave" onclick="saveFavList()">Save</button>
    </div>
  </div>
</div>

<!-- Popup injected dynamically -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/nav.js"></script>
<script>
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function _favBreakdownHTML(e) {
  const isMovie = e.cat==='movies' || e.ratings?._media_type==='movie';
  if (!isMovie) {
    const bd = Array.isArray(e.ratings?._season_breakdown) ? e.ratings._season_breakdown.filter(n=>parseInt(n)>0).map(Number) : [];
    const totalS = bd.length || Number(e.total_seasons) || 0;
    if (totalS > 0) {
      let chips = '';
      for (let i=0; i<totalS; i++) chips += `<span class="popup-info-season-chip"><span class="popup-info-season-num">S${i+1}</span><span class="popup-info-season-eps">${bd[i]?bd[i]+' ep':'S'+(i+1)}</span></span>`;
      return `<div class="popup-info-block"><div class="popup-info-label">TV Show Breakdown</div><div style="display:flex;flex-wrap:wrap;">${chips}</div></div>`;
    }
    return '';
  } else {
    const rtH=Number(e.runtime_h)||0, rtM=Number(e.runtime_m)||0;
    return (rtH||rtM) ? `<div class="popup-info-block"><span class="popup-info-runtime"><span class="popup-info-runtime-val">${rtH?rtH+'h '+rtM+'m':rtM+'m'}</span><span class="popup-info-runtime-lbl">Runtime</span></span></div>` : '';
  }
}

function _buildCgDetailFav(e) {
  const score    = liveScore(e) != null ? Number(liveScore(e)).toFixed(2) : '—';
  const isMovies = e.cat === 'movies';
  const { core: coreArr, bonus: bonusArr } = getRatings(e.cat);
  const isAnimated = e.cat === 'anime' || e.cat === 'cartoons';

  const coreRows = coreArr.map(r => {
    const val = e.ratings?.[r.key];
    if (val == null || val === '') return '';
    return `<div class="fd-rating-row"><span class="fd-rating-label">${r.label}</span><span class="fd-rating-val">${Number(val).toFixed(2)}</span></div>`;
  }).filter(Boolean).join('');

  const animRow = (!isAnimated && e.ratings?.animation != null && e.ratings?.animation !== '')
    ? `<div class="fd-rating-row"><span class="fd-rating-label">Animation Quality</span><span class="fd-rating-val">${Number(e.ratings.animation).toFixed(2)}</span></div>` : '';

  const bonusRows = bonusArr.map(r => {
    const val = e.ratings?.[r.key];
    if (val == null || val === '') return '';
    return `<div class="fd-rating-row"><span class="fd-rating-label">${r.label}</span><span class="fd-rating-val">${Number(val).toFixed(2)}</span></div>`;
  }).filter(Boolean).join('');

  const favs = e.ratings?._favorites || {};
  const favChips = [
    favs.character ? `<span class="fav-chip"><span class="fav-chip-label">Fav Character</span>${esc(favs.character)}</span>` : '',
    (!isMovies && favs.episode) ? `<span class="fav-chip"><span class="fav-chip-label">Fav Episode</span>${esc(favs.episode)}</span>` : '',
    (!isMovies && favs.season)  ? `<span class="fav-chip"><span class="fav-chip-label">Fav Season</span>${esc(favs.season)}</span>` : '',
  ].filter(Boolean).join('');
  const lows = e.ratings?._lowlights || e.ratings?._favorites?._lowlights || {};
  const lowChips = [
    lows.character ? `<span class="fav-chip low-chip"><span class="fav-chip-label">Least Fav Character</span>${esc(lows.character)}</span>` : '',
    (!isMovies && lows.episode) ? `<span class="fav-chip low-chip"><span class="fav-chip-label">Least Fav Episode</span>${esc(lows.episode)}</span>` : '',
    (!isMovies && lows.season)  ? `<span class="fav-chip low-chip"><span class="fav-chip-label">Least Fav Season</span>${esc(lows.season)}</span>` : '',
  ].filter(Boolean).join('');

  return `${e.description ? `<div class="fd-description">${esc(e.description)}</div>` : ''}
  ${_favBreakdownHTML(e)}
  <div class="fd-cols">
    ${(coreRows||animRow) ? `<div class="fd-col"><div class="fd-section-hd">Core Ratings</div>${coreRows}${animRow}</div>` : ''}
    ${bonusRows ? `<div class="fd-col"><div class="fd-section-hd">Bonus Ratings</div>${bonusRows}</div>` : ''}
  </div>
  <div class="fd-final"><span>Final Score</span><strong>${score}</strong></div>
  ${favChips ? `<div class="fav-chips" style="margin-top:8px;">${favChips}</div>` : ''}
  ${lowChips ? `<div class="fav-chips" style="margin-top:6px;">${lowChips}</div>` : ''}
  ${e.notes ? `<div class="fd-notes">"${esc(e.notes)}"</div>` : ''}
  <a href="#" class="fd-edit-link" onclick="goToDetail('${e.id}','lists.html');return false;">Edit entry →</a>`;
}

function goToDetail(id, from) {
  sessionStorage.setItem('detailId', id);
  sessionStorage.setItem('detailFrom', from || 'lists.html');
  window.location.href = 'detail.html';
}

function _favNavScroll(id, dir) {
  var el = document.getElementById(id);
  if (!el) return;
  var target = el.scrollWidth > el.clientWidth ? el : (el.closest('.grid-nav-wrap') || el);
  target.scrollBy({ left: dir * (target.clientWidth * 0.75 || 220), behavior: 'smooth' });
}

let _listsUser = null;
let _listsEntries = [];
let _listsAll = [];
let _listsOrderSort = 'default';
let _listItemSort = {};
let _listsEntryMap = {};
let _listsMode = 'personal';
let _socialListsSort = 'popular';
let _socialListsRaw = [];
let _socialListsMyReactions = {}; // list_id -> 'like' | 'dislike'

// Picker state
let _favListPickerListId = null;
let _favListPickerCat = null;
let _favListPickerGenre = null;
let _favListPickerSelected = [];
let _favListPickerPool = [];
let _favListPickerMax  = Infinity;

// Popup state
let _favPopupId = null;

document.addEventListener('DOMContentLoaded', () => {
  initPage(async (user) => {
    if (!user) {
      document.querySelector('.page-wrap').innerHTML = `
        <div class="guest-page-state fade-up">
          <div class="guest-page-icon">${icon('layers', 36)}</div>
          <h2 class="guest-page-title">Your Lists</h2>
          <p class="guest-page-sub">Sign in to create and manage your custom lists.</p>
          <div class="guest-cta">
            <a href="login.html" class="guest-btn-primary">Sign In</a>
            <a href="login.html#signup" class="guest-btn-secondary">Create Account</a>
          </div>
        </div>`;
      return;
    }
    _listsUser = user;
    await loadListsPage();
  });
});

async function loadListsPage() {
  const [entries, lists] = await Promise.all([
    getEntries(_listsUser.id),
    getFavoriteLists(_listsUser.id),
  ]);
  _listsEntries = entries || [];
  _listsAll = lists || [];
  _listsEntryMap = Object.fromEntries(_listsEntries.map(e => [e.id, e]));

  await _ensureListSortOrder();
  renderListsPage();
}

// Custom lists (cat='custom') are already fetched ordered by created_at, so
// that's a stable baseline. Lists with a real sort_order move to that
// position; ones without one (not yet reordered) keep their created_at
// spot. If any are missing sort_order, backfill it once from the current
// order so future reorders have real values to work from everywhere,
// including profile.html/profile-view.html which just read this column.
async function _ensureListSortOrder() {
  const custom = _listsAll.filter(l => l.cat === 'custom');
  custom.sort((a, b) => {
    const ao = a.sort_order, bo = b.sort_order;
    if (ao != null && bo != null) return ao - bo;
    if (ao != null) return -1;
    if (bo != null) return 1;
    return new Date(a.created_at) - new Date(b.created_at);
  });

  const needsBackfill = custom.some(l => l.sort_order == null);
  if (!needsBackfill) return;

  try {
    await Promise.all(custom.map((l, i) => {
      l.sort_order = i;
      return sb.from('favorite_lists').update({ sort_order: i }).eq('id', l.id).eq('user_id', _listsUser.id);
    }));
  } catch (e) { console.error('sort_order backfill error:', e); }
}

async function getFavoriteLists(userId) {
  const { data, error } = await sb.from('favorite_lists')
    .select('*')
    .eq('user_id', userId)
    .order('created_at', { ascending: true });
  if (error) { console.error('getFavoriteLists:', error); return []; }
  return data || [];
}

async function saveFavoriteList(list) {
  if (list.id) {
    const upd = { items: list.items, title: list.title };
    if (list.description !== undefined) upd.description = list.description;
    const { data, error } = await sb.from('favorite_lists')
      .update(upd)
      .eq('id', list.id)
      .eq('user_id', _listsUser.id)
      .select().single();
    if (error) throw error;
    return data;
  } else {
    const { data, error } = await sb.from('favorite_lists')
      .insert({ user_id: _listsUser.id, cat: list.cat, genre: list.genre, title: list.title, description: list.description || null, items: list.items || [] })
      .select().single();
    if (error) throw error;
    return data;
  }
}

async function deleteFavoriteList(id) {
  const { error } = await sb.from('favorite_lists').delete().eq('id', id).eq('user_id', _listsUser.id);
  if (error) throw error;
}

function favCard(e, rank) {
  const score = liveScore(e) != null ? Number(liveScore(e)).toFixed(2) : null;
  const rankCls = rank === 0 ? 'cg-rank-1' : rank === 1 ? 'cg-rank-2' : rank === 2 ? 'cg-rank-3' : 'cg-rank-other';
  const rankBadge = rank != null ? `<div class="cg-rank-badge ${rankCls}">${rank + 1}</div>` : '';
  const scoreHTML = score ? `<div style="font-family:var(--serif);font-size:15px;font-weight:300;color:var(--olive-light);margin-top:4px;text-align:right">${score}</div>` : '';
  return `<div class="q-card" onclick="openFavPopup('${e.id}')" style="cursor:pointer;">
    <div class="q-poster" style="position:relative;">${posterHTML(e,'big')}<div class="q-poster-overlay"></div>${rankBadge}</div>
    <div class="q-info">
      <div class="q-title">${esc(e.title)}</div>
      <div class="q-genre">${getTypeBadge(e,'friend')}${genreHTML(e.genres, 3)}</div>
      ${scoreHTML}
    </div>
  </div>`;
}

function renderListsPage() {
  const customLists = _listsAll.filter(l => l.cat === 'custom');
  const totalLists = customLists.length;

  const uniqueItemIds = new Set();
  let largest = 0;
  let withDesc = 0;
  customLists.forEach(list => {
    const items = list.items || [];
    items.forEach(id => uniqueItemIds.add(id));
    if (items.length > largest) largest = items.length;
    if (list.description && list.description.trim()) withDesc++;
  });

  const statsEl = document.getElementById('listsPageStats');
  statsEl.innerHTML = `
    <div class="page-stat"><div class="page-stat-num">${totalLists}</div><div class="page-stat-label">Total Lists</div></div>
    <div class="page-stat"><div class="page-stat-num">${uniqueItemIds.size}</div><div class="page-stat-label">Items Organized</div></div>
    <div class="page-stat"><div class="page-stat-num">${largest}</div><div class="page-stat-label">Largest List</div></div>
    <div class="page-stat"><div class="page-stat-num">${withDesc}</div><div class="page-stat-label">With Description</div></div>`;

  document.getElementById('listsPageSub').textContent = `${totalLists} list${totalLists!==1?'s':''} · ${_listsEntries.length} entries in your library`;

  document.getElementById('listsOrderSortBar').style.display = totalLists ? '' : 'none';

  let html = '';

  if (!totalLists) {
    html = `<div class="empty" style="padding:4rem 1rem;text-align:center;">
      <div class="empty-icon" style="opacity:.4;margin-bottom:1rem;">${icon('layers', 44)}</div>
      <div class="empty-text" style="color:var(--text-2);margin-bottom:.5rem;">No lists yet</div>
      <div style="font-size:13px;color:var(--text-3);">Use "+ New List" to create a custom list — mix any movies, shows, anime, or cartoons together.</div>
    </div>`;
  } else {
    let sorted;
    if (_listsOrderSort === 'az') {
      sorted = [...customLists].sort((a, b) => a.title.localeCompare(b.title));
    } else if (_listsOrderSort === 'za') {
      sorted = [...customLists].sort((a, b) => b.title.localeCompare(a.title));
    } else {
      sorted = [...customLists].sort((a, b) => {
        const ao = a.sort_order, bo = b.sort_order;
        if (ao != null && bo != null) return ao - bo;
        if (ao != null) return -1;
        if (bo != null) return 1;
        return new Date(a.created_at) - new Date(b.created_at);
      });
    }
    const dragEnabled = _listsOrderSort === 'default';
    sorted.forEach(list => {
      let listItems = (list.items || []).map(id => _listsEntryMap[id]).filter(Boolean);
      const itemSort = _listItemSort[list.id] || 'default';
      if (itemSort === 'highest') {
        listItems = [...listItems].sort((a, b) => (liveScore(b)||0) - (liveScore(a)||0));
      } else if (itemSort === 'lowest') {
        listItems = [...listItems].sort((a, b) => (liveScore(a)||0) - (liveScore(b)||0));
      } else if (itemSort === 'az') {
        listItems = [...listItems].sort((a, b) => (a.title||'').localeCompare(b.title||''));
      } else if (itemSort === 'za') {
        listItems = [...listItems].sort((a, b) => (b.title||'').localeCompare(a.title||''));
      }
      const sectionHtml = hScrollSection(list.id, list.title, `${listItems.length} items`, listItems, true,
        `openFavListPicker(&quot;${list.id}&quot;)`,
        `deleteFavListConfirm(&quot;${list.id}&quot;)`,
        `openFavCustomListModal(&quot;${list.id}&quot;)`,
        list.description,
        itemSort
      );
      html += `<div class="lists-drag-item" data-list-id="${list.id}">
        ${dragEnabled ? `<div class="lists-drag-handle" title="Drag to reorder"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="8" x2="20" y2="8"/><line x1="4" y1="16" x2="20" y2="16"/></svg></div>` : ''}
        ${sectionHtml}
      </div>`;
    });
  }

  document.getElementById('listsPageContent').innerHTML = html;
}

/* ── Double-tap-to-like (touch screens) ── */
let _dtLastTap = {};
function _dtHandleTouch(e, key, likeFn, isAlreadyLiked) {
  const now = Date.now();
  const last = _dtLastTap[key] || 0;
  _dtLastTap[key] = now;
  if (now - last < 350 && now - last > 0) {
    _dtLastTap[key] = 0;
    if (!isAlreadyLiked()) likeFn();
    _dtShowHeart(e.currentTarget);
  }
}
function _dtShowHeart(el) {
  if (!el) return;
  const heart = document.createElement('div');
  heart.className = 'dt-heart-pop';
  heart.textContent = '♥';
  el.appendChild(heart);
  setTimeout(() => heart.remove(), 700);
}

async function loadSocialLists() {
  const wrap = document.getElementById('listsPageContent');
  wrap.innerHTML = `<div class="page-loading"><div class="spinner"></div></div>`;
  document.getElementById('listsPageStats').innerHTML = '';
  document.getElementById('listsPageSub').textContent = 'Discover and save lists from other users';
  try {
    const { data, error } = await sb.rpc('get_social_lists', { p_limit: 100 });
    if (error) throw error;
    _socialListsRaw = data || [];

    if (_listsUser && _socialListsRaw.length) {
      const listIds = _socialListsRaw.map(l => l.id);
      const { data: myReactions } = await sb.from('list_reactions')
        .select('list_id, is_like')
        .eq('user_id', _listsUser.id)
        .in('list_id', listIds);
      _socialListsMyReactions = {};
      (myReactions || []).forEach(r => { _socialListsMyReactions[r.list_id] = r.is_like ? 'like' : 'dislike'; });
    }
    renderSocialLists();
  } catch (err) {
    console.error('Load social lists error:', err);
    wrap.innerHTML = `<div class="empty" style="padding:3rem 1rem;text-align:center;color:var(--text-3);">Couldn't load social lists right now.</div>`;
  }
}

function renderSocialLists() {
  const wrap = document.getElementById('listsPageContent');
  if (!_socialListsRaw.length) {
    wrap.innerHTML = `<div class="empty" style="padding:3rem 1rem;text-align:center;">
      <div class="empty-icon" style="opacity:.4;margin-bottom:1rem;">${icon('layers', 44)}</div>
      <div class="empty-text" style="color:var(--text-2);">No public lists yet.</div>
    </div>`;
    return;
  }
  const sorted = [..._socialListsRaw].sort((a, b) => {
    if (_socialListsSort === 'latest') return new Date(b.created_at) - new Date(a.created_at);
    const scoreA = Number(a.like_count) - Number(a.dislike_count);
    const scoreB = Number(b.like_count) - Number(b.dislike_count);
    if (scoreB !== scoreA) return scoreB - scoreA;
    return new Date(b.created_at) - new Date(a.created_at);
  });

  wrap.innerHTML = `<div class="social-list-rows">${sorted.map(l => {
    const items = l.items || [];
    const posters = items.slice(0, 5).map(id => _listsEntryMap[id]).filter(Boolean);
    const initial = (l.username || '?')[0].toUpperCase();
    return `<div class="social-list-row" onclick="openSocialListPopup('${l.id}')" ontouchend="_dtHandleTouch(event, 'list-${l.id}', () => reactToSocialList('${l.id}', true), () => _socialListsMyReactions['${l.id}'] === 'like')">
      <div class="social-list-owner">
        <div class="social-list-avatar">${l.avatar_url ? `<img src="${esc(l.avatar_url)}" loading="lazy">` : esc(initial)}</div>
        <div class="social-list-username">@${esc(l.username || 'user')}</div>
      </div>
      <div class="social-list-title">${esc(l.title)}</div>
      ${l.description ? `<div class="social-list-desc">${esc(l.description)}</div>` : ''}
      <div class="social-list-count">${items.length} item${items.length !== 1 ? 's' : ''}</div>
      ${posters.length ? `<div class="social-list-posters">${posters.map(e => `<div class="social-list-poster-thumb">${posterHTML(e,'big')}</div>`).join('')}</div>` : ''}
    </div>`;
  }).join('')}</div>`;
}

function openSocialListPopup(listId) {

function _renderSocialListPopup(l) {
  const myReaction = _socialListsMyReactions[l.id];
  const initial = (l.username || '?')[0].toUpperCase();
  const items = l.items || [];
  const alreadyOwnedTitles = new Set(_listsAll.filter(x => x.cat === 'custom').map(x => x.title.toLowerCase().trim()));
  const isOwn = l.user_id === _listsUser?.id;
  const alreadyForked = alreadyOwnedTitles.has((l.title || '').toLowerCase().trim());

  document.getElementById('slPopupCard').innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;">

    </div>

        </button>
        <button class="social-list-react-btn ${myReaction === 'dislike' ? 'active-dislike' : ''}" onclick="reactToSocialList('${l.id}', false); _renderSocialListPopup(_socialListsRaw.find(x=>x.id==='${l.id}'))">
          ${icon(myReaction === 'dislike' ? 'thumbsDownFilled' : 'thumbsDown', 15)} <span>${l.dislike_count || 0}</span>
        </button>
      </div>
      <button class="social-list-add-btn" style="padding:9px 20px;font-size:12.5px;" onclick="location.href='list-view.html?list=${l.id}'">View List</button>
    </div>
    ${!isOwn ? `<button class="social-list-add-btn" style="width:100%;margin-top:12px;padding:9px;" ${alreadyForked ? 'disabled' : ''} onclick="forkSocialList('${l.id}')">${alreadyForked ? 'Already Added' : '+ Add to My Lists'}</button>` : ''}
  `;
}

async function reactToSocialList(listId, isLike) {
  if (!_listsUser) { showToast('Sign in to react to lists.', 'err'); return; }
  const list = _socialListsRaw.find(l => l.id === listId);
  if (!list) return;
  const current = _socialListsMyReactions[listId];
  const wantsSame = (current === 'like' && isLike) || (current === 'dislike' && !isLike);

  try {
    if (wantsSame) {
      const { error } = await sb.from('list_reactions').delete().eq('list_id', listId).eq('user_id', _listsUser.id);
      if (error) throw error;
      delete _socialListsMyReactions[listId];
      if (current === 'like') list.like_count = Math.max(0, Number(list.like_count) - 1);
      else list.dislike_count = Math.max(0, Number(list.dislike_count) - 1);
    } else {
      const { error } = await sb.from('list_reactions')
        .upsert({ list_id: listId, user_id: _listsUser.id, is_like: isLike }, { onConflict: 'list_id,user_id' });
      if (error) throw error;
      if (current === 'like') list.like_count = Math.max(0, Number(list.like_count) - 1);
      if (current === 'dislike') list.dislike_count = Math.max(0, Number(list.dislike_count) - 1);
      if (isLike) list.like_count = Number(list.like_count) + 1;
      else list.dislike_count = Number(list.dislike_count) + 1;
      _socialListsMyReactions[listId] = isLike ? 'like' : 'dislike';
    }
    renderSocialLists();
  } catch (err) {
    console.error('React to list error:', err);
    showToast('Failed to save your reaction.', 'err');
  }
}

async function forkSocialList(listId) {
  if (!_listsUser) { showToast('Sign in to add lists.', 'err'); return; }
  const list = _socialListsRaw.find(l => l.id === listId);
  if (!list) return;
  try {
    const { error } = await sb.from('favorite_lists').insert({
      user_id: _listsUser.id,
      cat: 'custom',
      genre: list.genre || '',
      title: list.title,
      description: list.description || null,
      items: list.items || [],
      forked_from: list.id,
    });
    if (error) throw error;
    showToast('Added to your lists!');
    const lists = await getFavoriteLists(_listsUser.id);
    _listsAll = lists || [];
    renderSocialLists();
    if (_slPopupListId === listId) _renderSocialListPopup(list);
  } catch (err) {
    console.error('Fork list error:', err);
    showToast('Failed to add list.', 'err');
  }
}

function setListItemSort(listId, val) {
  _listItemSort[listId] = val;
  renderListsPage();
}

// 50-word cap on description fields. _listsGuardWordLimit blocks further
// typing once the limit is reached (deletions and replacing a selection
// still work) instead of letting extra words in and yanking them back
// after the fact. _listsUpdateWordCount stays as a safety-net fallback
// for input paths that bypass beforeinput (e.g. some IME flows).
function _listsCountWords(s) {
  return s.trim() ? s.trim().split(/\s+/).length : 0;
}
function _listsUpdateWordCount(inputId, countId) {
  const el = document.getElementById(inputId);
  const words = el.value.trim().split(/\s+/).filter(Boolean);
  const countEl = document.getElementById(countId);
  if (words.length > 50) {
    el.value = words.slice(0, 50).join(' ');
    if (countEl) { countEl.textContent = 'Reached max word limit (50/50 words)'; countEl.classList.add('over'); }
    return;
  }
  const count = words.length;
  if (countEl) {
    countEl.textContent = `${count} / 50 words`;
    countEl.classList.toggle('over', count >= 50);
  }
}
function _listsGuardWordLimit(inputId, countId) {
  const el = document.getElementById(inputId);
  if (!el || el.dataset.wordLimitGuarded) return;
  el.dataset.wordLimitGuarded = '1';
  el.addEventListener('beforeinput', e => {
    if (e.inputType && e.inputType.startsWith('delete')) return;
    if (el.selectionStart !== el.selectionEnd) return;
    const count = el.value.trim() ? el.value.trim().split(/\s+/).length : 0;
    if (count >= 50) {
      e.preventDefault();
      const countEl = document.getElementById(countId);
      if (countEl) { countEl.textContent = 'Reached max word limit (50/50 words)'; countEl.classList.add('over'); }
    }
  });
}

async function deleteFavListConfirm(id) {
  const list = _listsAll.find(l => l.id === id);
  const ok = await showConfirm({ title: 'Delete List?', message: '"'+(list?.title||'this list')+'" will be permanently deleted.', confirmText: 'Delete', iconName: 'x' });
  if (!ok) return;
  try {
    await deleteFavoriteList(id);
    _listsAll = _listsAll.filter(l => l.id !== id);
    renderListsPage();
    showToast('List deleted.');
  } catch(e) { showToast('Error deleting.', 'err'); }
}

// ══════════════════════════════════════════
// LIST PICKER (edit a list's items)
// ══════════════════════════════════════════
function openFavListPicker(listId) {
  _favListPickerListId = listId;
  const list = _listsAll.find(l => l.id === listId);
  if (!list) return;
  const cat = list.cat, genre = list.genre, title = list.title;
  const currentItems = (list.items || []).slice();
  _favListPickerMax = Infinity;

  _favListPickerCat = cat;
  _favListPickerGenre = genre;
  _favListPickerSelected = currentItems.filter(id => !!_listsEntryMap[id]);

  let pool = _listsEntries.filter(e => e.status === 'completed' || e.status === 'ongoing');
  if (cat && cat !== 'custom') {
    pool = pool.filter(e => {
      if (cat === 'movies') return e.cat === 'movies' || (e.ratings?._media_type === 'movie');
      if (cat === 'tv') return e.cat === 'tv' || ((e.cat === 'anime' || e.cat === 'cartoons') && e.ratings?._media_type !== 'movie');
      return e.cat === cat;
    });
  }
  if (genre) pool = pool.filter(e => (e.genres || []).includes(genre));
  _favListPickerPool = pool;

  document.getElementById('favListPickerTitle').textContent = title;
  _favPickerResetSearch();
  _favUpdateCount();
  _favRenderPickerList();

  document.getElementById('favListPickerOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function _favRankCls(i) {
  return i === 0 ? 'cg-rank-1' : i === 1 ? 'cg-rank-2' : i === 2 ? 'cg-rank-3' : 'cg-rank-other';
}

function _favUpdateCount() {
  const maxLabel = _favListPickerMax === Infinity ? '∞' : String(_favListPickerMax);
  document.getElementById('favListPickerCount').textContent = `${_favListPickerSelected.length} / ${maxLabel}`;
}

function _favDragHandleSVG() {
  return '<svg width="10" height="16" viewBox="0 0 10 16" fill="currentColor"><circle cx="2" cy="2" r="1.4"/><circle cx="8" cy="2" r="1.4"/><circle cx="2" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="2" cy="14" r="1.4"/><circle cx="8" cy="14" r="1.4"/></svg>';
}

let _favPickerSearchQuery = '';
function _favPickerSearch(q) {
  _favPickerSearchQuery = q.trim().toLowerCase();
  _favRenderPickerList();
}
function _favPickerResetSearch() {
  _favPickerSearchQuery = '';
  const inp = document.getElementById('favListPickerSearch');
  if (inp) inp.value = '';
}

function _favRenderPickerList() {
  const listEl = document.getElementById('favListPickerList');
  const prevScroll = listEl.scrollTop;

  const selSet = new Set(_favListPickerSelected);
  const inSel  = _favListPickerSelected.map(id => _listsEntryMap[id]).filter(Boolean);
  const rest   = _favListPickerPool.filter(e => !selSet.has(e.id)).sort((a,b) => (liveScore(b)||0)-(liveScore(a)||0));
  let sorted = [...inSel, ...rest];

  if (_favPickerSearchQuery) {
    const q = _favPickerSearchQuery;
    sorted = sorted.filter(e => {
      const hay = [e.title, ...(e.genres||[]), CAT_META[e.cat]?.label].filter(Boolean).join(' ').toLowerCase();
      return hay.includes(q);
    });
  }

  if (!sorted.length) {
    listEl.innerHTML = `<div class="fav-picker-empty">No matches for "${esc(_favPickerSearchQuery)}"</div>`;
    listEl.scrollTop = 0;
    return;
  }

  listEl.innerHTML = sorted.map(e => {
    const isSel   = selSet.has(e.id);
    const slotNum = _favListPickerSelected.indexOf(e.id);
    const sc      = liveScore(e) != null ? Number(liveScore(e)).toFixed(2) : null;
    const rankCls = _favRankCls(slotNum);
    return `<div class="fav-picker-item ${isSel?'selected':''}" onclick="toggleFavListItem(this)" data-id="${e.id}">
      ${isSel ? `<div class="fav-drag-handle" title="Drag to reorder" onclick="event.stopPropagation()">${_favDragHandleSVG()}</div>` : ''}
      <div class="fav-picker-poster">${e.poster_url ? `<img src="${e.poster_url}" loading="lazy">` : esc((e.title[0]||'?').toUpperCase())}
        ${isSel ? `<div class="cg-rank-badge ${rankCls}">${slotNum+1}</div>` : ''}
      </div>
      <div class="fav-picker-info"><div class="fav-picker-name">${esc(e.title)}</div><div class="fav-picker-sub">${(CAT_META[e.cat]?.label)||''}</div></div>
      ${sc ? `<div class="fav-picker-score">${sc}</div>` : ''}
      <div class="fav-picker-check">${isSel ? '✓' : ''}</div>
    </div>`;
  }).join('');

  listEl.scrollTop = prevScroll;
}

function toggleFavListItem(el) {
  const id = el.dataset.id;
  const idx = _favListPickerSelected.indexOf(id);

  if (idx >= 0) {
    _favListPickerSelected.splice(idx, 1);
  } else {
    if (_favListPickerSelected.length >= _favListPickerMax) {
      showToast(`Max ${_favListPickerMax} items.`, 'err'); return;
    }
    _favListPickerSelected.push(id);
  }

  _favUpdateCount();
  _favRenderPickerList();
}

/* ── Drag to reorder selected items ── */
let _favDrag = null;

document.addEventListener('pointerdown', e => {
  const handle = e.target.closest('.fav-drag-handle');
  if (!handle) return;
  const item = handle.closest('.fav-picker-item');
  if (!item) return;
  e.preventDefault();

  const list = document.getElementById('favListPickerList');
  const selectedEls = Array.from(list.querySelectorAll('.fav-picker-item.selected'));
  const startIndex = selectedEls.indexOf(item);
  if (startIndex < 0) return;

  _favDrag = {
    item, startIndex, currentIndex: startIndex,
    startY: e.clientY,
    itemHeight: item.getBoundingClientRect().height,
    selectedEls,
  };

  item.classList.add('dragging');
  item.style.position = 'relative';
  item.style.zIndex = '5';

  document.addEventListener('pointermove', _favDragMove);
  document.addEventListener('pointerup', _favDragEnd);
  document.addEventListener('pointercancel', _favDragEnd);
});

function _favDragMove(e) {
  if (!_favDrag) return;
  const d = _favDrag;
  const deltaY = e.clientY - d.startY;
  d.item.style.transform = `translateY(${deltaY}px)`;

  const shift = Math.round(deltaY / d.itemHeight);
  const newIndex = Math.min(Math.max(d.startIndex + shift, 0), d.selectedEls.length - 1);

  if (newIndex !== d.currentIndex) {
    d.selectedEls.forEach((el, i) => {
      if (el === d.item) return;
      el.style.transition = 'transform .15s ease';
      if (i > d.startIndex && i <= newIndex)      el.style.transform = `translateY(-${d.itemHeight}px)`;
      else if (i < d.startIndex && i >= newIndex) el.style.transform = `translateY(${d.itemHeight}px)`;
      else                                        el.style.transform = '';
    });
    d.currentIndex = newIndex;
  }
}

function _favDragEnd() {
  if (!_favDrag) return;
  const d = _favDrag;
  document.removeEventListener('pointermove', _favDragMove);
  document.removeEventListener('pointerup', _favDragEnd);
  document.removeEventListener('pointercancel', _favDragEnd);

  if (d.currentIndex !== d.startIndex) {
    const [movedId] = _favListPickerSelected.splice(d.startIndex, 1);
    _favListPickerSelected.splice(d.currentIndex, 0, movedId);
  }

  d.selectedEls.forEach(el => {
    el.style.transform = '';
    el.style.transition = '';
    el.style.zIndex = '';
    el.style.position = '';
    el.classList.remove('dragging');
  });

  _favDrag = null;
  _favRenderPickerList();
}

/* ── Drag to reorder lists themselves (whole page order, persisted) ── */
let _listsDrag = null;
let _listsAutoScrollRAF = null;

document.addEventListener('pointerdown', e => {
  const handle = e.target.closest('.lists-drag-handle');
  if (!handle) return;
  const item = handle.closest('.lists-drag-item');
  if (!item) return;
  e.preventDefault();

  const container = document.getElementById('listsPageContent');
  const items = Array.from(container.querySelectorAll('.lists-drag-item'));
  const startIndex = items.indexOf(item);
  if (startIndex < 0) return;

  _listsDrag = {
    item, startIndex, currentIndex: startIndex,
    startY: e.clientY,
    startScrollY: window.scrollY,
    lastClientY: e.clientY,
    itemHeight: item.getBoundingClientRect().height,
    items,
  };

  item.classList.add('dragging');
  item.style.position = 'relative';
  item.style.zIndex = '5';

  document.addEventListener('pointermove', _listsDragMove);
  document.addEventListener('pointerup', _listsDragEnd);
  document.addEventListener('pointercancel', _listsDragEnd);
  _listsAutoScrollTick();
});

function _listsDragMove(e) {
  if (!_listsDrag) return;
  _listsDrag.lastClientY = e.clientY;
  _listsUpdateDragPosition();
}

function _listsUpdateDragPosition() {
  const d = _listsDrag;
  if (!d) return;
  const scrollDelta = window.scrollY - d.startScrollY;
  const deltaY = (d.lastClientY - d.startY) + scrollDelta;
  d.item.style.transform = `translateY(${deltaY}px) scale(0.98)`;

  const shift = Math.round(deltaY / d.itemHeight);
  const newIndex = Math.min(Math.max(d.startIndex + shift, 0), d.items.length - 1);

  if (newIndex !== d.currentIndex) {
    d.items.forEach((el, i) => {
      if (el === d.item) return;
      el.style.transition = 'transform .15s ease';
      if (i > d.startIndex && i <= newIndex)      el.style.transform = `translateY(-${d.itemHeight}px)`;
      else if (i < d.startIndex && i >= newIndex) el.style.transform = `translateY(${d.itemHeight}px)`;
      else                                        el.style.transform = '';
    });
    d.currentIndex = newIndex;
  }
}

function _listsAutoScrollTick() {
  if (!_listsDrag) { _listsAutoScrollRAF = null; return; }
  const EDGE = 90, MAX_SPEED = 14;
  const vh = window.innerHeight;
  const y = _listsDrag.lastClientY;
  let speed = 0;
  if (y < EDGE) speed = -MAX_SPEED * (1 - y / EDGE);
  else if (y > vh - EDGE) speed = MAX_SPEED * (1 - (vh - y) / EDGE);
  if (speed) {
    window.scrollBy(0, speed);
    _listsUpdateDragPosition();
  }
  _listsAutoScrollRAF = requestAnimationFrame(_listsAutoScrollTick);
}

async function _listsDragEnd() {
  if (!_listsDrag) return;
  const d = _listsDrag;
  document.removeEventListener('pointermove', _listsDragMove);
  document.removeEventListener('pointerup', _listsDragEnd);
  document.removeEventListener('pointercancel', _listsDragEnd);
  if (_listsAutoScrollRAF) { cancelAnimationFrame(_listsAutoScrollRAF); _listsAutoScrollRAF = null; }

  const moved = d.currentIndex !== d.startIndex;

  d.items.forEach(el => {
    el.style.transform = '';
    el.style.transition = '';
    el.style.zIndex = '';
    el.style.position = '';
    el.classList.remove('dragging');
  });

  if (moved) {
    const orderedIds = d.items.map(el => el.dataset.listId);
    const [movedId] = orderedIds.splice(d.startIndex, 1);
    orderedIds.splice(d.currentIndex, 0, movedId);

    try {
      await Promise.all(orderedIds.map((id, i) => {
        const list = _listsAll.find(l => l.id === id);
        if (list) list.sort_order = i;
        return sb.from('favorite_lists').update({ sort_order: i }).eq('id', id).eq('user_id', _listsUser.id);
      }));
      renderListsPage();
    } catch (err) {
      console.error('reorder save error:', err);
      showToast('Error saving list order.', 'err');
      renderListsPage();
    }
  }

  _listsDrag = null;
}

async function saveFavList() {
  try {
    const list = _listsAll.find(l => l.id === _favListPickerListId);
    if (!list) return;
    list.items = _favListPickerSelected.slice();
    await saveFavoriteList(list);
    closeFavListPicker();
    renderListsPage();
    showToast('Saved!');
  } catch(e) { showToast('Error saving.', 'err'); console.error(e); }
}

function closeFavListPicker() {
  document.getElementById('favListPickerOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

// ══════════════════════════════════════════
// RATINGS POPUP
// ══════════════════════════════════════════
function openFavPopup(id) {
  const e = _listsEntryMap[id];
  if (!e) return;
  _favPopupId = id;
  if (!document.getElementById('cgPopupOverlay')) _injectFavPopup();
  const pEl = document.getElementById('cgPopupPoster');
  pEl.innerHTML = e.poster_url ? `<img src="${e.poster_url}" style="width:100%;height:100%;object-fit:cover;border-radius:var(--radius-sm);">` : esc((e.title||'?')[0].toUpperCase());
  const _pyIsMovie = e.cat==='movies'||e.ratings?._media_type==='movie';
  const _pyStart = e.year || null;
  const _pyEnd = e.ratings?._completion_year || null;
  let _pyStr = '';
  if (_pyStart) {
    if (_pyIsMovie || String(_pyEnd) === String(_pyStart)) _pyStr = ` <span style="font-size:0.6em;font-weight:400;color:var(--text-3);vertical-align:middle;">${_pyStart}</span>`;
    else _pyStr = ` <span style="font-size:0.6em;font-weight:400;color:var(--text-3);vertical-align:middle;">${_pyStart}\u2013${_pyEnd||'Present'}</span>`;
  }
  document.getElementById('cgPopupTitle').innerHTML = esc(e.title) + _pyStr;
  const date = e.completed_date ? new Date(e.completed_date+'T12:00:00').toLocaleDateString('en-US',{day:'numeric',month:'short',year:'numeric'}) : '';
  const meta = [CAT_META[e.cat]?.label, ...(e.genres||[]), date].filter(Boolean);
  const metaEl = document.getElementById('cgPopupMeta');
  metaEl.innerHTML = meta.map(m => `<span style="background:var(--olive-faint);border:0.5px solid var(--border-olive);color:var(--olive-light);border-radius:20px;padding:2px 8px;font-size:10px;letter-spacing:.4px">${esc(m)}</span>`).join('')
    + `<a href="#" onclick="goToDetail('${e.id}','lists.html');return false;" style="font-size:11px;color:var(--text-3);text-decoration:none;align-self:center;margin-left:4px;">Edit →</a>`;
  const infoEl = document.getElementById('cgPopupInfo');
  if (infoEl) infoEl.innerHTML = '';
  document.getElementById('cgPopupBody').innerHTML = _buildCgDetailFav(e);
  const ccBtn = document.getElementById('cgPopupCcBtn');
  if (ccBtn) ccBtn.onclick = () => { closeFavPopup(); sessionStorage.setItem('detailId',id); sessionStorage.setItem('detailFrom','lists.html'); window.location.href='detail.html'; };
  const ov = document.getElementById('cgPopupOverlay');
  ov.style.pointerEvents='auto'; ov.style.opacity='1';
  document.getElementById('cgPopupCard').style.transform='translateY(0)';
  document.body.style.overflow='hidden';
}

function _injectFavPopup() {
  if (document.getElementById('cgPopupOverlay')) return;
  const el = document.createElement('div');
  el.id='cgPopupOverlay';
  el.style.cssText='position:fixed;inset:0;z-index:900;background:rgba(0,0,0,0.72);display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;opacity:0;transition:opacity 220ms var(--ease);pointer-events:none;';
  el.innerHTML=`<div id="cgPopupCard" style="background:var(--bg-2);border:1.5px solid var(--olive-light);box-shadow:4px 4px 0 var(--olive);border-radius:var(--radius-lg);width:100%;max-width:min(97vw, 760px);max-height:90dvh;overflow-y:auto;overscroll-behavior-y:contain;position:relative;box-sizing:border-box;transform:translateY(18px);transition:transform 260ms var(--ease);">
    <div style="display:flex;align-items:flex-start;gap:16px;padding:20px 20px 0;">
      <div id="cgPopupPoster" style="width:72px;height:100px;flex-shrink:0;border-radius:var(--radius-sm);overflow:hidden;background:var(--bg-3);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);font-family:var(--serif);font-size:24px;color:var(--text-3);"></div>
      <div style="flex:1;min-width:0;padding-top:4px;">
        <div id="cgPopupTitle" style="font-family:var(--serif);font-size:28px;font-weight:300;line-height:1.2;margin-bottom:6px;color:var(--text);"></div>
        <div id="cgPopupMeta" style="font-size:12px;color:var(--text-3);margin-bottom:8px;display:flex;flex-wrap:wrap;gap:6px;"></div>
        <div id="cgPopupInfo" style="margin-top:4px;"></div>
      </div>
      <button onclick="closeFavPopup()" style="background:none;border:none;color:var(--text-3);cursor:pointer;font-size:22px;line-height:1;padding:0 0 0 8px;flex-shrink:0;">✕</button>
    </div>
    <div id="cgPopupBody" style="padding:16px 20px 4px;"></div>
    <div style="padding:0 20px 20px;"><button id="cgPopupCcBtn" class="cc-strip" style="margin-top:4px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:11px;height:11px;flex-shrink:0"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>Comments</span></button></div>
  </div>`;
  el.addEventListener('click', ev => { if(ev.target===el) closeFavPopup(); });
  document.body.appendChild(el);
}

function closeFavPopup() {
  const ov=document.getElementById('cgPopupOverlay');
  if(!ov)return;
  ov.style.opacity='0'; ov.style.pointerEvents='none';
  const card=document.getElementById('cgPopupCard');
  if(card) card.style.transform='translateY(18px)';
  document.body.style.overflow='';
  _favPopupId=null;
}

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (document.getElementById('favListPickerOverlay')?.classList.contains('open')) closeFavListPicker();
  else if (document.getElementById('favCustomListModal')?.classList.contains('open')) closeFavCustomListModal();
  else if (document.getElementById('cgPopupOverlay')?.style.opacity === '1') closeFavPopup();
});
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW failed:', e));
  });
}

/* ── Custom List Modal (title only, no cat/genre) ── */
var _favCustomListEditId = null;

function openFavCustomListModal(editId) {
  _favCustomListEditId = editId || null;
  var inp = document.getElementById('favCustomListInput');
  var descInp = document.getElementById('favCustomListDescInput');
  const existingList = editId ? _listsAll.find(l => l.id === editId) : null;
  inp.value = existingList?.title || '';
  descInp.value = existingList?.description || '';
  _listsUpdateWordCount('favCustomListDescInput','favCustomListDescCount');
  _listsGuardWordLimit('favCustomListDescInput','favCustomListDescCount');
  document.getElementById('favCustomListCreate').disabled = !inp.value.trim();
  document.getElementById('favCustomListModalTitle').textContent = editId ? 'Edit List' : 'New List';
  document.getElementById('favCustomListCreate').textContent = editId ? 'Save' : 'Create List';
  document.getElementById('favCustomListModal').classList.add('open');
  document.body.style.overflow = 'hidden';
  setTimeout(() => inp.focus(), 100);
}
function closeFavCustomListModal() {
  document.getElementById('favCustomListModal').classList.remove('open');
  document.body.style.overflow = '';
  _favCustomListEditId = null;
}
async function createFavCustomList() {
  const title = document.getElementById('favCustomListInput').value.trim();
  const description = document.getElementById('favCustomListDescInput').value.trim();
  if (!title) return;
  try {
    if (_favCustomListEditId) {
      const list = _listsAll.find(l => l.id === _favCustomListEditId);
      if (list) {
        list.title = title;
        list.description = description;
        await saveFavoriteList(list);
        closeFavCustomListModal();
        renderListsPage();
        showToast('List updated!');
      }
    } else {
      const newList = await saveFavoriteList({ cat: 'custom', genre: '', title, description, items: [] });
      _listsAll.push(newList);
      closeFavCustomListModal();
      renderListsPage();
      showToast(`"${title}" created!`);
      setTimeout(() => openFavListPicker(newList.id), 300);
    }
  } catch(e) { showToast('Error saving list.', 'err'); console.error(e); }
}
