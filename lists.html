<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lists — MyScreenScore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E5C26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MyScreenScore">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<style>
/* Score styling — matches Discover's grid card exactly */
.home-tmdb-meta-row { display:flex; align-items:center; justify-content:flex-end; gap:8px; margin-top:2px; }
.home-tmdb-score { font-family:var(--bebas); color:var(--olive-light); font-size:clamp(15px, 3.3vw, 17px); font-weight:400; white-space:nowrap; }
/* ── Lists page (mirrors favorites.html's list styling) ── */
.fav-page-list-header {
  display:block;
  margin-bottom:1rem;
}
.fav-page-list-title-row {
  display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:nowrap;
  margin-bottom:6px;
}
.fav-page-list-title-inner { display:flex; align-items:center; gap:8px; min-width:0; flex:1; }
.home-tmdb-year { color:var(--text-3); font-size:clamp(11px, 2.6vw, 13px); }
.fav-edit-btn-row { display:flex; gap:6px; flex-shrink:0; }
@media(max-width:640px) {
  .fav-page-list-title-row { gap:8px; }
  .fav-edit-btn-row { gap:5px; }
  .fav-edit-btn-label { display:none; }
  .fav-edit-btn { padding:7px 9px !important; }
}
.fav-page-list-title {
  font-family:var(--serif);font-size:clamp(17px, 3.4vw, 20px);font-weight:500;color:var(--text);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0;
}
.fav-page-list-count {
  font-size:11px;color:var(--text-3);letter-spacing:.5px;margin-top:2px;
}
.fav-page-section {
  margin-bottom:2.5rem;
}
.fav-page-section-hd {
  font-size:11px;letter-spacing:2.5px;text-transform:uppercase;
  color:var(--olive-light);margin:2rem 0 1.25rem;
  display:flex;align-items:center;gap:12px;
}
.fav-page-section-hd::after{content:'';flex:1;height:0.5px;background:var(--border);}

/* ── Personal / Social toggle ── */
.pn-toggle {
  display:flex; width:fit-content; margin:0 auto 1.5rem;
  background:var(--bg-3); border:0.5px solid var(--border-2); border-radius:var(--radius-sm); overflow:hidden;
}
.pn-toggle-btn {
  padding:10px 32px; font-size:13.5px; font-weight:600;
  background:none; border:none; color:var(--text-3); cursor:pointer;
  transition:all .15s;
}
.pn-toggle-btn + .pn-toggle-btn { border-left:0.5px solid var(--border-2); }
.pn-toggle-btn:hover { color:var(--text); }
.pn-toggle-btn.active { background:var(--olive); color:#fff; }

/* ── Search — same live dropdown pattern used on friends.html/notes.html ── */
.lists-search-wrap { margin-bottom:1.25rem; }
.username-dropdown {
  position:fixed;
  background:var(--bg-3); border:0.5px solid var(--olive-light); border-top:none;
  border-radius:0 0 var(--radius) var(--radius); z-index:290;
  box-shadow:var(--shadow-lg);
  overflow-y:auto; overflow-x:hidden; max-height:320px;
  display:none;
}
.username-dropdown.open { display:block; }
.ud-item {
  display:flex; align-items:center; gap:12px;
  padding:10px 14px; cursor:pointer;
  transition:background .15s;
  border-bottom:0.5px solid var(--border);
}
.ud-item:last-child { border-bottom:none; }
.ud-item:hover, .ud-item.ud-active { background:var(--olive-faint); }
.ud-avatar {
  width:36px; height:36px; border-radius:50%; flex-shrink:0;
  background:var(--bg-3); border:1px solid var(--border-2);
  font-family:var(--serif); font-size:16px; color:var(--text-2);
  display:flex; align-items:center; justify-content:center; overflow:hidden;
}
.ud-avatar img { width:100%; height:100%; object-fit:cover; border-radius:50%; }
.ud-info { flex:1; min-width:0; }
.ud-username { font-size:14px; font-weight:500; color:var(--text); }
.ud-username em { color:var(--olive-light); font-style:normal; font-weight:600; }
.ud-display { font-size:11px; color:var(--text-3); margin-top:2px; }
.ud-loading, .ud-empty { padding:14px; font-size:13px; color:var(--text-3); text-align:center; }
.ud-type-tag {
  font-size:9.5px; font-weight:700; letter-spacing:.5px; text-transform:uppercase;
  color:var(--olive-light); background:var(--olive-faint); border:0.5px solid var(--border-olive);
  border-radius:20px; padding:2px 8px; flex-shrink:0;
}
.lists-search-wrap .fused-search-wrap {
  display:flex; align-items:stretch;
  border:1.5px solid var(--border-olive); border-radius:var(--radius-sm); overflow:hidden;
  background:var(--bg-3); transition:border-color var(--trans) var(--ease), box-shadow var(--trans) var(--ease);
}
.lists-search-wrap .fused-search-wrap:focus-within { border-color:var(--olive-light); box-shadow:0 0 0 3px var(--olive-faint); }
.lists-search-wrap .add-friend-input {
  flex:1; min-width:0; background:transparent; border:none;
  color:var(--text); font-size:16px;
  padding:18px 20px; outline:none; box-sizing:border-box; transition:none;
}
.lists-search-wrap .add-friend-input::placeholder { color:var(--text-3); font-size:14px; }
.lists-search-wrap .fused-search-btn {
  flex-shrink:0; display:flex; align-items:center; gap:8px;
  padding:0 26px; border:none; cursor:pointer;
  background:linear-gradient(135deg, var(--olive-light), var(--olive-2)); color:#fff;
  font-size:14px; font-weight:500; font-family:var(--sans);
  transition:opacity .15s;
}
.lists-search-wrap .fused-search-btn:hover { opacity:.9; }
.lists-search-wrap .fused-search-btn svg { width:16px; height:16px; flex-shrink:0; }
#listsFilterBanner {
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  background:var(--olive-faint); border:0.5px solid var(--border-olive); border-radius:var(--radius);
  padding:10px 16px; margin-top:10px; font-size:13.5px; color:var(--olive-light); font-weight:500;
}
#listsFilterBanner button {
  background:none; border:none; color:var(--olive-light); font-size:12.5px; font-weight:600; cursor:pointer; text-decoration:underline;
}

/* ── Social list rows ── */
.social-list-row { background:var(--card); border:0.5px solid var(--border); border-radius:var(--radius-lg); padding:1.1rem 1.25rem; transition:border-color .15s; cursor:pointer; }
.social-list-row:hover { border-color:var(--border-olive); }
.social-list-owner { display:flex; align-items:center; gap:8px; margin-bottom:.75rem; }
.social-list-avatar {
  width:26px; height:26px; border-radius:50%; overflow:hidden; flex-shrink:0;
  background:var(--olive-faint); color:var(--olive-light); font-family:var(--serif); font-size:12px;
  display:flex; align-items:center; justify-content:center;
}
.social-list-avatar img { width:100%; height:100%; object-fit:cover; }
.social-list-username { font-size:12.5px; color:var(--text-3); }
.social-list-title { font-family:var(--serif); font-size:19px; font-weight:400; margin-bottom:4px; }
.social-list-desc { font-size:12.5px; color:var(--text-2); line-height:1.5; margin-bottom:.75rem; }
.social-list-count { font-size:11.5px; color:var(--text-3); margin-bottom:.9rem; }
.social-list-posters { display:flex; gap:6px; margin-bottom:1rem; }
.social-list-poster-thumb { width:44px; height:64px; border-radius:5px; overflow:hidden; background:var(--bg-3); flex-shrink:0; position:relative; }
.social-list-poster-thumb img { width:100%; height:100%; object-fit:cover; }
.social-list-footer { display:flex; align-items:center; justify-content:space-between; gap:10px; }
.social-list-reactions { display:flex; gap:12px; }
.social-list-react-btn {
  display:inline-flex; align-items:center; gap:5px; background:none; border:none; cursor:pointer;
  color:var(--text-3); font-size:12px; font-weight:500; transition:color .15s;
}
.social-list-react-btn:hover { color:var(--text); }
.social-list-react-btn.active-like { color:var(--olive-light); }
.social-list-react-btn.active-dislike { color:#c0685a; }
.social-list-react-btn svg, .snote-rect-btn svg { transition:transform .3s, fill .3s; }
.social-list-react-btn:hover svg, .snote-rect-btn:hover svg { transform:scale(1.15) rotate(-8deg); }
.snote-rect-btn {
  display:flex; align-items:center; justify-content:center; gap:8px;
  padding:11px 8px; border-radius:var(--radius-sm); font-size:13px; font-weight:600;
  background:var(--bg-3); border:0.5px solid var(--border-2); color:var(--text-3); cursor:pointer;
  transition:all .15s; white-space:nowrap;
}
.snote-rect-btn:hover { border-color:var(--border-olive); color:var(--text); }
.snote-rect-btn.active-like { background:var(--olive-faint); border-color:var(--border-olive); color:var(--olive-light); }
.snote-rect-btn.active-dislike { background:rgba(192,104,90,0.12); border-color:rgba(192,104,90,0.4); color:#c0685a; }
.social-list-add-btn {
  font-size:11.5px; font-weight:600; padding:6px 14px; border-radius:999px;
  background:var(--olive-faint); border:0.5px solid var(--border-olive); color:var(--olive-light);
  cursor:pointer; transition:all .15s; white-space:nowrap;
}
.social-list-add-btn:hover { background:var(--olive-light); color:var(--bg); }
.social-list-add-btn:disabled { opacity:.5; cursor:default; }
.social-list-row { position:relative; }
.dt-heart-pop {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) scale(0.4);
  font-size:56px; color:var(--olive-light); text-shadow:0 2px 14px rgba(0,0,0,.35);
  pointer-events:none; opacity:0; animation:dtHeartPop .7s ease forwards; z-index:5;
}
@keyframes dtHeartPop {
  0%   { opacity:0; transform:translate(-50%,-50%) scale(0.4); }
  25%  { opacity:1; transform:translate(-50%,-50%) scale(1.15); }
  40%  { transform:translate(-50%,-50%) scale(0.95); }
  100% { opacity:0; transform:translate(-50%,-50%) scale(1); }
}

/* Picker */
#favListPickerOverlay {
  position:fixed;inset:0;z-index:1200;background:rgba(0,0,0,0.65);
  backdrop-filter:blur(10px);display:flex;align-items:center;
  justify-content:center;padding:16px;box-sizing:border-box;
  opacity:0;pointer-events:none;transition:opacity .22s;
}
#favListPickerOverlay.open{opacity:1;pointer-events:auto;}
#favListPickerSheet {
  width:97%;max-width:540px;background:var(--bg-2);
  border:1.5px solid var(--olive-light);border-radius:var(--radius-lg);
  box-shadow:4px 4px 0 var(--olive);display:flex;flex-direction:column;
  max-height:85dvh;transform:translateY(16px);
  transition:transform .26s cubic-bezier(.4,0,.2,1);
}
#favListPickerOverlay.open #favListPickerSheet{transform:translateY(0);}
.fav-picker-list { min-height:0; } /* lets it actually scroll within max-height instead of overflowing the sheet */
#favPickerModeToggle { flex-shrink:0; }

@media(max-width:600px){
  #favPickerModeToggle .pn-toggle-btn { padding:8px 20px; font-size:12.5px; }
  #favPickerModeToggle { margin-bottom:10px !important; }
}

@media(max-width:600px){
  .fav-h-grid .q-card{flex:0 0 120px;min-width:120px;}
  .fav-h-nav{display:none;}
}
@media(max-width:400px){
  .fav-h-grid .q-card{flex:0 0 105px;min-width:105px;}
}

/* ── Custom List Modal ── */
#favCustomListModal {
  position:fixed;inset:0;z-index:1200;background:rgba(0,0,0,0.72);
  backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;
  padding:16px;box-sizing:border-box;opacity:0;pointer-events:none;transition:opacity .2s;
}
#favCustomListModal.open { opacity:1;pointer-events:auto; }
#favCustomListCard {
  background:var(--bg-2);border:1.5px solid var(--olive-light);
  box-shadow:4px 4px 0 var(--olive);border-radius:var(--radius-lg);
  width:97%;max-width:420px;padding:24px 24px 20px;box-sizing:border-box;
  transform:translateY(16px);transition:transform .25s cubic-bezier(.4,0,.2,1);
}
#favCustomListModal.open #favCustomListCard { transform:translateY(0); }

.lists-page-header-right { display:flex; flex-direction:row; align-items:center; gap:8px; flex-wrap:wrap; }
@media(max-width:520px){
  .lists-page-header-right { width:100%; }
  .lists-page-header-right .btn-add-entry { flex:1; font-size:clamp(11px,3vw,13px); padding:10px 12px; }
}

.list-desc-field {
  width:100%;box-sizing:border-box;padding:10px 14px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:var(--bg-3);color:var(--text);
  font-family:var(--sans);font-size:14px;outline:none;resize:vertical;min-height:56px;
  transition:border-color .15s;
}
.list-desc-field:focus{border-color:var(--olive-light);}
.list-desc-count { font-size:10.5px; color:var(--text-3); text-align:right; margin-top:4px; }
.list-desc-count.over { color:#c0564a; }
.fav-page-list-desc {
  font-size:12.5px; color:var(--text-2); line-height:1.5; margin-top:4px;
}
.list-item-sort-bar { display:flex; gap:6px; flex-wrap:wrap; }
/* ── List cards (Personal + Community share one design) ── */
.lc-grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:18px; }
@media(max-width:1400px) { .lc-grid { grid-template-columns:repeat(3, 1fr); } }
@media(max-width:1024px) { .lc-grid { grid-template-columns:repeat(2, 1fr); } }
@media(max-width:640px)  { .lc-grid { grid-template-columns:1fr; gap:12px; } }
.lc-card {
  background:var(--card); border:0.5px solid var(--border); border-radius:var(--radius-lg);
  padding:1.1rem 1.2rem 1.15rem; cursor:pointer; display:flex; flex-direction:column; min-width:0;
  transition:border-color .15s, transform .15s, box-shadow .15s;
}
.lc-card:hover { border-color:var(--border-olive); transform:translateY(-2px); box-shadow:var(--shadow); }
.lc-title-row { display:flex; align-items:center; gap:10px; min-width:0; margin-bottom:6px; }
.lc-title {
  font-family:var(--serif); font-size:19px; font-weight:500; line-height:1.25; color:var(--text);
  flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.lc-meta { font-size:12px; color:var(--text-3); margin-bottom:10px; display:flex; align-items:center; gap:6px; }
.lc-meta b { font-family:var(--bebas); font-weight:400; font-size:15px; color:var(--text-2); letter-spacing:.3px; }
.lc-desc {
  font-size:12.5px; color:var(--text-2); line-height:1.5; margin:-2px 0 12px;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.lc-posters { display:grid; grid-template-columns:repeat(5, 1fr); gap:6px; margin-top:auto; }
.lc-poster { aspect-ratio:2/3; border-radius:6px; overflow:hidden; background:var(--bg-3); position:relative; }
.lc-poster img { width:100%; height:100%; object-fit:cover; display:block; }
.lc-poster span { font-size:18px !important; }
.lc-poster-empty { grid-column:1/-1; aspect-ratio:auto; padding:18px 0; text-align:center; font-size:12px; color:var(--text-3); border:1px dashed var(--border-2); background:transparent; }
.lc-card .social-list-owner { margin-bottom:10px; }
.lc-card .social-list-reactions { margin-top:12px; padding-top:10px; border-top:0.5px solid var(--border); }
@media(max-width:640px) { #listsPageStats { display:grid; grid-template-columns:repeat(2, 1fr); } }

/* ── List popup (Personal + Community) ── */
.lp-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:1.1rem; }
.lp-eyebrow { font-family:var(--serif); font-size:11.5px; font-weight:500; letter-spacing:2.5px; text-transform:uppercase; color:var(--olive-light); display:flex; align-items:center; gap:8px; }
.lp-tag { font-family:var(--sans); letter-spacing:.6px; font-size:10px; padding:2px 8px; border-radius:999px; border:1px solid var(--border-2); color:var(--text-3); }
.lp-close { background:none; border:none; color:var(--text-3); cursor:pointer; line-height:1; padding:4px; display:flex; }
.lp-close:hover { color:var(--text); }
.lp-title-row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:.55rem; }
.lp-title { font-family:var(--serif); font-size:clamp(22px, 5vw, 28px); font-weight:500; line-height:1.15; overflow-wrap:anywhere; }
.lp-desc { font-size:13.5px; color:var(--text-2); line-height:1.6; margin-bottom:.9rem; white-space:pre-line; overflow-wrap:anywhere; }
.lp-meta { font-size:12px; color:var(--text-3); margin-bottom:1rem; display:flex; align-items:center; gap:6px; }
.lp-meta b { font-family:var(--bebas); font-weight:400; font-size:16px; color:var(--text-2); letter-spacing:.3px; }
.lp-posters { display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; margin-bottom:1.35rem; }
.lp-poster { aspect-ratio:2/3; border-radius:var(--radius-sm); overflow:hidden; background:var(--bg-2); position:relative; box-shadow:0 2px 10px rgba(0,0,0,.18); }
.lp-poster img { width:100%; height:100%; object-fit:cover; display:block; }
.lp-more { display:flex; align-items:center; justify-content:center; font-family:var(--bebas); font-size:26px; color:var(--olive-light); background:var(--olive-faint); border:1px solid var(--border-olive); box-shadow:none; }
.lp-choice { margin-bottom:1rem; display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:12px; color:var(--text-3); }
.lp-actions, .lp-footer { display:flex; gap:8px; flex-wrap:wrap; }
.lp-actions { margin-bottom:8px; }
.lp-footer { padding-top:12px; border-top:0.5px solid var(--border); flex-wrap:nowrap; }
/* Buttons use the category ratings popup's .popup-action-btn (solid olive,
   red for delete — styled via the *PopupActions ids). Sizes tuned here. */
#lpPopupActions .popup-action-btn, #lpNavPopupActions .popup-action-btn { padding:11px 14px; font-size:13px; gap:7px; }
#lpPopupActions .popup-action-btn svg, #lpNavPopupActions .popup-action-btn svg { width:14px; height:14px; opacity:1; }
.lp-view { flex:3 1 0 !important; }                        /* View List gets most of the width */
.lp-replies { flex:1 1 0 !important; }
.lp-actions-social { flex-wrap:nowrap; }
.lp-react-pair { display:flex; gap:8px; flex:0 0 auto; }
.lp-react-pair .popup-action-btn { flex:0 0 auto; min-width:72px; }
.lp-add { flex:1 1 auto !important; }
/* Like / dislike: outlined until you've reacted, then filled */
#lpPopupActions .lp-react { background:transparent; color:var(--olive-light); border-color:var(--border-olive); }
#lpPopupActions .lp-react:hover { background:var(--olive-faint); color:var(--olive-light); border-color:var(--olive-light); }
#lpPopupActions .lp-react.is-on { background:var(--olive); color:#fff; border-color:var(--olive); }
#lpPopupActions .lp-react-down.is-on { background:#b91c1c; border-color:#b91c1c; color:#fff; }
#lpPopupActions .popup-action-btn:disabled { opacity:.6; cursor:default; }
@media(max-width:600px) {
  /* keep these rows side-by-side (the shared rule stacks *PopupActions) */
  #lpPopupActions, #lpNavPopupActions { flex-direction:row !important; }
  #lpPopupActions .popup-action-btn, #lpNavPopupActions .popup-action-btn { width:auto; flex:1 1 0; padding:10px 10px; font-size:12.5px; white-space:nowrap; }
  .lp-actions-social { flex-wrap:wrap; }
  .lp-actions-social .lp-add { flex:1 1 100% !important; order:-1; }
  .lp-react-pair { flex:1 1 100%; }
  .lp-react-pair .popup-action-btn { flex:1 1 0 !important; }
  .lp-posters { gap:7px; }
}
/* the shared *PopupActions rule adds side padding on small screens — not wanted here */
#lpPopupActions { padding:0 !important; }
#lpNavPopupActions { padding:12px 0 0 !important; }
@media(max-width:380px) {
  #lpPopupActions .popup-action-btn, #lpNavPopupActions .popup-action-btn { font-size:12px; padding:10px 8px; gap:5px; }
  #lpPopupActions .popup-action-btn:not(.lp-react) svg, #lpNavPopupActions .popup-action-btn svg { display:none; }
}

/* Owner popup has 4 actions — 2×2 on phones so labels fit */
@media(max-width:600px) {
  #lpPopupActions:has(> .popup-action-btn:nth-child(4)) { flex-wrap:wrap !important; }
  #lpPopupActions:has(> .popup-action-btn:nth-child(4)) .popup-action-btn { flex:1 1 calc(50% - 4px) !important; }
}
/* ── Collaboration ── */
.cl-tag { display:inline-block; font-size:10px; font-weight:700; letter-spacing:.7px; text-transform:uppercase; padding:2px 8px; border-radius:999px; background:var(--olive); color:#fff; vertical-align:1px; }
.cl-line { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-3); margin:-4px 0 10px; min-width:0; }
.cl-line span:last-child { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cl-line b { color:var(--text-2); font-weight:600; }
.cl-stack { display:inline-flex; flex-shrink:0; }
.cl-stack .cl-av + .cl-av { margin-left:-7px; }
.cl-av {
  width:22px; height:22px; border-radius:50%; overflow:hidden; flex-shrink:0; display:inline-flex; align-items:center; justify-content:center;
  background:var(--olive); color:#fff; font-size:10px; font-weight:700; border:2px solid var(--card);
}
.cl-av img { width:100%; height:100%; object-fit:cover; }
.lp-meta + .cl-line { margin:-6px 0 14px; }
#collabOverlay {
  position:fixed; inset:0; z-index:1250; background:rgba(0,0,0,.55); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  display:flex; align-items:center; justify-content:center; padding:16px; opacity:0; pointer-events:none; transition:opacity .2s;
}
#collabOverlay.open { opacity:1; pointer-events:auto; }
#collabCard {
  width:100%; max-width:460px; max-height:min(80dvh, 640px); display:flex; flex-direction:column;
  background:var(--bg-2); border:1.5px solid var(--olive-light); border-radius:var(--radius-lg); box-shadow:4px 4px 0 var(--olive);
  transform:translateY(10px); transition:transform .2s;
}
#collabOverlay.open #collabCard { transform:none; }
.cp-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:18px 20px 12px; }
.cp-eyebrow { font-family:var(--serif); font-size:11px; font-weight:500; letter-spacing:2.5px; text-transform:uppercase; color:var(--olive-light); margin-bottom:4px; }
.cp-title { font-family:var(--serif); font-size:19px; font-weight:600; line-height:1.25; overflow-wrap:anywhere; }
.cp-close { background:none; border:none; color:var(--text-3); cursor:pointer; display:flex; padding:4px; }
.cp-link { margin:0 20px 12px; padding:12px; border-radius:var(--radius-sm); background:var(--olive-faint); border:1px solid var(--border-olive); }
.cp-link-head { display:flex; gap:10px; align-items:center; margin-bottom:10px; }
.cp-link-ic { width:30px; height:30px; border-radius:50%; flex-shrink:0; background:var(--olive); color:#fff; display:flex; align-items:center; justify-content:center; }
.cp-link-title { font-size:13.5px; font-weight:600; color:var(--text); }
.cp-link-sub { font-size:11.5px; color:var(--text-3); line-height:1.35; }
.cp-link-row { display:flex; gap:8px; }
.cp-link-input { flex:1; min-width:0; padding:8px 10px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--bg-2); color:var(--text-2); font-size:12.5px; font-family:var(--sans); outline:none; text-overflow:ellipsis; }
.cp-link-reset { margin-top:8px; background:none; border:none; padding:0; color:var(--text-3); font-size:11.5px; font-weight:600; cursor:pointer; text-decoration:underline; }
.cp-link-reset:hover { color:#c0564a; }
.cp-divider { display:flex; align-items:center; gap:10px; margin:2px 20px 10px; font-size:11px; font-weight:600; letter-spacing:1px; text-transform:uppercase; color:var(--text-3); }
.cp-divider::before, .cp-divider::after { content:''; flex:1; height:0.5px; background:var(--border); }
.cp-search { position:relative; margin:0 20px 10px; }
.cp-search span { position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--text-3); display:flex; }
.cp-search input {
  width:100%; box-sizing:border-box; padding:11px 14px 11px 38px; border-radius:var(--radius-sm);
  border:1px solid var(--border); background:var(--bg-3); color:var(--text); font-family:var(--sans); font-size:16px; outline:none;
}
.cp-search input:focus { border-color:var(--olive-light); box-shadow:0 0 0 3px var(--olive-faint); }
.cp-list { flex:1; overflow-y:auto; overscroll-behavior:contain; padding:4px 12px; min-height:120px; }
.cp-row { display:flex; align-items:center; gap:12px; padding:9px 8px; border-radius:var(--radius-sm); }
.cp-row:hover { background:var(--card); }
.cp-av { width:40px; height:40px; border-radius:50%; overflow:hidden; flex-shrink:0; display:flex; align-items:center; justify-content:center; background:var(--olive); color:#fff; font-family:var(--serif); font-weight:600; }
.cp-av img { width:100%; height:100%; object-fit:cover; }
.cp-who { flex:1; min-width:0; }
.cp-name { font-size:14px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cp-user { font-size:12px; color:var(--text-3); }
.cp-btn { flex-shrink:0; padding:7px 16px; border-radius:var(--radius-sm); font-family:'Manrope',var(--sans); font-size:12.5px; font-weight:600; cursor:pointer; border:1px solid transparent; }
.cp-invite { background:var(--olive); border-color:var(--olive); color:#fff; }
.cp-invite:hover:not(:disabled) { background:var(--olive-light); border-color:var(--olive-light); }
.cp-sent { background:transparent; border-color:var(--border-2); color:var(--text-3); cursor:default; }
.cp-joined { background:var(--olive-faint); border-color:var(--border-olive); color:var(--olive-light); }
.cp-joined:hover { border-color:#c0564a; color:#c0564a; background:transparent; }
.cp-btn:disabled { opacity:.7; }
.cp-empty { padding:28px 12px; text-align:center; color:var(--text-3); font-size:13px; display:flex; flex-direction:column; align-items:center; gap:10px; }
.cp-empty svg { opacity:.5; }
.cp-empty a { color:var(--olive-light); font-weight:600; text-decoration:none; }
.cp-foot { padding:12px 20px 18px !important; border-top:0.5px solid var(--border); display:flex; flex-direction:row !important; }
.cp-foot .popup-action-btn { flex:1; }

/* ── Reorder mode ── */
.lr-hint {
  display:flex; align-items:center; gap:8px; margin:-2px 0 14px; padding:10px 14px;
  font-size:12.5px; color:var(--text-2); background:var(--olive-faint); border:1px dashed var(--border-olive); border-radius:var(--radius-sm);
}
.lr-hint svg { color:var(--olive-light); flex-shrink:0; }
.lc-card.lc-reorder { cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none; }
.lc-card.lc-reorder:hover { transform:none; }
.lc-card.lc-reorder:active { cursor:grabbing; }
.lc-grid-reorder .lc-card { box-shadow:0 0 0 1px var(--border-olive); }
.lc-grid-reorder .lc-card .lc-posters { opacity:.75; }
.lr-bar {
  display:flex; align-items:center; gap:8px; margin:-4px -4px 10px; padding:4px 4px 10px;
  border-bottom:0.5px dashed var(--border-olive);
}
.lr-grip { width:20px; height:20px; color:var(--olive-light); display:inline-flex; }
.lr-grip svg { width:100%; height:100%; }
.lr-pos {
  font-family:var(--bebas); font-size:16px; line-height:1; color:#fff; background:var(--olive);
  min-width:24px; height:24px; padding:0 6px; border-radius:999px; display:inline-flex; align-items:center; justify-content:center;
}
.lr-move { margin-left:auto; display:flex; gap:6px; }
.lr-arrow {
  width:32px; height:32px; border-radius:50%; cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
  background:var(--bg-3); border:1px solid var(--border-2); color:var(--text-2); transition:background .15s, color .15s, border-color .15s;
}
.lr-arrow svg { width:15px; height:15px; }
.lr-arrow:hover:not(:disabled) { background:var(--olive); border-color:var(--olive); color:#fff; }
.lr-arrow:disabled { opacity:.35; cursor:default; }
/* The slot the card will drop into */
.lc-card.lr-dragging { opacity:.35; border:1.5px dashed var(--olive-light) !important; box-shadow:none !important; background:var(--olive-faint); }
.lc-card.lr-dragging > * { visibility:hidden; }
/* The card following the pointer */
.lr-ghost {
  position:fixed !important; top:0; left:0; z-index:2000; pointer-events:none; margin:0 !important;
  box-shadow:0 24px 50px rgba(0,0,0,.28), 0 0 0 2px var(--olive-light) !important; opacity:.97;
  transition:none; will-change:transform;
}
body.lr-no-select { user-select:none; -webkit-user-select:none; cursor:grabbing; }
.lr-ghost .lr-pos, .lr-ghost .lr-move { visibility:hidden; }
.lr-toggle.active { background:var(--olive) !important; color:#fff !important; border-color:var(--olive) !important; }

/* ── Toolbar above the cards (same on both tabs) ── */
.lists-toolbar {
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  margin:0 0 1.1rem; padding-bottom:12px; border-bottom:0.5px solid var(--border);
}
.lists-toolbar-label { display:flex; align-items:baseline; gap:10px; min-width:0; }
.lists-toolbar-title { font-family:var(--serif); font-size:13px; font-weight:500; letter-spacing:2.5px; text-transform:uppercase; color:var(--olive-light); white-space:nowrap; }
.lists-toolbar-count { font-size:12px; color:var(--text-3); white-space:nowrap; }
.lists-toolbar-count b { font-family:var(--bebas); font-weight:400; font-size:15px; color:var(--text-2); letter-spacing:.3px; }
.lists-toolbar .sort-bar { border-bottom:none; padding:0; margin:0; background:transparent; position:relative; backdrop-filter:none; -webkit-backdrop-filter:none; }
.lists-toolbar .sort-bar::before { content:none; }
.lists-empty { padding:3rem 1rem; text-align:center; font-size:13px; color:var(--text-3); }
</style>
</head>

<div class="page-wrap">

  <!-- Header -->
  <div class="cat-page-header fade-up">

  <!-- Social: search users, list names, item names -->

<!-- Custom List Modal -->
<div id="favCustomListModal" onclick="if(event.target===this)closeFavCustomListModal()">
  <div id="favCustomListCard">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
      <div style="font-family:var(--serif);font-size:20px;font-weight:500;color:var(--text);" id="favCustomListModalTitle">New List</div>
      <button onclick="closeFavCustomListModal()" style="background:none;border:none;color:var(--text-3);cursor:pointer;font-size:20px;line-height:1;">✕</button>
    </div>
    <div style="font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--olive-light);margin-bottom:8px;">List Title</div>
    <input id="favCustomListInput" type="text" maxlength="60" placeholder="e.g. Comfort Shows, Movies to Watch…"
      style="width:100%;box-sizing:border-box;padding:10px 14px;border-radius:var(--radius-sm);
             border:1px solid var(--border);background:var(--bg-3);color:var(--text);
             font-family:var(--sans);font-size:16px;outline:none;margin-bottom:18px;

    <textarea id="favCustomListDescInput" class="list-desc-field" maxlength="500" placeholder="What's this list about?" oninput="_listsUpdateWordCount('favCustomListDescInput','favCustomListDescCount')" style="margin-bottom:4px;"></textarea>

    <div style="font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--olive-light);margin-bottom:10px;">Ranking</div>

<script>
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function _favBreakdownHTML(e) {
  const isMovie = e.cat==='movies' || e.ratings?._media_type==='movie';
  if (!isMovie) {
    const bd = Array.isArray(e.ratings?._season_breakdown) ? e.ratings._season_breakdown.filter(n=>parseInt(n)>0).map(Number) : [];
    const totalS = bd.length || Number(e.total_seasons) || 0;
    if (totalS > 0) {
      let chips = '';
      for (let i=0; i<totalS; i++) chips += `<span class="popup-info-season-chip"><span class="popup-info-season-num">S${i+1}</span><span class="popup-info-season-eps">${bd[i]?bd[i]+' ep':'S'+(i+1)}</span></span>`;
      return `<div class="popup-info-block"><div class="popup-info-label">TV Show Breakdown</div><div style="display:flex;flex-wrap:wrap;">${chips}</div></div>`;
    }
    return '';
  } else {
    const rtH=Number(e.runtime_h)||0, rtM=Number(e.runtime_m)||0;
    return (rtH||rtM) ? `<div class="popup-info-block"><span class="popup-info-runtime"><span class="popup-info-runtime-val">${rtH?rtH+'h '+rtM+'m':rtM+'m'}</span><span class="popup-info-runtime-lbl">Runtime</span></span></div>` : '';
  }
}

function _buildCgDetailFav(e) {
  const score    = liveScore(e) != null ? Number(liveScore(e)).toFixed(2) : '—';
  const isMovies = e.cat === 'movies';
  const { core: coreArr, bonus: bonusArr } = getRatings(e.cat);
  const isAnimated = e.cat === 'anime' || e.cat === 'cartoons';

  const coreRows = coreArr.map(r => {
    const val = e.ratings?.[r.key];
    if (val == null || val === '') return '';
    return `<div class="fd-rating-row"><span class="fd-rating-label">${r.label}</span><span class="fd-rating-val">${Number(val).toFixed(2)}</span></div>`;
  }).filter(Boolean).join('');

  const animRow = (!isAnimated && e.ratings?.animation != null && e.ratings?.animation !== '')
    ? `<div class="fd-rating-row"><span class="fd-rating-label">Animation Quality</span><span class="fd-rating-val">${Number(e.ratings.animation).toFixed(2)}</span></div>` : '';

  const bonusRows = bonusArr.map(r => {
    const val = e.ratings?.[r.key];
    if (val == null || val === '') return '';
    return `<div class="fd-rating-row"><span class="fd-rating-label">${r.label}</span><span class="fd-rating-val">${Number(val).toFixed(2)}</span></div>`;
  }).filter(Boolean).join('');

  const favs = e.ratings?._favorites || {};
  const favChips = [
    favs.character ? `<span class="fav-chip"><span class="fav-chip-label">Fav Character</span>${esc(favs.character)}</span>` : '',
    (!isMovies && favs.episode) ? `<span class="fav-chip"><span class="fav-chip-label">Fav Episode</span>${esc(favs.episode)}</span>` : '',
    (!isMovies && favs.season)  ? `<span class="fav-chip"><span class="fav-chip-label">Fav Season</span>${esc(favs.season)}</span>` : '',
  ].filter(Boolean).join('');
  const lows = e.ratings?._lowlights || e.ratings?._favorites?._lowlights || {};
  const lowChips = [
    lows.character ? `<span class="fav-chip low-chip"><span class="fav-chip-label">Least Fav Character</span>${esc(lows.character)}</span>` : '',
    (!isMovies && lows.episode) ? `<span class="fav-chip low-chip"><span class="fav-chip-label">Least Fav Episode</span>${esc(lows.episode)}</span>` : '',
    (!isMovies && lows.season)  ? `<span class="fav-chip low-chip"><span class="fav-chip-label">Least Fav Season</span>${esc(lows.season)}</span>` : '',
  ].filter(Boolean).join('');

  return `${e.description ? `<div class="fd-description">${esc(e.description)}</div>` : ''}
  ${_favBreakdownHTML(e)}
  <div class="fd-cols">
    ${(coreRows||animRow) ? `<div class="fd-col"><div class="fd-section-hd">Core Ratings</div>${coreRows}${animRow}</div>` : ''}
    ${bonusRows ? `<div class="fd-col"><div class="fd-section-hd">Bonus Ratings</div>${bonusRows}</div>` : ''}
  </div>
  <div class="fd-final"><span>Final Score</span><strong>${score}</strong></div>
  ${favChips ? `<div class="fav-chips" style="margin-top:8px;">${favChips}</div>` : ''}
  ${lowChips ? `<div class="fav-chips" style="margin-top:6px;">${lowChips}</div>` : ''}
  ${e.notes ? `<div class="fd-notes">"${esc(e.notes)}"</div>` : ''}
  <a href="#" class="fd-edit-link" onclick="goToDetail('${e.id}','lists.html');return false;">Edit entry →</a>`;
}

function goToDetail(id, from) {
  sessionStorage.setItem('detailId', id);
  sessionStorage.setItem('detailFrom', from || 'lists.html');

// Runtime (movies) / season+episode count (shows) badge — same logic as
// category.js's _entryMeta(), inlined here since lists.html doesn't
// load category.js.
function _favEntryMeta(e) {
  const isMovie = e.cat === 'movies' || (e.ratings && e.ratings._media_type === 'movie');
  if (isMovie) {
    const rtH = Number(e.runtime_h) || 0, rtM = Number(e.runtime_m) || 0;
    if (rtH || rtM) return rtH ? `${rtH}h ${rtM}m` : `${rtM}m`;
    return '';
  }
  const bd = Array.isArray(e.ratings?._season_breakdown) ? e.ratings._season_breakdown.filter(n => parseInt(n) > 0) : [];
  if (bd.length) return `S${bd.length} · E${bd.reduce((s, n) => s + parseInt(n), 0)}`;
  if (e.total_seasons && e.total_eps) return `S${e.total_seasons} · E${e.total_eps}`;
  if (e.total_seasons) return `S${e.total_seasons}`;
  if (e.total_eps) return `${e.total_eps} eps`;
  return '';
}

// List items can be either a personal entry's UUID (existing behavior)
// or a bare "tmdb:movie:123" / "tmdb:tv:456" reference for something
// added straight from Discover, with no personal entry behind it at
// all. This is the one place that knows how to turn either shape into
// the same {id, title, poster_url, tmdb_id, tmdb_type, year} object
// every renderer already expects — so favCard/hScrollSection/social
// previews/list-view.html don't need to know the difference.
function _resolveListItem(id) {
  if (typeof id === 'string' && id.startsWith('tmdb:')) return _tmdbItemCache[id] || null;
  return _listsEntryMap[id] || null;
}

async function _hydrateTmdbItems(allLists) {
  const toFetch = new Set();
  (allLists || []).forEach(l => (l.items || []).forEach(id => {
    if (typeof id === 'string' && id.startsWith('tmdb:') && !_tmdbItemCache[id]) toFetch.add(id);
  }));
  await Promise.all([...toFetch].map(async pseudoId => {
    const [, type, tmdbId] = pseudoId.split(':');
    try {
      const res = await tmdbFetch(`${TMDB_BASE}/${type}/${tmdbId}?api_key=${TMDB_KEY}&language=en-US`);
      if (!res.ok) return;
      const d = await res.json();
      const title = type === 'movie' ? d.title : d.name;
      const dateStr = type === 'movie' ? d.release_date : d.first_air_date;
      _tmdbItemCache[pseudoId] = {
        id: pseudoId,
        title, poster_url: d.poster_path ? TMDB_FULL + d.poster_path : null,
        tmdb_id: Number(tmdbId), tmdb_type: type,
        year: (dateStr || '').split('-')[0],
        genres: (d.genres || []).map(g => g.name),
        cat: type === 'movie' ? 'movies' : 'tv',
      };
    } catch (e) { console.error('Hydrate TMDB item error:', pseudoId, e); }
  }));
}

async function loadListsPage() {
  const [entries, lists] = await Promise.all([
    getEntries(_listsUser.id),
    getFavoriteLists(_listsUser.id),
  ]);
  _listsEntries = entries || [];
  _listsAll = lists || [];
  await _loadCollabData();
  _listsEntryMap = Object.fromEntries(_listsEntries.map(e => [e.id, e]));
  // Lists imported before v560 can still hold another user's entry ids —
  // load those too so the imported list isn't shown with missing items.
  const foreignIds = [...new Set(_listsAll.flatMap(l => l.items || []))]
    .filter(id => !(typeof id === 'string' && id.startsWith('tmdb:')) && !_listsEntryMap[id]);
  if (foreignIds.length) {
    const { data: foreignRows } = await sb.from('entries').select('*').in('id', foreignIds);
    (foreignRows || []).forEach(e => { _listsEntryMap[e.id] = e; });
  }
  await _hydrateTmdbItems(_listsAll);

  await _ensureListSortOrder();
  renderListsPage();
}

// Custom lists (cat='custom') are already fetched ordered by created_at, so
// that's a stable baseline. Lists with a real sort_order move to that
// position; ones without one (not yet reordered) keep their created_at
// spot. If any are missing sort_order, backfill it once from the current
// order so future reorders have real values to work from everywhere,
// including profile.html/profile-view.html which just read this column.
async function _ensureListSortOrder() {
  const custom = _listsAll.filter(l => l.cat === 'custom' && !l._collab);
  custom.sort((a, b) => {
    const ao = a.sort_order, bo = b.sort_order;
    if (ao != null && bo != null) return ao - bo;
    if (ao != null) return -1;
    if (bo != null) return 1;
    return new Date(a.created_at) - new Date(b.created_at);
  });

  const needsBackfill = custom.some(l => l.sort_order == null);
  if (!needsBackfill) return;

  try {
    await Promise.all(custom.map((l, i) => {
      l.sort_order = i;
      return sb.from('favorite_lists').update({ sort_order: i }).eq('id', l.id).eq('user_id', _listsUser.id);
    }));
  } catch (e) { console.error('sort_order backfill error:', e); }
}

async function getFavoriteLists(userId) {
  const { data, error } = await sb.from('favorite_lists')
    .select('*')
    .eq('user_id', userId)
    .order('created_at', { ascending: true });
  if (error) { console.error('getFavoriteLists:', error); return []; }
  return data || [];
}

async function saveFavoriteList(list) {
  if (list.id) {
    const upd = { items: list.items, title: list.title };
    if (list.description !== undefined) upd.description = list.description;
    if (list.ranked !== undefined) upd.ranked = list.ranked;
    if (list.sort_mode !== undefined) upd.sort_mode = list.sort_mode;
    const { data, error } = await sb.from('favorite_lists')
      .update(upd)
      .eq('id', list.id)
      .eq('user_id', _listsUser.id)
      .select().single();
    if (error) throw error;
    return data;
  } else {
    const { data, error } = await sb.from('favorite_lists')
      .insert({ user_id: _listsUser.id, cat: list.cat, genre: list.genre, title: list.title, description: list.description || null, items: list.items || [], ranked: list.ranked ?? null, sort_mode: list.sort_mode ?? null })
      .select().single();
    if (error) throw error;
    return data;
  }
}

async function deleteFavoriteList(id) {

/* ══ Collaborative lists ══
   _listsCollab[listId] = [{ user_id, status, profile }] for lists I own.
   Lists other people shared with me (accepted) are added to _listsAll
   with _collab = true and _owner = their profile. */
let _listsCollab = {};

async function _loadCollabData() {
  _listsCollab = {};
  try {
    const myIds = _listsAll.filter(l => l.cat === 'custom').map(l => l.id);
    const [mineRes, sharedRes] = await Promise.all([
      myIds.length ? sb.from('list_collaborators').select('list_id, user_id, status').in('list_id', myIds).neq('status', 'declined') : { data: [] },
      sb.from('list_collaborators').select('list_id, sort_order').eq('user_id', _listsUser.id).eq('status', 'accepted'),
    ]);
    const sharedIds = (sharedRes.data || []).map(r => r.list_id);
    const sharedLists = sharedIds.length ? (await sb.from('favorite_lists').select('*').in('id', sharedIds)).data || [] : [];
    const peopleIds = [...new Set([...(mineRes.data || []).map(r => r.user_id), ...sharedLists.map(l => l.user_id)])];
    const people = peopleIds.length ? (await sb.from('profiles').select('id, username, display_name, avatar_url').in('id', peopleIds)).data || [] : [];
    const P = Object.fromEntries(people.map(p => [p.id, p]));
    (mineRes.data || []).forEach(r => { (_listsCollab[r.list_id] ||= []).push({ ...r, profile: P[r.user_id] || null }); });
    // A shared list sits where *I* put it (my own sort_order on the collaborator
    // row) — new ones default to the top. The owner's order never applies here.
    const myPos = Object.fromEntries((sharedRes.data || []).map(r => [r.list_id, r.sort_order]));
    sharedLists.forEach(l => { l._collab = true; l._owner = P[l.user_id] || null; l.sort_order = myPos[l.id] ?? -1; });
    _listsAll = _listsAll.filter(l => !l._collab).concat(sharedLists);
  } catch (e) { console.warn('Collab data load failed (run 021 SQL?):', e); }
}

async function _collabCopyLink() {
  const url = document.getElementById('collabLinkInput').value;

    try { await navigator.share({ title: `Join “${title}” on MyScreenScore`, url }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  try { await navigator.clipboard.writeText(url); }
  catch { const i = document.getElementById('collabLinkInput'); i.select(); document.execCommand('copy'); }

// Moves the card elements and animates everyone else sliding (FLIP)
function _lrAnimate(grid, mutate) {
  const cards = [...grid.querySelectorAll('.lc-card')];
  const before = new Map(cards.map(c => [c, c.getBoundingClientRect()]));
  mutate();
  cards.forEach(c => {
    if (c.classList.contains('lr-dragging')) return;
    const a = before.get(c), b = c.getBoundingClientRect();
    const dx = a.left - b.left, dy = a.top - b.top;
    if (!dx && !dy) return;
    c.style.transition = 'none';
    c.style.transform = `translate(${dx}px, ${dy}px)`;
    requestAnimationFrame(() => {
      c.style.transition = 'transform .28s cubic-bezier(.2,.8,.2,1)';
      c.style.transform = '';
    });
  });
}

function _lrRefreshPositions() {
  const cards = [...document.querySelectorAll('#lcGridMine > .lc-card')];
  cards.forEach((c, i) => {
    const pos = c.querySelector('.lr-pos'); if (pos) pos.textContent = i + 1;
    const [prev, next] = c.querySelectorAll('.lr-arrow');
    if (prev) prev.disabled = i === 0;
    if (next) next.disabled = i === cards.length - 1;
  });
}

function _lrMove(id, dir) {
  const grid = document.getElementById('lcGridMine');
  const card = grid && grid.querySelector(`.lc-card[data-list-id="${CSS.escape(id)}"]`);
  if (!card) return;
  const sib = dir < 0 ? card.previousElementSibling : card.nextElementSibling;
  if (!sib) return;
  _lrAnimate(grid, () => dir < 0 ? grid.insertBefore(card, sib) : grid.insertBefore(sib, card));
  _lrRefreshPositions();
  _lrSave(_lrCurrentOrder());
  card.querySelector(dir < 0 ? '.lr-arrow' : '.lr-arrow:last-child')?.focus();
}

function _lrPointerDown(ev, card) {
  if (ev.button !== undefined && ev.button !== 0) return;
  const grid = document.getElementById('lcGridMine');
  const rect = card.getBoundingClientRect();
  _lr = { card, grid, startX: ev.clientX, startY: ev.clientY, offX: ev.clientX - rect.left, offY: ev.clientY - rect.top,
          w: rect.width, h: rect.height, started: false, pointerId: ev.pointerId, order0: _lrCurrentOrder().join('|') };
  // Listen on window, not the card: the card moves around in the DOM while
  // dragging, and moving an element drops any pointer capture it had.
  window.addEventListener('pointermove', _lrPointerMove, { passive: false });
  window.addEventListener('pointerup', _lrPointerUp);
  window.addEventListener('pointercancel', _lrPointerUp);
}

function _lrStart() {
  const { card, w, h } = _lr;
  // Ghost follows the pointer; the real card stays in the grid as a placeholder
  const ghost = card.cloneNode(true);
  ghost.classList.add('lr-ghost');
  ghost.style.width = w + 'px'; ghost.style.height = h + 'px';
  document.body.appendChild(ghost);
  _lr.ghost = ghost;
  card.classList.add('lr-dragging');
  document.body.classList.add('lr-no-select');
  _lr.started = true;
  if (navigator.vibrate) { try { navigator.vibrate(8); } catch {} }
}

function _lrPointerMove(ev) {
  if (!_lr || (_lr.pointerId != null && ev.pointerId !== _lr.pointerId)) return;
  const dx = ev.clientX - _lr.startX, dy = ev.clientY - _lr.startY;
  if (!_lr.started) {
    if (Math.hypot(dx, dy) < 6) return;     // small wiggle = not a drag yet
    _lrStart();
  }
  ev.preventDefault();
  const { ghost, offX, offY, card, grid } = _lr;
  ghost.style.transform = `translate(${ev.clientX - offX}px, ${ev.clientY - offY}px) rotate(1.5deg) scale(1.03)`;

  // Auto-scroll near the top/bottom edge
  const edge = 80;
  _lr.scrollDir = ev.clientY < edge ? -1 : ev.clientY > window.innerHeight - edge ? 1 : 0;
  if (_lr.scrollDir && !_lr.scrollRAF) _lrAutoScroll();

  // Which card is under the pointer?
  ghost.style.display = 'none';
  const under = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('#lcGridMine .lc-card');
  ghost.style.display = '';
  if (!under || under === card) return;
  // Moving forward → drop after the hovered card; moving back → before it
  const cards = [...grid.querySelectorAll('.lc-card')];
  const ref = cards.indexOf(under) > cards.indexOf(card) ? under.nextElementSibling : under;
  _lrAnimate(grid, () => grid.insertBefore(card, ref));
  _lrRefreshPositions();
}

function _lrAutoScroll() {
  if (!_lr || !_lr.scrollDir) { if (_lr) _lr.scrollRAF = null; return; }
  window.scrollBy(0, _lr.scrollDir * 12);
  _lr.scrollRAF = requestAnimationFrame(_lrAutoScroll);
}

function _lrPointerUp() {
  if (!_lr) return;
  const { card, ghost, started, order0 } = _lr;
  window.removeEventListener('pointermove', _lrPointerMove);
  window.removeEventListener('pointerup', _lrPointerUp);
  window.removeEventListener('pointercancel', _lrPointerUp);
  if (_lr.scrollRAF) cancelAnimationFrame(_lr.scrollRAF);
  if (started) {
    // Ghost glides into the card's new slot, then disappears
    const r = card.getBoundingClientRect();
    ghost.style.transition = 'transform .22s cubic-bezier(.2,.8,.2,1)';
    ghost.style.transform = `translate(${r.left}px, ${r.top}px)`;
    setTimeout(() => { ghost.remove(); card.classList.remove('lr-dragging'); }, 220);
    document.body.classList.remove('lr-no-select');
    const order = _lrCurrentOrder();
    if (order.join('|') !== order0) _lrSave(order);
  }
  _lr = null;
}

   dropdown pattern used on friends.html/notes.html ── */
let _llTimer = null;
let _llActive = -1;
let _llResults = [];
let _llScrollY = 0;

function _llPosition() {
  const wrap = document.getElementById('listsSearchWrapInner');
  const drop = document.getElementById('llDropdown');
  if (!wrap || !drop) return;
  const r = wrap.getBoundingClientRect();
  drop.style.top = r.bottom + 'px';
  drop.style.left = r.left + 'px';
  drop.style.width = r.width + 'px';
  drop.style.position = 'fixed';
}

function _llLockScroll() {
  _llScrollY = window.scrollY;
  document.body.style.overflow = 'hidden';
  document.body.style.position = 'fixed';
  document.body.style.width = '100%';
  document.body.style.top = '-' + _llScrollY + 'px';
}

function _llUnlockScroll() {
  document.body.style.overflow = '';
  document.body.style.position = '';
  document.body.style.width = '';
  document.body.style.top = '';
  window.scrollTo(0, _llScrollY || 0);
}

async function _llSearch(val) {
  const q = val.trim().toLowerCase();
  const drop = document.getElementById('llDropdown');
  clearTimeout(_llTimer);
  _llActive = -1;
  if (q.length < 2) {
    drop.classList.remove('open');
    document.getElementById('listsSearchWrapInner')?.classList.remove('dd-connected-active');
    _llUnlockScroll();
    return;
  }
  _llPosition();
  drop.innerHTML = '<div class="ud-loading">Searching…</div>';
  drop.classList.add('open');
  document.getElementById('listsSearchWrapInner')?.classList.add('dd-connected-active');
  _llLockScroll();

  _llTimer = setTimeout(async () => {
    try {
      const { data: users } = await sb.from('profiles')
        .select('id, username, display_name, avatar_url')
        .ilike('username', q + '%')
        .neq('id', _listsUser?.id || '')
        .limit(5);

      const listMatches = _socialListsRaw
        .filter(l => (l.title || '').toLowerCase().includes(q))
        .slice(0, 5);

      const seenEntryTitles = new Set();
      const itemMatches = [];
      for (const l of _socialListsRaw) {
        for (const id of (l.items || [])) {
          const e = _resolveSocialItem(id);
          if (!e || !e.title) continue;
          const key = e.title.toLowerCase();
          if (!key.includes(q) || seenEntryTitles.has(key)) continue;
          seenEntryTitles.add(key);
          itemMatches.push(e);
          if (itemMatches.length >= 5) break;
        }
        if (itemMatches.length >= 5) break;
      }

      _llResults = [
        ...(users || []).map(u => ({ type: 'user', ...u })),
        ...listMatches.map(l => ({ type: 'list', ...l })),
        ...itemMatches.map(e => ({ type: 'item', ...e })),
      ];

      if (!_llResults.length) {
        drop.innerHTML = '<div class="ud-empty">No matches found</div>';
        return;
      }

      const reg = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      drop.innerHTML = _llResults.map((r, i) => {
        if (r.type === 'user') {
          const initial = (r.username[0] || '?').toUpperCase();
          const avatarHTML = safeURL(r.avatar_url)
            ? '<div class="ud-avatar"><img src="'+safeURL(r.avatar_url)+'" loading="lazy"></div>'
            : '<div class="ud-avatar">' + initial + '</div>';
          const highlighted = r.username.replace(reg, '<em>$1</em>');
          const display = r.display_name && r.display_name !== r.username ? r.display_name : '';
          return '<div class="ud-item" data-i="' + i + '" onmousedown="_llSelectResult(' + i + ')">'
            + avatarHTML
            + '<div class="ud-info"><div class="ud-username">@' + highlighted + '</div>'
            + (display ? '<div class="ud-display">' + display + '</div>' : '') + '</div>'
            + '<span class="ud-type-tag">User</span></div>';
        }
        if (r.type === 'list') {
          const initial = (r.title[0] || '?').toUpperCase();
          const highlighted = esc(r.title).replace(reg, '<em>$1</em>');
          return '<div class="ud-item" data-i="' + i + '" onmousedown="_llSelectResult(' + i + ')">'
            + '<div class="ud-avatar">' + initial + '</div>'
            + '<div class="ud-info"><div class="ud-username">' + highlighted + '</div>'
            + '<div class="ud-display">List by @' + esc(r.username || 'user') + '</div></div>'
            + '<span class="ud-type-tag">List</span></div>';
        }
        // item
        const avatarHTML = safeURL(r.poster_url)
          ? '<div class="ud-avatar"><img src="'+safeURL(r.poster_url)+'" loading="lazy"></div>'
          : '<div class="ud-avatar">' + ((r.title || '?')[0] || '?').toUpperCase() + '</div>';
        const highlighted = esc(r.title).replace(reg, '<em>$1</em>');
        return '<div class="ud-item" data-i="' + i + '" onmousedown="_llSelectResult(' + i + ')">'
          + avatarHTML
          + '<div class="ud-info"><div class="ud-username">' + highlighted + '</div>'
          + '<div class="ud-display">Appears in community lists</div></div>'
          + '<span class="ud-type-tag">Title</span></div>';
      }).join('');
    } catch (e) {
      console.error('Search error:', e);
      drop.innerHTML = '<div class="ud-empty">Error searching</div>';
    }
  }, 250);
}

function _llKeydown(e) {
  const drop = document.getElementById('llDropdown');
  const items = drop.querySelectorAll('.ud-item');
  if (!drop.classList.contains('open') || !items.length) return;
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    _llActive = Math.min(_llActive + 1, items.length - 1);
    items.forEach((el, i) => el.classList.toggle('ud-active', i === _llActive));
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    _llActive = Math.max(_llActive - 1, -1);
    items.forEach((el, i) => el.classList.toggle('ud-active', i === _llActive));
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (_llActive >= 0) _llSelectResult(_llActive);
  } else if (e.key === 'Escape') {
    drop.classList.remove('open'); _llActive = -1;
    document.getElementById('listsSearchWrapInner')?.classList.remove('dd-connected-active');
    _llUnlockScroll();
  }
}

document.addEventListener('click', e => {
  const dd = document.getElementById('llDropdown');
  if (dd && dd.classList.contains('open') && !e.target.closest('#listsSearchWrap') && !e.target.closest('#llDropdown')) {
    dd.classList.remove('open');
    document.getElementById('listsSearchWrapInner')?.classList.remove('dd-connected-active');
    _llUnlockScroll();
    _llActive = -1;
  }
});

function _llCloseDropdown() {
  document.getElementById('llDropdown').classList.remove('open');
  document.getElementById('listsSearchWrapInner')?.classList.remove('dd-connected-active');
  _llUnlockScroll();
  _llResults = []; _llActive = -1;
}

function _llSelectResult(i) {
  const r = _llResults[i];
  if (!r) return;
  document.getElementById('listsSearchInput').value = r.type === 'item' ? r.title : (r.username || r.title);
  _llCloseDropdown();

  if (r.type === 'user') {
    const lists = _socialListsRaw.filter(l => l.user_id === r.id);
    _listsFilterMode = { type: 'user', label: '@' + r.username, lists };
    _showListsFilterBanner(`Showing lists by @${esc(r.username)}`);
    renderSocialLists();
  } else if (r.type === 'list') {
    openSocialListPopup(r.id);
  } else if (r.type === 'item') {
    const lists = _socialListsRaw.filter(l => (l.items || []).includes(r.id));
    _listsFilterMode = { type: 'item', label: r.title, lists };
    _showListsFilterBanner(`Showing lists containing "${esc(r.title)}"`);
    renderSocialLists();
  }
}

function _showListsFilterBanner(text) {
  const banner = document.getElementById('listsFilterBanner');
  banner.style.display = 'flex';
  banner.innerHTML = `<span>${text}</span><button onclick="_llClearFilter()">Clear</button>`;
}

function _llClearFilter() {
  _listsFilterMode = null;
  document.getElementById('listsSearchInput').value = '';
  document.getElementById('listsFilterBanner').style.display = 'none';
  renderSocialLists();
}

function setSocialListsSort(val) { SF.setSort('social', 'all', val === 'latest' ? 'newest' : val); }

let _socialEntryMap = {}; // entry_id -> entry (across ALL social lists, not just the viewer's own)
function _resolveSocialItem(id) {
  if (typeof id === 'string' && id.startsWith('tmdb:')) return _tmdbItemCache[id] || null;
  return _socialEntryMap[id] || null;
}
let _listsFilterMode = null; // { type: 'user'|'item', label, ... }

async function loadSocialLists() {
  const wrap = document.getElementById('listsPageContent');
  wrap.innerHTML = `<div class="page-loading"><div class="spinner"></div></div>`;
  document.getElementById('listsPageStats').innerHTML = '';  // filled once the lists load
  document.getElementById('listsPageSub').textContent = 'Explore collections from the community and discover what others are watching.';
  try {
    const { data, error } = await sb.rpc('get_social_lists', { p_limit: 100 });
    if (error) throw error;
    _socialListsRaw = data || [];

    // Every list's item ids might belong to a DIFFERENT user than the
    // viewer — build a shared entry map covering all of them, not just
    // the viewer's own entries, or poster previews for other users'
    // lists would silently come up empty. Items added straight from
    // Discover (tmdb:movie:123 style, no personal entry at all) aren't
    // valid UUIDs, so they're excluded here and hydrated separately.
    const allItemIds = [...new Set(_socialListsRaw.flatMap(l => l.items || []))];
    const entryItemIds = allItemIds.filter(id => !(typeof id === 'string' && id.startsWith('tmdb:')));
    if (entryItemIds.length) {
      const { data: entryRows } = await sb.from('entries').select('*').in('id', entryItemIds);
      _socialEntryMap = {};
      (entryRows || []).forEach(e => { _socialEntryMap[e.id] = e; });
    }
    await _hydrateTmdbItems(_socialListsRaw);

    if (_listsUser && _socialListsRaw.length) {
      const listIds = _socialListsRaw.map(l => l.id);
      const { data: myReactions } = await sb.from('list_reactions')
        .select('list_id, is_like')
        .eq('user_id', _listsUser.id)
        .in('list_id', listIds);
      _socialListsMyReactions = {};
      (myReactions || []).forEach(r => { _socialListsMyReactions[r.list_id] = r.is_like ? 'like' : 'dislike'; });
    }
    renderSocialLists();
  } catch (err) {
    console.error('Load social lists error:', err);
    wrap.innerHTML = `<div class="empty" style="padding:3rem 1rem;text-align:center;color:var(--text-3);">Couldn't load social lists right now.</div>`;
  }
}

function renderSocialLists() {
  const wrap = document.getElementById('listsPageContent');
  const all = _socialListsRaw || [];
  const curators = new Set(all.map(l => l.user_id)).size;
  const titles = all.reduce((n, l) => n + (l.items || []).length, 0);
  const likes = all.reduce((n, l) => n + Number(l.like_count || 0), 0);
  document.getElementById('listsPageStats').innerHTML = all.length ? `
    <div class="page-stat"><div class="page-stat-num">${all.length}</div><div class="page-stat-label">Public Lists</div></div>
    <div class="page-stat"><div class="page-stat-num">${curators}</div><div class="page-stat-label">Curators</div></div>
    <div class="page-stat"><div class="page-stat-num">${titles}</div><div class="page-stat-label">Titles Listed</div></div>
    <div class="page-stat"><div class="page-stat-num">${likes}</div><div class="page-stat-label">Total Likes</div></div>` : '';

  const source = SF.list('social', 'all');
  const baseCount = (_listsFilterMode ? _listsFilterMode.lists : all).length;
  _renderListsToolbar(_listsFilterMode ? 'Search Results' : 'Community', source.length, baseCount ? SF.bar('social', 'all') : '');
  if (!baseCount) {
    wrap.innerHTML = `<div class="empty" style="padding:3rem 1rem;text-align:center;">
      <div class="empty-icon" style="opacity:.4;margin-bottom:1rem;">${icon('layers', 44)}</div>
      <div class="empty-text" style="color:var(--text-2);">${_listsFilterMode ? 'No lists match that search.' : 'No public lists yet.'}</div>
    </div>`;
    return;
  }
  if (!source.length) { wrap.innerHTML = `<div class="lists-empty">No lists match these filters.</div>`; return; }
  const sorted = source;

  wrap.innerHTML = `<div class="lc-grid">${sorted.map(l => {
    const items = l.items || [];
    const initial = (l.username || '?')[0].toUpperCase();
    const myReaction = _socialListsMyReactions[l.id];
    const id = attrJSON(l.id);
    return `<div class="lc-card" onclick="openSocialListPopup(${id})" ontouchend="_dtHandleTouch(event, 'list-${escHTML(l.id)}', () => reactToSocialList(${id}, true), () => _socialListsMyReactions[${id}] === 'like')">
      <div class="social-list-owner">
        <div class="social-list-avatar">${safeURL(l.avatar_url) ? `<img src="${safeURL(l.avatar_url)}" loading="lazy">` : esc(initial)}</div>
        <div class="social-list-username">@${esc(l.username || 'user')}</div>
      </div>
      <div class="lc-title-row"><div class="lc-title">${esc(l.title)}</div>${_rankBadge(l.ranked)}</div>
      <div class="lc-meta">${_lcCountHTML(items.length)}</div>
      ${_lcPostersHTML(items, _resolveSocialItem)}
      <div class="social-list-reactions">
        <button class="social-list-react-btn ${myReaction === 'like' ? 'active-like' : ''}" onclick="event.stopPropagation();reactToSocialList(${id}, true)">
          ${icon(myReaction === 'like' ? 'thumbsUpFilled' : 'thumbsUp', 14)} <span>${l.like_count || 0}</span>
        </button>
        <button class="social-list-react-btn ${myReaction === 'dislike' ? 'active-dislike' : ''}" onclick="event.stopPropagation();reactToSocialList(${id}, false)">
          ${icon(myReaction === 'dislike' ? 'thumbsDownFilled' : 'thumbsDown', 14)} <span>${l.dislike_count || 0}</span>
        </button>
      </div>
    </div>`;
  }).join('')}</div>`;
}

// Closes the popup, then runs an owner action (its own modal opens on top)
function _lpThen(fn) { const id = _slPopupListId; closeSocialListPopup(); fn(id); }

function _renderListPopup() {
  const mine = _slPopupKind === 'mine';
  const l = mine ? _listsAll.find(x => x.id === _slPopupListId) : _socialListsRaw.find(x => x.id === _slPopupListId);

  const maxPosters = shown.length > 8 ? 7 : 8;               // last tile becomes "+N"
  const posters = shown.slice(0, maxPosters);
  const extra = shown.length - posters.length;
  const isOwn = (mine && !l._collab) || l.user_id === _listsUser?.id;
  const id = attrJSON(l.id);

  let head;
  if (mine) {
    head = `<div class="lp-eyebrow">${l._collab ? 'Shared List' : 'Your List'}${l.forked_from ? '<span class="lp-tag">Imported</span>' : ''}</div>`;

    head = `<div class="social-list-owner" style="margin-bottom:0;">
      <div class="social-list-avatar">${safeURL(l.avatar_url) ? `<img src="${safeURL(l.avatar_url)}" loading="lazy">` : esc(initial)}</div>

    </div>`;
  }

  let actions;
  if (mine && l._collab) {
    // Collaborator: can add/remove titles and leave — never rename/delete
    actions = `<div id="lpPopupActions" class="lp-actions">
      <button class="popup-action-btn" style="flex:2 1 0;" onclick="_lpThen(openFavListPicker)">${_LIST_ICONS.edit}Edit Titles</button>
      <button class="popup-action-btn popup-action-danger" onclick="leaveSharedList(${id})">Leave</button>
    </div>`;
  } else if (mine) {
    actions = `<div id="lpPopupActions" class="lp-actions">
      <button class="popup-action-btn" onclick="_lpThen(openFavListPicker)">${_LIST_ICONS.edit}Edit Titles</button>
      <button class="popup-action-btn" onclick="_lpThen(openFavCustomListModal)">${_LIST_ICONS.rename}Rename</button>
      <button class="popup-action-btn" onclick="_lpThen(openCollabPicker)">${icon('users', 14)}Collaborate</button>
      <button class="popup-action-btn popup-action-danger" onclick="_lpThen(deleteFavListConfirm)" aria-label="Delete list">${_LIST_ICONS.del}</button>
    </div>`;
  } else {
    const myReaction = _socialListsMyReactions[l.id];
    const alreadyForked = _listsAll.some(x => x.cat === 'custom' && (x.forked_from === l.id || x.title.toLowerCase().trim() === (l.title || '').toLowerCase().trim()));
    const rerender = `.then(() => _renderListPopup())`;
    actions = `<div id="lpPopupActions" class="lp-actions lp-actions-social">
      <div class="lp-react-pair">
        <button class="popup-action-btn lp-react ${myReaction === 'like' ? 'is-on' : ''}" onclick="reactToSocialList(${id}, true)${rerender}" aria-label="Like">
          ${icon(myReaction === 'like' ? 'thumbsUpFilled' : 'thumbsUp', 14)}<span>${l.like_count || 0}</span>
        </button>
        <button class="popup-action-btn lp-react lp-react-down ${myReaction === 'dislike' ? 'is-on' : ''}" onclick="reactToSocialList(${id}, false)${rerender}" aria-label="Dislike">
          ${icon(myReaction === 'dislike' ? 'thumbsDownFilled' : 'thumbsDown', 14)}<span>${l.dislike_count || 0}</span>
        </button>
      </div>
      ${!isOwn ? `<button class="popup-action-btn lp-add" ${alreadyForked ? 'disabled' : ''} onclick="forkSocialList(${id})">${alreadyForked ? 'Added to My Lists ✓' : '+ Add to My Lists'}</button>` : ''}
    </div>`;
  }

  card.innerHTML = `
    <div class="lp-head">${head}<button class="lp-close" onclick="closeSocialListPopup()" aria-label="Close">${icon('x', 18)}</button></div>
    <div class="lp-title-row"><div class="lp-title">${esc(l.title)}</div>${_rankBadge(l.ranked)}</div>

    ${posters.length ? `<div class="lp-posters">
      ${posters.map(e => `<div class="lp-poster">${posterHTML(e, 'big')}</div>`).join('')}
      ${extra > 0 ? `<div class="lp-poster lp-more">+${extra}</div>` : ''}
    </div>` : ''}
    ${actions}
    <div id="lpNavPopupActions" class="lp-footer">
      <button class="popup-action-btn lp-view" onclick="closeSocialListPopup(); location.href='list-view.html?list=${encodeURIComponent(l.id)}'">${icon('list', 14)} View List</button>
      <button class="popup-action-btn lp-replies" onclick='openReplyPopup("list", ${id}, ${attrJSON(l.title)})'>${icon('reply', 14)} Replies</button>
    </div>
  `;
}
// Older callers
function _renderSocialListPopup() { _renderListPopup(); }

/* ── Replies popup — shared for notes and lists via `kind` ── */
const REPLY_CONFIG = {
  note: { table: 'note_replies', reactionTable: 'note_reply_reactions', rpc: 'get_note_replies', rpcParam: 'p_entry_id', col: 'entry_id' },
  list: { table: 'list_replies', reactionTable: 'list_reply_reactions', rpc: 'get_list_replies', rpcParam: 'p_list_id', col: 'list_id' },
};

let _replyKind = null;
let _replyTargetId = null;
let _replyRaw = [];
let _replySort = 'popular';
let _replyMyReactions = {};

function _injectReplyPopupOverlay() {
  if (document.getElementById('replyPopupOverlay')) return;
  const el = document.createElement('div');
  el.id = 'replyPopupOverlay';
  el.style.cssText = 'position:fixed;inset:0;z-index:920;background:rgba(0,0,0,0.75);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:24px;';
  el.innerHTML = `
    <div id="replyPopupCard" style="background:var(--bg-3);border:0.5px solid var(--border);border-radius:var(--radius-lg);max-width:520px;width:100%;max-height:85vh;display:flex;flex-direction:column;overflow:hidden;">
      <div style="padding:1.5rem 1.5rem 1rem;flex-shrink:0;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem;">
          <div style="font-family:var(--serif);font-size:20px;font-weight:400;">Replies</div>
          <button onclick="closeReplyPopup()" style="background:none;border:none;color:var(--text-3);font-size:18px;cursor:pointer;line-height:1;">&#x2715;</button>
        </div>
        <div id="replyPopupSubtitle" style="font-size:12.5px;color:var(--text-3);margin-bottom:1rem;"></div>
        <div style="display:flex;gap:6px;margin-bottom:.75rem;">
          <button class="sort-btn active" data-sort="popular" onclick="_replySetSort('popular')">Popular</button>
          <button class="sort-btn" data-sort="latest" onclick="_replySetSort('latest')">Latest</button>
        </div>
      </div>
      <div id="replyList" style="flex:1;overflow-y:auto;padding:0 1.5rem;"></div>
      <div id="replyComposer" style="padding:1rem 1.5rem 1.5rem;flex-shrink:0;border-top:0.5px solid var(--border);margin-top:.5rem;">
        <textarea id="replyInput" class="field-input" maxlength="1000" placeholder="Add a reply…" style="width:100%;min-height:60px;resize:vertical;box-sizing:border-box;margin-bottom:8px;"></textarea>
        <button class="snote-rect-btn" style="width:100%;" onclick="_replySubmit()">Post Reply</button>
      </div>
    </div>`;
  el.addEventListener('click', e => { if (e.target === el) closeReplyPopup(); });
  document.body.appendChild(el);
}

async function openReplyPopup(kind, targetId, title) {
  _replyKind = kind;
  _replyTargetId = targetId;
  _injectReplyPopupOverlay();
  document.getElementById('replyPopupSubtitle').textContent = title ? `On "${title}"` : '';
  document.getElementById('replyList').innerHTML = '<div class="page-loading" style="padding:1rem"><div class="spinner"></div></div>';
  const composer = document.getElementById('replyComposer');
  composer.style.display = (typeof _notesUser !== 'undefined' && _notesUser) || (typeof _listsUser !== 'undefined' && _listsUser) ? '' : 'none';

  const ov = document.getElementById('replyPopupOverlay');
  ov.style.display = 'flex';
  document.body.style.overflow = 'hidden';

  await _replyLoad();
}

function closeReplyPopup() {
  const ov = document.getElementById('replyPopupOverlay');
  if (ov) ov.style.display = 'none';
  document.body.style.overflow = '';
  _replyKind = null;
  _replyTargetId = null;
}

function _replySetSort(mode) {
  _replySort = mode;
  document.querySelectorAll('#replyPopupCard .sort-btn').forEach(b => b.classList.toggle('active', b.dataset.sort === mode));
  _replyRenderList();
}

function _currentUserForReplies() {
  return (typeof _notesUser !== 'undefined' && _notesUser) || (typeof _listsUser !== 'undefined' && _listsUser) || null;
}

async function _replyLoad() {
  const cfg = REPLY_CONFIG[_replyKind];
  const listEl = document.getElementById('replyList');
  try {
    const params = {}; params[cfg.rpcParam] = _replyTargetId;
    const { data, error } = await sb.rpc(cfg.rpc, params);
    if (error) throw error;
    _replyRaw = data || [];

    const user = _currentUserForReplies();
    if (user && _replyRaw.length) {
      const replyIds = _replyRaw.map(r => r.id);
      const { data: myReactions } = await sb.from(cfg.reactionTable)
        .select('reply_id, is_like').eq('user_id', user.id).in('reply_id', replyIds);
      _replyMyReactions = {};
      (myReactions || []).forEach(r => { _replyMyReactions[r.reply_id] = r.is_like ? 'like' : 'dislike'; });
    } else {
      _replyMyReactions = {};
    }
    _replyRenderList();
  } catch (err) {
    console.error('Load replies error:', err);
    listEl.innerHTML = '<div class="empty" style="padding:2rem 1rem;text-align:center;color:var(--text-3);">Couldn\'t load replies right now.</div>';
  }
}

function _replyRenderList() {
  const listEl = document.getElementById('replyList');
  if (!_replyRaw.length) {
    listEl.innerHTML = '<div class="empty" style="padding:2rem 1rem;text-align:center;color:var(--text-3);">No replies yet — be the first to say something.</div>';
    return;
  }
  const sorted = [..._replyRaw].sort((a, b) => {
    if (_replySort === 'latest') return new Date(b.created_at) - new Date(a.created_at);
    const scoreA = Number(a.like_count) - Number(a.dislike_count);
    const scoreB = Number(b.like_count) - Number(b.dislike_count);
    if (scoreB !== scoreA) return scoreB - scoreA;
    return new Date(b.created_at) - new Date(a.created_at);
  });
  listEl.innerHTML = sorted.map(r => {
    const myReaction = _replyMyReactions[r.id];
    const initial = (r.username || '?')[0].toUpperCase();
    const dateStr = r.created_at ? new Date(r.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '';

async function _replyReact(replyId, isLike) {
  const user = _currentUserForReplies();
  if (!user) { showToast('Sign in to react to replies.', 'err'); return; }
  const cfg = REPLY_CONFIG[_replyKind];
  const r = _replyRaw.find(x => x.id === replyId);
  if (!r) return;
  const current = _replyMyReactions[replyId];
  const wantsSame = (current === 'like' && isLike) || (current === 'dislike' && !isLike);

  // Optimistic: update + render immediately, roll back on failure.
  const prevReaction = current;
  const prevLike = r.like_count;
  const prevDislike = r.dislike_count;

  if (wantsSame) {
    delete _replyMyReactions[replyId];
    if (current === 'like') r.like_count = Math.max(0, Number(r.like_count) - 1);
    else r.dislike_count = Math.max(0, Number(r.dislike_count) - 1);
  } else {
    if (current === 'like') r.like_count = Math.max(0, Number(r.like_count) - 1);
    if (current === 'dislike') r.dislike_count = Math.max(0, Number(r.dislike_count) - 1);
    if (isLike) r.like_count = Number(r.like_count) + 1;
    else r.dislike_count = Number(r.dislike_count) + 1;
    _replyMyReactions[replyId] = isLike ? 'like' : 'dislike';
  }
  _replyRenderList();

  try {
    if (wantsSame) {
      const { error } = await sb.from(cfg.reactionTable).delete().eq('reply_id', replyId).eq('user_id', user.id);
      if (error) throw error;
    } else {
      const { error } = await sb.from(cfg.reactionTable)
        .upsert({ reply_id: replyId, user_id: user.id, is_like: isLike }, { onConflict: 'reply_id,user_id' });
      if (error) throw error;
    }
  } catch (err) {
    console.error('React to reply error:', err);
    if (prevReaction) _replyMyReactions[replyId] = prevReaction; else delete _replyMyReactions[replyId];
    r.like_count = prevLike;
    r.dislike_count = prevDislike;
    _replyRenderList();
    showToast(isRateLimitError(err) ? RATE_LIMIT_MESSAGE : 'Failed to save your reaction.', 'err');
  }
}

async function _replySubmit() {
  const user = _currentUserForReplies();

  }
}

// 50-word cap on description fields. _listsGuardWordLimit blocks further
// typing once the limit is reached (deletions and replacing a selection
// still work) instead of letting extra words in and yanking them back
// after the fact. _listsUpdateWordCount stays as a safety-net fallback
// for input paths that bypass beforeinput (e.g. some IME flows).
function _listsCountWords(s) {
  return s.trim() ? s.trim().split(/\s+/).length : 0;
}
function _listsUpdateWordCount(inputId, countId) {
  const el = document.getElementById(inputId);
  const words = el.value.trim().split(/\s+/).filter(Boolean);
  const countEl = document.getElementById(countId);
  if (words.length > 50) {
    el.value = words.slice(0, 50).join(' ');
    if (countEl) { countEl.textContent = 'Reached max word limit (50/50 words)'; countEl.classList.add('over'); }
    return;
  }
  const count = words.length;
  if (countEl) {
    countEl.textContent = `${count} / 50 words`;
    countEl.classList.toggle('over', count >= 50);
  }
}
function _listsGuardWordLimit(inputId, countId) {
  const el = document.getElementById(inputId);
  if (!el || el.dataset.wordLimitGuarded) return;
  el.dataset.wordLimitGuarded = '1';
  el.addEventListener('beforeinput', e => {
    if (e.inputType && e.inputType.startsWith('delete')) return;
    if (el.selectionStart !== el.selectionEnd) return;
    const count = el.value.trim() ? el.value.trim().split(/\s+/).length : 0;
    if (count >= 50) {
      e.preventDefault();
      const countEl = document.getElementById(countId);
      if (countEl) { countEl.textContent = 'Reached max word limit (50/50 words)'; countEl.classList.add('over'); }
    }
  });
}
