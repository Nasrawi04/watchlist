<style>
/* a title's place in a list, on the Community "lists with this title" results */
.ll-pos { margin-inline-start:8px; padding:1px 8px; border-radius:4px; background:var(--olive-faint); color:var(--olive-light); font-size:11px; font-weight:700; }

/* ── Reorder mode ── */
.lr-hint {
  display:flex; align-items:center; gap:8px; margin:-2px 0 14px; padding:10px 14px;
  font-size:12.5px; color:var(--text-2); background:var(--olive-faint); border:1px dashed var(--border-olive); border-radius:var(--radius-sm);
}
.lr-hint svg { color:var(--olive-light); flex-shrink:0; }
.lc-card.lc-reorder { cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none; }
.lc-card.lc-reorder:hover { transform:none; }
.lc-card.lc-reorder:active { cursor:grabbing; }
.lc-grid-reorder .lc-card { box-shadow:0 0 0 1px var(--border-olive); }
.lc-grid-reorder .lc-card .lc-cover { opacity:.75; }
.lc-grid-reorder .lc-more { display:none; }
.lr-bar {
  display:flex; align-items:center; gap:8px; margin:-4px -4px 10px; padding:4px 4px 10px;
  border-bottom:0.5px dashed var(--border-olive);
}
.lr-grip { width:20px; height:20px; color:var(--olive-light); display:inline-flex; }
.lr-grip svg { width:100%; height:100%; }
.lr-pos {
  font-family:var(--bebas); font-size:16px; line-height:1; color:var(--text-on-brand); background:var(--olive);
  min-width:24px; height:24px; padding:0 6px; border-radius:999px; display:inline-flex; align-items:center; justify-content:center;
}
.lr-move { margin-inline-start:auto; display:flex; gap:6px; }
.lr-arrow {
  width:32px; height:32px; border-radius:50%; cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
  background:var(--bg-3); border:1px solid var(--border-2); color:var(--text-2); transition:background .15s, color .15s, border-color .15s;
}
.lr-arrow svg { width:15px; height:15px; }
.lr-arrow:hover:not(:disabled) { background:var(--olive); border-color:var(--olive); color:var(--text-on-brand); }
.lr-arrow:disabled { opacity:.35; cursor:default; }
/* The slot the card will drop into */
.lc-card.lr-dragging { opacity:.35; border:1.5px dashed var(--olive-light) !important; box-shadow:none !important; background:var(--olive-faint); }
.lc-card.lr-dragging > * { visibility:hidden; }
/* The card following the pointer */
.lr-ghost {
  position:fixed !important; top:0; inset-inline-start:0; z-index:2000; pointer-events:none; margin:0 !important;
  box-shadow:0 0 0 2px var(--olive-light) !important; opacity:.97;
  transition:none; will-change:transform;
}
body.lr-no-select { user-select:none; -webkit-user-select:none; cursor:grabbing; }
.lr-ghost .lr-pos, .lr-ghost .lr-move { visibility:hidden; }
.lr-toggle.active { background:var(--olive) !important; color:var(--text-on-brand) !important; border-color:var(--olive) !important; }

</style>

<script>
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }


let _listsUser = null;
let _listsEntries = [];
let _listsAll = [];

let _listsEntryMap = {};
// List items can be either a personal entry's UUID (existing behavior)
// or a bare "tmdb:movie:123" / "tmdb:tv:456" reference for something
// added straight from Discover, with no personal entry behind it at
// all. This is the one place that knows how to turn either shape into
// the same {id, title, poster_url, tmdb_id, tmdb_type, year} object
// every renderer already expects — so hScrollSection/social
// previews/list-view.html don't need to know the difference.
function _resolveListItem(id) {
  if (typeof id === 'string' && id.startsWith('tmdb:')) return MSSList.tmdb(id);
  return _listsEntryMap[id] || null;
}

let _listsMode = mssViewOf();   let _socialListsRaw = [];
let _socialListsMyReactions = {}; // list_id -> 'like' | 'dislike'

// Returning via browser back/forward can restore this page from the
// bfcache with stale data (e.g. an entry just added/edited elsewhere
// wouldn't show up here) instead of re-running this page's scripts.
window.addEventListener('pageshow', (event) => {
  if (event.persisted && mssDataChangedSince(window._mssPageAt)) location.reload();   // only if something changed since (config.js)
});

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('listsModeWrap').innerHTML = mssViewToggleHTML('listsModeToggle', 'Whose lists', _listsMode, 'setListsMode');
  _listsTools(); _listsViews();
  initPage(async (user) => {
    const q = new URLSearchParams(location.search);
    // Guests can look through Community lists; their own lists need an account
    if (!user && _listsMode !== 'community') {
      document.querySelector('.page-wrap').innerHTML = mssGuestEmpty('lists');
      return;
    }
    if (!user) { setListsMode('community'); return; }
    _listsUser = user;
    if (q.get('new')) { location.replace(MSSListActions.newURL()); return; }   // (+) → New list, from another page: the editor
    if (_listsMode !== 'mine') setListsMode(_listsMode);
    await loadListsPage();
  });
});
// New list → the list page's editor (list-view.html?new=1)
function _listsNew() { if (!mssGuestGate('make lists')) location.href = MSSListActions.newURL(); }

/* The toolbar for the view: its search (Community: people, lists and titles, from the server — the
   dropdown below) and its Sort / Filter; Reorder sits beside Sort on your own lists (renderListsPage) */
function _listsTools() {
  const scope = { mine: 'listsOrder', friends: 'listsFriends', community: 'social' }[_listsMode];
  document.getElementById('listsSearch').innerHTML = _listsMode === 'community'
    ? `<div id="listsSearchWrap"><div class="sf-search" id="listsSearchWrapInner" role="search">
        <span class="sf-search-ic" aria-hidden="true">${icon('search', 16)}</span>
        <input type="search" id="listsSearchInput" class="sf-search-input" placeholder="Search lists, people or titles…" aria-label="Search lists, people or titles"
          autocomplete="off" spellcheck="false" enterkeyhint="search" oninput="_llSearch(this.value)" onkeydown="_llKeydown(event)"></div></div>`
    : SF.searchHTML(scope, _listsMode === 'friends' ? 'Search your friends’ lists…' : 'Search your lists…');
  _listsBar(SF.bar(scope, 'all'));
}
function _listsBar(html) { document.getElementById('listsBar').innerHTML = html || ''; }
// Under 1200px: Mine / Friends / Community as the Library's status tabs (Mine with its count)
function _listsViews() {
  document.getElementById('listsViews').innerHTML = mssViewTabsHTML('Whose lists', _listsMode, 'setListsMode', 'lists',
    _listsUser ? _listsAll.filter(l => l.cat === 'custom').length : null);
}
const _nWord = (n, one) => `${Number(n).toLocaleString(MSSI18n.locale)} ${n === 1 ? one : one + 's'}`;

/* Personal loads first and shows as soon as YOUR lists + entries arrive.
   Shared lists, other people's entries and titles added from Discover
   (TMDB lookups — cached on the device) fill in right after, each with a
   quick re-render. Community data is fetched quietly in the background so
   switching tabs is instant. */
async function loadListsPage() {
  const [entries, lists] = await Promise.all([
    getEntries(_listsUser.id),
    getFavoriteLists(_listsUser.id),
  ]);
  _listsEntries = entries || [];
  _listsAll = lists || [];
  _listsEntryMap = Object.fromEntries(_listsEntries.map(e => [e.id, e]));
  if (_listsMode === 'mine') renderListsPage();            // ← first paint

  _ensureListSortOrder().catch(() => {});                       // one-off backfill, no need to wait
  await _loadCollabData();
  await _loadLikedLists();
  // Items that aren't in my library: shared lists' entries, older imports
  const foreignIds = [...new Set(_listsAll.flatMap(l => l.items || []))]
    .filter(id => !(typeof id === 'string' && id.startsWith('tmdb:')) && !_listsEntryMap[id]);
  if (foreignIds.length) {
    const { data: foreignRows } = await sb.from('entries').select('*').in('id', foreignIds);
    (foreignRows || []).forEach(e => { _listsEntryMap[e.id] = e; });
    await mssFillHiddenListItems(foreignIds, _listsEntryMap);   // a collaborator's hidden title (073)
  }
  if (_listsMode === 'mine') renderListsPage();
  const hydrated = await MSSList.hydrate(_listsAll);
  if ((await _listsKeepOrder() || hydrated) && _listsMode === 'mine') renderListsPage();

  _mssIdle(() => _fetchSocialLists());                         // warm up Community
}

// Your lists set to an order (Ratings Highest, Date Watched…) are put back in it — a score
// changed since (on another page, another device) moves the title to its place — and saved.
// Returns true when any list moved. (Changes from now on are re-sorted as they're saved: db.js.)
async function _listsKeepOrder() {
  let moved = false;
  for (const l of _listsAll.filter(l => !l._collab && l.sort_mode && l.sort_mode !== 'picked')) {
    if (!MSSOrder.reorder(l, l.sort_mode, _resolveListItem)) continue;
    moved = true;
    await sb.from('favorite_lists').update({ items: l.items }).eq('id', l.id).eq('user_id', _listsUser.id);
  }
  return moved;
}

// Runs a task once the browser is idle (or after a short delay)
function _mssIdle(fn) { ('requestIdleCallback' in window) ? requestIdleCallback(fn, { timeout: 2500 }) : setTimeout(fn, 1200); }

// Custom lists (cat='custom') are already fetched ordered by created_at, so
// that's a stable baseline. Lists with a real sort_order move to that
// position; ones without one (not yet reordered) keep their created_at
// spot. If any are missing sort_order, backfill it once from the current
// order so future reorders have real values to work from everywhere,
// including profile.html/profile-view.html which just read this column.
async function _ensureListSortOrder() {
  const custom = _listsAll.filter(l => l.cat === 'custom' && !l._collab);
  custom.sort((a, b) => {
    const ao = a.sort_order, bo = b.sort_order;
    if (ao != null && bo != null) return ao - bo;
    if (ao != null) return -1;
    if (bo != null) return 1;
    return new Date(a.created_at) - new Date(b.created_at);
  });

  const needsBackfill = custom.some(l => l.sort_order == null);
  if (!needsBackfill) return;

  try {
    await Promise.all(custom.map((l, i) => {
      l.sort_order = i;
      return sb.from('favorite_lists').update({ sort_order: i }).eq('id', l.id).eq('user_id', _listsUser.id);
    }));
  } catch (e) { console.error('sort_order backfill error:', e); }
}

async function getFavoriteLists(userId) {
  const { data, error } = await sb.from('favorite_lists')
    .select('*')
    .eq('user_id', userId)
    .order('created_at', { ascending: true });
  if (error) { console.error('getFavoriteLists:', error); return []; }
  return data || [];
}

/* ══ Reorder lists (drag, or arrows) ══
   Tap "Reorder" → cards get a grip bar; drag any card (mouse or finger)
   and the others slide out of the way (FLIP animation). Arrows do the
   same one step at a time (and work with the keyboard). Every change
   saves on its own. Only available on the Default order with no filters,
   since that's the order being edited. */
let _listsReorder = false;
let _lr = null;       // active drag state

/* ══ Collaborative lists ══
   _listsCollab[listId] = [{ user_id, status, profile }] for lists I own.
   Lists other people shared with me (accepted) are added to _listsAll
   with _collab = true and _owner = their profile. */
let _listsCollab = {};

/* Liked Lists: lists you liked. Your own are already here; other people's only join the page
   while that filter is on, and open their list page like any other. */
let _listsLikedIds = new Set(), _listsLikedOther = [];
async function _loadLikedLists() {
  try {
    const { data } = await sb.from('list_reactions').select('list_id').eq('user_id', _listsUser.id).eq('is_like', true);
    _listsLikedIds = new Set((data || []).map(r => r.list_id));
    const known = new Set(_listsAll.map(l => l.id)), ids = [..._listsLikedIds].filter(id => !known.has(id));
    const lists = ids.length ? ((await sb.from('favorite_lists').select('*').in('id', ids)).data || []).filter(l => l.cat === 'custom') : [];
    const people = lists.length ? (await sb.from('profiles').select('id, username, display_name, avatar_url').in('id', [...new Set(lists.map(l => l.user_id))])).data || [] : [];
    const P = Object.fromEntries(people.map(p => [p.id, p]));
    _listsLikedOther = lists.map(l => ({ ...l, _likedOther: true, _owner: P[l.user_id] || null }));
    const need = [...new Set(lists.flatMap(l => l.items || []))].filter(id => !MSSList.isTmdbId(id) && !_listsEntryMap[id]);
    if (need.length) {
      ((await sb.from('entries').select('*').in('id', need)).data || []).forEach(e => { _listsEntryMap[e.id] = e; });
      await mssFillHiddenListItems(need, _listsEntryMap);
    }
    await MSSList.hydrate(_listsLikedOther);
  } catch (e) { console.warn('Liked lists:', e); }
}
document.addEventListener('mss:list-reacted', async () => {
  if (!_listsUser) return;
  await _loadLikedLists();
  if (_listsMode === 'mine') renderListsPage();
});
const _listTypeTests = {
  mine: l => !l._likedOther && !l._collab && !l.forked_from,
  liked: l => _listsLikedIds.has(l.id),
  collab: l => !!l._collab || (_listsCollab[l.id] || []).some(c => c.status === 'accepted'),
  imported: l => !l._likedOther && !l._collab && !!l.forked_from,
};

async function _loadCollabData() {
  _listsCollab = {};
  try {
    const myIds = _listsAll.filter(l => l.cat === 'custom').map(l => l.id);
    const [mineRes, sharedRes] = await Promise.all([
      myIds.length ? sb.from('list_collaborators').select('list_id, user_id, status').in('list_id', myIds).neq('status', 'declined') : { data: [] },
      sb.from('list_collaborators').select('list_id, sort_order').eq('user_id', _listsUser.id).eq('status', 'accepted'),
    ]);
    const sharedIds = (sharedRes.data || []).map(r => r.list_id);
    const sharedLists = sharedIds.length ? (await sb.from('favorite_lists').select('*').in('id', sharedIds)).data || [] : [];
    const peopleIds = [...new Set([...(mineRes.data || []).map(r => r.user_id), ...sharedLists.map(l => l.user_id)])];
    const people = peopleIds.length ? (await sb.from('profiles').select('id, username, display_name, avatar_url').in('id', peopleIds)).data || [] : [];
    const P = Object.fromEntries(people.map(p => [p.id, p]));
    (mineRes.data || []).forEach(r => { (_listsCollab[r.list_id] ||= []).push({ ...r, profile: P[r.user_id] || null }); });
    // A shared list sits where *I* put it (my own sort_order on the collaborator
    // row) — new ones default to the top. The owner's order never applies here.
    const myPos = Object.fromEntries((sharedRes.data || []).map(r => [r.list_id, r.sort_order]));
    sharedLists.forEach(l => { l._collab = true; l._owner = P[l.user_id] || null; l.sort_order = myPos[l.id] ?? -1; });
    _listsAll = _listsAll.filter(l => !l._collab).concat(sharedLists);
  } catch (e) { console.warn('Collab data load failed (run 021 SQL?):', e); }
}


/* Live: when someone accepts or declines one of my invites (their notification arrives in
   real time), the cards' collaborator lines follow without a reload (the panel: list-actions.js) */
document.addEventListener('mss:notifications', async ev => {
  const relevant = (ev.detail.arrived || []).some(n => n.type === 'list_invite_accepted' || n.type === 'list_invite_declined');
  if (!relevant || !_listsUser) return;
  await _loadCollabData();
  if (_listsMode === 'mine') renderListsPage();
});

function toggleListsReorder() {
  if (!_listsReorder) {
    const ok = SF.getSort('listsOrder', 'all') === 'rank' && SF.filterCount('listsOrder', 'all') === 0;
    if (!ok) {
      SF.restoreState('listsOrder', 'all', { sort: 'rank', filter: { genres: [], choice: {} } });
      showToast('Switched to Default order so you can rearrange it.');
    }
  }
  _listsReorder = !_listsReorder;
  renderListsPage();
}

function _lrCurrentOrder() {
  return [...document.querySelectorAll('#lcGridMine > .lc-card')].map(c => c.dataset.listId);
}

let _lrSaveTimer = null;
function _lrSave(order) {
  // Update locally right away, then persist (debounced so fast moves = one save)
  order.forEach((id, i) => { const l = _listsAll.find(x => x.id === id); if (l) l.sort_order = i; });
  clearTimeout(_lrSaveTimer);
  _lrSaveTimer = setTimeout(async () => {
    try {
      // One call saves my own lists AND my personal position for shared ones
      const { error } = await sb.rpc('set_my_list_order', { p_ids: order });
      if (error) throw error;
      showToast('Order saved');
    } catch (e) {
      console.error('Reorder save error:', e);
      showToast('Could not save the new order — try again.', 'err');
    }
  }, 450);
}

// Moves the card elements and animates everyone else sliding (FLIP): each card starts from where it
// is on screen right now (mid-slide too), so a quick run of moves stays smooth instead of jumping
function _lrAnimate(grid, mutate) {
  const cards = [...grid.querySelectorAll('.lc-card')];
  const before = new Map(cards.map(c => [c, c.getBoundingClientRect()]));
  mutate();
  const moved = [];
  cards.forEach(c => {
    if (c.classList.contains('lr-dragging')) return;
    c.style.transition = 'none'; c.style.transform = '';
    const a = before.get(c), b = c.getBoundingClientRect();
    const dx = a.left - b.left, dy = a.top - b.top;
    if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
    c.style.transform = `translate(${dx}px, ${dy}px)`;
    moved.push(c);
  });
  if (!moved.length) return;
  grid.offsetWidth;   // apply the start positions in one go, then slide all together
  moved.forEach(c => { c.style.transition = 'transform .24s cubic-bezier(.2,.8,.2,1)'; c.style.transform = ''; });
}

function _lrRefreshPositions() {
  const cards = [...document.querySelectorAll('#lcGridMine > .lc-card')];
  cards.forEach((c, i) => {
    const pos = c.querySelector('.lr-pos'); if (pos) pos.textContent = i + 1;
    const [prev, next] = c.querySelectorAll('.lr-arrow');
    if (prev) prev.disabled = i === 0;
    if (next) next.disabled = i === cards.length - 1;
  });
}

function _lrMove(id, dir) {
  const grid = document.getElementById('lcGridMine');
  const card = grid && grid.querySelector(`.lc-card[data-list-id="${CSS.escape(id)}"]`);
  if (!card) return;
  const sib = dir < 0 ? card.previousElementSibling : card.nextElementSibling;
  if (!sib) return;
  _lrAnimate(grid, () => dir < 0 ? grid.insertBefore(card, sib) : grid.insertBefore(sib, card));
  _lrRefreshPositions();
  _lrSave(_lrCurrentOrder());
  card.querySelector(dir < 0 ? '.lr-arrow' : '.lr-arrow:last-child')?.focus();
}

function _lrPointerDown(ev, card) {
  if (ev.button !== undefined && ev.button !== 0) return;
  const grid = document.getElementById('lcGridMine');
  const rect = card.getBoundingClientRect();
  _lr = { card, grid, startX: ev.clientX, startY: ev.clientY, offX: ev.clientX - rect.left, offY: ev.clientY - rect.top,
          w: rect.width, h: rect.height, started: false, pointerId: ev.pointerId, order0: _lrCurrentOrder().join('|') };
  // Listen on window, not the card: the card moves around in the DOM while
  // dragging, and moving an element drops any pointer capture it had.
  window.addEventListener('pointermove', _lrPointerMove, { passive: false });
  window.addEventListener('pointerup', _lrPointerUp);
  window.addEventListener('pointercancel', _lrPointerUp);
}

function _lrStart() {
  const { card, w, h } = _lr;
  // Ghost follows the pointer; the real card stays in the grid as a placeholder
  const ghost = card.cloneNode(true);
  ghost.classList.add('lr-ghost');
  ghost.style.width = w + 'px'; ghost.style.height = h + 'px';
  document.body.appendChild(ghost);
  _lr.ghost = ghost;
  card.classList.add('lr-dragging');
  document.body.classList.add('lr-no-select');
  // The grid's slots (page coordinates) — fixed while dragging, so where the card goes depends only on
  // the pointer, never on cards that are still sliding (that was the jitter)
  const cards = [..._lr.grid.querySelectorAll('.lc-card')];
  _lr.slots = cards.map(c => { const r = c.getBoundingClientRect(); return { x: r.left + scrollX, y: r.top + scrollY, w: r.width, h: r.height }; });
  _lr.index = cards.indexOf(card);
  _lr.started = true;
  if (navigator.vibrate) { try { navigator.vibrate(8); } catch {} }
}

function _lrPointerMove(ev) {
  if (!_lr || (_lr.pointerId != null && ev.pointerId !== _lr.pointerId)) return;
  const dx = ev.clientX - _lr.startX, dy = ev.clientY - _lr.startY;
  if (!_lr.started) {
    if (Math.hypot(dx, dy) < 6) return;     // small wiggle = not a drag yet
    _lrStart();
  }
  ev.preventDefault();
  _lr.x = ev.clientX; _lr.y = ev.clientY;
  // Auto-scroll near the top/bottom edge
  const edge = 80;
  _lr.scrollDir = ev.clientY < edge ? -1 : ev.clientY > window.innerHeight - edge ? 1 : 0;
  if (_lr.scrollDir && !_lr.scrollRAF) _lrAutoScroll();
  if (!_lr.frame) _lr.frame = requestAnimationFrame(_lrFrame);   // one update per frame
}
// The ghost follows the pointer; the card moves to the slot the pointer is over
function _lrFrame() {
  if (!_lr || !_lr.started) return;
  _lr.frame = null;
  const { ghost, offX, offY, card, grid, slots, x, y } = _lr;
  ghost.style.transform = `translate(${x - offX}px, ${y - offY}px) rotate(1.5deg) scale(1.03)`;
  const px = x + scrollX, py = y + scrollY;
  const to = slots.findIndex(s => px >= s.x && px <= s.x + s.w && py >= s.y && py <= s.y + s.h);
  if (to < 0 || to === _lr.index) return;
  const others = [...grid.querySelectorAll('.lc-card')].filter(c => c !== card);
  _lrAnimate(grid, () => grid.insertBefore(card, others[to] || null));
  _lr.index = to;
  _lrRefreshPositions();
}

function _lrAutoScroll() {
  if (!_lr || !_lr.scrollDir) { if (_lr) _lr.scrollRAF = null; return; }
  window.scrollBy(0, _lr.scrollDir * 12);
  if (!_lr.frame) _lr.frame = requestAnimationFrame(_lrFrame);   // the page moved under the pointer
  _lr.scrollRAF = requestAnimationFrame(_lrAutoScroll);
}

function _lrPointerUp() {
  if (!_lr) return;
  const { card, ghost, started, order0 } = _lr;
  window.removeEventListener('pointermove', _lrPointerMove);
  window.removeEventListener('pointerup', _lrPointerUp);
  window.removeEventListener('pointercancel', _lrPointerUp);
  if (_lr.scrollRAF) cancelAnimationFrame(_lr.scrollRAF);
  if (_lr.frame) cancelAnimationFrame(_lr.frame);
  if (started) {
    // Ghost glides into the card's new slot, then disappears
    const r = card.getBoundingClientRect();
    ghost.style.transition = 'transform .22s cubic-bezier(.2,.8,.2,1)';
    ghost.style.transform = `translate(${r.left}px, ${r.top}px)`;
    setTimeout(() => { ghost.remove(); card.classList.remove('lr-dragging'); }, 220);
    document.body.classList.remove('lr-no-select');
    const order = _lrCurrentOrder();
    if (order.join('|') !== order0) _lrSave(order);
  }
  _lr = null;
}

/* ── Search — users, list names, and item (title) names — same live
   dropdown pattern used on friends.html/notes.html ── */
let _llTimer = null;
let _llActive = -1;
let _llResults = [];

function _llPosition() {
  const wrap = document.getElementById('listsSearchWrapInner');
  const drop = document.getElementById('llDropdown');
  if (!wrap || !drop) return;
  const r = wrap.getBoundingClientRect();
  drop.style.top = r.bottom + 'px';
  drop.style.left = r.left + 'px';
  drop.style.width = r.width + 'px';
  drop.style.position = 'fixed';
}

async function _llSearch(val) {
  const q = val.trim().toLowerCase();
  const drop = document.getElementById('llDropdown');
  clearTimeout(_llTimer);
  _llActive = -1;
  if (q.length < 2) {
    drop.classList.remove('open');
    document.getElementById('listsSearchWrapInner')?.classList.remove('dd-connected-active');
    mssUnlockScroll('llDropdown');
    return;
  }
  _llPosition();
  drop.innerHTML = '<div class="ud-loading">Searching…</div>';
  drop.classList.add('open');
  document.getElementById('listsSearchWrapInner')?.classList.add('dd-connected-active');
  mssLockScroll('llDropdown');

  _llTimer = setTimeout(async () => {
    try {
      const { data: users } = await sb.from('profiles')
        .select('id, username, display_name, avatar_url')
        .ilike('username', q + '%')
        .neq('id', _listsUser?.id || '')
        .limit(5);

      const listMatches = _socialListsRaw
        .filter(l => (l.title || '').toLowerCase().includes(q))
        .slice(0, 5);

      const seenEntryTitles = new Set();
      const itemMatches = [];
      for (const l of _socialListsRaw) {
        for (const id of (l.items || [])) {
          const e = _resolveSocialItem(id);
          if (!e || !e.title) continue;
          const key = e.title.toLowerCase();
          if (!key.includes(q) || seenEntryTitles.has(key)) continue;
          seenEntryTitles.add(key);
          itemMatches.push(e);
          if (itemMatches.length >= 5) break;
        }
        if (itemMatches.length >= 5) break;
      }

      _llResults = [
        ...(users || []).map(u => ({ type: 'user', ...u })),
        ...listMatches.map(l => ({ type: 'list', ...l })),
        ...itemMatches.map(e => ({ type: 'item', ...e })),
      ];

      if (!_llResults.length) {
        drop.innerHTML = '<div class="ud-empty">No matches found</div>';
        return;
      }

      const reg = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      drop.innerHTML = _llResults.map((r, i) => {
        if (r.type === 'user') {
          const initial = (r.username[0] || '?').toUpperCase();
          const avatarHTML = safeURL(r.avatar_url)
            ? '<div class="ud-avatar"><img src="'+safeURL(r.avatar_url)+'" loading="lazy"></div>'
            : '<div class="ud-avatar">' + initial + '</div>';
          const highlighted = r.username.replace(reg, '<em>$1</em>');
          const display = r.display_name && r.display_name !== r.username ? r.display_name : '';
          return '<div class="ud-item" data-i="' + i + '" onmousedown="_llSelectResult(' + i + ')">'
            + avatarHTML
            + '<div class="ud-info"><div class="ud-username">@' + highlighted + '</div>'
            + (display ? '<div class="ud-display">' + display + '</div>' : '') + '</div>'
            + '<span class="ud-type-tag">User</span></div>';
        }
        if (r.type === 'list') {
          const initial = (r.title[0] || '?').toUpperCase();
          const highlighted = esc(r.title).replace(reg, '<em>$1</em>');
          return '<div class="ud-item" data-i="' + i + '" onmousedown="_llSelectResult(' + i + ')">'
            + '<div class="ud-avatar">' + initial + '</div>'
            + '<div class="ud-info"><div class="ud-username">' + highlighted + '</div>'
            + '<div class="ud-display">List by @' + esc(r.username || 'user') + '</div></div>'
            + '<span class="ud-type-tag">List</span></div>';
        }
        // item
        const avatarHTML = safeURL(r.poster_url)
          ? '<div class="ud-avatar"><img src="'+safeURL(r.poster_url)+'" loading="lazy"></div>'
          : '<div class="ud-avatar">' + ((r.title || '?')[0] || '?').toUpperCase() + '</div>';
        const highlighted = esc(r.title).replace(reg, '<em>$1</em>');
        return '<div class="ud-item" data-i="' + i + '" onmousedown="_llSelectResult(' + i + ')">'
          + avatarHTML
          + '<div class="ud-info"><div class="ud-username">' + highlighted + '</div>'
          + '<div class="ud-display">Appears in community lists</div></div>'
          + '<span class="ud-type-tag">Title</span></div>';
      }).join('');
    } catch (e) {
      console.error('Search error:', e);
      drop.innerHTML = '<div class="ud-empty">Error searching</div>';
    }
  }, 250);
}

function _llKeydown(e) {
  const drop = document.getElementById('llDropdown');
  const items = drop.querySelectorAll('.ud-item');
  if (!drop.classList.contains('open') || !items.length) return;
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    _llActive = Math.min(_llActive + 1, items.length - 1);
    items.forEach((el, i) => el.classList.toggle('ud-active', i === _llActive));
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    _llActive = Math.max(_llActive - 1, -1);
    items.forEach((el, i) => el.classList.toggle('ud-active', i === _llActive));
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (_llActive >= 0) _llSelectResult(_llActive);
  } else if (e.key === 'Escape') {
    drop.classList.remove('open'); _llActive = -1;
    document.getElementById('listsSearchWrapInner')?.classList.remove('dd-connected-active');
    mssUnlockScroll('llDropdown');
  }
}

document.addEventListener('click', e => {
  const dd = document.getElementById('llDropdown');
  if (dd && dd.classList.contains('open') && !e.target.closest('#listsSearchWrap') && !e.target.closest('#llDropdown')) {
    dd.classList.remove('open');
    document.getElementById('listsSearchWrapInner')?.classList.remove('dd-connected-active');
    mssUnlockScroll('llDropdown');
    _llActive = -1;
  }
});

function _llCloseDropdown() {
  document.getElementById('llDropdown').classList.remove('open');
  document.getElementById('listsSearchWrapInner')?.classList.remove('dd-connected-active');
  mssUnlockScroll('llDropdown');
  _llResults = []; _llActive = -1;
}

function _llSelectResult(i) {
  const r = _llResults[i];
  if (!r) return;
  document.getElementById('listsSearchInput').value = r.type === 'item' ? r.title : (r.username || r.title);
  _llCloseDropdown();
  if (r.type !== 'list') _llForgetTitle();

  if (r.type === 'user') {
    const lists = _socialListsRaw.filter(l => l.user_id === r.id);
    _listsFilterMode = { type: 'user', label: '@' + r.username, lists };
    _showListsFilterBanner(`Showing lists by @${esc(r.username)}`);
    renderSocialLists();
  } else if (r.type === 'list') {
    location.href = MSSList.url({ id: r.id });
  } else if (r.type === 'item') {
    const lists = _socialListsRaw.filter(l => (l.items || []).includes(r.id));
    _listsFilterMode = { type: 'item', label: r.title, lists };
    _showListsFilterBanner(`Showing lists containing "${esc(r.title)}"`);
    renderSocialLists();
  }
}

function _showListsFilterBanner(text) {
  const banner = document.getElementById('listsFilterBanner');
  banner.style.display = 'flex';
  banner.innerHTML = `<span>${text}</span><button onclick="_llClearFilter()">Clear</button>`;
}

function _llClearFilter() {
  _llForgetTitle();
  _listsFilterMode = null;
  document.getElementById('listsSearchInput').value = '';
  document.getElementById('listsFilterBanner').style.display = 'none';
  renderSocialLists();
}

// Back to the whole Community: drop ?tmdb=…&type=…&t=…
function _llForgetTitle() {
  if (!_listsTitle) return;
  _listsTitle = null;
  const url = new URL(location.href);
  ['tmdb', 'type', 't'].forEach(k => url.searchParams.delete(k));
  history.replaceState(history.state, '', url.pathname + url.search);
}

// Every list holding one title — the same lists as its title page (get_lists_for_title).
// Lists the Community feed doesn't have yet join it, so their popup, likes and forks work as usual.
async function _llLoadTitle() {
  const t = _listsTitle;
  _showListsFilterBanner(`Showing lists with <a href="title.html?id=${t.id}&type=${t.type}" translate="no">${esc(t.name)}</a>`);
  try {
    const { data, error } = await sb.rpc('get_lists_for_title', { p_tmdb_id: t.id, p_tmdb_type: t.type });
    if (error) throw error;
    if (_listsTitle !== t) return;                           // cleared while loading
    const byId = new Map(_socialListsRaw.map(l => [l.id, l])), add = (data || []).filter(l => !byId.has(l.id));
    const need = [...new Set(add.flatMap(l => l.items || []))].filter(id => !MSSList.isTmdbId(id) && !_socialEntryMap[id]);
    const [entryRes, reactRes] = await Promise.all([
      need.length ? sb.from('entries').select('*').in('id', need) : { data: [] },
      (_listsUser && add.length) ? sb.from('list_reactions').select('list_id, is_like').eq('user_id', _listsUser.id).in('list_id', add.map(l => l.id)) : { data: [] },
    ]);
    (entryRes.data || []).forEach(e => { _socialEntryMap[e.id] = e; });
    await mssFillHiddenListItems(need, _socialEntryMap);
    (reactRes.data || []).forEach(r => { _socialListsMyReactions[r.list_id] = r.is_like ? 'like' : 'dislike'; });
    add.forEach(l => _socialListsRaw.push(l));
    const lists = (data || []).map(l => byId.get(l.id) || l);
    _listsFilterMode = { type: 'title', label: t.name, lists, pos: Object.fromEntries((data || []).map(l => [l.id, l.pos])) };
    document.getElementById('listsPageSub').textContent = `${lists.length} list${lists.length !== 1 ? 's' : ''} with "${t.name}"`;
    MSSList.hydrate(add).then(changed => { if (changed && _listsMode === 'community') renderSocialLists(); });
  } catch (err) {
    console.error('Lists for title:', err);
    _listsFilterMode = { type: 'title', label: t.name, lists: [] };
  }
}

function setSocialListsSort(val) { SF.setSort('social', 'all', val === 'latest' ? 'newest' : val); }

let _socialEntryMap = {}; // entry_id -> entry (across ALL social lists, not just the viewer's own)
function _resolveSocialItem(id) {
  if (typeof id === 'string' && id.startsWith('tmdb:')) return MSSList.tmdb(id);
  return _socialEntryMap[id] || null;
}
let _listsFilterMode = null; // { type: 'user'|'item'|'title', label, lists, pos? }
// From a title page's "View all lists": lists.html?view=community&tmdb=<id>&type=<movie|tv>&t=<name>
let _listsTitle = (q => q.get('tmdb') ? { id: Number(q.get('tmdb')), type: q.get('type') === 'tv' ? 'tv' : 'movie', name: q.get('t') || 'this title' } : null)(new URLSearchParams(location.search));

// Fetches Community data once (also used to prefetch in the background);
// TMDB posters for Discover-added titles fill in afterwards.
let _socialListsPromise = null, _socialListsCache = null;
function _fetchSocialLists(force) {
  if (_socialListsPromise && !force) return _socialListsPromise;
  _socialListsPromise = (async () => {
    const { data, error } = await sb.rpc('get_social_lists', { p_limit: 100 });
    if (error) throw error;
    const lists = data || [];
    // Other users' entries for the poster previews (Discover items are hydrated separately)
    const entryItemIds = [...new Set(lists.flatMap(l => l.items || []))].filter(id => !(typeof id === 'string' && id.startsWith('tmdb:')));
    const [entryRes, reactRes] = await Promise.all([
      entryItemIds.length ? sb.from('entries').select('*').in('id', entryItemIds) : { data: [] },
      (_listsUser && lists.length) ? sb.from('list_reactions').select('list_id, is_like').eq('user_id', _listsUser.id).in('list_id', lists.map(l => l.id)) : { data: [] },
    ]);
    _socialEntryMap = {};
    (entryRes.data || []).forEach(e => { _socialEntryMap[e.id] = e; });
    await mssFillHiddenListItems(entryItemIds, _socialEntryMap);   // hidden titles (073): name + poster only
    _socialListsMyReactions = {};
    (reactRes.data || []).forEach(r => { _socialListsMyReactions[r.list_id] = r.is_like ? 'like' : 'dislike'; });
    _socialListsCache = lists;
    MSSList.hydrate(lists).then(changed => { if (changed && _listsMode === 'community') renderSocialLists(); });
    return lists;
  })().catch(err => { _socialListsPromise = null; throw err; });
  return _socialListsPromise;
}

async function loadSocialLists() {
  const wrap = document.getElementById('listsPageContent');
  if (!_socialListsCache) wrap.innerHTML = `<div class="page-loading" data-skel="lists"></div>`;   // not prefetched yet
  try {
    _socialListsRaw = await _fetchSocialLists();
    if (_listsTitle) await _llLoadTitle();
    if (_listsMode === 'community') renderSocialLists();
  } catch (err) {
    console.error('Load social lists error:', err);
    mssErrorPage(mssErrorKind(err), { in: wrap, error: err });
  }
}

// Like / dislike someone's list (the card's buttons, or a double-tap)
function reactToSocialList(listId, isLike) {
  const l = _socialListsRaw.find(x => x.id === listId);
  if (!l) return Promise.resolve();
  return mssReactFeed('list', listId, isLike,
    () => ({ like: l.like_count, dislike: l.dislike_count, mine: _socialListsMyReactions[listId] || null }),
    st => {
      l.like_count = st.like; l.dislike_count = st.dislike;
      if (st.mine) _socialListsMyReactions[listId] = st.mine; else delete _socialListsMyReactions[listId];
      renderSocialLists();
    });
}

function renderSocialLists() {
  const wrap = document.getElementById('listsPageContent');
  const all = _socialListsRaw || [];
  const weekAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;
  if (_listsFilterMode?.type !== 'title') document.getElementById('listsPageSub').textContent = [_nWord(all.length, 'list'), _nWord(new Set(all.map(l => l.user_id)).size, 'curator'),
    _nWord(new Set(all.flatMap(l => l.items || [])).size, 'title'), `${all.filter(l => new Date(l.created_at).getTime() >= weekAgo).length} this week`].join(' · ');
  _listsViews();
  const source = SF.list('social', 'all');
  const baseCount = (_listsFilterMode ? _listsFilterMode.lists : all).length;
  if (!_listsFilterMode) mssSkeleton.shape('lists_c', { n: source.length });
  if (!baseCount) {
    wrap.innerHTML = _listsFilterMode
      ? mssEmpty({ art: 'search', title: 'No lists here', text: 'Nothing public matches that search yet. Try someone else, or another title.',
          actions: [{ label: 'Clear search', icon: 'x', onclick: '_llClearFilter()' }] })
      : mssEmpty({ art: 'lists', title: 'No public lists yet', text: 'Somebody has to go first. Might as well be you.',
          actions: [{ label: 'Create a list', icon: 'plus', onclick: '_listsNew()', primary: true }] });
    return;
  }
  if (!source.length) { wrap.innerHTML = _listsNoMatch('social', 'renderSocialLists()'); return; }
  wrap.innerHTML = `<div class="lc-grid">${source.map(l => {
    const mine = _socialListsMyReactions[l.id], id = attrJSON(l.id), own = l.user_id === _listsUser?.id;
    const btn = like => `<button type="button" class="social-list-react-btn ${mine === (like ? 'like' : 'dislike') ? (like ? 'active-like' : 'active-dislike') : ''}"${like ? ' data-like' : ''} aria-label="${like ? 'Like' : 'Dislike'}: ${(like ? l.like_count : l.dislike_count) || 0}" aria-pressed="${mine === (like ? 'like' : 'dislike')}" onclick="event.stopPropagation();reactToSocialList(${id}, ${like})">
        ${icon(mine === (like ? 'like' : 'dislike') ? (like ? 'thumbsUpFilled' : 'thumbsDownFilled') : (like ? 'thumbsUp' : 'thumbsDown'), 14)} <span>${(like ? l.like_count : l.dislike_count) || 0}</span></button>`;
    return MSSList.cardHTML(l, { resolve: _resolveSocialItem, open: `location.href=${attrJSON(MSSList.url(l))}`, dbl: true, own,
      menu: own ? `_listsMenu(this, ${id})` : `_listsOtherMenu(this, ${id})`,
      ownerHTML: MSSList.ownerHTML({ username: l.username, avatar_url: l.avatar_url }),
      extra: l.ranked && _listsFilterMode?.pos?.[l.id] ? `<span class="ll-pos">#${_listsFilterMode.pos[l.id]} in this list</span>` : '',
      reacts: btn(true) + btn(false) });
  }).join('')}</div>`;
}

</script>

if ('serviceWorker' in navigator) {

    navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW failed:', e));
