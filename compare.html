<script>
/* ══ COMPARE ══
   1) choose who to compare with   2) see your taste match + shared titles
   (sortable / filterable)   3) open a title for the full side-by-side. */
// Titles you share with the selected friend(s) — one group per title
function _cmpGroups() {
  const me = _fUser.id, pick = new Set(_cmpWith);
  const idx = {};
  const add = e => { const k = _cmpKeyOf(e); (idx[k] ||= { id: k, key: k, title: e.title, year: e.year, cat: e.cat, poster_url: e.poster_url, ratings: e.ratings, byUser: {} }); if (!idx[k].byUser[e.user_id]) idx[k].byUser[e.user_id] = e; if (!idx[k].poster_url) idx[k].poster_url = e.poster_url; };
  _cmpMine.forEach(add);
  _frEntries.filter(e => pick.has(e.user_id)).forEach(add);
  return Object.values(idx).filter(g => g.byUser[me] && _cmpWith.some(u => g.byUser[u])).map(g => {
    const mine = _frScore(g.byUser[me]);
    const theirs = _cmpWith.map(u => g.byUser[u]).filter(Boolean).map(_frScore).filter(v => v != null);
    const avgTheirs = theirs.length ? theirs.reduce((a, b) => a + b, 0) / theirs.length : null;
    return { ...g, _mine: mine, _theirs: avgTheirs, _diff: mine != null && avgTheirs != null ? avgTheirs - mine : null };
  });
}
SF.register('frShared', {
  base: () => _cmpMine ? _cmpGroups().filter(g => !_cmpQuery || (g.title || '').toLowerCase().includes(_cmpQuery.toLowerCase())) : [],
  render: () => _frRender(),
  defaultSort: 'agree',
  presets: {
    agreement: { header: 'Agreement', opts: [['agree', 'Most In Sync'], ['disagree', 'Biggest Difference']] },
    scores:    { header: 'Scores', opts: [['yours', 'Your Top Rated'], ['theirs', 'Their Top Rated']] },
  },
  sorts: () => ['agreement', 'scores', 'alpha'],
  filters: () => [],
  compare: {
    agree: (a, b) => (a._diff == null) - (b._diff == null) || Math.abs(a._diff ?? 99) - Math.abs(b._diff ?? 99),
    disagree: (a, b) => (a._diff == null) - (b._diff == null) || Math.abs(b._diff ?? -1) - Math.abs(a._diff ?? -1),
    yours: (a, b) => (b._mine ?? -1) - (a._mine ?? -1),
    theirs: (a, b) => (b._theirs ?? -1) - (a._theirs ?? -1),
  },
  choiceFilters: () => [
    SF.typeChoice(),
    { key: 'rated', label: 'Scores', options: [['', 'All Shared'], ['both', 'Rated by both']], test: (g, v) => g._diff != null },
  ],
});

// Taste match with one friend: how closely your scores line up
// (shared formula: mssTasteMatch, config.js — also on friend cards and profiles)
let _cmpPickQ = '';
// The friend picker: sorted by taste match (no data last), a search for long friend lists
function _cmpPickerHTML(uid) {
  const q = _cmpPickQ.trim().toLowerCase();
  const fr = _frAccepted.filter(f => !q || [_frName(f.friendId), f.friendProfile?.username].some(t => (t || '').toLowerCase().includes(q)))
    .sort((x, y) => (_frMatchPct(y.friendId) ?? -1) - (_frMatchPct(x.friendId) ?? -1) || _frName(x.friendId).localeCompare(_frName(y.friendId)));
  return `<section class="cp-pick" aria-label="Compare with">
    <div class="cp-pick-head"><h2 class="cp-pick-title">Compare with</h2>
      <label class="cp-pick-search"><span class="sr-only">Find a friend</span>${icon('search', 14)}<input type="search" placeholder="Find a friend…" value="${escHTML(_cmpPickQ)}" autocomplete="off" spellcheck="false" oninput="_cmpPickQ=this.value;_cmpPaintPicker()"></label>
      <span class="cp-pick-hint">Sorted by taste match</span></div>
    <div class="cp-pick-row" id="cmpPickRow">${fr.length ? fr.map(f => { const on = f.friendId === uid, m = _frMatchPct(f.friendId);
      return `<button type="button" class="cp-person${on ? ' on' : ''}" aria-pressed="${on}" onclick="_cmpToggle(${attrJSON(f.friendId)})">${_frAvHTML(f.friendProfile, 52)}${on ? `<i aria-hidden="true">${icon('check', 10)}</i>` : ''}<span translate="no">${escHTML(_frName(f.friendId))}</span><small>${m != null ? m + '%' : '—'}</small></button>`; }).join('')
      : `<div class="cp-pick-none">No friend called “${escHTML(_cmpPickQ)}”</div>`}</div>
  </section>`;
}
function _cmpPaintPicker() {
  const row = document.getElementById('cmpPickRow'); if (!row) return;
  const tmp = document.createElement('div'); tmp.innerHTML = _cmpPickerHTML(_cmpWith[0]);
  row.replaceWith(tmp.querySelector('#cmpPickRow'));
}
// The two people, side by side — the same spots before and after a friend is picked
function _cmpSide(p, name, cls = '') {
  return `<div class="cp-side${cls}">${p ? _frAvHTML(p, 72) : `<span class="cp-slot" aria-hidden="true">${icon('user', 26)}</span>`}<b translate="no">${escHTML(name)}</b></div>`;
}
// An empty Agreements / Splits list: the same card, an icon, what it means
function _cmpNone(ic, title, text) {
  return `<div class="cp-pairs cp-empty"><span class="cp-empty-ic" aria-hidden="true">${icon(ic, 18)}</span><div><b>${title}</b><p>${text}</p></div></div>`;
}
function _cmpFact(ic, html) { return `<li>${icon(ic, 14)}<span>${html}</span></li>`; }
// Rows for Biggest agreements / Biggest splits: poster, title, your score vs theirs (bars on wide screens), the gap
function _cmpPairRow(p, uid) {
  const gap = Math.abs(p.a - p.b), e = p.m;
  return `<li class="cp-pair" role="button" tabindex="0" onclick="_cmpOpen(${attrJSON(_cmpKeyOf(e))})" onkeydown="if(event.key==='Enter')this.click()">
    ${_frPosterHTML(e, 'cp-pair-poster')}
    <div class="cp-pair-main"><b class="cp-pair-title" translate="no">${escHTML(e.title)}</b>
      <div class="cp-pair-bars"><span class="me" style="--w:${p.a * 10}%"></span><span class="them" style="--w:${p.b * 10}%"></span></div></div>
    <div class="cp-pair-sc"><b class="me">${p.a.toFixed(2)}</b><small>You</small></div>
    <div class="cp-pair-sc"><b class="them">${p.b.toFixed(2)}</b><small translate="no">${escHTML(_frName(uid))}</small></div>
    <div class="cp-pair-gap">${gap < .005 ? 'Same' : '±' + gap.toFixed(2)}</div>
  </li>`;
}
async function _frRenderCompare() {
  const c = document.getElementById('frContent');
  document.getElementById('frToolbar').style.display = 'none';
  if (!_cmpMine) { c.innerHTML = `<div class="page-loading"><div class="spinner"></div></div>`; await _cmpLoad(); if (_frTab !== 'compare') return; }
  _cmpWith = _cmpWith.filter(u => _frProfiles[u]).slice(0, 1);
  const uid = _cmpWith[0], me = _cmpProfiles[_fUser.id] || _fProfile;
  const picker = _cmpPickerHTML(uid);
  if (uid && _cmpKey) return _cmpShowTitle(picker);
  const m = uid ? _cmpMatch(uid) : null;
  const name = uid ? _frName(uid) : '';
  // The hero: you · the match ring · them (an empty spot until you pick someone)
  const facts = m ? [
      _cmpFact('bookmark', `<b>${m.shared}</b> titles in both libraries · <b>${m.rated}</b> rated by both`),
      m.avgDiff != null ? _cmpFact('compare', `Scores differ by <b>±${mssR1(m.avgDiff)}</b> on average`) : '',
      m.loved ? _cmpFact('heart', `You both love <b translate="no">${escHTML(m.loved.m.title)}</b>`) : '',
      m.split ? _cmpFact('shuffle', `Split on <b translate="no">${escHTML(m.split.m.title)}</b> — you ${mssR1(m.split.a)}, ${escHTML(name)} ${mssR1(m.split.b)}`) : '',
    ].join('')
    : ['Titles in both libraries', 'How far apart your scores are', 'A favourite you share', 'Your biggest split'].map(t => `<li class="is-ghost">${icon('compare', 14)}<span>${t}</span></li>`).join('');
  const hero = `<section class="cp-hero2${m ? '' : ' is-empty'}" aria-label="${m ? `You and ${escHTML(name)}` : 'Pick a friend to compare with'}">
    <div class="cp-duo">
      ${_cmpSide(me, 'You')}
      <div class="cp-ring cp-ring-big" style="--p:${m?.pct ?? 0}"><div><b>${m?.pct != null ? m.pct + '%' : '—'}</b><span>taste match</span></div></div>
      ${_cmpSide(uid ? _frProfiles[uid] : null, uid ? name : 'Pick a friend', uid ? '' : ' is-slot')}
    </div>
    <div class="cp-hero2-body">
      <h2 class="cp-hero2-title">${m ? `You & <span translate="no">${escHTML(name)}</span>` : 'Line your taste up with a friend’s'}</h2>
      ${m ? '' : `<p class="cp-hero2-lead">Pick someone above and this fills in: your match, the titles you share, where you agree and where you split.</p>`}
      <ul class="cp-facts">${facts}</ul>
      ${m && m.pct == null ? `<p class="cp-hero2-lead">Rate a few more of the same titles to get a match — ${MSS_MATCH_MIN} rated by both are needed.</p>` : ''}
    </div>
    <div class="cp-hero2-act">${uid
      ? `<a class="btn-add-entry" href="blend.html?with=${encodeURIComponent(uid)}">${icon('shuffle', 14)} Blend with ${escHTML(name)}</a><a class="fm-btn" href="messages.html?with=${encodeURIComponent(uid)}">${icon('inbox', 13)} Message</a>`
      : `<a class="fm-btn" href="blend.html">${icon('shuffle', 13)} Open Blend</a>`}</div>
  </section>`;
  if (!uid) { c.innerHTML = picker + hero; return; }
  // Biggest agreements (both 9+, closest first; else simply the closest) and splits (widest gaps)
  const rated = m.list;
  const gap = p => Math.abs(p.a - p.b);
  let agree = rated.filter(p => p.a >= 9 && p.b >= 9).sort((x, y) => gap(x) - gap(y) || (y.a + y.b) - (x.a + x.b));
  if (agree.length < 3) agree = rated.slice().sort((x, y) => gap(x) - gap(y) || (y.a + y.b) - (x.a + x.b));
  agree = agree.slice(0, 5);
  const splits = rated.filter(p => gap(p) >= 1).sort((x, y) => gap(y) - gap(x)).slice(0, 5);
  const lists = rated.length ? `<div class="cp-lists">
      <section class="cp-listsec"><h2 class="fr-sec-title">Biggest agreements</h2>${agree.length ? `<ul class="cp-pairs">${agree.map(p => _cmpPairRow(p, uid)).join('')}</ul>`
        : _cmpNone('heart', 'No agreements yet', `Rate a few more of the titles you’ve both watched and the ones you see the same way show up here.`)}</section>
      <section class="cp-listsec"><h2 class="fr-sec-title">Biggest splits</h2>${splits.length ? `<ul class="cp-pairs">${splits.map(p => _cmpPairRow(p, uid)).join('')}</ul>`
        : _cmpNone('check', 'No real splits', `You and ${escHTML(name)} are within a point of each other on all ${rated.length} ${rated.length === 1 ? 'title' : 'titles'} you’ve both rated${(() => { const w = rated.slice().sort((x, y) => gap(y) - gap(x))[0]; return w ? ` — the widest gap is <b translate="no">${escHTML(w.m.title)}</b> (±${gap(w).toFixed(2)})` : ''; })()}.`)}</section>
    </div>` : '';
  // Shared titles: every title you've both watched and rated, searchable
  const list = SF.list('frShared', 'all');
  c.innerHTML = picker + hero + `<div class="cp-fade">${lists}
    <div class="cp-shared-head"><div class="fr-sec-head"><h2 class="fr-sec-title">Shared titles</h2><span class="fr-sec-sub" id="cmpCount">${list.length} ${list.length === 1 ? 'title' : 'titles'}</span></div>${SF.bar('frShared', 'all')}</div>
    <div class="sf-search cp-search2${_cmpQuery ? ' has-q' : ''}" role="search"><span class="sf-search-ic" aria-hidden="true">${icon('search', 16)}</span>
      <input type="search" id="cmpInput" class="sf-search-input" placeholder="Search shared titles…" aria-label="Search shared titles" autocomplete="off" spellcheck="false" value="${escHTML(_cmpQuery)}" oninput="_cmpQuery=this.value;this.parentElement.classList.toggle('has-q',!!this.value);SF.invalidate&&SF.invalidate('frShared');_cmpRenderList()">
      <button type="button" class="sf-search-clear" aria-label="Clear search" onclick="const i=document.getElementById('cmpInput');i.value='';i.dispatchEvent(new Event('input'));i.focus()">${icon('x', 14)}</button></div>
    <div id="cmpList"></div></div>`;
  _cmpRenderList();
}
function _cmpRenderList() {
  const el = document.getElementById('cmpList'); if (!el) return;
  const list = SF.list('frShared', 'all'), uid = _cmpWith[0];
  const cnt = document.getElementById('cmpCount'); if (cnt) cnt.textContent = `${list.length} ${list.length === 1 ? 'title' : 'titles'}`;
  // the same rows as the agreements / splits: you vs them, the gap ("—" where one of you hasn't rated it)
  el.innerHTML = list.length ? `<ul class="cp-pairs cp-pairs-all">${list.slice(0, 120).map(g => {
    const a = g._mine, b = g._theirs, d = g._diff;
    return `<li class="cp-pair" role="button" tabindex="0" onclick="_cmpOpen(${attrJSON(g.key)})" onkeydown="if(event.key==='Enter')this.click()">
      ${_frPosterHTML(g, 'cp-pair-poster')}
      <div class="cp-pair-main"><b class="cp-pair-title" translate="no">${escHTML(g.title)}${g.year ? ` <span class="cp-pair-year">${escHTML(String(g.year).slice(0, 4))}</span>` : ''}</b>
        <div class="cp-pair-meta">${_frTypeBadge(g)}</div></div>
      <div class="cp-pair-sc"><b class="me">${a != null ? a.toFixed(2) : '—'}</b><small>You</small></div>
      <div class="cp-pair-sc"><b class="them">${b != null ? b.toFixed(2) : '—'}</b><small translate="no">${escHTML(_frName(uid))}</small></div>
      <div class="cp-pair-gap">${d == null ? '' : Math.abs(d) < .005 ? 'Same' : '±' + Math.abs(d).toFixed(2)}</div>
    </li>`;
  }).join('')}</ul>` : _frEmptyHTML('search', _cmpQuery ? 'No shared titles match' : 'Nothing shared yet', _cmpQuery ? 'Try a different search.' : 'Once you both log the same title, it shows up here.');
}
// One friend at a time (comparing several is Blend's job); tapping the one picked clears it
function _cmpToggle(uid) {
  _cmpWith = _cmpWith[0] === uid ? [] : [uid];
  const url = new URL(location.href);
  if (_cmpWith[0]) url.searchParams.set('with', _cmpWith[0]); else url.searchParams.delete('with');
  history.replaceState(history.state, '', url.pathname + url.search);
  _cmpKey = null; SF.invalidate && SF.invalidate('frShared'); _frRender();
}
function _cmpOpen(key) { _cmpKey = key; _frRender(); document.getElementById('frContent').scrollIntoView({ behavior: 'smooth', block: 'start' }); }
function _cmpBack() { _cmpKey = null; _frRender(); }

const _CMP_STATUS = { completed: 'Watched', ongoing: 'To Be Continued', watching: 'Watching', paused: 'Taking a Break', up_next: 'Up Next', queue: 'Watchlist', dropped: 'Dropped' };
function _cmpFavTags(uid, e) {
  const p = _cmpProfiles[uid] || {}, tags = [], pos = arr => Array.isArray(arr) ? arr.indexOf(e.id) : -1;
  let i = pos(p.top_picks); if (i >= 0) tags.push(`Top Favorite #${i + 1}`);
  i = pos(p.recommended); if (i >= 0) tags.push('Would Recommend');
  const k = { tv: 'fav_tv', movies: 'fav_movies', anime: 'fav_anime', cartoons: 'fav_cartoons' }[e.cat];
  i = pos(p[k]); if (i >= 0) tags.push(`Top 5 ${CAT_META[e.cat]?.label || ''} #${i + 1}`);
  return tags;
}
function _cmpListsFor(uid, e) {
  const lists = uid === _fUser.id ? _cmpMyLists : _frLists.filter(l => l.user_id === uid);
  return lists.filter(l => (l.items || []).includes(e.id)).map(l => l.title);
}
function _cmpShowTitle(picker) {
  const g = _cmpGroups().find(x => x.key === _cmpKey);
  const c = document.getElementById('frContent');
  document.getElementById('frToolbar').style.display = 'none';
  if (!g) { _cmpKey = null; return _frRender(); }
  const me = _fUser.id;
  const people = [me, ..._cmpWith].filter(u => g.byUser[u]);
  const name = u => u === me ? 'You' : _frName(u);
  const prof = u => u === me ? (_cmpProfiles[me] || _fProfile) : (_cmpProfiles[u] || _frProfiles[u]);
  const myScore = _frScore(g.byUser[me]);
  const scored = people.map(u => _frScore(g.byUser[u])).filter(v => v != null);
  const avg = scored.length ? scored.reduce((a, b) => a + b, 0) / scored.length : null;
  // Ratings can be saved as numbers or numeric text — read both, so nobody's
  // breakdown shows up empty / half-filled
  const rv = (e, key) => { const v = e?.ratings?.[key]; if (v === '' || v == null) return null; const n = Number(v); return isNaN(n) ? null : n; };
  const anyEntry = Object.values(g.byUser)[0] || {};
  // The shared groups (config.js), each with only the ratings someone here gave
  const groups = mssRatingGroups(g.cat, g.cat === 'movies' || anyEntry.ratings?._media_type === 'movie' || anyEntry.tmdb_type === 'movie')
    .map(gr => ({ ...gr, items: gr.items.filter(r => people.some(u => rv(g.byUser[u], r.key) != null)) })).filter(gr => gr.items.length);
  const rows = groups.flatMap(gr => gr.items);
  const groupAvg = (gr, u) => { const v = gr.items.map(r => rv(g.byUser[u], r.key)).filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
  // Headline stats
  const pairs = people.filter(u => u !== me).map(u => _frScore(g.byUser[u])).filter(v => v != null);
  const spread = scored.length > 1 ? Math.max(...scored) - Math.min(...scored) : null;
  const closest = myScore != null && pairs.length ? Math.min(...pairs.map(v => Math.abs(v - myScore))) : null;
  const finished = people.filter(u => ['completed', 'ongoing'].includes(g.byUser[u].status)).length;
  let agree = null;                                         // categories within 1 point of each other
  const both = rows.filter(r => people.filter(u => rv(g.byUser[u], r.key) != null).length > 1);
  if (both.length) agree = Math.round(100 * both.filter(r => { const v = people.map(u => rv(g.byUser[u], r.key)).filter(x => x != null); return Math.max(...v) - Math.min(...v) <= 1; }).length / both.length);
  // best-rated category among ones at least two of you rated
  const topRow = both.map(r => { const v = people.map(u => rv(g.byUser[u], r.key)).filter(x => x != null); return { r, avg: v.reduce((a, b) => a + b, 0) / v.length }; }).sort((a, b) => b.avg - a.avg)[0];
  const card = u => {
    const e = g.byUser[u], sc = _frScore(e);
    const diff = u !== me && sc != null && myScore != null ? sc - myScore : null;
    const fav = _cmpFavTags(u, e), lists = _cmpListsFor(u, e);
    return `<div class="cp-pcard${u === me ? ' me' : ''}">
      <div class="cp-pcard-head">${_frAvHTML(prof(u), 34)}<b translate="no">${escHTML(name(u))}</b></div>
      <div class="cp-pcard-score">${sc != null ? sc.toFixed(2) : '—'}</div>
      <div class="cp-delta ${diff == null ? 'none' : Math.abs(diff) < .5 ? 'same' : diff > 0 ? 'up' : 'down'}">${diff == null ? (u === me ? 'Your score' : '&nbsp;') : Math.abs(diff) < .5 ? 'In sync with you' : (diff > 0 ? '+' : '') + diff.toFixed(2) + ' vs you'}</div>
      <div class="cp-pcard-status">${escHTML(_CMP_STATUS[e.status] || e.status)}${e.completed_date ? ` · ${_frDate(e.completed_date).toLocaleDateString(MSSI18n.locale, { month: 'short', day: 'numeric', year: 'numeric' })}` : ''}</div>
      <div class="cp-tags">${fav.map(t => `<span class="cp-tag fav">${escHTML(t)}</span>`).join('')}${lists.map(t => `<span class="cp-tag">${icon('layers', 10)} ${escHTML(t)}</span>`).join('')}${!fav.length && !lists.length ? '<span class="cp-tag-none">Not in favorites or lists</span>' : ''}</div>
    </div>`;
  };
  c.innerHTML = picker + `
    <button class="cp-back" onclick="_cmpBack()">${icon('arrowRight', 13)} Shared titles</button>
    <div class="cp-hero">
      <div class="cp-hero-bg" style="background-image:${cssURL(g.poster_url)}"></div>
      ${_frPosterHTML(g, 'cp-hero-poster')}
      <div class="cp-hero-info">
        <div class="cp-hero-title" translate="no">${escHTML(g.title)}${g.year ? ` <span>${escHTML(String(g.year).slice(0, 4))}</span>` : ''}</div>
        <div class="fa-meta">${_frTypeBadge(g)}</div>
        <div class="cp-hero-stats">
          <div><b>${avg != null ? '★ ' + avg.toFixed(2) : '—'}</b><span>Group avg</span></div>
          <div><b>${myScore != null ? '★ ' + myScore.toFixed(2) : '—'}</b><span>Your score</span></div>
          <div><b>${spread != null ? spread.toFixed(2) : '—'}</b><span>Score gap</span></div>
          ${closest != null ? `<div><b>${closest.toFixed(2)}</b><span>Closest to you</span></div>` : ''}
          ${agree != null ? `<div><b>${agree}%</b><span>Ratings agree</span></div>` : ''}
          <div><b>${finished}/${people.length}</b><span>Finished</span></div>
        </div>
        ${topRow ? `<div class="cp-hero-line">${icon('ratingStar', 12)} Rated highest together: <b>${escHTML(topRow.r.label)}</b> (${mssR1(topRow.avg)} avg)</div>` : ''}
      </div>
    </div>
    <div class="cp-pcards">${people.map(card).join('')}</div>
    ${rows.length ? `<div class="fr-toolbar-title cp-sec">Ratings breakdown</div>
    <div class="cp-table-wrap"><table class="cp-table"><thead><tr><th>Category</th>${people.map(u => `<th translate="no">${escHTML(name(u))}</th>`).join('')}</tr></thead>
      <tbody>${groups.map((gr, gi) => `${gr.kind === 'bonus' && groups[gi - 1]?.kind !== 'bonus' ? `<tr class="cp-kind"><th scope="rowgroup" colspan="${people.length + 1}">Bonus</th></tr>` : ''}
        <tr class="cp-grp"><th scope="row">${escHTML(gr.name)}</th>${people.map(u => { const a = groupAvg(gr, u); return `<td>${a != null ? a.toFixed(2).replace(/0$/, '') : '—'}</td>`; }).join('')}</tr>
        ${gr.items.map(r => { const vals = people.map(u => rv(g.byUser[u], r.key)); const nums = vals.filter(v => v != null); const top = nums.length > 1 ? Math.max(...nums) : null;
        return `<tr><td>${escHTML(r.label)}</td>${vals.map(v => `<td class="${v != null && v === top ? 'best' : ''}">${v != null ? mssR1(v) : '—'}</td>`).join('')}</tr>`; }).join('')}`).join('')}
        <tr class="cp-total"><td>Final score</td>${people.map(u => { const v = _frScore(g.byUser[u]); return `<td>${v != null ? '★ ' + v.toFixed(2) : '—'}</td>`; }).join('')}</tr></tbody></table></div>` : ''}
    ${people.some(u => g.byUser[u].notes && g.byUser[u].notes.trim()) ? `<div class="fr-toolbar-title cp-sec">Notes</div>
    <div class="fn-grid">${people.filter(u => g.byUser[u].notes && g.byUser[u].notes.trim()).map(u => { const e = g.byUser[u];
      const text = `<blockquote class="fn-text mss-rich" translate="no">${MSSRich.html(e.notes)}</blockquote>`;
      return `<article class="fn-card"><div class="fn-by">${_frAvHTML(prof(u), 22)}<span translate="no">${escHTML(name(u))}</span></div>${mssIsSpoiler(e) && u !== me ? mssSpoilerHTML(text, { compact: true, id: e.id, e }) : text}</article>`; }).join('')}</div>` : ''}`;
}

mssSkeleton.define('fr-page', () => mssSkeleton('rows'));
function _frRender() {
  if (_frGateAuth() || _frGateData()) return;
  _frRenderCompare();
}
MSSSocial.boot('compare', { friends: true, render: true, start: (user, q) => { if (q.get('with')) _cmpWith = [q.get('with')]; } });
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(r => console.log('SW registered:', r.scope))
      .catch(e => console.warn('SW failed:', e));
  });
}
</script>

<div id="udDropdown" class="username-dropdown"></div>
</body>
</html>
