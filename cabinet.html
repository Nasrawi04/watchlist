<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#F3EEDC">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MyScreenFolio">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="js/consent.js"></script>
<script src="js/splash.js"></script>
<script src="js/i18n.js"></script>
<title>Achievement Cabinet — MyScreenFolio</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/showcase.css">
</head>
<body>
<div class="page-wrap" id="cabPage">
  <div class="page-loading" data-skel="cabinet"></div>
</div>

<script src="js/vendor/supabase-2.118.0.js"></script>
<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/nav.js"></script>
<script src="js/medals.js"></script>
<script src="js/showcase.js"></script>
<script src="js/medal-card.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════
   cabinet.html — the Achievement Cabinet (060 achievements · 128 rarity, secret total)
     cabinet.html             yours: the summary ("33 medals" split by kind), Next up (the 3 achievements closest to
                              their next level), tabs All / Achievements / Official / Challenges / Secrets, Sort
                              (Closest to next · Newest · Rarest · A–Z), Show locked; Specials (Member, Official,
                              Challenges, Secrets — unfound ones as "?", the total set by admins) in one card;
                              achievements as ladder cards. Tap any medal → its Medal card (medal-card.js).
     Yours only: nobody else can open your cabinet (they see your Showcase on your profile). An old
     cabinet.html?user=<someone else> link opens that person's profile on its Showcase tab.
   Opening your own cabinet saves any newly reached levels (sync_achievements).
   Styles: css/showcase.css "Achievement Cabinet".
═══════════════════════════════════════════════════════════════ */
const esc = s => escHTML(s == null ? '' : String(s));
const CAB = { user: null, ach: [], badges: [], tab: 'all', sort: 'close', locked: false, secretTotal: 0, rar: {}, sc: null };
const num = n => Number(n || 0).toLocaleString(MSSI18n.locale);
const when = d => new Date(d).toLocaleDateString(MSSI18n.locale, { day: 'numeric', month: 'short', year: 'numeric' });
const topLevel = a => Math.max(0, ...(a.earned || []).map(e => e.level));
const LV = () => MSSMedal.LEVEL;
const TABS = [['all', 'All'], ['ach', 'Achievements'], ['official', 'Official'], ['challenge', 'Challenges'], ['secret', 'Secrets']];
const SORTS = [['close', 'Closest to next'], ['new', 'Newest'], ['rare', 'Rarest'], ['az', 'A–Z']];
const UNITS = { watched: 'titles', episodes: 'episodes', episodes_rated: 'episodes rated', rated: 'titles rated', hours: 'hours', shows: 'shows', anime: 'anime',
  cartoons: 'cartoons', genres: 'genres', lists: 'lists', notes: 'notes', challenges: 'challenges' };
const unitOf = (k, n) => { const u = UNITS[k] || ''; return Number(n) === 1 ? ({ titles: 'title', episodes: 'episode', hours: 'hour', shows: 'show', cartoons: 'cartoon', genres: 'genre', lists: 'list', notes: 'note', challenges: 'challenge' })[u] || u.replace(/s( rated)?$/, '$1') : u; };
const rpc = async (fn, args) => { const { data, error } = await sb.rpc(fn, args); if (error) throw error; return data; };

async function cabLoad() {
  const params = new URLSearchParams(location.search);
  if (TABS.some(t => t[0] === params.get('tab'))) CAB.tab = params.get('tab');
  if (SORTS.some(t => t[0] === params.get('sort'))) CAB.sort = params.get('sort');
  const [ach, badges, cfg, sc] = await Promise.all([
    rpc('sync_achievements', {}),
    rpc('my_badges', { p_user: CAB.user.id }),
    sb.from('site_config').select('secret_total').eq('id', 1).maybeSingle().then(r => r.data, () => null),
    rpc('get_showcase', { p_user: CAB.user.id, p_all: true }).catch(() => null),
  ]);
  CAB.ach = Array.isArray(ach) ? ach : [];
  CAB.badges = Array.isArray(badges) ? badges : [];
  CAB.sc = sc ? MSSShowcase.read(sc) : null;
  CAB.secretTotal = Math.max(cfg?.secret_total ?? Object.keys(MSSMedal.SECRET).length, CAB.badges.filter(b => b.kind === 'secret').length);
  try { localStorage.setItem('mss_ach_sync', String(Date.now())); } catch {}
  cabDraw();
  MSSMedalCard.rarity().then(r => { CAB.rar = r || {}; if (CAB.sort === 'rare') cabDraw(); });
}

// Came here from your profile (Showcase → Cabinet)? A way straight back to it.
function cabBack() {
  let from = null;
  try { const r = new URL(document.referrer); if (r.origin === location.origin && /\/profile\.html$/.test(r.pathname)) from = r; } catch {}
  const label = from ? 'Back to your profile' : 'Your profile';
  const href = from ? 'profile.html' + from.search : 'profile.html';
  return `<a class="cab-back" href="${esc(href)}"${from ? ' onclick="if(history.length>1){history.back();return false;}"' : ''}>${icon('back', 14)} ${label}</a>`;
}

/* ── the pieces ── */
const kindOf = b => b.kind;
const rare = b => { const v = CAB.rar[MSSMedalCard.rarityKey(b)]; return v == null ? 101 : v; };
// one achievement's medal as a badge (for the Medal card): their top level, or level 1 locked
function achBadge(a) {
  const top = topLevel(a);
  return CAB.badges.find(b => b.kind === 'achievement' && b.ach_key === a.key && b.ach_level === top)
    || { id: null, kind: 'achievement', ach_key: a.key, ach_level: Math.max(1, top), at: a.levels[Math.max(1, top) - 1], title: a.name, earned_at: null, _locked: !top };
}
function summaryHTML() {
  const B = CAB.badges, n = k => B.filter(b => b.kind === k).length;
  const levels = n('achievement'), maxed = CAB.ach.filter(a => topLevel(a) === 4).length, total = B.length;
  const segs = [['achievement', 'Achievement levels', levels], ['official', 'Official', n('official')], ['challenge', 'Challenges', n('challenge')], ['secret', 'Secrets', n('secret')], ['member', 'Member', n('member')]].filter(s => s[2]);
  const member = B.find(b => b.kind === 'member');
  const mf = member ? MSSMedal.memberFor(member.earned_at).split(' ') : null;
  const short = { days: 'days', day: 'day', months: 'mo', month: 'mo', years: 'yr', year: 'yr' };
  const found = n('secret'), hidden = Math.max(0, CAB.secretTotal - found);
  try { localStorage.setItem('mss_medals_' + CAB.user.id, String(total)); } catch {}   // the You sheet's Medals count (nav.js)
  return `<section class="cab-sum" aria-label="Summary">
    <div class="cab-sum-main"><p class="cab-big"><b>${num(total)}</b><span>medal${total === 1 ? '' : 's'}</span></p>
      <span class="cab-stack" role="img" aria-label="${segs.map(s => `${s[2]} ${s[1]}`).join(', ')}">${segs.map(s => `<i class="k-${s[0]}" style="flex:${s[2]}"></i>`).join('')}</span>
      <ul class="cab-legend">${segs.map(s => `<li><i class="k-${s[0]}" aria-hidden="true"></i>${s[1]} ${num(s[2])}</li>`).join('')}</ul></div>
    <div class="cab-sum-cell"><p class="cab-mid"><b>${num(levels)}</b><span>/ ${num(CAB.ach.length * 4)}</span></p><b class="cab-sum-l">Achievement levels</b><small>${maxed} maxed</small></div>
    <div class="cab-sum-cell"><p class="cab-mid"><b>${num(found)}</b><span>/ ${num(CAB.secretTotal)}</span></p><b class="cab-sum-l">Secrets found</b><small>${hidden ? `${hidden} still hidden` : 'All found'}</small></div>
    <div class="cab-sum-cell"><p class="cab-mid"><b>${mf ? esc(mf[0]) : '—'}</b><span>${mf ? esc(short[mf[1]] || mf[1] || '') : ''}</span></p><b class="cab-sum-l">MSF Member</b><small>${member ? `Since ${when(member.earned_at)}` : ''}</small></div>
  </section>`;
}
// Next up: the 3 achievements closest to their next level
function nextHTML() {
  const list = CAB.ach.filter(a => topLevel(a) < 4 && a.count != null).map(a => ({ a, top: topLevel(a), next: a.levels[topLevel(a)] }))
    .map(x => ({ ...x, pct: Math.min(1, x.a.count / x.next) })).sort((p, q) => q.pct - p.pct).slice(0, 3);
  if (!list.length) return '';
  return `<section class="cab-sec" aria-labelledby="cabNextH"><div class="cab-sec-head"><h2 class="cab-sec-title" id="cabNextH">Next up</h2>
      <span class="cab-sec-count">closest to their next level</span></div>
    <div class="cab-next">${list.map(({ a, top, next }) => {
      const left = Math.max(0, next - a.count);
      return `<button type="button" class="cab-nx" data-ach="${a.key}" aria-label="${esc(MSSMedal.ACH[a.key]?.name || a.name)}: ${num(left)} more for ${LV()[top]}">
        <span class="cab-nx-m" aria-hidden="true">${top ? MSSMedal.achievement(a.key, top, { size: 46, at: a.levels[top - 1] }) : MSSMedal.achievement(a.key, 1, { size: 46, locked: true, at: a.levels[0] })}</span>
        <span class="cab-nx-arrow" aria-hidden="true">${icon('arrowRight', 14)}</span>
        <span class="cab-nx-m is-next" aria-hidden="true">${MSSMedal.achievement(a.key, top + 1, { size: 46, locked: true, at: next })}</span>
        <span class="cab-nx-t"><b>${esc(MSSMedal.ACH[a.key]?.name || a.name)}</b><small>${num(left)} more ${esc(unitOf(a.key, left))} to ${LV()[top]}</small>
          <span class="cab-bar" aria-hidden="true"><i style="width:${Math.round(a.count / next * 100)}%"></i></span><small class="cab-nx-n">${num(a.count)} / ${num(next)} · ${LV()[top]} next</small></span></button>`; }).join('')}</div></section>`;
}
function toolsHTML() {
  return `<div class="cab-tools"><div class="pn-toggle cab-tabs" role="tablist" aria-label="Show">${TABS.map(([k, l]) =>
      `<button type="button" role="tab" class="pn-toggle-btn${CAB.tab === k ? ' active' : ''}" aria-selected="${CAB.tab === k}" data-tab="${k}">${l}</button>`).join('')}</div>
    <span class="cab-gap"></span>
    <label class="cab-sort">${icon('sort', 14)}<span class="sr-only">Sort</span><select id="cabSort">${SORTS.map(([k, l]) => `<option value="${k}"${CAB.sort === k ? ' selected' : ''}>${l}</option>`).join('')}</select></label>
    <button type="button" class="tv-btn cab-lock-btn${CAB.locked ? ' is-on' : ''}" data-cab="locked" aria-pressed="${CAB.locked}">${icon('lock', 14)} Show locked</button></div>`;
}
const sortB = list => list.slice().sort(CAB.sort === 'rare' ? (a, b) => rare(a) - rare(b) : CAB.sort === 'az' ? (a, b) => MSSShowcase.name(a).localeCompare(MSSShowcase.name(b)) : (a, b) => new Date(b.earned_at) - new Date(a.earned_at));
function specHTML(b) {
  return `<li><button type="button" class="cab-sp" data-badge="${esc(b.id)}" aria-label="${esc(MSSShowcase.name(b))}, ${esc(MSSShowcase.sub(b))}, ${when(b.earned_at)}">
    <span class="cab-sp-m" aria-hidden="true">${MSSShowcase.medal(b, 76)}</span><b translate="no">${esc(MSSShowcase.name(b))}</b><small>${esc(MSSShowcase.sub(b))}</small><small>${b.kind === 'member' ? 'Since ' : ''}${when(b.earned_at)}</small></button></li>`;
}
// Specials: Member, Official, Challenges and Secrets share one card — it wraps as it grows
function specialsHTML() {
  const B = CAB.badges, t = CAB.tab, show = k => t === 'all' || t === k;
  const groups = [];
  if (t === 'all') { const m = B.filter(b => b.kind === 'member'); if (m.length) groups.push(['Member', m.map(specHTML).join('')]); }
  if (show('official')) { const o = sortB(B.filter(b => b.kind === 'official')); if (o.length || t === 'official') groups.push(['Official', o.length ? o.map(specHTML).join('') : `<li class="cab-sp-none">Finish an official challenge and its medal lands here.</li>`]); }
  if (show('challenge')) { const c = sortB(B.filter(b => b.kind === 'challenge')); if (c.length || t === 'challenge') groups.push(['Challenges', c.length ? c.map(specHTML).join('') : `<li class="cab-sp-none">Race friends in a challenge — 1st gets gold, 2nd silver, everyone after bronze.</li>`]); }
  if (show('secret')) {
    const s = sortB(B.filter(b => b.kind === 'secret')), hidden = Math.max(0, CAB.secretTotal - s.length);
    if (s.length || hidden) groups.push([`Secrets · ${s.length} of ${CAB.secretTotal}`, s.map(specHTML).join('') + Array.from({ length: hidden }, () =>
      `<li><span class="cab-sp is-hidden" aria-label="A secret medal, still hidden"><span class="cab-sp-q" aria-hidden="true">?</span><b>Still hidden</b><small>Keep exploring</small></span></li>`).join('')]);
  }
  if (!groups.length) return '';
  return `<section class="cab-sec" aria-labelledby="cabSpH"><div class="cab-sec-head"><h2 class="cab-sec-title" id="cabSpH">Specials</h2></div>
    <div class="cab-specials">${groups.map(([h, body]) => `<div class="cab-spg"><span class="cab-spg-h">${esc(h)}</span><ul>${body}</ul></div>`).join('')}</div></section>`;
}
// an achievement's ladder card: the current medal, all four levels, progress and what's left
function ladderHTML(a) {
  const top = topLevel(a), lv = a.levels, next = top < 4 ? lv[top] : null, own = a.count != null;
  const D = MSSMedal.ACH[a.key] || { name: a.name };
  const pct = next && own ? Math.min(100, Math.floor(a.count / next * 100)) : null;
  const rungs = [1, 2, 3, 4].map(l => `<span class="cab-rung${l <= top ? ' is-on' : l === top + 1 ? ' is-next' : ''}" aria-hidden="true">${MSSMedal.achievement(a.key, l, { size: 30, locked: l > top, at: lv[l - 1] })}</span>`).join('<i class="cab-rung-line" aria-hidden="true"></i>');
  const foot = top === 4 ? `<small>${own ? `${num(a.count)} · ` : ''}every level done</small>`
    : own ? `<small>${num(a.count)} / ${num(next)} · <b>${num(next - a.count)} to ${LV()[top]}</b></small>` : `<small>${top ? `${LV()[top]} next` : 'Not started'}</small>`;
  return `<li><button type="button" class="cab-ld${top ? '' : ' is-locked'}" data-ach="${a.key}" aria-label="${esc(D.name)}: ${top ? `${LV()[top - 1]}, ${num(lv[top - 1])}` : 'not earned yet'}${own && next ? `, ${num(a.count)} of ${num(next)}` : ''}">
    <span class="cab-ld-m" aria-hidden="true">${top ? MSSMedal.achievement(a.key, top, { size: 96, at: lv[top - 1] }) : MSSMedal.achievement(a.key, 1, { size: 96, locked: true, at: lv[0] })}</span>
    <span class="cab-ld-t"><span class="cab-ld-h"><b>${esc(D.name)}</b>${top === 4 ? '<span class="cab-chip">Maxed</span>' : pct != null ? `<span class="cab-pct">${pct}%</span>` : ''}</span>
      <span class="cab-ld-lv">${top ? `${LV()[top - 1]} · ${num(lv[top - 1])}` : 'Not earned yet'}</span>
      <span class="cab-rungs">${rungs}</span>
      ${own || top === 4 ? `<span class="cab-bar" aria-hidden="true"><i style="width:${top === 4 ? 100 : pct}%"></i></span>` : ''}${foot}</span></button></li>`;
}
function achsHTML() {
  if (CAB.tab !== 'all' && CAB.tab !== 'ach') return '';
  let list = CAB.ach.filter(a => CAB.locked || topLevel(a) > 0);
  const prog = a => topLevel(a) === 4 ? -1 : a.count != null ? a.count / a.levels[topLevel(a)] : topLevel(a) / 4;
  const latest = a => Math.max(0, ...(a.earned || []).map(e => +new Date(e.earned_at)));
  list = list.sort(CAB.sort === 'new' ? (a, b) => latest(b) - latest(a) : CAB.sort === 'rare' ? (a, b) => rare(achBadge(a)) - rare(achBadge(b))
    : CAB.sort === 'az' ? (a, b) => (MSSMedal.ACH[a.key]?.name || a.name).localeCompare(MSSMedal.ACH[b.key]?.name || b.name) : (a, b) => prog(b) - prog(a));
  const levels = CAB.badges.filter(b => b.kind === 'achievement').length;
  return `<section class="cab-sec" aria-labelledby="cabAchH"><div class="cab-sec-head"><h2 class="cab-sec-title" id="cabAchH">Achievements</h2><span class="cab-sec-count">${num(levels)} of ${num(CAB.ach.length * 4)} levels</span></div>
    ${list.length ? `<ul class="cab-ladders">${list.map(ladderHTML).join('')}</ul>` : '<p class="cab-sp-none">Nothing earned yet — “Show locked” shows every achievement and what it takes.</p>'}</section>`;
}
function cabDraw() {
  const page = document.getElementById('cabPage');
  page.innerHTML = `${cabBack()}
    <div class="cab-head"><div>
      <div class="cab-eyebrow">Your medals</div>
      <h1 class="cab-title">Achievement Cabinet</h1>
      <div class="cab-sub">Every medal you’ve earned — and how close you are to the next one.</div></div>
      <div class="cab-acts"><button type="button" class="tv-btn" data-cab="share">${icon('share', 16)}<span>Share</span></button><button type="button" class="tv-btn is-main" data-cab="edit">${icon('edit', 16)}<span>Edit showcase</span></button></div></div>
    ${summaryHTML()}${nextHTML()}${toolsHTML()}${specialsHTML()}${achsHTML()}`;
}
function setParam(k, v, def) { const u = new URL(location.href); if (v === def) u.searchParams.delete(k); else u.searchParams.set(k, v); history.replaceState(null, '', u); }

/* ── taps ── */
async function cabCard(b) {
  const ctx = { own: true, where: 'cabinet', look: CAB.sc?.look };
  if (CAB.sc && b.id) ctx.showcase = { at: id => CAB.sc.picks.findIndex(x => x.id === id), toggle: cabToggle };
  MSSMedalCard.open(b, ctx);
}
async function cabToggle(b) {
  const picks = CAB.sc.picks.slice(), at = picks.findIndex(x => x.id === b.id);
  if (at >= 0) picks.splice(at, 1); else if (picks.length >= MSSShowcase.MAX) { showToast('All 9 spots are taken — take one off first.'); return null; } else picks.push(b);
  await cabSaveShowcase(picks, CAB.sc.look);
  showToast(at >= 0 ? 'Taken off your showcase' : `On your showcase · #${picks.length}`);
}
async function cabSaveShowcase(picks, look) {
  try { await rpc('set_showcase', { p_picks: picks.map(b => b.id), p_look: MSSShowcase.cleanLook(look) }); }
  catch (err) { showToast(err?.code === 'PGRST202' || /set_showcase/i.test(err?.message || '') ? 'Couldn’t save — run the showcase database update (sql/128) first.' : 'Couldn’t save — try again.', 'err'); throw err; }
  CAB.sc = MSSShowcase.read(await rpc('get_showcase', { p_user: CAB.user.id, p_all: true }));
}
async function cabEdit() {
  if (!CAB.sc) { showToast('Couldn’t load your showcase — try again.', 'err'); return; }
  await mssLoadScript('js/showcase-studio.js');
  const me = window._navUserProfile || {};
  MSSShowcaseStudio.open({ picks: CAB.sc.picks.slice(), look: { ...CAB.sc.look }, all: CAB.sc.all || CAB.badges, name: me.display_name || me.username || 'You', total: CAB.badges.length,
    profileBg: async () => CAB.sc.profileBg ? `${MSSShowcase.IMG}w780${CAB.sc.profileBg}` : null,
    save: async (picks, look) => { await cabSaveShowcase(picks, look); showToast('Showcase saved'); } });
}
// Share: your Showcase (profile-view.html's tab 5) — the cabinet itself is only yours to see
function cabShare() {
  const un = window._navUserProfile?.username || '';
  const url = new URL(`profile-view.html?id=${encodeURIComponent(CAB.user.id)}&tab=5`, location.href).href;
  if (navigator.share) { navigator.share({ title: `MyScreenFolio — ${un ? '@' + un + '’s ' : ''}medals`, url }).catch(() => {}); return; }
  navigator.clipboard?.writeText(url).then(() => showToast('Link copied'));
}
document.addEventListener('click', ev => {
  const t = ev.target.closest('.cab-tabs [data-tab]'); if (t) { CAB.tab = t.dataset.tab; setParam('tab', CAB.tab, 'all'); cabDraw(); document.querySelector(`.cab-tabs [data-tab="${CAB.tab}"]`)?.focus(); return; }
  const c = ev.target.closest('[data-cab]');
  if (c) { const k = c.dataset.cab; if (k === 'locked') { CAB.locked = !CAB.locked; cabDraw(); document.querySelector('[data-cab="locked"]')?.focus(); } else if (k === 'edit') cabEdit(); else if (k === 'share') cabShare(); return; }
  const a = ev.target.closest('[data-ach]');
  if (a) { const x = CAB.ach.find(y => y.key === a.dataset.ach); if (x) cabCard(achBadge(x)); return; }
  const b = ev.target.closest('[data-badge]'); if (b) { const x = CAB.badges.find(y => y.id === b.dataset.badge); if (x) cabCard(x); }
});
document.addEventListener('change', ev => { if (ev.target.id === 'cabSort') { CAB.sort = ev.target.value; setParam('sort', CAB.sort, 'close'); cabDraw(); document.getElementById('cabSort')?.focus(); } });

// While it loads: the summary, Next up and ladder cards as blocks (mssSkeleton)
mssSkeleton.define('cabinet', () => `<div class="cab-head"><div><div class="cab-eyebrow" data-skel-keep>Your medals</div><h1 class="cab-title" data-skel-keep>Achievement Cabinet</h1><div class="cab-sub">Every medal you’ve earned</div></div></div>
  <section class="cab-sum"><div class="cab-sum-main"><p class="cab-big"><b>33</b><span>medals</span></p><span class="cab-stack"><i style="flex:1"></i></span></div>${'<div class="cab-sum-cell"><p class="cab-mid"><b>29</b></p><b class="cab-sum-l">Achievement levels</b></div>'.repeat(3)}</section>
  <section class="cab-sec"><div class="cab-sec-head"><h2 class="cab-sec-title" data-skel-keep>Next up</h2></div><div class="cab-next">${'<span class="cab-nx"><span class="cab-nx-m skel"></span><span class="cab-nx-t"><b>Notes written</b><small>42 more notes to Gold</small></span></span>'.repeat(3)}</div></section>
  <section class="cab-sec"><ul class="cab-ladders">${'<li><span class="cab-ld"><span class="cab-ld-m skel"></span><span class="cab-ld-t"><b>Notes written</b><span class="cab-ld-lv">Silver · 50</span><small>58 / 100</small></span></span></li>'.repeat(6)}</ul></section>`);

document.addEventListener('DOMContentLoaded', () => {
  initPage(async user => {
    CAB.user = user;
    // an old link to someone else's cabinet (or a shared one): their Showcase instead
    const other = new URLSearchParams(location.search).get('user');
    if (other && other !== user?.id) { location.replace(`profile-view.html?id=${encodeURIComponent(other)}&tab=5`); return; }
    if (!user) { document.getElementById('cabPage').innerHTML = mssGuestEmpty('cabinet'); return; }
    try { await cabLoad(); }
    catch (err) {
      console.error('Cabinet:', err);
      mssErrorPage(mssErrorKind(err), { error: err });
    }
  });
});
</script>
</body>
</html>
