<script>
// Old links to Social's sections → their own pages (notifications, bookmarks, saved tabs)
(() => {
  const u = new URL(location.href), to = { activity: 'activity.html', compare: 'compare.html', blend: 'blend.html', epchat: 'episode-chat.html',
    night: 'movie-night.html', challenges: 'challenges.html', polls: 'polls.html', recs: 'messages.html',
    lists: 'lists.html?view=friends', notes: 'notes.html?view=friends' }[u.searchParams.get('s')];
  if (!to) return;
  u.searchParams.delete('s');
  location.replace(to + (to.includes('?') ? u.search.replace('?', '&') : u.search) + u.hash);
})();
</script>

<script>
/* Friends (friends.html): your friends, Following / Followers and Requests. Shared code: social-core.js. */
const _PIN_SVG = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"/><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"/></svg>`;
const _PIN_SVG_FILLED = `<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"/><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"/></svg>`;
/* ── Loading skeleton (Friends / Activity): the section's toolbar and its own friend cards or
   activity updates with sample text, masked into placeholders — as many friends as last time ── */
// The same cards for Friends, Following and Followers — as many as there are, up to 8
function _frSkelCards() {
  const yours = _frPeople === 'friends' && !_frOf;
  const known = yours ? mssSkeleton.shape('fr')?.n : _frOf ? null : _frFollowState?.[_frPeople];
  const n = Math.min(Math.max(known ?? 4, 1), 8);
  const card = _frMemberCard({ id: '', friendId: '', friendProfile: { username: 'username', display_name: 'Friend name' } });
  return { n, yours, html: `<div class="fm-grid">${Array(n).fill(card).join('')}</div>` };
}
const _frSkelCount = n => `<div class="fr-people-count"><b>${n}</b> people</div>`;
mssSkeleton.define('fr-cards', () => {
  const s = _frSkelCards();
  return _frSkelKeep(_frSkelCount(s.n) + s.html).replace(/ (id|onclick)="[^"]*"/g, '');
});
mssSkeleton.define('fr-page', () => {
  if (_frRequests) return mssSkeleton('rows');
  const s = _frSkelCards();
  return _frSkelKeep(s.yours
    ? `<div class="fr-toolbar">${_frToolbarHTML('Your Friends', s.n, s.n > 1 ? 'frFriends' : null, 'friends')}</div>${_frPeopleHead()}${s.html}`
    : _frPeopleHead() + _frSkelCount(s.n) + s.html).replace(/ (id|onclick)="[^"]*"/g, '');
});

function _frRender() {
  _frPaintReqBtn();
  if (_frGateAuth() || _frGateData()) return;
  if (_frRequests) return _frRenderRequests();
  _frRenderFriends();
}
/* ══ FRIENDS ══ */
SF.register('frFriends', {
  base: () => _frAccepted.map(f => ({ ...f, id: f.friendId, title: _frName(f.friendId), created_at: f.created_at })),
  render: () => _frRender(),
  defaultSort: 'active',
  presets: {
    activity: { header: 'Activity', opts: [['active', 'Recently Active'], ['watched_most', 'Most Watched']] },
    added:    { header: 'Friends Since', opts: [['newest', 'Newest'], ['oldest', 'Oldest']] },
    taste:    { header: 'Taste', opts: [['match', 'Best Match']] },
  },
  sorts: () => ['activity', 'taste', 'added', 'alpha'],
  filters: () => [],
  addedDate: f => f.created_at,
  compare: {
    active: (a, b) => new Date(_frStats[b.friendId]?.recent || 0) - new Date(_frStats[a.friendId]?.recent || 0),
    watched_most: (a, b) => (_frStats[b.friendId]?.completed || 0) - (_frStats[a.friendId]?.completed || 0),
    match: (a, b) => (_frMatchPct(b.friendId) ?? -1) - (_frMatchPct(a.friendId) ?? -1),
  },
  // Your pinned friend always comes first
  postSort: (sec, list) => { const pin = _fProfile?.pinned_friend_id; return pin ? [...list.filter(f => f.friendId === pin), ...list.filter(f => f.friendId !== pin)] : list; },
});

function _frMemberCard(f) {
  const st = _frStats[f.friendId] || {};
  const p = f.friendProfile || {};
  const un = p.username || 'unknown';
  const name = p.display_name || null;
  const somePinned = !!_fProfile?.pinned_friend_id, isPinned = _fProfile?.pinned_friend_id === f.friendId;
  const cover = (st.posters || []);
  const now = st.watchingNow;
  return `<article class="fm-card${isPinned ? ' is-pinned' : ''}" id="fc-${f.id}" onclick="viewFriend(${attrJSON(f.friendId)}, ${attrJSON(un)})">
    <div class="fm-cover">
      ${cover.length ? cover.map(e => `<div class="fm-cover-tile">${_frPosterHTML(e, 'fm-cover-img')}</div>`).join('') : '<div class="fm-cover-empty"></div>'}
      <div class="fm-cover-shade"></div>
      ${_frMatchPct(f.friendId) != null ? (m => `<span class="fm-match${m >= 80 ? ' hi' : m < 55 ? ' lo' : ''}" title="Taste match — based on ${_cmpMatch(f.friendId).rated} titles you've both rated">${icon('compare', 11)} ${m}% match</span>`)(_frMatchPct(f.friendId)) : ''}
      ${(!somePinned || isPinned) ? `<button type="button" class="fm-pin${isPinned ? ' on' : ''}" title="${isPinned ? 'Unpin' : 'Pin to top'}" aria-label="${isPinned ? 'Unpin' : 'Pin to top'}" onclick="event.stopPropagation();togglePinFriend(${attrJSON(f.friendId)})">${isPinned ? _PIN_SVG_FILLED : _PIN_SVG}</button>` : ''}
    </div>
    <div class="fm-body">
      <div class="fm-av">${_frAvHTML(p, 64)}</div>
      <div class="fm-name">${escHTML(name || un)}</div>
      <div class="fm-user">@${escHTML(un)}</div>
      <div class="fm-stats">
        <div><b>${st.completed || 0}</b><span>Watched</span></div>
        <div><b>${st.avgScore || '—'}</b><span>Avg Score</span></div>
        <div><b>${st.queue || 0}</b><span>Watchlist</span></div>
      </div>
      ${now ? `<button type="button" class="fm-now" onclick="event.stopPropagation();_frOpenEvent(${attrJSON(now.id)}, 'started')">${_frPosterHTML(now, 'fm-now-poster')}<span><small>Watching now</small>${escHTML(now.title)}</span></button>`
        : st.latest ? `<button type="button" class="fm-now" onclick="event.stopPropagation();_frOpenEvent(${attrJSON(st.latest.e.id)}, ${attrJSON(st.latest.type)})">${_frPosterHTML(st.latest.e, 'fm-now-poster')}<span><small>Latest · ${escHTML(_FR_ACT[st.latest.type].label)}</small>${escHTML(st.latest.e.title)}</span></button>`
        : `<div class="fm-now fm-now-idle"><span><small>Latest</small>No activity yet</span></div>`}
      <div class="fm-actions" onclick="event.stopPropagation()">
        <button class="fm-btn fm-btn-primary" onclick="_frCompareWith(${attrJSON(f.friendId)})">${icon('compare', 13)} Compare</button>
        <button class="fm-btn" onclick="viewFriend(${attrJSON(f.friendId)}, ${attrJSON(un)})">Profile</button>
        <button class="fm-icon-btn fm-danger" title="Unfollow" aria-label="Unfollow @${escHTML(un)}" onclick="doUnfriend(${attrJSON(f.friendId)}, ${attrJSON(un)})">${icon('x', 13)}</button>
      </div>
    </div>
  </article>`;
}

/* ── Requests (?view=requests): reached from the Requests button, not mixed in with your friends ── */
let _frRequests = false;
function _frPaintReqBtn() {
  const n = _frIncoming.length, el = document.getElementById('frReqN'), btn = document.getElementById('frReqBtn');
  if (!el) return;
  el.hidden = !n; el.textContent = n;
  btn.hidden = _frFixed;
  if (_frRequests) btn.setAttribute('aria-current', 'page'); else btn.removeAttribute('aria-current');
}
function _frSetRequests(on) {
  _frRequests = on;
  const url = new URL(location.href);
  if (on) url.searchParams.set('view', 'requests'); else url.searchParams.delete('view');
  history.replaceState(history.state, '', url.pathname + url.search);
  _frRender();
  window.scrollTo({ top: 0, behavior: 'instant' });
}
function _frGoRequests(e) {
  if (e.ctrlKey || e.metaKey || e.shiftKey || e.button) return true;
  _frSetRequests(!_frRequests);
  return false;
}
function _frRenderRequests() {
  document.getElementById('frToolbar').style.display = 'none';
  const row = (kind, p) => MSSFollow.rowHTML(p, kind === 'requests' ? { kind, own: true } : { kind });
  const sec = (cls, ic, title, list, kind, dot) => list.length ? `<section class="fr-req${cls}">
      <div class="fr-req-head"><span class="fr-req-title">${icon(ic, 14)} ${title}</span>${dot ? `<span class="fr-tab-dot">${list.length}</span>` : ''}</div>
      <div class="fl-list">${list.map(p => row(kind, p)).join('')}</div>
    </section>` : '';
  const html = sec('', 'bell', 'Follow requests', _frIncoming, 'requests', true)
    + sec(' fr-back', 'users', 'Follow back to be friends', _frBack, 'back')
    + sec('', 'send', 'Sent requests', _frOutgoing, 'sent');
  document.getElementById('frContent').innerHTML = `<button type="button" class="ns-back fr-req-back" onclick="_frSetRequests(false)">${icon('back', 14)} Back to friends</button>`
    + (html || _frEmptyHTML('users', 'No requests right now', 'When someone asks to follow you, it shows up here.'));
}

/* ── Friends · Following · Followers (083) ──
   A switch over the cards. Opened from a profile's counts (?people=followers[&of=<id>&u=<name>])
   the page shows just that list — no switch, a Back link and whose people they are. ── */
let _frPeople = 'friends', _frOf = null, _frOfName = '', _frFixed = false;
const _frPeopleData = {};       // 'kind:userId' → { items, more, stats, busy }
const _frPKey = () => `${_frPeople}:${_frOf || _fUser?.id}`;
function _frPeopleHead() {
  if (_frFixed) {
    const whose = _frOf ? `@${escHTML(_frOfName)}` : 'Your';
    const label = { friends: 'Friends', following: 'Following', followers: 'Followers' }[_frPeople];
    return `<div class="fr-people-head"><button type="button" class="ns-back" onclick="_frPeopleBack()">${icon('back', 14)} Back</button>
      <div class="fr-people-title">${whose} <b>${label}</b></div></div>`;
  }
  const st = _frFollowState || {};
  const n = k => st[k] != null ? `<span class="fr-people-n">${Number(st[k]).toLocaleString(MSSI18n.locale)}</span>` : '';
  return `<div class="pn-toggle soc-toggle fr-people-toggle" role="tablist" aria-label="Friends, following and followers">${[['friends', 'Friends'], ['following', 'Following'], ['followers', 'Followers']].map(([k, l]) =>
    `<button type="button" role="tab" class="pn-toggle-btn${_frPeople === k ? ' active' : ''}" aria-selected="${_frPeople === k}" onclick="_frSetPeople('${k}')">${l}${n(k)}</button>`).join('')}</div>`;
}
function _frSetPeople(k) {
  _frPeople = k;
  const url = new URL(location.href);
  if (k === 'friends') url.searchParams.delete('view'); else url.searchParams.set('view', k);
  history.replaceState(history.state, '', url.pathname + url.search);
  _frRender();
}
function _frPeopleBack() {
  if (history.length > 1 && document.referrer && new URL(document.referrer).origin === location.origin) history.back();
  else location.href = _frOf ? `profile-view.html?id=${encodeURIComponent(_frOf)}&u=${encodeURIComponent(_frOfName)}` : 'profile.html';
}

function _frRenderFriends() {
  // Your friends — the full cards
  if (_frPeople === 'friends' && !_frOf) {
    const list = SF.list('frFriends', 'all');
    mssSkeleton.shape('fr', { n: Math.min(_frAccepted.length, 8) });
    _frToolbar(_frFixed ? 'Your Friends' : 'Your Friends', _frAccepted.length, _frAccepted.length > 1 ? 'frFriends' : null, _frAccepted.length === 1 ? 'friend' : 'friends');
    document.getElementById('frContent').innerHTML = _frPeopleHead() + (_frAccepted.length
      ? `<div class="fm-grid">${list.map(_frMemberCard).join('')}</div>`
      : _frEmptyHTML('users', 'Watching solo for now', 'Everything’s better with someone to argue about the ending with. Find people above and follow them — when they follow you back, you’re friends.'));
    return;
  }
  _frRenderPeople();
}

// Following / Followers (yours), or someone else's Friends / Following / Followers
async function _frLoadPeople(more) {
  const key = _frPKey(), who = _frOf || _fUser.id;
  const d = _frPeopleData[key] || (_frPeopleData[key] = { items: [], more: false, stats: {}, busy: false, loaded: false });
  if (d.busy) return;
  d.busy = true;
  try {
    const got = await getFollowList(who, _frPeople, more ? d.items.length : 0);
    const ids = got.map(p => p.id);
    const [ents, profs] = ids.length ? await Promise.all([
      sb.from('entries').select('*').in('user_id', ids).order('updated_at', { ascending: false }).limit(3000).then(r => r.data || [], () => []),
      sb.from('profiles').select('id, top_picks').in('id', ids).then(r => r.data || [], () => []),
    ]) : [[], []];
    const tp = Object.fromEntries(profs.map(x => [x.id, x.top_picks]));
    got.forEach(p => {
      const mine = ents.filter(e => e.user_id === p.id);
      mine.forEach(e => { window._frEntryMap[e.id] = e; });
      d.stats[p.id] = { ...computeStats(mine), watchingNow: mine.find(e => e.status === 'watching') || null,
        latest: mine[0] || null, posters: _frCoverPosters({ top_picks: tp[p.id] }, mine), locked: p.is_private && p.i_follow !== 'accepted' && p.id !== _fUser.id };
    });
    d.items = more ? d.items.concat(got) : got;
    d.more = got.length === 60;
  } catch (e) { console.warn(e); showToast('Couldn’t load these — try again.', 'err'); }
  d.busy = false; d.loaded = true;
  if (_frPKey() === key && _frTab === 'friends') _frRenderPeople();
}
function _frRenderPeople() {
  const d = _frPeopleData[_frPKey()];
  const label = { friends: 'Friends', following: 'Following', followers: 'Followers' }[_frPeople];
  const tb = document.getElementById('frToolbar'); tb.style.display = 'none';
  const c = document.getElementById('frContent');
  if (!d || !d.loaded) {
    c.innerHTML = _frPeopleHead() + `<div class="page-loading" data-skel="fr-cards"></div>`;
    if (!d || !d.busy) _frLoadPeople();
    return;
  }
  const own = !_frOf;
  const empty = { following: own ? ['Not following anyone yet', 'Find people above and follow them — their profiles show up here.'] : ['Not following anyone yet', 'Nobody here yet.'],
    followers: own ? ['No followers yet', 'Share your profile — when people follow you, they show up here.'] : ['No followers yet', 'Nobody here yet.'],
    friends: ['No friends yet', 'When two people follow each other, they’re friends.'] }[_frPeople];
  c.innerHTML = _frPeopleHead()
    + `<div class="fr-people-count"><b>${d.items.length}${d.more ? '+' : ''}</b> ${label.toLowerCase()}</div>`
    + (d.items.length ? `<div class="fm-grid">${d.items.map(p => _frPersonCard(p, d.stats[p.id] || {}, own)).join('')}</div>`
        + (d.more ? `<button type="button" class="rec-btn fl-more" onclick="_frLoadPeople(true)">Show more</button>` : '')
      : _frEmptyHTML('users', empty[0], empty[1]));
}
// A person's card — the same look as a friend's: their favourites, stats, what they're watching
function _frPersonCard(p, st, own) {
  const un = p.username || 'unknown', rel = followRelation(p), id = attrJSON(p.id), me = p.id === _fUser?.id;
  const cover = st.posters || [];
  const now = st.watchingNow, last = st.latest;
  return `<article class="fm-card" onclick="viewFriend(${id}, ${attrJSON(un)})">
    <div class="fm-cover">
      ${cover.length ? cover.map(e => `<div class="fm-cover-tile">${_frPosterHTML(e, 'fm-cover-img')}</div>`).join('') : '<div class="fm-cover-empty"></div>'}
      <div class="fm-cover-shade"></div>
      ${rel === 'follows_you' && _frPeople !== 'followers' ? `<span class="fm-match">Follows you</span>` : ''}
    </div>
    <div class="fm-body">
      <div class="fm-av">${_frAvHTML(p, 64)}</div>
      <div class="fm-name">${escHTML(p.display_name || un)}</div>
      <div class="fm-user">@${escHTML(un)}${p.is_private ? ` ${icon('lock', 11)}` : ''}</div>
      ${st.locked ? `<div class="fm-now fm-now-idle fm-locked"><span>${icon('lock', 13)} Private account</span></div>` : `
      <div class="fm-stats">
        <div><b>${st.completed || 0}</b><span>Watched</span></div>
        <div><b>${st.avgScore || '—'}</b><span>Avg Score</span></div>
        <div><b>${st.queue || 0}</b><span>Watchlist</span></div>
      </div>
      ${now ? `<button type="button" class="fm-now" onclick="event.stopPropagation();_frOpenEvent(${attrJSON(now.id)}, 'started')">${_frPosterHTML(now, 'fm-now-poster')}<span><small>Watching now</small>${escHTML(now.title)}</span></button>`
        : last ? `<button type="button" class="fm-now" onclick="event.stopPropagation();_frOpenEvent(${attrJSON(last.id)}, 'logged')">${_frPosterHTML(last, 'fm-now-poster')}<span><small>Latest</small>${escHTML(last.title)}</span></button>`
        : `<div class="fm-now fm-now-idle"><span><small>Latest</small>No activity yet</span></div>`}`}
      <div class="fm-actions" onclick="event.stopPropagation()">
        ${me ? `<button class="fm-btn" onclick="location.href='profile.html'">Your profile</button>` : `<button class="fm-btn ${rel === 'none' || rel === 'follows_you' ? 'fm-btn-primary' : ''}" onclick="_frPeopleTap(${id}, this)">${MSSFollow.btnLabel(rel)}</button>`}
        <button class="fm-btn" onclick="viewFriend(${id}, ${attrJSON(un)})">Profile</button>
        ${own && _frPeople === 'followers' ? `<button class="fm-icon-btn fm-danger" title="Remove follower" aria-label="Remove @${escHTML(un)} from your followers" onclick="_frPeopleRemove(${id})">${icon('x', 13)}</button>` : ''}
      </div>
    </div>
  </article>`;
}
async function _frPeopleTap(uid, btn) {
  const d = _frPeopleData[_frPKey()], p = d?.items.find(x => x.id === uid); if (!p) return;
  btn.disabled = true;
  try {
    const r = await MSSFollow.tap(uid, followRelation(p), { username: p.username });
    if (r != null) { p.i_follow = r === 'following' ? 'accepted' : r === 'requested' ? 'pending' : 'none'; }
  } catch (e) { showToast(e?.hint || 'Something went wrong — try again.', 'err'); }
  btn.disabled = false;
}
async function _frPeopleRemove(uid) {
  const d = _frPeopleData[_frPKey()], p = d?.items.find(x => x.id === uid);
  const ok = await showConfirm({ title: 'Remove this follower?', message: `@${p?.username || ''} won’t be told. They stop following you${p?.i_follow === 'accepted' ? ' — and you stop being friends' : ''}.`, confirmText: 'Remove', iconName: 'users' });
  if (!ok) return;
  try { await removeFollower(uid); showToast('Removed from your followers'); document.dispatchEvent(new CustomEvent('mss:follows-changed', { detail: { id: uid } })); }
  catch { showToast('Something went wrong — try again.', 'err'); }
}



function _frCompareWith(uid) { location.href = `compare.html?with=${encodeURIComponent(uid)}`; }

/* ── Start ── */
document.addEventListener('DOMContentLoaded', () => {
  attachClearButton('addFriendInput');
  const q = new URLSearchParams(location.search);
  // A profile's Followers / Following / Friends count → just that list (no switch)
  const ppl = q.get('people'), view = q.get('view');
  if (['friends', 'following', 'followers'].includes(ppl)) { _frPeople = ppl; _frFixed = true; _frOf = q.get('of') || null; _frOfName = q.get('u') || ''; }
  if (_frFixed) document.body.classList.add('fr-fixed');
  else if (['following', 'followers'].includes(view)) _frPeople = view;
  else if (view === 'requests') _frRequests = true;
  MSSSocial.paint('friends');
  _frRender();
  initPage(async (user) => {
    _fUser = user;
    if (user && _frOf === user.id) _frOf = null;              // your own list
    _frAuthKnown = true;
    _frRender();
    if (!user) { document.getElementById('friendsPageSub').textContent = 'Search for someone above to view their profile.'; return; }
    await loadFriends();
    MSSSocial.paint();
  });
});

async function togglePinFriend(friendId) {
  const wasPinned = _fProfile && _fProfile.pinned_friend_id === friendId;
  const newPinnedId = wasPinned ? null : friendId;

  const prevPinnedId = _fProfile ? _fProfile.pinned_friend_id : null;
  if (_fProfile) _fProfile.pinned_friend_id = newPinnedId;
  _frRender();

  try {
    await setPinnedFriend(_fUser.id, newPinnedId);
    showToast(wasPinned ? 'Unpinned.' : 'Friend pinned!');
  } catch (e) {
    if (_fProfile) _fProfile.pinned_friend_id = prevPinnedId;
    _frRender();
    showToast('Error updating pin.', 'err');
  }
}

// Unfollowing a friend (you stop being friends; MSSFollow asks first)
async function doUnfriend(userId, username) {
  try { const r = await MSSFollow.tap(userId, 'friends', { username }); if (r != null) showToast('Unfollowed'); }
  catch (e) { showToast('Something went wrong — try again.', 'err'); }
}
// Any follow / unfollow / request answered (here or in a popup) → this page catches up
document.addEventListener('mss:follows-changed', () => { if (!_fUser) return; Object.keys(_frPeopleData).forEach(k => delete _frPeopleData[k]); loadFriends(); });

/* ── Live username search dropdown ── */
let _udTimer = null;
let _udActive = -1;
let _udResults = [];

// Create dropdown on body - after DOM ready
/* dropdown created in HTML */

function _udPosition() {
  const wrap = document.getElementById('addFriendWrap');
  const drop  = document.getElementById('udDropdown');
  if (!wrap || !drop) return;
  const r = wrap.getBoundingClientRect();
  drop.style.top    = r.bottom + 'px';
  drop.style.left   = r.left + 'px';
  drop.style.width  = r.width + 'px';
  drop.style.position = 'fixed';
}

// The dropdown's scroll lock (shared mssLockScroll / mssUnlockScroll, config.js)
let _udLocked = false;
function _udLock() { if (!_udLocked) { _udLocked = true; mssLockScroll('udDropdown'); } }
function _udUnlock() { if (_udLocked) { _udLocked = false; mssUnlockScroll('udDropdown'); } }
async function _udSearch(val) {
  const q = val.trim().toLowerCase();
  const drop = document.getElementById('udDropdown');
  clearTimeout(_udTimer);
  _udActive = -1;
  if (q.length < 2) { drop.classList.remove('open');
  document.getElementById('addFriendWrap')?.classList.remove('dd-connected-active');
  _udUnlock();
  return; }
  _udPosition();
  drop.innerHTML = '<div class="ud-loading">Searching…</div>';
  drop.classList.add('open');
  document.getElementById('addFriendWrap')?.classList.add('dd-connected-active');
  _udLock();
  _udTimer = setTimeout(async () => {
    try {
      const { data } = await sb.from('profiles')
        .select('id, username, display_name, avatar_url')
        .ilike('username', q + '%')
        .neq('id', _fUser?.id || '')
        .limit(10);
      _udResults = data || [];
      if (!_udResults.length) {
        drop.innerHTML = '<div class="ud-empty">No users found</div>';
        return;
      }
      drop.innerHTML = _udResults.map((p, i) => {
        const initial = (p.username[0] || '?').toUpperCase();
        const avatarHTML = safeURL(p.avatar_url)
          ? '<div class="ud-avatar"><img src="'+safeURL(p.avatar_url)+'" loading="lazy"></div>'
          : '<div class="ud-avatar">' + initial + '</div>';
        const reg = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
        const highlighted = p.username.replace(reg, '<em>$1</em>');
        const display = p.display_name && p.display_name !== p.username ? p.display_name : '';
        const href = `profile-view.html?id=${encodeURIComponent(p.id)}&u=${encodeURIComponent(p.username)}`;
        return '<a class="ud-item" href="' + href + '" data-i="' + i + '" onclick="_udClose(true)">'
          + avatarHTML
          + '<div class="ud-info"><div class="ud-username" translate="no">@' + highlighted + '</div>'
          + (display ? '<div class="ud-display" translate="no">' + escHTML(display) + '</div>' : '')
          + '</div></a>';
      }).join('');
    } catch(e) {
      drop.innerHTML = '<div class="ud-empty">Error searching</div>';
    }
  }, 250);
}

// Closes the results. clear: leaving for a profile, so Back returns to an empty box
function _udClose(clear) {
  clearTimeout(_udTimer);
  document.getElementById('udDropdown').classList.remove('open');
  document.getElementById('addFriendWrap')?.classList.remove('dd-connected-active');
  _udUnlock();
  _udResults = []; _udActive = -1;
  if (clear) document.getElementById('addFriendInput').value = '';
}
function _udOpen(p) { _udClose(true); viewFriend(p.id, p.username); }
// Enter: the highlighted result, else an exact match, else the top result
async function _udEnter() {
  const q = document.getElementById('addFriendInput').value.trim().toLowerCase();
  const hit = _udResults[_udActive] || _udResults.find(p => p.username.toLowerCase() === q) || _udResults[0];
  if (hit) { _udOpen(hit); return; }
  if (q.length < 2) return;
  try {   // pressed before the results arrived
    const { data } = await sb.from('profiles').select('id, username').ilike('username', q).neq('id', _fUser?.id || '').limit(1);
    if (data?.length) _udOpen(data[0]); else showToast('User not found.', 'err');
  } catch { showToast('Error finding user.', 'err'); }
}

function _udKeydown(e) {
  if (e.key === 'Enter') { e.preventDefault(); _udEnter(); return; }
  const drop = document.getElementById('udDropdown');
  if (!drop.classList.contains('open')) return;
  if (e.key === 'Escape') { _udClose(); return; }
  const items = drop.querySelectorAll('.ud-item');
  if (!items.length || (e.key !== 'ArrowDown' && e.key !== 'ArrowUp')) return;
  e.preventDefault();
  _udActive = e.key === 'ArrowDown' ? Math.min(_udActive + 1, items.length - 1) : Math.max(_udActive - 1, -1);
  items.forEach((el, i) => el.classList.toggle('ud-active', i === _udActive));
  items[_udActive]?.scrollIntoView({ block: 'nearest' });
}

// Close the Find-people dropdown when clicking elsewhere. Only acts while
// the dropdown is open — it used to run on EVERY click on the page and
// scroll you back to the top (its old container class no longer exists).
document.addEventListener('click', e => {
  const drop = document.getElementById('udDropdown');
  if (!drop || !drop.classList.contains('open')) return;
  if (e.target.closest('.fr-find') || e.target.closest('#udDropdown')) return;
  _udClose();
});

window.addEventListener('scroll', _udPosition, { passive: true });
window.addEventListener('resize', _udPosition, { passive: true });

</script>
