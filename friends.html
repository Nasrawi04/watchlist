<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Friends — MyScreenScore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
.fused-search-wrap {
  display:flex; align-items:stretch;
  border:1.5px solid var(--border-olive); border-radius:var(--radius-sm); overflow:hidden;
  background:var(--bg-3); transition:border-color var(--trans) var(--ease), box-shadow var(--trans) var(--ease);
}
.fused-search-wrap:focus-within { border-color:var(--olive-light); box-shadow:0 0 0 3px var(--olive-faint); }
.add-friend-input{
  flex:1; min-width:0; background:transparent; border:none;
  color:var(--text);font-size:14px;
  padding:12px 18px;outline:none;box-sizing:border-box;
}
.add-friend-input::placeholder{color:var(--text-3)}
.btn-send-req{
  flex-shrink:0;
  background:linear-gradient(135deg, var(--olive-light), var(--olive-2));border:none;
  color:#fff;font-size:13px;font-weight:500;padding:10px 22px;cursor:pointer;
  transition:opacity .15s;white-space:nowrap;
}
.btn-send-req:hover{opacity:.9}
.btn-send-req:disabled{opacity:.5;cursor:not-allowed}

@media(max-width:600px){
  .add-friend-input{font-size:16px;padding:10px 14px}
  .btn-send-req{font-size:12px;padding:10px 16px}
}
@media(max-width:400px){
  .add-friend-input{font-size:16px;padding:9px 12px}
  .btn-send-req{font-size:11px;padding:9px 13px}
}

/* ── Username search dropdown ── */
.username-dropdown {
  position:fixed;
  background:var(--bg-3); border:0.5px solid var(--olive-light); border-top:none;
  border-radius:0 0 var(--radius) var(--radius); z-index:290;
  box-shadow:var(--shadow-lg);
  overflow-y:auto; overflow-x:hidden; max-height:320px;
  display:none;
}
.username-dropdown.open { display:block; }
.ud-item {
  display:flex; align-items:center; gap:12px;
  padding:10px 14px; cursor:pointer;
  transition:background .15s;
  border-bottom:0.5px solid var(--border);
}
.ud-item:last-child { border-bottom:none; }
.ud-item:hover, .ud-item.ud-active { background:var(--olive-faint); }
.ud-avatar {
  width:36px; height:36px; border-radius:50%; flex-shrink:0;
  background:var(--bg-3); border:1px solid var(--border-2);
  font-family:var(--serif); font-size:16px; color:var(--text-2);
  display:flex; align-items:center; justify-content:center; overflow:hidden;
}
.ud-avatar img { width:100%; height:100%; object-fit:cover; border-radius:50%; }
.ud-info { flex:1; min-width:0; }
.ud-username { font-size:14px; font-weight:500; color:var(--text); }
.ud-username em { color:var(--olive-light); font-style:normal; font-weight:600; }
.ud-display { font-size:11px; color:var(--text-3); margin-top:2px; }
.ud-loading, .ud-empty { padding:14px; font-size:13px; color:var(--text-3); text-align:center; }
/* ══════════════════════════════════════════════════════════
   Friends — v620 redesign
══════════════════════════════════════════════════════════ */
.fr-page { --fr-gap: 16px; }
/* Header */
/* Title, then the search bar full width underneath — same layout on every screen size
   (like the Home / Discover search) instead of beside the title on laptops only */
.fr-hero { display:flex; flex-direction:column; align-items:stretch; gap:16px; margin-bottom:1.5rem; }
.fr-hero-text { min-width:0; }
.fr-eyebrow { font-family:var(--serif); font-size:12px; font-weight:500; letter-spacing:3px; text-transform:uppercase; color:var(--olive-light); margin-bottom:6px; }
.fr-find { width:100%; position:relative; }
.fr-find .fused-search-wrap { display:flex; align-items:stretch; border:1.5px solid var(--border-olive); border-radius:var(--radius-sm); overflow:hidden; background:var(--bg-3); transition:border-color .15s, box-shadow .15s; }
.fr-find .fused-search-wrap:focus-within { border-color:var(--olive-light); box-shadow:0 0 0 3px var(--olive-faint); }
.fr-find .add-friend-input { flex:1; min-width:0; background:transparent; border:none; color:var(--text); font-size:16px; padding:14px 16px; outline:none; }
.fr-find .btn-send-req { border:none; border-radius:0; padding:0 18px; white-space:nowrap; background:linear-gradient(135deg, var(--olive-light), var(--olive-2)); color:#fff; font-weight:600; font-size:13px; cursor:pointer; }

/* Tabs — underline style with icons + counts */
.fr-tabs { display:flex; gap:4px; border-bottom:0.5px solid var(--border); margin-bottom:1.25rem; overflow-x:auto; scrollbar-width:none; }
.fr-tabs::-webkit-scrollbar { display:none; }
.fr-tab {
  position:relative; flex-shrink:0; display:inline-flex; align-items:center; gap:8px; padding:12px 16px 14px;
  background:none; border:none; cursor:pointer; color:var(--text-3); font-family:var(--sans); font-size:14px; font-weight:600; transition:color .15s;
}
.fr-tab svg { width:15px; height:15px; opacity:.85; }
.fr-tab:hover { color:var(--text); }
.fr-tab.active { color:var(--text); }
.fr-tab.active::after { content:''; position:absolute; left:10px; right:10px; bottom:-0.5px; height:2.5px; border-radius:2px; background:var(--olive-light); }
.fr-tab-count { font-family:var(--bebas); font-size:14px; font-weight:400; color:var(--text-3); letter-spacing:.3px; }
.fr-tab-dot { min-width:18px; height:18px; padding:0 5px; box-sizing:border-box; border-radius:999px; background:#c0392b; color:#fff; font-size:10px; font-weight:700; line-height:18px; text-align:center; }
/* Phones: five equal tabs, icon over label, all visible without scrolling */
@media(max-width:600px) {
  .fr-tabs { display:grid; grid-template-columns:repeat(5, minmax(0, 1fr)); gap:0; overflow:visible; }
  .fr-tab { flex-direction:column; gap:4px; padding:10px 2px 12px; font-size:11px; }
  .fr-tab svg { width:17px; height:17px; }
  .fr-tab-count { display:none; }
  .fr-tab-dot { position:absolute; top:5px; left:calc(50% + 6px); min-width:16px; height:16px; line-height:16px; font-size:9px; }
  .fr-tab.active::after { left:18%; right:18%; }
}

/* Toolbar */
.fr-toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 0 1rem; }
.fr-toolbar-label { display:flex; align-items:baseline; gap:10px; min-width:0; }
.fr-toolbar-title { font-family:var(--serif); font-size:13px; font-weight:500; letter-spacing:2.5px; text-transform:uppercase; color:var(--olive-light); white-space:nowrap; }
.fr-toolbar-count { font-size:12px; color:var(--text-3); white-space:nowrap; }
.fr-toolbar-count b { font-family:var(--bebas); font-weight:400; font-size:15px; color:var(--text-2); }
.fr-toolbar .sort-bar, #cmpToolbar .sort-bar { border-bottom:none; padding:0; margin:0; background:transparent; position:relative; backdrop-filter:none; -webkit-backdrop-filter:none; }
.fr-toolbar .sort-bar::before { content:none; }

/* Shared bits */
.fr-av { border-radius:50%; overflow:hidden; flex-shrink:0; vertical-align:middle; display:inline-flex; align-items:center; justify-content:center; background:var(--olive); color:#fff; font-family:var(--serif); font-weight:600; }
.fr-av img { width:100%; height:100%; object-fit:cover; display:block; }
.fr-poster, .fa-poster, .cp-hero-poster, .fm-cover-img, .fm-now-poster{ position:relative; overflow:hidden; background:var(--bg-3); }
.fr-poster img, .fa-poster img, .cp-hero-poster img, .fm-cover-img img, .fm-now-poster img{ width:100%; height:100%; object-fit:cover; display:block; }
.fr-poster-letter { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--serif); color:var(--olive-light); font-size:18px; }
.fr-empty { text-align:center; padding:3.5rem 1.25rem; }
.fr-empty-ic { width:60px; height:60px; margin:0 auto 14px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--olive-faint); color:var(--olive-light); }
.fr-empty-title { font-family:var(--serif); font-size:19px; font-weight:600; margin-bottom:6px; }
.fr-empty-text { font-size:13.5px; color:var(--text-3); max-width:420px; margin:0 auto; line-height:1.55; }
.fr-more { display:block; margin:18px auto 0; padding:11px 26px; border-radius:var(--radius-sm); border:1px solid var(--border-2); background:transparent; color:var(--text-2); font-family:var(--sans); font-weight:600; font-size:13px; cursor:pointer; }
.fr-more:hover { border-color:var(--border-olive); color:var(--text); }
.fm-btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:8px 14px; border-radius:var(--radius-sm); border:1px solid var(--border-2); background:transparent; color:var(--text-2); font-family:var(--sans); font-size:12.5px; font-weight:600; cursor:pointer; white-space:nowrap; transition:all .15s; }
.fm-btn:hover { border-color:var(--border-olive); color:var(--text); }
.fm-btn svg { width:13px; height:13px; }
.fm-btn-primary { background:var(--olive); border-color:var(--olive); color:#fff; }
.fm-btn-primary:hover { background:var(--olive-light); border-color:var(--olive-light); color:#fff; }

/* Requests */
.fr-req { background:var(--card); border:1px solid var(--border-olive); border-radius:var(--radius-lg); padding:6px 16px 8px; margin-bottom:14px; box-shadow:inset 3px 0 0 var(--olive-light); }
.fr-req-head { display:flex; align-items:center; gap:10px; padding:10px 0 6px; }
.fr-req-title { display:inline-flex; align-items:center; gap:7px; font-weight:700; font-size:13.5px; color:var(--text); }
.fr-req-title svg { width:14px; height:14px; color:var(--olive-light); }
.fr-req-row { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 0; border-top:0.5px solid var(--border); }
.fr-req-who { display:flex; align-items:center; gap:12px; min-width:0; background:none; border:none; padding:0; cursor:pointer; text-align:left; color:var(--text); }
.fr-req-who span { display:flex; flex-direction:column; min-width:0; }
.fr-req-who b { font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.fr-req-who small { font-size:12px; color:var(--text-3); }
.fr-req-actions { display:flex; gap:8px; flex-shrink:0; }
.fr-sent { margin-bottom:16px; }
.fr-sent-toggle { display:inline-flex; align-items:center; gap:6px; background:none; border:none; padding:4px 0; cursor:pointer; color:var(--text-3); font-size:12.5px; font-weight:600; }
.fr-sent-toggle b { color:var(--text-2); }
.fr-sent-toggle svg { width:12px; height:12px; transition:transform .2s; }
.fr-sent.open .fr-sent-toggle svg { transform:rotate(90deg); }
.fr-sent .fr-req-row { background:var(--card); border:0.5px solid var(--border); border-radius:var(--radius); padding:10px 12px; margin-top:8px; }

/* Friend (member) cards */
.fm-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:var(--fr-gap); }
@media(max-width:560px) { .fm-grid { grid-template-columns:1fr; } }
.fm-card { position:relative; background:var(--card); border:0.5px solid var(--border); border-radius:var(--radius-lg); overflow:hidden; cursor:pointer; display:flex; flex-direction:column; transition:transform .2s, box-shadow .2s, border-color .2s; }
.fm-card:hover { transform:translateY(-3px); box-shadow:var(--shadow); border-color:var(--border-olive); }
.fm-card.is-pinned { border-color:var(--border-olive); }
.fm-cover { position:relative; height:96px; display:grid; grid-template-columns:repeat(4, 1fr); background:linear-gradient(135deg, var(--olive) 0%, var(--olive-2, #0f2d14) 100%); }
.fm-cover-tile { position:relative; overflow:hidden; }
.fm-cover-img { position:absolute; inset:0; }
.fm-cover-img img { filter:saturate(1.1); }
.fm-cover-empty { grid-column:1/-1; }
.fm-cover-shade { position:absolute; inset:0; background:linear-gradient(to bottom, rgba(0,0,0,.05), rgba(0,0,0,.45)); pointer-events:none; }
.fm-body { padding:0 16px 16px; display:flex; flex-direction:column; align-items:center; text-align:center; flex:1; }
.fm-av { display:flex; margin-top:-34px; margin-bottom:8px; border-radius:50%; border:3px solid var(--card); box-shadow:0 4px 12px rgba(0,0,0,.18); position:relative; z-index:1; }
.fm-name { font-family:var(--serif); font-size:18px; font-weight:600; color:var(--text); line-height:1.2; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.fm-user { font-size:12.5px; color:var(--text-3); margin-top:2px; }
.fm-stats { display:grid; grid-template-columns:repeat(3, 1fr); width:100%; margin:14px 0 12px; padding:10px 0; border-top:0.5px solid var(--border); border-bottom:0.5px solid var(--border); }
.fm-stats div { display:flex; flex-direction:column; align-items:center; gap:2px; }
.fm-stats div + div { border-left:0.5px solid var(--border); }
.fm-stats b { font-family:var(--bebas); font-weight:400; font-size:22px; color:var(--olive-light); line-height:1; }
.fm-stats span { font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--text-3); font-weight:600; }
.fm-now { display:flex; align-items:center; gap:10px; width:100%; padding:8px; border-radius:var(--radius-sm); background:var(--bg-3); border:none; cursor:pointer; text-align:left; color:var(--text); margin-bottom:12px; transition:background .15s; }
.fm-now:hover { background:var(--olive-faint); }
.fm-now-poster { width:30px; height:45px; border-radius:4px; flex-shrink:0; }
.fm-now span { display:flex; flex-direction:column; min-width:0; font-size:13px; font-weight:600; }
.fm-now span > * , .fm-now span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.fm-now small { font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--olive-light); font-weight:700; }
.fm-now-idle { cursor:default; color:var(--text-3); font-weight:500; }
.fm-now-idle:hover { background:var(--bg-3); }
.fm-actions { display:flex; gap:6px; width:100%; margin-top:auto; }
.fm-actions .fm-btn { flex:1; }
.fm-icon-btn { width:36px; flex-shrink:0; display:flex; align-items:center; justify-content:center; border-radius:var(--radius-sm); border:1px solid var(--border-2); background:transparent; color:var(--text-3); cursor:pointer; transition:all .15s; }
.fm-icon-btn svg { width:13px; height:13px; }
.fm-icon-btn:hover { color:var(--text); border-color:var(--border-olive); }
.fm-icon-btn.on { color:var(--olive-light); border-color:var(--border-olive); background:var(--olive-faint); }
.fm-icon-btn.fm-danger:hover { color:#c0392b; border-color:#c0392b; }

/* Activity feed */
.fa-feed { display:flex; flex-direction:column; gap:10px; max-width:860px; }
.fa-day { font-family:var(--serif); font-size:12px; font-weight:500; letter-spacing:2.5px; text-transform:uppercase; color:var(--olive-light); margin:14px 0 2px; }
.fa-day:first-child { margin-top:0; }
.fa-item { display:flex; align-items:center; gap:14px; padding:12px 14px; cursor:pointer; background:var(--card); border:0.5px solid var(--border); border-radius:var(--radius-lg); transition:border-color .15s, transform .15s; }
.fa-item:hover { border-color:var(--border-olive); transform:translateX(2px); }
.fa-who { position:relative; flex-shrink:0; align-self:flex-start; }
.fa-ic { position:absolute; right:-3px; bottom:-3px; width:19px; height:19px; border-radius:50%; border:2px solid var(--card); display:flex; align-items:center; justify-content:center; color:#fff; }
.fa-ic svg { width:9px; height:9px; }
.fa-body { flex:1; min-width:0; }
.fa-text { font-size:13px; color:var(--text-3); }
.fa-text b { color:var(--text-2); font-weight:700; }
.fa-title { font-family:var(--serif); font-size:17px; font-weight:500; color:var(--text); line-height:1.25; margin:1px 0 5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.fa-title span, .cp-hero-title span { font-family:var(--bebas); font-weight:400; color:var(--text-3); font-size:.85em; letter-spacing:.3px; }
.fa-meta { display:flex; align-items:center; gap:7px; flex-wrap:wrap; font-size:11.5px; color:var(--text-3); }
.fa-meta .type-label { font-size:10.5px; padding:2px 7px; }
.fa-note { margin-top:8px; padding-left:10px; border-left:2px solid var(--border-olive); font-size:13px; font-style:italic; color:var(--text-2); line-height:1.55; }
.fa-score { font-family:var(--bebas); font-size:22px; color:var(--olive-light); flex-shrink:0; letter-spacing:.3px; }
.fa-poster { width:54px; height:81px; border-radius:7px; flex-shrink:0; box-shadow:0 3px 10px rgba(0,0,0,.14); }
@media(max-width:560px) { .fa-item { gap:11px; padding:11px 12px; } .fa-poster { width:44px; height:66px; } .fa-title { font-size:15.5px; } .fa-score { font-size:18px; } }
/* Fanned poster stack{ position:relative; height:150px; padding:16px 16px 0; background:linear-gradient(180deg, var(--olive-faint), transparent); }

/* Notes */
.fn-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(340px, 1fr)); gap:var(--fr-gap); }
@media(max-width:560px) { .fn-grid { grid-template-columns:1fr; } }
.fn-card { background:var(--card); border:0.5px solid var(--border); border-radius:var(--radius-lg); padding:16px; display:flex; flex-direction:column; gap:12px; min-width:0; }
.fn-by { display:flex; align-items:center; gap:7px; font-size:12px; font-weight:600; color:var(--text-2); }
.fn-text { margin:0; padding:2px 0 2px 14px; border-left:3px solid var(--olive-light); font-size:14px; line-height:1.7; color:var(--text); font-style:italic; white-space:pre-line; overflow-wrap:anywhere; }
.fn-text.clamp { display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; overflow:hidden; }

/* v621: pin icon on the cover */
.fm-pin { position:absolute; top:10px; right:10px; z-index:2; width:34px; height:34px; border-radius:50%; cursor:pointer;
  display:flex; align-items:center; justify-content:center; border:1px solid rgba(255,255,255,.35);
  background:rgba(0,0,0,.45); color:#fff; -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); opacity:0; transition:opacity .15s, background .15s; }
.fm-pin svg { width:15px; height:15px; }
.fm-card:hover .fm-pin, .fm-pin:focus-visible { opacity:1; }
.fm-pin.on { opacity:1; background:var(--olive); border-color:var(--olive-light); }
@media (hover:none) { .fm-pin { opacity:1; } }
/* v621: bigger, like the rest of the site */
.fr-toolbar-title { font-size:14px; }
.fr-toolbar-count { font-size:13px; } .fr-toolbar-count b { font-size:17px; }
.fm-grid { grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:20px; }
.fm-cover { height:110px; }
.fm-name { font-size:20px; }
.fm-user { font-size:13px; }
.fm-stats b { font-size:26px; }
.fm-stats span { font-size:11px; }
.fm-now { padding:10px; gap:12px; }
.fm-now-poster { width:36px; height:54px; }
.fm-now span { font-size:14px; }
.fm-btn { padding:10px 16px; font-size:13.5px; }
.fm-icon-btn { width:42px; }
/* Activity uses the full width: two columns on wide screens */
.fa-feed { max-width:none; display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:14px; }
.fa-day { grid-column:1 / -1; font-size:13px; margin:18px 0 0; }
.fa-item { padding:14px 16px; gap:16px; align-items:flex-start; }
.fa-item .fa-score { align-self:center; }
.fa-text { font-size:14px; }
.fa-title { font-size:20px; margin:2px 0 7px; }
.fa-meta { font-size:12.5px; }
.fa-meta .type-label { font-size:11.5px; padding:3px 8px; }
.fa-score { font-size:26px; }
.fa-poster { width:72px; height:108px; border-radius:8px; }
.fa-note { font-size:14px; }
@media(max-width:900px) { .fa-feed { grid-template-columns:minmax(0, 1fr); } }   /* minmax(0,…): long titles ellipsize instead of widening the feed */
@media(max-width:560px) { .fa-poster { width:56px; height:84px; } .fa-title { font-size:17px; } .fa-score { font-size:20px; } }
.cp-cell { min-width:70px; padding:8px 10px; } .cp-cell b { font-size:22px; }
.cp-match-name { font-size:20px; }
.cp-ring { width:96px; height:96px; } .cp-ring > div { width:78px; height:78px; } .cp-ring b { font-size:30px; }
.fr-tab { font-size:15px; } .fr-tab svg { width:16px; height:16px; }

/* Compare */
.cp-pick { background:var(--card); border:0.5px solid var(--border); border-radius:var(--radius-lg); padding:14px 16px 12px; margin-bottom:14px; }
.cp-pick-head { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:10px; }
.cp-pick-hint { font-size:12px; color:var(--text-3); }
.cp-pick-row { display:flex; gap:14px; overflow-x:auto; scrollbar-width:none; padding:4px 2px 2px; }
.cp-pick-row::-webkit-scrollbar { display:none; }
.cp-person { position:relative; flex-shrink:0; width:72px; display:flex; flex-direction:column; align-items:center; gap:6px; background:none; border:none; padding:0; cursor:pointer; color:var(--text-2); font-size:12px; font-weight:600; }
.cp-person .fr-av { outline:2.5px solid transparent; outline-offset:2px; transition:outline-color .15s, transform .15s; }
.cp-person:hover .fr-av { transform:scale(1.04); }

<div class="page-wrap fr-page">

               oninput="this.value=this.value.replace(/[^a-zA-Z0-9_]/g,'').toLowerCase();_udSearch(this.value);_udSelectedId=null;_udSelectedUsername=null;"

<script>
let _fUser = null;
let _fProfile = null;
let _friendships = [];

/* ── Avatar HTML helper — handles both photo and initial fallback ── */

/* ══════════════════════════════════════════════════════════════
   Friends — v620 redesign
   Sections: Friends · Activity · Lists · Notes · Compare
   Each section has the site's Sort / Filter buttons (sort-filter.js).
   Everything comes from 2 queries (all friends' entries + lists), made
   once when the page opens; Compare adds your own library on first use.
══════════════════════════════════════════════════════════════ */
const _PIN_SVG = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"/><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"/></svg>`;
const _PIN_SVG_FILLED = `<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"/><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"/></svg>`;
let _frTab = 'friends';
let _frAccepted = [], _frIncoming = [], _frOutgoing = [];
let _frEntries = [], _frLists = [], _frProfiles = {}, _frStats = {}, _frLoaded = false;
let _frSentOpen = false;
let _frAuthKnown = false;          // until sign-in is checked, show a spinner (never the signed-out view)
window._frEntryMap = {};

const _FR_TABS = [
  { key: 'friends',  label: 'Friends',  icon: 'users' },
  { key: 'activity', label: 'Activity', icon: 'activity' },
  { key: 'lists',    label: 'Lists',    icon: 'layers' },
  { key: 'notes',    label: 'Notes',    icon: 'notebook' },
  { key: 'compare',  label: 'Compare',  icon: 'compare' },
];

/* ── Small helpers ── */
const _frName = uid => { const p = _frProfiles[uid] || {}; return p.display_name || p.username || 'Friend'; };
function _frAvHTML(p, size = 36) {
  const u = safeURL(p?.avatar_url);
  return `<span class="fr-av" style="width:${size}px;height:${size}px;font-size:${Math.round(size * .42)}px">${u ? `<img src="${u}" alt="" loading="lazy">` : escHTML((p?.username || '?')[0].toUpperCase())}</span>`;
}
function _frPosterHTML(e, cls = 'fr-poster') {
  const u = safeURL(e?.poster_url);
  return `<div class="${cls}">${u ? `<img src="${u}" alt="" loading="lazy" onerror="mssImgError(this)" data-letter="${escHTML((e.title || '?')[0])}">` : `<span class="fr-poster-letter">${escHTML((e?.title || '?')[0].toUpperCase())}</span>`}</div>`;
}
function _frTypeBadge(e) {
  const movie = e.cat === 'movies' || e.ratings?._media_type === 'movie' || e.tmdb_type === 'movie';
  const label = CAT_META[e.cat]?.singular || (movie ? 'Movie' : 'TV Show');
  return `<span class="${movie ? 'type-label' : 'type-label type-label-tv'}">${escHTML(label)}</span>`;
}
const _frScore = e => liveScore(e) != null ? Number(liveScore(e)) : null;
const _frDate = x => x ? new Date(String(x).length <= 10 ? x + 'T12:00:00' : x) : null;
// A friend's title: Info, Ratings and Note in one popup (MSSViews, info-popup.js).
// Activity opens on Info (a "wrote a note" item opens on their note);
// the Notes tab opens on the note.
function _frViews(e, start) {
  const p = _frProfiles[e.user_id] || {};
  MSSViews.open(e, { start, profile: p, note: { open: x => MSSFriendPop.note(x, p), close: MSSFriendPop.closeNote } });
}
function _frOpenEvent(id, type) {
  const e = window._frEntryMap[id]; if (!e) return;
  _frViews(e, type === 'note' ? 'note' : 'info');
}
function _frOpenNote(id) {
  const e = window._frEntryMap[id]; if (e) _frViews(e, 'note');
}
function _frFriendOptions() { return [['', 'Everyone'], ..._frAccepted.map(f => [f.friendId, _frName(f.friendId)])]; }
const _FR_CAT_OPTS = [['', 'All Types'], ['tv', 'TV Shows'], ['movies', 'Movies'], ['anime', 'Anime'], ['cartoons', 'Cartoons']];

/* ── Loading ── */
async function loadFriends() {
  [_friendships, _fProfile] = await Promise.all([getFriendships(_fUser.id), getProfile(_fUser.id)]);
  _frAccepted = _friendships.filter(f => f.status === 'accepted');
  _frIncoming = _friendships.filter(f => f.status === 'pending' && !f.iRequested);
  _frOutgoing = _friendships.filter(f => f.status === 'pending' && f.iRequested);
  _frProfiles = Object.fromEntries(_frAccepted.map(f => [f.friendId, f.friendProfile || {}]));
  const ids = _frAccepted.map(f => f.friendId);
  if (ids.length) {
    const [ents, lists] = await Promise.all([
      sb.from('entries').select('*').in('user_id', ids).order('updated_at', { ascending: false }).limit(3000).then(r => r.data || [], () => []),
      sb.from('favorite_lists').select('*').in('user_id', ids).eq('cat', 'custom').order('created_at', { ascending: false }).then(r => r.data || [], () => []),
    ]);
    _frEntries = ents; _frLists = lists;
  } else { _frEntries = []; _frLists = []; }
  _frEntries.forEach(e => { window._frEntryMap[e.id] = e; });
  // Top Favorites older than the recent entries loaded above — fetch those too
  const favIds = _frAccepted.flatMap(f => Array.isArray(f.friendProfile?.top_picks) ? f.friendProfile.top_picks.slice(0, 4) : []);
  const missing = [...new Set(favIds)].filter(id => !window._frEntryMap[id]);
  const extraFavs = missing.length ? await sb.from('entries').select('*').in('id', missing).then(r => r.data || [], () => []) : [];
  const favMap = Object.fromEntries(extraFavs.map(e => [e.id, e]));
  _frStats = {};
  _frAccepted.forEach(f => {
    const mine = _frEntries.filter(e => e.user_id === f.friendId);
    _frStats[f.friendId] = { ...computeStats(mine), recent: mine[0]?.updated_at || null,
      watchingNow: mine.find(e => e.status === 'watching') || null,
      posters: _frCoverPosters(f.friendProfile || {}, mine, favMap),
      latest: null };
  });
  // Each friend's most recent activity (shown when they aren't watching anything)
  // (what they watched counts first; a note only if that's all they've done)
  const events = _frEvents().sort((a, b) => (a._ev === 'note') - (b._ev === 'note') || b._at - a._at);
  events.forEach(x => { const st = _frStats[x.user_id]; if (st && !st.latest) st.latest = { e: window._frEntryMap[x.id.split(':')[0]], type: x._ev }; });
  _frLoaded = true;
  const sub = document.getElementById('friendsPageSub');
  if (sub) sub.textContent = `${_frAccepted.length} friend${_frAccepted.length === 1 ? '' : 's'}${_frIncoming.length ? ` · ${_frIncoming.length} request${_frIncoming.length === 1 ? '' : 's'}` : ''}`;
  ['frFriends', 'frActivity', 'frLists', 'frNotes', 'frShared'].forEach(k => SF.invalidate && SF.invalidate(k));
  _frRender();
}

/* ── Tabs ── */
function _frTabsHTML() {
  const count = { friends: _frAccepted.length, activity: null, lists: _frLists.length, notes: _frEntries.filter(e => e.notes && e.notes.trim()).length, compare: null };
  return _FR_TABS.map(t => `<button class="fr-tab${_frTab === t.key ? ' active' : ''}" role="tab" aria-selected="${_frTab === t.key}" onclick="setFriendsTab('${t.key}')">
      ${icon(t.icon, 15)}<span>${t.label}</span>${t.key === 'friends' && _frIncoming.length ? `<span class="fr-tab-dot">${_frIncoming.length}</span>` : (count[t.key] ? `<span class="fr-tab-count">${count[t.key]}</span>` : '')}
    </button>`).join('');

// Friend card cover: their Top Favorites (profile dashboard), then — if they
// haven't picked 4 — their most recent titles to fill the rest
function _frCoverPosters(p, mine, extra = {}) {
  const withPoster = e => e && safeURL(e.poster_url);
  const favs = (Array.isArray(p.top_picks) ? p.top_picks : []).map(id => mine.find(e => e.id === id) || extra[id]).filter(withPoster);
  const recent = mine.filter(e => withPoster(e) && !favs.includes(e));   // mine is newest-first
  return favs.concat(recent).slice(0, 4);
}

function _frEvents() {
  const ev = [];
  _frEntries.forEach(e => {
    const push = (type, at) => { const d = _frDate(at); if (d && !isNaN(d)) ev.push({ ...e, _ev: type, _at: d, id: e.id + ':' + type }); };
    // Watched recently → "watched"; added with a finish date a month+ before
    // they logged it → "logged" (catching up their history)
    if (e.status === 'completed' && e.completed_date) {
      const done = _frDate(e.completed_date), added = _frDate(e.created_at);
      const old = done && added && (added - done) >= 30 * 86400000;
      push(old ? 'logged' : 'finished', old ? e.created_at : e.completed_date);
    }
    else if (e.status === 'ongoing') push('caught_up', e.updated_at);
    else if (e.status === 'watching') push('started', e.updated_at);
    else if (e.status === 'up_next') push('up_next', e.updated_at);
    else if (e.status === 'queue') push('watchlist', e.created_at);
    if (e.notes && e.notes.trim()) push('note', e.updated_at);
  });
  // "made a list"
  _frLists.forEach(l => { const d = _frDate(l.created_at); if (d && !isNaN(d)) ev.push({ id: 'list:' + l.id, user_id: l.user_id, title: l.title, _list: l, _ev: 'list', _at: d }); });
  return ev;
}

});
function _frDayLabel(dt) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const d0 = new Date(dt); d0.setHours(0, 0, 0, 0);
  const diff = Math.round((today - d0) / 86400000);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  if (diff > 0 && diff < 7) return d0.toLocaleDateString('en-US', { weekday: 'long' });
  return d0.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: d0.getFullYear() === today.getFullYear() ? undefined : 'numeric' });
}
let _frActShown = 40;
function _frRenderActivity() {
  const list = SF.list('frActivity', 'all');
  _frToolbar('Activity', list.length, 'frActivity', list.length === 1 ? 'update' : 'updates');

    if (byDate && day !== lastDay) { html += `<div class="fa-day">${day}</div>`; lastDay = day; }
    if (x._ev === 'list') {
      const n = (x._list.items || []).length;
      html += `<article class="fa-item" onclick="_frOpenList(${attrJSON(x._list.id)})">
        <div class="fa-who">${_frAvHTML(_frProfiles[x.user_id], 40)}<span class="fa-ic" style="background:${a.color}">${icon(a.ic, 9)}</span></div>
        <div class="fa-body">

          <div class="fa-title">${escHTML(x.title)}</div>
          <div class="fa-meta"><span class="w-ep-badge">${n} ${n === 1 ? 'title' : 'titles'}</span><span>${x._at.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })}</span></div>
        </div>
        ${(() => { const first = (x._list.items || []).map(_frListItem).find(Boolean); return first ? _frPosterHTML(first, 'fa-poster') : ''; })()}
      </article>`;
      return;
    }
    html += `<article class="fa-item" onclick="_frOpenEvent(${attrJSON(x.id.split(':')[0])}, '${x._ev}')">
      <div class="fa-who">${_frAvHTML(_frProfiles[x.user_id], 40)}<span class="fa-ic" style="background:${a.color}">${icon(a.ic, 9)}</span></div>
      <div class="fa-body">

        <div class="fa-title">${escHTML(x.title)}${x.year ? ` <span>${escHTML(String(x.year).slice(0, 4))}</span>` : ''}</div>
        <div class="fa-meta">${_frTypeBadge(x)}<span>${x._ev === 'finished' || x._ev === 'logged' ? x._at.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : x._at.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })}</span></div>
        ${x._ev === 'note' ? `<div class="fa-note">${mssIsSpoiler(x) ? mssSpoilerTag() : `&ldquo;${escHTML(x.notes.trim().split(/\s+/).slice(0, 30).join(' '))}${x.notes.trim().split(/\s+/).length > 30 ? '…' : ''}&rdquo;`}</div>` : ''}
      </div>
      ${(x._ev === 'finished' || x._ev === 'logged' || x._ev === 'caught_up') && sc != null ? `<div class="fa-score">★ ${sc.toFixed(2)}</div>` : ''}
      ${_frPosterHTML(x, 'fa-poster')}
    </article>`;
  });
  html += '</div>';
  if (list.length > _frActShown) html += `<button class="fr-more" onclick="_frActShown+=40;_frRender()">Show more</button>`;
  document.getElementById('frContent').innerHTML = html;
}

/* ══ COMPARE ══
   1) choose who to compare with   2) see your taste match + shared titles
   (sortable / filterable)   3) open a title for the full side-by-side. */
let _cmpMine = null, _cmpMyLists = [], _cmpProfiles = {}, _cmpWith = [], _cmpKey = null, _cmpQuery = '';
const _cmpKeyOf = e => e.tmdb_id && e.tmdb_type ? `t:${e.tmdb_type}:${e.tmdb_id}` : `n:${e.cat}:${(e.title || '').trim().toLowerCase()}`;

function _frCompareWith(uid) { _cmpWith = [uid]; _cmpKey = null; setFriendsTab('compare'); }

async function _cmpLoad() {
  if (_cmpMine) return;
  const [mine, myLists, profs] = await Promise.all([
    getEntries(_fUser.id).catch(() => []),
    sb.from('favorite_lists').select('id, title, items').eq('user_id', _fUser.id).eq('cat', 'custom').then(r => r.data || [], () => []),
    sb.from('profiles').select('id, username, display_name, avatar_url, top_picks, recommended, fav_tv, fav_movies, fav_anime, fav_cartoons')
      .in('id', [_fUser.id, ..._frAccepted.map(f => f.friendId)]).then(r => r.data || [], () => []),
  ]);
  _cmpMine = mine || []; _cmpMyLists = myLists;
  _cmpProfiles = Object.fromEntries(profs.map(p => [p.id, p]));
}
// Titles you share with the selected friend(s) — one group per title
function _cmpGroups() {
  const me = _fUser.id, pick = new Set(_cmpWith);
  const idx = {};
  const add = e => { const k = _cmpKeyOf(e); (idx[k] ||= { id: k, key: k, title: e.title, year: e.year, cat: e.cat, poster_url: e.poster_url, ratings: e.ratings, byUser: {} }); if (!idx[k].byUser[e.user_id]) idx[k].byUser[e.user_id] = e; if (!idx[k].poster_url) idx[k].poster_url = e.poster_url; };
  _cmpMine.forEach(add);
  _frEntries.filter(e => pick.has(e.user_id)).forEach(add);
  return Object.values(idx).filter(g => g.byUser[me] && _cmpWith.some(u => g.byUser[u])).map(g => {
    const mine = _frScore(g.byUser[me]);
    const theirs = _cmpWith.map(u => g.byUser[u]).filter(Boolean).map(_frScore).filter(v => v != null);
    const avgTheirs = theirs.length ? theirs.reduce((a, b) => a + b, 0) / theirs.length : null;
    return { ...g, _mine: mine, _theirs: avgTheirs, _diff: mine != null && avgTheirs != null ? avgTheirs - mine : null };
  });
}
SF.register('frShared', {
  base: () => _cmpMine ? _cmpGroups().filter(g => !_cmpQuery || (g.title || '').toLowerCase().includes(_cmpQuery.toLowerCase())) : [],
  render: () => _frRender(),
  defaultSort: 'agree',
  presets: {
    agreement: { header: 'Agreement', opts: [['agree', 'Most In Sync'], ['disagree', 'Biggest Difference']] },
    scores:    { header: 'Scores', opts: [['yours', 'Your Top Rated'], ['theirs', 'Their Top Rated']] },
  },
  sorts: () => ['agreement', 'scores', 'alpha'],
  filters: () => [],
  compare: {
    agree: (a, b) => (a._diff == null) - (b._diff == null) || Math.abs(a._diff ?? 99) - Math.abs(b._diff ?? 99),
    disagree: (a, b) => (a._diff == null) - (b._diff == null) || Math.abs(b._diff ?? -1) - Math.abs(a._diff ?? -1),
    yours: (a, b) => (b._mine ?? -1) - (a._mine ?? -1),
    theirs: (a, b) => (b._theirs ?? -1) - (a._theirs ?? -1),
  },
  choiceFilters: () => [
    { key: 'cat', label: 'Type', options: _FR_CAT_OPTS },
    { key: 'rated', label: 'Scores', options: [['', 'All Shared'], ['both', 'Rated by both']], test: (g, v) => g._diff != null },
  ],
});

// Taste match with one friend: how closely your scores line up
function _cmpMatch(uid) {
  const me = _fUser.id, mineIdx = {};
  _cmpMine.forEach(e => { mineIdx[_cmpKeyOf(e)] = e; });
  const pairs = [];
  _frEntries.filter(e => e.user_id === uid).forEach(e => {
    const m = mineIdx[_cmpKeyOf(e)]; if (!m) return;
    pairs.push({ m, t: e, a: _frScore(m), b: _frScore(e) });
  });
  const rated = pairs.filter(p => p.a != null && p.b != null);
  const avgDiff = rated.length ? rated.reduce((s, p) => s + Math.abs(p.a - p.b), 0) / rated.length : null;
  const pct = avgDiff != null ? Math.max(0, Math.round(100 - avgDiff * 12)) : null;
  const loved = rated.slice().sort((x, y) => (y.a + y.b) - (x.a + x.b))[0];
  const split = rated.slice().sort((x, y) => Math.abs(y.a - y.b) - Math.abs(x.a - x.b))[0];
  return { shared: pairs.length, rated: rated.length, pct, avgDiff, loved, split: split && Math.abs(split.a - split.b) >= 1 ? split : null };
}

  // best-rated category among ones at least two of you rated

async function togglePinFriend(friendId) {
  const wasPinned = _fProfile && _fProfile.pinned_friend_id === friendId;
  const newPinnedId = wasPinned ? null : friendId;

  const prevPinnedId = _fProfile ? _fProfile.pinned_friend_id : null;
  if (_fProfile) _fProfile.pinned_friend_id = newPinnedId;
  _frRender();

  try {
    await setPinnedFriend(_fUser.id, newPinnedId);
    showToast(wasPinned ? 'Unpinned.' : 'Friend pinned!');
  } catch (e) {
    if (_fProfile) _fProfile.pinned_friend_id = prevPinnedId;
    _frRender();
    showToast('Error updating pin.', 'err');
  }
}

async function doAccept(friendshipId) {
  const el = document.getElementById('pc-' + friendshipId);
  if (el) el.style.opacity = '0.4';
  try {
    await respondFriendRequest(friendshipId, true);
    showToast('Friend added!');
    await loadFriends();

    showToast('Error.', 'err');

async function doDecline(friendshipId) {
  const el = document.getElementById('pc-' + friendshipId);

  if (el) el.remove();
  try {
    await respondFriendRequest(friendshipId, false);

    showToast('Error.', 'err');
    await loadFriends(); // reconcile back to truth since we already removed the card

/* ── Live username search dropdown ── */
let _udTimer = null;
let _udActive = -1;
let _udResults = [];

// Create dropdown on body - after DOM ready
/* dropdown created in HTML */

function _udPosition() {
  const wrap = document.getElementById('addFriendWrap');
  const drop  = document.getElementById('udDropdown');
  if (!wrap || !drop) return;
  const r = wrap.getBoundingClientRect();
  drop.style.top    = r.bottom + 'px';
  drop.style.left   = r.left + 'px';
  drop.style.width  = r.width + 'px';
  drop.style.position = 'fixed';
}

let _udScrollY = 0;
// Undo the dropdown's scroll lock — and only jump back if it was locked
function _udUnlock() {
  const wasLocked = document.body.style.position === 'fixed';
  document.body.style.overflow = '';
  document.body.style.position = '';
  document.body.style.width = '';
  document.body.style.top = '';
  if (wasLocked) window.scrollTo(0, _udScrollY || 0);
}
async function _udSearch(val) {
  const q = val.trim().toLowerCase();
  const drop = document.getElementById('udDropdown');
  clearTimeout(_udTimer);
  _udActive = -1;
  if (q.length < 2) { drop.classList.remove('open');
  document.getElementById('addFriendWrap')?.classList.remove('dd-connected-active');
  _udUnlock();
  return; }
  _udPosition();
  drop.innerHTML = '<div class="ud-loading">Searching…</div>';
  drop.classList.add('open');
  document.getElementById('addFriendWrap')?.classList.add('dd-connected-active');
  _udScrollY = window.scrollY;
  document.body.style.overflow = 'hidden';
  document.body.style.position = 'fixed';
  document.body.style.width = '100%';
  document.body.style.top = '-' + _udScrollY + 'px';
  _udTimer = setTimeout(async () => {
    try {
      const { data } = await sb.from('profiles')
        .select('id, username, display_name, avatar_url')
        .ilike('username', q + '%')
        .neq('id', _fUser?.id || '')
        .limit(10);
      _udResults = data || [];
      if (!_udResults.length) {
        drop.innerHTML = '<div class="ud-empty">No users found</div>';
        return;
      }
      drop.innerHTML = _udResults.map((p, i) => {
        const initial = (p.username[0] || '?').toUpperCase();
        const avatarHTML = safeURL(p.avatar_url)
          ? '<div class="ud-avatar"><img src="'+safeURL(p.avatar_url)+'" loading="lazy"></div>'
          : '<div class="ud-avatar">' + initial + '</div>';
        const reg = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
        const highlighted = p.username.replace(reg, '<em>$1</em>');
        const display = p.display_name && p.display_name !== p.username ? p.display_name : '';
        return '<div class="ud-item" data-i="' + i + '" onmousedown="_udSelect(\'' + escHTML(p.username) + '\',\'' + p.id + '\')'  + '">'
          + avatarHTML
          + '<div class="ud-info"><div class="ud-username">@' + highlighted + '</div>'
          + (display ? '<div class="ud-display">' + display + '</div>' : '')
          + '</div></div>';
      }).join('');
    } catch(e) {
      drop.innerHTML = '<div class="ud-empty">Error searching</div>';
    }
  }, 250);
}

let _udSelectedId = null, _udSelectedUsername = null;

function _udSelect(username, userId) {
  // Store selection first
  _udSelectedId = userId;
  _udSelectedUsername = username;
  // Fill input (won't trigger oninput since we set vars above)
  document.getElementById('addFriendInput').value = username;
  // Close dropdown
  document.getElementById('udDropdown').classList.remove('open');
  document.getElementById('addFriendWrap')?.classList.remove('dd-connected-active');
  _udUnlock();

  _udResults = []; _udActive = -1;
}

async function _udViewProfile() {
  const input = document.getElementById('addFriendInput').value.trim();
  if (!input) { showToast('Enter or select a username first.', 'err'); return; }

  if (_udSelectedId) {
    // Selected from dropdown - go directly
    sessionStorage.setItem('viewProfileId', _udSelectedId);
    sessionStorage.setItem('viewProfileUsername', _udSelectedUsername);
    window.location.href = 'profile-view.html';
  } else {
    // Typed manually - look up by username
    try {
      const { data } = await sb.from('profiles').select('id,username').ilike('username', input).limit(1);
      if (!data || !data.length) { showToast('User not found.', 'err'); return; }
      sessionStorage.setItem('viewProfileId', data[0].id);
      sessionStorage.setItem('viewProfileUsername', data[0].username);
      window.location.href = 'profile-view.html';
    } catch(e) { showToast('Error finding user.', 'err'); }
  }
}

function _udKeydown(e) {
  const drop = document.getElementById('udDropdown');
  const items = drop.querySelectorAll('.ud-item');
  if (!drop.classList.contains('open') || !items.length) return;
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    _udActive = Math.min(_udActive + 1, items.length - 1);
    items.forEach((el, i) => el.classList.toggle('ud-active', i === _udActive));
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    _udActive = Math.max(_udActive - 1, -1);
    items.forEach((el, i) => el.classList.toggle('ud-active', i === _udActive));
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (_udActive >= 0 && _udResults[_udActive]) {
      _udSelect(_udResults[_udActive].username, _udResults[_udActive].id);
    }
  } else if (e.key === 'Escape') {
    drop.classList.remove('open'); _udActive = -1;
    document.getElementById('addFriendWrap')?.classList.remove('dd-connected-active');
  _udUnlock();
  }
}

// Close the Find-people dropdown when clicking elsewhere. Only acts while
// the dropdown is open — it used to run on EVERY click on the page and
// scroll you back to the top (its old container class no longer exists).
document.addEventListener('click', e => {
  const drop = document.getElementById('udDropdown');
  if (!drop || !drop.classList.contains('open')) return;
  if (e.target.closest('.fr-find') || e.target.closest('#udDropdown')) return;
  drop.classList.remove('open');
  document.getElementById('addFriendWrap')?.classList.remove('dd-connected-active');
  _udUnlock();
  _udActive = -1;
});

window.addEventListener('scroll', _udPosition, { passive: true });
window.addEventListener('resize', _udPosition, { passive: true });

function viewFriend(userId, username) {
  sessionStorage.setItem('viewProfileId', userId);
  sessionStorage.setItem('viewProfileUsername', username);
  window.location.href = 'profile-view.html';
}

/* ── Mini Profile ── */
