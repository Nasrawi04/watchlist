<style>
/* ── Admin (site owners only — app_admins, migrations 036 / 037).
   Dashboard shell: a sidebar of sections on the left (a side panel under 1024px), the section on the right. ── */
.adm-shell { display:grid; grid-template-columns:236px minmax(0, 1fr); gap:28px; align-items:start; }
.adm-side { position:sticky; top:calc(var(--nav-h) + 16px); display:flex; flex-direction:column; gap:14px; padding:16px 12px; border-radius:var(--radius); background:var(--surface-card); border:1px solid var(--border); max-height:calc(100vh - var(--nav-h) - 32px); overflow-y:auto; }
.adm-side-h { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:0 6px; }
.adm-side-t { font-family:var(--serif); font-size:22px; font-weight:600; line-height:1.1; }
.adm-side-x { display:none; }
.adm-eyebrow { font-size:10.5px; font-weight:800; letter-spacing:1.6px; text-transform:uppercase; color:var(--text-3); }
.adm-nav { display:flex; flex-direction:column; gap:12px; }
.adm-nav-g { display:flex; flex-direction:column; gap:2px; }
.adm-nav-g > .adm-eyebrow { padding:0 10px 4px; }
.adm-nav-i { display:flex; align-items:center; gap:10px; width:100%; min-height:40px; padding:8px 10px; border-radius:var(--radius-sm); border:1px solid transparent; background:none; color:var(--text-2); font:600 13.5px 'Manrope',var(--sans); text-align:start; cursor:pointer; }
.adm-nav-i svg { flex-shrink:0; opacity:.85; }
.adm-nav-i:hover { background:var(--bg-3); color:var(--text); }
.adm-nav-i[aria-current="page"] { background:var(--selected-bg); color:var(--selected-fg); border-color:var(--border-olive); }
.adm-nav-i[aria-current="page"] svg { opacity:1; }
.adm-nav-i:focus-visible, .adm-side-x:focus-visible, .adm-menu:focus-visible { outline:2px solid var(--olive-light); outline-offset:2px; }
.adm-nav-l { flex:1; min-width:0; }
.adm-side-f { margin-top:auto; padding:10px 6px 0; border-top:1px solid var(--border); font-size:12px; color:var(--text-3); display:flex; align-items:center; gap:7px; }
.adm-scrim { position:fixed; inset:0; z-index:1100; background:var(--scrim); }
.adm-scrim[hidden] { display:none; }
.adm-head { margin-bottom:1.25rem; display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.adm-head-l { display:flex; align-items:center; gap:12px; min-width:0; }
.adm-title { font-family:var(--serif); font-size:clamp(28px, 5vw, 40px); font-weight:600; line-height:1.15; margin:2px 0 0; }
.adm-sub { font-size:13px; color:var(--text-3); margin-top:4px; display:flex; align-items:center; gap:6px; }
.adm-menu { display:none; align-items:center; justify-content:center; width:44px; height:44px; flex-shrink:0; border-radius:var(--radius-sm); border:1px solid var(--border-2); background:var(--surface-card); color:var(--text); cursor:pointer; }
.adm-refresh { display:inline-flex; align-items:center; gap:7px; padding:8px 14px; min-height:40px; border-radius:var(--radius-sm); cursor:pointer; font:600 13px 'Manrope',var(--sans); background:var(--card); border:1px solid var(--border-2); color:var(--text-2); }
.adm-refresh:hover { border-color:var(--border-olive); color:var(--text); }
.adm-tab-count { font-size:11px; font-weight:700; min-width:20px; padding:1px 6px; border-radius:20px; text-align:center; background:var(--olive); color:var(--text-on-brand); }
:focus-visible.adm-row, .adm-btn:focus-visible, .adm-refresh:focus-visible, .adm-link:focus-visible { outline:2px solid var(--olive-light); outline-offset:2px; }
@media(max-width:1023px) {
  .adm-shell { grid-template-columns:minmax(0, 1fr); }
  .adm-side { position:fixed; z-index:1101; top:0; bottom:0; left:0; width:min(300px, 86vw); max-height:none; border-radius:0 var(--radius) var(--radius) 0; padding:calc(16px + env(safe-area-inset-top)) 12px calc(16px + env(safe-area-inset-bottom));
    background:var(--surface-panel); transform:translateX(-102%); visibility:hidden; transition:transform .22s var(--ease), visibility 0s .22s; }
  .adm-side.open { transform:none; visibility:visible; transition:transform .22s var(--ease); }
  .adm-side-x { display:inline-flex; align-items:center; justify-content:center; width:40px; height:40px; border-radius:var(--radius-sm); border:1px solid var(--border-2); background:none; color:var(--text); cursor:pointer; }
  .adm-menu { display:inline-flex; }
  .adm-nav-i { min-height:44px; }
  .adm-chart-sw button { min-height:40px; }
}
@media(max-width:560px) { .adm-head { flex-wrap:nowrap; align-items:flex-start; } .adm-refresh { width:44px; height:44px; padding:0; justify-content:center; } .adm-refresh-l { display:none; } }
@media(prefers-reduced-motion:reduce) { .adm-side, .adm-side.open { transition:none; } }

/* Dashboard: needs-you strip, KPI cards with sparklines, growth chart, live feed */
.adm-needs { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:10px; margin-bottom:14px; }
.adm-need { display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:var(--radius); border:1px solid var(--border); background:var(--surface-card); color:var(--text); font:inherit; text-align:start; cursor:pointer; min-width:0; }
.adm-need:hover { border-color:var(--border-olive); }
.adm-need:focus-visible { outline:2px solid var(--olive-light); outline-offset:2px; }
.adm-need-i { display:inline-flex; align-items:center; justify-content:center; width:36px; height:36px; flex-shrink:0; border-radius:var(--radius-sm); background:var(--bg-3); color:var(--text-2); }
.adm-need.todo { border-color:var(--warning-border); }
.adm-need.todo .adm-need-i { background:var(--warning-bg); color:var(--warning-fg); }
.adm-need-n { font-family:var(--bebas); font-size:28px; line-height:1; }
.adm-need-l { font-size:12.5px; color:var(--text-2); display:block; }
.adm-need-s { font-size:11.5px; font-weight:700; display:flex; align-items:center; gap:4px; color:var(--text-3); margin-top:2px; }
.adm-need.todo .adm-need-s { color:var(--warning-fg); }
.adm-kpis { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:10px; margin-bottom:10px; }
.adm-kpi { position:relative; display:flex; flex-direction:column; gap:2px; padding:16px 16px 14px; border-radius:var(--radius); border:1px solid var(--border); background:var(--surface-card); min-width:0; overflow:hidden; }
.adm-kpi-l { font-size:12.5px; font-weight:600; color:var(--text-2); display:flex; align-items:center; gap:6px; }
.adm-kpi-n { font-family:var(--bebas); font-size:clamp(34px, 4vw, 46px); line-height:1; letter-spacing:.5px; margin-top:6px; }
.adm-kpi-d { font-size:11.5px; font-weight:700; color:var(--olive-light); display:flex; align-items:center; gap:4px; }
.adm-kpi-d.zero { color:var(--text-3); font-weight:500; }
.adm-spark { display:block; width:100%; height:34px; margin-top:8px; }
.adm-spark path.l { fill:none; stroke:var(--olive-light); stroke-width:1.75; vector-effect:non-scaling-stroke; }
.adm-spark path.a { fill:var(--olive-light); fill-opacity:.14; stroke:none; }
.adm-tiles.mini { grid-template-columns:repeat(6, minmax(0, 1fr)); }
.adm-tiles.mini .adm-tile { padding:12px 14px; }
.adm-tiles.mini .adm-tile-n { font-size:clamp(24px, 3vw, 30px); }
.adm-card-h-wrap { flex-wrap:wrap; align-items:center; }
.adm-chart-sw { display:inline-flex; flex-wrap:wrap; max-width:100%; gap:4px; padding:3px; border-radius:var(--radius-sm); border:1px solid var(--border-2); }
.adm-chart-sw button { min-height:32px; padding:4px 12px; border-radius:7px; border:1px solid transparent; background:none; color:var(--text-2); font:600 12.5px 'Manrope',var(--sans); cursor:pointer; }
.adm-chart-sw button[aria-pressed="true"] { background:var(--selected-bg); color:var(--selected-fg); border-color:var(--border-olive); }
.adm-chart-sw button:focus-visible { outline:2px solid var(--olive-light); outline-offset:1px; }
.adm-big { display:flex; align-items:baseline; gap:10px; margin:-4px 0 10px; }
.adm-big b { font-family:var(--bebas); font-size:40px; line-height:1; font-weight:400; }
.adm-big span { font-size:12.5px; color:var(--text-3); }
.adm-area { position:relative; height:180px; border-bottom:1px solid var(--border-2); }
.adm-area svg { position:absolute; inset:0; width:100%; height:100%; }
.adm-area path.l { fill:none; stroke:var(--olive-light); stroke-width:2; vector-effect:non-scaling-stroke; stroke-linejoin:round; }
.adm-area path.a { fill:var(--olive-light); fill-opacity:.16; }
.adm-area line { stroke:var(--border); stroke-width:1; vector-effect:non-scaling-stroke; stroke-dasharray:3 4; }
.adm-area .adm-bars { position:absolute; inset:0; height:auto; padding:0; border:0; gap:0; }
.adm-area .adm-bar i { opacity:0; width:2px; margin:0 auto; border-radius:0; background:var(--olive); min-height:0; }
.adm-area .adm-bar:hover i, .adm-area .adm-bar:focus-visible i { opacity:.5; background:var(--olive); }
.adm-grid3 { display:grid; grid-template-columns:minmax(0, 1.4fr) minmax(0, 1fr); gap:12px; margin-bottom:12px; }
.adm-feed { display:flex; flex-direction:column; }
.adm-feed-r { display:flex; gap:10px; padding:10px 0; border-top:1px solid var(--border); font-size:13px; min-width:0; }
.adm-feed-r:first-child { border-top:0; padding-top:0; }
.adm-feed-r .adm-quote { -webkit-line-clamp:2; line-clamp:2; display:-webkit-box; -webkit-box-orient:vertical; overflow:hidden; margin-top:2px; }
.adm-live { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:var(--text-2); }
.adm-live i { width:8px; height:8px; border-radius:50%; background:var(--olive-light); }
.adm-bar-row { display:flex; align-items:center; justify-content:flex-end; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
.adm-bar-row:empty { display:none; }
.adm-bar-row > .adm-card-s:first-child { margin-inline-end:auto; }
.adm-note { display:flex; align-items:flex-start; gap:10px; margin-bottom:12px; font-size:13px; color:var(--text-2); border-color:var(--warning-border); }
.adm-note svg { flex-shrink:0; color:var(--warning-fg); margin-top:1px; }
.adm-kpi-d.down { color:var(--text-2); }
.adm-feats { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:12px; align-items:start; }
.adm-feat { display:grid; grid-template-columns:minmax(120px, 1.2fr) minmax(40px, 1fr) auto auto; gap:10px 12px; align-items:center; font-size:13px; }
.adm-feat-l { color:var(--text); display:flex; flex-direction:column; gap:1px; min-width:0; }
.adm-feat-l .adm-kpi-d { font-size:11px; }
.adm-feat-t { font-size:12px; color:var(--text-3); font-variant-numeric:tabular-nums; text-align:end; min-width:44px; }
.adm-feat-na { grid-column:2 / -1; }
.adm-migs { display:flex; flex-wrap:wrap; gap:6px; }
.adm-mig { display:inline-flex; align-items:center; gap:4px; padding:4px 9px; border-radius:var(--radius-sm); border:1px solid var(--success-border); background:var(--success-bg); color:var(--success-fg); font-size:12px; font-weight:700; font-variant-numeric:tabular-nums; }
.adm-mig.no { border-color:var(--warning-border); background:var(--warning-bg); color:var(--warning-fg); }
.adm-need-s.warn { color:var(--warning-fg); }
.adm-split.adm-split-2 { grid-template-columns:auto 1fr; }
.adm-split.adm-split-2 .adm-split-n { font-weight:500; color:var(--text-2); }
@media(max-width:900px) { .adm-feats { grid-template-columns:1fr; } }
@media(max-width:1199px) { .adm-tiles.mini { grid-template-columns:repeat(3, minmax(0, 1fr)); } }
@media(max-width:900px) { .adm-needs, .adm-kpis { grid-template-columns:repeat(2, minmax(0, 1fr)); } .adm-grid3 { grid-template-columns:1fr; } }
@media(max-width:480px) { .adm-tiles.mini { grid-template-columns:repeat(2, minmax(0, 1fr)); } .adm-need { padding:10px 12px; gap:10px; } .adm-area { height:150px; } }

/* Overview */
.adm-tiles { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; margin-bottom:1.25rem; }
.adm-tile { background:var(--card); border:0.5px solid var(--border); border-radius:var(--radius); padding:14px 16px; }
.adm-tile-n { font-family:var(--bebas); font-size:clamp(30px, 4.6vw, 40px); line-height:1; color:var(--text); letter-spacing:.5px; }
.adm-tile-l { font-size:12.5px; color:var(--text-2); margin-top:4px; }
.adm-tile-d { font-size:11.5px; color:var(--olive-light); font-weight:600; margin-top:6px; }
.adm-tile-d.zero { color:var(--text-3); font-weight:500; }
.adm-grid2 { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:12px; margin-bottom:12px; }
.adm-card { background:var(--card); border:0.5px solid var(--border); border-radius:var(--radius); padding:16px 18px; min-width:0; }
.adm-card-h { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:12px; }
.adm-card-t { font-family:var(--serif); font-size:17px; font-weight:500; }
.adm-card-s { font-size:12px; color:var(--text-3); }
/* 30-day bars: one series, one hue, rounded tops on the baseline */
.adm-bars { position:relative; display:flex; align-items:flex-end; gap:2px; height:120px; padding-top:8px; border-bottom:0.5px solid var(--border-2); }
.adm-bar { flex:1; min-width:0; height:100%; display:flex; align-items:flex-end; cursor:default; position:relative; }
.adm-bar i { display:block; width:100%; min-height:2px; border-radius:4px 4px 0 0; background:var(--olive-light); opacity:.85; }
.adm-bar.zero i { background:var(--border-2); opacity:1; }
.adm-bar:hover i, .adm-bar:focus-visible i { opacity:1; background:var(--olive); }
.adm-bar:focus-visible { outline:none; }
.adm-tip { position:absolute; bottom:calc(100% + 6px); left:50%; transform:translateX(-50%); padding:5px 9px; border-radius:6px; background:var(--text); color:var(--bg); font-size:11.5px; font-weight:600; white-space:nowrap; pointer-events:none; opacity:0; z-index:5; }
.adm-bar:hover .adm-tip, .adm-bar:focus-visible .adm-tip { opacity:1; }
.adm-axis { display:flex; justify-content:space-between; font-size:11px; color:var(--text-3); margin-top:6px; }
/* Splits: label · bar · count */
.adm-split { display:grid; grid-template-columns:minmax(90px, auto) 1fr auto; gap:9px 12px; align-items:center; font-size:13px; }
.adm-split-l { color:var(--text-2); white-space:nowrap; }
.adm-split-b { height:8px; border-radius:4px; background:var(--bg-3); overflow:hidden; }
.adm-split-b i { display:block; height:100%; border-radius:4px; background:var(--olive-light); }
.adm-split-n { font-weight:600; font-variant-numeric:tabular-nums; text-align:end; }
/* Ranked titles */
.adm-rank { display:flex; flex-direction:column; gap:8px; }
.adm-rank-row { display:flex; align-items:center; gap:12px; text-decoration:none; color:inherit; padding:4px; margin:-4px; border-radius:var(--radius-sm); }
a.adm-rank-row:hover { background:var(--bg-3); }
.adm-rank-n { width:20px; text-align:center; font-family:var(--bebas); font-size:20px; color:var(--text-3); flex-shrink:0; }
.adm-poster { width:34px; height:51px; border-radius:5px; overflow:hidden; flex-shrink:0; background:var(--bg-3); }
.adm-poster img { width:100%; height:100%; object-fit:cover; display:block; }
.adm-rank-t { flex:1; min-width:0; font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.adm-rank-v { font-size:12.5px; color:var(--text-3); white-space:nowrap; }

/* Rows (members, titles, activity, languages) */
.adm-list { display:flex; flex-direction:column; gap:8px; }
.adm-row {
  display:flex; align-items:center; gap:12px; padding:12px 14px; width:100%; box-sizing:border-box;
  background:var(--card); border:0.5px solid var(--border); border-radius:var(--radius); font:inherit; color:inherit; text-align:start;
}
button.adm-row { cursor:pointer; transition:border-color .15s; }
button.adm-row:hover { border-color:var(--border-olive); }
.adm-main { flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
.adm-name { font-size:14.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.adm-meta { font-size:12.5px; color:var(--text-3); display:flex; flex-wrap:wrap; gap:4px 12px; align-items:center; }
.adm-count { font-family:var(--bebas); font-size:26px; letter-spacing:.5px; color:var(--olive-light); line-height:1; min-width:2ch; text-align:center; }
.adm-actions { display:flex; gap:6px; flex-shrink:0; }
.adm-btn { padding:7px 12px; border-radius:var(--radius-sm); cursor:pointer; font:600 12.5px 'Manrope',var(--sans); background:transparent; border:1px solid var(--border-2); color:var(--text-2); transition:all .15s; }
.adm-btn:hover { border-color:var(--border-olive); color:var(--text); }
.adm-btn.on { background:var(--olive); border-color:var(--olive); color:var(--text-on-brand); }
.adm-btn.danger:hover { border-color:var(--error-fg); color:var(--error-fg); }
.adm-status { padding:2px 8px; border-radius:20px; font-size:11.5px; font-weight:600; background:var(--bg-3); color:var(--text-2); }
.adm-status.added { background:var(--olive-faint); color:var(--olive-light); }
.adm-av { width:40px; height:40px; border-radius:50%; overflow:hidden; flex-shrink:0; background:var(--bg-3); display:flex; align-items:center; justify-content:center; font-weight:700; color:var(--olive-light); }
.adm-av img { width:100%; height:100%; object-fit:cover; }
.adm-search { margin-bottom:1rem; }
.adm-group { font-family:var(--serif); font-size:12px; font-weight:500; letter-spacing:2.5px; text-transform:uppercase; color:var(--olive-light); margin:1.25rem 0 .5rem; }
.adm-back { display:inline-flex; align-items:center; gap:6px; margin-bottom:14px; padding:0; background:none; border:none; color:var(--text-3); font:500 13px 'Manrope',var(--sans); cursor:pointer; }
.adm-back:hover { color:var(--text); }
.adm-empty { padding:3rem 1rem; text-align:center; color:var(--text-3); font-size:14px; }
.adm-kind { font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px; background:var(--bg-3); color:var(--text-2); white-space:nowrap; }
.adm-quote { font-size:13.5px; color:var(--text); line-height:1.5; white-space:pre-line; word-break:break-word; }
.adm-row.top { align-items:flex-start; }
.adm-ch-medal { display:flex; flex-shrink:0; }
.adm-ch-n { display:flex; flex-direction:column; align-items:center; min-width:56px; } .adm-ch-n small { font-size:11px; color:var(--text-3); }
a.adm-btn { text-decoration:none; }
.adm-more { margin:14px auto 0; display:block; }
@media(max-width:640px) { .adm-ch-row { flex-wrap:wrap; } .adm-ch-row .adm-main { flex-basis:calc(100% - 64px); } .adm-ch-n { min-width:0; flex-direction:row; gap:5px; align-items:baseline; } }
/* Word filter */
.adm-filter { margin-bottom:1.5rem; }
.adm-filter-row { display:flex; align-items:center; justify-content:space-between; gap:10px 16px; flex-wrap:wrap; padding:10px 0; border-top:0.5px solid var(--border); }
.adm-filter-row:first-of-type { border-top:none; padding-top:0; }
.adm-filter-txt { font-size:13.5px; color:var(--text-2); }
.adm-filter-txt b { color:var(--text); }
.adm-flag { display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 0; border-top:0.5px solid var(--border); }
.adm-flag .adm-name { flex:1; min-width:120px; }
.adm-flag input { width:170px; max-width:100%; padding:7px 10px; font-size:13px; }
.adm-word { display:inline-flex; align-items:center; gap:4px; padding:4px 4px 4px 10px; border-radius:20px; background:var(--bg-3); border:0.5px solid var(--border-2); font-size:12.5px; font-weight:600; }

function _admBars(days, noun) {

  return `<div class="adm-bars" role="img" aria-label="${total} ${noun} in the last 30 days">${days.map(d =>
      `<span class="adm-bar${d.n ? '' : ' zero'}" tabindex="0" aria-label="${label(d)}: ${d.n}"><i style="height:${Math.max(2, d.n / max * 100)}%"></i><span class="adm-tip">${label(d)} · ${d.n}</span></span>`).join('')}</div>
    <div class="adm-axis"><span>${label(days[0])}</span><span>${label(days[days.length - 1])}</span></div>`;
}
function _admSplit(obj, labels) {
  const rows = labels.map(([k, l]) => [l, Number(obj?.[k] || 0)]).filter(r => r[1] > 0);
  const max = Math.max(1, ...rows.map(r => r[1]));
  return rows.length ? `<div class="adm-split">${rows.map(([l, n]) => `<span class="adm-split-l">${l}</span><span class="adm-split-b" aria-hidden="true"><i style="width:${n / max * 100}%"></i></span><span class="adm-split-n">${_admNum(n)}</span>`).join('')}</div>`

function _admRank(rows, value) {

  }).join('')}</div>` : '<div class="adm-card-s">Not enough ratings yet.</div>';

// A small trend line under a KPI (one series, no axes)
function _admSpark(days) {

  return `<svg class="adm-spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path class="a" d="M0,${h} L${pts.join(' L')} L${w},${h} Z"/><path class="l" d="M${pts.join(' L')}"/></svg>`;

  panel.innerHTML = `<input class="field-input adm-search" id="admUserSearch" type="search" placeholder="Search members by name or handle…" aria-label="Search members" name="mss-admin-search" autocapitalize="none" data-1p-ignore data-lpignore="true" data-form-type="other" autocomplete="off" value="${esc(_admUserQuery)}">

/* ── Activity: latest comments & replies ── */
async function admActivity() {
  const panel = document.getElementById('admPanel');
  panel.innerHTML = _admSpin();
  const { data, error } = await sb.rpc('admin_recent_activity', { p_limit: 80 });
  if (_admTab !== 'activity') return;
  if (error) return admError(error);
  panel.innerHTML = data.length ? `<div class="adm-list">${data.map(r => `
    <div class="adm-row top">${_admAv(r)}
      <span class="adm-main">
        <span class="adm-meta"><span class="adm-kind">${ADM_KIND[r.kind] || esc(r.kind)}</span><b translate="no" style="color:var(--text)">@${esc(r.username || '?')}</b><span>on <span translate="no">${esc(r.on_title || '—')}</span></span><span>${_admAgo(r.created_at)}</span></span>
        <span class="adm-quote" translate="no">${esc(r.content)}</span>
      </span>
      <span class="adm-actions"><button type="button" class="adm-btn danger" onclick="admRemove('${esc(r.kind)}', '${esc(r.id)}')">Remove</button></span>

async function admRemove(kind, id) {
  const what = (ADM_KIND[kind] || 'Post').toLowerCase();
  if (!(await showConfirm({ title: `Remove this ${what}?`, message: 'It will be deleted for everyone. This can’t be undone.', confirmText: 'Remove', iconName: 'trash' }))) return;
  const { error } = await sb.rpc('admin_delete_content', { p_kind: kind, p_id: id });
  if (error) { console.error(error); showToast('Couldn’t remove it. Try again.', 'err'); return; }
  showToast('Removed.');
  admActivity();
}

/* ── Safety: flagged members, pictures to check, word filter ── */
let _admWordKind = 'word', _admWordLevel = 'severe';
const ADM_LEVELS = [['severe', 'Severe', 'starred out fully'], ['mild', 'Mild', 'softened with a *'], ['username', 'Usernames only', 'names nobody can pick']];
const _admLevel = k => (ADM_LEVELS.find(([l]) => l === k) || [, k])[1];
// Text with the blocked words it hit marked
function _admMarked(text, hits) {
  const ws = [...new Set((hits || []).map(h => h.hit).filter(Boolean))].sort((a, b) => b.length - a.length);
  if (!ws.length) return esc(text);
  const re = new RegExp(`(${ws.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|')})`, 'gi');
  return String(text).split(re).map((part, i) => i % 2 ? `<mark class="adm-hit">${esc(part)}</mark>` : esc(part)).join('');
}
const _admHitWords = hits => (hits || []).length ? `<span class="adm-hitwords"><span>Blocked word${hits.length === 1 ? '' : 's'}:</span>${[...new Map(hits.map(h => [h.word, h])).values()].map(h =>
    `<span class="adm-hitword${h.level === 'mild' ? '' : ' warn'}" translate="no">${esc(h.word)}<small>${_admLevel(h.level)}</small></span>`).join('')}</span>` : '';

async function admSafety() {
  const panel = document.getElementById('admPanel');
  panel.innerHTML = _admSpin();
  const [flagged, pics, scan, reps] = await Promise.all([sb.rpc('admin_flagged_users'), sb.rpc('admin_picture_queue'), sb.rpc('admin_moderation_scan'), sb.rpc('admin_reports', { p_status: _admRepShow })]);
  if (_admTab !== 'safety') return;
  if (flagged.error && scan.error) return admError(flagged.error);
  const need = n => `<div class="adm-card adm-filter"><div class="adm-card-s">This needs migration ${n} — run it in Supabase, then refresh.</div></div>`;
  _admFlagOpen = (flagged.data || []).filter(u => u.open > 0 && !u.banned).length;
  _admPicOpen = (pics.data || []).length;
  _admReports = reps.data || [];
  if (_admRepShow === 'open') _admReportOpen = _admRepGroups(_admReports).length;
  _admPaintTabs();
  panel.innerHTML = (reps.error ? need('086') : _admReportsHTML())
    + (flagged.error ? need('040') : _admFlaggedHTML(flagged.data || []))
    + (pics.error ? need('041') : _admPicturesHTML(pics.data || []))
    + (scan.error ? need('038') : _admFilterHTML(scan.data));
}

/* Reports (086): what people reported — one row per reported thing, however many reported it.
   Dismiss · Remove it (the comment / poll / list…, the note's text, an uploaded poster, a
   profile photo) · Ban the person · View member. The reported person never sees who reported them. */
let _admReports = [], _admRepShow = 'open';
const ADM_REP_KIND = { user: 'Profile', comment: 'Comment', note_reply: 'Note reply', list_reply: 'List reply', note: 'Note', entry: 'Title pictures',
  list: 'List', poll: 'Poll', poll_comment: 'Poll comment', episode_chat: 'Episode chat', ep_note: 'Episode note', ep_note_reply: 'Episode note reply' };
const ADM_REP_REASON = { spam: 'Spam', harassment: 'Harassment', offensive: 'Hateful / offensive', sexual: 'Sexual', copyright: 'Stolen picture / work', other: 'Other' };
// what "Remove" takes away for each kind (admin_delete_content)
const ADM_REP_REMOVE = { comment: ['comment', 'Remove comment'], note_reply: ['note_reply', 'Remove reply'], list_reply: ['list_reply', 'Remove reply'],
  note: ['note', 'Remove note text'], entry: ['poster', 'Remove poster'], list: ['list', 'Delete list'], poll: ['poll', 'Delete poll'],
  poll_comment: ['poll_comment', 'Remove comment'], episode_chat: ['episode_chat', 'Remove message'], user: ['avatar', 'Remove photo'],
  ep_note: ['ep_note', 'Remove note text'], ep_note_reply: ['ep_note_reply', 'Remove reply'] };
function _admRepGroups(list) {
  const m = new Map();
  list.forEach(r => { const k = r.kind + ':' + r.target_id; if (!m.has(k)) m.set(k, []); m.get(k).push(r); });
  return [...m.values()];
}
// An episode / season note (109) → its page, that note (or its replies) — like the notification link
function _admEpNoteLink(kind, cx) {
  const show = encodeURIComponent(cx.tmdb_id), s = encodeURIComponent(cx.season), ep = Number(cx.episode);
  const href = (ep ? `episode.html?show=${show}&s=${s}&e=${encodeURIComponent(ep)}` : `season.html?show=${show}&s=${s}`)
    + `&${kind === 'ep_note' ? 'note' : 'replies'}=${encodeURIComponent(cx.rating_id || '')}`;
  return `<a class="adm-rep-link" href="${href}" target="_blank" rel="noopener" translate="no">${esc(cx.show || 'Show')} · ${ep ? `S${Number(cx.season)} E${ep}` : `Season ${Number(cx.season)}`}</a>`;
}
function _admReportsHTML() {
  const groups = _admRepGroups(_admReports), open = _admRepShow === 'open';
  return `<div class="adm-card adm-filter adm-reports">
    <div class="adm-card-h"><span class="adm-card-t">Reports</span><span class="adm-card-s">${open ? 'what members reported — newest first' : 'closed lately'}</span>
      <button type="button" class="adm-btn adm-rep-toggle" onclick="admReportsShow('${open ? 'done' : 'open'}')">${open ? 'Show closed' : 'Show open'}</button></div>
    ${groups.length ? groups.map(_admRepHTML).join('') : `<div class="adm-filter-txt">${open ? 'No reports waiting. When someone reports a comment, list, poll, note or person, it shows up here.' : 'Nothing closed yet.'}</div>`}
  </div>`;
}
function _admRepHTML(g) {
  const r = g[0], o = r.owner || {}, cx = r.ctx || {}, open = r.status === 'open';
  const reasons = [...new Set(g.map(x => x.reason))];
  const pic = r.kind === 'entry' ? safeURL(cx.poster_url) : r.kind === 'user' ? safeURL(cx.avatar_url) : '';
  const rm = ADM_REP_REMOVE[r.kind];
  const canRemove = open && rm && !(r.kind === 'user' && !cx.avatar_url) && !(r.kind === 'entry' && !cx.poster_url);
  const where = r.kind === 'list' ? `<a class="adm-rep-link" href="list-view.html?list=${encodeURIComponent(r.target_id)}" target="_blank" rel="noopener">Open list</a>`
    : r.kind === 'episode_chat' && cx.show ? `<span translate="no">${esc(cx.show)} · S${Number(cx.season)} E${Number(cx.episode)}</span>`
    : (r.kind === 'ep_note' || r.kind === 'ep_note_reply') && cx.tmdb_id ? _admEpNoteLink(r.kind, cx)
    : (r.kind === 'note' || r.kind === 'entry') && cx.title ? `<span translate="no">on ${esc(cx.title)}</span>` : '';
  return `<div class="adm-rep${open ? '' : ' done'}">
    <div class="adm-rep-top">${_admAv(o)}
      <span class="adm-main">
        <span class="adm-meta"><span class="adm-kind warn">${ADM_REP_KIND[r.kind] || esc(r.kind)}</span><b translate="no" style="color:var(--text)">@${esc(o.username || '(deleted)')}</b>${o.banned ? '<span class="adm-kind">Banned</span>' : ''}${where}<span>${_admAgo(r.created_at)}</span></span>
        <span class="adm-meta">${reasons.map(x => `<span class="adm-rep-reason">${ADM_REP_REASON[x] || esc(x)}</span>`).join('')}<span>${g.length === 1 ? 'reported once' : `reported by ${g.length} people`}</span>${r.owner_reports > 1 ? `<span>${r.owner_reports} things of theirs reported</span>` : ''}${!open ? `<span>${r.status === 'actioned' ? 'Acted on' : 'Dismissed'} ${_admAgo(r.reviewed_at)}</span>` : ''}</span>
      </span>
      ${pic ? `<img class="adm-rep-pic${r.kind === 'user' ? ' round' : ''}" src="${pic}" alt="" loading="lazy">` : ''}
    </div>
    ${r.excerpt ? `<span class="adm-quote adm-excerpt" translate="no">${esc(r.excerpt)}</span>` : ''}
    ${g.filter(x => x.details).map(x => `<div class="adm-rep-note"><b translate="no">@${esc(x.reporter?.username || '?')}:</b> ${esc(x.details)}</div>`).join('')}
    <div class="adm-rep-by">From ${g.map(x => `<span translate="no">@${esc(x.reporter?.username || '?')}</span>`).join(', ')}</div>
    ${open ? `<div class="adm-actions">
      ${o.id ? `<button type="button" class="adm-btn" onclick="admUser('${esc(o.id)}')">View member</button>` : ''}
      <button type="button" class="adm-btn" onclick="admReportDone(${Number(r.id)}, 'dismissed')">Dismiss</button>
      ${o.id ? `<button type="button" class="adm-btn" onclick="admReportWarn(${Number(r.id)})">Warn</button>` : ''}
      ${canRemove ? `<button type="button" class="adm-btn danger" onclick="admReportRemove(${Number(r.id)})">${rm[1]}</button>` : ''}
      ${o.id && !o.banned ? `<button type="button" class="adm-btn danger" onclick="admReportSuspend(${Number(r.id)})">Suspend</button>
        <button type="button" class="adm-btn danger" onclick="admReportBan(${Number(r.id)})">Ban</button>` : ''}
    </div>` : ''}
  </div>`;
}
function admReportsShow(st) { _admRepShow = st; admSafety(); }
// action ('removed' | 'banned' | 'suspended' | 'warned') → the people who reported it and its owner get a notification (087 / 089)
async function admReportDone(id, status, quiet, action) {
  const { error } = await sb.rpc('admin_resolve_report', { p_id: id, p_status: status, p_action: action || null });
  if (error) { console.error(error); showToast('Couldn’t save that. Try again.', 'err'); return false; }
  if (!quiet) { showToast(status === 'dismissed' ? 'Report dismissed.' : 'Done.'); admSafety(); }
  return true;
}
async function admReportRemove(id) {
  const r = _admReports.find(x => x.id === id); if (!r) return;
  const [kind, label] = ADM_REP_REMOVE[r.kind];
  const msg = { note: 'Their note’s text is cleared — the title stays in their library.', ep_note: 'Their note’s text is cleared — their episode rating stays.', poster: 'Their uploaded poster is taken off — the title goes back to its normal poster.',
    avatar: 'Their profile photo is taken off.', list: 'The whole list is deleted.', poll: 'The poll, its votes and comments are deleted.' }[kind] || 'It’s deleted for everyone.';
  if (!(await showConfirm({ title: label + '?', message: msg + ' This can’t be undone.', confirmText: label.split(' ')[0], iconName: 'trash' }))) return;
  const { error } = await sb.rpc('admin_delete_content', { p_kind: kind, p_id: r.target_id });
  if (error) { console.error(error); showToast('Couldn’t remove it. Run migration 086 if you haven’t.', 'err'); return; }
  if (await admReportDone(id, 'actioned', true, 'removed')) { showToast('Removed — they’ve been told.'); admSafety(); }
}
// Warn: nothing is removed — they're told what broke the rules
async function admReportWarn(id) {
  const r = _admReports.find(x => x.id === id), o = r?.owner; if (!o?.id) return;
  if (!(await showConfirm({ title: `Warn @${o.username}?`, message: `They get a notification that their ${(ADM_REP_KIND[r.kind] || 'post').toLowerCase()} broke the community rules (${ADM_REP_REASON[r.reason] || r.reason}). Nothing is removed.`, confirmText: 'Warn', iconName: 'info', danger: false }))) return;
  if (await admReportDone(id, 'actioned', true, 'warned')) { showToast(`@${o.username} has been warned.`); admSafety(); }
}
// Suspend: a ban with an end date — 7 days, or longer when asked
// the shared confirm, with how long as its choices → 7 / 30 / 90, or 0 when cancelled
async function admSuspendAsk(username) {
  const d = await showConfirm({ title: `Suspend @${username}?`, message: 'They can’t sign in or post until it ends, and they’re told why. How long?',
    choices: [7, 30, 90].map(n => [String(n), `${n} days`]), confirmText: 'Suspend', iconName: 'lock' });
  return Number(d) || 0;
}
async function admReportSuspend(id) {
  const r = _admReports.find(x => x.id === id), o = r?.owner; if (!o?.id) return;
  const days = await admSuspendAsk(o.username); if (!days) return;
  const { error } = await sb.rpc('admin_suspend_user', { p_user: o.id, p_days: days, p_reason: 'Reported: ' + (ADM_REP_REASON[r.reason] || r.reason) });
  if (error) { console.error(error); showToast(/ADMIN/.test(error.message || '') ? 'Admins can’t be suspended.' : 'Couldn’t suspend. Run migration 089 if you haven’t.', 'err'); return; }
  await admReportDone(id, 'actioned', true, 'suspended');
  showToast(`@${o.username} is suspended for ${days} days.`);
  admSafety();
}
async function admReportBan(id) {
  const r = _admReports.find(x => x.id === id), o = r?.owner; if (!o?.id) return;
  if (!(await showConfirm({ title: `Ban @${o.username}?`, message: 'They’re signed out, can’t sign back in and can’t post anything. You can unban them later from their member page.', confirmText: 'Ban', iconName: 'lock' }))) return;
  const { error } = await sb.rpc('admin_ban_user', { p_user: o.id, p_reason: 'Reported: ' + (ADM_REP_REASON[r.reason] || r.reason) });
  if (error) { console.error(error); showToast(/ADMIN/.test(error.message || '') ? 'Admins can’t be banned.' : 'Couldn’t ban. Try again.', 'err'); return; }
  await admReportDone(id, 'actioned', true, 'banned');
  showToast(`@${o.username} is banned.`);
  admSafety();
}

/* Flagged members: strikes = severe words, refused / removed pictures, blocked usernames */
const ADM_STRIKES = 3;    // from here a member is shown as ready for a decision
const ADM_FLAG = { severe: 'Severe words', mild: 'Mild language', username: 'Blocked username', image: 'Picture' };

async function admWarn(id, username) {

    const { error } = await sb.rpc('admin_warn_user', { p_user: id, p_reason: h.body.querySelector('#admWarnWhy').value, p_note: h.body.querySelector('#admWarnNote').value });

        <select class="lyr-field" id="admWarnWhy">${Object.entries(ADM_REP_REASON).map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select></div>

    footer: { secondary: [{ label: 'Cancel', only: 'side', onClick: x => x.close() }], primary: { label: 'Send warning', onClick: send } } });

}

      ${posts ? `<span class="adm-actions"><button type="button" class="adm-btn" aria-expanded="false" aria-controls="admUnstarred" onclick="admShowUnstarred(this)">Show them</button><button type="button" class="adm-btn on" onclick="admCleanUp()">Star them out now</button></span>` : ''}</div>

      <div class="adm-filter-txt" style="margin-bottom:10px">Type a word or a sentence to see what the filter does with it, then block or unblock words.</div>

        ${toggle('level', _admWordLevel, ADM_LEVELS, 'How strict')}

        <button type="button" class="adm-btn on" onclick="admAddWord()">Block it</button>
      </div>

async function admShowUnstarred(btn) {
  const box = document.getElementById('admUnstarred');
  const open = btn.getAttribute('aria-expanded') !== 'true';
  btn.setAttribute('aria-expanded', open); btn.textContent = open ? 'Hide them' : 'Show them';
  box.hidden = !open;
  if (!open || box.dataset.loaded) return;
  box.innerHTML = _admSpin();
  const { data, error } = await sb.rpc('admin_unstarred_posts');
  if (error) { console.error(error); box.innerHTML = '<div class="adm-filter-txt">Couldn’t load them. Check that migration 041 has been run.</div>'; return; }
  box.dataset.loaded = '1';
  box.innerHTML = `<div class="adm-unstarred">${data.map(r => `<div class="adm-flagline">${_admAv(r)}
      <span class="adm-meta"><b translate="no" style="color:var(--text)">@${esc(r.username || '?')}</b><span>${esc(r.source)}</span></span>
      <span class="adm-quote adm-excerpt" translate="no">${_admMarked(r.text, r.hits)}</span>${_admHitWords(r.hits)}</div>`).join('')}</div>`;

async function admCheckWord() {
  const text = document.getElementById('admNewWord').value.trim(), box = document.getElementById('admCheck');
  if (!text) { box.innerHTML = ''; return; }
  const { data: r, error } = await sb.rpc('admin_check_text', { p_text: text });
  if (error) { console.error(error); box.innerHTML = '<div class="adm-filter-txt">Couldn’t check that. Check that migration 041 has been run.</div>'; return; }
  const hits = [...new Map((r.hits || []).concat(r.username_hits || []).map(h => [h.word, h])).values()];
  const asName = /\s/.test(text) ? '' : `<div class="adm-check-row"><span class="adm-check-l">As a username</span><span>${(r.username_hits || []).length ? '<span class="adm-kind warn">Not allowed</span>' : '<span class="adm-kind">Allowed</span>'}</span></div>`;
  box.innerHTML = `<div class="adm-check">
    <div class="adm-check-row"><span class="adm-check-l">Typed</span><span class="adm-quote" translate="no">${_admMarked(text, (r.hits || []).concat(r.username_hits || []))}</span></div>
    <div class="adm-check-row"><span class="adm-check-l">Saved as</span><span class="adm-quote" translate="no">${esc(r.saved_as)}</span></div>
    ${asName}
    <div class="adm-check-row"><span class="adm-check-l">Caught by</span><span class="adm-check-words">${hits.length ? hits.map(h => `<span class="adm-word" translate="no">${esc(h.word)}<small>${_admLevel(h.level)}${h.kind === 'prefix' ? ' · starts with' : ''}</small><button type="button" onclick="admRemoveWord(${attrJSON(h.word)})" aria-label="Unblock ${esc(h.word)}">${icon('x', 12)}</button></span>`).join('') : '<span class="adm-filter-txt">Nothing — no blocked words in it.</span>'}</span></div>
  </div>`;
}
function _admSetOpt(set, v) {
  if (set === 'kind') _admWordKind = v; else _admWordLevel = v;
  document.querySelectorAll(`.adm-addopts [data-set="${set}"] .pn-toggle-btn`).forEach(b => { const on = b.dataset.v === v; b.classList.toggle('active', on); b.setAttribute('aria-checked', on); });
}

/* ── Who has a title ── */
function admTitlesView() {
  const panel = document.getElementById('admPanel');
  panel.innerHTML = `<input class="field-input adm-search" id="admSearch" type="search" placeholder="Search a title in everyone’s libraries…" aria-label="Search a title" autocomplete="off" value="${esc(_admQuery)}">
    <div id="admResults" aria-live="polite"></div>`;
  const input = document.getElementById('admSearch');
  input.addEventListener('input', () => { clearTimeout(_admTimer); _admTimer = setTimeout(() => admSearch(input.value), MSS_SEARCH_MS); });
  if (!matchMedia('(max-width:640px)').matches) input.focus();
  if (_admQuery) admSearch(_admQuery);
  else document.getElementById('admResults').innerHTML = '<div class="adm-empty">Type at least 2 letters of a title.</div>';
}
async function admSearch(q) {
  _admQuery = q.trim();
  const box = document.getElementById('admResults');
  if (!box) return;
  if (_admQuery.length < 2) { box.innerHTML = '<div class="adm-empty">Type at least 2 letters of a title.</div>'; return; }
  box.innerHTML = _admSpin();
  const { data, error } = await sb.rpc('admin_find_titles', { p_query: _admQuery });
  if (q.trim() !== _admQuery || !document.getElementById('admResults')) return;
  if (error) return admError(error);
  _admTitles = data;
  if (!data.length) { box.innerHTML = '<div class="adm-empty">No one has a title like that.</div>'; return; }
  box.innerHTML = `<div class="adm-list">${data.map((t, i) => {
    const counts = ADM_STATUS.filter(([k]) => t[k] > 0).map(([k, l]) => `<span class="w-ep-badge">${l} ${t[k]}</span>`).join('');
    return `<button type="button" class="adm-row" onclick="admAudience(${i})">${_admPoster(t.poster_url)}
      <span class="adm-main">
        <span class="adm-name" translate="no">${esc(t.title)}${t.year ? ` <span class="adm-meta">${esc(String(t.year).slice(0, 4))}</span>` : ''}</span>
        <span class="adm-meta">${counts}</span>
      </span>
      <span class="adm-count" aria-label="${t.people} people">${t.people}</span>
    </button>`;
  }).join('')}</div>`;
}
async function admAudience(i) {
  const t = _admTitles[i];
  const panel = document.getElementById('admPanel');
  panel.innerHTML = _admSpin();
  const { data, error } = await sb.rpc('admin_title_audience', { p_tmdb_id: t.tmdb_id, p_tmdb_type: t.tmdb_type, p_title: t.title });
  if (error) return admError(error);
  const scores = data.map(r => liveScore(r)).filter(v => v != null);
  const avg = scores.length ? scores.reduce((a, b) => a + b, 0) / scores.length : null;
  const href = _admTitleHref(t);
  const row = r => {
    const score = liveScore(r);
    const progress = r.status !== 'completed' && r.total_eps ? `<span>${r.watched || 0} / ${r.total_eps} episodes</span>` : '';
    return `<button type="button" class="adm-row" onclick="admUser('${esc(r.user_id)}')">${_admAv(r)}
      <span class="adm-main">
        <span class="adm-name" translate="no">${esc(r.display_name || '@' + (r.username || '?'))}</span>
        <span class="adm-meta"><span translate="no">@${esc(r.username || '?')}</span>${progress}<span>${_admFmt(r.completed_date || r.updated_at)}</span></span>
      </span>
      ${score != null ? scoreBadge(score, 'md') : ''}
    </button>`;
  };
  panel.innerHTML = `<button type="button" class="adm-back" onclick="admTitlesView()">${icon('back', 14)} Back to results</button>
    <div class="adm-person">${_admPoster(t.poster_url).replace('adm-poster', 'adm-poster" style="width:56px;height:84px')}<div>
      <div class="adm-person-name" translate="no">${esc(t.title)}</div>
      <div class="adm-meta"><span>${data.length === 1 ? '1 person' : `${data.length} people`}</span>${avg != null ? `<span>average ${scoreBadge(avg, 'sm')}</span>` : ''}${href ? `<a class="adm-link" href="${href}">Open title</a>` : ''}</div></div></div>
    ${ADM_STATUS.map(([k, l]) => {
      const rows = data.filter(r => r.status === k);
      return rows.length ? `<div class="adm-group">${l} · ${rows.length}</div><div class="adm-list">${rows.map(row).join('')}</div>` : '';
    }).join('') || '<div class="adm-empty">No one has this title anymore.</div>'}`;
}

/* ── Guest showcase (117_site_config.sql): what signed-out visitors see ──
   "A folio in action" on the guest splash (3 cards), the posters on the locked Library / Social / You
   promos, and (below) the poster wall. Each card is typed in, or copied from YOUR OWN account when you

    ${ADM_WALL.map(([k, label, where]) => `<section class="adm-wrow" aria-label="${label}">
      <div class="adm-wrow-h"><span class="adm-card-t">${label}</span><span class="adm-card-s">${where} · ${_admWall[k].length} / ${ADM_WALL_MAX}</span></div>
      <div class="adm-wgrid">${Array.from({ length: ADM_WALL_MAX }, (_, i) => slot(k, _admWall[k][i], i)).join('')}</div>
    </section>`).join('')}
    <div class="adm-wsave${_admWallDirty ? ' dirty' : ''}">
      <span>${_admWallDirty ? 'Unsaved changes' : 'Everything’s saved'}</span>
      <button type="button" class="adm-btn on" id="admWallSave" onclick="admWallSave()" ${_admWallDirty ? '' : 'disabled'}>Save for everyone</button>
    </div>`;
}
function _admWallChanged() { _admWallDirty = true; _admWallDraw(); }
function admWallMove(k, i, d) {
  const a = _admWall[k], j = i + d;
  if (j < 0 || j >= a.length) return;
  [a[i], a[j]] = [a[j], a[i]]; _admWallChanged();
}
function admWallClear(k, i) { _admWall[k].splice(i, 1); _admWallChanged(); }
async function admWallSave() {
  const b = document.getElementById('admWallSave');
  b.disabled = true; b.textContent = 'Saving…';
  const { data, error } = await sb.rpc('set_sign_in_wall', { p_slots: _admWall });
  if (error) { console.error(error); showToast(error.code === '42501' ? 'Only admins can change these.' : 'Couldn’t save — try again.', 'err'); b.disabled = false; b.textContent = 'Save for everyone'; return; }
  _admWallAt = data; _admWallDirty = false; _admWallDraw();
  showToast('Saved — the sign-in page shows these now.');
}
addEventListener('beforeunload', e => { if (_admWallDirty || _admScDirty) { e.preventDefault(); e.returnValue = ''; } });

// The picker: find the title (that row's kind of thing), then choose one of its posters
function admWallPick(k, i) {
  i = Math.min(i, _admWall[k].length);
  const now = _admWall[k][i];
  _admOpenPicker({ kind: k === 'movies' ? 'movie' : k === 'tv' ? 'tv' : 'multi', label: ADM_WALL.find(w => w[0] === k)[1], title: `${ADM_WALL.find(w => w[0] === k)[1]} · slot ${i + 1}`, cur: now,
    done: item => { _admWall[k][i] = item; _admWallChanged(); } });
}
// The title + poster picker (search TMDB, then pick any of its posters): o = { kind: 'movie' | 'tv' | 'multi', label, title, cur, done(item) }
async function _admOpenPicker(o) {
  _admPick = o;
  const label = o.label;
  await mssLoadScript('js/panel.js');
  const h = MSSPanel.open({ size: 'S', kind: 'generic', title: o.title,
    body: `<div class="lyr-search"><span class="lyr-search-ic" aria-hidden="true">${icon('search', 16)}</span><input class="lyr-field" id="admPickQ" type="search" placeholder="Search ${label.toLowerCase()}…" aria-label="Search a title" autocomplete="off"></div>
      <div id="admPickRes" aria-live="polite"><div class="adm-empty">Type a title.</div></div>`,
    onClose: () => { if (_admPickPanel === h) _admPickPanel = null; } });
  _admPickPanel = h;
  const q = document.getElementById('admPickQ');
  q.addEventListener('input', () => { clearTimeout(_admTimer); _admTimer = setTimeout(() => _admPickSearch(q.value), MSS_SEARCH_MS); });
  if (!h.isPage) q.focus();
}
let _admPickPanel = null;
function admPickClose() { _admPickPanel?.closeNow(); }
async function _admPickSearch(q) {
  const box = document.getElementById('admPickRes'), kind = _admPick.kind;
  q = q.trim();
  if (q.length < 2) { box.innerHTML = '<div class="adm-empty">Type a title.</div>'; return; }
  box.innerHTML = _admSpin();
  try {
    const res = await tmdbFetch(`${TMDB_BASE}/search/${kind}?query=${encodeURIComponent(q)}&include_adult=false&language=en-US`);
    if (!res.ok) throw res;
    const hits = ((await res.json()).results || [])
      .map(r => ({ id: r.id, type: kind === 'multi' ? r.media_type : kind, title: r.title || r.name, year: (r.release_date || r.first_air_date || '').slice(0, 4), poster: r.poster_path }))
      .filter(r => (r.type === 'movie' || r.type === 'tv') && r.poster).slice(0, 12);
    if (document.getElementById('admPickQ')?.value.trim() !== q) return;
    _admPick.hits = hits;
    box.innerHTML = hits.length ? `<div class="adm-list">${hits.map((h, n) => `<button type="button" class="adm-row" onclick="_admPickTitle(${n})">${_admPoster(ADM_POSTER + h.poster)}
        <span class="adm-main"><span class="adm-name" translate="no">${esc(h.title)}</span><span class="adm-meta"><span>${h.type === 'movie' ? 'Movie' : 'TV Show'}</span>${h.year ? `<span>${esc(h.year)}</span>` : ''}</span></span>${icon('arrowRight', 15)}</button>`).join('')}</div>`
      : '<div class="adm-empty">Nothing with a poster matches that.</div>';
  } catch (err) { console.error(err); box.innerHTML = '<div class="adm-empty">TMDB didn’t answer — try again in a moment.</div>'; }
}
async function _admPickTitle(n) {
  const h = _admPick.hits[n], box = document.getElementById('admPickRes');
  box.innerHTML = _admSpin();
  try {
    const res = await tmdbFetch(`${TMDB_BASE}/${h.type}/${h.id}/images?include_image_language=en,null`);
    if (!res.ok) throw res;
    const posters = ((await res.json()).posters || []).sort((a, b) => (b.vote_count || 0) - (a.vote_count || 0) || (b.vote_average || 0) - (a.vote_average || 0)).map(p => p.file_path);
    if (!posters.includes(h.poster)) posters.unshift(h.poster);
    _admPick.title = h; _admPick.posters = posters.slice(0, 60);
    const now = _admPick.cur, cur = now && now.id === h.id ? now.poster : '';
    box.innerHTML = `<button type="button" class="adm-back" onclick="_admPickSearch(document.getElementById('admPickQ').value)">${icon('back', 14)} Back to results</button>
      <div class="adm-group" translate="no">${esc(h.title)} · ${_admPick.posters.length} posters</div>
      <div class="adm-wpick">${_admPick.posters.map((p, j) => `<button type="button" onclick="_admPickPoster(${j})" aria-label="Poster ${j + 1}${p === cur ? ' (in use now)' : ''}"${p === cur ? ' class="on"' : ''}><img src="${ADM_POSTER}${esc(p)}" alt="" loading="lazy"></button>`).join('')}</div>`;
  } catch (err) { console.error(err); box.innerHTML = '<div class="adm-empty">Couldn’t load the posters — try again.</div>'; }
}
function _admPickPoster(j) {
  const h = _admPick.title, done = _admPick.done;
  admPickClose();
  done({ id: h.id, type: h.type, title: h.title, poster: _admPick.posters[j] });
}

document.addEventListener('DOMContentLoaded', () => {
  initPage(async () => {
    const { data, error } = await sb.rpc('is_app_admin');
    if (error || data !== true) {
      document.querySelector('.adm-shell').style.gridTemplateColumns = '1fr';
      ['admSide', 'admRefresh', 'admMenu'].forEach(id => { document.getElementById(id).style.display = 'none'; });
      return admError(error || { code: '42501' });
    }
    document.getElementById('admRefresh').innerHTML = `${icon('refresh', 15)}<span class="adm-refresh-l">Refresh</span>`;
    document.getElementById('admMenu').innerHTML = icon('list', 20);
    document.querySelector('.adm-side-x').innerHTML = icon('x', 18);
    document.getElementById('admSideF').innerHTML = `${icon('lock', 13)} Only the site’s owners can see this page.`;
    admTab(location.hash.slice(1) || 'overview');
    _admCounts();   // the to-do counts on the sidebar and the Overview's "Needs you"
    setInterval(() => {
      _admStamp();
      if (document.visibilityState === 'visible' && _admTab === 'overview' && Date.now() - _admLoadedAt > 60000) { _admCounts(); admOverview('live'); }
    }, 15000);
  });
});
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(r => console.log('SW registered:', r.scope))
      .catch(e => console.warn('SW failed:', e));
  });
}
</script>
