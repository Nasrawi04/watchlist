/* ══ Profile Header — Instagram style ══ */
.prof-header {
  display:flex;
  flex-direction:column;
  align-items:stretch;
  gap:0;
  padding:1.75rem 0 1.5rem;
  position:relative;
  margin-bottom:1.5rem;
/* Full-width divider line under prof-header */
.prof-header::after {
  content:'';
  position:absolute;
  bottom:0;
  left:calc(-50vw + 50%);
  width:100vw;
  height:0.5px;
  background:var(--border);
}
}
.prof-avatar {
  width:110px; height:110px; border-radius:50%; flex-shrink:0;
  background:var(--olive-faint); border:2.5px solid var(--olive-light);
  font-family:var(--serif); font-size:38px; color:var(--olive-light);
  display:flex; align-items:center; justify-content:center; overflow:hidden;
  grid-column:1; grid-row:1;
}
.prof-avatar img { width:100%; height:100%; object-fit:cover; border-radius:50%; }
/* Stat boxes sit on the same row as the avatar, filling the right column */
.prof-stat-boxes {
  width:100%;
  display:grid;
  margin-top:4px;
  grid-template-columns:repeat(6,1fr);
  gap:6px; align-self:center;
}
.prof-stat-box {
  background:var(--card); border:0.5px solid var(--border-olive); border-radius:var(--radius);
  padding:.5rem .85rem; display:flex; flex-direction:column; align-items:center; justify-content:center;
  transition:border-color var(--trans) var(--ease);
  grid-column:span 2; min-width:0; overflow:hidden;
}
/* Episodes and Runtime — each takes half the full width (3 of 6 cols) */
.prof-stat-box:hover { border-color:var(--border-olive); }
.prof-stat-box-num { font-family:var(--serif); font-size:22px; font-weight:500; color:var(--olive-light); line-height:1.15; text-align:center; }
.prof-stat-box-label { font-size:8px; color:var(--text-3); text-transform:uppercase; letter-spacing:1px; margin-top:3px; white-space:nowrap; text-align:center; }
/* Info block: username, display name, bio, quote — below avatar in left column, spans both cols */
.prof-header-top {
  display:flex; flex-direction:row; align-items:flex-start;
  gap:1.5rem; margin-bottom:14px;
}
.prof-header-info {
  flex:1; min-width:0;
  display:flex; flex-direction:column; justify-content:center;
  padding-top:4px;
}
.prof-username { font-family:var(--serif); font-size:30px; font-weight:600; color:var(--text); line-height:1.1; margin-bottom:5px; }
.prof-displayname { font-size:15px; color:var(--text-2); margin-bottom:10px; font-weight:400; }
.prof-bio { font-size:14px; color:var(--text); line-height:1.6; margin-bottom:8px; }
.prof-quote {
  font-family:var(--sans); font-style:italic;
  font-size:14px; font-weight:400; color:var(--text-2);
  padding-left:14px; border-left:3px solid var(--olive-light);
  margin-bottom:10px; line-height:1.6;
}
/* Buttons row */
.prof-header-actions {
  display:flex; gap:8px; flex-wrap:wrap; align-items:center;
  justify-content:center; padding-top:10px; width:100%;
}
/* Friend buttons */
.pv-friend-btn {
  padding:7px 18px; border-radius:var(--radius-sm); font-size:12px; font-weight:500;
  cursor:pointer; transition:all .15s; white-space:nowrap;
}
.pv-friend-btn.add { background:var(--olive); color:#fff; border:none; }
.pv-friend-btn.add:hover { background:var(--olive-2); }
.pv-friend-btn.friends { background:var(--olive-faint); color:var(--olive-light); border:0.5px solid var(--border-olive); }
.pv-friend-btn.friends:hover { background:#f87171; color:#fff; border-color:#f87171; }
.pv-friend-btn.pending { background:transparent; color:var(--text-3); border:0.5px solid var(--border-2); }
.pv-friend-btn.pending:hover { background:var(--bg-3); }
.pv-friend-btn.accept { background:var(--olive); color:#fff; border:none; }
.pv-friend-btn.accept:hover { background:var(--olive-2); }
.pv-friend-btn.decline { background:transparent; color:#f87171; border:0.5px solid #f87171; }
.pv-friend-btn.decline:hover { background:#f87171; color:#fff; }
.pv-friend-btn.pv-notify { display:inline-flex; align-items:center; gap:6px; background:transparent; color:var(--text-2); border:0.5px solid var(--border-2); margin-left:6px; }
.pv-friend-btn.pv-notify:hover { border-color:var(--border-olive); color:var(--olive-light); background:var(--olive-faint); }
.pv-friend-btn.pv-notify.on { background:var(--olive); color:#fff; border-color:var(--olive); }
.pv-friend-btn.pv-notify.on:hover { background:var(--olive-2); }

<script>
function _trimNotes(text) {
  if (!text) return '';
  var words = text.trim().split(/\s+/);
  return words.length > 150 ? words.slice(0, 150).join(' ') + '…' : text;
}
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>window.LIB_SCOPE = 'pv'; window.LIB_READONLY = true; window.LIB_ENTRIES = function(){ return _pvEntries; };</script>

<script>
let _pvMe = null, _pvMeProfile = null;
let _pvUserId = null, _pvUsername = null, _pvProfile = null;
let _pvEntries = [];
let _pvFriendship = null;
let _pvNotifyOn = false;   // am I subscribed to this friend's activity? (off by default)

// Returning via browser back/forward can restore this page from the
// bfcache with stale data (e.g. an entry just added/edited elsewhere
// wouldn't show up here) instead of re-running this page's scripts.
window.addEventListener('pageshow', (event) => {
  if (event.persisted) location.reload();
});

document.addEventListener('DOMContentLoaded', async () => {
  // Get target user — URL params first (survive refresh), then sessionStorage
  var urlParams = new URLSearchParams(window.location.search);
  _pvUserId   = urlParams.get('id')  || sessionStorage.getItem('viewProfileId')  || null;
  _pvUsername = urlParams.get('u')   || sessionStorage.getItem('viewProfileUsername') || null;

  // Push into URL so page survives refresh
  if (_pvUserId || _pvUsername) {
    var _newUrl = new URL(window.location.href);
    if (_pvUserId   && !_newUrl.searchParams.get('id')) _newUrl.searchParams.set('id', _pvUserId);
    if (_pvUsername && !_newUrl.searchParams.get('u'))  _newUrl.searchParams.set('u',  _pvUsername);
    history.replaceState(null, '', _newUrl.toString());
  }
  // Clear sessionStorage now that URL has the params
  sessionStorage.removeItem('viewProfileId');
  sessionStorage.removeItem('viewProfileUsername');

  // Start loading the friend's profile + library while the nav is still
  // signing in — these don't depend on who's viewing.
  const profileP = _pvUserId ? getProfile(_pvUserId) : (_pvUsername ? getProfileByUsername(_pvUsername) : Promise.resolve(null));
  const earlyP = _pvUserId ? Promise.all([
    getPublicEntries(_pvUserId),
    sb.from('favorite_lists').select('*').eq('user_id', _pvUserId).order('created_at', { ascending: true }).then(r => r.data || [], () => []),
  ]) : null;

  await initPageGuest(async (user, profile) => {
    _pvMe = user;
    _pvMeProfile = profile;
  });

  // Resolve profile
  _pvProfile = await profileP;
  if (_pvProfile && !_pvUserId) _pvUserId = _pvProfile.id;

  if (!_pvProfile) {
    document.getElementById('pvContent').innerHTML = '<div class="guest-page-state fade-up">'
      +'<div class="guest-page-icon">'+icon('user',36)+'</div>'
      +'<h2 class="guest-page-title">User not found</h2>'
      +'<p class="guest-page-sub">This profile does not exist or has been removed.</p>'
      +'</div>';
    return;
  }

  document.title = `${_pvProfile.display_name || _pvProfile.username} — MyScreenScore`;

  // If viewing own profile, redirect to profile.html
  if (_pvMe && _pvUserId === _pvMe.id) {
    window.location.href = 'profile.html';
    return;
  }

  // Friendship, notify-me state, entries and lists — all at once
  const [friendships, sub, early] = await Promise.all([
    _pvMe ? getFriendships(_pvMe.id).catch(() => []) : Promise.resolve([]),
    _pvMe ? sb.from('activity_subscriptions').select('target_id').eq('subscriber_id', _pvMe.id).eq('target_id', _pvUserId).limit(1).then(r => r.data || [], () => []) : Promise.resolve([]),
    earlyP || Promise.all([
      getPublicEntries(_pvUserId),
      sb.from('favorite_lists').select('*').eq('user_id', _pvUserId).order('created_at', { ascending: true }).then(r => r.data || [], () => []),
    ]),
  ]);
  _pvFriendship = friendships.find(function(f){ return f.friendId === _pvUserId; }) || null;
  _pvNotifyOn = !!(_pvFriendship && _pvFriendship.status === 'accepted' && sub.length);
  _pvEntries = early[0];
  _pvFavLists = early[1];

  pvBuildEntryMap();
  _libCmtEntryMap["pv"] = _pvEntryMapPv;
  _pvCmtUser = _pvMe;
  renderProfile();
});

function _friendBtnHTML() {
  if (!_pvMe) {
    return '<a href="login.html" class="pv-friend-btn add">Sign in to Follow</a>';
  }
  const f = _pvFriendship;
  if (!f) {
    return '<button class="pv-friend-btn add" onclick="pvSendRequest()">+ Follow</button>';
  }
  if (f.status === 'accepted') {
    return '<button class="pv-friend-btn friends" onclick="pvUnfriend()" title="Click to unfriend">✓ Friends</button>'
      + _pvNotifyBtnHTML();
  }
  if (f.status === 'pending' && f.iRequested) {
    return '<button class="pv-friend-btn pending" onclick="pvCancelRequest()">Requested ✕</button>';
  }
  if (f.status === 'pending' && !f.iRequested) {
    return '<button class="pv-friend-btn accept" onclick="pvAccept()">Accept</button>'
            +'<button class="pv-friend-btn decline" onclick="pvDecline()">Decline</button>';
  }
  return '<button class="pv-friend-btn add" onclick="pvSendRequest()">+ Follow</button>';
}

/* Friend-activity notifications toggle — OFF by default. When on, you get
   a notification each time this friend starts watching something. */
function _pvNotifyBtnHTML() {
  return _pvNotifyOn
    ? '<button class="pv-friend-btn pv-notify on" onclick="pvToggleNotify()" title="Turn off notifications for this friend"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg> Notifications On</button>'
    : '<button class="pv-friend-btn pv-notify" onclick="pvToggleNotify()" title="Get notified when they start watching something"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13.73 21a2 2 0 0 1-3.46 0"/><path d="M18.63 13A17.9 17.9 0 0 1 18 8"/><path d="M6.26 6.26A5.86 5.86 0 0 0 6 8c0 7-3 9-3 9h14"/><path d="M18 8a6 6 0 0 0-9.33-5"/><line x1="1" y1="1" x2="23" y2="23"/></svg> Notify Me</button>';
}
async function pvToggleNotify() {
  const next = !_pvNotifyOn;
  try {
    const { error } = await sb.rpc('set_activity_subscription', { p_target: _pvUserId, p_on: next });
    if (error) throw error;
    _pvNotifyOn = next;
    document.getElementById('pvBtns').innerHTML = _friendBtnHTML();
    const name = (_pvProfile && (_pvProfile.display_name || _pvProfile.username)) || 'them';
    showToast(next ? `You'll be notified when ${name} starts something new.` : `Notifications off for ${name}.`);
  } catch (e) { console.error(e); showToast('Could not update notifications — try again.', 'err'); }
}


let _pvEntryMapPv = {};

function pvBuildEntryMap() {
  _pvEntryMapPv = Object.fromEntries(_pvEntries.map(function(e) { return [e.id, e]; }));
}


/* ── Favorite Sections (profile-view) ── */

document.addEventListener('keydown', function(e) {
  if (e.key !== 'Escape') return;
  if (document.getElementById('ratingFilterOverlay')?.classList.contains('open')) { closeRatingFilter(); return; }
  // Notes tab popups (these didn't close on Esc)
});
// Their title: Info · Ratings · Note in one popup (MSSViews, info-popup.js) — opens on
// Ratings once it's rated/watched, otherwise on Info. Add to Watchlist · Discover.
function pvOpenPopup(id) {
  const e = _pvEntryMapPv[id] || _pvEntries.find(function(en) { return en.id === id; });
  if (!e) return;
  const rated = e.status === 'completed' || e.status === 'ongoing' || liveScore(e) != null;
  MSSViews.open(e, { start: rated ? 'rate' : 'info', profile: _pvProfile || {} });
}


function pvTabSwitch(n) { var tabs=document.querySelectorAll(".prof-tab"); if(tabs[n]) pvTab(n,tabs[n]); var s=document.getElementById("pvTabsSelect"); if(s) s.value=n; }

function renderProfile() {
  var p = _pvProfile;
  if (!p) return;
  var un = p.username || _pvUsername || '';
  var st = computeStats(_pvEntries);
  var pst = computeProfileStats(_pvEntries);
  var esc = function(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');};

/* ── Profile stats (5 boxes) ── */
function computeProfileStats(entries) {
  var done = entries.filter(function(e){ return e.status === 'completed' || e.status === 'ongoing'; });
  var rated = done.filter(function(e){ return liveScore(e) != null; });
  var avgScore = rated.length
    ? (rated.reduce(function(s,e){ return s + Number(liveScore(e)); }, 0) / rated.length).toFixed(1)
    : null;
  var tvCount = done.filter(function(e){
    if (e.cat === 'tv') return true;
    if (e.cat === 'anime' || e.cat === 'cartoons') return (e.ratings && e.ratings._media_type) ? e.ratings._media_type !== 'movie' : true;
    return false;
  }).length;
  var movieCount = done.filter(function(e){
    if (e.cat === 'movies') return true;
    if (e.cat === 'anime' || e.cat === 'cartoons') return e.ratings && e.ratings._media_type === 'movie';
    return false;
  }).length;
  var totalEps = entries
    .filter(function(e){ return e.status !== 'queue' && e.cat !== 'movies' && !(e.ratings && e.ratings._media_type === 'movie'); })
    .reduce(function(sum,e){
      if (e.status === 'completed' || e.status === 'ongoing') return sum + (Number(e.total_eps) || Number(e.watched) || 0);
      return sum + (Number(e.watched) || 0);
    }, 0);
  var movieMins = done
    .filter(function(e){ return e.cat === 'movies' || (e.ratings && e.ratings._media_type === 'movie'); })
    .reduce(function(sum,e){ return sum + (Number(e.runtime_h)||0)*60 + (Number(e.runtime_m)||0); }, 0);
  var rtH = Math.floor(movieMins/60), rtM = movieMins%60;
  var runtime = movieMins ? (rtH ? rtH+'h '+rtM+'m' : rtM+'m') : null;
  return { avgScore: avgScore, tvCount: tvCount, movieCount: movieCount, totalEps: totalEps, runtime: runtime };
}

function _pvStatsBoxHTML() {
  var entries = _pvEntries || [];
  var profile = _pvProfile;
  var favLists = _pvFavLists;
  var watched = function(e){ return e.status==='completed'||e.status==='ongoing'; };
  var byCat = function(c){ return entries.filter(function(e){return e.cat===c;}); };
  var tv = byCat('tv'), movies = byCat('movies'), anime = byCat('anime'), cartoons = byCat('cartoons');
  var watchlist = entries.filter(function(e){return e.status==='queue'||e.status==='up_next';});
  var reviews = entries.filter(function(e){return e.notes && e.notes.trim();});

  var favIds = {};
  if (profile) {
    ['top_picks','fav_tv','fav_movies','fav_anime','fav_cartoons'].forEach(function(k){
      (Array.isArray(profile[k]) ? profile[k] : []).forEach(function(id){ favIds[id] = true; });
    });
  }
  var favoritesCount = Object.keys(favIds).length;
  var listsCount = Array.isArray(favLists) ? favLists.length : 0;

  var rows = [
    { label:'All Items',        value:entries.length },
    { label:'TV Shows',         value:tv.length },
    { label:'TV Shows Watched', value:tv.filter(watched).length },
    { label:'Movies',           value:movies.length },
    { label:'Movies Watched',   value:movies.filter(watched).length },
    { label:'Animes',           value:anime.length },
    { label:'Animes Watched',   value:anime.filter(watched).length },
    { label:'Cartoons',         value:cartoons.length },
    { label:'Cartoons Watched', value:cartoons.filter(watched).length },
    { label:'Watchlist',        value:watchlist.length },
    { label:'Lists',            value:listsCount },
    { label:'Reviews',          value:reviews.length },
  ];

  var chevronSvg = '<span class="stats-chevron"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></span>';
  return '<div class="stats-box fade-up" id="statsBoxPv">' + rows.map(function(r,i){
    return '<div class="stats-row"' + (i===0 ? ' onclick="toggleStatsBox(\'statsBoxPv\')"' : '') + '>'
      + '<span class="stats-label">' + r.label + '</span>'
      + '<span class="stats-value">' + r.value.toLocaleString() + (i===0 ? chevronSvg : '') + '</span>'
      + '</div>';
  }).join('') + '</div>';
}
function toggleStatsBox(id) {
  var box = document.getElementById(id);

}

function renderPvOverview() {
  var el = document.getElementById('pvOverviewContent');

/* ── Friend request actions ── */
async function pvSendRequest() {
  if (!_pvMe || !_pvProfile?.username) return;
  try {
    await sendFriendRequest(_pvMe.id, _pvProfile.username);
    showToast('Friend request sent!');
    // Refresh friendship status
    const friendships = await getFriendships(_pvMe.id);
    _pvFriendship = friendships.find(f => f.friendId === _pvUserId) || null;
    document.getElementById('pvBtns').innerHTML = _friendBtnHTML() ;
  } catch(e) { showToast(e.message || 'Error sending request', 'err'); }
}

async function pvCancelRequest() {
  if (!_pvFriendship) return;
  const ok = await showConfirm({ title:'Cancel request?', message:'Cancel your friend request to @' + (_pvProfile?.username||'') + '?', confirmText:'Cancel Request', iconName:'users' });
  if (!ok) return;
  await removeFriendship(_pvFriendship.id);
  _pvFriendship = null;
  document.getElementById('pvBtns').innerHTML = _friendBtnHTML() ;
  showToast('Request cancelled');
}

async function pvUnfriend() {
  if (!_pvFriendship) return;
  const ok = await showConfirm({ title:'Remove friend?', message:'Remove @' + (_pvProfile?.username||'') + ' from your friends?', confirmText:'Unfriend', iconName:'users' });
  if (!ok) return;
  await removeFriendship(_pvFriendship.id);
  _pvFriendship = null;
  document.getElementById('pvBtns').innerHTML = _friendBtnHTML() ;
  showToast('Removed from friends');
}

async function pvAccept() {
  if (!_pvFriendship) return;
  await respondFriendRequest(_pvFriendship.id, true);
  const friendships = await getFriendships(_pvMe.id);
  _pvFriendship = friendships.find(f => f.friendId === _pvUserId) || null;
  document.getElementById('pvBtns').innerHTML = _friendBtnHTML() ;
  showToast('Now friends with @' + (_pvProfile?.username||''));
}

async function pvDecline() {
  if (!_pvFriendship) return;
  await respondFriendRequest(_pvFriendship.id, false);
  _pvFriendship = null;
  document.getElementById('pvBtns').innerHTML = _friendBtnHTML() ;
  showToast('Request declined');
}

function _injectLibCommentsPopup(prefix) {
  var id = prefix+'LccOverlay';
  if (document.getElementById(id)) return;
  var el = document.createElement('div');
  el.className = 'lcc-overlay';
  el.id = id;
  el.innerHTML = '<div class="lcc-card" id="'+prefix+'LccCard">'    +'<div style="display:flex;align-items:flex-start;gap:16px;padding:20px;border-bottom:0.5px solid var(--border);flex-shrink:0;">'+'<div id="'+prefix+'LccPoster" style="width:56px;height:76px;flex-shrink:0;border-radius:var(--radius-sm);overflow:hidden;background:var(--bg-3);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);"></div>'+'<div style="flex:1;min-width:0;">'+'<div id="'+prefix+'LccName" style="font-family:var(--serif);font-size:18px;font-weight:500;line-height:1.2;margin-bottom:4px;color:var(--text);"></div>'+'<div id="'+prefix+'LccMeta" style="font-size:11px;color:var(--text-3);margin-bottom:6px;display:flex;flex-wrap:wrap;gap:4px;"></div>'+'<div id="'+prefix+'LccCount" style="font-size:12px;color:var(--olive-light);font-weight:500;display:none;"></div>'+'</div>'+'<button class="lcc-close" onclick="closeLibComments(\''+prefix+'\')">✕</button>'+'</div>'    +'<div class="lcc-list" id="'+prefix+'LccList"><div class="lcc-empty">Loading…</div></div>'    +'<div class="lcc-form"><input class="lcc-input" id="'+prefix+'LccInput" placeholder="Write a comment…" onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();postLibComment(\''+prefix+'\')}"><button class="lcc-send" onclick="postLibComment(\''+prefix+'\')">Send</button></div>'    +'</div>';
  el.addEventListener('click', function(e){if(e.target===el)closeLibComments(prefix);});
  document.body.appendChild(el);
}

function _libCcBtn(prefix, entryId) {
  var emap = prefix==='prof' ? '_profEntryMap' : '_pvEntryMapPv';
  return '<button class="cc-strip" style="margin-top:0;display:inline-flex;width:auto;align-self:flex-start;" '
    + 'onclick="event.stopPropagation();openLibComments(\'' + prefix + '\',\'' + entryId + '\',' + emap + ')">'
    + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:11px;height:11px;flex-shrink:0"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>' + ' <span>Comments</span></button>';
}
var _libCmtEntryId = {};
var _libCmtEntryMap = {};
var _libReplyFor = {};

function openLibComments(prefix, entryId, entryMap) {
  _injectLibCommentsPopup(prefix);
  _libCmtEntryId[prefix] = entryId;
  if (entryMap) _libCmtEntryMap[prefix] = entryMap;
  var e = _libCmtEntryMap[prefix] && _libCmtEntryMap[prefix][entryId];
  var nameEl = document.getElementById(prefix+'LccName');
  if (e && nameEl) nameEl.textContent = e.title;
  var posterEl = document.getElementById(prefix+'LccPoster');
  if (e && posterEl) posterEl.innerHTML = posterHTML(e,'big');
  var metaEl = document.getElementById(prefix+'LccMeta');
  if (e && metaEl) {
    var chips = [];
    if (CAT_META && CAT_META[e.cat] && CAT_META[e.cat].label) chips.push(CAT_META[e.cat].label);
    if (e.genres) e.genres.slice(0,3).forEach(function(g){chips.push(g);});
    metaEl.innerHTML = chips.map(function(m){
      return '<span style="background:var(--olive-faint);border:0.5px solid var(--border-olive);color:var(--olive-light);border-radius:12px;padding:1px 6px;font-size:9px;letter-spacing:.3px">'+m+'</span>';
    }).join('');
  }
  var inp = document.getElementById(prefix+'LccInput');
  if (inp) inp.value = '';
  loadLibComments(prefix, entryId);
  var ov = document.getElementById(prefix+'LccOverlay');
  if (ov) { ov.classList.add('open'); document.body.style.overflow = 'hidden'; }
}

function closeLibComments(prefix) {
  var ov = document.getElementById(prefix+'LccOverlay');
  if (!ov) return;
  ov.classList.remove('open');
  document.body.style.overflow = '';
  _libCmtEntryId[prefix] = null;
}

async function loadLibComments(prefix, entryId) {
  var body = document.getElementById(prefix+'LccList');
  var count = document.getElementById(prefix+'LccCount');
  if (!body) return;
  try {
    var comments = await getComments(entryId);
    var u = await getCurrentUser();
    var me = u && u.id;
    var esc = function(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');};
    if (!comments.length) {
      body.innerHTML = '<div class="lcc-empty">No comments yet — be the first!</div>';
      if (count) count.style.display = 'none';
      return;
    }
    var topC  = comments.filter(function(c){return !c.reply_to;});
    var repsC = comments.filter(function(c){return c.reply_to;});
    body.innerHTML = topC.map(function(c) {
      var uname = esc((c.profiles&&c.profiles.username)||'Unknown');
      var date  = new Date(c.created_at).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
      var reps  = repsC.filter(function(r){return r.reply_to===c.id;});
      var repHTML = reps.map(function(r){
        var runame = esc((r.profiles&&r.profiles.username)||'Unknown');
        var rdate  = new Date(r.created_at).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
        return '<div class="det-reply-item" id="lcm-'+r.id+'">'
          +'<div class="det-reply-author" style="color:var(--olive-light);">@'+runame+'</div>'
          +'<div class="det-reply-text">'+esc(r.content).replace(/(@[\w]+)/g,'<span style="color:var(--olive-light);font-weight:600">$1</span>')+'</div>'
          +'<div class="det-reply-meta"><span>'+rdate+'</span>'
          +(r.author_id===me?'<button class="cc-del" onclick="deleteLibComment(\''+prefix+'\',\''+r.id+'\',\''+entryId+'\')">delete</button>':'')
          +'</div></div>';
      }).join('');
      return '<div class="lcc-comment" id="lcm-'+c.id+'">'
        
        +'<div class="lcc-comment-body">'
        +'<div class="lcc-author" style="color:var(--olive-light);">@'+uname+'</div>'
        +'<div class="lcc-text">'+esc(c.content)+'</div>'
        +'<div class="lcc-meta"><span>'+date+'</span>'
        +'<button class="det-comment-reply-btn" onclick="libReply(\''+prefix+'\',\''+c.id+'\',\''+uname+'\',\''+entryId+'\')">Reply</button>'
        +(c.author_id===me?'<button class="cc-del" onclick="deleteLibComment(\''+prefix+'\',\''+c.id+'\',\''+entryId+'\')">delete</button>':'')
        +'</div>'+repHTML+'<div id="lcrep-'+c.id+'"></div>'
        +'</div></div>';
    }).join('');
    if (count) { count.textContent = comments.length + ' comment' + (comments.length !== 1 ? 's' : ''); count.style.display = 'block'; }
  } catch(err) { showToast('Could not load comments.','err'); }
}

async function postLibComment(prefix) {
  var input = document.getElementById(prefix+'LccInput');
  var content = input && input.value.trim();
  var entryId = _libCmtEntryId[prefix];
  if (!content || !entryId) return;
  try {
    input.disabled = true;
    await addComment(entryId, content);
    input.value = '';
    await loadLibComments(prefix, entryId);
  } catch(err) { showToast('Could not post comment.','err'); }
  finally { if(input){input.disabled=false;input.focus();} }
}

async function deleteLibComment(prefix, commentId, entryId) {
  try {
    await deleteComment(commentId);
    await loadLibComments(prefix, entryId);
  } catch(err) { showToast('Could not delete.','err'); }
}

function libReply(prefix, commentId, username, entryId) {
  var prev = _libReplyFor[prefix];
  if (prev) { var pe=document.getElementById('lcrep-'+prev); if(pe) pe.innerHTML=''; }
  if (prev===commentId) { _libReplyFor[prefix]=null; return; }
  _libReplyFor[prefix] = commentId;
  var box = document.getElementById('lcrep-'+commentId);
  if (!box) return;
  box.innerHTML = '<div class="det-reply-form">'
    +'<input class="det-reply-input" id="lri-'+commentId+'" value="@'+username+' " placeholder="Reply..."'
    +' onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();postLibReply(\''+prefix+'\',\''+entryId+'\',\''+commentId+'\')}">'
    +'<button class="det-reply-send" onclick="postLibReply(\''+prefix+'\',\''+entryId+'\',\''+commentId+'\')">Reply</button>'
    +'<button class="det-comment-del" onclick="document.getElementById(\'lcrep-'+commentId+'\').innerHTML=\'\';_libReplyFor[\''+prefix+'\']=null" style="margin-left:4px;">&#x2715;</button>'
    +'</div>';
  var ri = document.getElementById('lri-'+commentId);
  if (ri) ri.focus();
}

async function postLibReply(prefix, entryId, commentId) {
  var input = document.getElementById('lri-'+commentId);
  var content = input && input.value.trim();
  if (!content) return;
  input.disabled = true;
  try {
    await addComment(entryId, content, commentId);
    document.getElementById('lcrep-'+commentId).innerHTML = '';
    _libReplyFor[prefix] = null;
    await loadLibComments(prefix, entryId);
  } catch(err) { showToast('Could not post reply.','err'); if(input) input.disabled=false; }
}

var _pvFavLists = [];

function openInfoPopup(id) { pvOpenPopup(id); }
</script>
