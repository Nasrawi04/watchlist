<script>
let _pvMe = null, _pvMeProfile = null;
let _pvUserId = null, _pvUsername = null, _pvProfile = null;
let _pvEntries = [];
let _pvFollow = null;      // you and them (get_follow_state, 083): who follows who, counts, can you see their things
let _pvRel = 'none';       // none | follows_you | requested | following | friends
let _pvNotifyOn = false;   // am I subscribed to this friend's activity? (off by default)
let _pvMatch = null;       // your taste match with them (mssTasteMatch, config.js): the ring in their header

// Returning via browser back/forward can restore this page from the
// bfcache with stale data (e.g. an entry just added/edited elsewhere
// wouldn't show up here) instead of re-running this page's scripts.
window.addEventListener('pageshow', (event) => {
  if (event.persisted && mssDataChangedSince(window._mssPageAt)) location.reload();   // only if something changed since (config.js)
});

document.addEventListener('DOMContentLoaded', async () => {
  // Get target user — URL params first (survive refresh), then sessionStorage
  var urlParams = new URLSearchParams(window.location.search);
  // ?panel=…&id=… with no pid: an older panel address wrote the title's id over this page's — that id isn't theirs
  if (urlParams.get('panel') && !urlParams.get('pid') && urlParams.get('id')) {
    urlParams.delete('id'); urlParams.delete('panel');
    history.replaceState(history.state, '', location.pathname + (urlParams.toString() ? '?' + urlParams : '') + location.hash);
  }
  _pvUserId   = urlParams.get('id')  || sessionStorage.getItem('viewProfileId')  || null;
  _pvUsername = urlParams.get('u')   || sessionStorage.getItem('viewProfileUsername') || null;

  // Push into URL so page survives refresh
  if (_pvUserId || _pvUsername) {
    var _newUrl = new URL(window.location.href);
    if (_pvUserId   && !_newUrl.searchParams.get('id')) _newUrl.searchParams.set('id', _pvUserId);
    if (_pvUsername && !_newUrl.searchParams.get('u'))  _newUrl.searchParams.set('u',  _pvUsername);
    history.replaceState(null, '', _newUrl.toString());
  }
  // Clear sessionStorage now that URL has the params
  sessionStorage.removeItem('viewProfileId');
  sessionStorage.removeItem('viewProfileUsername');

  // Start loading the friend's profile + library while the nav is still
  // signing in — these don't depend on who's viewing.
  const profileP = _pvUserId || _pvUsername
    ? sb.from('profiles').select(MSS_PUBLIC_PROFILE).eq(_pvUserId ? 'id' : 'username', _pvUserId || _pvUsername).maybeSingle()
    : Promise.resolve({ data: null });
  const earlyP = _pvUserId ? Promise.all([
    getPublicEntries(_pvUserId),
    sb.from('favorite_lists').select('*').eq('user_id', _pvUserId).order('created_at', { ascending: true }).then(r => r.data || [], () => []),
  ]) : null;

  await initPageGuest(async (user, profile) => {
    _pvMe = user;
    _pvMeProfile = profile;
  });

  // Resolve profile — no link → broken link, no such person → profile not found (a malformed id too)
  const { data: found, error: pErr } = await profileP;
  if (pErr && pErr.code !== '22P02') { mssErrorPage(mssErrorKind(pErr), { error: pErr }); return; }
  _pvProfile = found || null;
  // asked before sign-in finished (a private account isn't visible signed out): ask again now that we know who you are
  if (!_pvProfile && _pvMe) {
    const { data: again } = await sb.from('profiles').select(MSS_PUBLIC_PROFILE).eq(_pvUserId ? 'id' : 'username', _pvUserId || _pvUsername).maybeSingle();
    _pvProfile = again || null;
  }
  if (!_pvProfile && _pvUsername && !_pvUserId) {    // an old link: they changed their username in the last 14 days
    const now = await mssUsernameNow(_pvUsername);
    if (now) {
      const { data: moved } = await sb.from('profiles').select(MSS_PUBLIC_PROFILE).eq('username', now).maybeSingle();
      _pvProfile = moved || null;
      if (moved) { _pvUsername = now; const u = new URL(location.href); u.searchParams.set('u', now); history.replaceState(null, '', u); }
    }
  }
  if (!_pvProfile) { mssErrorPage(_pvUserId || _pvUsername ? 'user' : 'badlink'); return; }
  if (!_pvUserId) _pvUserId = _pvProfile.id;
  // the address always carries their id (and current username), so Back / refresh find them again
  { const u = new URL(location.href); if (u.searchParams.get('id') !== _pvUserId || (_pvProfile.username && u.searchParams.get('u') !== _pvProfile.username)) { u.searchParams.set('id', _pvUserId); if (_pvProfile.username) u.searchParams.set('u', _pvProfile.username); history.replaceState(history.state, '', u); } }

  document.title = `${_pvProfile.display_name || _pvProfile.username} — MyScreenFolio`;

  // If viewing own profile, redirect to profile.html
  if (_pvMe && _pvUserId === _pvMe.id) {
    window.location.href = 'profile.html';
    return;
  }

  // Follow state, notify-me state, entries and lists — all at once
  const [follow, sub, early] = await Promise.all([
    getFollowState(_pvUserId).catch(() => null),
    _pvMe ? sb.from('activity_subscriptions').select('target_id').eq('subscriber_id', _pvMe.id).eq('target_id', _pvUserId).limit(1).then(r => r.data || [], () => []) : Promise.resolve([]),
    earlyP || Promise.all([
      getPublicEntries(_pvUserId),
      sb.from('favorite_lists').select('*').eq('user_id', _pvUserId).order('created_at', { ascending: true }).then(r => r.data || [], () => []),
    ]),
  ]);
  _pvFollow = follow || { i_follow: 'none', follows_me: 'none', is_private: !!_pvProfile.is_private, can_see: !_pvProfile.is_private, followers: null, following: null, friends: null };
  _pvRel = _pvMe ? followRelation(_pvFollow) : 'none';
  _pvNotifyOn = !!(_pvCanBell() && sub.length);
  _pvEntries = early[0];
  _pvFavLists = early[1];

  _pvCmtUser = _pvMe;
  renderProfile();
  var tab = parseInt(new URLSearchParams(location.search).get('tab'), 10);
  if (tab > 0 && tab <= 5) pvTab(tab);
  _libResume();
  // Signed in and able to see their titles: how your tastes line up — your own titles, quietly, then the ring in their header
  if (_pvMe && _pvCanSeeDrawn) {
    getEntries(_pvMe.id).then(mine => {
      _pvMatch = mssTasteMatch(mine, _pvEntries);
      MSSProfile.refreshStats({ match: _pvMatchOf() });
    }).catch(() => {});
  }
});

/* Blocking (098): the Block row sits with Report; a blocked person's page offers Unblock instead of Follow */
let _pvBlocked = false;
async function _pvLoadBlocked() {
  if (!window._navUser || !_pvUserId || _pvUserId === window._navUser.id) return;
  const { data } = await sb.from('user_blocks').select('blocked_id').eq('blocker_id', window._navUser.id).eq('blocked_id', _pvUserId).maybeSingle();
  if (!!data === _pvBlocked) return;
  _pvBlocked = !!data;
  _pvPaintBtns();
}
async function pvBlock() {
  const un = (_pvProfile && _pvProfile.username) || 'them';
  const ok = await showConfirm({ title: `Block @${un}?`, message: 'You’ll stop following each other, and neither of you can follow or message the other. They aren’t told.', confirmText: 'Block', iconName: 'x' });
  if (!ok) return;
  try { await blockUser(_pvUserId); showToast(`@${un} blocked`); location.reload(); }
  catch (err) { showToast(err?.hint || 'Couldn’t block them — try again.', 'err'); }
}
async function pvUnblock() {
  try { await unblockUser(_pvUserId); showToast('Unblocked'); location.reload(); }
  catch (err) { showToast(err?.hint || 'Couldn’t unblock them — try again.', 'err'); }
}
/* The actions (Profiles V2): they change with who's looking, the layout doesn't (profile-v2.js).
   Visitor (signed out): Follow (asks them to sign up first) · Share. Signed in: Follow / Following · Share · ⋯.
   Friends: Friends ▾ (compare, unfollow, remove follower) · notifications · Message · ⋯ (share, report, block). */
function _friendBtnHTML() {
  var un = (_pvProfile && _pvProfile.username) || '';
  var share = '<button type="button" class="tv-btn" onclick="pvShare()" aria-label="Share this profile">' + icon('share', 15) + '<span class="tv-btn-label">Share</span></button>';
  var more = '<button type="button" class="tv-btn is-icon" onclick="pvMore(this)" aria-label="More actions" aria-haspopup="menu" data-top-more>' + icon('moreV', 16) + '</button>';
  if (!_pvMe) return '<button type="button" class="tv-btn is-main" onclick="mssJoin(\x27follow people\x27)">' + icon('plus', 15) + ' Follow</button>' + share;
  if (_pvBlocked) return '<button type="button" class="tv-btn" onclick="pvUnblock()">Unblock</button>' + more;
  var rel = _pvRel;
  if (rel === 'friends') {
    var bell = _pvCanBell() ? '<button type="button" class="tv-btn is-icon' + (_pvNotifyOn ? ' is-on' : '') + '" onclick="pvToggleNotify()" aria-pressed="' + _pvNotifyOn + '" aria-label="' + (_pvNotifyOn ? 'Notifications on — turn off' : 'Get notified about what they watch') + '" title="' + (_pvNotifyOn ? 'Notifications on' : 'Notify me') + '">' + icon('bell', 16) + '</button>' : '';
    return '<button type="button" class="tv-btn is-main" onclick="pvFriendMenu(this)" aria-haspopup="menu">' + icon('users', 15) + ' Friends ' + icon('chevdown', 13) + '</button>'
      + bell + '<a class="tv-btn is-icon" href="messages.html?with=' + encodeURIComponent(_pvUserId) + '" aria-label="Message @' + escHTML(un) + '" title="Message">' + icon('send', 16) + '</a>' + more;
  }
  var main = '<button type="button" class="tv-btn' + (rel === 'none' || rel === 'follows_you' ? ' is-main' : '') + '" onclick="pvFollowTap()"'
    + (rel === 'following' ? ' title="Tap to unfollow"' : rel === 'requested' ? ' title="Tap to cancel your request"' : '') + '>'
    + (rel === 'none' || rel === 'follows_you' ? icon('plus', 15) + ' ' : '') + MSSFollow.btnLabel(rel) + (rel === 'requested' ? ' ✕' : '') + '</button>';
  var bell2 = _pvCanBell() ? '<button type="button" class="tv-btn is-icon' + (_pvNotifyOn ? ' is-on' : '') + '" onclick="pvToggleNotify()" aria-pressed="' + _pvNotifyOn + '" aria-label="Notifications for them">' + icon('bell', 16) + '</button>' : '';
  return main + bell2 + share + more;
}
// They asked to follow you (your account is private): let them in, or not — a strip under the banner
function _pvAskHTML() {
  if (!_pvMe || !_pvFollow || _pvFollow.follows_me !== 'pending') return '';
  return '<div class="pf-ask" id="pfAsk" role="region" aria-label="Follow request"><span>' + icon('users', 14) + ' @' + escHTML((_pvProfile && _pvProfile.username) || '') + ' wants to follow you</span>'
    + '<button type="button" class="tv-btn is-main" onclick="pvRespond(true)">Accept</button><button type="button" class="tv-btn" onclick="pvRespond(false)">Decline</button></div>';
}
function _pvPaintBtns() {
  var b = document.getElementById('pfActs'); if (b) b.innerHTML = _friendBtnHTML();
  var ask = document.getElementById('pfAsk'), html = _pvAskHTML();
  if (ask) { if (html) ask.outerHTML = html; else ask.remove(); }
  else if (html) { var hero = document.getElementById('pfHero'); if (hero) hero.insertAdjacentHTML('afterend', html); }
}
function pvShare() {
  var url = location.href.substring(0, location.href.lastIndexOf('/') + 1) + 'profile-view.html?u=' + encodeURIComponent((_pvProfile && _pvProfile.username) || '');
  if (navigator.share) { navigator.share({ title: 'MyScreenFolio — @' + ((_pvProfile && _pvProfile.username) || ''), url: url }).catch(function(){}); return; }
  navigator.clipboard && navigator.clipboard.writeText(url).then(function(){ showToast('Link copied'); });
}
// Friends ▾ — the friend menu
function pvFriendMenu(btn) {
  var un = (_pvProfile && _pvProfile.username) || '', f = _pvFollow || {};
  mssLoadScript('js/panel.js').then(function() {
    var items = [{ label: 'Compare your tastes', icon: 'compare', onSelect: function(){ location.href = 'compare.html?with=' + encodeURIComponent(_pvUserId); } },
      { label: 'Unfollow @' + un, sub: 'You stop being friends', icon: 'x', onSelect: pvFollowTap }];
    if (f.follows_me === 'accepted') items.push({ label: 'Remove from your followers', sub: 'They aren’t told', icon: 'users', onSelect: pvRemoveFollower });
    MSSPopover.open(btn, { title: 'Friends', subtitle: 'You follow each other', label: 'Friend options', align: 'start', items: items });
  });
}
// ⋯ — more actions: share, remove follower, report, block
function pvMore(btn) {
  var un = (_pvProfile && _pvProfile.username) || '', f = _pvFollow || {};
  mssLoadScript('js/panel.js').then(function() {
    var items = [{ label: 'Share profile', icon: 'share', onSelect: pvShare }];
    if (f.follows_me === 'accepted' && _pvRel !== 'friends') items.push({ label: 'Remove from your followers', sub: 'They aren’t told', icon: 'users', onSelect: pvRemoveFollower });
    items.push({ divider: true });
    items.push({ label: 'Report @' + un, icon: 'flag', danger: true, onSelect: function(){ mssReport('user', _pvUserId, { what: '@' + un }); } });
    if (!_pvBlocked) items.push({ label: 'Block @' + un, sub: 'Neither of you can follow or message the other', icon: 'ban', danger: true, onSelect: pvBlock });
    MSSPopover.open(btn, { title: '@' + un, label: 'More actions', items: items });
  });
}

/* Friend-activity notifications toggle — OFF by default. When on, you're
   notified the moment this friend starts, watches an episode of or finishes
   something, writes a note or makes a list (022 / 047). */
// for the header's ring (profile-v2.js): null until it's worked out; pct null = not enough titles you've both rated yet
function _pvMatchOf() {
  return _pvMatch ? { pct: _pvMatch.pct, rated: _pvMatch.rated.length, href: 'compare.html?with=' + encodeURIComponent(_pvUserId) } : null;
}
// The bell: anyone you follow — when their notification setting includes you (084)
function _pvCanBell() {
  return (_pvRel === 'following' || _pvRel === 'friends') && !!(_pvFollow && _pvFollow.notify_ok !== false);
}
async function pvToggleNotify() {
  const next = !_pvNotifyOn;
  try {
    const { error } = await sb.rpc('set_activity_subscription', { p_target: _pvUserId, p_on: next });
    if (error) throw error;
    _pvNotifyOn = next;
    _pvPaintBtns();
    const name = (_pvProfile && (_pvProfile.display_name || _pvProfile.username)) || 'them';
    showToast(next ? `You'll be notified when ${name} starts, watches or finishes something.` : `Notifications off for ${name}.`);
  } catch (e) { console.error(e); showToast('Could not update notifications — try again.', 'err'); }
}






// Their title: its panel / page, read-only (MSSViews, title-view.js) — opens on
// Ratings once it's rated/watched, otherwise on Info. Add to Watchlist · Discover.


// While the profile loads: the same header, tabs and Overview with sample text, masked into placeholders
mssSkeleton.define('pvprofile', function() {
  var tab = +new URLSearchParams(location.search).get('tab') || 0;
  var tabs = _pvTabsHTML(tab).replace(/class="tv-tab( is-on)?"/g, 'class="tv-tab$1" data-skel-keep');   // tabs stay as they are
  var btns = '<button class="tv-btn is-main">' + icon('check', 16) + ' Following</button><button class="tv-btn">Share</button>';
  return ('<div class="tv-page tp-page pf-tp' + (matchMedia('(max-width: 767px)').matches ? ' is-phone' : '') + '">' + MSSProfile.headSkel(btns) + tabs
    + '<div class="prof-panel active">' + (tab ? mssSkeleton('grid') : mssSkeleton('overview')) + '</div></div>').replace(/ id="[^"]*"/g, '');
});

// The tab bar — the title page's (also drawn in the loading skeleton); counts once their titles are in
function _pvTabsHTML(active, n) {
  n = n || {};
  return MSSProfile.tabsHTML([[0, 'Overview', ''], [1, 'Library', n[1] || ''], [2, 'Lists', n[2] || ''], [3, 'Notes', n[3] || ''], [4, 'Episodes', ''], [5, 'Showcase', '']],
    active || 0, ((_pvProfile && (_pvProfile.display_name || _pvProfile.username)) || 'Their') + '’s profile');
}
function renderProfile() {
  var p = _pvProfile;
  if (!p) return;
  var un = p.username || _pvUsername || '';
  _pvLoadBlocked().catch(() => {});
  var locked = !!(_pvFollow && !_pvFollow.can_see);
  var lists = (_pvFavLists || []).filter(function(l){ return l.cat === 'custom'; }).length;
  // A visitor (signed out): a bar inviting them in, above the profile
  var join = _pvMe ? '' : '<div class="pf-join"><div class="pf-join-t"><b>Track, rate and rank everything you watch</b><span>Make your own folio on MyScreenFolio — it’s free.</span></div><a href="login.html#signup">Sign up free</a></div>';
  var notes = _pvEntries.filter(function(e){ return e.notes && String(e.notes).trim(); }).length;
  var panel = function(n, inner) { return '<div class="prof-panel' + (n ? '' : ' active') + '" id="pfPanel-' + n + '" role="tabpanel" aria-labelledby="pfTab-' + n + '" tabindex="-1">' + inner + '</div>'; };
  // a title page for a person (profile-v2.js): the header, the title page's tab bar, the tabs
  document.getElementById('pvContent').innerHTML = join + '<div class="tv-page de-page tp-page pf-tp" id="pfPage"><div class="de-cap" aria-hidden="true"></div><div id="pfHeadBox"></div>'
    + (locked ? '' : _pvTabsHTML(0, { 1: _pvEntries.length, 2: lists, 3: notes })
      + panel(0, '<div id="pvOverviewContent"><div class="page-loading"><div class="spinner"></div></div></div>')
      + panel(1, '<div id="libraryLoading"><div class="page-loading"><div class="spinner"></div></div></div><div id="libraryContent" style="display:none"></div>')
      + panel(2, '<div id="pvListsContent"></div>')
      + panel(3, '<div id="pvNotesContent"></div>')
      + panel(4, '<div id="pvEpisodesContent"></div>')
      + panel(5, '<div id="pvShowcase"><div class="page-loading"><div class="spinner"></div></div></div>'))
    + '</div>';
  // The shared header (profile-v2.js): only the actions and the taste match differ from your own profile
  MSSProfile.header(document.getElementById('pfHeadBox'), {
    profile: p, entries: _pvEntries, own: false, locked: locked,
    actions: _friendBtnHTML(), ask: _pvAskHTML(), counts: _pvCountsHTML(),
    match: _pvMatchOf(), lists: lists, diary: null,
  });
  MSSProfile.page(document.getElementById('pfPage'), { onTab: function(k, byPerson) { pvTab(+k, byPerson); } });
  _pvCanSeeDrawn = !locked;
  // A private account you don't follow: just who they are, and a way in
  if (locked) {
    document.getElementById('pfHeadBox').insertAdjacentHTML('beforeend', '<div class="pv-locked pf-locked fade-up">'
      + '<span class="pv-locked-ic">' + icon('lock', 26) + '</span>'
      + '<div class="pv-locked-title">This account is private</div>'
      + '<div class="pv-locked-text">' + (_pvRel === 'requested' ? 'Your request is waiting — once @' + escHTML(un) + ' accepts, their titles, ratings, lists and notes show here.'
          : 'Follow @' + escHTML(un) + ' to see their titles, ratings, lists and notes. They’ll get a request to let you in.') + '</div></div>');
    return;
  }
  // Diary watches: only the number (127 get_profile_diary_count), when you can see them
  sb.rpc('get_profile_diary_count', { p_user: _pvUserId }).then(function(r){ if (r && !r.error && r.data != null) MSSProfile.refreshStats({ diary: r.data }); }, function(){});
  renderPvOverview();
}

// A tab (the title page's tab bar): its panel, its content, the address remembers it
function pvTab(n, byPerson) {
  var panel = document.getElementById('pfPanel-' + n); if (!panel) return;
  document.querySelectorAll('#pfPage .prof-panel').forEach(function(p){ p.classList.toggle('active', p === panel); });
  MSSProfile.setTab(n, byPerson);
  if (n === 1) { renderLibrary(); }
  // Keep the tab in the URL — Back / refresh come back to it (not Overview)
  var u = new URL(location.href);
  if (n) u.searchParams.set('tab', n); else u.searchParams.delete('tab');
  history.replaceState(history.state, '', u.toString());
  // Lists + Notes: the Personal sections of the Notes / Lists pages, read-only (profile-tabs.js)
  var tabOpts = { userId: _pvUserId, entries: _pvEntries, owner: !!(_pvMe && _pvMe.id === _pvUserId), name: (_pvProfile && (_pvProfile.display_name || _pvProfile.username)) || '' };
  if (n === 2) MSSTabs.lists(document.getElementById('pvListsContent'), tabOpts);
  if (n === 3) MSSTabs.notes(document.getElementById('pvNotesContent'), tabOpts);
  if (n === 4) MSSTabs.episodes(document.getElementById('pvEpisodesContent'), tabOpts);
  if (n === 5) MSSShowcase.mount(document.getElementById('pvShowcase'), _pvProfile && _pvProfile.id, { own: !!(_pvMe && _pvProfile && _pvMe.id === _pvProfile.id), name: (_pvProfile && (_pvProfile.display_name || _pvProfile.username)) || '' });
}

// Overview: their Top Favorites, Top 5 by category and the side column, read-only (profile-v2.js)
function renderPvOverview() {
  var el = document.getElementById('pvOverviewContent');
  if (!el) return;
  if (!_pvEntries || !_pvEntries.length) {
    el.innerHTML = mssEmpty({ art: 'person', title: 'Nothing here yet', text: 'Their folio is still a blank page. Give it time.' });
    return;
  }
  MSSProfile.overview(el, {
    entries: _pvEntries, profile: _pvProfile || {}, editable: false, user: _pvUserId,
    openEntry: _libOpen,
    save: function(){ return Promise.resolve(); }
  });
}

/* ── Tab 1: Library — the same Library as library.html / your profile
   (js/library-view.js), read-only. Its cards open this page's popups. ── */

/* ── Follow / unfollow, and answering their request (083) ── */
async function pvFollowTap() {
  if (!_pvMe) return;
  var before = _pvRel;
  try {
    var r = await MSSFollow.tap(_pvUserId, before, { username: _pvProfile && _pvProfile.username });
    if (r == null) return;
    await pvRefreshFollow();
    // Now able to see a private account's things (or not any more) → draw the page again
    if (_pvFollow.can_see !== _pvCanSeeDrawn) location.reload();
  } catch (e) { showToast((e && e.hint) || 'Something went wrong — try again.', 'err'); }
}
async function pvRemoveFollower() {
  var un = (_pvProfile && _pvProfile.username) || '';
  var ok = await showConfirm({ title: 'Remove this follower?', message: '@' + un + ' won’t be told. They stop following you' + (_pvRel === 'friends' ? ' — and you stop being friends (you still follow them).' : '.'), confirmText: 'Remove', iconName: 'users' });
  if (!ok) return;
  try { await removeFollower(_pvUserId); showToast('Removed from your followers'); await pvRefreshFollow(); }
  catch (e) { showToast('Something went wrong — try again.', 'err'); }
}
async function pvRespond(ok) {
  try {
    await respondFollowRequest(_pvUserId, ok);
    showToast(ok ? '@' + (_pvProfile && _pvProfile.username || '') + ' follows you now' : 'Request declined');
    await pvRefreshFollow();
  } catch (e) { showToast('Something went wrong — try again.', 'err'); }
}
async function pvRefreshFollow() {
  _pvFollow = await getFollowState(_pvUserId).catch(function(){ return _pvFollow; });
  _pvRel = followRelation(_pvFollow);
  _pvNotifyOn = !!(_pvCanBell() && _pvFollow && _pvFollow.notify_on);
  _pvPaintBtns();
  var c = document.getElementById('pfCounts'); if (c) c.innerHTML = _pvCountsHTML();
}
function _pvCountsHTML() {
  return MSSFollow.countsHTML(_pvFollow, _pvUserId, (_pvProfile && _pvProfile.username) || '', false);
}

var _pvFavLists = [];
var _pvCanSeeDrawn = true;
// Follows changed in the list popup (e.g. you followed them from their Followers) → buttons + counts
document.addEventListener('mss:follows-changed', function(){ if (_pvProfile) pvRefreshFollow(); });

</script>
