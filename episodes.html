<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1E5C26">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MyScreenScore">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Episodes — MyScreenScore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
/* ── Episodes page ── */
.eg-back { display:inline-flex; align-items:center; gap:6px; margin-bottom:1rem; font-size:13px; font-weight:600; color:var(--text-2); text-decoration:none; }
.eg-back:hover { color:var(--olive-light); }
/* show view header: backdrop image (no blur) with the poster overlapping it */
.eg-top { position:relative; height:clamp(240px, 36vw, 480px); margin:0 calc(-1 * var(--page-px, 24px)) 0; overflow:hidden; background:var(--bg-3); }
.eg-top-img { position:absolute; inset:0; background-size:cover; background-position:center 25%; }
.eg-top .eg-back { position:absolute; top:14px; left:var(--page-px, 24px); z-index:1; color:#fff; background:rgba(0,0,0,.4); padding:6px 12px; border-radius:20px; margin:0; }
.eg-top .eg-back:hover { color:#fff; background:rgba(0,0,0,.6); }
/* show view header */
/* the poster overlaps the bottom of the header image; the title block starts just below it */
.eg-head { --eg-overlap:clamp(70px, 9vw, 120px); display:flex; gap:22px; align-items:flex-start; margin:calc(-1 * var(--eg-overlap)) 0 1.5rem; position:relative; z-index:1; padding:0 4px; }
.eg-head-text { padding-top:calc(var(--eg-overlap) + 14px); min-width:0; }
.eg-head-poster { width:clamp(120px, 14vw, 180px); aspect-ratio:2/3; border-radius:var(--radius); overflow:hidden; flex-shrink:0; background:var(--bg-3); box-shadow:0 10px 26px rgba(0,0,0,.28); }
.eg-head-poster img { width:100%; height:100%; object-fit:cover; display:block; }
.eg-head-title { font-family:var(--serif); font-size:clamp(24px, 5vw, 38px); font-weight:600; line-height:1.1; color:var(--text); margin:4px 0; }
.eg-head-sub { font-size:13px; color:var(--text-3); }
.eg-controls { display:flex; flex-wrap:wrap; gap:14px 24px; align-items:flex-end; justify-content:center; margin:1.25rem 0 1.5rem; }
.eg-ctl { display:flex; flex-direction:column; align-items:center; gap:6px; }
.eg-ctl-label { font-family:var(--serif); font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--olive-light); }
.eg-controls .pn-toggle { margin:0; }
.eg-controls .pn-toggle-btn { padding:8px 14px; font-size:12.5px; }
.eg-layout { display:grid; grid-template-columns:minmax(0, 1fr) 260px; gap:20px; align-items:start; }
/* SeriesGraph grid */
.eg-grid-wrap { overflow-x:auto; padding-bottom:6px; scrollbar-width:thin; }
.eg-grid { border-collapse:separate; border-spacing:4px; margin:0 auto; }
.eg-grid th { font-family:var(--bebas); font-weight:400; font-size:15px; letter-spacing:.6px; color:var(--text-3); padding:2px 4px; text-align:center; }
.eg-grid th.eg-ep { position:sticky; left:0; background:var(--bg); z-index:1; text-align:right; padding-right:8px; }
.eg-cell { width:44px; height:44px; border-radius:7px; padding:0; border:none; cursor:pointer; font-family:var(--bebas); font-size:17px; letter-spacing:.3px; display:flex; align-items:center; justify-content:center; transition:transform .12s; }
.eg-cell:hover { transform:scale(1.08); }
.eg-cell:focus-visible { outline:2px solid var(--text); outline-offset:2px; }
.eg-cell.eg-empty { background:transparent; border:1.5px dashed var(--border-2); color:var(--text-3); }
.eg-cell.eg-unaired { background:repeating-linear-gradient(45deg, var(--bg-3) 0 4px, transparent 4px 8px); color:transparent; cursor:default; }
.eg-cell.eg-best { box-shadow:0 0 0 2.5px #c9a227; }
.eg-cell.eg-worst { box-shadow:0 0 0 2px var(--band-bad); }
.eg-cell.eg-diff-up { background:#2f6e3a; color:#fff; } .eg-cell.eg-diff-down { background:#a8433b; color:#fff; } .eg-cell.eg-diff-same { background:var(--bg-3); color:var(--text-2); }
.eg-avg td { padding-top:6px; }
.eg-avg .eg-cell { cursor:default; font-size:18px; box-shadow:inset 0 -3px 0 rgba(0,0,0,.18); }
.eg-legend { display:flex; flex-wrap:wrap; justify-content:center; gap:6px 14px; margin:14px auto 0; max-width:640px; font-size:11.5px; color:var(--text-2); }
.eg-legend span { display:inline-flex; align-items:center; gap:6px; }
.eg-legend i { width:14px; height:14px; border-radius:3px; display:inline-block; }
.eg-legend i.eg-unaired-sw { background:repeating-linear-gradient(45deg, var(--bg-3) 0 3px, transparent 3px 6px); border:0.5px solid var(--border-2); }
/* graph */
.eg-graph { width:100%; height:auto; display:block; }
.eg-graph .eg-pt { cursor:pointer; }
/* list */
.eg-list { display:flex; flex-direction:column; gap:10px; }
.eg-row { display:flex; gap:14px; align-items:center; padding:12px; min-height:96px; background:var(--card); border:0.5px solid var(--border); border-radius:var(--radius); cursor:pointer; }
.eg-row:hover { border-color:var(--border-olive); }
.eg-row-still { width:150px; aspect-ratio:16/9; border-radius:var(--radius-sm); overflow:hidden; background:var(--bg-3); flex-shrink:0; }
.eg-row-still img { width:100%; height:100%; object-fit:cover; display:block; }
.eg-row-info { flex:1; min-width:0; }
.eg-row-title { font-family:var(--serif); font-size:15.5px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.eg-row-meta { font-size:12px; color:var(--text-3); margin-top:2px; }
.eg-row-desc { font-size:12.5px; color:var(--text-2); line-height:1.5; margin-top:4px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.eg-row-tags { display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; }
.eg-row-tags span { font-size:10.5px; font-weight:600; padding:2px 7px; border-radius:3px; background:var(--olive); color:#fff; }
.eg-chip { min-width:50px; padding:6px 8px; border-radius:6px; text-align:center; font-family:var(--bebas); font-size:19px; line-height:1; }
.eg-chip-empty { background:var(--olive-faint); color:var(--olive-light); border:0.5px solid var(--border-olive); }
.eg-chip small { display:block; font-family:'Manrope',var(--sans); font-size:8.5px; letter-spacing:1px; text-transform:uppercase; opacity:.85; margin-top:2px; }
/* stats panel */
.eg-panel { background:var(--card); border:0.5px solid var(--border); border-radius:var(--radius); padding:16px; position:sticky; top:calc(var(--page-pt, 80px) + 16px); }
.eg-panel-row { display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-top:0.5px solid var(--border); font-size:13px; color:var(--text-2); }
.eg-panel-row:first-of-type { border-top:none; }
.eg-panel-row b { font-family:var(--bebas); font-weight:400; font-size:19px; color:var(--olive-light); white-space:nowrap; }
.eg-panel-ep { cursor:pointer; text-align:right; }
.eg-panel-ep:hover b { color:var(--olive-light); }
/* episode popup */
#egEpOverlay { position:fixed; inset:0; z-index:904; background:var(--popup-backdrop); display:flex; align-items:center; justify-content:center; padding:16px; opacity:0; pointer-events:none; transition:opacity 200ms var(--ease); }
#egEpOverlay.open { opacity:1; pointer-events:auto; }
#egEpCard { width:100%; max-width:min(97vw, 560px); max-height:90dvh; overflow-y:auto; background:var(--bg-2); border:1.5px solid var(--olive-light); box-shadow:4px 4px 0 var(--olive); border-radius:var(--radius-lg); position:relative; }
.eg-pop-scores { display:grid; grid-template-columns:1.3fr 1fr 1fr; gap:8px; margin:14px 0; }
.eg-pop-score { border-radius:var(--radius); padding:10px; text-align:center; background:var(--olive-faint); border:0.5px solid var(--border-olive); color:var(--olive-light); }
.eg-pop-score[class*="ep-band-"] { border-color:transparent; }
.eg-pop-score b { display:block; font-family:var(--bebas); font-weight:400; font-size:34px; line-height:1; }
.eg-pop-score span { font-size:10px; letter-spacing:1.4px; text-transform:uppercase; opacity:.85; }
.eg-pop-over { font-size:13.5px; color:var(--text-2); line-height:1.6; }
.eg-pop-note { margin-top:10px; padding-left:12px; border-left:2px solid var(--olive-light); font-style:italic; color:var(--text); font-size:14px; }
.eg-tools { display:flex; gap:8px; align-items:flex-end; }
.eg-season-row th { font-size:12px; letter-spacing:1px; }
.eg-season-btn svg:last-child { margin-left:2px; opacity:.7; }
.eg-season-dialog { max-width:720px; }
.eg-season-all { display:inline-flex; align-items:center; gap:6px; margin-bottom:14px; padding:8px 14px; border-radius:var(--radius-sm); cursor:pointer; font-family:'Manrope',var(--sans); font-size:13px; font-weight:600; background:transparent; border:1px solid var(--border-2); color:var(--text-2); }
.eg-season-all.on { background:var(--olive); border-color:var(--olive); color:#fff; }
.eg-season-all svg { display:none; } .eg-season-all.on svg { display:inline; }
.eg-season-grid .td-season-block { width:clamp(110px, 18vw, 140px); }
.td-season-block-poster { position:relative; }
.eg-season-check { position:absolute; top:6px; right:6px; width:24px; height:24px; border-radius:50%; background:var(--olive); color:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,.3); }
.eg-cmp-bar { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin:1.25rem auto 1.5rem; max-width:860px; padding:14px 16px; border-radius:var(--radius); background:var(--olive-faint); border:0.5px solid var(--border-olive); }
.eg-cmp-bar-ic { width:40px; height:40px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; background:var(--olive); color:#fff; }
.eg-cmp-bar-text { flex:1; min-width:200px; display:flex; flex-direction:column; gap:2px; }
.eg-cmp-bar-text b { font-family:var(--serif); font-size:17px; font-weight:600; color:var(--text); }
.eg-cmp-bar-text small { font-size:12px; color:var(--text-3); }
.eg-cmp-bar-actions { display:flex; gap:8px; }
.eg-cmp-bar-actions a { text-decoration:none; }
.eg-cmp { display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:start; }
.eg-cmp-col { min-width:0; }
.eg-cmp-title { display:block; font-family:var(--serif); font-size:20px; font-weight:600; color:var(--text); text-decoration:none; margin-bottom:.5rem; }
.eg-cmp-title:hover { color:var(--olive-light); }
.eg-cmp-key { display:flex; gap:16px; font-size:12.5px; color:var(--text-2); margin:.4rem 0 .6rem; }
.eg-cmp-key i { display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
.eg-table-wrap { overflow-x:auto; margin-top:1rem; }
.eg-cmp-table { width:100%; border-collapse:collapse; font-size:13.5px; }
.eg-cmp-table th, .eg-cmp-table td { padding:10px 12px; border-bottom:0.5px solid var(--border); text-align:left; }
.eg-cmp-table th { font-family:var(--serif); font-size:13px; color:var(--text); }
.eg-cmp-table td:not(:first-child) { font-family:var(--bebas); font-size:18px; color:var(--text); }
.eg-cmp-table small { font-family:'Manrope',var(--sans); font-size:11px; color:var(--text-3); }
.eg-overlay { position:fixed; inset:0; z-index:906; background:var(--popup-backdrop); display:flex; align-items:center; justify-content:center; padding:16px; opacity:0; pointer-events:none; transition:opacity 200ms var(--ease); }
.eg-overlay.open { opacity:1; pointer-events:auto; }
.eg-dialog { width:100%; max-width:440px; max-height:90dvh; display:flex; flex-direction:column; background:var(--bg-2); border:1.5px solid var(--olive-light); box-shadow:4px 4px 0 var(--olive); border-radius:var(--radius-lg); }
.eg-dialog .sf-body { overflow-y:auto; }
.eg-pick-search { margin:0; }
.eg-pick-list { display:flex; flex-direction:column; gap:6px; margin-top:12px; }
.eg-pick { display:flex; gap:12px; align-items:center; padding:8px; border-radius:var(--radius-sm); text-decoration:none; color:var(--text); }
.eg-pick:hover { background:var(--bg-3); }
.eg-pick-poster { width:36px; aspect-ratio:2/3; border-radius:4px; overflow:hidden; background:var(--bg-3); flex-shrink:0; }
.eg-pick-poster img { width:100%; height:100%; object-fit:cover; display:block; }
.eg-pick-av { aspect-ratio:1; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--serif); color:var(--olive-light); }
.eg-pick b { display:block; font-size:14px; } .eg-pick small { font-size:12px; color:var(--text-3); }
.eg-ex-seg { width:100%; margin:0 0 1rem; } .eg-ex-seg .pn-toggle-btn { flex:1; padding:9px 6px; }
.eg-ex-hint { font-size:12.5px; color:var(--text-3); margin:0; }
@media(max-width:900px) { .eg-layout { grid-template-columns:1fr; } .eg-panel { position:static; } .eg-cmp { grid-template-columns:1fr; } }
@media(max-width:640px) {
  .eg-cell { width:36px; height:36px; font-size:15px; border-radius:6px; }
  .eg-grid { border-spacing:3px; }
  .eg-head { gap:14px; }
  .eg-head-title { font-size:24px; }
  .eg-ctl { width:100%; }
  .eg-row-still { width:88px; }
  .eg-controls .pn-toggle { width:100%; }
  .eg-controls .pn-toggle-btn { flex:1; padding:8px 6px; }
}
</style>

<body>
<div class="page-wrap" id="egPage">
  <div class="page-loading"><div class="spinner"></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/nav.js"></script>
<script src="js/episode-ratings.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════
   episodes.html — Episode Ratings
     episodes.html               your shows (mini heatmaps), search, stats
     episodes.html?show=<tmdb>   one show: SeriesGraph-style grid / graph /
                                 list · source: TMDB (default) · Mine ·
                                 Community (2+ ratings) · Mine vs TMDB
═══════════════════════════════════════════════════════════════ */
const esc = s => escHTML(s == null ? '' : String(s));
let _egUser = null;

const _egParams = new URLSearchParams(location.search);
const _egShowId = parseInt(_egParams.get('show'), 10) || null;
const _egVsId   = parseInt(_egParams.get('vs'), 10) || null;          // compare with another show
const _egUserQ  = _egParams.get('user') || null;                      // someone else's ratings (profile)
const _egVsUser = _egParams.get('vsUser') || null;                    // compare this show with a friend's ratings

const bandCls = v => v == null ? '' : 'ep-band-' + MSSEp.band(v).key;
const fmt = v => v == null ? '—' : Number(v).toFixed(1);
const avg = arr => { const v = arr.filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };

/* ══ Home: your shows (Watching · To Be Continued · Watched), 20 at a time ══ */
const HOME_STATUSES = ['watching', 'ongoing', 'completed'];
const PAGE = 20;
let _egHome = { list: [], by: {}, shown: PAGE };
async function renderHome() {
  const page = document.getElementById('egPage');
  const { data: entries } = await sb.from('entries').select('id,title,cat,status,poster_url,tmdb_id,tmdb_type,ratings,updated_at')
    .eq('user_id', _egUser.id).not('tmdb_id', 'is', null).eq('tmdb_type', 'tv').in('status', HOME_STATUSES).order('updated_at', { ascending: false });
  const shows = (entries || []).filter(e => MSSEp.isShow(e) && HOME_STATUSES.includes(e.status));
  const ids = shows.map(e => e.id);
  const { data: ratings } = ids.length ? await sb.from('episode_ratings').select('entry_id,season_number,episode_number,score,updated_at').in('entry_id', ids) : { data: [] };
  const by = {};
  (ratings || []).forEach(r => (by[r.entry_id] = by[r.entry_id] || []).push(r));
  const latest = id => Math.max(0, ...(by[id] || []).map(r => +new Date(r.updated_at)));
  // shows you've rated first (most recent rating first), then the rest by last activity
  const list = shows.slice().sort((a, b) => (latest(b.id) - latest(a.id)) || (new Date(b.updated_at) - new Date(a.updated_at)));
  const epRows = (ratings || []).filter(r => r.episode_number > 0);
  const top = epRows.length ? epRows.reduce((a, b) => (Number(b.score) > Number(a.score) ? b : a)) : null;
  const topShow = top && shows.find(e => e.id === top.entry_id);
  _egHome = { list, by, shown: PAGE };
  page.innerHTML = `
    <div class="cat-page-header fade-up">
      <div>
        <h1 class="cat-page-title">Episodes</h1>
        <div class="cat-page-sub">Episode ratings for every show — yours, the community’s and TMDB’s</div>
      </div>
    </div>
    <div class="page-stats" style="margin-bottom:2rem;">
      <div class="page-stat"><div class="page-stat-num">${epRows.length}</div><div class="page-stat-label">Episodes rated</div></div>
      <div class="page-stat"><div class="page-stat-num">${Object.keys(by).length}</div><div class="page-stat-label">Shows rated</div></div>
      <div class="page-stat"><div class="page-stat-num">${epRows.length ? '★ ' + fmt(avg(epRows.map(r => Number(r.score)))) : '—'}</div><div class="page-stat-label">Your average</div></div>
      <div class="page-stat"><div class="page-stat-num">${top ? '★ ' + fmt(top.score) : '—'}</div><div class="page-stat-label">${top ? `Top: ${esc(topShow?.title || '')} S${top.season_number}·E${top.episode_number}` : 'Top episode'}</div></div>
    </div>
    <div class="eg-search">
      <div class="hero-search-wrap">
        <input type="text" id="egSearch" placeholder="Look up any show’s episode ratings…" autocomplete="off" aria-label="Search shows">
        <button type="button" class="hero-search-btn" tabindex="-1" onclick="document.getElementById('egSearch').focus()">${icon('search', 16)}<span>Search</span></button>
      </div>
      <div class="eg-search-results" id="egSearchResults"></div>
    </div>
    <div id="egHomeShows">${list.length ? '' : `<div class="mss-empty">Shows you’re watching, waiting on or have watched appear here. Search above to see any show’s episode ratings.</div>`}</div>`;
  drawHomeShows();
  let t = null;
  document.getElementById('egSearch').addEventListener('input', ev => {
    clearTimeout(t);
    const q = ev.target.value.trim();
    t = setTimeout(async () => {
      const box = document.getElementById('egSearchResults');
      document.getElementById('egHomeShows').hidden = q.length >= 2;
      if (q.length < 2) { box.innerHTML = ''; return; }
      try {
        // Searching covers every show — including ones not in your Watching / To Be Continued / Watched
        const res = await tmdbFetch(`${TMDB_BASE}/search/tv?api_key=${TMDB_KEY}&language=en-US&query=${encodeURIComponent(q)}`);
        const results = res.ok ? ((await res.json()).results || []).filter(r => r.poster_path).slice(0, 16) : [];
        box.innerHTML = results.map(r => `<a class="q-card" href="episodes.html?show=${r.id}" style="text-decoration:none;color:inherit">
          <div class="q-poster"><img src="${TMDB_IMG}${r.poster_path}" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover"></div>
          <div class="q-info"><div class="title-year-row"><div class="q-title" style="margin-bottom:0">${esc(r.name)}</div><span class="title-year-inline">${esc((r.first_air_date || '').slice(0, 4))}</span></div>
          ${r.vote_average ? `<div class="home-tmdb-meta-row"><span class="home-tmdb-score">★ ${(Math.floor(r.vote_average * 10) / 10).toFixed(1)}</span></div>` : ''}</div></a>`).join('') || `<div class="mss-empty">No shows match “${esc(q)}”.</div>`;
      } catch { box.innerHTML = ''; }
    }, 300);
  });
}
function drawHomeShows() {
  const { list, by, shown } = _egHome, box = document.getElementById('egHomeShows');
  if (!list.length) return;
  box.innerHTML = `<div class="section-eyebrow">Watching · To Be Continued · Watched</div><div class="section-title">Your shows</div>
    <div class="eg-shows">${list.slice(0, shown).map(e => MSSEp.showCardHTML(e, by[e.id] || [])).join('')}</div>
    ${list.length > shown ? `<div class="eg-more"><button type="button" class="dp-more" onclick="_egHome.shown += PAGE; drawHomeShows()">Show more <span>(${list.length - shown} left)</span></button></div>` : ''}`;
}

/* ══ One show ══ */
const blankState = () => ({ show: null, seasons: [], eps: {}, mine: {}, comm: {}, entry: null, source: 'tmdb', view: 'grid', readOnly: false, whoName: '' });
let S = blankState();
const key = (s, n) => `${s}:${n}`;
const withS = (state, fn) => { const prev = S; S = state; try { return fn(); } finally { S = prev; } };
function scoreOf(s, ep) {
  const k = key(s, ep.n);
  if (S.source === 'tmdb') return ep.vote ? Math.round(ep.vote * 10) / 10 : null;
  if (S.source === 'mine') return S.mine[k] ? Number(S.mine[k].score) : null;
  if (S.source === 'community') return S.comm[k] ? Number(S.comm[k].avg_score) : null;
  return S.mine[k] && ep.vote ? Math.round((Number(S.mine[k].score) - ep.vote) * 10) / 10 : null;   // mine vs tmdb
}
// Season score (whole-season ratings: episode_number 0; TMDB's season score)
function seasonScore(sn) {
  const t = (S.show.seasons || []).find(x => x.season_number === sn)?.vote_average || null;
  const tm = t ? Math.round(t * 10) / 10 : null, mine = S.mine[key(sn, 0)] ? Number(S.mine[key(sn, 0)].score) : null;
  if (S.source === 'tmdb') return tm;
  if (S.source === 'mine') return mine;
  if (S.source === 'community') return S.comm[key(sn, 0)] ? Number(S.comm[key(sn, 0)].avg_score) : null;
  return mine != null && tm != null ? Math.round((mine - tm) * 10) / 10 : null;
}
const aired = ep => ep.air && new Date(ep.air) <= new Date();

const vis = () => (S.sel && S.sel.size && !S2) ? S.seasons.filter(sn => S.sel.has(sn)) : S.seasons;
const selLabel = () => {
  const v = vis();
  if (!S.sel || !S.sel.size || v.length === S.seasons.length) return 'All seasons';
  if (v.length === 1) return 'Season ' + v[0];
  const contiguous = v.every((x, i) => i === 0 || x === v[i - 1] + 1);
  return contiguous ? `Seasons ${v[0]}–${v[v.length - 1]}` : `${v.length} seasons`;
};

async function loadState(tmdbId, userId) {
  const X = blankState();
  const res = await tmdbFetch(`${TMDB_BASE}/tv/${tmdbId}?api_key=${TMDB_KEY}&language=en-US`);
  if (!res.ok) return null;
  X.show = await res.json();
  X.seasons = (X.show.seasons || []).filter(x => x.season_number > 0 && x.episode_count > 0).map(x => x.season_number);
  for (let i = 0; i < X.seasons.length; i += 4) {                 // TMDB episodes, 4 seasons at a time (cached)
    const chunk = X.seasons.slice(i, i + 4);
    const lists = await Promise.all(chunk.map(sn => MSSEp.seasonEpisodes(tmdbId, sn)));
    chunk.forEach((sn, j) => { X.eps[sn] = lists[j]; });
  }
  const { data: entry } = await sb.from('entries').select('*').eq('user_id', userId).eq('tmdb_id', tmdbId).eq('tmdb_type', 'tv').limit(1).maybeSingle();
  X.entry = entry || null;
  X.readOnly = userId !== _egUser.id;
  if (X.entry) {
    const { data } = await sb.from('episode_ratings').select('*').eq('entry_id', X.entry.id);
    (data || []).forEach(r => { X.mine[key(r.season_number, r.episode_number)] = r; });
  }
  try {
    const { data: comm } = await sb.rpc('get_episode_community', { p_tmdb_id: tmdbId });
    (comm || []).forEach(r => { X.comm[key(r.season_number, r.episode_number)] = r; });
  } catch {}
  return X;
}

    if (file === 'title.html') return { href: file + r.search, label: 'Back to title' };

function allScored() {

  vis().forEach(sn => (S.eps[sn] || []).forEach(ep => { const v = scoreOf(sn, ep); if (v != null) out.push({ s: sn, ep, v }); }));

}
function cellHTML(sn, ep, extra = '') {
  if (!aired(ep) && !S.mine[key(sn, ep.n)]) return `<div class="eg-cell eg-unaired" title="Not aired yet" aria-label="Season ${sn} episode ${ep.n}, not aired yet"></div>`;
  const v = scoreOf(sn, ep);
  const label = `Season ${sn}, Episode ${ep.n}${ep.name ? ' — ' + ep.name : ''}: ${v == null ? 'not rated' : (S.source === 'diff' ? (v > 0 ? '+' : '') + v.toFixed(1) + ' vs TMDB' : v.toFixed(1) + ', ' + MSSEp.band(v).name)}`;

  if (v == null) { cls += 'eg-empty'; txt = '·'; }
  else if (S.source === 'diff') { cls += Math.abs(v) < 0.3 ? 'eg-diff-same' : v > 0 ? 'eg-diff-up' : 'eg-diff-down'; txt = (v > 0 ? '+' : '') + v.toFixed(1); }
  else { cls += bandCls(v); txt = v.toFixed(1); }
  return `<button type="button" class="${cls}${extra}" onclick="egOpen(${sn},${ep.n})" title="${esc(label)}" aria-label="${esc(label)}">${txt}</button>`;
}

      <thead><tr><th class="eg-ep"></th>${vis().map(sn => `<th scope="col">S${sn}</th>`).join('')}</tr></thead>

function graphHTML() {
  const pts = []; let i = 0;
  vis().forEach((sn, si) => (S.eps[sn] || []).forEach(ep => { i++; const v = scoreOf(sn, ep); if (v != null) pts.push({ x: i, v, s: sn, n: ep.n, si }); }));
  if (!pts.length) return `<div class="mss-empty">Nothing to plot for this source yet.</div>`;
  const W = 900, H = 340, L = 34, R = 10, T = 12, B = 28, total = i;
  const diff = S.source === 'diff', lo = diff ? -3 : 1, hi = diff ? 3 : 10;
  const X = x => L + (total <= 1 ? 0 : (x - 1) / (total - 1)) * (W - L - R);
  const Y = v => T + (1 - (Math.max(lo, Math.min(hi, v)) - lo) / (hi - lo)) * (H - T - B);
  const stripes = diff ? '' : MSSEp.BANDS.map((b, k) => {
    const top = k === 0 ? 10 : MSSEp.BANDS[k - 1].min, bot = Math.max(1, b.min);
    return `<rect x="${L}" y="${Y(top)}" width="${W - L - R}" height="${Y(bot) - Y(top)}" class="ep-band-${b.key}" style="opacity:.12" fill="currentColor"></rect>`;
  }).join('');
  // dots and line segments take the colour of their band (as in the grid)
  const col = v => diff ? (Math.abs(v) < 0.3 ? 'var(--text-3)' : v > 0 ? '#2f6e3a' : '#a8433b') : `var(--band-${MSSEp.band(v).key})`;
  let lines = '';
  vis().forEach(sn => {
    const sp = pts.filter(p => p.s === sn);
    for (let k = 1; k < sp.length; k++) lines += `<line x1="${X(sp[k - 1].x)}" y1="${Y(sp[k - 1].v)}" x2="${X(sp[k].x)}" y2="${Y(sp[k].v)}" stroke="${col((sp[k - 1].v + sp[k].v) / 2)}" stroke-width="2.6" stroke-linecap="round"></line>`;
  });
  const dots = pts.map(p => `<circle class="eg-pt" cx="${X(p.x)}" cy="${Y(p.v)}" r="5" fill="${col(p.v)}" stroke="var(--bg)" stroke-width="1.5" onclick="egOpen(${p.s},${p.n})"><title>S${p.s} · E${p.n}: ${p.v.toFixed(1)}</title></circle>`).join('');
  const ticks = (diff ? [-3, -1.5, 0, 1.5, 3] : [2, 4, 6, 8, 10]).map(v => `<text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="var(--text-3)">${v}</text><line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--border)" stroke-width="0.5"></line>`).join('');
  const seasonLabels = vis().map(sn => { const sp = pts.filter(p => p.s === sn); if (!sp.length) return ''; return `<line x1="${X(sp[0].x) - 6}" x2="${X(sp[0].x) - 6}" y1="${T}" y2="${H - B}" stroke="var(--border-2)" stroke-dasharray="3 4"></line><text x="${X(sp[0].x)}" y="${H - 8}" font-size="11" font-weight="600" fill="var(--olive-light)">S${sn}</text>`; }).join('');
  return `<svg class="eg-graph" viewBox="0 0 ${W} ${H}" role="img" aria-label="Episode scores across the series">${stripes}${ticks}${lines}${dots}${seasonLabels}</svg>`;
}

function panelHTML() {

  const a = avg(sc.map(x => x.v));

  const seasonAvgs = vis().map(sn => ({ sn, a: avg((S.eps[sn] || []).map(ep => scoreOf(sn, ep))) })).filter(x => x.a != null);

async function egImage(btn) {

    const [W, H] = { square: [1080, 1080], story: [1080, 1920], wide: [1600, 900] }[EX.size];
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const U = Math.min(W, H);   // type + spacing scale with the short side (Wide stays balanced)

      im.onerror = () => { clearTimeout(t); ok(null); };

      if (!src) return null;

          || tryLoad('https://wsrv.nl/?url=' + encodeURIComponent(src.replace(/^https?:\/\//, '')), true);

    const { data: who } = await sb.from('profiles').select('username,avatar_url').eq('id', whoId).maybeSingle();
    const [backdrop, poster, logo, avatar] = await Promise.all([
      load(S.show.backdrop_path ? `https://image.tmdb.org/t/p/w1280${S.show.backdrop_path}` : null),
      load(S.show.poster_path ? `https://image.tmdb.org/t/p/w342${S.show.poster_path}` : null),

    g.textBaseline = 'alphabetic'; g.textAlign = 'left';

    const gx = pad + labW + Math.max(0, (availW - cell * seasons.length) / 2);
    const colorFor = v => S.source === 'diff' ? (Math.abs(v) < 0.3 ? C.empty : v > 0 ? '#2f6e3a' : '#a8433b') : band(MSSEp.band(v).key);
    const textFor = v => S.source === 'diff' ? (Math.abs(v) < 0.3 ? C.text : '#fff') : (['good', 'decent', 'meh'].includes(MSSEp.band(v).key) ? '#1a1a1a' : '#fff');
    // numbers stay readable: Bebas at ~50% of the box (min 11px); hidden only on tiny boxes
    const numPx = Math.max(11, Math.round(Math.min(box, 46) * 0.5)), showNums = box >= 17;
    const labelEvery = cell >= 15 ? 1 : Math.ceil(15 / cell) * 5;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = `400 ${numPx}px "Bebas Neue", sans-serif`;
    seasons.forEach((sn, ci) => { if (cell >= 14 || ci % Math.ceil(14 / cell) === 0) { g.fillStyle = C.sub; g.fillText('S' + sn, gx + ci * cell + box / 2, gridTop + box / 2); } });
    const drawBox = (x, yy, v) => {
      g.fillStyle = v == null ? C.empty : colorFor(v);
      g.beginPath(); g.roundRect(x, yy, box, box, Math.max(1, box * 0.16)); g.fill();
      if (v != null && showNums) { g.fillStyle = textFor(v); g.fillText((S.source === 'diff' && v > 0 ? '+' : '') + v.toFixed(1), x + box / 2, yy + box / 2 + 1); }
    };
    for (let n = 1; n <= maxEp; n++) {
      const yy = gridTop + n * cell;
      if (n === 1 || n % labelEvery === 0) { g.fillStyle = C.sub; g.textAlign = 'right'; g.fillText('E' + n, gx - 8, yy + box / 2); g.textAlign = 'center'; }
      seasons.forEach((sn, ci) => { const ep = (S.eps[sn] || []).find(x => x.n === n); if (ep) drawBox(gx + ci * cell, yy, scoreOf(sn, ep)); });
    }
    const ay = gridTop + (maxEp + 1.6) * cell;
    g.fillStyle = C.line; g.fillRect(gx - labW * 0.6, ay - cell * 0.32, cell * seasons.length + labW * 0.6, 1.5);   // divider above AVG
    g.fillStyle = C.olive; g.textAlign = 'right'; g.fillText('AVG', gx - 8, ay + box / 2); g.textAlign = 'center';
    seasons.forEach((sn, ci) => drawBox(gx + ci * cell, ay, avg((S.eps[sn] || []).map(ep => scoreOf(sn, ep)))));

    // ── Legend ──
    const ly = H - pad - footH - legendH / 2;
    g.fillStyle = C.line; g.fillRect(pad, ly - legendH / 2 - 4, W - pad * 2, 1.5);            // divider: grid | legend
    g.font = `600 ${Math.round(U * 0.0125)}px Manrope, sans-serif`; g.textAlign = 'left'; g.textBaseline = 'middle';
    const items = S.source === 'diff' ? [['#2f6e3a', 'Higher than TMDB'], [C.empty, 'Same'], ['#a8433b', 'Lower than TMDB']] : MSSEp.BANDS.map(b => [band(b.key), b.name]);
    const iw = (W - pad * 2) / items.length;
    items.forEach(([c, l], i) => { const x = pad + i * iw; g.fillStyle = c; g.beginPath(); g.roundRect(x, ly - 8, 16, 16, 4); g.fill(); g.fillStyle = C.text; g.fillText(l, x + 22, ly + 1); });

    // ── Footer: user (left) · MyScreenScore logo + name (right) ──
    const fy = H - pad - footH / 2 + 6;
    g.fillStyle = C.line; g.fillRect(pad, H - pad - footH + 6, W - pad * 2, 1.5);
    const av = Math.round(footH * 0.5);
    g.save(); g.beginPath(); g.arc(pad + av / 2, fy, av / 2, 0, Math.PI * 2); g.closePath();
    if (avatar) { g.clip(); g.drawImage(avatar, pad, fy - av / 2, av, av); }
    else { g.fillStyle = band('great'); g.fill(); g.fillStyle = '#fff'; g.textAlign = 'center'; g.font = `600 ${Math.round(av * 0.48)}px Oswald, sans-serif`; g.fillText((who?.username || '?')[0].toUpperCase(), pad + av / 2, fy + 1); }
    g.restore();
    g.textAlign = 'left'; g.fillStyle = C.text; g.font = `600 ${Math.round(U * 0.014)}px Manrope, sans-serif`;
    g.fillText('@' + (who?.username || 'myscreenscore'), pad + av + 14, fy);
    const lg = Math.round(footH * 0.5);
    g.textAlign = 'right'; g.fillStyle = C.olive; g.font = `600 ${Math.round(U * 0.016)}px Oswald, sans-serif`;
    const brand = 'MYSCREENSCORE', bw = g.measureText(brand).width;
    g.fillText(brand, W - pad, fy);
    if (logo) { g.save(); g.beginPath(); g.roundRect(W - pad - bw - lg - 12, fy - lg / 2, lg, lg, lg * 0.22); g.clip(); g.drawImage(logo, W - pad - bw - lg - 12, fy - lg / 2, lg, lg); g.restore(); }
    g.fillStyle = C.sub; g.font = `500 ${Math.round(U * 0.012)}px Manrope, sans-serif`; g.textAlign = 'center';
    g.fillText('Episode data: TMDB', W / 2, H - Math.round(pad * 0.45));

    const a = document.createElement('a');
    a.download = `${S.show.name.replace(/[^\w]+/g, '-').toLowerCase()}-episodes${S.sel && S.sel.size ? '-' + selLabel().replace(/[^\w]+/g, '-').toLowerCase() : ''}-${EX.size}.png`;
    a.href = cv.toDataURL('image/png'); a.click();
    showToast('Image downloaded.');
  } catch (err) { console.error('Export:', err); showToast('Couldn’t make the image — try again.', 'err'); }
  S.source = viewSource;
  btn.disabled = false; btn.innerHTML = `${icon('download', 14)} Download Image`;
}
function egCSV() {
  const rows = [['Show', 'Season', 'Episode', 'Title', 'Score', 'Band', 'Tags', 'Note', 'Rated']];
  Object.values(S.mine).filter(r => vis().includes(r.season_number)).sort((a, b) => a.season_number - b.season_number || a.episode_number - b.episode_number).forEach(r => {
    const ep = r.episode_number ? (S.eps[r.season_number] || []).find(x => x.n === r.episode_number) : null;
    rows.push([S.show.name, r.season_number, r.episode_number || 'Season', r.episode_number ? (ep?.name || '') : `Season ${r.season_number}`, Number(r.score).toFixed(1), MSSEp.band(r.score).name, (r.tags || []).join('; '), r.note || '', (r.updated_at || '').slice(0, 10)]);
  });
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `${S.show.name.replace(/[^\w]+/g, '-').toLowerCase()}-episode-ratings.csv`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

document.addEventListener('DOMContentLoaded', () => {
  initPage(async user => {
    _egUser = user;
    try { if (_egShowId) await renderShow(); else await renderHome(); }
    catch (err) {
      console.error('Episodes:', err);
      document.getElementById('egPage').innerHTML = `<div class="mss-empty">Couldn’t load episode ratings — please refresh.</div>`;
    }
  });
});
</script>
