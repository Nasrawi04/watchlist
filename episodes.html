<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#F3EEDC">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MyScreenFolio">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="js/consent.js"></script>
<script src="js/splash.js"></script>
<script src="js/i18n.js"></script>
<title>Episodes — MyScreenFolio</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/style.css">
<style>
/* ── Episodes page ── */

/* Controls: one card — Ratings · View · Seasons, then Compare / Export */
.eg-controls { display:flex; flex-wrap:wrap; gap:14px 22px; align-items:flex-end; margin:0 0 16px; padding:0 0 16px; border-bottom:1px solid var(--lib-line); }
.eg-ctl { display:flex; flex-direction:column; align-items:flex-start; gap:7px; }
.eg-ctl-label { font-size:10.5px; font-weight:700; letter-spacing:2.4px; text-transform:uppercase; color:var(--olive-light); }
.eg-controls .pn-toggle { margin:0; }
.eg-controls .pn-toggle-btn { padding:8px 14px; font-size:13px; white-space:nowrap; }
.eg-board { background:var(--lib-card); border:1px solid var(--lib-line); border-radius:18px; padding:18px 20px 20px; min-width:0; }

/* ── One show (PDF p. 8–9): a dark hero card — breadcrumb, poster, title, four numbers, the actions — then the
   board (controls + the grid, unchanged) beside Highs and lows · Coverage · Stats ── */
/* the hero: the title page's own (tv-hero) at its size — the backdrop (with your framing), Back + where you came from,
   poster, title, chips, the actions, and the four numbers on the right */
.egs-hero { min-height:var(--hero-h, 780px); margin:0 0 18px; padding:84px 44px 70px; border-radius:var(--radius-lg); border:1px solid var(--border); }
.egs-hero .tv-hero-shade { background:linear-gradient(90deg, rgba(0,0,0,.70) 0%, rgba(0,0,0,.36) 52%, rgba(0,0,0,.46) 100%), linear-gradient(180deg, rgba(0,0,0,.40) 0%, rgba(0,0,0,.08) 38%, rgba(0,0,0,.80) 100%); }
[dir=rtl] .egs-hero .tv-hero-shade { background:linear-gradient(270deg, rgba(0,0,0,.70) 0%, rgba(0,0,0,.36) 52%, rgba(0,0,0,.46) 100%), linear-gradient(180deg, rgba(0,0,0,.40) 0%, rgba(0,0,0,.08) 38%, rgba(0,0,0,.80) 100%); }
.egs-crumb [aria-current] { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
.egs-hero-in { align-items:flex-end; gap:36px; margin-top:0; }
.egs-hero .tv-poster { width:var(--hero-poster, 240px); border-radius:var(--radius); }   /* the title page's poster size */
.egs-hero .tv-title { font-size:clamp(36px, 3vw + 12px, 56px); }
.egs-status i { display:none; }
.egs-chips { display:flex; flex-wrap:wrap; gap:6px; }
.egs-hero .tv-chip { background:rgba(0,0,0,.52); border-color:rgba(255,255,255,.2); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); min-height:26px; padding:0 9px; }
.egs-nums { display:grid; grid-template-columns:repeat(2, minmax(108px, 1fr)); gap:8px; flex:none; }
.egs-num { padding:12px 14px; border-radius:12px; background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.2); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); }
.egs-num b { display:block; font:400 30px/1 var(--bebas); letter-spacing:.4px; color:#fff; }
.egs-num b small { font-size:17px; opacity:.7; }
.egs-num span { display:block; margin-top:5px; font:600 11.5px 'Manrope',var(--sans); color:rgba(255,255,255,.8); white-space:nowrap; }
.egs-num.is-avg b, .egs-num.is-tier b { color:var(--st, #E7C873); }   /* the hero sits on the backdrop: the dark tier values (.egs-hero, theme.css) */
.egs-num.is-low b { color:#F0907F; }
.egs-acts { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
.egs-btn { display:inline-flex; align-items:center; gap:7px; min-height:44px; padding:0 16px; border-radius:var(--radius-sm); font:700 13px 'Manrope',var(--sans); text-decoration:none; cursor:pointer;
  color:#fff; background:rgba(0,0,0,.6); border:1px solid rgba(255,255,255,.26); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); transition:background-color .15s, border-color .15s; }
.egs-btn:hover { background:rgba(0,0,0,.78); border-color:rgba(255,255,255,.45); }
.egs-btn:focus-visible { outline:2px solid #8FD177; outline-offset:2px; }
.egs-btn.is-next { background:#E7C873; border-color:#E7C873; color:#2b1e02; -webkit-backdrop-filter:none; backdrop-filter:none; }
.egs-btn.is-next:hover { background:#f0d68f; border-color:#f0d68f; }
.egs-btn.is-icon { width:44px; padding:0; justify-content:center; }
.egs-btn.is-tag { cursor:default; color:#B8E0A8; background:color-mix(in srgb, var(--p-forest-300) 14%, transparent); border-color:color-mix(in srgb, var(--p-forest-300) 40%, transparent); }
.egs-btn > span { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.egs-cols { display:grid; grid-template-columns:minmax(0, 1fr) 320px; gap:16px; align-items:start; }
.egs-side { display:flex; flex-direction:column; gap:16px; min-width:0; }
.egs-card { background:var(--lib-card); border:1px solid var(--lib-line); border-radius:18px; padding:16px 18px 18px; }
.egs-card .lg-kicker { margin-bottom:12px; }
.egs-eps { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; }
.egs-eps li + li { border-top:1px solid var(--lib-line); }
.egs-ep { display:flex; align-items:center; gap:12px; width:100%; min-height:56px; padding:8px 0; background:none; border:0; text-align:start; font:inherit; color:inherit; cursor:pointer; }
.egs-ep:hover b { color:var(--olive-light); }
.egs-ep:focus-visible { outline:2px solid var(--olive-light); outline-offset:2px; border-radius:8px; }
.egs-ep-still { width:64px; aspect-ratio:16/9; flex-shrink:0; border-radius:6px; overflow:hidden; background:var(--bg-3); }
.egs-ep-still img { width:100%; height:100%; object-fit:cover; display:block; }
.egs-ep-txt { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
.egs-ep-txt b { font:700 13.5px/1.25 'Manrope',var(--sans); color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.egs-ep-txt small { font-size:11.5px; color:var(--text-3); }
.egs-cov { margin:0 0 8px; font:600 13px 'Manrope',var(--sans); color:var(--text-2); }
.egs-cov b { font:400 30px/1 var(--bebas); color:var(--text); margin-inline-end:4px; vertical-align:-3px; }
.egs-cov-bar { height:6px; border-radius:3px; background:var(--lib-track); overflow:hidden; }
.egs-cov-bar i { display:block; height:100%; background:var(--olive-light); }
.egs-cov-note { margin:10px 0 0; font-size:12.5px; line-height:1.5; color:var(--text-2); }
.egs-cov-btn { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; min-height:42px; margin-top:14px; border-radius:var(--radius-sm); border:1px solid var(--olive); background:var(--olive); color:var(--text-on-brand); font:700 13px 'Manrope',var(--sans); cursor:pointer; }
.egs-cov-btn:hover { background:var(--olive-2, var(--olive)); }
.egs-cov-btn:focus-visible { outline:2px solid var(--olive-light); outline-offset:2px; }
/* around the grid: coverage under each season, thin seasons' averages in grey with a * */
.eg-cov { display:block; margin-top:2px; font:600 10.5px 'Manrope',var(--sans); letter-spacing:.2px; color:var(--text-3); }
.eg-cell.eg-thin { background:var(--bg-3); color:var(--text-3); box-shadow:inset 0 0 0 1px var(--border-2); }
.eg-thin-note { margin:8px 2px 0; font-size:12px; color:var(--text-3); }
@media(max-width:1000px) { .egs-cols { grid-template-columns:1fr; } }
@media(max-width:1100px) { .egs-hero-in { flex-wrap:wrap; } .egs-nums { grid-template-columns:repeat(4, minmax(0, 1fr)); width:100%; } }
/* tablets: a smaller hero (poster 150px), the actions on one line where they fit */
@media(min-width:641px) and (max-width:1000px) {
  .egs-hero { min-height:440px; padding:40px 28px 28px; }
  .egs-hero-in { gap:16px 24px; }
  .egs-hero .tv-poster { width:150px; }
  .egs-hero .tv-hero-txt { flex:1 1 0; }
  .egs-hero .tv-title { font-size:36px; }
  .egs-btn { min-height:40px; padding:0 12px; }
  .egs-btn.is-icon { width:40px; flex:none; }
  .egs-acts { flex-wrap:nowrap; max-width:100%; }
  .egs-btn.is-next { flex:0 1 auto; min-width:0; }
  .egs-btn:not(.is-next) { flex:none; }
}
@media(max-width:640px) {
  .egs-hero { min-height:300px; padding:14px 14px 16px; }
  .egs-crumb, .eg-crumb { flex-wrap:nowrap; margin-bottom:8px; }
  /* poster beside the status, title and chips; then the four numbers; then the actions (Rate next full width) */
  .egs-hero-in { display:grid; grid-template-columns:88px minmax(0, 1fr); align-items:end; gap:8px 14px; margin-top:96px; }
  .egs-hero .tv-hero-txt { display:contents; }
  .egs-hero .tv-poster { width:88px; grid-column:1; grid-row:1 / span 3; align-self:end; }
  .egs-hero .tv-status, .egs-hero .tv-title, .egs-chips { grid-column:2; justify-self:start; }
  .egs-hero .tv-title { font-size:28px; }
  .egs-nums { grid-column:1 / -1; grid-row:4; gap:6px; margin-top:6px; }
  .egs-acts { grid-column:1 / -1; grid-row:5; margin-top:2px; gap:6px; }
  .egs-btn.is-next { flex:1 1 100%; justify-content:center; }
  .egs-btn:not(.is-next):not(.is-icon) { flex:1 1 0; min-width:0; justify-content:center; gap:5px; padding:0 6px; font-size:12.5px; }
  .egs-btn.is-icon { flex:none; }
  .egs-num { min-width:0; padding:8px 6px; text-align:center; }
  .egs-num b { font-size:22px; }
  .egs-num span { font-size:10px; white-space:normal; line-height:1.2; }
  .egs-card { padding:14px; }
  .eg-cmp-bar { padding:14px; }
  .eg-cmp-bar-actions { width:100%; }
  .eg-cmp-bar-actions .sf-icon-btn { flex:1 1 0; justify-content:center; }
  .eg-cmp-table th, .eg-cmp-table td { padding:9px 6px; }
}

/* Grid: seasons across, episodes down — separate rounded boxes with gaps, like the exported picture (ep-chart.js; owner,
   17 Nov 2026): Manrope numbers, no row lines, a quiet filled box with "–" for an episode you haven't rated */
.eg-grid-wrap { overflow-x:auto; border:0.5px solid var(--border-2); border-radius:var(--radius); scrollbar-width:thin; }
.eg-grid { border-collapse:collapse; width:100%; }
.eg-grid { border-collapse:separate; border-spacing:0; }
.eg-grid th { font:600 15px/1.2 'Manrope',var(--sans); color:var(--text); padding:12px 4px 8px; text-align:center; }
.eg-grid td { padding:4px; }
.eg-grid th.eg-ep { position:sticky; inset-inline-start:0; z-index:1; background:var(--card); width:64px; min-width:56px; text-align:center; font-size:14px; color:var(--text-2); padding:4px 8px; }
.eg-grid .eg-fill { width:100%; padding:0; }
/* 5+ seasons: the boxes keep the picture's shape (no stretching to fill the row) — the table is only as wide as
   they are, and scrolls sideways when there are more seasons than fit */
.eg-grid.eg-fit { width:auto; }
.eg-grid.eg-fit .eg-cell { width:clamp(56px, 7vw, 104px); min-width:54px; }
.eg-cell { width:clamp(56px, 9vw, 112px); height:38px; border-radius:9px; padding:0; border:none; cursor:pointer; font:600 16px/1 'Manrope',var(--sans); letter-spacing:0;
  display:flex; align-items:center; justify-content:center; transition:transform .12s, box-shadow .12s; box-shadow:inset 0 0 0 0.5px rgba(0,0,0,.06); }
button.eg-cell:hover { transform:translateY(-1px); }
.eg-cell:focus-visible { outline:2px solid var(--text); outline-offset:2px; }
.eg-cell.eg-empty { background:color-mix(in srgb, var(--text) 7%, transparent); color:var(--text-3); }
.eg-cell.eg-unaired { background:var(--bg-3); opacity:.55; color:transparent; cursor:default; }
.eg-cell.eg-best { box-shadow:0 0 0 2px var(--bg), 0 0 0 4px var(--text); }
.eg-cell.eg-worst { box-shadow:0 0 0 2px var(--bg), 0 0 0 4px var(--band-bad); }
.eg-cell.ep-band-masterpiece { box-shadow:inset 0 0 0 1px rgba(255,240,190,.55); }
.eg-cell.ep-band-masterpiece.eg-best { box-shadow:0 0 0 2px var(--bg), 0 0 0 4px var(--text); }
.eg-cell.eg-diff-up { background:#2f6e3a; color:#fff; } .eg-cell.eg-diff-down { background:#a8433b; color:#fff; } .eg-cell.eg-diff-same { background:var(--bg-3); color:var(--text-2); }
.eg-avg td, .eg-avg th { padding-top:14px; }   /* a little apart from the episodes, as in the picture */
.eg-avg th.eg-ep { color:var(--text); }
.eg-avg .eg-cell { cursor:default; }
.eg-season-row { background:transparent; }
.eg-season-row th.eg-ep { font-family:'Manrope',var(--sans); font-size:10.5px; font-weight:700; letter-spacing:1.6px; color:var(--text-3); background:var(--card); }
.eg-season-row .eg-cell.eg-empty { font-size:18px; font-weight:400; }
.eg-season-row button.eg-cell { cursor:pointer; }
.eg-legend { display:flex; flex-wrap:wrap; gap:8px 16px; margin:14px 2px 0; font-size:12.5px; color:var(--text-2); }
.eg-legend span { display:inline-flex; align-items:center; gap:7px; white-space:nowrap; }
.eg-legend small { color:var(--text-3); font-size:11.5px; }
.eg-legend i { width:15px; height:15px; border-radius:4px; display:inline-block; flex-shrink:0; }
.eg-legend i.ep-band-masterpiece { position:relative; } .eg-legend i.ep-band-masterpiece::after { content:'★'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:9px; font-style:normal; line-height:1; }
.eg-legend i.eg-lg-best { box-shadow:0 0 0 2px var(--text); } .eg-legend i.eg-lg-worst { box-shadow:0 0 0 2px var(--band-bad); }
.eg-legend-sep { flex-basis:100%; height:0; }
.eg-legend i.eg-unaired-sw { background:var(--bg-3); border:0.5px solid var(--border-2); }
/* graph */
.eg-graph { width:100%; height:auto; display:block; }
.eg-graph-scroll { overflow-x:auto; overscroll-behavior-x:contain; scrollbar-width:thin; margin:0 -4px; padding:0 4px 6px; }
.eg-graph-scroll .eg-graph { max-width:none; }
.eg-graph-scroll:focus-visible { outline:2px solid var(--olive-light); outline-offset:2px; border-radius:6px; }
.eg-graph .eg-pt { cursor:pointer; }
/* list */
.eg-list { display:flex; flex-direction:column; gap:10px; }
.eg-row { display:flex; gap:14px; align-items:center; padding:10px 12px; min-height:88px; background:var(--card); border:0.5px solid var(--border); border-radius:var(--radius); cursor:pointer; }
.eg-row:hover { border-color:var(--border-olive); }
.eg-row-still { width:136px; aspect-ratio:16/9; border-radius:var(--radius-sm); overflow:hidden; background:var(--bg-3); flex-shrink:0; }
.eg-row-still img { width:100%; height:100%; object-fit:cover; display:block; }
.eg-row-info { flex:1; min-width:0; }
.eg-row-title { font-family:var(--serif); font-size:15px; font-weight:600; color:var(--text-heading); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.eg-row-meta { font-size:12px; color:var(--text-3); margin-top:2px; }
.eg-row-desc { font-size:12.5px; color:var(--text-2); line-height:1.5; margin-top:4px; display:-webkit-box; -webkit-line-clamp:2; line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.eg-row-tags { display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; }
.eg-row-tags span { font-size:10.5px; font-weight:600; padding:2px 7px; border-radius:3px; background:var(--olive); color:var(--text-on-brand); }
.eg-row-chips { display:flex; gap:8px; flex-shrink:0; }
.eg-chip { min-width:50px; padding:6px 8px; border-radius:6px; text-align:center; font-family:var(--bebas); font-size:18px; line-height:1; }
.eg-chip-empty { background:var(--olive-faint); color:var(--olive-light); border:0.5px solid var(--border-olive); }
.eg-chip small { display:block; font-family:'Manrope',var(--sans); font-size:8.5px; letter-spacing:1px; text-transform:uppercase; opacity:.85; margin-top:2px; }
/* episode popup, view mode */
/* stats panel */
.eg-panel-empty { font-size:13px; color:var(--text-3); margin:0; }
.eg-avg-tile { display:flex; align-items:center; gap:14px; padding:14px 16px; border-radius:var(--radius); margin-bottom:10px; }
.eg-avg-tile b { font-family:var(--bebas); font-weight:400; font-size:44px; line-height:.9; letter-spacing:.3px; }
.eg-avg-tile span { display:flex; flex-direction:column; gap:2px; font-size:12px; font-weight:600; opacity:.92; }
.eg-avg-tile span small { font-size:10.5px; font-weight:700; letter-spacing:1.6px; text-transform:uppercase; opacity:.9; }
.eg-avg-tile.eg-avg-plain { background:var(--bg-3); color:var(--text); }
.eg-tiles { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.eg-tile { display:flex; flex-direction:column; gap:4px; padding:11px 12px; border-radius:var(--radius-sm); background:var(--bg-3); text-align:start; font:inherit; color:var(--text); border:none; min-width:0; }
.eg-tile > span { font-size:11.5px; color:var(--text-2); line-height:1.25; }
.eg-tile b { font-family:var(--bebas); font-weight:400; font-size:24px; line-height:1; color:var(--text); white-space:nowrap; letter-spacing:.3px; }
.eg-tile small { font-size:11px; color:var(--text-2); }
.eg-tie { align-self:flex-start; width:fit-content; margin-bottom:10px; padding:4px 10px; border:1px solid var(--border-olive); border-radius:999px; font-size:12px; font-weight:700; color:var(--olive-light); background:var(--olive-faint); }
button.eg-tile { cursor:pointer; transition:background-color .15s; }
button.eg-tile:hover { background:var(--olive-faint); }
button.eg-tile:focus-visible { outline:2px solid var(--olive-light); outline-offset:2px; }
.eg-tiles > .eg-tile:last-child:nth-child(odd) { grid-column:1 / -1; }
.eg-tile i { display:inline-block; width:9px; height:9px; border-radius:3px; margin-inline-end:6px; vertical-align:2px; }
/* episode panel (MSSPanel L) */
.eg-pop-over { margin:0; font-size:14px; color:var(--text-2); line-height:1.65; }
.eg-take { margin:0 0 14px; } .eg-take .eg-pop-note { margin-top:0; } .eg-take .eg-row-tags + .eg-pop-note { margin-top:10px; }
.eg-pop-note { margin-top:10px; padding-inline-start:12px; border-inline-start:2px solid var(--olive-light); font-style:italic; color:var(--text); font-size:14px; }
.eg-season-btn svg:last-child { margin-inline-start:2px; opacity:.7; }
/* season picker (panel L): one row of season posters that scrolls sideways */
.eg-season-grid.fav-season-grid { flex-wrap:nowrap; justify-content:flex-start; gap:14px; overflow-x:auto; overscroll-behavior-x:contain; scroll-snap-type:x proximity; padding:4px 2px 12px; scrollbar-width:thin; }
.eg-season-grid .td-season-block { flex:0 0 auto; scroll-snap-align:start; }
.eg-season-all { display:inline-flex; align-items:center; gap:6px; margin-bottom:14px; padding:8px 14px; border-radius:var(--radius-sm); cursor:pointer; font-family:'Manrope',var(--sans); font-size:13px; font-weight:600; background:transparent; border:1px solid var(--border-2); color:var(--text-2); }
.eg-season-all.on { background:var(--olive); border-color:var(--olive); color:var(--text-on-brand); }
.eg-season-all svg { display:none; } .eg-season-all.on svg { display:inline; }
.eg-season-grid .td-season-block { width:clamp(108px, 13vw, 140px); }
.td-season-block-poster { position:relative; }
.eg-season-check { position:absolute; top:6px; inset-inline-end:6px; width:24px; height:24px; border-radius:50%; background:var(--olive); color:var(--text-on-brand); display:flex; align-items:center; justify-content:center; }
/* Comparing (?vs= / ?vsUser=): a header card, the two grids in cards, then season averages + side by side */
.eg-cmp-bar { display:flex; align-items:center; justify-content:space-between; gap:14px 24px; flex-wrap:wrap; margin:0 0 16px; padding:18px 22px; background:var(--lib-card); border:1px solid var(--lib-line); border-radius:18px; }
.eg-cmp-bar-text { flex:1 1 320px; min-width:0; }
.eg-cmp-bar-h { margin:8px 0 2px; font:700 clamp(20px, 1.4vw + 12px, 28px)/1.15 var(--serif); color:var(--text-heading); overflow-wrap:anywhere; }
.eg-cmp-bar-h span:not([translate]) { font-weight:500; color:var(--text-3); font-size:.8em; }
.eg-cmp-bar-sub { margin:0; font-size:13px; color:var(--text-3); }
.eg-cmp-bar-actions { display:flex; gap:8px; flex-wrap:wrap; }
.eg-cmp-bar-actions a { text-decoration:none; }
.eg-cmp-bar-actions .sf-icon-btn-label { display:inline; }
.eg-cmp-sides { display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:12px; }
.egh-head .eg-cmp-sides { margin:0; }

<script>
/* ═══════════════════════════════════════════════════════════════
   episodes.html — Episode Ratings
     episodes.html               shows you've rated, then your other shows, search, stats
     episodes.html?show=<tmdb>   one show: SeriesGraph-style grid / graph /
                                 list · source: Mine (once you've rated) / TMDB · Mine ·
                                 Community (2+ ratings) · Mine vs TMDB
═══════════════════════════════════════════════════════════════ */
const esc = s => escHTML(s == null ? '' : String(s));
let _egUser = null;

const _egParams = new URLSearchParams(location.search);
const _egShowId = parseInt(_egParams.get('show'), 10) || null;
const _egVsId   = parseInt(_egParams.get('vs'), 10) || null;          // compare with another show
const _egUserQ  = _egParams.get('user') || null;                      // someone else's ratings (profile)
const _egVsUser = _egParams.get('vsUser') || null;                    // compare this show with a friend's ratings

const bandCls = v => v == null ? '' : 'ep-band-' + MSSEp.band(v).key;
const fmt = v => v == null ? '—' : mssR1(Number(v));
const avg = arr => { const v = arr.filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };

/* ══ Home: your Episodes (episodes-home.js — the same design as the profile Episodes tabs), and
   ?left=1: every show still waiting for a score. The search covers all of TMDB. ══ */
const _egLeft = _egParams.get('left') === '1';
function _egHeadHTML() {
  return `<div class="cat-page-header lib-head eg-head fade-up">
      <div class="lib-head-l">
        ${_egLeft ? `<div class="tv-crumb eg-crumb" role="navigation" aria-label="Breadcrumb">
          <a href="episodes.html" onclick="return _egGoBack()">${icon('back', 14)}<span>Back</span></a><span aria-hidden="true">/</span>
          <a href="episodes.html">Episodes</a><span aria-hidden="true">/</span><span aria-current="page">Shows to rate</span></div>` : ''}
        <div class="lib-kicker">Your episode ratings</div>
        <h1 class="cat-page-title">${_egLeft ? 'Shows to rate' : 'Episodes'}</h1>
        <div class="cat-page-sub">${_egLeft ? 'Shows you’ve started or finished, with no episode scores yet.' : 'Every episode you’ve rated, show by show, and the ones still waiting for a score.'}</div>
      </div>
      ${_egLeft ? '' : `<div class="lib-head-r"><div class="lib-search"><div class="sf-search" role="search">
        <span class="sf-search-ic" aria-hidden="true">${icon('search', 16)}</span>
        <input type="search" class="sf-search-input" id="egSearch" placeholder="Find a show to rate…" aria-label="Find a show to rate: search every TV show" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
        <span class="sf-search-count" aria-live="polite"></span>
        <button type="button" class="sf-search-clear" onclick="_egFind('', true)" aria-label="Clear search">${icon('x', 14)}</button>
        <button type="button" class="sf-search-go" tabindex="-1" aria-hidden="true" onclick="this.parentElement.querySelector('input').focus()">${icon('search', 16)}<span>Search</span></button>
      </div></div></div>`}
    </div>`;
}
async function renderHome() {
  const page = document.getElementById('egPage');
  page.innerHTML = `${_egHeadHTML()}<div id="egHome"><div class="page-loading" data-skel="eph"></div></div><div id="egResults" hidden aria-live="polite"></div>`;
  const home = document.getElementById('egHome');
  if (_egLeft) { await MSSEpHome.mountLeft(home, { userId: _egUser.id }); return; }
  await MSSEpHome.mount(home, { userId: _egUser.id, owner: true, page: true });
  document.getElementById('egSearch').addEventListener('input', ev => _egFind(ev.target.value));
  document.getElementById('egSearch').addEventListener('keydown', ev => { if (ev.key === 'Escape' && ev.target.value) { ev.stopPropagation(); _egFind('', true); } });
}
// A guest: the search (any show → its episodes) over what Episodes does once you join
function renderGuestHome() {
  const g = MSS_GUEST.episodes, page = document.getElementById('egPage');
  page.innerHTML = `${_egHeadHTML()}<div id="egHome">${mssEmpty({ art: g.art, title: g.title, text: 'Search any show above to see every episode, with TMDB’s and the community’s scores. With a free account you rate them too.',
    perks: g.perks, actions: [{ label: 'Create a free account', icon: 'sparkles', href: 'login.html#signup', primary: true }, { label: 'Sign in', href: 'login.html' }] })}</div><div id="egResults" hidden aria-live="polite"></div>`;
  page.querySelector('.cat-page-sub').textContent = 'Search any show to see all its episodes and how they score.';
  page.querySelector('.lib-kicker').textContent = 'Episode ratings';
  const inp = document.getElementById('egSearch');
  inp.placeholder = 'Search a show…';
  inp.addEventListener('input', ev => _egFind(ev.target.value));
  inp.addEventListener('keydown', ev => { if (ev.key === 'Escape' && ev.target.value) { ev.stopPropagation(); _egFind('', true); } });
}
// Typing 2+ letters swaps the page for the results; clearing brings it back
let _egFindT = null;
function _egFind(v, now) {
  const inp = document.getElementById('egSearch'), q = (v || '').trim();
  if (inp.value !== v) inp.value = v;
  inp.closest('.sf-search').classList.toggle('has-q', !!q);
  if (now && !q) inp.focus();
  clearTimeout(_egFindT);
  _egFindT = setTimeout(async () => {
    const box = document.getElementById('egResults'), home = document.getElementById('egHome');
    const count = inp.closest('.sf-search').querySelector('.sf-search-count');
    home.hidden = q.length >= 2; box.hidden = q.length < 2;
    if (q.length < 2) { box.innerHTML = ''; count.innerHTML = ''; return; }
    try {
      const tmp = document.createElement('div');
      await MSSEpHome.search(tmp, q);
      if (document.getElementById('egSearch').value.trim() !== q) return;   // typed on since → a newer search wins
      box.replaceChildren(...tmp.childNodes);
      const n = box.querySelectorAll('.egh-row').length;   // as the Library's box: "3 found"
      count.innerHTML = n ? `<b>${n}</b> found` : 'No matches';
    } catch { box.innerHTML = ''; }
  }, now ? 0 : MSS_SEARCH_MS);
}

/* ══ One show ══ */
const blankState = MSSEpChart.blank;
let S = blankState();
const key = MSSEpChart.key;
const withS = (state, fn) => { const prev = S; S = state; try { return fn(); } finally { S = prev; } };
function scoreOf(s, ep) {
  const k = key(s, ep.n);
  if (S.source === 'tmdb') return ep.vote ? Number(mssR1(ep.vote)) : null;
  if (S.source === 'mine') return S.mine[k] ? Number(S.mine[k].score) : null;
  if (S.source === 'community') return S.comm[k] ? Number(S.comm[k].avg_score) : null;
  return S.mine[k] && ep.vote ? Math.round((Number(S.mine[k].score) - ep.vote) * 10) / 10 : null;   // mine vs tmdb
}
// Season score (whole-season ratings: episode_number 0; TMDB's season score)
function seasonScore(sn) {
  const t = (S.show.seasons || []).find(x => x.season_number === sn)?.vote_average || null;
  const tm = t ? Number(mssR1(t)) : null, mine = S.mine[key(sn, 0)] ? Number(S.mine[key(sn, 0)].score) : null;
  if (S.source === 'tmdb') return tm;
  if (S.source === 'mine') return mine;
  if (S.source === 'community') return S.comm[key(sn, 0)] ? Number(S.comm[key(sn, 0)].avg_score) : null;
  return mine != null && tm != null ? Math.round((mine - tm) * 10) / 10 : null;
}
const aired = ep => ep.air && new Date(ep.air) <= new Date();
// Season filter (all views + export): S.sel = Set of seasons, or null for all.
// Kept while you stay on the page (rating episodes doesn't reset it).
// seasonsIn / seasonsLabel work on any choice (the page's, or the Export popup's own — EX.sel)
const seasonsIn = sel => (sel && sel.size) ? S.seasons.filter(sn => sel.has(sn)) : S.seasons;
const seasonsLabel = sel => {
  const v = seasonsIn(sel);
  if (!sel || !sel.size || v.length === S.seasons.length) return 'All seasons';
  if (v.length === 1) return 'Season ' + v[0];
  const contiguous = v.every((x, i) => i === 0 || x === v[i - 1] + 1);
  if (contiguous) return `Seasons ${v[0]}–${v[v.length - 1]}`;
  return v.length <= 4 ? `Seasons ${v.slice(0, -1).join(', ')} & ${v[v.length - 1]}` : `${v.length} seasons`;
};
const vis = () => seasonsIn(S2 ? null : S.sel);
const selLabel = () => seasonsLabel(S2 ? null : S.sel);

const loadState = (tmdbId, userId) => MSSEpChart.load(tmdbId, userId, _egUser?.id || null);   // ep-chart.js
let S2 = null;   // compared show
// Back: to the page you came from (the browser's own Back when it's this site), and where that was for the trail
// "Episodes › Game of Thrones" — a title page or a profile, else Episodes
const _egBack = (() => {
  try {
    const r = document.referrer ? new URL(document.referrer) : null;
    const file = r && r.origin === location.origin ? r.pathname.split('/').pop() : '';
    if (file === 'title.html') return { href: file + r.search, label: 'Title page', hist: true };
    if (file === 'profile.html' || file === 'profile-view.html') return { href: file + r.search, label: 'Profile', hist: true };
    if (file === 'episodes.html') return { href: file + r.search, label: 'Episodes', hist: true };
    if (r && r.origin === location.origin) return { href: 'episodes.html', label: 'Episodes', hist: true };
  } catch {}
  return { href: 'episodes.html', label: 'Episodes' };
})();
function _egGoBack() { if (_egBack.hist && history.length > 1) { history.back(); return false; } return true; }
async function renderShow() {
  if (!(await MSSAge.page('tv', _egShowId))) return;              // age-restricted for this account (088)
  if (_egVsId && !(await MSSAge.page('tv', _egVsId))) return;
  const userId = _egUserQ || _egUser?.id || null;
  let X;
  try { X = await loadState(_egShowId, userId); }
  catch (e) { mssErrorPage(mssTmdbErrorKind(e, 'title'), { error: e }); return; }
  if (!X) { mssErrorPage('title'); return; }
  // a guest (owner, 19 Nov 2026): every episode with TMDB's and the community's scores, view only; rating asks them to join
  if (!_egUser && !_egUserQ) { X.readOnly = X.guest = true; X.whoName = 'Your'; X.source = Object.keys(X.comm).length ? 'community' : 'tmdb'; }
  else if (X.readOnly) {
    const { data: p } = await sb.from('profiles').select('username,display_name').eq('id', userId).maybeSingle();
    X.whoName = p?.display_name || p?.username || 'Their';
    X.source = Object.keys(X.mine).length ? 'mine' : 'tmdb';
  }
  // your own page: once you've rated anything of this show, your ratings are what you see first
  else if (Object.keys(X.mine).length) X.source = 'mine';
  S = X;
  if (_egUser) S.chat = await MSSEpChat.counts(_egShowId);
  // someone else's ratings are view only — no comparing (or exporting) them
  if (_egVsId && !X.readOnly) S2 = await loadState(_egVsId, userId);
  else if (_egVsUser && !X.readOnly && _egVsUser !== userId) {
    S2 = await loadState(_egShowId, _egVsUser);
    if (S2) {
      const { data: p } = await sb.from('profiles').select('username,display_name').eq('id', _egVsUser).maybeSingle();
      S2.whoName = p?.display_name || p?.username || 'Friend';
      S.source = S2.source = 'mine';
    }
  }
  draw();
  // from Best episodes / Last rated (episodes-home.js): open that episode
  const s0 = parseInt(_egParams.get('s'), 10), e0 = parseInt(_egParams.get('e'), 10);
  if (s0 && e0 && !S2) egOpen(s0, e0);
  // from a title page's Export episodes button (title-view.js): straight to Export; the address drops ?export so Back / reload don't reopen it
  if (_egParams.get('export') === '1') {
    const p = new URLSearchParams(location.search); p.delete('export'); history.replaceState(history.state, '', location.pathname + (p.toString() ? '?' + p : ''));
    if (!S2 && !S.readOnly) egExport();
  }
}
// Replaced in one go, and only by the newest request: quick saves can't bring back older scores
let _egMineSeq = 0;
async function loadMine() {
  const seq = ++_egMineSeq;
  if (!S.entry) { S.mine = {}; return; }
  const { data } = await sb.from('episode_ratings').select('*').eq('entry_id', S.entry.id);
  const rows = await mssWithEpNotes(data || []);   // Friends / Only me notes too (108)
  if (seq !== _egMineSeq) return;
  const mine = {};
  rows.forEach(r => { mine[key(r.season_number, r.episode_number)] = r; });
  S.mine = mine;
}

// Whose-ratings options: in view mode (someone else's page) theirs first, no "vs TMDB"
const sourceOpts = () => S.guest ? [['tmdb', 'TMDB'], ['community', 'Community']]
  : S.readOnly ? [['mine', esc(S.whoName) + '’s'], ['tmdb', 'TMDB'], ['community', 'Community']]
  : [['tmdb', 'TMDB'], ['mine', 'Mine'], ['community', 'Community'], ['diff', 'Mine vs TMDB']];
function draw() { const page = document.getElementById('egPage'); mssKeepScroll(page, () => { page.innerHTML = _egShowHTML(); }); }
// the show's backdrop: the entry's chosen one (yours, or theirs when it's someone else's), else TMDB's — MSSBackdrop
const _egBdOf = () => S.entry?.tmdb_id ? S.entry : { type: 'tv', id: _egShowId };
function _egBackdrop() {
  if (S.bdUrl === undefined) { S.bdUrl = null; MSSBackdrop.url(_egBdOf()).then(u => { if (u) { S.bdUrl = u; draw(); } }); }
  return S.bdUrl;
}
// The chart owner's own ratings (yours, or theirs): the hero's four numbers, coverage and Rate next — whatever the source
const _egAired = () => S.seasons.flatMap(sn => (S.eps[sn] || []).filter(aired).map(ep => ({ s: sn, ep })));
const _egMineEps = () => _egAired().map(x => ({ ...x, r: S.mine[key(x.s, x.ep.n)] })).filter(x => x.r).map(x => ({ ...x, v: Number(x.r.score) }));
// per season: aired episodes and how many are rated; "thin" = fewer than half rated (its average isn't compared)
function _egCoverage() {
  return S.seasons.map(sn => {
    const eps = (S.eps[sn] || []).filter(aired), n = eps.filter(ep => S.mine[key(sn, ep.n)]).length;
    return { sn, of: eps.length, n, thin: n > 0 && n < eps.length / 2 };
  });
}
const _egThin = () => S.source === 'mine' && S.entry ? new Set(_egCoverage().filter(c => c.thin).map(c => c.sn)) : new Set();
// the first aired episode you haven't rated, in order
function _egNext() {
  if (S.readOnly || !S.entry) return null;
  return _egAired().find(x => !S.mine[key(x.s, x.ep.n)]) || null;
}
const _egSE = (sn, n) => `S${sn} E${n}`;
function _egShowHTML() {
  const sh = S.show;
  // the poster picked for this show (yours, or theirs on someone else's chart), else TMDB's
  const poster = safeURL(S.entry?.poster_url) || (sh.poster_path ? `https://image.tmdb.org/t/p/w500${sh.poster_path}` : null);
  const years = [(sh.first_air_date || '').slice(0, 4), sh.status === 'Ended' ? (sh.last_air_date || '').slice(0, 4) : 'Present'].filter(Boolean).join('–');
  const all = _egAired(), mineEps = _egMineEps(), whose = S.readOnly ? esc(S.whoName) + '’s' : 'Your';
  const mAvg = mineEps.length ? avg(mineEps.map(x => x.v)) : null, ex = mineEps.length ? MSSEp.extremes(mineEps, x => x.v) : null;
  const tens = mineEps.filter(x => x.v >= 10).length, next = _egNext();
  const num = (v, l, cls = '') => `<div class="egs-num${cls}"><b>${v}</b><span>${l}</span></div>`;
  const nums = mineEps.length ? `<div class="egs-nums">

// Coverage: how much of the show the chart owner has rated, which seasons are thin, and Rate next
function coverageHTML() {
  if (!S.entry) return '';

function showStats(X) {
  return withS(X, () => {
    const sc = allScored(); if (!sc.length) return null;
    const a = avg(sc.map(x => x.v));
    const best = sc.reduce((x, y) => (y.v > x.v ? y : x));
    const sa = X.seasons.map(sn => ({ sn, a: avg((X.eps[sn] || []).map(ep => scoreOf(sn, ep))) })).filter(x => x.a != null);
    return { a, best, bestS: sa.reduce((x, y) => (y.a > x.a ? y : x)), sa, great: Math.round(100 * sc.filter(x => x.v >= 8.5).length / sc.length), sd: Math.sqrt(avg(sc.map(x => (x.v - a) ** 2))), n: sc.length };

}

   The popup shows the real image as you change the options; Save Image hands that
   picture to mssSaveImage (config.js) — the share sheet on phones, like Create Card. */
const EX = { size: 'square', theme: 'dark', source: null, sel: null, token: 0 };   // sel: the seasons in the picture (null = all)
let egExPanel = null;
async function egExport() {
  if (S.readOnly) return;
  await mssLoadScript('js/panel.js');
  EX.sel = S2 || !S.sel ? null : new Set(S.sel);   // starts with what the page shows; changing it here doesn't change the page
  if (!EX.source || !['tmdb', 'mine', 'community'].includes(EX.source)) EX.source = S.source === 'diff' ? 'mine' : S.source;
  const seg = (k, label, opts) => `<div class="lyr-sec"><h3 class="lyr-sec-h" id="egEx-${k}">${label}</h3>${mssSegHTML({ labelledby: 'egEx-' + k, options: opts, value: EX[k], data: { ex: k } })}</div>`;
  const body = `<div class="eg-ex-preview" id="egExPreview"><canvas id="egExCanvas" role="img" aria-label="Preview of the image"></canvas><div class="eg-ex-busy"><div class="spinner"></div></div></div>
      ${seg('size', 'Format', [['square', 'Square · 1:1'], ['story', 'Portrait · 9:16'], ['wide', 'Landscape · 16:9']])}
      ${seg('theme', 'Theme', [['dark', 'Dark'], ['light', 'Light'], ['backdrop', 'Cinematic']])}
      ${seg('source', 'Data source', [['mine', 'My Ratings'], ['tmdb', 'TMDB'], ['community', 'MSF Community']])}
      ${S.seasons.length > 1 ? `<div class="lyr-sec"><h3 class="lyr-sec-h">Seasons <small id="egExSelLabel">${esc(seasonsLabel(EX.sel))}</small></h3>
        <div class="eg-ex-chips" role="group" aria-label="Seasons in the image" id="egExSeasons">${egExChipsHTML()}</div></div>` : ''}`;
  const h = MSSPanel.open({ size: 'S', kind: 'generic', title: 'Export', body,
    // Only two buttons, like Create Card (owner, 17 Nov 2026): Copy image · Save image (no CSV here)
    footer: { secondary: [{ label: 'Copy image', lead: icon('copy', 16), onClick: () => egCopyImage() }],
      primary: { label: 'Save image', lead: icon('download', 16), disabled: true, onClick: () => egSaveImage() } },
    onClose: () => { EX.token++; if (egExPanel === h) egExPanel = null; } });
  egExPanel = h;
  h.body.addEventListener('click', ev => { const b = ev.target.closest('.lyr-seg [data-ex]'); if (b) egExSet(b.dataset.ex, mssSegPick(b)); });
  egDraw();
}
function egExSet(k, v) {
  EX[k] = v;
  egDraw();
}
// Seasons: All, or tap any number of them (tapping the last one off goes back to All)
function egExChipsHTML() {
  const all = !EX.sel || !EX.sel.size, chip = (v, l, on, aria) => `<button type="button" class="eg-ex-chip${on ? ' active' : ''}" aria-pressed="${on}" ${aria ? `aria-label="${aria}"` : ''} onclick="egExSeason(${v})">${l}</button>`;
  return chip('null', 'All', all) + S.seasons.map(sn => chip(sn, sn, !all && EX.sel.has(sn), 'Season ' + sn)).join('');
}
function egExSeason(sn) {
  if (sn == null) EX.sel = null;
  else { EX.sel = new Set(EX.sel || []); EX.sel.has(sn) ? EX.sel.delete(sn) : EX.sel.add(sn); if (!EX.sel.size || EX.sel.size === S.seasons.length) EX.sel = null; }
  document.getElementById('egExSeasons').innerHTML = egExChipsHTML();
  document.getElementById('egExSelLabel').textContent = seasonsLabel(EX.sel);
  egDraw();
}
// Draw the picture into the popup's canvas (full size; CSS scales it down to preview)
async function egDraw() {
  const cv = document.getElementById('egExCanvas'), box = document.getElementById('egExPreview');
  if (!cv) return;
  const token = ++EX.token;
  box.classList.add('busy'); box.dataset.size = EX.size; egExPanel?.setPrimary({ disabled: true });
  try {
    // the shared drawing (ep-chart.js — also the Export Studio's), offscreen first so an older preview never wins
    const off = document.createElement('canvas');
    await MSSEpChart.draw(off, S, { size: EX.size, theme: EX.theme, source: EX.source || S.source, seasons: seasonsIn(EX.sel), label: seasonsLabel(EX.sel), userId: _egUser.id });
    if (token !== EX.token) return;
    cv.width = off.width; cv.height = off.height; cv.getContext('2d').drawImage(off, 0, 0);
  } catch (err) { console.error('Export:', err); if (token === EX.token) showToast('Couldn’t make the image — try again.', 'err'); }
  if (token !== EX.token) return;
  box.classList.remove('busy'); egExPanel?.setPrimary({ disabled: false });
}
async function egSaveImage() {
  const cv = document.getElementById('egExCanvas'); if (!cv) return;
  const name = `${S.show.name.replace(/[^\w]+/g, '-').toLowerCase()}-episodes${EX.sel && EX.sel.size ? '-' + seasonsLabel(EX.sel).replace(/[^\w]+/g, '-').toLowerCase() : ''}-${EX.size}.png`;
  try { await mssSaveImage(cv, name, document.getElementById('egExPreview')); }
  catch (err) { console.error('Export:', err); showToast('Couldn’t save the image — try a different browser.', 'err'); }
}
// Copy the picture to the clipboard as a PNG (as Create Card's Copy image) — not while a new preview is still drawing
async function egCopyImage() {
  const cv = document.getElementById('egExCanvas'), box = document.getElementById('egExPreview');
  if (!cv || !cv.width || box?.classList.contains('busy')) return;
  try {
    const blob = new Promise((ok, no) => cv.toBlob(b => b ? ok(b) : no(new Error('no image')), 'image/png'));
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
    showToast('Image copied — paste it anywhere.');
  } catch (err) { console.error('Copy image:', err); showToast('Couldn’t copy the image here — use Save image instead.', 'err'); }
}
function egCSV() {
  const rows = [['Show', 'Season', 'Episode', 'Title', 'Score', 'Band', 'Tags', 'Note', 'Rated']];
  Object.values(S.mine).filter(r => seasonsIn(EX.sel).includes(r.season_number)).sort((a, b) => a.season_number - b.season_number || a.episode_number - b.episode_number).forEach(r => {
    const ep = r.episode_number ? (S.eps[r.season_number] || []).find(x => x.n === r.episode_number) : null;
    rows.push([S.show.name, r.season_number, r.episode_number || 'Season', r.episode_number ? (ep?.name || '') : `Season ${r.season_number}`, mssR1(Number(r.score)), MSSEp.band(r.score).name, (r.tags || []).join('; '), r.note || '', (r.updated_at || '').slice(0, 10)]);
  });
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `${S.show.name.replace(/[^\w]+/g, '-').toLowerCase()}-episode-ratings.csv`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

document.addEventListener('DOMContentLoaded', () => {
  initPage(async user => {
    _egUser = user;
    try { if (_egShowId) await renderShow(); else if (!user) renderGuestHome(); else await renderHome(); }
    catch (err) {
      console.error('Episodes:', err);
      mssErrorPage(mssErrorKind(err), { error: err });
    }
  });
});
</script>
