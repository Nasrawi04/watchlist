<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyScreenScore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  /* Hide nav search bar on home page — hero search replaces it */
  .search-wrap { display:none !important; }
  .nav-icon-btn { display:none !important; }
  .mobile-search-bar { display:none !important; }
  .home-hero { padding-bottom: 0.5rem; }

  /* ── Explore — highlighted Discover shortcuts ──
     Cinematic cards: the category's top poster as a blurred backdrop under
     a colored wash, a fanned stack of its top 3 posters, a bold title and
     an Explore pill. Scrolls as a slow infinite marquee (pauses on hover,
     static swipeable row for people who prefer reduced motion). */
  .xp { margin:0 0 3rem; }
  .xp-head { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-bottom:1.1rem; }
  .xp-all { display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--olive-light); text-decoration:none; white-space:nowrap; }
  .xp-all svg { width:13px; height:13px; transition:transform .2s; }
  .xp-all:hover svg { transform:translateX(3px); }
  .xp-marquee {
    overflow:hidden; margin:0 -4px; padding:10px 4px 18px;
    -webkit-mask-image:linear-gradient(to right, transparent 0, #000 5%, #000 95%, transparent 100%);
    mask-image:linear-gradient(to right, transparent 0, #000 5%, #000 95%, transparent 100%);
  }
  .xp-track { display:flex; width:max-content; animation:xpScroll 70s linear infinite; }
  .xp-marquee:hover .xp-track, .xp-marquee:focus-within .xp-track { animation-play-state:paused; }
  .xp-group { display:flex; gap:18px; padding-right:18px; flex-shrink:0; }
  @keyframes xpScroll { from { transform:translateX(0); } to { transform:translateX(-50%); } }

  .xp-card {
    --xp-a:#1E5C26; --xp-b:#0F2D14;
    position:relative; flex-shrink:0; width:360px; height:200px; border-radius:18px; overflow:hidden;
    display:flex; align-items:stretch; text-decoration:none; color:#fff; isolation:isolate;
    background:linear-gradient(135deg, var(--xp-a), var(--xp-b));
    box-shadow:0 10px 28px rgba(0,0,0,.22), inset 0 0 0 1px rgba(255,255,255,.08);
    transition:transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s;
  }
  .xp-card:hover { transform:translateY(-6px) scale(1.015); box-shadow:0 20px 44px rgba(0,0,0,.32), inset 0 0 0 1px rgba(255,255,255,.14); }
  .xp-bg {
    position:absolute; inset:-24px; z-index:-2; background-size:cover; background-position:center 30%;
    filter:blur(18px) saturate(1.3); opacity:0; transform:scale(1.1); transition:opacity .6s ease;
  }
  .xp-bg.on { opacity:.55; }
  .xp-shade { position:absolute; inset:0; z-index:-1; background:linear-gradient(100deg, var(--xp-b) 0%, color-mix(in srgb, var(--xp-a) 78%, transparent) 55%, rgba(0,0,0,.15) 100%); }
  .xp-num {
    position:absolute; right:-8px; bottom:-22px; z-index:-1; font-family:var(--bebas); font-size:150px; line-height:1;
    color:rgba(255,255,255,.07); letter-spacing:-2px; pointer-events:none;
  }
  .xp-text { position:relative; flex:1; min-width:0; padding:20px 0 20px 22px; display:flex; flex-direction:column; }
  .xp-badge {
    align-self:flex-start; font-family:var(--sans); font-size:10px; font-weight:700; letter-spacing:1.4px; text-transform:uppercase;
    padding:4px 10px; border-radius:999px; background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.22);
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); margin-bottom:10px;
  }
  .xp-title { font-family:var(--serif); font-weight:600; font-size:24px; line-height:1.1; margin-bottom:6px; text-shadow:0 2px 14px rgba(0,0,0,.45); white-space:nowrap; }
  .xp-text { z-index:1; padding-right:22px; }
  .xp-sub, .xp-badge { max-width:calc(100% - 118px); }
  .xp-sub { font-size:12.5px; color:rgba(255,255,255,.82); line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .xp-cta {
    margin-top:auto; align-self:flex-start; display:inline-flex; align-items:center; gap:7px;
    padding:8px 14px; border-radius:999px; background:#fff; color:var(--xp-b);
    font-family:var(--sans); font-size:12.5px; font-weight:700; transition:gap .2s, padding .2s;
  }
  .xp-cta svg { width:13px; height:13px; }
  .xp-card:hover .xp-cta { gap:11px; padding-right:12px; }
  /* Fanned stack of the category's top 3 posters */
  .xp-fan { position:absolute; top:0; right:0; bottom:0; width:140px; z-index:0; pointer-events:none; }
  .xp-p {
    position:absolute; bottom:-14px; width:84px; aspect-ratio:2/3; border-radius:8px; overflow:hidden;
    background:rgba(255,255,255,.12); box-shadow:0 10px 24px rgba(0,0,0,.4); border:1px solid rgba(255,255,255,.18);
    transition:transform .35s cubic-bezier(.2,.8,.2,1);
  }
  .xp-p img { width:100%; height:100%; object-fit:cover; display:block; }
  .xp-p:nth-child(1) { right:66px; transform:rotate(-11deg) translateY(10px); z-index:1; }
  .xp-p:nth-child(2) { right:38px; transform:rotate(-3deg);  z-index:2; }
  .xp-p:nth-child(3) { right:10px; transform:rotate(7deg) translateY(6px); z-index:3; }
  .xp-card:hover .xp-p:nth-child(1) { transform:rotate(-15deg) translate(-8px, 2px); }
  .xp-card:hover .xp-p:nth-child(2) { transform:rotate(-3deg) translateY(-10px); }
  .xp-card:hover .xp-p:nth-child(3) { transform:rotate(11deg) translate(8px, 0); }

  @media(max-width:640px) {
    .xp { margin-bottom:2.25rem; }
    .xp-card { width:292px; height:172px; border-radius:16px; }
    .xp-title { font-size:20px; }
    .xp-sub { font-size:11.5px; }
    .xp-text { padding:16px 0 16px 18px; }
    .xp-fan { width:108px; }
    .xp-sub, .xp-badge { max-width:calc(100% - 96px); }
    .xp-p { width:68px; }
    .xp-p:nth-child(1) { right:52px; } .xp-p:nth-child(2) { right:30px; } .xp-p:nth-child(3) { right:8px; }
    .xp-num { font-size:120px; }
    .xp-track { animation-duration:55s; }
    .xp-group { gap:14px; padding-right:14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .xp-marquee { overflow-x:auto; -webkit-mask-image:none; mask-image:none; scrollbar-width:none; }
    .xp-track { animation:none; }
    .xp-group + .xp-group { display:none; }
  }

  /* TMDB-sourced home cards (Trending/Top Picks/Upcoming/Recently Viewed) —
     poster-fallback letter and year text, scaled to match how .q-card
     itself already shrinks at the site's existing breakpoints. */
  .home-tmdb-poster-fallback {
    width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    background:var(--bg-3); font-family:var(--serif); color:var(--olive-light);
    font-size:clamp(22px, 6vw, 32px);
  }
  .home-tmdb-year { font-family:var(--bebas); color:var(--text-3); font-size:clamp(15px, 3.3vw, 17px); }
  @media(max-width:640px) {
    .home-tmdb-poster-fallback { font-size:26px; }
    .home-tmdb-year { font-size:12px; }
  }
  @media(max-width:400px) {
    .home-tmdb-poster-fallback { font-size:22px; }
    .home-tmdb-year { font-size:11px; }
  }
</style>
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1E5C26">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MyScreenScore">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
</head>
<body>

<div class="page-wrap">
  <!-- HERO -->
  <div class="home-hero fade-up">
    <div class="home-eyebrow">Your personal entertainment archive</div>
    <h1 class="home-title">My <em>Screen</em> Score</h1>
    <p class="home-sub">Build your collection, track your progress, rate every watch, and create rankings that reflect your taste.</p>
  </div>

  <!-- HERO SEARCH -->
  <div class="hero-search-wrap fade-up" style="margin:1rem 0 2.5rem;">
    <input type="text" id="heroSearch" placeholder="Search movies, shows, anime…" autocomplete="off">
    <button type="button" class="hero-search-btn" tabindex="-1" onclick="document.getElementById('heroSearch').focus()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <span>Search</span>
    </button>
  </div>

  <!-- EXPLORE — highlighted Discover shortcuts (cards built in JS) -->
  <section class="xp fade-up" aria-label="Explore Discover">
    <div class="xp-head">
      <div>
        <div class="section-eyebrow">Discover</div>
        <div class="section-title" style="margin-bottom:0">Start Exploring</div>
      </div>
      <a class="xp-all" href="discover.html">See all <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></a>
    </div>
    <div class="xp-marquee">
      <div class="xp-track" id="xpTrack"></div>
    </div>
  </section>

  <!-- CURRENTLY WATCHING -->
  <div id="homeWatching" style="margin-top:4rem"></div>

  <!-- FROM YOUR WATCHLIST -->
  <div id="homeWatchlist" style="margin-top:3rem"></div>

  <!-- RECENTLY VIEWED (MyScreenScore view history) -->
  <div id="homeRecentlyViewed" style="margin-top:3rem"></div>

  <!-- GUEST SIGN-IN CTA (shown only when logged out) -->
  <div id="guestCta" style="margin-top:3rem"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/nav.js"></script>
<script src="js/discover-categories.js"></script>
<script>
let _homeUser = null;

/* ── Explore cards ── */
const _XP_ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';
const HOME_EXPLORE = [
  { key:'top_rated_mss',   title:'Top Rated on MSS', sub:'Highest rated by our community', badge:'Community Pick', num:'MSS', a:'#2E7D32', b:'#0E2F14' },
  { key:'popular',         title:"What's Popular",    sub:'Trending across the board',     badge:'Trending',       num:'HOT', a:'#8A5A1C', b:'#2B1A08' },
  { key:'top250_movies',   title:'Top 250 Movies',    sub:'The best movies ever, ranked',      badge:'Ranked',         num:'250', a:'#9C3D1C', b:'#2E1007' },
  { key:'top250_shows',    title:'Top 250 Shows',     sub:'The best TV ever made, ranked',               badge:'Ranked',         num:'250', a:'#2F5F8A', b:'#0C1D2E' },
  { key:'top250_anime',    title:'Top 250 Anime',     sub:'The best anime, ranked',    badge:'Ranked',         num:'250', a:'#7A3E78', b:'#240F24' },
  { key:'top250_cartoons', title:'Top 250 Cartoons',  sub:'The best cartoons, ranked',     badge:'Ranked',         num:'250', a:'#3F7A6E', b:'#0D2520' },
];

function _xpCardHTML(c) {
  const href = `discover-list.html?list=${encodeURIComponent(c.key)}&title=${encodeURIComponent(c.title)}`;
  return `<a class="xp-card" data-xp="${c.key}" href="${href}" style="--xp-a:${c.a};--xp-b:${c.b};">
    <div class="xp-bg"></div>
    <div class="xp-shade"></div>
    <div class="xp-num">${c.num}</div>
    <div class="xp-text">
      <span class="xp-badge">${_homeEsc(c.badge)}</span>
      <div class="xp-title">${_homeEsc(c.title)}</div>
      <div class="xp-sub">${_homeEsc(c.sub)}</div>
      <span class="xp-cta">Explore ${_XP_ARROW}</span>
    </div>
    <div class="xp-fan"><div class="xp-p"></div><div class="xp-p"></div><div class="xp-p"></div></div>
  </a>`;
}

function _xpRender() {
  const track = document.getElementById('xpTrack');
  if (!track) return;
  const group = HOME_EXPLORE.map(_xpCardHTML).join('');
  // Two identical groups make the loop seamless; the copy is hidden from screen readers
  track.innerHTML = `<div class="xp-group">${group}</div><div class="xp-group" aria-hidden="true">${group.replace(/<a /g, '<a tabindex="-1" ')}</div>`;
}

function _xpFill(key, items) {
  const posters = (items || []).map(it => it.poster_url).filter(u => safeURL(u)).slice(0, 3);
  if (!posters.length) return;
  document.querySelectorAll(`.xp-card[data-xp="${key}"]`).forEach(card => {
    const bg = card.querySelector('.xp-bg');
    bg.style.backgroundImage = cssURL(posters[0]);
    bg.classList.add('on');
    card.querySelectorAll('.xp-p').forEach((p, i) => {
      const u = posters[i];
      p.innerHTML = u ? `<img src="${safeURL(u)}" alt="" loading="lazy" onerror="mssImgError(this)">` : '';
      p.style.display = u ? '' : 'none';
    });
  });
}

// Uses Discover's session cache when it's warm; otherwise fetches page 1
// (staggered, and cached for Discover to reuse).
function _xpLoad() {
  HOME_EXPLORE.forEach((c, i) => {
    let cached = null;
    try {
      const x = JSON.parse(sessionStorage.getItem('disc_cache_' + c.key) || 'null');
      if (x && Date.now() - x.t < 15 * 60 * 1000) cached = x.items;
    } catch {}
    if (cached) { _xpFill(c.key, cached); return; }
    const cat = typeof getDiscoverCategory === 'function' ? getDiscoverCategory(c.key) : null;
    if (!cat) return;
    setTimeout(async () => {
      try {
        const items = await cat.fetch(1);
        try { sessionStorage.setItem('disc_cache_' + c.key, JSON.stringify({ t: Date.now(), items: items.slice(0, 12) })); } catch {}
        _xpFill(c.key, items);
      } catch (e) { /* card keeps its colored look without posters */ }
    }, i * 250);
  });
}

const _NAV_LEFT_SVG  = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>`;
const _NAV_RIGHT_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>`;

function _homeEsc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Shared horizontal-scroll section shell — used by all five home sections.
function _homeHScrollSection(containerId, gridId, eyebrow, title, cardsHTML) {
  const el = document.getElementById(containerId);
  if (!el) return;
  if (!cardsHTML) { el.innerHTML = ''; return; }
  el.innerHTML = `
    <div class="section-eyebrow">${eyebrow}</div>
    <div class="section-title">${title}</div>
    <div class="grid-nav-wrap">
      <button class="grid-nav-btn arr-left" onclick="event.stopPropagation();document.getElementById('${gridId}').scrollBy({left:-660,behavior:'smooth'})" aria-label="Scroll left">${_NAV_LEFT_SVG}</button>
      <button class="grid-nav-btn arr-right" onclick="event.stopPropagation();document.getElementById('${gridId}').scrollBy({left:660,behavior:'smooth'})" aria-label="Scroll right">${_NAV_RIGHT_SVG}</button>
      <div class="queue-grid" id="${gridId}">${cardsHTML}</div>
    </div>`;
}

// Card for a TMDB-sourced item (Trending/Top Picks/Upcoming/Recently Viewed) —
// these aren't local library entries, so they use their own light card
// instead of posterHTML()/genreHTML() which expect the local entry shape.
function _tmdbCardHTML(posterUrl, title, year, onclick) {
  const posterInner = safeURL(posterUrl)
    ? `<img src="${safeURL(posterUrl)}" loading="lazy" style="width:100%;height:100%;object-fit:cover;">`
    : `<div class="home-tmdb-poster-fallback">${_homeEsc((title||'?')[0].toUpperCase())}</div>`;
  return `<div class="q-card" onclick="${onclick}">
    <div class="q-poster" style="position:relative">${posterInner}<div class="q-poster-overlay"></div></div>
    <div class="q-info">
      <div class="title-year-row"><div class="q-title" style="margin-bottom:0;">${_homeEsc(title)}</div>${year ? `<span class="title-year-inline">${_homeEsc(year)}</span>` : ''}</div>
    </div>
  </div>`;
}

function renderHomeWatchlist(entries) {
  const all = entries.filter(e => e.status === 'queue');
  // Fisher-Yates shuffle — a fresh random sample each page load, instead of
  // always the same items in the same order.
  const shuffled = [...all];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  const queue = shuffled.slice(0, 12);
  const cards = queue.map(e => `<div class="q-card" onclick="goToDetail('${e.id}','index.html')">
    <div class="q-poster" style="position:relative">${posterHTML(e,'big')}<div class="q-poster-overlay"></div>${getTypeBadgeOverlay(e,'latest')}</div>
    <div class="q-info"><div class="title-year-row"><div class="q-title" style="margin-bottom:0;">${escHTML(e.title)}</div>${e.year ? `<span class="title-year-inline">${escHTML(e.year)}</span>` : ''}</div></div>
  </div>`).join('');
  _homeHScrollSection('homeWatchlist', 'homeWatchlistGrid', 'Saved', 'From Your Watchlist', cards);
}
function renderHomeRecentlyViewed(rows) {
  const cards = rows.map(r => _tmdbCardHTML(r.poster_url, r.title, null, `goToTitle('${r.tmdb_type}', ${r.tmdb_id})`)).join('');
  _homeHScrollSection('homeRecentlyViewed', 'homeRecentlyViewedGrid', 'History', 'Recently Viewed', cards);
}

function renderGuestLanding() {
  document.getElementById('homeWatching').innerHTML = '';
  document.getElementById('homeWatchlist').innerHTML = '';
  document.getElementById('homeRecentlyViewed').innerHTML = '';
  document.getElementById('guestCta').innerHTML = `
    <div class="guest-cta">
      <a href="login.html" class="guest-btn-primary">Sign In</a>
      <a href="login.html#signup" class="guest-btn-secondary">Create Account</a>
    </div>`;
}

// Returning via browser back/forward can restore this page from the
// bfcache with stale data (e.g. an entry just added/edited elsewhere
// wouldn't show up here) instead of re-running this page's scripts.
window.addEventListener('pageshow', (event) => {
  if (event.persisted) location.reload();
});

document.addEventListener('DOMContentLoaded', () => {
  _xpRender();   // cards show instantly in their colors; posters fill in as they load
  _xpLoad();
  initDiscoverSearch('heroSearch', { max: 20, connected: true, includePersons: true });
  initPageGuest(async (user) => {
    if (!user) { renderGuestLanding(); return; }
    _homeUser = user;

    const entries = await getEntries(user.id);
    window._homeEntries = entries;

    /* Currently watching */
    const watching = entries.filter(e => e.status === 'watching');
    if (watching.length) {
      document.getElementById('homeWatching').innerHTML = `
        <div class="section-eyebrow">In Progress</div>
        <div class="section-title">Currently Watching</div>
        <div class="watch-list">
          ${watching.slice(0, 6).map(e => {
            const isM = e.cat === 'movies' || (e.ratings && e.ratings._media_type === 'movie');
            const pct = e.total_eps ? Math.round(((e.watched||0) / e.total_eps) * 100) : 0;
            const epStr = isM ? '' : (e.season != null ? `S${e.season} · E${e.episode ?? 0}` : (e.watched ? `Ep ${e.watched}` : ''));
            const rtH = Number(e.runtime_h)||0, rtM = Number(e.runtime_m)||0;
            const rtStr = isM && (rtH||rtM) ? (rtH ? `${rtH}h ${rtM}m` : `${rtM}m`) : '';
            const typeBadge = `<span class="${isM ? 'type-label' : 'type-label type-label-tv'}">${isM ? 'Movie' : 'TV Show'}</span>`;
            return `<div class="w-card" onclick="goToDetail('${e.id}','index.html')">
              <div class="w-poster">${posterHTML(e)}</div>
              <div class="w-body">
                <div class="w-top"><div class="w-title" style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;">${escHTML(e.title)}${e.year ? `<span style="font-family:var(--bebas);font-size:18px;font-weight:400;color:var(--text-3);">${escHTML(e.year)}</span>` : ''}${typeof rewatchBadgeHTML === 'function' && getRewatchCount(e) > 1 ? rewatchBadgeHTML(e) : ''}</div></div>
                ${epStr ? `<div class="w-ep-row">${typeBadge}<span class="w-ep-badge">${epStr}</span></div>` : ''}
                ${rtStr ? `<div class="w-ep-row">${typeBadge}<span class="w-ep-badge">${rtStr}</span></div>` : ''}
                ${!epStr && !rtStr ? `<div class="w-ep-row">${typeBadge}</div>` : ''}
                ${(!isM && e.total_eps) ? `<div class="w-prog-track" style="margin-top:6px;"><div class="w-prog-fill" style="width:${pct}%"></div></div><div class="w-prog-label">${e.watched||0} / ${e.total_eps} eps · ${pct}%</div>` : (!isM && e.watched ? `<div class="w-prog-label">${e.watched} watched</div>` : '')}
              </div>
            </div>`;
          }).join('')}
        </div>`;
    }

    /* New discovery sections — TMDB fetches run in parallel with each other
       and don't block the rest of the page; local sections (Watchlist,
       Recently Viewed) render as soon as their own data is back. */
    renderHomeWatchlist(entries);

    getRecentlyViewed(user.id, 12).then(renderHomeRecentlyViewed);

  });
});
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(r => {
        console.log('SW registered:', r.scope);
        // Show toast only on first install
        if (r.installing) {
          r.installing.addEventListener('statechange', e => {
            if (e.target.state === 'activated') {
              showToast && showToast('App installed and cached.');
            }
          });
        }
      })
      .catch(e => console.warn('SW failed:', e));
  });
}
if (!navigator.onLine) { window.location.replace('offline.html'); }
window.addEventListener('offline', () => { window.location.replace('offline.html'); });
setTimeout(() => {
  if (!navigator.onLine) window.location.replace('offline.html');
}, 10000);
</script>
