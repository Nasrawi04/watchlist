<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyScreenScore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  /* Hide nav search bar on home page — hero search replaces it */
  .search-wrap { display:none !important; }
  .nav-icon-btn { display:none !important; }
  .mobile-search-bar { display:none !important; }
  .home-hero { padding-bottom: 0.5rem; }

  /* TMDB-sourced home cards (Trending/Top Picks/Upcoming/Recently Viewed) —
     poster-fallback letter and year text, scaled to match how .q-card
     itself already shrinks at the site's existing breakpoints. */
  .home-tmdb-poster-fallback {
    width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    background:var(--bg-3); font-family:var(--serif); color:var(--olive-light);
    font-size:clamp(22px, 6vw, 32px);
  }
  .home-tmdb-year { color:var(--text-3); font-size:clamp(11px, 2.6vw, 13px); }
  @media(max-width:640px) {
    .home-tmdb-poster-fallback { font-size:26px; }
    .home-tmdb-year { font-size:12px; }
  }
  @media(max-width:400px) {
    .home-tmdb-poster-fallback { font-size:22px; }
    .home-tmdb-year { font-size:11px; }
  }
</style>
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1E5C26">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MyScreenScore">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
</head>
<body>

<div class="page-wrap">
  <!-- HERO -->
  <div class="home-hero fade-up">
    <div class="home-eyebrow">Your personal entertainment archive</div>
    <h1 class="home-title">My <em>Screen</em> Score</h1>
    <p class="home-sub">Build your collection, track your progress, rate every watch, and create rankings that reflect your taste.</p>
  </div>

  <!-- HERO SEARCH -->
  <div class="hero-search-wrap fade-up" style="margin:1rem 0 2.5rem;">
    <input type="text" id="heroSearch" placeholder="Search movies, shows, anime…" autocomplete="off">
    <button type="button" class="hero-search-btn" tabindex="-1" onclick="document.getElementById('heroSearch').focus()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <span>Search</span>
    </button>
  </div>

  <!-- CATEGORY CARDS -->
  <div class="category-grid" id="categoryGrid">
    <div class="page-loading" style="grid-column:1/-1"><div class="spinner"></div></div>
  </div>

  <!-- CURRENTLY WATCHING -->
  <div id="homeWatching" style="margin-top:4rem"></div>

  <!-- TRENDING THIS WEEK (TMDB) -->
  <div id="homeTrending" style="margin-top:3rem"></div>

  <!-- TOP PICKS (TMDB top rated) -->
  <div id="homeTopPicks" style="margin-top:3rem"></div>

  <!-- UPCOMING (TMDB) -->
  <div id="homeUpcoming" style="margin-top:3rem"></div>

  <!-- FROM YOUR WATCHLIST -->
  <div id="homeWatchlist" style="margin-top:3rem"></div>

  <!-- RECENTLY VIEWED (MyScreenScore view history) -->
  <div id="homeRecentlyViewed" style="margin-top:3rem"></div>

  <!-- FRIEND COMMENTS INBOX -->
  <div id="homeComments" style="margin-top:3rem"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/nav.js"></script>
<script>
let _homeUser = null;
let _commentsOpen = false;
function _toggleComments() {
  _commentsOpen = !_commentsOpen;
  document.getElementById('commentsList').style.display = _commentsOpen ? 'flex' : 'none';
  document.getElementById('commentsChev').classList.toggle('open', _commentsOpen);
}

const _NAV_LEFT_SVG  = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>`;
const _NAV_RIGHT_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>`;

function _homeEsc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Shared horizontal-scroll section shell — used by all five home sections.
function _homeHScrollSection(containerId, gridId, eyebrow, title, cardsHTML) {
  const el = document.getElementById(containerId);
  if (!el) return;
  if (!cardsHTML) { el.innerHTML = ''; return; }
  el.innerHTML = `
    <div class="section-eyebrow">${eyebrow}</div>
    <div class="section-title">${title}</div>
    <div class="grid-nav-wrap">
      <button class="grid-nav-btn arr-left" onclick="event.stopPropagation();document.getElementById('${gridId}').scrollBy({left:-660,behavior:'smooth'})" aria-label="Scroll left">${_NAV_LEFT_SVG}</button>
      <button class="grid-nav-btn arr-right" onclick="event.stopPropagation();document.getElementById('${gridId}').scrollBy({left:660,behavior:'smooth'})" aria-label="Scroll right">${_NAV_RIGHT_SVG}</button>
      <div class="queue-grid" id="${gridId}">${cardsHTML}</div>
    </div>`;
}

// Card for a TMDB-sourced item (Trending/Top Picks/Upcoming/Recently Viewed) —
// these aren't local library entries, so they use their own light card
// instead of posterHTML()/genreHTML() which expect the local entry shape.
function _tmdbCardHTML(posterUrl, title, year, onclick) {
  const posterInner = posterUrl
    ? `<img src="${posterUrl}" loading="lazy" style="width:100%;height:100%;object-fit:cover;">`
    : `<div class="home-tmdb-poster-fallback">${_homeEsc((title||'?')[0].toUpperCase())}</div>`;
  return `<div class="q-card" onclick="${onclick}">
    <div class="q-poster" style="position:relative">${posterInner}<div class="q-poster-overlay"></div></div>
    <div class="q-info">
      <div class="q-title">${_homeEsc(title)}</div>
      ${year ? `<div class="q-genre home-tmdb-year">${_homeEsc(year)}</div>` : ''}
    </div>
  </div>`;
}

// ── TMDB fetchers ──
async function _fetchTrendingWeek() {
  try {
    const res = await fetch(`${TMDB_BASE}/trending/all/week?api_key=${TMDB_KEY}&language=en-US`);
    if (!res.ok) throw new Error('Trending fetch failed: ' + res.status);
    const data = await res.json();
    return (data.results || [])
      .filter(r => r.media_type === 'movie' || r.media_type === 'tv')
      .slice(0, 12)
      .map(r => ({
        id: r.id, media_type: r.media_type,
        title: r.title || r.name, poster_path: r.poster_path,
        year: ((r.release_date || r.first_air_date) || '').split('-')[0],
      }));
  } catch (e) { console.error('Trending fetch error:', e); return []; }
}

async function _fetchTopPicks() {
  // TMDB has no personalized "picks for you" without per-user TMDB login —
  // this uses TMDB's own top-rated lists (movies + TV, interleaved) as the
  // closest real equivalent.
  try {
    const [movRes, tvRes] = await Promise.all([
      fetch(`${TMDB_BASE}/movie/top_rated?api_key=${TMDB_KEY}&language=en-US`),
      fetch(`${TMDB_BASE}/tv/top_rated?api_key=${TMDB_KEY}&language=en-US`),
    ]);
    if (!movRes.ok || !tvRes.ok) throw new Error('Top Picks fetch failed');
    const [movData, tvData] = await Promise.all([movRes.json(), tvRes.json()]);
    const movies = (movData.results || []).slice(0, 6).map(r => ({ id:r.id, media_type:'movie', title:r.title, poster_path:r.poster_path, year:(r.release_date||'').split('-')[0] }));
    const shows  = (tvData.results  || []).slice(0, 6).map(r => ({ id:r.id, media_type:'tv',    title:r.name,  poster_path:r.poster_path, year:(r.first_air_date||'').split('-')[0] }));
    const merged = [];
    for (let i = 0; i < 6; i++) { if (movies[i]) merged.push(movies[i]); if (shows[i]) merged.push(shows[i]); }
    return merged;
  } catch (e) { console.error('Top Picks fetch error:', e); return []; }
}

async function _fetchUpcoming() {
  // TV has no clean "upcoming" equivalent on TMDB, so this leans on movies.
  try {
    const res = await fetch(`${TMDB_BASE}/movie/upcoming?api_key=${TMDB_KEY}&language=en-US&region=US`);
    if (!res.ok) throw new Error('Upcoming fetch failed: ' + res.status);
    const data = await res.json();
    return (data.results || []).slice(0, 12).map(r => ({
      id: r.id, media_type: 'movie', title: r.title, poster_path: r.poster_path,
      year: (r.release_date || '').split('-')[0],
    }));
  } catch (e) { console.error('Upcoming fetch error:', e); return []; }
}

function renderHomeTrending(items) {
  const cards = items.map(it => _tmdbCardHTML(it.poster_path ? TMDB_FULL + it.poster_path : null, it.title, it.year, `goToTitle('${it.media_type}', ${it.id})`)).join('');
  _homeHScrollSection('homeTrending', 'homeTrendingGrid', 'Discover', 'Trending This Week', cards);
}
function renderHomeTopPicks(items) {
  const cards = items.map(it => _tmdbCardHTML(it.poster_path ? TMDB_FULL + it.poster_path : null, it.title, it.year, `goToTitle('${it.media_type}', ${it.id})`)).join('');
  _homeHScrollSection('homeTopPicks', 'homeTopPicksGrid', 'Discover', 'Top Picks', cards);
}
function renderHomeUpcoming(items) {
  const cards = items.map(it => _tmdbCardHTML(it.poster_path ? TMDB_FULL + it.poster_path : null, it.title, it.year, `goToTitle('${it.media_type}', ${it.id})`)).join('');
  _homeHScrollSection('homeUpcoming', 'homeUpcomingGrid', 'Discover', 'Upcoming', cards);
}
function renderHomeWatchlist(entries) {
  const all = entries.filter(e => e.status === 'queue');
  // Fisher-Yates shuffle — a fresh random sample each page load, instead of
  // always the same items in the same order.
  const shuffled = [...all];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  const queue = shuffled.slice(0, 12);
  const cards = queue.map(e => `<div class="q-card" onclick="goToDetail('${e.id}','index.html')">
    <div class="q-poster" style="position:relative">${posterHTML(e,'big')}<div class="q-poster-overlay"></div>${getTypeBadgeOverlay(e,'latest')}</div>
    <div class="q-info"><div class="q-title">${e.title}</div><div class="q-genre">${genreHTML(e.genres,3)}</div></div>
  </div>`).join('');
  _homeHScrollSection('homeWatchlist', 'homeWatchlistGrid', 'Saved', 'From Your Watchlist', cards);
}
function renderHomeRecentlyViewed(rows) {
  const cards = rows.map(r => _tmdbCardHTML(r.poster_url, r.title, null, `goToTitle('${r.tmdb_type}', ${r.tmdb_id})`)).join('');
  _homeHScrollSection('homeRecentlyViewed', 'homeRecentlyViewedGrid', 'History', 'Recently Viewed', cards);
}

function renderGuestLanding() {
  // Show category cards as previews — same style as logged-in home
  document.getElementById('categoryGrid').innerHTML = Object.entries(CAT_META).map(([k, m], i) =>
    `<a class="cat-card fade-up fade-up-${i+1}" href="${m.page}">
      <div class="cat-icon">${icon(m.icon, 20)}</div>
      <div class="cat-card-content">
        <div class="cat-card-title">${m.label}</div>
        <div class="cat-card-count">Sign in to track</div>
      </div>
      <div class="cat-card-arrow">→</div>
    </a>`
  ).join('');
  document.getElementById('homeWatching').innerHTML = '';
  document.getElementById('homeWatchlist').innerHTML = '';
  document.getElementById('homeRecentlyViewed').innerHTML = '';
  document.getElementById('homeComments').innerHTML = `
    <div class="guest-cta">
      <a href="login.html" class="guest-btn-primary">Sign In</a>
      <a href="login.html#signup" class="guest-btn-secondary">Create Account</a>
    </div>`;

  // Discovery sections are public TMDB content — no login needed, and a
  // nice way for a guest to see what the app is about before signing up.
  _fetchTrendingWeek().then(renderHomeTrending);
  _fetchTopPicks().then(renderHomeTopPicks);
  _fetchUpcoming().then(renderHomeUpcoming);
}

document.addEventListener('DOMContentLoaded', () => {
  initDiscoverSearch('heroSearch', { max: 20, connected: true, includePersons: true });
  initPageGuest(async (user) => {
    if (!user) { renderGuestLanding(); return; }
    _homeUser = user;

    const entries = await getEntries(user.id);
    window._homeEntries = entries;

    /* Category cards */
    document.getElementById('categoryGrid').innerHTML = Object.entries(CAT_META).map(([k, m], i) => {
      const catEntries = entries.filter(e => e.cat === k);
      const watching   = catEntries.filter(e => e.status === 'watching').length;
      const completed  = catEntries.filter(e => e.status === 'completed').length;
      const queue      = catEntries.filter(e => e.status === 'queue').length;
      const countLabel = catEntries.length === 1 ? m.singular : m.label;
      const subtitle   = k === 'movies'
        ? `${catEntries.length} ${countLabel} · ${queue} in queue · ${completed} completed`
        : `${catEntries.length} ${countLabel} · ${watching} watching · ${completed} completed`;
      return `<a class="cat-card fade-up fade-up-${i+1}" href="${m.page}">
        <div class="cat-icon">${icon(m.icon, 20)}</div>
        <div class="cat-card-content">
          <div class="cat-card-title">${m.label}</div>
          <div class="cat-card-count">${subtitle}</div>
        </div>
        <div class="cat-card-arrow">→</div>
      </a>`;
    }).join('');

    /* Currently watching */
    const watching = entries.filter(e => e.status === 'watching');
    if (watching.length) {
      document.getElementById('homeWatching').innerHTML = `
        <div class="section-eyebrow">In Progress</div>
        <div class="section-title">Currently Watching</div>
        <div class="watch-list">
          ${watching.slice(0, 6).map(e => {
            const pct   = e.total_eps ? Math.round(((e.watched??0) / e.total_eps) * 100) : 0;
            const isMovH = e.cat === 'movies' || e.ratings?._type === 'movie';
            const epStr = !isMovH ? (e.season != null ? `S${e.season} E${e.episode ?? 0}` : (e.watched ? `Ep ${e.watched}` : '')) : '';
            const rtH = Number(e.runtime_h)||0, rtM = Number(e.runtime_m)||0;
            const rtStr = isMovH && (rtH||rtM) ? (rtH ? `${rtH}h ${rtM}m` : `${rtM}m`) : '';
            const cat   = CAT_META[e.cat];
            return `<div class="w-card" onclick="goToDetail('${e.id}','index.html')">
              <div class="w-poster">${posterHTML(e)}</div>
              <div class="w-body">
                <div class="w-top">
                  <div class="w-title">${e.title}</div>
                  <span class="cat-badge-mini" style="color:var(--text-3);display:flex">${icon(cat?.icon||'tv', 13)}</span>
                </div>
                <div class="w-genre">${genreHTML(e.genres, 3)}</div>
                ${epStr ? `<div class="w-ep-row"><span class="w-ep-badge">${epStr}</span><span class="w-ep-total">${e.total_eps ? `/ ${e.total_eps} eps` : ''}</span></div>` : ''}
                ${rtStr ? `<div class="w-ep-row"><span class="w-ep-badge">${rtStr}</span></div>` : ''}
                <div class="w-prog-track"><div class="w-prog-fill" style="width:${pct}%"></div></div>
              </div>
            </div>`;
          }).join('')}
        </div>`;
    }

    /* New discovery sections — TMDB fetches run in parallel with each other
       and don't block the rest of the page; local sections (Watchlist,
       Recently Viewed) render as soon as their own data is back. */
    renderHomeWatchlist(entries);

    getRecentlyViewed(user.id, 12).then(renderHomeRecentlyViewed);

    _fetchTrendingWeek().then(renderHomeTrending);
    _fetchTopPicks().then(renderHomeTopPicks);
    _fetchUpcoming().then(renderHomeUpcoming);
    /* Friend comments inbox */
    const inbox = await getInboxComments(user.id, 8);
    if (inbox.length) {
      document.getElementById('homeComments').innerHTML = `
        <div class="section-eyebrow">Social</div>
        <div class="section-title comments-section-toggle" onclick="_toggleComments()">
          Friend Comments
          <span class="comments-section-chevron" id="commentsChev">${icon('chevdown',18)}</span>
        </div>
        <div id="commentsList" style="display:none;flex-direction:column;gap:10px;margin-top:1rem;">
          ${inbox.map(c => {
            const username = c.profiles?.username || 'Someone';
            const initial  = username[0].toUpperCase();
            const title    = c.entry?.title || 'an entry';
            const cat      = CAT_META[c.entry?.cat];
            const date     = new Date(c.created_at).toLocaleDateString('en-US',{month:'short',day:'numeric'});
            const avatarHTML = c.profiles?.avatar_url
              ? `<div class="comment-inbox-avatar"><img src="${c.profiles.avatar_url}"></div>`
              : `<div class="comment-inbox-avatar">${initial}</div>`;
            return `<div class="comment-inbox-row" style="cursor:pointer" onclick="openHomeComments('${c.entry_id}', this)">
              ${avatarHTML}
              <div class="comment-inbox-body">
                <div class="comment-inbox-who">@${username} <span>commented on</span> <strong>${title}</strong>${cat ? ` <span style="display:inline-flex;align-items:center;vertical-align:middle;opacity:.4;margin-left:2px">${icon(cat.icon,11)}</span>` : ''}</div>
                <div class="comment-inbox-text">"${c.content}"</div>
              </div>
              <div class="comment-inbox-date">${date}</div>
            </div>`;
          }).join('')}
        </div>`;
    }
  });
});
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(r => {
        console.log('SW registered:', r.scope);
        // Show toast only on first install
        if (r.installing) {
          r.installing.addEventListener('statechange', e => {
            if (e.target.state === 'activated') {
              showToast && showToast('App installed and cached.');
            }
          });
        }
      })
      .catch(e => console.warn('SW failed:', e));
  });
}
if (!navigator.onLine) { window.location.replace('offline.html'); }
window.addEventListener('offline', () => { window.location.replace('offline.html'); });
setTimeout(() => {
  if (!navigator.onLine) window.location.replace('offline.html');
}, 10000);
</script>

</style>
<div class="hc-overlay" id="hcOverlay" onclick="if(event.target===this)closeHomeComments()">
  <div class="hc-card">
    <div class="hc-header" style="display:flex;align-items:flex-start;gap:16px;padding:20px;border-bottom:0.5px solid var(--border);flex-shrink:0;">
      <div id="hcPoster" style="width:56px;height:76px;flex-shrink:0;border-radius:var(--radius-sm);overflow:hidden;background:var(--bg-3);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);"></div>
      <div style="flex:1;min-width:0;">
        <div id="hcEntryName" style="font-family:var(--serif);font-size:18px;font-weight:300;line-height:1.2;margin-bottom:4px;color:var(--text);"></div>
        <div id="hcMeta" style="font-size:11px;color:var(--text-3);margin-bottom:6px;display:flex;flex-wrap:wrap;gap:4px;"></div>
        <div id="hcCount" style="font-size:12px;color:var(--olive-light);font-weight:500;display:none;"></div>
      </div>
      <button class="hc-close" onclick="closeHomeComments()">&#x2715;</button>
    </div>
    <div class="hc-list" id="hcList"></div>
    <div class="hc-form">
      <input class="hc-input" id="hcInput" placeholder="Write a comment&hellip;">
      <button class="hc-send" onclick="hcSubmit()">Send</button>
    </div>
  </div>
</div>
<script>
let _hcEntryId = null;
function _hcEsc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function _hcMention(s){ return _hcEsc(s).replace(/(@[\w]+)/g,'<span style="color:var(--olive-light);font-weight:600">$1</span>'); }

function openHomeComments(entryId, rowEl) {
  _hcEntryId = entryId;
  // Find entry data
  var entry = window._homeEntries ? window._homeEntries.find(function(e){ return e.id === entryId; }) : null;
  var strong = rowEl && rowEl.querySelector ? rowEl.querySelector('.comment-inbox-body strong') : null;
  var title = entry ? entry.title : (strong ? strong.textContent : '');
  document.getElementById('hcEntryName').textContent = title;
  // Poster
  var posterEl = document.getElementById('hcPoster');
  if (posterEl) posterEl.innerHTML = entry ? posterHTML(entry) : '';
  // Meta chips
  var metaEl = document.getElementById('hcMeta');
  if (metaEl && entry) {
    var chips = [];
    if (CAT_META && CAT_META[entry.cat] && CAT_META[entry.cat].label) chips.push(CAT_META[entry.cat].label);
    if (entry.genres) entry.genres.slice(0,3).forEach(function(g){ chips.push(g); });
    metaEl.innerHTML = chips.map(function(m){
      return '<span style="background:var(--olive-faint);border:0.5px solid var(--border-olive);color:var(--olive-light);border-radius:12px;padding:1px 6px;font-size:9px;letter-spacing:.3px">'+m+'</span>';
    }).join('');
  } else if (metaEl) { metaEl.innerHTML = ''; }
  document.getElementById('hcCount').style.display = 'none';
  document.getElementById('hcList').innerHTML = '<div class="hc-empty">Loading…</div>';
  document.getElementById('hcOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  hcLoad();
  setTimeout(() => document.getElementById('hcInput').focus(), 300);
}

function closeHomeComments() {
  document.getElementById('hcOverlay').classList.remove('open');
  document.body.style.overflow = '';
  _hcEntryId = null;
}

document.addEventListener('keydown', function(e){ if(e.key==='Escape' && document.getElementById('hcOverlay')?.classList.contains('open')) closeHomeComments(); });
document.getElementById('hcInput').addEventListener('keydown', function(e){
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); hcSubmit(); }
});

async function hcLoad() {
  if (!_hcEntryId) return;
  const list = document.getElementById('hcList');
  const countEl = document.getElementById('hcCount');
  const comments = await getComments(_hcEntryId);
  const me = _homeUser ? _homeUser.id : null;
  if (!comments.length) {
    list.innerHTML = '<div class="hc-empty">No comments yet — be the first!</div>';
    countEl.style.display = 'none';
    return;
  }
  const topLevel = comments.filter(function(c){ return !c.reply_to; });
  const replies  = comments.filter(function(c){ return  c.reply_to; });
  countEl.textContent = comments.length + ' comment' + (comments.length !== 1 ? 's' : '');
  countEl.style.display = 'block';
  list.innerHTML = topLevel.map(function(c) {
    const uname  = _hcEsc(c.profiles && c.profiles.username ? c.profiles.username : 'Unknown');
    const date   = new Date(c.created_at).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
    const canDel = me && c.author_id === me;
    const reps   = replies.filter(function(r){ return r.reply_to === c.id; });
    const repHTML = reps.map(function(r) {
      const runame  = _hcEsc(r.profiles && r.profiles.username ? r.profiles.username : 'Unknown');
      const rdate   = new Date(r.created_at).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
      const rCanDel = me && r.author_id === me;
      return '<div class="det-reply-item" id="hcm-' + r.id + '">'
        + '<div class="det-reply-author">@' + runame + '</div>'
        + '<div class="det-reply-text">' + _hcMention(r.content) + '</div>'
        + '<div class="det-reply-meta"><span>' + rdate + '</span>'
        + (rCanDel ? '<button class="det-comment-del" onclick="hcDelete(\'' + r.id + '\')">' + 'delete</button>' : '')
        + '</div></div>';
    }).join('');
    return '<div class="hc-comment" id="hcm-' + c.id + '">'
      + '<div class="hc-author">@' + uname + '</div>'
      + '<div class="hc-text">' + _hcMention(c.content) + '</div>'
      + '<div class="hc-meta"><span>' + date + '</span>'
      + '<button class="det-comment-reply-btn" onclick="hcReply(\'' + c.id + '\',\'' + uname + '\')">' + 'Reply</button>'
      + (canDel ? '<button class="det-comment-del" onclick="hcDelete(\'' + c.id + '\')">' + 'delete</button>' : '')
      + '</div>'
      + repHTML
      + '<div id="hc-reply-form-' + c.id + '"></div>'
      + '</div>';
  }).join('');
}

let _hcReplyFor = null;

function hcReply(commentId, username) {
  if (_hcReplyFor) {
    var old = document.getElementById('hc-reply-form-' + _hcReplyFor);
    if (old) old.innerHTML = '';
  }
  if (_hcReplyFor === commentId) { _hcReplyFor = null; return; }
  _hcReplyFor = commentId;
  var box = document.getElementById('hc-reply-form-' + commentId);
  if (!box) return;
  // Build reply form with DOM to avoid quoting issues
  var form = document.createElement('div');
  form.className = 'det-reply-form';
  var inp = document.createElement('input');
  inp.className = 'det-reply-input';
  inp.id = 'hc-ri-' + commentId;
  inp.placeholder = 'Reply to @' + username + '…';
  inp.value = '@' + username + ' ';
  inp.addEventListener('keydown', function(e){ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();hcPostReply(commentId);} });
  var sendBtn = document.createElement('button');
  sendBtn.className = 'det-reply-send';
  sendBtn.textContent = 'Send';
  sendBtn.onclick = function(){ hcPostReply(commentId); };
  var cancelBtn = document.createElement('button');
  cancelBtn.className = 'det-comment-del';
  cancelBtn.textContent = '✕';
  cancelBtn.style.marginLeft = '4px';
  cancelBtn.onclick = function(){ hcCancelReply(commentId); };
  form.appendChild(inp);
  form.appendChild(sendBtn);
  form.appendChild(cancelBtn);
  box.appendChild(form);
  setTimeout(function(){ inp.focus(); }, 50);
}
function hcCancelReply(commentId) {
  var box = document.getElementById('hc-reply-form-' + commentId);
  if (box) box.innerHTML = '';
  _hcReplyFor = null;
}

async function hcPostReply(commentId) {
  var input = document.getElementById('hc-ri-' + commentId);
  if (!input) return;
  var content = input.value.trim();
  if (!content) return;
  input.disabled = true;
  try {
    await addComment(_hcEntryId, content, commentId);
    hcCancelReply(commentId);
    await hcLoad();
  } catch(err) { if(typeof showToast !== 'undefined') showToast('Failed to post reply.'); input.disabled = false; }
}

async function hcSubmit() {
  const input = document.getElementById('hcInput');
  const content = input.value.trim();
  if (!content || !_hcEntryId) return;
  input.disabled = true;
  try {
    await addComment(_hcEntryId, content);
    input.value = '';
    await hcLoad();
  } catch(err) { if(typeof showToast !== 'undefined') showToast('Failed to post.'); }
  finally { input.disabled = false; input.focus(); }
}

async function hcDelete(commentId) {
  try {
    await deleteComment(commentId);
    const el = document.getElementById('hcm-' + commentId);
    if (el) el.remove();
    const list = document.getElementById('hcList');
    const countEl = document.getElementById('hcCount');
    const remaining = list.querySelectorAll('.hc-comment').length;
    if (!remaining) { list.innerHTML = '<div class="hc-empty">No comments yet.</div>'; countEl.style.display='none'; }
    else countEl.textContent = remaining;
  } catch(err) { if(typeof showToast !== 'undefined') showToast('Failed to delete.'); }
}
</script>
</body>
</html>
