/* ── Export (export.html): the brand hero (your #1's backdrop, the Studio button, your library at a glance), Last time + Recent,

   (.tv-ring, tier colours — the hero and the stages are in theme.css's dark tier scope), the rank badge look of Top Favorites. ── */
.ex-wrap { max-width:1180px; margin:0 auto; }
/* the hero: like the profile's Top Favorites #1 tile — the backdrop full bleed, the shade, the text along the bottom */
.ex-hero { position:relative; isolation:isolate; display:flex; align-items:flex-end; justify-content:space-between; gap:20px 32px; flex-wrap:wrap; min-height:clamp(250px, 30vw, 330px);
  padding:clamp(22px, 3.4vw, 40px); box-sizing:border-box; border-radius:var(--radius-lg); overflow:hidden; margin-bottom:clamp(16px, 2.4vw, 24px);
  background:radial-gradient(120% 120% at 85% 0%, #2E6B45 0%, #1F4D33 38%, #0A2615 100%); color:#F3EEDC; box-shadow:inset 0 0 0 1px rgba(255,255,255,.08); }
.ex-hero-bg { position:absolute; inset:0; z-index:-2; background-size:cover; background-position:50% 25%; opacity:0; transition:opacity .4s var(--ease); }
.ex-hero-bg.in { opacity:.92; }
.ex-hero-bg.is-poster { filter:blur(22px) saturate(1.1); scale:1.2; }
.ex-hero-shade { position:absolute; inset:0; z-index:-1; background:linear-gradient(0deg, rgba(4,19,10,.94) 0%, rgba(4,19,10,.55) 45%, rgba(4,19,10,.15) 100%), linear-gradient(90deg, rgba(4,19,10,.72) 0%, rgba(4,19,10,.1) 70%); }
.ex-hero-tx { flex:1 1 340px; min-width:0; display:flex; flex-direction:column; align-items:flex-start; }
.ex-eyebrow { display:flex; align-items:center; gap:10px; margin:0 0 10px; font:600 11px var(--serif); letter-spacing:.2em; text-transform:uppercase; color:rgba(243,238,220,.8); }
.ex-eyebrow b { font-weight:600; color:#C7E3CF; box-shadow:inset 0 -1.5px 0 #C5A15B; padding-bottom:1px; }
.ex-eyebrow i { width:4px; height:4px; border-radius:50%; background:#C5A15B; }
.ex-title { margin:0; font:600 clamp(32px, 4.6vw, 52px)/1.02 var(--serif); color:#F3EEDC; text-wrap:balance; }
.ex-sub { margin:10px 0 20px; max-width:520px; font:500 clamp(13.5px, 1.2vw, 15px)/1.5 'Manrope',var(--sans); color:rgba(243,238,220,.82); }
.ex-go { display:inline-flex; align-items:center; justify-content:center; gap:9px; min-height:50px; padding:0 24px; border-radius:var(--radius-sm); border:1px solid #C5A15B;
  background:#C5A15B; color:#1C1609; font:700 15px 'Manrope',var(--sans); cursor:pointer; box-shadow:0 12px 26px -14px rgba(0,0,0,.8); transition:background .15s; }   /* on the dark hero: dark mode's brass, both themes */
.ex-go:hover { background:#D0BF9A; border-color:#D0BF9A; }
.ex-go:active { background:#B08C47; }
.ex-hero-cap { position:absolute; top:clamp(14px, 2vw, 20px); inset-inline-end:clamp(16px, 2.4vw, 24px); font:600 11px 'Manrope',var(--sans); color:rgba(243,238,220,.62); }
.ex-hero-cap:empty { display:none; }
/* your library at a glance: watched · watchlist (Bebas) and the average as the score ring */
.ex-stats { flex:none; display:flex; align-items:center; gap:clamp(14px, 2vw, 22px); padding:14px 18px; border-radius:16px; background:rgba(4,19,10,.62); border:1px solid rgba(243,238,220,.12); backdrop-filter:blur(6px); }
.ex-stats:empty { display:none; }
.ex-stat { display:flex; flex-direction:column; gap:3px; }
.ex-stat b { font:400 38px/.9 var(--bebas); color:#F3EEDC; letter-spacing:.01em; }
.ex-stat small { font:600 10.5px var(--serif); letter-spacing:.16em; text-transform:uppercase; color:rgba(243,238,220,.66); }
.ex-stat-sep { width:1px; align-self:stretch; background:rgba(243,238,220,.14); }
.ex-avg { display:flex; align-items:center; gap:10px; }
.ex-avg .tv-ring { width:62px; } .ex-avg .tv-ring circle { stroke-width:9; } .ex-avg .tv-ring b { font-size:21px; }

.ex-card { border-radius:var(--radius-lg); border:1px solid var(--border-default); background:var(--surface-card); }
.ex-row { display:grid; grid-template-columns:minmax(0, 1.25fr) minmax(0, 1fr); gap:clamp(12px, 1.6vw, 18px); }
/* Last time */
.ex-last { display:flex; align-items:center; gap:clamp(14px, 2vw, 24px); padding:clamp(14px, 2vw, 20px); }
.ex-th { flex:none; display:grid; place-items:center; overflow:hidden; border-radius:8px; border:1px solid var(--border-strong); background:#0A2615; color:#A6CCB1; }
.ex-th img { display:block; width:100%; height:100%; object-fit:cover; }
.ex-last .ex-th { width:clamp(92px, 10vw, 124px); aspect-ratio:3 / 4; box-shadow:0 14px 26px -16px rgba(0,0,0,.6); }
.ex-k { display:flex; align-items:center; gap:8px; margin:0 0 6px; font:600 11px var(--serif); letter-spacing:.18em; text-transform:uppercase; color:var(--text-link); }
.ex-k::before { content:''; width:6px; height:6px; border-radius:50%; background:var(--action-primary-bg); }
.ex-last h2 { margin:0; font:600 clamp(20px, 2vw, 25px)/1.12 var(--serif); color:var(--text-heading); overflow-wrap:anywhere; }
.ex-last p { margin:5px 0 14px; font:500 13px/1.45 'Manrope',var(--sans); color:var(--text-supporting); }
.ex-acts { display:flex; flex-wrap:wrap; gap:8px; }
.ex-btn { display:inline-flex; align-items:center; gap:7px; min-height:44px; padding:0 16px; border-radius:var(--radius-sm); border:1px solid var(--action-secondary-border); background:var(--action-secondary-bg); color:var(--text-body);
  font:700 13.5px 'Manrope',var(--sans); cursor:pointer; }
.ex-btn:hover { background:var(--action-secondary-hover); }
.ex-btn.is-primary { background:var(--action-primary-bg); border-color:var(--action-primary-bg); color:var(--text-on-primary); }
.ex-btn.is-primary:hover { background:var(--action-primary-hover); border-color:var(--action-primary-hover); }

.ex-empty svg { flex:none; color:var(--text-link); }
/* Recent */
.ex-recent { padding:clamp(14px, 1.8vw, 20px) clamp(14px, 1.8vw, 20px) clamp(8px, 1vw, 12px); }
.ex-recent ul { list-style:none; margin:0; padding:0; }
.ex-recent li { display:flex; align-items:center; gap:12px; min-height:56px; border-bottom:1px solid var(--border-subtle); }
.ex-recent li:last-child { border-bottom:0; }
.ex-ri { flex:none; width:34px; height:34px; display:grid; place-items:center; border-radius:10px; background:var(--selected-bg); color:var(--selected-fg); }
.ex-rt { flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; padding:6px 0; border:0; background:none; color:var(--text-body); text-align:start; font:inherit; cursor:pointer; }
.ex-rt b { font:700 13.5px/1.3 'Manrope',var(--sans); overflow-wrap:anywhere; }
.ex-rt small { font:500 12px/1.3 'Manrope',var(--sans); color:var(--text-muted); }
.ex-rt:hover b { text-decoration:underline; }
.ex-again { flex:none; min-height:36px; padding:0 12px; border-radius:999px; border:1px solid var(--border-default); background:none; color:var(--action-tertiary-fg); font:700 12.5px 'Manrope',var(--sans); cursor:pointer; }
.ex-again:hover { background:var(--action-tertiary-hover-bg); border-color:var(--border-brand); }
.ex-none { margin:6px 0 8px; font:500 12.5px/1.45 'Manrope',var(--sans); color:var(--text-muted); }
/* Ready-made: each on a dark stage (the Studio's desk), the format as a tag, the title in Oswald */
.ex-head { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin:clamp(28px, 3.6vw, 44px) 0 14px; }
.ex-head h2 { margin:0; font:600 clamp(21px, 2.1vw, 26px)/1.1 var(--serif); color:var(--text-heading); }
.ex-head span { font:500 12.5px 'Manrope',var(--sans); color:var(--text-muted); }
.ex-grid { display:grid; grid-template-columns:repeat(5, minmax(0, 1fr)); gap:clamp(10px, 1.2vw, 14px); list-style:none; margin:0; padding:0; }
.ex-rm { display:flex; flex-direction:column; width:100%; height:100%; padding:0; box-sizing:border-box; border-radius:var(--radius); border:1px solid var(--border-default); background:var(--surface-card);
  color:var(--text-body); text-align:start; font:inherit; cursor:pointer; overflow:hidden; transition:border-color .15s, translate .15s, box-shadow .15s; }
.ex-rm:hover { border-color:var(--border-brand); translate:0 -2px; box-shadow:0 16px 30px -18px rgba(0,0,0,.55); }
.ex-pv { position:relative; aspect-ratio:4 / 3; display:grid; place-items:center; overflow:hidden; background:radial-gradient(120% 100% at 50% 0%, #163A24 0%, #0A2615 50%, #04130A 100%); }
.ex-pv img { display:block; max-width:62%; max-height:84%; border-radius:4px; box-shadow:0 14px 24px -12px rgba(0,0,0,.85), 0 0 0 1px rgba(243,238,220,.12); transition:scale .25s var(--ease); }
.ex-rm:hover .ex-pv img { scale:1.04; }
.ex-pv.is-skel::after { content:''; position:absolute; inset:0; }   /* the shared sweep (style.css) */
.ex-pv > svg { color:#A6CCB1; opacity:.6; }
.ex-tag { position:absolute; top:8px; inset-inline-start:8px; z-index:1; padding:3px 8px 2px; border-radius:6px; background:rgba(4,19,10,.78); border:1px solid rgba(243,238,220,.14);
  font:600 10px/1.2 var(--serif); letter-spacing:.14em; text-transform:uppercase; color:#C7E3CF; }
.ex-rm-tx { display:flex; flex-direction:column; gap:3px; padding:11px 12px 13px; }
.ex-rm b { display:block; font:600 15px/1.2 var(--serif); color:var(--text-heading-2); }
.ex-rm small { display:block; font:500 12px/1.3 'Manrope',var(--sans); color:var(--text-muted); }
.ex-go:focus-visible { outline:2px solid #D0BF9A; outline-offset:3px; }
.ex-btn:focus-visible, .ex-rt:focus-visible, .ex-again:focus-visible, .ex-rm:focus-visible { outline:2px solid var(--focus-ring); outline-offset:2px; }
@media (prefers-reduced-motion:reduce) { .ex-rm, .ex-pv img, .ex-hero-bg { transition:none; } .ex-rm:hover { translate:none; } .ex-rm:hover .ex-pv img { scale:none; } .ex-pv.is-skel { animation:none; } }
@media (max-width:1024px) { .ex-grid { grid-template-columns:repeat(3, minmax(0, 1fr)); } }
@media (max-width:860px) { .ex-row { grid-template-columns:minmax(0, 1fr); } }
@media (max-width:600px) {
  .ex-hero { min-height:0; padding:22px 18px 18px; border-radius:18px; gap:16px; }
  .ex-sub { margin-bottom:16px; }
  .ex-go { width:100%; min-height:52px; }
  .ex-stats { width:100%; box-sizing:border-box; justify-content:space-between; padding:12px 14px; }
  .ex-stat b { font-size:32px; }
  .ex-hero-cap { display:none; }
  .ex-grid { grid-template-columns:repeat(2, minmax(0, 1fr)); }
  .ex-last .ex-acts .ex-btn:not(.is-primary) { display:none; }
  .ex-head span { display:none; }
}

<script>
/* ═══════════════════════════════════════════════════════════════
   export.html — Export (avatar menu · You → Export on phones)
   One way in (Open Export Studio), what you made last (Last time + Recent — the last 5 setups, kept on
   this device) and ten Ready-made exports, each with a small picture drawn by the export code itself
   (cached on this device). A settings link (export.html#studio=…) opens the Studio with that setup.
═══════════════════════════════════════════════════════════════ */
const esc = s => escHTML(s == null ? '' : String(s));
let _exAll = null, _exReady = null;
const EX_FORMATS = ['pdf', 'image', 'ai', 'csv', 'letterboxd', 'backup'];
const EX_READY = [
  { id: 'watched', t: 'Everything I’ve watched', f: 'PDF', n: 'watched', p: { what: 'watched', sort: 'score', format: 'pdf' } },
  { id: 'top10', t: 'My top 10', f: 'PDF', p: { what: 'watched', sort: 'score', limit: 10, format: 'pdf' } },
  { id: 'story', t: 'Top 10 story', f: 'Image', p: { what: 'watched', sort: 'score', format: 'image', img: { size: 'story' } } },
  { id: 'taste', t: 'Taste profile', f: 'PDF', p: { what: 'taste', format: 'pdf' } },
  { id: 'year', t: 'Year in Review', f: 'PDF', y: true, p: { what: 'year', format: 'pdf' } },
  { id: 'episodes', t: 'Episode ratings', f: 'Image', p: { what: 'episodes', format: 'image' } },
  { id: 'watchlist', t: 'My watchlist', f: 'PDF', n: 'watchlist', p: { what: 'watchlist', format: 'pdf' } },
  { id: 'watching', t: 'Currently watching', f: 'PDF', n: 'watching', p: { what: 'watching', format: 'pdf' } },
  { id: 'ai', t: 'Ask an AI', f: 'For an AI', p: { what: 'watched', format: 'ai' } },
  { id: 'card', t: 'Title card', f: 'Image', p: { what: 'title', format: 'image', step: 'what' } },
];
const FMT_IC = { 'PDF': 'download', 'Image': 'image', 'For an AI': 'sparkles', 'Spreadsheet': 'list', 'Letterboxd': 'film', 'Full backup': 'shield', 'Title card': 'idCard' };
const exCount = k => _exAll.filter(e => k === 'watched' ? ['completed', 'ongoing'].includes(e.status) : k === 'watchlist' ? e.status === 'queue' : ['watching', 'up_next', 'paused'].includes(e.status)).length;
const exDate = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }); };
const exWho = () => { const p = window._navUserProfile || {}; return { name: p.display_name || p.username || '', username: p.username || '', avatar_url: p.avatar_url || '' }; };

function exOpen(preset, autoGo) { MSSStudio.open({ preset, who: exWho(), load: () => _exReady, autoGo }); }

function exRecentHTML() {
  const r = MSSStudio.recent(), last = r[0], rest = r.slice(1);
  const ic = f => icon(FMT_IC[f] || 'download', 16);
  const lastHTML = last ? `<section class="ex-card ex-last" aria-labelledby="exLastT">
      <div class="ex-th">${last.thumb ? `<img src="${esc(last.thumb)}" alt="">` : icon(FMT_IC[last.fmt] || 'download', 30)}</div>
      <div><p class="ex-k">Last time</p><h2 id="exLastT" translate="no">${esc(last.name)}</h2>
        <p>${esc([last.fmt, last.opts, exDate(last.at)].filter(Boolean).join(' · '))}</p>
        <div class="ex-acts"><button type="button" class="ex-btn is-primary" onclick="exAgain(0)">${icon('download', 16)} Export again</button>
          <button type="button" class="ex-btn" onclick="exEdit(0)">Edit in Studio</button></div></div></section>`
    : `<section class="ex-card ex-empty">${icon('clock', 20)}<span>Nothing exported on this device yet. What you make shows up here, so you can make it again in one tap.</span></section>`;
  const recentHTML = `<section class="ex-card ex-recent" aria-labelledby="exRecT"><p class="ex-k" id="exRecT">Recent</p>
      ${rest.length ? `<ul>${rest.map((x, i) => `<li><span class="ex-ri" aria-hidden="true">${ic(x.fmt)}</span>
        <button type="button" class="ex-rt" onclick="exEdit(${i + 1})" aria-label="Edit ${esc(x.name)} in the Studio"><b translate="no">${esc(x.name)}</b><small>${esc([x.fmt === 'Spreadsheet' ? x.ext : x.fmt, exDate(x.at)].filter(Boolean).join(' · '))}</small></button>
        <button type="button" class="ex-again" onclick="exAgain(${i + 1})" aria-label="Export ${esc(x.name)} again">Again</button></li>`).join('')}</ul>`
      : `<p class="ex-none">Your earlier setups (up to five) show up here.</p>`}</section>`;
  return `<div class="ex-row">${lastHTML}${recentHTML}</div>`;
}
function exAgain(i) { const x = MSSStudio.recent()[i]; if (x) exOpen({ ...x.setup, step: 'options' }, true); }
function exEdit(i) { const x = MSSStudio.recent()[i]; if (x) exOpen({ ...x.setup, step: 'options' }); }

function exDraw() {
  document.getElementById('exPage').innerHTML = `<main class="ex-wrap fade-up">
    <section class="ex-hero" aria-labelledby="exH">
      <span class="ex-hero-bg" id="exHeroBg" aria-hidden="true"></span><span class="ex-hero-shade" aria-hidden="true"></span><span class="ex-hero-cap" id="exHeroCap"></span>
      <div class="ex-hero-tx"><p class="ex-eyebrow"><span translate="no">My<b>Screen</b>Folio</span><i aria-hidden="true"></i>Export</p>
        <h1 class="ex-title" id="exH">Take your library with you</h1>
        <p class="ex-sub">A PDF to keep, an image to share, a file for another app or a full backup.</p>
        <button type="button" class="ex-go" onclick="exOpen(null)">${icon('sparkles', 17)} Open Export Studio</button></div>
      <div class="ex-stats" id="exStats" aria-label="Your library"></div>
    </section>
    <div id="exRecent">${exRecentHTML()}</div>
    <div class="ex-head"><h2 id="exReadyT">Ready-made</h2><span>One tap — the Studio opens set up</span></div>
    <ul class="ex-grid" aria-labelledby="exReadyT">${EX_READY.map((q, i) => `<li><button type="button" class="ex-rm" onclick="exOpen(EX_READY[${i}].p)">
        <span class="ex-pv ex-rm-pv is-skel" aria-hidden="true"><span class="ex-tag">${esc(q.f)}</span><span class="ex-pv-in" id="exPv_${q.id}"></span></span>
        <span class="ex-rm-tx"><b>${esc(q.t)}</b><small id="exSub_${q.id}">${esc(q.f)}</small></span></button></li>`).join('')}</ul>
  </main>`;
}
// the hero, once your library's here: your #1's backdrop behind it, watched · watchlist and your average as the score ring
function exHero() {
  const w = _exAll.filter(e => ['completed', 'ongoing'].includes(e.status)), sc = w.map(e => liveScore(e)).filter(v => v != null).map(Number);
  const avg = sc.length ? sc.reduce((a, b) => a + b, 0) / sc.length : null, n = v => Number(v).toLocaleString('en-GB');
  const st = document.getElementById('exStats');
  if (st && _exAll.length) st.innerHTML = `<div class="ex-stat"><b>${n(w.length)}</b><small>Watched</small></div><span class="ex-stat-sep" aria-hidden="true"></span>
    <div class="ex-stat"><b>${n(exCount('watchlist'))}</b><small>Watchlist</small></div>
    ${avg != null ? `<span class="ex-stat-sep" aria-hidden="true"></span><div class="ex-avg">${MSSStudio.ring(avg, 's')}<div class="ex-stat"><small>Average</small><small>score</small></div></div>` : ''}`;
  const top = w.filter(e => liveScore(e) != null && e.status !== 'dropped').sort((a, b) => liveScore(b) - liveScore(a))[0];
  if (top) { MSSStudio.paintBackdrop(document.getElementById('exHeroBg'), top); const c = document.getElementById('exHeroCap'); if (c) c.textContent = `#1 · ${top.title}`; }
}
// the cards' subtitles, once your library's here: "PDF · 218", "PDF · 2026"
function exCounts() {
  EX_READY.forEach(q => {
    const el = document.getElementById('exSub_' + q.id); if (!el) return;
    const n = q.n ? exCount(q.n) : null, y = q.y ? MSSYear.years(_exAll, null)[0] : null;
    el.textContent = [q.f, n != null ? n : '', y || ''].filter(x => x !== '').join(' · ');
  });
}
// small pictures, drawn by the export code (one at a time, when the page is idle), kept on this device
async function exThumbs() {
  const all = _exAll || [], who = exWho(), pr = MSSStudio.prefs();
  const key = [all.length, all.reduce((m, e) => String(e.updated_at || '') > m ? String(e.updated_at || '') : m, ''), pr.theme || '', who.username, pr.privacy?.anon ? 1 : 0].join('|');
  const have = MSSStudio.thumbCache.get(key);
  const put = (id, url) => { const el = document.getElementById('exPv_' + id); if (!el) return; el.parentElement.classList.remove('is-skel'); el.outerHTML = url ? `<img src="${url}" alt="">` : icon(FMT_IC[EX_READY.find(q => q.id === id)?.f] || 'download', 30); };
  const todo = EX_READY.filter(q => { if (q.id in have) { put(q.id, have[q.id]); return false; } return true; });
  const idle = () => new Promise(r => (window.requestIdleCallback || setTimeout)(r, { timeout: 1200 }));
  for (const q of todo) {
    await idle();
    let url = null;
    try { url = await MSSStudio.thumb(q.p, { all, who }); } catch (err) { console.warn('Ready-made picture:', q.id, err); }
    put(q.id, url);
    if (url || all.length) MSSStudio.thumbCache.put(key, q.id, url);
  }
}

document.addEventListener('DOMContentLoaded', () => {
  initPage(async user => {
    if (!user) {
      document.getElementById('exPage').innerHTML = mssGuestEmpty('export');
      return;
    }
    _exReady = getEntries(user.id).then(r => (_exAll = r || []), () => (_exAll = []));
    exDraw();                               // straight away; the counts and pictures fill in once your library's here
    window.addEventListener('msf-export-recent', () => { const r = document.getElementById('exRecent'); if (r) r.innerHTML = exRecentHTML(); });
    // a settings link (export.html#studio=…) opens the Studio set up like that
    const fromLink = MSSStudio.fromHash();
    if (fromLink) { history.replaceState(null, '', location.pathname + location.search); exOpen({ ...fromLink, step: 'options' }); }
    // the header's You → Export shortcuts (nav.js): export.html?format=pdf | image | csv | backup opens the Studio on it
    const fmt = new URLSearchParams(location.search).get('format');
    if (!fromLink && EX_FORMATS.includes(fmt)) exOpen({ format: fmt, ...(fmt === 'backup' ? { what: 'all', step: 'options' } : { step: 'what' }) });
    await _exReady;
    exHero();
    exCounts();
    exThumbs();
  });
});
</script>
