<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="js/consent.js"></script>
<script src="js/splash.js"></script>
<script src="js/i18n.js"></script>
<title>Notes — MyScreenFolio</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F3EEDC">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MyScreenFolio">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/svg+xml" sizes="any" href="icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
</head>
<body>
<div class="page-wrap">

  <!-- Header -->
  <div class="cat-page-header lib-head nt-head fade-up">
    <div class="lib-head-l">
      <div class="lib-kicker" id="notesKicker">You · Notes</div>
      <h1 class="cat-page-title">Notes</h1>
      <div class="cat-page-sub" id="notesPageSub"><span class="skel-txt">00 notes · 0,000 words · 000 per note · 0 likes</span></div>
    </div>
    <div class="lib-head-r">
      <button type="button" class="btn-add-entry nt-write" onclick="openNotesSearchPopup()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>Write a note</button>
    </div>
  </div>

  <!-- Toolbar: Mine / Friends / Community · search · Sort · Filter · (phones) the pencil -->
  <div class="nt-tools fade-up fade-up-1" id="notesTools">
    <div id="notesModeWrap" style="display:contents"></div>
    <div class="nt-search" id="notesSearch"></div>
    <div class="nt-bar" id="notesBar"></div>
    <button type="button" class="nt-pen" onclick="openNotesSearchPopup()" aria-label="Write a note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
  </div>
  <div class="lib-tabrow nt-views" id="notesViews"></div>
  <div class="nt-banner" id="notesUserFilterBanner" style="display:none;"></div>
  <div id="nuDropdown" class="username-dropdown"></div>

  <!-- The featured note + the cards -->
  <div id="notesPageContent" class="fade-up fade-up-2">
    <div class="page-loading" data-skel="notes-page"></div>
  </div>

</div>

<script src="js/vendor/supabase-2.118.0.js"></script>
<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/nav.js"></script>
<script src="js/sort-filter.js"></script>
<script src="js/info-popup.js"></script>
<script src="js/title-view.js"></script>
<script src="js/easter-egg.js"></script>
<script src="js/note-popup.js"></script>
<script src="js/list-popup.js"></script>
<script>
function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
let _notesUser = null;
let _notesEntries = [];
let _notesMode = mssViewOf();   // mine | friends | community
let _notesPin = null;           // your pinned note's entry id (MSSNote.pinnedId)
let _notesShow = MSSNote.PAGE;  // cards drawn: 20, + 20 per View more
let _socialNotesRaw = [];
let _socialNotesMyReactions = {}; // entry_id -> 'like' | 'dislike'
// From a title page's "View all notes": notes.html?view=community&tmdb=<id>&type=<movie|tv>&t=<name>
let _notesTitle = (q => q.get('tmdb') ? { id: Number(q.get('tmdb')), type: q.get('type') === 'tv' ? 'tv' : 'movie', name: q.get('t') || 'this title' } : null)(new URLSearchParams(location.search));

const _NOTES_SCOPE = { mine: 'notesMine', friends: 'notesFriends', community: 'notesSocial' };
const _nWord = (n, one) => `${Number(n).toLocaleString(MSSI18n.locale)} ${n === 1 ? one : one + 's'}`;

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('notesModeWrap').innerHTML = mssViewToggleHTML('notesModeToggle', 'Whose notes', _notesMode, 'setNotesMode');
  _notesViews();
  _notesTools();
  initPage(async (user) => {
    const q = new URLSearchParams(location.search);
    // Guests can read Community notes; their own notes need an account
    if (!user && _notesMode !== 'community') {
      document.querySelector('.page-wrap').innerHTML = mssGuestEmpty('notes');
      _notesOpenLink();
      return;
    }
    _notesUser = user;
    if (_notesMode !== 'mine') setNotesMode(_notesMode);
    if (!user) { _notesOpenLink(); return; }
    await loadNotesPage();
    _notesOpenLink();
    if (q.get('add')) { // (+) → Write a note, from another page
      const url = new URL(location.href); url.searchParams.delete('add');
      history.replaceState(history.state, '', url.pathname + url.search);
      openNotesSearchPopup();
    }
  });
});
// Pinned / unpinned (the title panel's ⋯) → the featured note follows
document.addEventListener('mss:notepin', ev => { _notesPin = ev.detail.id; if (_notesMode === 'mine') renderNotesPage(); });

/* A shared note: notes.html?note=<entry id> (sent to you, a friend's) or with
   &k=<token> — its private link (069), which opens it for anyone, guests too. */
async function _notesOpenLink() {
  const q = new URLSearchParams(location.search), id = q.get('note');
  if (!id) return;
  let e = null;
  if (q.get('k')) e = (await sb.rpc('open_note_link', { p_entry: id, p_token: q.get('k') })).data || null;
  if (!e) {
    const { data } = await sb.from('entries').select('*').eq('id', id).maybeSingle();
    e = data ? (await mssWithPrivateNotes([data]))[0] : null;
  }
  if (!e || !(e.notes || '').trim()) { showToast('This note is private, or it doesn’t exist anymore.', 'err'); return; }
  const own = _notesUser && e.user_id === _notesUser.id;
  const profile = own ? null : (await sb.from('profiles').select('id, username, display_name, avatar_url').eq('id', e.user_id).maybeSingle()).data || {};
  MSSViews.open(e, own ? { start: 'note', note: true, own: true } : { start: 'note', note: true, profile });
}

let _notesReactionCounts = {}; // entry_id -> { like, dislike }

/* Your notes show as soon as your entries arrive; the pin and like / dislike counts
   fill in right after, and Community is fetched quietly in the background
   so switching views is instant. */
async function loadNotesPage() {
  _notesEntries = await getEntries(_notesUser.id) || [];
  _notesPin = await MSSNote.pinnedId(_notesUser.id);
  if (_notesMode === 'mine') renderNotesPage();            // ← first paint
  const withNotes = _notesEntries.filter(e => e.notes && e.notes.trim());
  if (withNotes.length) {
    _notesReactionCounts = await MSSNote.reactionCounts(withNotes.map(e => e.id));
    if (_notesMode === 'mine') renderNotesPage();
  }
  const idle = fn => ('requestIdleCallback' in window) ? requestIdleCallback(fn, { timeout: 2500 }) : setTimeout(fn, 1200);
  idle(() => _fetchSocialNotes().catch(() => {}));            // warm up Community
}

// Phones / tablets: Mine / Friends / Community as the Library's status tabs (Mine with its count)
function _notesViews() {
  document.getElementById('notesViews').innerHTML = mssViewTabsHTML('Whose notes', _notesMode, 'setNotesMode', 'notes',
    _notesUser ? _notesEntries.filter(e => e.notes && e.notes.trim()).length : null);
}

/* The toolbar for the view: its search (Community: people and titles, from the server) and its Sort / Filter */
function _notesTools() {
  const scope = _NOTES_SCOPE[_notesMode];
  document.getElementById('notesSearch').innerHTML = _notesMode === 'community'
    ? `<div id="notesUserSearchWrap"><div class="sf-search" id="notesUserSearchWrapInner" role="search">
        <span class="sf-search-ic" aria-hidden="true">${icon('search', 16)}</span>
        <input id="notesUserSearchInput" class="sf-search-input" placeholder="Search people or titles…" aria-label="Search people or titles"
          type="search" name="mss-notes-search" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="search" data-1p-ignore data-lpignore="true" data-form-type="other"
          oninput="this.value=this.value.replace(/[^a-zA-Z0-9_ ]/g,'');_nuSearch(this.value);" onkeydown="_nuKeydown(event)"></div></div>`
    : SF.searchHTML(scope, _notesMode === 'friends' ? 'Search your friends’ notes…' : 'Search your notes…');
  document.getElementById('notesBar').innerHTML = SF.bar(scope, 'all');
}
const _notesFiltering = scope => !!(SF.query(scope) || SF.filterCount(scope, 'all'));

const _NOTE_LEN_PRESET = { length: { header: 'Note Length', opts: [['note_long', 'Longest'], ['note_short', 'Shortest']] } };
const _noteLenCompare = {
  note_long:  (a, b) => MSSNote.words(b.notes) - MSSNote.words(a.notes),
  note_short: (a, b) => MSSNote.words(a.notes) - MSSNote.words(b.notes),
};
const _noteText = e => MSSRich.plain(e.notes || '');
// a sort, filter or search starts again at 20 cards
const _notesRedraw = fn => () => { _notesShow = MSSNote.PAGE; fn(); };

/* Personal Sort & Filter (shared js/sort-filter.js) */
SF.register('notesMine', {
  watched: () => true,          // Year Watched filter (titles you've finished)
  base: () => _notesEntries.filter(e => e.notes && e.notes.trim()),
  render: _notesRedraw(() => renderNotesPage()),
  onSearch: _notesRedraw(() => renderNotesPage()),
  searchText: _noteText,
  defaultSort: 'newest',
  addedDate: MSSNote.watchedDate,
  presets: {
    added: { header: 'Date', opts: [['newest', 'Latest'], ['oldest', 'Earliest']] },
    ..._NOTE_LEN_PRESET,
    likes: { header: 'Likes', opts: [['likes_most', 'Most Liked'], ['likes_least', 'Least Liked']] },
  },
  sorts: () => ['added', 'alpha', 'length', 'ratings', 'likes'],
  filters: () => ['genre', 'year', 'score', 'length'],
  compare: {
    ..._noteLenCompare,
    likes_most:  (a, b) => ((_notesReactionCounts[b.id]?.like || 0) - (_notesReactionCounts[a.id]?.like || 0)),
    likes_least: (a, b) => ((_notesReactionCounts[a.id]?.like || 0) - (_notesReactionCounts[b.id]?.like || 0)),
  },
  choiceFilters: () => [SF.typeChoice()],
});

/* Community Sort & Filter */
const _snScore = n => Number(n.like_count || 0) - Number(n.dislike_count || 0);
SF.register('notesSocial', {
  watched: () => true,
  base: () => _socialNotesRaw || [],
  render: _notesRedraw(() => renderSocialNotes()),
  defaultSort: 'popular',
  presets: {
    popularity: { header: 'Popularity', opts: [['popular', 'Most Liked'], ['least_popular', 'Least Liked']] },
    added:      { header: 'Date', opts: [['newest', 'Latest'], ['oldest', 'Earliest']] },
    ..._NOTE_LEN_PRESET,
  },
  sorts: () => ['popularity', 'added', 'alpha', 'length', 'ratings'],
  filters: () => ['score'],
  scoreOf: n => n.final_score != null ? Number(n.final_score) : null,
  addedDate: MSSNote.watchedDate,
  compare: {
    ..._noteLenCompare,
    popular: (a, b) => (_snScore(b) - _snScore(a)) || (new Date(MSSNote.watchedDate(b)) - new Date(MSSNote.watchedDate(a))),
    least_popular: (a, b) => (Number(b.dislike_count) - Number(a.dislike_count)) || (_snScore(a) - _snScore(b)),
  },
  choiceFilters: () => [{
    key: 'type', label: 'Type', options: [['', 'All Types'], ['tv', 'TV Shows'], ['movie', 'Movies']], test: (n, v) => n.tmdb_type === v,
  }, {
    key: 'owner', label: 'Whose Notes',
    options: [['', 'Everyone'], ['others', 'Other People'], ['mine', 'Mine']],
    test: (n, v) => v === 'mine' ? n.user_id === _notesUser?.id : n.user_id !== _notesUser?.id,
  }],
});

/* ── Loading skeleton: the featured note (your notes) and note cards with sample text masked into
   placeholders — as many as last time (mssSkeleton, config.js) ── */
mssSkeleton.define('notes-page', () => {
  const social = _notesMode === 'community', friends = _notesMode === 'friends';
  const n = Math.min(Math.max(mssSkeleton.shape(friends ? 'notes_f' : social ? 'notes_c' : 'notes')?.n ?? 4, 1), 6);
  const note = { id: '', entry_id: '', title: 'Sample title', cat: 'tv', genres: ['Drama'], year: 2024, username: 'username', final_score: 8,
    completed_date: '2026-01-01', status: 'completed', ratings: { story: 8 }, notes: 'A sample note, long enough to run across the card the way a real one does, and on to a second line.' };
  const card = () => MSSNote.cardHTML(note, { author: social || friends ? note : null });
  return `${!social && !friends ? '<div class="nf-card is-skel" aria-hidden="true"></div>' : ''}<div class="nc-grid">${Array.from({ length: n }, card).join('')}</div>`.replace(/ onclick="[^"]*"/g, '');
});

// "View more": the next 20
function _notesMore() {
  _notesShow += MSSNote.PAGE;
  ({ mine: renderNotesPage, friends: renderFriendsNotes, community: renderSocialNotes })[_notesMode]();
}
// The grid: the first _notesShow cards, then View more
function _notesGrid(list, card) {
  return `<div class="nc-grid">${list.slice(0, _notesShow).map(card).join('')}</div>${MSSNote.more(list.length - _notesShow, '_notesMore()')}`;
}
const _notesNoMatch = scope => mssEmpty({ compact: true, art: SF.query(scope) ? 'search' : 'filter',
  title: SF.query(scope) ? `No luck with “${SF.query(scope)}”` : 'Nothing matches these filters',
  text: SF.query(scope) ? 'Nothing in these notes matches. Try another word.' : 'Your filters are a little too picky. Loosen one and try again.',
  actions: [{ label: SF.query(scope) ? 'Clear search' : 'Clear filters', icon: 'x', primary: true,
    onclick: SF.query(scope) ? `SF._search('${scope}', '', true)` : `SF.clearFilters('${scope}', 'all'); SF.refresh('${scope}', 'all')` }] });

function renderNotesPage() {
  const withNotes = _notesEntries.filter(e => e.notes && e.notes.trim());
  const wrap = document.getElementById('notesPageContent');

  // One line: how much you've written, how long your notes run, and the likes they've had
  const totalWords = withNotes.reduce((t, e) => t + MSSNote.words(e.notes), 0);
  const avgWords = withNotes.length ? Math.round(totalWords / withNotes.length) : 0;
  const likes = withNotes.reduce((t, e) => t + (_notesReactionCounts[e.id]?.like || 0), 0);
  _notesViews();
  document.getElementById('notesPageSub').textContent = `${_nWord(withNotes.length, 'note')} · ${_nWord(totalWords, 'word')} · ${avgWords} per note · ${_nWord(likes, 'like')}`;

  if (!withNotes.length) {
    wrap.innerHTML = mssEmpty({ art: 'notes', title: 'No notes yet',
      text: 'Hot takes, favourite scenes, that one line you can’t stop quoting. Write it down before you forget it.',
      actions: [{ label: 'Write a note', icon: 'plus', onclick: 'openNotesSearchPopup()', primary: true }] });
    return;
  }
  mssSkeleton.shape('notes', { n: withNotes.length });
  const list = SF.list('notesMine', 'all');
  if (!list.length) { wrap.innerHTML = _notesNoMatch('notesMine'); return; }
  // pinned, else the latest — only when you're not searching or filtering; never repeated below
  const top = _notesFiltering('notesMine') ? null : MSSNote.featured(withNotes, _notesPin);
  const card = e => MSSNote.cardHTML(e, { counts: _notesReactionCounts[e.id], open: `_notesOpen(${attrJSON(e.id)})` });
  wrap.innerHTML = (top ? MSSNote.featuredHTML(top, { open: `_notesOpen(${attrJSON(top.id)})`, pinned: top.id === _notesPin }) : '')
    + _notesGrid(top ? list.filter(e => e !== top) : list, card);
}

// The title panel / page, opening on your review (MSSViews, title-view.js); edit → straight into writing it
function _notesOpen(id, edit) {
  const e = _notesEntries.find(en => en.id === id);
  if (!e) return;
  MSSViews.open(e, {
    start: 'note', note: true, own: true, edit: !!edit, from: 'notes.html',
    onNoteSaved: renderNotesPage, onChange: renderNotesPage,
    onDelete: x => { _notesEntries = _notesEntries.filter(y => y.id !== x.id); renderNotesPage(); },
  });
}

function setNotesMode(mode) {
  if (mode !== 'community' && mssGuestGate(mode === 'friends' ? 'see your friends’ notes' : 'keep your own notes')) return;
  _notesMode = mode;
  _notesShow = MSSNote.PAGE;
  mssSetView(mode);
  mssPaintViewToggle('notesModeToggle', mode);
  _notesViews();
  document.getElementById('notesKicker').textContent = { mine: 'You · Notes', friends: 'Friends · Notes', community: 'Community · Notes' }[mode];
  _notesTools();
  if (mode !== 'community' && _notesTitle) _nuForgetTitle();
  if (mode === 'community') {
    _nuFilterUser = null;
    document.getElementById('notesUserFilterBanner').style.display = 'none';
    if (_notesTitle) { _nuLoadTmdbNotes(); return; }
    loadSocialNotes();
  } else {
    document.getElementById('notesUserFilterBanner').style.display = 'none';
    if (mode === 'friends') loadFriendsNotes(); else renderNotesPage();
  }
}

/* ── Friends' notes: fetched when the view is first opened ── */
let _friendsNotes = null, _friendsNotesPromise = null, _friendsNotesWho = {}, _friendsCounts = {};
function _fetchFriendsNotes() {
  return _friendsNotesPromise ||= (async () => {
    const { ids, profiles } = await mssMyFriends(_notesUser.id);
    _friendsNotesWho = profiles;
    if (!ids.length) return (_friendsNotes = []);
    const { data, error } = await sb.from('entries').select('*').in('user_id', ids)
      .or('notes.not.is.null,note_visibility.neq.anyone').order('updated_at', { ascending: false }).limit(1000);   // Friends / Private notes (069) live elsewhere
    if (error) throw error;
    const rows = await mssWithPrivateNotes(data || []);
    _friendsNotes = rows.filter(e => e.notes && e.notes.trim());
    MSSNote.reactionCounts(_friendsNotes.map(e => e.id)).then(c => { _friendsCounts = c; if (_notesMode === 'friends') renderFriendsNotes(); }).catch(() => {});
    return _friendsNotes;
  })().catch(err => { _friendsNotesPromise = null; throw err; });
}
async function loadFriendsNotes() {
  const wrap = document.getElementById('notesPageContent');
  if (!_friendsNotes) wrap.innerHTML = `<div class="page-loading" data-skel="notes-page"></div>`;
  try {
    await _fetchFriendsNotes();
    if (_notesMode === 'friends') renderFriendsNotes();
  } catch (err) {
    console.error('Load friends notes error:', err);
    mssErrorPage(mssErrorKind(err), { in: wrap, error: err });
  }
}
SF.register('notesFriends', {
  base: () => _friendsNotes || [],
  render: _notesRedraw(() => renderFriendsNotes()),
  onSearch: _notesRedraw(() => renderFriendsNotes()),
  searchText: e => `${_noteText(e)} ${_friendsNotesWho[e.user_id]?.username || ''} ${_friendsNotesWho[e.user_id]?.display_name || ''}`,
  watched: () => true,          // Year Watched filter
  defaultSort: 'newest',
  addedDate: e => e.completed_date || e.updated_at,
  presets: {
    added: { header: 'Date', opts: [['newest', 'Latest'], ['oldest', 'Oldest']] },
    ..._NOTE_LEN_PRESET,
  },
  sorts: () => ['added', 'length', 'ratings', 'alpha'],
  filters: () => ['genre', 'score', 'length'],
  compare: _noteLenCompare,
  choiceFilters: () => [
    { key: 'who', label: 'Friend', options: [['', 'Everyone'], ...Object.entries(_friendsNotesWho).map(([id, p]) => [id, p.display_name || p.username || 'Friend'])], test: (e, v) => e.user_id === v },
    SF.typeChoice(),
  ],
});
function renderFriendsNotes() {
  const wrap = document.getElementById('notesPageContent'), all = _friendsNotes || [];
  _notesViews();
  const weekAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;
  document.getElementById('notesPageSub').textContent = [_nWord(all.length, 'note'), _nWord(new Set(all.map(e => e.user_id)).size, 'friend'),
    _nWord(new Set(all.map(e => e.tmdb_id ? `${e.tmdb_type}:${e.tmdb_id}` : (e.title || '').trim().toLowerCase())).size, 'title'),
    `${all.filter(e => new Date(e.updated_at).getTime() >= weekAgo).length} this week`].join(' · ');
  mssSkeleton.shape('notes_f', { n: all.length });
  if (!all.length) { wrap.innerHTML = mssEmpty({ art: 'notes', title: 'No notes from friends yet', text: 'Your friends are keeping their hot takes to themselves. For now.' }); return; }
  const list = SF.list('notesFriends', 'all');
  if (!list.length) { wrap.innerHTML = _notesNoMatch('notesFriends'); return; }
  wrap.innerHTML = _notesGrid(list, e => MSSNote.cardHTML(e, { author: _friendsNotesWho[e.user_id] || {}, counts: _friendsCounts[e.id], blur: true, open: `_openFriendNote(${attrJSON(e.id)})` }));
}
function _openFriendNote(id) {
  const e = (_friendsNotes || []).find(x => x.id === id);
  if (e) MSSViews.open(e, { start: 'note', note: true, profile: _friendsNotesWho[e.user_id] || {} });
}

// Fetches Community notes once (also used to prefetch in the background)
let _socialNotesPromise = null, _socialNotesCache = null;
function _fetchSocialNotes(force) {
  if (_socialNotesPromise && !force) return _socialNotesPromise;
  _socialNotesPromise = (async () => {
    const { data, error } = await sb.rpc('get_social_notes', { p_limit: 100 });
    if (error) throw error;
    const notes = data || [];
    if (_notesUser && notes.length) {
      const { data: myReactions } = await sb.from('note_reactions')
        .select('entry_id, is_like').eq('user_id', _notesUser.id).in('entry_id', notes.map(n => n.entry_id));
      _socialNotesMyReactions = {};
      (myReactions || []).forEach(r => { _socialNotesMyReactions[r.entry_id] = r.is_like ? 'like' : 'dislike'; });
    }
    _socialNotesCache = notes;
    return notes;
  })().catch(err => { _socialNotesPromise = null; throw err; });
  return _socialNotesPromise;
}

async function loadSocialNotes() {
  const wrap = document.getElementById('notesPageContent');
  if (!_socialNotesCache) wrap.innerHTML = `<div class="page-loading" data-skel="notes-page"></div>`;   // not prefetched yet
  try {
    _socialNotesRaw = await _fetchSocialNotes();
    if (_notesMode === 'community') renderSocialNotes();
  } catch (err) {
    console.error('Load social notes error:', err);
    mssErrorPage(mssErrorKind(err), { in: wrap, error: err });
  }
}

/* ── Find notes by username — same live dropdown pattern used on friends.html ── */
let _nuTimer = null;
let _nuActive = -1;
let _nuResults = [];
let _nuFilterUser = null; // { id, username, avatar_url }

function _nuPosition() {
  const wrap = document.getElementById('notesUserSearchWrapInner');
  const drop = document.getElementById('nuDropdown');
  if (!wrap || !drop) return;
  const r = wrap.getBoundingClientRect();
  drop.style.top = r.bottom + 'px';
  drop.style.left = r.left + 'px';
  drop.style.width = r.width + 'px';
  drop.style.position = 'fixed';
}

async function _nuSearch(val) {
  const q = val.trim().toLowerCase();
  const drop = document.getElementById('nuDropdown');
  clearTimeout(_nuTimer);
  _nuActive = -1;
  if (q.length < 2) {
    drop.classList.remove('open');
    document.getElementById('notesUserSearchWrapInner')?.classList.remove('dd-connected-active');
    mssUnlockScroll('nuDropdown');
    return;
  }
  _nuPosition();
  drop.innerHTML = '<div class="ud-loading">Searching…</div>';
  drop.classList.add('open');
  document.getElementById('notesUserSearchWrapInner')?.classList.add('dd-connected-active');
  mssLockScroll('nuDropdown');
  _nuTimer = setTimeout(async () => {
    try {
      const [{ data: users }, { data: entries }] = await Promise.all([
        sb.from('profiles').select('id, username, display_name, avatar_url')
          .ilike('username', q + '%').neq('id', _notesUser?.id || '').limit(6),
        sb.from('entries').select('title, poster_url')
          .ilike('title', '%' + q + '%').not('notes', 'is', null).limit(20),
      ]);

      // De-dupe titles (many users can have a note on the same title)
      const seenTitles = new Set();
      const titleMatches = [];
      for (const e of (entries || [])) {
        const key = (e.title || '').toLowerCase();
        if (!key || seenTitles.has(key)) continue;
        seenTitles.add(key);
        titleMatches.push(e);
        if (titleMatches.length >= 6) break;
      }

      _nuResults = [
        ...(users || []).map(u => ({ type: 'user', ...u })),
        ...titleMatches.map(e => ({ type: 'title', ...e })),
      ];

      if (!_nuResults.length) {
        drop.innerHTML = '<div class="ud-empty">No matches found</div>';
        return;
      }

      const reg = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      drop.innerHTML = _nuResults.map((r, i) => {
        if (r.type === 'user') {
          const initial = (r.username[0] || '?').toUpperCase();
          const avatarHTML = safeURL(r.avatar_url)
            ? '<div class="ud-avatar"><img src="'+safeURL(r.avatar_url)+'" loading="lazy"></div>'
            : '<div class="ud-avatar">' + initial + '</div>';
          const highlighted = r.username.replace(reg, '<em>$1</em>');
          const display = r.display_name && r.display_name !== r.username ? r.display_name : '';
          return '<div class="ud-item" data-i="' + i + '" onmousedown="_nuSelectResult(' + i + ')">'
            + avatarHTML
            + '<div class="ud-info"><div class="ud-username">@' + highlighted + '</div>'
            + (display ? '<div class="ud-display">' + display + '</div>' : '') + '</div>'
            + '<span class="ud-type-tag">User</span></div>';
        }
        // title
        const avatarHTML = safeURL(r.poster_url)
          ? '<div class="ud-avatar"><img src="'+safeURL(r.poster_url)+'" loading="lazy"></div>'
          : '<div class="ud-avatar">' + ((r.title || '?')[0] || '?').toUpperCase() + '</div>';
        const highlighted = esc(r.title).replace(reg, '<em>$1</em>');
        return '<div class="ud-item" data-i="' + i + '" onmousedown="_nuSelectResult(' + i + ')">'
          + avatarHTML
          + '<div class="ud-info"><div class="ud-username">' + highlighted + '</div>'
          + '<div class="ud-display">Community notes</div></div>'
          + '<span class="ud-type-tag">Title</span></div>';
      }).join('');
    } catch (e) {
      console.error('Search error:', e);
      drop.innerHTML = '<div class="ud-empty">Error searching</div>';
    }
  }, 250);
}

function _nuKeydown(e) {
  const drop = document.getElementById('nuDropdown');
  const items = drop.querySelectorAll('.ud-item');
  if (!drop.classList.contains('open') || !items.length) return;
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    _nuActive = Math.min(_nuActive + 1, items.length - 1);
    items.forEach((el, i) => el.classList.toggle('ud-active', i === _nuActive));
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    _nuActive = Math.max(_nuActive - 1, -1);
    items.forEach((el, i) => el.classList.toggle('ud-active', i === _nuActive));
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (_nuActive >= 0) _nuSelectResult(_nuActive);
  } else if (e.key === 'Escape') {
    drop.classList.remove('open'); _nuActive = -1;
    document.getElementById('notesUserSearchWrapInner')?.classList.remove('dd-connected-active');
    mssUnlockScroll('nuDropdown');
  }
}

document.addEventListener('click', e => {
  const dd = document.getElementById('nuDropdown');
  if (dd && dd.classList.contains('open') && !e.target.closest('#notesUserSearchWrap') && !e.target.closest('#nuDropdown')) {
    dd.classList.remove('open');
    document.getElementById('notesUserSearchWrapInner')?.classList.remove('dd-connected-active');
    mssUnlockScroll('nuDropdown');
    _nuActive = -1;
  }
});

function _nuSelectResult(i) {
  const r = _nuResults[i];
  if (!r) return;
  document.getElementById('notesUserSearchInput').value = r.type === 'title' ? r.title : r.username;
  document.getElementById('nuDropdown').classList.remove('open');
  document.getElementById('notesUserSearchWrapInner')?.classList.remove('dd-connected-active');
  mssUnlockScroll('nuDropdown');
  _nuResults = []; _nuActive = -1;

  _nuForgetTitle();
  if (r.type === 'user') {
    _nuFilterUser = { id: r.id, username: r.username, avatar_url: r.avatar_url };
    _nuLoadUserNotes();
  } else {
    _nuLoadTitleNotes(r.title);
  }
}

function _nuClearFilter() {
  _nuForgetTitle();
  _nuFilterUser = null;
  document.getElementById('notesUserSearchInput').value = '';
  document.getElementById('notesUserFilterBanner').style.display = 'none';
  loadSocialNotes();
}

async function _nuLoadTitleNotes(title) {
  const wrap = document.getElementById('notesPageContent');
  wrap.innerHTML = `<div class="page-loading" data-skel="notes-page"></div>`;

  const banner = document.getElementById('notesUserFilterBanner');
  banner.style.display = 'flex';
  banner.innerHTML = `<span>Showing notes for "${esc(title)}"</span><button onclick="_nuClearFilter()">Clear</button>`;

  try {
    const { data: entries, error } = await sb.from('entries')
      .select('id, title, year, genres, tmdb_id, tmdb_type, poster_url, notes, note_visibility, final_score, created_at, completed_date, user_id, ratings')
      .ilike('title', title)
      .or('notes.not.is.null,note_visibility.neq.anyone')       // Friends / Private notes (069) live elsewhere
      .order('created_at', { ascending: false });
    if (error) throw error;

    const withNotes = (await mssWithPrivateNotes(entries || [])).filter(e => e.notes && e.notes.trim());
    const userIds = [...new Set(withNotes.map(e => e.user_id))];
    const { data: profiles } = userIds.length
      ? await sb.from('profiles').select('id, username, avatar_url').in('id', userIds)
      : { data: [] };
    const profileMap = {};
    (profiles || []).forEach(p => { profileMap[p.id] = p; });

    _socialNotesRaw = withNotes.map(e => {
      const p = profileMap[e.user_id] || {};
      return {
        entry_id: e.id, user_id: e.user_id, username: p.username || 'user', avatar_url: p.avatar_url || null,
        title: e.title, year: e.year, genres: e.genres, tmdb_id: e.tmdb_id, tmdb_type: e.tmdb_type, poster_url: e.poster_url,
        notes: e.notes, final_score: e.final_score, created_at: e.created_at, completed_date: e.completed_date, spoiler: mssIsSpoiler(e),
        like_count: 0, dislike_count: 0,
      };
    });

    if (_socialNotesRaw.length) {
      const entryIds = _socialNotesRaw.map(n => n.entry_id);
      const { data: allReactions } = await sb.from('note_reactions').select('entry_id, is_like').in('entry_id', entryIds);
      const counts = {};
      (allReactions || []).forEach(r => {
        if (!counts[r.entry_id]) counts[r.entry_id] = { like: 0, dislike: 0 };
        r.is_like ? counts[r.entry_id].like++ : counts[r.entry_id].dislike++;
      });
      _socialNotesRaw.forEach(n => {
        n.like_count = counts[n.entry_id]?.like || 0;
        n.dislike_count = counts[n.entry_id]?.dislike || 0;
      });

      if (_notesUser) {
        const { data: myReactions } = await sb.from('note_reactions')
          .select('entry_id, is_like').eq('user_id', _notesUser.id).in('entry_id', entryIds);
        _socialNotesMyReactions = {};
        (myReactions || []).forEach(r => { _socialNotesMyReactions[r.entry_id] = r.is_like ? 'like' : 'dislike'; });
      }
    }

    document.getElementById('notesPageSub').textContent = `${_socialNotesRaw.length} note${_socialNotesRaw.length !== 1 ? 's' : ''} for "${title}"`;
    renderSocialNotes();
  } catch (err) {
    console.error('Load title notes error:', err);
    mssErrorPage(mssErrorKind(err), { in: wrap, error: err });
  }
}

// Back to the whole Community: drop ?tmdb=…&type=…&t=…
function _nuForgetTitle() {
  if (!_notesTitle) return;
  _notesTitle = null;
  const url = new URL(location.href);
  ['tmdb', 'type', 't'].forEach(k => url.searchParams.delete(k));
  history.replaceState(history.state, '', url.pathname + url.search);
}

// Every Community note on one title — the same notes as its title page (get_notes_for_title)
async function _nuLoadTmdbNotes() {
  const t = _notesTitle, wrap = document.getElementById('notesPageContent');
  wrap.innerHTML = `<div class="page-loading" data-skel="notes-page"></div>`;
  const banner = document.getElementById('notesUserFilterBanner');
  banner.style.display = 'flex';
  banner.innerHTML = `<span>Showing notes for <a href="title.html?id=${t.id}&type=${t.type}" translate="no">${esc(t.name)}</a></span><button onclick="_nuClearFilter()">Clear</button>`;
  document.getElementById('notesUserSearchInput').value = '';
  try {
    const [{ data, error }, { data: one }] = await Promise.all([
      sb.rpc('get_notes_for_title', { p_tmdb_id: t.id, p_tmdb_type: t.type }),
      sb.from('entries').select('title, poster_url, cat, genres, year').eq('tmdb_id', t.id).eq('tmdb_type', t.type).not('poster_url', 'is', null).limit(1).maybeSingle(),
    ]);
    if (error) throw error;
    if (_notesTitle !== t) return;                           // cleared while loading
    const info = one || { title: t.name };
    _socialNotesRaw = (data || []).map(n => ({ ...n, title: info.title || t.name, poster_url: info.poster_url, cat: info.cat, genres: info.genres, year: info.year, tmdb_id: t.id, tmdb_type: t.type }));
    if (_notesUser && _socialNotesRaw.length) {
      const { data: mine } = await sb.from('note_reactions').select('entry_id, is_like').eq('user_id', _notesUser.id).in('entry_id', _socialNotesRaw.map(n => n.entry_id));
      _socialNotesMyReactions = {};
      (mine || []).forEach(r => { _socialNotesMyReactions[r.entry_id] = r.is_like ? 'like' : 'dislike'; });
    }
    document.getElementById('notesPageSub').textContent = `${_socialNotesRaw.length} note${_socialNotesRaw.length !== 1 ? 's' : ''} for "${t.name}"`;
    renderSocialNotes();
  } catch (err) {
    console.error('Load title notes error:', err);
    mssErrorPage(mssErrorKind(err), { in: wrap, error: err });
  }
}

async function _nuLoadUserNotes() {
  const wrap = document.getElementById('notesPageContent');
  wrap.innerHTML = `<div class="page-loading" data-skel="notes-page"></div>`;

  const banner = document.getElementById('notesUserFilterBanner');
  banner.style.display = 'flex';
  banner.innerHTML = `<span>Showing notes by @${esc(_nuFilterUser.username)}</span><button onclick="_nuClearFilter()">Clear</button>`;

  try {
    const { data: entries, error } = await sb.from('entries')
      .select('id, title, year, genres, tmdb_id, tmdb_type, poster_url, notes, note_visibility, final_score, created_at, completed_date, user_id, ratings')
      .eq('user_id', _nuFilterUser.id)
      .or('notes.not.is.null,note_visibility.neq.anyone')       // Friends / Private notes (069) live elsewhere
      .order('created_at', { ascending: false });
    if (error) throw error;

    const withNotes = (await mssWithPrivateNotes(entries || [])).filter(e => e.notes && e.notes.trim());
    _socialNotesRaw = withNotes.map(e => ({
      entry_id: e.id, user_id: e.user_id, username: _nuFilterUser.username, avatar_url: _nuFilterUser.avatar_url,
      title: e.title, year: e.year, genres: e.genres, tmdb_id: e.tmdb_id, tmdb_type: e.tmdb_type, poster_url: e.poster_url,
      notes: e.notes, final_score: e.final_score, created_at: e.created_at, completed_date: e.completed_date, spoiler: mssIsSpoiler(e),
      like_count: 0, dislike_count: 0,
    }));

    if (_socialNotesRaw.length) {
      const entryIds = _socialNotesRaw.map(n => n.entry_id);
      const { data: allReactions } = await sb.from('note_reactions').select('entry_id, is_like').in('entry_id', entryIds);
      const counts = {};
      (allReactions || []).forEach(r => {
        if (!counts[r.entry_id]) counts[r.entry_id] = { like: 0, dislike: 0 };
        r.is_like ? counts[r.entry_id].like++ : counts[r.entry_id].dislike++;
      });
      _socialNotesRaw.forEach(n => {
        n.like_count = counts[n.entry_id]?.like || 0;
        n.dislike_count = counts[n.entry_id]?.dislike || 0;
      });

      if (_notesUser) {
        const { data: myReactions } = await sb.from('note_reactions')
          .select('entry_id, is_like').eq('user_id', _notesUser.id).in('entry_id', entryIds);
        _socialNotesMyReactions = {};
        (myReactions || []).forEach(r => { _socialNotesMyReactions[r.entry_id] = r.is_like ? 'like' : 'dislike'; });
      }
    }

    document.getElementById('notesPageSub').textContent = `${_socialNotesRaw.length} note${_socialNotesRaw.length !== 1 ? 's' : ''} from @${_nuFilterUser.username}`;
    renderSocialNotes();
  } catch (err) {
    console.error('Load user notes error:', err);
    mssErrorPage(mssErrorKind(err), { in: wrap, error: err });
  }
}


function renderSocialNotes() {
  const wrap = document.getElementById('notesPageContent');
  const all = _socialNotesRaw || [];
  const searching = document.getElementById('notesUserFilterBanner').style.display === 'flex';
  _notesViews();
  if (!searching) {
    const weekAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;
    document.getElementById('notesPageSub').textContent = [_nWord(all.length, 'note'), _nWord(new Set(all.map(n => n.user_id)).size, 'writer'),
      _nWord(new Set(all.map(n => n.tmdb_id ? `${n.tmdb_type}:${n.tmdb_id}` : (n.title || '').trim().toLowerCase())).size, 'title'),
      `${all.filter(n => new Date(n.created_at).getTime() >= weekAgo).length} this week`].join(' · ');
  }
  const list = SF.list('notesSocial', 'all');
  if (!searching) mssSkeleton.shape('notes_c', { n: list.length });
  if (!all.length) {
    wrap.innerHTML = searching
      ? mssEmpty({ art: 'search', title: 'No notes here', text: 'Nothing public matches that search yet. Try someone else, or another title.',
          actions: [{ label: 'Clear search', icon: 'x', onclick: '_nuClearFilter()' }] })
      : mssEmpty({ art: 'notes', title: 'No public notes yet', text: 'The floor is yours. Say something brave about a finale.' });
    return;
  }
  if (!list.length) { wrap.innerHTML = _notesNoMatch('notesSocial'); return; }
  wrap.innerHTML = _notesGrid(list, n => MSSNote.cardHTML(n, { open: `_notesOpenSocial(${attrJSON(n.entry_id)})`, author: n, blur: n.user_id !== _notesUser?.id,
    react: { mine: _socialNotesMyReactions[n.entry_id], fn: 'reactToSocialNote' } }));
}

// Someone's note (with its reactions + replies) in their title's panel / page, opening on the Review
function _notesOpenSocial(entryId) {
  const n = _socialNotesRaw.find(x => x.entry_id === entryId);
  if (!n) return;
  MSSViews.open({ ...n, id: n.entry_id }, {
    start: 'note', note: true, own: !!_notesUser && n.user_id === _notesUser.id, from: 'notes.html',
    profile: { id: n.user_id, username: n.username, avatar_url: n.avatar_url },
    onReact: st => _notesSetReact(n, st),
  });
}

// Like / dislike someone's note: from the card (double-tap) or the note's panel
function _notesSetReact(n, st) {
  n.like_count = st.like; n.dislike_count = st.dislike;
  if (st.mine) _socialNotesMyReactions[n.entry_id] = st.mine; else delete _socialNotesMyReactions[n.entry_id];
  renderSocialNotes();
}
function reactToSocialNote(entryId, isLike) {
  const n = _socialNotesRaw.find(x => x.entry_id === entryId);
  if (!n) return Promise.resolve();
  return mssReactFeed('note', entryId, isLike,
    () => ({ like: n.like_count, dislike: n.dislike_count, mine: _socialNotesMyReactions[entryId] || null }),
    st => _notesSetReact(n, st));
}

/* ── Write a note: a side panel S (full page on phones) to pick the title from your library; then the
   title's own panel opens, writing its review / note in place (title-view.js) ── */
let _notesSearchPanel = null, _notesPick = null, _notesActiveId = -1, _notesSearchResultsList = [];
async function openNotesSearchPopup() {
  if (mssGuestGate('write notes')) return;
  _notesActiveId = -1;
  _notesSearchResultsList = [];
  await mssLoadScript('js/panel.js');
  const h = MSSPanel.open({ size: 'S', kind: 'generic', title: 'Write a note',
    body: `<div class="lyr-search"><span class="lyr-search-ic" aria-hidden="true">${icon('search', 16)}</span>
        <input type="text" id="notesSearchInput" class="lyr-field" placeholder="Search your library…" aria-label="Search your library" autocomplete="off" enterkeyhint="search" oninput="_notesPageSearch(this.value)" onkeydown="_notesPageSearchKeydown(event)"></div>
      <div id="notesSearchResults" aria-live="polite"></div>`,
    onClose: () => {
      if (_notesSearchPanel === h) _notesSearchPanel = null;
      const id = _notesPick; _notesPick = null;
      if (id) _notesOpen(id, true);            // the title's panel, once this one has fully gone (its Back would close a new one)
    } });
  _notesSearchPanel = h;
  if (!h.isPage) document.getElementById('notesSearchInput').focus();
}

// rated, or Watched / To Be Continued — the titles with a Review tab (title-view.js's rating design)
const _notesCanWrite = e => liveScore(e) != null || e.status === 'completed' || e.status === 'ongoing';

/* ── Search (client-side, filters the already-loaded library) ── */
function _notesPageSearch(query) {
  const resultsEl = document.getElementById('notesSearchResults');
  const q = query.trim().toLowerCase();
  _notesActiveId = -1;
  // A review is written on a rated title's Review tab — titles you haven't rated have no note (Cards 2)
  _notesSearchResultsList = q ? _notesEntries.filter(e => _notesCanWrite(e) && e.title && e.title.toLowerCase().includes(q)).slice(0, 20) : [];
  if (!q) { resultsEl.innerHTML = ''; return; }
  if (!_notesSearchResultsList.length) { resultsEl.innerHTML = `<p class="lyr-rows-msg">No matches in your library.</p>`; return; }
  resultsEl.innerHTML = `<ul class="lyr-rows">${_notesSearchResultsList.map((e, i) => mssRowHTML({ img: e.poster_url, title: e.title,
    sub: (CAT_META[e.cat]?.label || '') + (e.year ? ' · ' + e.year : ''), tag: e.notes && e.notes.trim() ? 'Has Note' : '', attrs: `data-i="${i}" onclick="_notesPageSearchPick(${i})"` })).join('')}</ul>`;
}

function _notesPageSearchKeydown(e) {
  if (!_notesSearchResultsList.length) return;
  const items = document.querySelectorAll('#notesSearchResults .lyr-row');
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    _notesActiveId = e.key === 'ArrowDown' ? Math.min(_notesActiveId + 1, items.length - 1) : Math.max(_notesActiveId - 1, 0);
    items.forEach((el, i) => el.classList.toggle('is-active', i === _notesActiveId));
    items[_notesActiveId]?.scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (_notesActiveId >= 0) _notesPageSearchPick(_notesActiveId);
    else if (_notesSearchResultsList.length === 1) _notesPageSearchPick(0);
  }
}

function _notesPageSearchPick(i) {
  const e = _notesSearchResultsList[i];
  if (!e) return;
  _notesPick = e.id;
  _notesSearchPanel?.closeNow();
}
