<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes — MyScreenScore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E5C26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MyScreenScore">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<style>
/* ── Personal / Social toggle ── */
.pn-toggle {
  display:flex; width:fit-content; margin:0 auto 1.5rem;
  background:var(--bg-3); border:0.5px solid var(--border-2); border-radius:var(--radius-sm); overflow:hidden;
}
.pn-toggle-btn {
  padding:10px 32px; font-size:13.5px; font-weight:600;
  background:none; border:none; color:var(--text-3); cursor:pointer;
  transition:all .15s;
}
.pn-toggle-btn + .pn-toggle-btn { border-left:0.5px solid var(--border-2); }
.pn-toggle-btn:hover { color:var(--text); }
.pn-toggle-btn.active { background:var(--olive); color:#fff; }

/* ── Social note row — same layout as .note-row, plus avatar/username ── */
.snote-row-head { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.snote-avatar {
  width:22px; height:22px; border-radius:50%; overflow:hidden; flex-shrink:0;
  background:var(--olive-faint); color:var(--olive-light); font-family:var(--serif); font-size:11px;
  display:flex; align-items:center; justify-content:center;
}
.snote-avatar img { width:100%; height:100%; object-fit:cover; }
.snote-username { font-size:12px; color:var(--text-3); font-weight:500; }
.snote-actions { display:flex; gap:14px; margin-top:8px; }
.snote-rating {
  position:absolute; top:16px; right:18px; font-size:13px; font-weight:600;
  color:var(--olive-light); white-space:nowrap;
}
.snote-react-btn {
  display:inline-flex; align-items:center; gap:5px; background:none; border:none; cursor:pointer;
  color:var(--text-3); font-size:12.5px; font-weight:600; transition:color .15s;
}
.snote-react-btn:hover { color:var(--text); }
.snote-react-btn.active-like { color:var(--olive-light); }
.snote-react-btn.active-dislike { color:#c0685a; }
.snote-react-btn svg, .snote-rect-btn svg { transition:transform .3s, fill .3s; }
.snote-react-btn:hover svg, .snote-rect-btn:hover svg { transform:scale(1.15) rotate(-8deg); }
.snote-rect-btn {
  flex:1; display:flex; align-items:center; justify-content:center; gap:8px;
  padding:11px 0; border-radius:var(--radius-sm); font-size:13.5px; font-weight:600;
  background:var(--bg-3); border:0.5px solid var(--border-2); color:var(--text-3); cursor:pointer;
  transition:all .15s;
}
.snote-rect-btn:hover { border-color:var(--border-olive); color:var(--text); }
.snote-rect-btn.active-like { background:var(--olive-faint); border-color:var(--border-olive); color:var(--olive-light); }
.snote-rect-btn.active-dislike { background:rgba(192,104,90,0.12); border-color:rgba(192,104,90,0.4); color:#c0685a; }
.note-row { position:relative; }
.dt-heart-pop {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) scale(0.4);
  font-size:56px; color:var(--olive-light); text-shadow:0 2px 14px rgba(0,0,0,.35);
  pointer-events:none; opacity:0; animation:dtHeartPop .7s ease forwards; z-index:5;
}
@keyframes dtHeartPop {
  0%   { opacity:0; transform:translate(-50%,-50%) scale(0.4); }
  25%  { opacity:1; transform:translate(-50%,-50%) scale(1.15); }
  40%  { transform:translate(-50%,-50%) scale(0.95); }
  100% { opacity:0; transform:translate(-50%,-50%) scale(1); }
}

/* ── Header buttons ── */
.notes-header-btns { display:flex; gap:8px; flex-wrap:wrap; }
@media(max-width:520px){
  .notes-header-btns { width:100%; }
  .notes-header-btns .btn-add-entry { flex:1; font-size:clamp(11px,3vw,13px); padding:10px 12px; }
}

/* ── Search popup (opened via + Add Note / Edit Note) ── */
.notes-search-overlay {
  position:fixed; inset:0; z-index:1150; background:rgba(0,0,0,0.72);
  backdrop-filter:blur(6px); display:flex; align-items:flex-start; justify-content:center;
  padding:16px; padding-top:max(16px, env(safe-area-inset-top)); box-sizing:border-box;
  opacity:0; pointer-events:none; transition:opacity .2s; overflow-y:auto;
}
.notes-search-overlay.open { opacity:1; pointer-events:auto; }
.notes-search-card {
  width:100%; max-width:480px; max-height:calc(100dvh - 32px); display:flex; flex-direction:column;
  background:var(--bg-2); border:1.5px solid var(--olive-light);
  box-shadow:4px 4px 0 var(--olive); border-radius:var(--radius-lg);
  transform:translateY(16px); transition:transform .25s cubic-bezier(.4,0,.2,1);
  overflow:hidden; margin-top:4vh;
}
.notes-search-overlay.open .notes-search-card { transform:translateY(0); }
.notes-search-card-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:18px 20px; border-bottom:0.5px solid var(--border); flex-shrink:0;
}
.notes-search-card-title { font-family:var(--serif); font-size:20px; font-weight:500; color:var(--text); }
.notes-search-card-close { background:none; border:none; color:var(--text-3); cursor:pointer; font-size:20px; line-height:1; }
.notes-search-card-close:hover { color:var(--text); }
.notes-search-input-wrap { position:relative; padding:16px 20px 12px; flex-shrink:0; }
.notes-search-input {
  width:100%; box-sizing:border-box; padding:11px 14px 11px 40px;
  border-radius:var(--radius-sm); border:1px solid var(--border);
  background:var(--bg-3); color:var(--text); font-family:var(--sans);
  font-size:16px; outline:none; transition:border-color .15s;
}
.notes-search-input:focus { border-color:var(--olive-light); }
.notes-search-icon {
  position:absolute; left:33px; top:50%; transform:translateY(-50%);
  color:var(--text-3); pointer-events:none;
}
.notes-search-results {
  overflow-y:auto; overscroll-behavior-y:contain; padding:4px 10px 16px;
}
.notes-search-item {
  display:flex; align-items:center; gap:12px; padding:10px 10px;
  border-radius:var(--radius-sm); cursor:pointer; transition:background-color .12s;
}
.notes-search-item:hover, .notes-search-item.active { background:var(--olive-faint); }
.notes-search-item-poster {
  width:36px; height:52px; border-radius:var(--radius-xs); flex-shrink:0;
  background:var(--bg-3); overflow:hidden; display:flex; align-items:center;
  justify-content:center; font-family:var(--serif); font-size:15px; color:var(--olive-light);
}
.notes-search-item-poster img { width:100%; height:100%; object-fit:cover; }
.notes-search-item-info { flex:1; min-width:0; }
.notes-search-item-title {
  font-size:14px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.notes-search-item-meta { font-size:11px; color:var(--text-3); margin-top:2px; }
.notes-search-item-has-note {
  font-size:9px; letter-spacing:.5px; text-transform:uppercase;
  color:var(--olive-light); background:var(--olive-faint);
  border:0.5px solid var(--border-olive); border-radius:20px; padding:2px 7px;
  flex-shrink:0;
}
.notes-search-empty { padding:24px 14px; text-align:center; font-size:13px; color:var(--text-3); }

/* ── Sort bar ── */
.notes-sort-bar { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:1.25rem; }
.notes-user-search-wrap { margin-bottom:1.25rem; }
.username-dropdown {
  position:fixed;
  background:var(--bg-3); border:0.5px solid var(--olive-light); border-top:none;
  border-radius:0 0 var(--radius) var(--radius); z-index:290;
  box-shadow:var(--shadow-lg);
  overflow-y:auto; overflow-x:hidden; max-height:320px;
  display:none;
}
.username-dropdown.open { display:block; }
.ud-item {
  display:flex; align-items:center; gap:12px;
  padding:10px 14px; cursor:pointer;
  transition:background .15s;
  border-bottom:0.5px solid var(--border);
}
.ud-item:last-child { border-bottom:none; }
.ud-item:hover, .ud-item.ud-active { background:var(--olive-faint); }
.ud-avatar {
  width:36px; height:36px; border-radius:50%; flex-shrink:0;
  background:var(--bg-3); border:1px solid var(--border-2);
  font-family:var(--serif); font-size:16px; color:var(--text-2);
  display:flex; align-items:center; justify-content:center; overflow:hidden;
}
.ud-avatar img { width:100%; height:100%; object-fit:cover; border-radius:50%; }
.ud-info { flex:1; min-width:0; }
.ud-username { font-size:14px; font-weight:500; color:var(--text); }
.ud-username em { color:var(--olive-light); font-style:normal; font-weight:600; }
.ud-display { font-size:11px; color:var(--text-3); margin-top:2px; }
.ud-loading, .ud-empty { padding:14px; font-size:13px; color:var(--text-3); text-align:center; }
.ud-type-tag {
  font-size:9.5px; font-weight:700; letter-spacing:.5px; text-transform:uppercase;
  color:var(--olive-light); background:var(--olive-faint); border:0.5px solid var(--border-olive);
  border-radius:20px; padding:2px 8px; flex-shrink:0;
}
.notes-user-search-wrap .fused-search-wrap {
  display:flex; align-items:stretch;
  border:1.5px solid var(--border-olive); border-radius:var(--radius-sm); overflow:hidden;
  background:var(--bg-3); transition:border-color var(--trans) var(--ease), box-shadow var(--trans) var(--ease);
}
.notes-user-search-wrap .fused-search-wrap:focus-within { border-color:var(--olive-light); box-shadow:0 0 0 3px var(--olive-faint); }
.notes-user-search-wrap .add-friend-input {
  flex:1; min-width:0; background:transparent; border:none;
  color:var(--text); font-size:16px;
  padding:18px 20px; outline:none; box-sizing:border-box; transition:none;
}
.notes-user-search-wrap .add-friend-input::placeholder { color:var(--text-3); font-size:14px; }
.notes-user-search-wrap .fused-search-btn {
  flex-shrink:0; display:flex; align-items:center; gap:8px;
  padding:0 26px; border:none; cursor:pointer;
  background:linear-gradient(135deg, var(--olive-light), var(--olive-2)); color:#fff;
  font-size:14px; font-weight:500; font-family:var(--sans);
  transition:opacity .15s;
}
.notes-user-search-wrap .fused-search-btn:hover { opacity:.9; }
.notes-user-search-wrap .fused-search-btn svg { width:16px; height:16px; flex-shrink:0; }
#notesUserFilterBanner {
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  background:var(--olive-faint); border:0.5px solid var(--border-olive); border-radius:var(--radius);
  padding:10px 16px; margin-top:10px; font-size:13.5px; color:var(--olive-light); font-weight:500;
}
#notesUserFilterBanner button {
  background:none; border:none; color:var(--olive-light); font-size:12.5px; font-weight:600; cursor:pointer; text-decoration:underline;
}

/* ── Note card list (reused from profile.html's Notes tab design) ── */
.note-row{display:flex;gap:20px;align-items:flex-start;padding:20px 24px;background:var(--card);border:0.5px solid var(--border);border-radius:var(--radius-lg);margin-bottom:10px;cursor:pointer;transition:all var(--trans) var(--ease);}
.note-row:hover{border-color:var(--border-olive);background:var(--card-2);}
.note-row-personal:hover{border-color:var(--border);background:var(--card);}
.note-poster{width:84px;height:120px;border-radius:var(--radius-sm);object-fit:cover;flex-shrink:0;background:var(--olive-faint);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:24px;color:var(--olive-light);overflow:hidden;}
.note-poster img{width:100%;height:100%;object-fit:cover;border-radius:var(--radius-sm);}
.note-body{flex:1;min-width:0;}
.note-title{font-size:18px;font-weight:600;color:var(--text);margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.note-tags{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:4px;}
.note-date{font-size:11px;color:var(--text-3);white-space:nowrap;}
.note-text{font-size:13px;color:var(--text-2);font-style:italic;line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-top:6px;}
.note-score{font-family:var(--bebas);font-size:27px;font-weight:400;color:var(--olive-light);flex-shrink:0;line-height:1;}
@media(max-width:640px){
  .note-row { padding:12px 14px; gap:12px; border-radius:var(--radius); }
  .note-poster { width:64px; height:90px; font-size:20px; }
  .note-title { font-size:15px; }
  .note-tags { gap:4px; margin-bottom:3px; }
  .note-text { font-size:11px; margin-top:4px; }
  .note-score { font-size:20px; }
  .note-date { font-size:10px; }
  .notes-search-card-header { padding:14px 16px; }
  .notes-search-card-title { font-size:18px; }
  .notes-search-input-wrap { padding:14px 16px 10px; }
  .notes-search-input { padding:11px 14px 11px 38px; font-size:16px; }
  .notes-search-icon { left:29px; }
  .notes-search-item { padding:9px 8px; gap:10px; }
  .notes-search-item-poster { width:32px; height:46px; font-size:13px; }
  .notes-search-item-title { font-size:13px; }
  .notes-search-item-meta { font-size:10px; }
  .notes-search-item-has-note { font-size:8px; padding:2px 6px; }
}
@media(max-width:400px){
  .note-row { padding:10px 12px; gap:10px; }
  .note-poster { width:54px; height:76px; font-size:18px; }
  .note-title { font-size:13px; }
  .note-text { font-size:10px; }
  .note-score { font-size:17px; }
  .notes-search-card-header { padding:12px 14px; }
  .notes-search-card-title { font-size:16px; }
  .notes-search-input-wrap { padding:12px 14px 8px; }
  .notes-search-input { padding:10px 12px 10px 34px; }
  .notes-search-icon { left:25px; width:14px; height:14px; }
  .notes-search-results { max-height:280px; }
  .notes-search-item { padding:8px 10px; gap:8px; }
  .notes-search-item-poster { width:28px; height:40px; font-size:12px; }
  .notes-search-item-title { font-size:12px; }
}

/* ── Note popup (same visual design as profile.html's notePopup2, but
   editable here instead of view-then-navigate-away) ── */
.note-popup-overlay2{position:fixed;inset:0;z-index:1100;background:rgba(0,0,0,0.6);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .2s;}
.note-popup-overlay2.open{opacity:1;pointer-events:auto;}
.note-popup2{width:100%;max-width:520px;background:var(--bg-2);border:1.5px solid var(--olive-light);box-shadow:4px 4px 0 var(--olive);border-radius:var(--radius-lg);overflow:hidden;transform:scale(.96);transition:transform .22s cubic-bezier(0.4,0,0.2,1);position:relative;max-height:90dvh;display:flex;flex-direction:column;}
.note-popup-overlay2.open .note-popup2{transform:scale(1);}
.note-popup2-header{position:relative;height:150px;flex-shrink:0;overflow:hidden;}
.note-popup2-header-blur{position:absolute;inset:-16px;background-size:cover;background-position:center 25%;filter:blur(20px) brightness(0.55);transform:scale(1.15);}
.note-popup2-header-fade{position:absolute;inset:0;background:linear-gradient(to bottom, rgba(0,0,0,0.1), var(--bg-2) 95%);}
.note-popup2-info-row{padding:0 20px 16px;margin-top:-56px;position:relative;display:flex;gap:16px;align-items:flex-end;}
.note-popup2-poster{width:82px;height:120px;border-radius:10px;overflow:hidden;flex-shrink:0;background:var(--olive-faint);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:26px;color:var(--olive-light);border:3px solid var(--bg-2);box-shadow:0 6px 16px rgba(0,0,0,0.35);}
.note-popup2-poster img{width:100%;height:100%;object-fit:cover;}
.note-popup2-info{flex:1;min-width:0;padding-bottom:4px;}
.note-popup2-title{font-family:var(--serif);font-size:21px;font-weight:500;color:var(--text);margin-bottom:5px;line-height:1.2;}
.note-popup2-close{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,0.5);backdrop-filter:blur(4px);border:none;color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2;}
.note-popup2-reactions{display:flex;gap:14px;padding:0 20px 14px;border-bottom:0.5px solid var(--border);}
.note-popup2-reaction-count{display:inline-flex;align-items:center;gap:6px;color:var(--text-3);font-size:12.5px;font-weight:500;}
.note-popup2-tags{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:5px;}
.note-popup2-date{font-size:11px;color:var(--text-3);}
.note-popup2-body{padding:16px 20px 20px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;overscroll-behavior-y:contain;}
.note-popup2-text{font-size:14px;color:var(--text-2);font-style:italic;line-height:1.7;}
.note-popup2-empty{font-size:13px;color:var(--text-3);}
.note-popup2-textarea{
  width:100%; box-sizing:border-box; min-height:160px; resize:vertical;
  padding:12px 14px; border-radius:var(--radius-sm); border:1px solid var(--border);
  background:var(--bg-3); color:var(--text); font-family:var(--sans); font-size:16px;
  line-height:1.6; outline:none; transition:border-color .15s;
}
.note-popup2-textarea:focus{border-color:var(--olive-light);}
.note-popup2-count{font-size:10.5px;color:var(--text-3);text-align:right;}
.note-popup2-count.over{color:#c0564a;}
.note-popup2-footer{display:flex;gap:10px;padding:14px 20px;border-top:0.5px solid var(--border);flex-shrink:0;}
.note-popup2-cancel{flex:1;padding:10px;border-radius:var(--radius-sm);background:var(--bg-3);color:var(--text-2);border:0.5px solid var(--border);font-family:var(--sans);font-size:14px;cursor:pointer;}
.note-popup2-edit{flex:1;padding:10px;border-radius:var(--radius-sm);background:var(--olive-faint);color:var(--olive-light);border:0.5px solid var(--border-olive);font-family:var(--sans);font-size:14px;font-weight:600;cursor:pointer;}
.note-popup2-save{flex:2;padding:10px;border-radius:var(--radius-sm);background:var(--olive);color:#fff;border:none;font-family:var(--sans);font-size:14px;font-weight:600;cursor:pointer;}
.note-popup2-save:disabled{opacity:.5;cursor:default;}
@media(max-width:640px){
  .note-popup2-header{height:120px;}
  .note-popup2-poster{width:66px;height:96px;font-size:20px;}
  .note-popup2-title{font-size:17px;}
  .note-popup2-body{padding:14px 16px 18px;}
  .note-popup2-textarea{min-height:130px;padding:10px 12px;}
  .note-popup2-footer{padding:12px 16px;}
  .note-popup2-cancel,.note-popup2-edit,.note-popup2-save{padding:9px;font-size:13px;}
  .note-popup2-text{font-size:13px;}
}
@media(max-width:400px){
  .note-popup2-header{height:100px;}
  .note-popup2-poster{width:56px;height:82px;font-size:17px;}
  .note-popup2-title{font-size:15px;}
  .note-popup2-body{padding:12px 14px 16px;}
  .note-popup2-textarea{min-height:110px;}
  .note-popup2-count{font-size:10px;}
}
/* ══════════════════════════════════════════
   v576 — Notes redesign (cards, toolbar, popups)
══════════════════════════════════════════ */
.notes-toolbar {
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  margin:0 0 1.1rem; padding-bottom:12px; border-bottom:0.5px solid var(--border);
}
.notes-toolbar-label { display:flex; align-items:baseline; gap:10px; min-width:0; }
.notes-toolbar-title { font-family:var(--serif); font-size:13px; font-weight:500; letter-spacing:2.5px; text-transform:uppercase; color:var(--olive-light); white-space:nowrap; }
.notes-toolbar-count { font-size:12px; color:var(--text-3); white-space:nowrap; }
.notes-toolbar-count b { font-family:var(--bebas); font-weight:400; font-size:15px; color:var(--text-2); letter-spacing:.3px; }
.notes-toolbar .sort-bar { border-bottom:none; padding:0; margin:0; background:transparent; position:relative; backdrop-filter:none; -webkit-backdrop-filter:none; }
.notes-toolbar .sort-bar::before { content:none; }
.notes-empty { padding:3rem 1rem; text-align:center; font-size:13px; color:var(--text-3); }
@media(max-width:640px) { #notesPageStats { display:grid; grid-template-columns:repeat(2, 1fr); } }

/* ── Note cards ── */
.nc-grid { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:14px; }
@media(max-width:900px) { .nc-grid { grid-template-columns:1fr; gap:10px; } }
.nc-card {
  position:relative; display:flex; gap:16px; padding:16px; min-width:0;
  background:var(--card); border:0.5px solid var(--border); border-radius:var(--radius-lg);
  cursor:pointer; transition:border-color .15s, transform .15s, box-shadow .15s;
}
.nc-card:hover { border-color:var(--border-olive); transform:translateY(-2px); box-shadow:var(--shadow); }
.nc-poster {
  width:86px; aspect-ratio:2/3; flex-shrink:0; align-self:flex-start; border-radius:var(--radius-sm); overflow:hidden;
  background:var(--olive-faint); display:flex; align-items:center; justify-content:center;
  font-family:var(--serif); font-size:26px; color:var(--olive-light); box-shadow:0 3px 10px rgba(0,0,0,.14);
}
.nc-poster img { width:100%; height:100%; object-fit:cover; display:block; }
.nc-main { flex:1; min-width:0; display:flex; flex-direction:column; }
.nc-top { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px; min-height:22px; }
.nc-author { display:flex; align-items:center; gap:7px; min-width:0; font-size:12px; color:var(--text-3); }
.nc-author .snote-avatar { width:22px; height:22px; }
.nc-author span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.nc-date { font-size:11.5px; color:var(--text-3); white-space:nowrap; }
.nc-score {
  font-family:var(--bebas); color:var(--olive-light); font-size:clamp(17px, 3.8vw, 19px); font-weight:400;
  line-height:1; white-space:nowrap; flex-shrink:0;
}
.nc-title { font-family:var(--serif); font-size:18px; font-weight:500; line-height:1.25; color:var(--text); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.nc-top .nc-title { flex:1; }
.nc-tags .type-label, .nc-tags .w-ep-badge { font-size:11px; padding:3px 8px; }
.nc-tags { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:8px; }
.nc-quote {
  margin:0 0 12px; padding:2px 0 2px 12px; border-left:2px solid var(--border-olive);
  font-size:13.5px; line-height:1.6; color:var(--text-2); font-style:italic; overflow-wrap:anywhere;
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
}
.nc-foot { margin-top:auto; display:flex; align-items:center; justify-content:space-between; gap:10px; padding-top:10px; border-top:0.5px solid var(--border); }
.nc-reacts { display:flex; gap:14px; }
.nc-words { font-size:11.5px; color:var(--text-3); white-space:nowrap; }
.nc-words b { font-family:var(--bebas); font-weight:400; font-size:14px; color:var(--text-2); letter-spacing:.3px; }
@media(max-width:640px) {
  .nc-card { padding:12px; gap:12px; border-radius:var(--radius); }
  .nc-poster { width:66px; font-size:20px; }
  .nc-title { font-size:15.5px; }
  .nc-quote { font-size:12.5px; -webkit-line-clamp:3; margin-bottom:10px; }
  .nc-score { font-size:13px; padding:3px 8px 2px; }
}
@media(max-width:380px) { .nc-poster { width:56px; } .nc-tags { display:none; } }

/* ── Popups (Personal + Community share this design) ── */
.note-popup-overlay2, #snPopupOverlay { background:rgba(0,0,0,.55) !important; -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px) !important; }
.np-card { max-width:540px !important; background:var(--bg-2) !important; border:0.5px solid var(--border) !important; box-shadow:0 28px 70px rgba(0,0,0,.4) !important; display:flex; flex-direction:column; max-height:90dvh; }
#snPopupCard.np-card { border-radius:var(--radius-lg); overflow-y:auto; overflow-x:hidden; width:100%; }
.np-hero { position:relative; height:230px; flex-shrink:0; overflow:hidden; background:linear-gradient(135deg, var(--olive) 0%, var(--olive-faint) 70%); }
/* Blurred poster that melts into the card: blur + a masked fade instead of a hard gradient band */
.np-hero-blur {
  position:absolute; inset:-30px; background-size:cover; background-position:center 25%;
  filter:blur(22px) saturate(1.2) brightness(.8); transform:scale(1.1);
  transition:filter .45s ease, inset .45s ease, transform .45s ease;
}
/* TMDB backdrop loaded: show it sharp and full-strength */
.np-hero-blur.is-backdrop { inset:0; filter:none; transform:none; background-position:center 30%; }
.np-hero-fade { position:absolute; inset:0; background:linear-gradient(to bottom, rgba(0,0,0,.25) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0) 55%, var(--bg-2) 100%); pointer-events:none; }
.np-close {
  position:absolute; top:12px; right:12px; width:34px; height:34px; border-radius:50%;
  background:rgba(0,0,0,.42); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  border:0.5px solid rgba(255,255,255,.18); color:#fff; font-size:15px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; transition:background .15s;
}
.np-close:hover { background:rgba(0,0,0,.62); }
.np-head { position:relative; display:flex; gap:18px; align-items:flex-end; padding:0 22px; margin-top:-96px; }
.np-poster {
  width:122px; aspect-ratio:2/3; flex-shrink:0; border-radius:10px; overflow:hidden;
  background:var(--olive-faint); display:flex; align-items:center; justify-content:center;
  font-family:var(--serif); font-size:34px; color:var(--olive-light);
  border:none; box-shadow:0 12px 30px rgba(0,0,0,.4);
}
.np-poster img { width:100%; height:100%; object-fit:cover; display:block; }
.np-head-info { flex:1; min-width:0; padding-bottom:2px; }
.np-eyebrow { font-family:var(--serif); font-size:11px; font-weight:500; letter-spacing:2.5px; text-transform:uppercase; color:var(--olive-light); margin-bottom:4px; display:flex; align-items:center; gap:7px; }
.np-eyebrow .snote-avatar { width:20px; height:20px; font-size:10px; letter-spacing:0; }
.np-eyebrow .np-user { font-family:var(--sans); letter-spacing:0; text-transform:none; font-size:12.5px; font-weight:600; color:var(--text-2); }
.np-title { font-family:var(--serif); font-size:clamp(18px, 4.6vw, 23px); font-weight:500; line-height:1.2; color:var(--text); margin-bottom:6px; overflow-wrap:anywhere; }
.np-meta { display:flex; flex-wrap:wrap; align-items:center; gap:6px; font-size:11.5px; color:var(--text-3); }
/* Badges on the left, score on the right of the same row (below the header image) */
.np-meta-row { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
.np-meta-row .np-meta { flex:1; min-width:0; }
.np-score-slot { flex-shrink:0; display:inline-flex; }
.np-score-slot:empty { display:none; }
.np-score-slot { min-height:27px; align-items:center; }   /* lines up with the first row of badges */
.np-score-slot .nc-score { font-size:clamp(20px, 4.6vw, 25px); }
.np-meta .type-label, .np-meta .w-ep-badge { font-size:12px; padding:5px 10px; }
.np-stats { display:flex; align-items:center; gap:16px; padding:14px 22px 0; font-size:12.5px; color:var(--text-3); }
.np-stats span { display:inline-flex; align-items:center; gap:5px; }
.np-stats b { font-family:var(--bebas); font-weight:400; font-size:15px; color:var(--text-2); letter-spacing:.3px; }
.np-body { padding:16px 22px 18px; overflow-y:auto; overscroll-behavior-y:contain; display:flex; flex-direction:column; gap:8px; }
.np-quote { margin:0; padding:4px 0 4px 14px; border-left:3px solid var(--olive-light); font-size:15px; line-height:1.75; color:var(--text); font-style:italic; white-space:pre-line; overflow-wrap:anywhere; }
.np-textarea {
  width:100%; box-sizing:border-box; min-height:170px; resize:vertical; padding:14px;
  border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--bg-3); color:var(--text);
  font-family:var(--sans); font-size:16px; line-height:1.6; outline:none; transition:border-color .15s, box-shadow .15s;
}
.np-textarea:focus { border-color:var(--olive-light); box-shadow:0 0 0 3px var(--olive-faint); }
.np-count { font-size:11px; color:var(--text-3); text-align:right; }
.np-footer { padding:14px 22px 18px; border-top:0.5px solid var(--border); flex-shrink:0; }
.np-actions { display:flex; gap:8px; padding:0 !important; flex-direction:row !important; }
.np-actions .popup-action-btn { padding:11px 14px; font-size:13.5px; gap:7px; flex:1 1 0; width:auto !important; white-space:nowrap; }
.np-actions .popup-action-btn svg { opacity:1; }
.np-actions .np-grow { flex:3 1 0 !important; }
.np-actions .np-ghost { background:transparent !important; color:var(--text-2) !important; border-color:var(--border-2) !important; }
.np-actions .np-ghost:hover { color:var(--text) !important; border-color:var(--border-olive) !important; background:var(--olive-faint) !important; }
.np-actions .np-react { flex:0 0 auto !important; min-width:70px; background:transparent !important; color:var(--olive-light) !important; border-color:var(--border-olive) !important; }
.np-actions .np-react:hover { background:var(--olive-faint) !important; }
.np-actions .np-react.is-on { background:var(--olive) !important; color:#fff !important; border-color:var(--olive) !important; }
.np-actions .np-react-down.is-on { background:#b91c1c !important; border-color:#b91c1c !important; }
.np-actions .popup-action-btn:disabled { opacity:.55; cursor:default; }
@media(max-width:640px) {
  .np-hero { height:170px; }
  .np-head { margin-top:-74px; padding:0 16px; gap:14px; }
  .np-meta .type-label, .np-meta .w-ep-badge { font-size:11px; padding:4px 8px; }
  .np-poster { width:96px; font-size:26px; }
  .np-stats { padding:12px 16px 0; }
  .np-body { padding:14px 16px 16px; }
  .np-quote { font-size:14px; }
  .np-footer { padding:12px 16px 16px; }
  .np-actions .popup-action-btn { padding:10px 10px; font-size:13px; }
}
@media(max-width:380px) {
  .np-poster { width:82px; }
  .np-actions .np-react { min-width:58px; }
}
</style>

<body>
<div class="page-wrap">

  <!-- Header -->
  <div class="cat-page-header fade-up">
    <div class="cat-page-header-left">
      <h1 class="cat-page-title" id="notesPageTitle">My Notes</h1>
      <div class="cat-page-sub" id="notesPageSub"></div>
    </div>
    <div class="cat-page-header-right notes-header-btns">
      <button class="btn-add-entry" onclick="openNotesSearchPopup('add')">+ Add Note</button>
      <button class="btn-add-entry" onclick="openNotesSearchPopup('edit')">Edit Note</button>
    </div>
  </div>

  <!-- Personal / Social toggle -->
  <div class="pn-toggle fade-up" id="notesModeToggle">
    <button class="pn-toggle-btn active" data-mode="personal" onclick="setNotesMode('personal')">Personal</button>
    <button class="pn-toggle-btn" data-mode="social" onclick="setNotesMode('social')">Community</button>
  </div>

  <!-- Stat boxes -->
  <div class="page-stats fade-up fade-up-1" id="notesPageStats"></div>

  <!-- Social: user search -->
  <div class="notes-user-search-wrap fade-up fade-up-1" id="notesUserSearchWrap" style="display:none;">
    <div class="fused-search-wrap" id="notesUserSearchWrapInner">
      <input type="text" id="notesUserSearchInput" class="add-friend-input" placeholder="Search by username or title…"
             autocomplete="off" spellcheck="false"
             oninput="this.value=this.value.replace(/[^a-zA-Z0-9_ ]/g,'');_nuSearch(this.value);"
             onkeydown="_nuKeydown(event)">
      <button type="button" class="fused-search-btn" tabindex="-1" onclick="document.getElementById('notesUserSearchInput').focus()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <span>Search</span>
      </button>
    </div>
    <div id="notesUserFilterBanner" style="display:none;"></div>
  </div>
  <div id="nuDropdown" class="username-dropdown"></div>

  <!-- Toolbar: section label + Sort / Filter (both tabs) -->
  <div class="notes-toolbar fade-up fade-up-1" id="notesToolbar" style="display:none;"></div>

  <!-- Notes list -->
  <div id="notesPageContent" class="fade-up fade-up-2">
    <div class="page-loading"><div class="spinner"></div></div>
  </div>

</div>

<!-- Search popup -->
<div class="notes-search-overlay" id="notesSearchOverlay" onclick="if(event.target===this)closeNotesSearchPopup()">
  <div class="notes-search-card">
    <div class="notes-search-card-header">
      <div class="notes-search-card-title" id="notesSearchCardTitle">Add Note</div>
      <button class="notes-search-card-close" onclick="closeNotesSearchPopup()">&#x2715;</button>
    </div>
    <div class="notes-search-input-wrap">
      <svg class="notes-search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="notesSearchInput" class="notes-search-input" placeholder="Search your library…" autocomplete="off" oninput="_notesPageSearch(this.value)" onkeydown="_notesPageSearchKeydown(event)">
    </div>
    <div class="notes-search-results" id="notesSearchResults"></div>
  </div>
</div>

<!-- Note popup (Personal) — Community uses the same classes, built in JS -->
<div class="note-popup-overlay2" id="notePopup2" onclick="if(event.target===this)closeNotePopup2()">

      </div>

    <div class="np-stats" id="notePopup2Reactions" style="display:none;"></div>

    <!-- View mode (default) -->
    <div class="np-body" id="notePopup2ViewBody">
      <blockquote class="np-quote" id="notePopup2Text"></blockquote>
    </div>
    <div class="np-footer" id="notePopup2ViewFooter">
      <div class="np-actions" id="npViewPopupActions">
        <button class="popup-action-btn np-grow" onclick="_notePopup2EnterEditMode()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>Edit Note</button>

    <div class="np-body" id="notePopup2EditBody" style="display:none">
      <textarea class="np-textarea" id="notePopup2Textarea" placeholder="What did you think? Favorite moments, hot takes, anything…" oninput="_notePopup2UpdateWordCount()"></textarea>
      <div class="note-popup2-count np-count" id="notePopup2Count">0 / 150 words</div>
    </div>
    <div class="np-footer" id="notePopup2EditFooter" style="display:none">
      <div class="np-actions" id="npEditPopupActions">
        <button class="popup-action-btn np-grow" id="notePopup2SaveBtn" onclick="saveNotePopup2()">Save Note</button>
        <button class="popup-action-btn np-ghost" onclick="_notePopup2ExitEditMode()">Cancel</button>
      </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>

<script src="js/nav.js"></script>

<script>
function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

let _notesUser = null;
let _notesEntries = [];
let _notesActiveId = null;
let _notesMode = 'personal';
let _socialNotesRaw = [];
let _socialNotesMyReactions = {}; // entry_id -> 'like' | 'dislike'

document.addEventListener('DOMContentLoaded', () => {
  attachClearButton('notesUserSearchInput');
  initPage(async (user) => {
    if (!user) {
      document.querySelector('.page-wrap').innerHTML = `
        <div class="guest-page-state fade-up">
          <div class="guest-page-icon">${icon('notebook', 36)}</div>
          <h2 class="guest-page-title">Your Notes</h2>
          <p class="guest-page-sub">Sign in to write personal notes on anything in your library.</p>
          <div class="guest-cta">
            <a href="login.html" class="guest-btn-primary">Sign In</a>
            <a href="login.html#signup" class="guest-btn-secondary">Create Account</a>
          </div>
        </div>`;
      return;
    }
    _notesUser = user;
    await loadNotesPage();
  });
});

let _notesReactionCounts = {}; // entry_id -> { like, dislike }

async function loadNotesPage() {
  _notesEntries = await getEntries(_notesUser.id) || [];
  const withNotes = _notesEntries.filter(e => e.notes && e.notes.trim());
  if (withNotes.length) {
    const ids = withNotes.map(e => e.id);
    const { data: reactions } = await sb.from('note_reactions').select('entry_id, is_like').in('entry_id', ids);
    _notesReactionCounts = {};
    (reactions || []).forEach(r => {
      if (!_notesReactionCounts[r.entry_id]) _notesReactionCounts[r.entry_id] = { like: 0, dislike: 0 };
      if (r.is_like) _notesReactionCounts[r.entry_id].like++;
      else _notesReactionCounts[r.entry_id].dislike++;
    });
  }
  renderNotesPage();
}

function _wordCount(t) { return (t || '').trim().split(/\s+/).filter(Boolean).length; }
function _noteDate(d, withDay) {
  if (!d) return '';
  const dt = new Date(String(d).length <= 10 ? d + 'T12:00:00' : d);
  return isNaN(dt) ? '' : dt.toLocaleDateString('en-US', withDay ? { day:'numeric', month:'short', year:'numeric' } : { month:'short', year:'numeric' });
}
function _notesPoster(url, title, cls) {
  const u = safeURL(url);
  return `<div class="${cls}">${u ? `<img src="${u}" loading="lazy" alt="" data-letter="${esc((title || '?')[0])}" onerror="mssImgError(this)">` : esc((title || '?')[0].toUpperCase())}</div>`;
}
// Score exactly like the category list view: plain Bebas, olive, no pill
function _notesScorePill(v) { return v != null ? `<span class="nc-score">★ ${Number(v).toFixed(2)}</span>` : ''; }

// Badges exactly like the category ratings popup: type-label for the type,
// w-ep-badge for genres and dates
const _NB = `style="font-family:'Manrope',var(--sans);font-weight:500;"`;
function _noteTypeBadge(e) {
  const isMovie = e.cat === 'movies' || e.tmdb_type === 'movie' || e.ratings?._media_type === 'movie';
  const label = (e.cat && CAT_META[e.cat]?.label) || (isMovie ? 'Movie' : e.tmdb_type === 'tv' ? 'TV Show' : '');
  return label ? `<span class="${isMovie ? 'type-label' : 'type-label type-label-tv'}" ${_NB}>${esc(label)}</span>` : '';
}
function _noteBadges(e, { genres = 3, dateLabel = '', date = '' } = {}) {
  return _noteTypeBadge(e)
    + (e.genres || []).slice(0, genres).map(g => `<span class="w-ep-badge" ${_NB}>${esc(g)}</span>`).join('')
    + (date ? `<span class="w-ep-badge" ${_NB}>${dateLabel ? esc(dateLabel) + ' ' : ''}${esc(date)}</span>` : '');
}

/* ── Popup header: the title's TMDB backdrop (the wide landscape still),
   shown crisp. Until it loads — or when a title has none — a softly
   blurred poster fills in. Backdrops are cached for the session. */
const _npBackdropCache = {};
async function _npLoadHero(el, item) {
  if (!el) return;
  const poster = safeURL(item.poster_url);
  el.classList.remove('is-backdrop');
  el.style.backgroundImage = poster ? cssURL(item.poster_url) : 'none';
  if (!item.tmdb_id || !item.tmdb_type) return;
  const key = `${item.tmdb_type}:${item.tmdb_id}`;
  let path = _npBackdropCache[key];
  if (path === undefined) {
    try {
      const res = await tmdbFetch(`${TMDB_BASE}/${item.tmdb_type}/${item.tmdb_id}?api_key=${TMDB_KEY}&language=en-US`);
      path = res.ok ? ((await res.json()).backdrop_path || null) : null;
    } catch { path = null; }
    _npBackdropCache[key] = path;
  }
  if (!path || !el.isConnected) return;
  const url = `https://image.tmdb.org/t/p/w1280${path}`;
  const img = new Image();
  img.onload = () => { el.style.backgroundImage = cssURL(url); el.classList.add('is-backdrop'); };
  img.src = url;
}

// Section label + count left, Sort / Filter right
function _renderNotesToolbar(label, count, barHTML) {
  const el = document.getElementById('notesToolbar');
  if (!barHTML) { el.style.display = 'none'; el.innerHTML = ''; return; }
  el.style.display = '';
  el.innerHTML = `<div class="notes-toolbar-label">
      <div class="notes-toolbar-title">${esc(label)}</div>
      <div class="notes-toolbar-count"><b>${count}</b> ${count === 1 ? 'note' : 'notes'}</div>
    </div>${barHTML}`;
}

const _NOTE_LEN_PRESET = { length: { header: 'Note Length', opts: [['note_long', 'Longest'], ['note_short', 'Shortest']] } };
const _noteLenCompare = {
  note_long:  (a, b) => _wordCount(b.notes) - _wordCount(a.notes),
  note_short: (a, b) => _wordCount(a.notes) - _wordCount(b.notes),
};

/* Personal Sort & Filter (shared js/sort-filter.js) */
SF.register('notesMine', {
  base: () => _notesEntries.filter(e => e.notes && e.notes.trim()),
  render: () => renderNotesPage(),
  defaultSort: 'newest',
  presets: {
    added: { header: 'Date', opts: [['newest', 'Latest'], ['oldest', 'Earliest']] },
    ..._NOTE_LEN_PRESET,
    likes: { header: 'Likes', opts: [['likes_most', 'Most Liked'], ['likes_least', 'Least Liked']] },
  },
  sorts: () => ['added', 'alpha', 'length', 'ratings', 'likes'],
  filters: () => ['genre', 'year', 'score'],
  compare: {
    ..._noteLenCompare,
    likes_most:  (a, b) => ((_notesReactionCounts[b.id]?.like || 0) - (_notesReactionCounts[a.id]?.like || 0)),
    likes_least: (a, b) => ((_notesReactionCounts[a.id]?.like || 0) - (_notesReactionCounts[b.id]?.like || 0)),
  },
  choiceFilters: () => [{
    key: 'cat', label: 'Type',
    options: [['', 'All Types'], ['tv', 'TV Shows'], ['movies', 'Movies'], ['anime', 'Anime'], ['cartoons', 'Cartoons']],
  }],
});

/* Community Sort & Filter */
const _snScore = n => Number(n.like_count || 0) - Number(n.dislike_count || 0);
SF.register('notesSocial', {
  base: () => _socialNotesRaw || [],
  render: () => renderSocialNotes(),
  defaultSort: 'popular',
  presets: {
    popularity: { header: 'Popularity', opts: [['popular', 'Most Liked'], ['least_popular', 'Least Liked']] },
    added:      { header: 'Posted',     opts: [['newest', 'Newest'], ['oldest', 'Oldest']] },
    ..._NOTE_LEN_PRESET,
  },
  sorts: () => ['popularity', 'added', 'alpha', 'length', 'ratings'],
  filters: () => ['score'],
  scoreOf: n => n.final_score != null ? Number(n.final_score) : null,
  addedDate: n => n.created_at,
  compare: {
    ..._noteLenCompare,
    popular: (a, b) => (_snScore(b) - _snScore(a)) || (new Date(b.created_at) - new Date(a.created_at)),
    least_popular: (a, b) => (Number(b.dislike_count) - Number(a.dislike_count)) || (_snScore(a) - _snScore(b)),
  },
  choiceFilters: () => [{
    key: 'owner', label: 'Whose Notes',
    options: [['', 'Everyone'], ['others', 'Other People'], ['mine', 'Mine']],
    test: (n, v) => v === 'mine' ? n.user_id === _notesUser?.id : n.user_id !== _notesUser?.id,
  }],
});

function _trimNotes(text) {
  if (!text) return '';
  const words = text.trim().split(/\s+/);
  return words.length > 150 ? words.slice(0, 150).join(' ') + '…' : text;
}

function renderNotesPage() {
  const withNotes = _notesEntries.filter(e => e.notes && e.notes.trim());

  // Stats
  let totalWords = 0, longest = 0;
  withNotes.forEach(e => {

    totalWords += words;
    if (words > longest) longest = words;
  });
  document.getElementById('notesPageStats').innerHTML = `
    <div class="page-stat"><div class="page-stat-num">${withNotes.length}</div><div class="page-stat-label">Total Notes</div></div>
    <div class="page-stat"><div class="page-stat-num">${totalWords}</div><div class="page-stat-label">Total Words</div></div>
    <div class="page-stat"><div class="page-stat-num">${longest}</div><div class="page-stat-label">Longest Note</div></div>`;

  if (!withNotes.length) {
    document.getElementById('notesPageContent').innerHTML = `
      <div class="empty" style="padding:4rem 1rem;text-align:center;">
        <div class="empty-icon" style="opacity:.4;margin-bottom:1rem;">${icon('notebook', 44)}</div>
        <div class="empty-text" style="color:var(--text-2);margin-bottom:.5rem;">No notes yet</div>

  }

  const sorted = SF.list('notesMine', 'all');
  if (!sorted.length) { document.getElementById('notesPageContent').innerHTML = `<div class="notes-empty">No notes match these filters.</div>`; return; }
  document.getElementById('notesPageContent').innerHTML = `<div class="nc-grid">${sorted.map(e => {
    const counts = _notesReactionCounts[e.id] || { like: 0, dislike: 0 };
    const date = _noteDate(e.completed_date || e.created_at, true);
    const words = _wordCount(e.notes);
    return `<article class="nc-card" onclick="openNotePopup2(${attrJSON(e.id)})">

          </div>

/* ── Double-tap-to-like (touch screens) ── */
let _dtLastTap = {};
function _dtHandleTouch(e, key, likeFn, isAlreadyLiked) {
  const now = Date.now();
  const last = _dtLastTap[key] || 0;
  _dtLastTap[key] = now;
  if (now - last < 350 && now - last > 0) {
    _dtLastTap[key] = 0;
    if (!isAlreadyLiked()) likeFn();
    _dtShowHeart(e.currentTarget);
  }
}
function _dtShowHeart(el) {
  if (!el) return;
  const heart = document.createElement('div');
  heart.className = 'dt-heart-pop';
  heart.textContent = '♥';
  el.appendChild(heart);
  setTimeout(() => heart.remove(), 700);
}

/* ── Find notes by username — same live dropdown pattern used on friends.html ── */
let _nuTimer = null;
let _nuActive = -1;
let _nuResults = [];
let _nuScrollY = 0;
let _nuFilterUser = null; // { id, username, avatar_url }

function _nuPosition() {
  const wrap = document.getElementById('notesUserSearchWrapInner');
  const drop = document.getElementById('nuDropdown');
  if (!wrap || !drop) return;
  const r = wrap.getBoundingClientRect();
  drop.style.top = r.bottom + 'px';
  drop.style.left = r.left + 'px';
  drop.style.width = r.width + 'px';
  drop.style.position = 'fixed';
}

function _nuLockScroll() {
  _nuScrollY = window.scrollY;
  document.body.style.overflow = 'hidden';
  document.body.style.position = 'fixed';
  document.body.style.width = '100%';
  document.body.style.top = '-' + _nuScrollY + 'px';
}

function _nuUnlockScroll() {
  document.body.style.overflow = '';
  document.body.style.position = '';
  document.body.style.width = '';
  document.body.style.top = '';
  window.scrollTo(0, _nuScrollY || 0);
}

async function _nuSearch(val) {
  const q = val.trim().toLowerCase();
  const drop = document.getElementById('nuDropdown');
  clearTimeout(_nuTimer);
  _nuActive = -1;
  if (q.length < 2) {
    drop.classList.remove('open');
    document.getElementById('notesUserSearchWrapInner')?.classList.remove('dd-connected-active');
    _nuUnlockScroll();
    return;
  }
  _nuPosition();
  drop.innerHTML = '<div class="ud-loading">Searching…</div>';
  drop.classList.add('open');
  document.getElementById('notesUserSearchWrapInner')?.classList.add('dd-connected-active');
  _nuLockScroll();
  _nuTimer = setTimeout(async () => {
    try {
      const [{ data: users }, { data: entries }] = await Promise.all([
        sb.from('profiles').select('id, username, display_name, avatar_url')
          .ilike('username', q + '%').neq('id', _notesUser?.id || '').limit(6),
        sb.from('entries').select('title, poster_url')
          .ilike('title', '%' + q + '%').not('notes', 'is', null).limit(20),
      ]);

      // De-dupe titles (many users can have a note on the same title)
      const seenTitles = new Set();
      const titleMatches = [];
      for (const e of (entries || [])) {
        const key = (e.title || '').toLowerCase();
        if (!key || seenTitles.has(key)) continue;
        seenTitles.add(key);
        titleMatches.push(e);
        if (titleMatches.length >= 6) break;
      }

      _nuResults = [
        ...(users || []).map(u => ({ type: 'user', ...u })),
        ...titleMatches.map(e => ({ type: 'title', ...e })),
      ];

      if (!_nuResults.length) {
        drop.innerHTML = '<div class="ud-empty">No matches found</div>';
        return;
      }

      const reg = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      drop.innerHTML = _nuResults.map((r, i) => {
        if (r.type === 'user') {
          const initial = (r.username[0] || '?').toUpperCase();
          const avatarHTML = safeURL(r.avatar_url)
            ? '<div class="ud-avatar"><img src="'+safeURL(r.avatar_url)+'" loading="lazy"></div>'
            : '<div class="ud-avatar">' + initial + '</div>';
          const highlighted = r.username.replace(reg, '<em>$1</em>');
          const display = r.display_name && r.display_name !== r.username ? r.display_name : '';
          return '<div class="ud-item" data-i="' + i + '" onmousedown="_nuSelectResult(' + i + ')">'
            + avatarHTML
            + '<div class="ud-info"><div class="ud-username">@' + highlighted + '</div>'
            + (display ? '<div class="ud-display">' + display + '</div>' : '') + '</div>'
            + '<span class="ud-type-tag">User</span></div>';
        }
        // title
        const avatarHTML = safeURL(r.poster_url)
          ? '<div class="ud-avatar"><img src="'+safeURL(r.poster_url)+'" loading="lazy"></div>'
          : '<div class="ud-avatar">' + ((r.title || '?')[0] || '?').toUpperCase() + '</div>';
        const highlighted = esc(r.title).replace(reg, '<em>$1</em>');
        return '<div class="ud-item" data-i="' + i + '" onmousedown="_nuSelectResult(' + i + ')">'
          + avatarHTML
          + '<div class="ud-info"><div class="ud-username">' + highlighted + '</div>'
          + '<div class="ud-display">Community notes</div></div>'
          + '<span class="ud-type-tag">Title</span></div>';
      }).join('');
    } catch (e) {
      console.error('Search error:', e);
      drop.innerHTML = '<div class="ud-empty">Error searching</div>';
    }
  }, 250);
}

function _nuKeydown(e) {
  const drop = document.getElementById('nuDropdown');
  const items = drop.querySelectorAll('.ud-item');
  if (!drop.classList.contains('open') || !items.length) return;
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    _nuActive = Math.min(_nuActive + 1, items.length - 1);
    items.forEach((el, i) => el.classList.toggle('ud-active', i === _nuActive));
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    _nuActive = Math.max(_nuActive - 1, -1);
    items.forEach((el, i) => el.classList.toggle('ud-active', i === _nuActive));
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (_nuActive >= 0) _nuSelectResult(_nuActive);
  } else if (e.key === 'Escape') {
    drop.classList.remove('open'); _nuActive = -1;
    document.getElementById('notesUserSearchWrapInner')?.classList.remove('dd-connected-active');
    _nuUnlockScroll();
  }
}

document.addEventListener('click', e => {
  const dd = document.getElementById('nuDropdown');
  if (dd && dd.classList.contains('open') && !e.target.closest('#notesUserSearchWrap') && !e.target.closest('#nuDropdown')) {
    dd.classList.remove('open');
    document.getElementById('notesUserSearchWrapInner')?.classList.remove('dd-connected-active');
    _nuUnlockScroll();
    _nuActive = -1;
  }
});

function _nuSelectResult(i) {
  const r = _nuResults[i];
  if (!r) return;
  document.getElementById('notesUserSearchInput').value = r.type === 'title' ? r.title : r.username;
  document.getElementById('nuDropdown').classList.remove('open');
  document.getElementById('notesUserSearchWrapInner')?.classList.remove('dd-connected-active');
  _nuUnlockScroll();
  _nuResults = []; _nuActive = -1;

  if (r.type === 'user') {
    _nuFilterUser = { id: r.id, username: r.username, avatar_url: r.avatar_url };
    _nuLoadUserNotes();
  } else {
    _nuLoadTitleNotes(r.title);
  }
}

async function _nuLoadTitleNotes(title) {
  const wrap = document.getElementById('notesPageContent');
  wrap.innerHTML = `<div class="page-loading"><div class="spinner"></div></div>`;

  const banner = document.getElementById('notesUserFilterBanner');
  banner.style.display = 'flex';
  banner.innerHTML = `<span>Showing notes for "${esc(title)}"</span><button onclick="_nuClearFilter()">Clear</button>`;

  try {
    const { data: entries, error } = await sb.from('entries')
      .select('id, title, tmdb_id, tmdb_type, poster_url, notes, final_score, created_at, user_id')
      .ilike('title', title)
      .not('notes', 'is', null)
      .order('created_at', { ascending: false });
    if (error) throw error;

    const withNotes = (entries || []).filter(e => e.notes && e.notes.trim());
    const userIds = [...new Set(withNotes.map(e => e.user_id))];
    const { data: profiles } = userIds.length
      ? await sb.from('profiles').select('id, username, avatar_url').in('id', userIds)
      : { data: [] };
    const profileMap = {};
    (profiles || []).forEach(p => { profileMap[p.id] = p; });

    _socialNotesRaw = withNotes.map(e => {
      const p = profileMap[e.user_id] || {};
      return {
        entry_id: e.id, user_id: e.user_id, username: p.username || 'user', avatar_url: p.avatar_url || null,
        title: e.title, tmdb_id: e.tmdb_id, tmdb_type: e.tmdb_type, poster_url: e.poster_url,
        notes: e.notes, final_score: e.final_score, created_at: e.created_at,
        like_count: 0, dislike_count: 0,
      };
    });

    if (_socialNotesRaw.length) {
      const entryIds = _socialNotesRaw.map(n => n.entry_id);
      const { data: allReactions } = await sb.from('note_reactions').select('entry_id, is_like').in('entry_id', entryIds);
      const counts = {};
      (allReactions || []).forEach(r => {
        if (!counts[r.entry_id]) counts[r.entry_id] = { like: 0, dislike: 0 };
        r.is_like ? counts[r.entry_id].like++ : counts[r.entry_id].dislike++;
      });
      _socialNotesRaw.forEach(n => {
        n.like_count = counts[n.entry_id]?.like || 0;
        n.dislike_count = counts[n.entry_id]?.dislike || 0;
      });

      if (_notesUser) {
        const { data: myReactions } = await sb.from('note_reactions')
          .select('entry_id, is_like').eq('user_id', _notesUser.id).in('entry_id', entryIds);
        _socialNotesMyReactions = {};
        (myReactions || []).forEach(r => { _socialNotesMyReactions[r.entry_id] = r.is_like ? 'like' : 'dislike'; });
      }
    }

    document.getElementById('notesPageSub').textContent = `${_socialNotesRaw.length} note${_socialNotesRaw.length !== 1 ? 's' : ''} for "${title}"`;
    renderSocialNotes();
  } catch (err) {
    console.error('Load title notes error:', err);
    wrap.innerHTML = `<div class="empty" style="padding:3rem 1rem;text-align:center;color:var(--text-3);">Couldn't load notes for this title.</div>`;
  }
}

const REPLY_CONFIG = {
  note: { table: 'note_replies', reactionTable: 'note_reply_reactions', rpc: 'get_note_replies', rpcParam: 'p_entry_id', col: 'entry_id' },
  list: { table: 'list_replies', reactionTable: 'list_reply_reactions', rpc: 'get_list_replies', rpcParam: 'p_list_id', col: 'list_id' },
};

let _replyKind = null;
let _replyTargetId = null;
let _replyRaw = [];
let _replySort = 'popular';
let _replyMyReactions = {};

function _injectReplyPopupOverlay() {
  if (document.getElementById('replyPopupOverlay')) return;
  const el = document.createElement('div');
  el.id = 'replyPopupOverlay';
  el.style.cssText = 'position:fixed;inset:0;z-index:920;background:rgba(0,0,0,0.75);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:24px;';

      <div style="padding:1.5rem 1.5rem 1rem;flex-shrink:0;">

          <div style="font-family:var(--serif);font-size:20px;font-weight:400;">Replies</div>

        </div>

        <div style="display:flex;gap:6px;margin-bottom:.75rem;">
          <button class="sort-btn active" data-sort="popular" onclick="_replySetSort('popular')">Popular</button>
          <button class="sort-btn" data-sort="latest" onclick="_replySetSort('latest')">Latest</button>

      </div>
      <div id="replyList" style="flex:1;overflow-y:auto;padding:0 1.5rem;"></div>
      <div id="replyComposer" style="padding:1rem 1.5rem 1.5rem;flex-shrink:0;border-top:0.5px solid var(--border);margin-top:.5rem;">
        <textarea id="replyInput" class="field-input" maxlength="1000" placeholder="Add a reply…" style="width:100%;min-height:60px;resize:vertical;box-sizing:border-box;margin-bottom:8px;"></textarea>

      </div>

  el.addEventListener('click', e => { if (e.target === el) closeReplyPopup(); });

async function openReplyPopup(kind, targetId, title) {
  _replyKind = kind;
  _replyTargetId = targetId;
  _injectReplyPopupOverlay();
  document.getElementById('replyPopupSubtitle').textContent = title ? `On "${title}"` : '';
  document.getElementById('replyList').innerHTML = '<div class="td-notes-loading">Loading replies…</div>';
  const composer = document.getElementById('replyComposer');
  composer.style.display = (typeof _notesUser !== 'undefined' && _notesUser) || (typeof _listsUser !== 'undefined' && _listsUser) ? '' : 'none';

  const ov = document.getElementById('replyPopupOverlay');
  ov.style.display = 'flex';
  document.body.style.overflow = 'hidden';

  await _replyLoad();
}

function closeReplyPopup() {
  const ov = document.getElementById('replyPopupOverlay');
  if (ov) ov.style.display = 'none';
  document.body.style.overflow = '';
  _replyKind = null;
  _replyTargetId = null;
}

function _replySetSort(mode) {
  _replySort = mode;
  document.querySelectorAll('#replyPopupCard .sort-btn').forEach(b => b.classList.toggle('active', b.dataset.sort === mode));
  _replyRenderList();
}

function _currentUserForReplies() {
  return (typeof _notesUser !== 'undefined' && _notesUser) || (typeof _listsUser !== 'undefined' && _listsUser) || null;
}

async function _replyLoad() {
  const cfg = REPLY_CONFIG[_replyKind];
  const listEl = document.getElementById('replyList');
  try {
    const params = {}; params[cfg.rpcParam] = _replyTargetId;
    const { data, error } = await sb.rpc(cfg.rpc, params);
    if (error) throw error;
    _replyRaw = data || [];

    const user = _currentUserForReplies();
    if (user && _replyRaw.length) {
      const replyIds = _replyRaw.map(r => r.id);
      const { data: myReactions } = await sb.from(cfg.reactionTable)
        .select('reply_id, is_like').eq('user_id', user.id).in('reply_id', replyIds);
      _replyMyReactions = {};
      (myReactions || []).forEach(r => { _replyMyReactions[r.reply_id] = r.is_like ? 'like' : 'dislike'; });
    } else {
      _replyMyReactions = {};
    }
    _replyRenderList();
  } catch (err) {
    console.error('Load replies error:', err);
    listEl.innerHTML = '<div class="td-notes-empty">Couldn\'t load replies right now.</div>';
  }
}

function _replyRenderList() {
  const listEl = document.getElementById('replyList');
  if (!_replyRaw.length) {
    listEl.innerHTML = '<div class="td-notes-empty">No replies yet — be the first to say something.</div>';
    return;
  }
  const sorted = [..._replyRaw].sort((a, b) => {
    if (_replySort === 'latest') return new Date(b.created_at) - new Date(a.created_at);
    const scoreA = Number(a.like_count) - Number(a.dislike_count);
    const scoreB = Number(b.like_count) - Number(b.dislike_count);
    if (scoreB !== scoreA) return scoreB - scoreA;
    return new Date(b.created_at) - new Date(a.created_at);
  });
  listEl.innerHTML = sorted.map(r => {
    const myReaction = _replyMyReactions[r.id];
    const initial = (r.username || '?')[0].toUpperCase();
    const dateStr = r.created_at ? new Date(r.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '';
    return `<div style="display:flex;gap:12px;padding:14px 0;border-bottom:0.5px solid var(--border);">
      <div class="snote-avatar">${r.avatar_url ? `<img src="${esc(r.avatar_url)}" loading="lazy">` : esc(initial)}</div>
      <div style="flex:1;min-width:0;">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
          <span class="snote-username">@${esc(r.username || 'user')}</span>
          <span class="note-date">${dateStr}</span>
        </div>
        <div style="font-size:13.5px;line-height:1.6;color:var(--text-2);white-space:pre-line;margin-bottom:8px;">${esc(r.content)}</div>
        <div style="display:flex;gap:14px;">
          <button class="snote-react-btn ${myReaction === 'like' ? 'active-like' : ''}" onclick="_replyReact('${r.id}', true)">
            ${icon(myReaction === 'like' ? 'thumbsUpFilled' : 'thumbsUp', 13)} <span>${r.like_count || 0}</span>
          </button>
          <button class="snote-react-btn ${myReaction === 'dislike' ? 'active-dislike' : ''}" onclick="_replyReact('${r.id}', false)">
            ${icon(myReaction === 'dislike' ? 'thumbsDownFilled' : 'thumbsDown', 13)} <span>${r.dislike_count || 0}</span>
          </button>
        </div>
      </div>
    </div>`;
  }).join('');
}

async function _replyReact(replyId, isLike) {
  const user = _currentUserForReplies();
  if (!user) { showToast('Sign in to react to replies.', 'err'); return; }
  const cfg = REPLY_CONFIG[_replyKind];
  const r = _replyRaw.find(x => x.id === replyId);
  if (!r) return;
  const current = _replyMyReactions[replyId];
  const wantsSame = (current === 'like' && isLike) || (current === 'dislike' && !isLike);

  // Optimistic: update + render immediately, roll back on failure.
  const prevReaction = current;
  const prevLike = r.like_count;
  const prevDislike = r.dislike_count;

  if (wantsSame) {
    delete _replyMyReactions[replyId];
    if (current === 'like') r.like_count = Math.max(0, Number(r.like_count) - 1);
    else r.dislike_count = Math.max(0, Number(r.dislike_count) - 1);
  } else {
    if (current === 'like') r.like_count = Math.max(0, Number(r.like_count) - 1);
    if (current === 'dislike') r.dislike_count = Math.max(0, Number(r.dislike_count) - 1);
    if (isLike) r.like_count = Number(r.like_count) + 1;
    else r.dislike_count = Number(r.dislike_count) + 1;
    _replyMyReactions[replyId] = isLike ? 'like' : 'dislike';
  }
  _replyRenderList();

  try {
    if (wantsSame) {
      const { error } = await sb.from(cfg.reactionTable).delete().eq('reply_id', replyId).eq('user_id', user.id);
      if (error) throw error;
    } else {
      const { error } = await sb.from(cfg.reactionTable)
        .upsert({ reply_id: replyId, user_id: user.id, is_like: isLike }, { onConflict: 'reply_id,user_id' });
      if (error) throw error;
    }
  } catch (err) {
    console.error('React to reply error:', err);
    if (prevReaction) _replyMyReactions[replyId] = prevReaction; else delete _replyMyReactions[replyId];
    r.like_count = prevLike;
    r.dislike_count = prevDislike;
    _replyRenderList();
    showToast(isRateLimitError(err) ? RATE_LIMIT_MESSAGE : 'Failed to save your reaction.', 'err');
  }
}

async function _replySubmit() {
  const user = _currentUserForReplies();
  if (!user) { showToast('Sign in to reply.', 'err'); return; }
  const input = document.getElementById('replyInput');
  const content = input.value.trim();
  if (!content) return;
  const cfg = REPLY_CONFIG[_replyKind];
  try {
    const row = { user_id: user.id, content };
    row[cfg.col] = _replyTargetId;
    const { error } = await sb.from(cfg.table).insert(row);
    if (error) throw error;
    input.value = '';
    await _replyLoad();
  } catch (err) {
    console.error('Post reply error:', err);
    showToast(isRateLimitError(err) ? RATE_LIMIT_MESSAGE : 'Failed to post reply.', 'err');
  }
}


async function reactToSocialNote(entryId, isLike) {
  if (!_notesUser) { showToast('Sign in to react to notes.', 'err'); return; }
  const note = _socialNotesRaw.find(n => n.entry_id === entryId);
  if (!note) return;
  const current = _socialNotesMyReactions[entryId];
  const wantsSame = (current === 'like' && isLike) || (current === 'dislike' && !isLike);

  const prevReaction = current;
  const prevLike = note.like_count;
  const prevDislike = note.dislike_count;

  if (wantsSame) {
    delete _socialNotesMyReactions[entryId];
    if (current === 'like') note.like_count = Math.max(0, Number(note.like_count) - 1);
    else note.dislike_count = Math.max(0, Number(note.dislike_count) - 1);
  } else {
    if (current === 'like') note.like_count = Math.max(0, Number(note.like_count) - 1);
    if (current === 'dislike') note.dislike_count = Math.max(0, Number(note.dislike_count) - 1);
    if (isLike) note.like_count = Number(note.like_count) + 1;
    else note.dislike_count = Number(note.dislike_count) + 1;
    _socialNotesMyReactions[entryId] = isLike ? 'like' : 'dislike';
  }
  renderSocialNotes();

  try {
    if (wantsSame) {
      const { error } = await sb.from('note_reactions').delete().eq('entry_id', entryId).eq('user_id', _notesUser.id);
      if (error) throw error;
    } else {
      const { error } = await sb.from('note_reactions')
        .upsert({ entry_id: entryId, user_id: _notesUser.id, is_like: isLike }, { onConflict: 'entry_id,user_id' });
      if (error) throw error;
    }
  } catch (err) {
    console.error('React to note error:', err);
    if (prevReaction) _socialNotesMyReactions[entryId] = prevReaction; else delete _socialNotesMyReactions[entryId];
    note.like_count = prevLike;
    note.dislike_count = prevDislike;
    renderSocialNotes();
    showToast(isRateLimitError(err) ? RATE_LIMIT_MESSAGE : 'Failed to save your reaction.', 'err');
  }
}

/* ── Search (client-side, filters the already-loaded library) ── */
let _notesSearchResultsList = [];

function _notesPageSearch(query) {
  const resultsEl = document.getElementById('notesSearchResults');
  const q = query.trim().toLowerCase();
  _notesActiveId = -1;

  // Notes only make sense for things you've actually watched some of —
  // exclude Watchlist (not started) and Taking a Break (paused mid-way).
  // Applies to both Add and Edit modes.
  let pool = _notesEntries.filter(e => e.status === 'watching' || e.status === 'ongoing' || e.status === 'completed');
  if (_notesSearchMode === 'edit') pool = pool.filter(e => e.notes && e.notes.trim());

  if (!q) {
    // No query yet — for Edit mode, show existing notes to browse; for Add
    // mode, wait for a search term rather than dumping the whole library.
    if (_notesSearchMode === 'edit' && pool.length) {
      _notesSearchResultsList = pool.slice(0, 20);
      _renderNotesSearchResults();
    } else {
      resultsEl.innerHTML = '';
      _notesSearchResultsList = [];
    }
    return;
  }

  _notesSearchResultsList = pool.filter(e => e.title && e.title.toLowerCase().includes(q)).slice(0, 20);

  if (!_notesSearchResultsList.length) {
    resultsEl.innerHTML = `<div class="notes-search-empty">No matches${_notesSearchMode === 'edit' ? ' among your notes' : ' in your library'}.</div>`;
    return;
  }
  _renderNotesSearchResults();
}

function _renderNotesSearchResults() {
  const resultsEl = document.getElementById('notesSearchResults');
  resultsEl.innerHTML = _notesSearchResultsList.map((e, i) => {
    const hasNote = e.notes && e.notes.trim();
    const posterEl = safeURL(e.poster_url)
      ? `<img src="${safeURL(e.poster_url)}" loading="lazy">`
      : esc((e.title||'?')[0].toUpperCase());
    return `<div class="notes-search-item" data-i="${i}" onclick="_notesPageSearchPick(${i})">
      <div class="notes-search-item-poster">${posterEl}</div>
      <div class="notes-search-item-info">
        <div class="notes-search-item-title">${esc(e.title)}</div>
        <div class="notes-search-item-meta">${CAT_META[e.cat]?.label || ''}${e.year ? ' · ' + e.year : ''}</div>
      </div>
      ${hasNote ? `<span class="notes-search-item-has-note">Has Note</span>` : ''}
    </div>`;
  }).join('');
}

function _notesPageSearchKeydown(e) {
  if (!_notesSearchResultsList.length) return;
  const items = document.querySelectorAll('#notesSearchResults .notes-search-item');
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    _notesActiveId = Math.min(_notesActiveId + 1, items.length - 1);
    items.forEach((el, i) => el.classList.toggle('active', i === _notesActiveId));
    items[_notesActiveId]?.scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    _notesActiveId = Math.max(_notesActiveId - 1, 0);
    items.forEach((el, i) => el.classList.toggle('active', i === _notesActiveId));
    items[_notesActiveId]?.scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (_notesActiveId >= 0) _notesPageSearchPick(_notesActiveId);
    else if (_notesSearchResultsList.length === 1) _notesPageSearchPick(0);
  } else if (e.key === 'Escape') {
    closeNotesSearchPopup();
  }
}

function _notesPageSearchPick(i) {
  const e = _notesSearchResultsList[i];
  if (!e) return;
  closeNotesSearchPopup();
  openNotePopup2(e.id);
}

/* ── Note popup — editable ── */
function openNotePopup2(id) {
  const e = _notesEntries.find(en => en.id === id);
  if (!e) return;
  _notesActiveId = null;
  window._notesCurrentEntryId = id;

  const date = e.completed_date ? new Date(e.completed_date+'T12:00:00').toLocaleDateString('en-US',{day:'numeric',month:'short',year:'numeric'}) : '';
  const hasPoster = !!safeURL(e.poster_url);
  _npLoadHero(document.getElementById('notePopup2Blur'), e);
  document.getElementById('notePopup2Poster').innerHTML = hasPoster ? `<img src="${safeURL(e.poster_url)}" loading="lazy">` : esc((e.title[0]||'?').toUpperCase());
  document.getElementById('notePopup2Title').textContent = e.title;
  document.getElementById('notePopup2Score').innerHTML = _notesScorePill(liveScore(e));
  document.getElementById('notePopup2Tags').innerHTML = _noteBadges(e, { genres: 3, dateLabel: 'Completed On:', date });

  const counts = _notesReactionCounts[id] || { like: 0, dislike: 0 };
  const words = _wordCount(e.notes);
  const stats = document.getElementById('notePopup2Reactions');
  stats.innerHTML = `<span>${icon('thumbsUp', 14)} <b>${counts.like}</b></span><span>${icon('thumbsDown', 14)} <b>${counts.dislike}</b></span><span><b>${words}</b> ${words === 1 ? 'word' : 'words'}</span>`;
  stats.style.display = (e.notes && e.notes.trim()) ? 'flex' : 'none';

  document.getElementById('notePopup2').classList.add('open');
  document.body.style.overflow = 'hidden';

  // Existing note — open in read-only view, matching how it's shown on
  // profile.html; editing requires an explicit tap on "Edit Note" instead
  // of dropping straight into an editable field. A brand-new note has
  // nothing to view, so that case goes straight to edit mode.
  if (e.notes && e.notes.trim()) {
    document.getElementById('notePopup2Text').innerHTML = '&ldquo;' + esc(_trimNotes(e.notes)) + '&rdquo;';
    _notePopup2ShowView();
  } else {
    _notePopup2ShowEdit();
  }
}

function _notePopup2ShowView() {
  document.getElementById('notePopup2ViewBody').style.display = '';
  document.getElementById('notePopup2ViewFooter').style.display = '';
  document.getElementById('notePopup2EditBody').style.display = 'none';
  document.getElementById('notePopup2EditFooter').style.display = 'none';
}

function _notePopup2ShowEdit() {
  const e = _notesEntries.find(en => en.id === window._notesCurrentEntryId);
  const textarea = document.getElementById('notePopup2Textarea');
  textarea.value = e?.notes || '';
  _notePopup2UpdateWordCount();
  _notePopup2GuardWordLimit();

  document.getElementById('notePopup2ViewBody').style.display = 'none';
  document.getElementById('notePopup2ViewFooter').style.display = 'none';
  document.getElementById('notePopup2EditBody').style.display = '';
  document.getElementById('notePopup2EditFooter').style.display = '';
  setTimeout(() => textarea.focus(), 100);
}

function _notePopup2EnterEditMode() { _notePopup2ShowEdit(); }

function _notePopup2ExitEditMode() {
  const e = _notesEntries.find(en => en.id === window._notesCurrentEntryId);
  // A brand-new note has nothing to go "back" to view — cancelling just
  // closes the popup entirely instead of showing an empty view state.
  if (!e || !e.notes || !e.notes.trim()) { closeNotePopup2(); return; }
  document.getElementById('notePopup2Text').innerHTML = '&ldquo;' + esc(_trimNotes(e.notes)) + '&rdquo;';
  _notePopup2ShowView();
}

function closeNotePopup2() {
  document.getElementById('notePopup2').classList.remove('open');
  document.body.style.overflow = '';
  window._notesCurrentEntryId = null;
}

async function saveNotePopup2() {
  const id = window._notesCurrentEntryId;
  if (!id) return;
  const notes = document.getElementById('notePopup2Textarea').value.trim();
  const btn = document.getElementById('notePopup2SaveBtn');
  const origLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Saving…';
  try {
    const { error } = await sb.from('entries').update({ notes }).eq('id', id).eq('user_id', _notesUser.id);
    if (error) throw error;
    const entry = _notesEntries.find(en => en.id === id);
    if (entry) entry.notes = notes;
    closeNotePopup2();
    renderNotesPage();
    showToast('Note saved!');
  } catch (err) {
    console.error('saveNotePopup2:', err);
    showToast('Error saving note.', 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = origLabel;
  }
}

/* 150-word cap, matching detail.html's Personal Notes field — blocks
   further typing at the limit instead of silently trimming after the
   fact, with a clear message when you hit it. */
function _notePopup2UpdateWordCount() {
  const el = document.getElementById('notePopup2Textarea');
  const countEl = document.getElementById('notePopup2Count');
  if (!el || !countEl) return;
  const words = el.value.trim().split(/\s+/).filter(Boolean);
  if (words.length > 150) {
    el.value = words.slice(0, 150).join(' ');
    countEl.textContent = 'Reached max word limit (150/150 words)';
    countEl.classList.add('over');
    return;
  }
  const count = words.length;
  countEl.textContent = `${count} / 150 words`;
  countEl.classList.toggle('over', count >= 150);
}
function _notePopup2GuardWordLimit() {
  const el = document.getElementById('notePopup2Textarea');
  if (!el || el.dataset.wordLimitGuarded) return;
  el.dataset.wordLimitGuarded = '1';
  el.addEventListener('beforeinput', e => {
    if (e.inputType && e.inputType.startsWith('delete')) return;
    if (el.selectionStart !== el.selectionEnd) return;
    const count = el.value.trim() ? el.value.trim().split(/\s+/).length : 0;
    if (count >= 150) {
      e.preventDefault();
      const countEl = document.getElementById('notePopup2Count');
      if (countEl) { countEl.textContent = 'Reached max word limit (150/150 words)'; countEl.classList.add('over'); }
    }
  });
}

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (document.getElementById('notePopup2')?.classList.contains('open')) { closeNotePopup2(); return; }
  if (document.getElementById('notesSearchOverlay')?.classList.contains('open')) { closeNotesSearchPopup(); return; }
});
</script>
